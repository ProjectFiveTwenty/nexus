lecules and ions."},{"s":"cholesterol-fluidity","t":"steroid-hormones","type":"prerequisite","why":"Cholesterol's four-ring steroid nucleus is the precursor of all steroid hormones, such as cortisol, aldosterone, estrogen and testosterone."},{"s":"simple-diffusion","t":"membranes","type":"part-of","why":"Simple diffusion is the passive, protein-free route across the membrane."},{"s":"simple-diffusion","t":"facilitated-diffusion","type":"contrasts","why":"Simple diffusion rises linearly with the gradient, while carrier-mediated facilitated diffusion saturates once every transporter is occupied."},{"s":"simple-diffusion","t":"uncouplers","type":"applies-to","why":"Lipophilic weak acids such as 2,4-dinitrophenol diffuse across the inner mitochondrial membrane carrying H⁺, dissipating the proton gradient without making ATP."},{"s":"simple-diffusion","t":"steroid-hormones","type":"explains","why":"Lipid-soluble steroid hormones diffuse straight through the plasma membrane to bind intracellular receptors that act as transcription factors."},{"s":"simple-diffusion","t":"gas-exchange","type":"applies-to","why":"O₂ and CO₂ cross alveolar and capillary walls by simple diffusion, so exchange scales with partial-pressure gradient and area and falls with barrier thickness (Fick's law)."},{"s":"facilitated-diffusion","t":"membranes","type":"part-of","why":"Facilitated diffusion is protein-mediated passive transport across the membrane."},{"s":"facilitated-diffusion","t":"resting-potential","type":"explains","why":"K⁺ leak channels let K⁺ flow out down its gradient, pulling the resting potential close to the K⁺ equilibrium potential."},{"s":"facilitated-diffusion","t":"action-potential","type":"explains","why":"Voltage-gated Na⁺ and then K⁺ channels open so ions rush passively down their gradients, producing depolarization and then repolarization."},{"s":"active-transport","t":"membranes","type":"part-of","why":"Primary active transport is the ATP-driven route that moves solutes against their gradients."},{"s":"active-transport","t":"facilitated-diffusion","type":"contrasts","why":"Both use saturable membrane proteins, but primary pumps hydrolyze ATP to move solutes uphill, while facilitated diffusion only moves them downhill."},{"s":"active-transport","t":"secondary-active-transport","type":"prerequisite","why":"Primary pumps build the ion gradients that secondary transporters spend, so secondary transport depends on them."},{"s":"active-transport","t":"ip3-calcium","type":"affects","why":"SERCA and plasma-membrane Ca²⁺ ATPases pump Ca²⁺ out of the cytosol, ending IP₃-triggered calcium signals and refilling ER stores."},{"s":"active-transport","t":"stomach","type":"applies-to","why":"Parietal-cell H⁺/K⁺ ATPase pumps H⁺ into the gastric lumen against roughly a million-fold gradient, producing HCl; proton-pump inhibitors block it."},{"s":"na-k-atpase","t":"active-transport","type":"part-of","why":"The Na⁺/K⁺ ATPase is the classic P-type primary active pump."},{"s":"na-k-atpase","t":"resting-potential","type":"affects","why":"By keeping K⁺ high inside and Na⁺ high outside, the pump maintains the gradients that leak channels convert into the negative resting potential."},{"s":"na-k-atpase","t":"cardiac-output","type":"affects","why":"Digoxin inhibits the pump, raising cardiac Na⁺ so the Na⁺/Ca²⁺ exchanger removes less Ca²⁺, strengthening contraction and stroke volume."},{"s":"na-k-atpase","t":"reabsorption-secretion","type":"explains","why":"Basolateral Na⁺/K⁺ ATPase keeps tubule-cell Na⁺ low, so Na⁺ flows in across the apical membrane and powers most nephron reabsorption."},{"s":"na-k-atpase","t":"osmosis","type":"affects","why":"By pumping out 3 Na⁺ for 2 K⁺, the pump keeps Na⁺ effectively impermeant outside, balancing trapped intracellular anions; blocking it lets Na⁺ and water enter and cells swell."},{"s":"secondary-active-transport","t":"monosaccharides","type":"applies-to","why":"Enterocytes take up glucose and galactose through SGLT1, which uses the Na⁺ gradient to move them uphill, while fructose enters by facilitated diffusion via GLUT5."},{"s":"secondary-active-transport","t":"membranes","type":"part-of","why":"Secondary active transport is gradient-coupled uphill transport across membranes."},{"s":"secondary-active-transport","t":"nt-clearance","type":"applies-to","why":"Reuptake transporters for serotonin, dopamine and norepinephrine are Na⁺-coupled symporters, the targets blocked by SSRIs and cocaine."},{"s":"secondary-active-transport","t":"reabsorption-secretion","type":"applies-to","why":"Proximal tubule Na⁺-glucose symporters reclaim filtered glucose; when filtered load exceeds their transport maximum, as in uncontrolled diabetes, glucose appears in urine."},{"s":"secondary-active-transport","t":"small-intestine","type":"applies-to","why":"SGLT1 on the enterocyte apical membrane uses the Na⁺ gradient to pull glucose and galactose in against their concentration gradients."},{"s":"organelles","t":"gluconeogenesis","type":"affects","why":"Gluconeogenesis spans compartments: pyruvate carboxylase works in mitochondria, most steps in the cytosol, and glucose-6-phosphatase in the ER."},{"s":"organelles","t":"lipid-metabolism","type":"affects","why":"Compartments separate opposing pathways: fatty acid synthesis runs in the cytosol while β-oxidation runs in mitochondria, avoiding a futile cycle."},{"s":"rough-er","t":"disulfide-bond","type":"affects","why":"The ER lumen is oxidizing and contains protein disulfide isomerase, so disulfides form there and are common in secreted proteins, whereas the reducing cytosol disfavors them."},{"s":"rough-er","t":"organelles","type":"part-of","why":"The rough ER is the ribosome-studded part of the endoplasmic reticulum."},{"s":"rough-er","t":"golgi","type":"prerequisite","why":"Proteins made in the rough ER leave in transport vesicles for the cis-Golgi, where they are further modified and sorted."},{"s":"rough-er","t":"peptide-hormones","type":"prerequisite","why":"Peptide hormones such as insulin are made on rough ER as preprohormones, losing their signal peptide before Golgi processing and packaging."},{"s":"smooth-er","t":"organelles","type":"part-of","why":"The smooth ER is the ribosome-free part of the endoplasmic reticulum."},{"s":"smooth-er","t":"steroid-hormones","type":"prerequisite","why":"Steroidogenic cells of the adrenal cortex and gonads are rich in smooth ER, whose enzymes (with mitochondrial steps) convert cholesterol into steroid hormones."},{"s":"smooth-er","t":"ip3-calcium","type":"prerequisite","why":"The ER, including smooth ER and its muscle form the sarcoplasmic reticulum, is the main intracellular Ca²⁺ store; IP₃ opens receptor channels in its membrane to release Ca²⁺."},{"s":"smooth-er","t":"liver-gallbladder","type":"explains","why":"Hepatocyte smooth ER holds cytochrome P450 enzymes that oxidize drugs and toxins, making them easier to conjugate and excrete."},{"s":"golgi","t":"organelles","type":"part-of","why":"The Golgi apparatus is the sorting and modifying center of the endomembrane system."},{"s":"golgi","t":"lysosomes","type":"prerequisite","why":"Golgi enzymes tag lysosomal hydrolases with mannose-6-phosphate, which receptors recognize to route them to lysosomes; failed tagging causes I-cell disease."},{"s":"golgi","t":"glycosylation","type":"affects","why":"The Golgi trims and extends N-linked glycans begun in the ER and adds O-linked sugars to serine and threonine."},{"s":"golgi","t":"peptide-hormones","type":"explains","why":"The trans-Golgi packages prohormones into secretory granules where proteases cleave them, such as proinsulin into insulin and C-peptide, for regulated release."},{"s":"lysosomes","t":"sphingolipids","type":"affects","why":"Lysosomal hydrolases degrade sphingolipids step by step; missing hexosaminidase A in Tay–Sachs lets GM2 ganglioside accumulate in neurons."},{"s":"lysosomes","t":"organelles","type":"part-of","why":"Lysosomes are the cell's acidic digestive organelles."},{"s":"lysosomes","t":"peroxisomes","type":"contrasts","why":"Both are small degradative organelles, but lysosomes digest macromolecules with acid hydrolases while peroxisomes run oxidations that make and destroy H₂O₂."},{"s":"lysosomes","t":"phagocytes","type":"explains","why":"Macrophages and neutrophils fuse phagosomes with lysosomes, whose acid hydrolases help destroy ingested microbes."},{"s":"lysosomes","t":"mhc","type":"explains","why":"Endocytosed antigens are cut into peptides in acidic endolysosomes and loaded onto MHC II for display to helper T cells."},{"s":"peroxisomes","t":"organelles","type":"part-of","why":"Peroxisomes are oxidative organelles of eukaryotic cells."},{"s":"peroxisomes","t":"beta-oxidation","type":"affects","why":"Peroxisomes shorten very-long-chain fatty acids before mitochondria finish β-oxidation, so peroxisomal defects let these fatty acids accumulate."},{"s":"peroxisomes","t":"myelination","type":"affects","why":"Peroxisomes make plasmalogens, ether phospholipids abundant in myelin, and break down very-long-chain fatty acids; peroxisomal disorders such as adrenoleukodystrophy cause demyelination."},{"s":"mitochondria","t":"organelles","type":"part-of","why":"Mitochondria are the double-membrane energy organelles of eukaryotic cells."},{"s":"mitochondria","t":"pdh-complex","type":"prerequisite","why":"Pyruvate made in the cytosol is carried into the mitochondrial matrix, where PDH converts it to acetyl-CoA and links glycolysis to the TCA cycle."},{"s":"mitochondria","t":"oxphos","type":"prerequisite","why":"Oxidative phosphorylation requires the mitochondrion's sealed inner membrane, which holds the electron transport chain and ATP synthase."},{"s":"mitochondria","t":"parkinsons","type":"affects","why":"MPP⁺ (formed from the drug contaminant MPTP) blocks complex I and selectively kills substantia nigra dopaminergic neurons, causing parkinsonism; mitochondrial dysfunction is implicated in Parkinson's disease."},{"s":"mito-compartments","t":"mitochondria","type":"part-of","why":"The outer membrane, intermembrane space, inner membrane and matrix are the compartments of the mitochondrion."},{"s":"mito-compartments","t":"proton-gradient","type":"explains","why":"The ion-tight inner membrane lets complexes I, III and IV pump H⁺ into the intermembrane space and hold it there as a proton-motive force."},{"s":"mito-compartments","t":"atp-synthase","type":"prerequisite","why":"ATP synthase spans the inner membrane with F₀ in the membrane and F₁ facing the matrix, so ATP is made on the matrix side as H⁺ flows back in."},{"s":"mito-compartments","t":"po-ratio","type":"affects","why":"Cytosolic NADH cannot cross the inner membrane; its electrons yield about 1.5 ATP per NADH via the glycerol-3-phosphate shuttle versus about 2.5 via the malate–aspartate shuttle."},{"s":"mito-compartments","t":"carnitine-shuttle","type":"explains","why":"The inner membrane is impermeable to acyl-CoA, so long-chain fatty acids must cross as acylcarnitine via the carnitine shuttle."},{"s":"cytoskeleton","t":"organelles","type":"affects","why":"Cytoskeletal tracks and motors position organelles and carry vesicles between the ER, Golgi and plasma membrane."},{"s":"cytoskeleton","t":"cell-cycle","type":"prerequisite","why":"Cell division runs on cytoskeletal machines: the microtubule spindle separates chromosomes and an actomyosin ring splits the cytoplasm."},{"s":"cytoskeleton","t":"nervous-system","type":"affects","why":"Neurons depend on the cytoskeleton: microtubules carry cargo along long axons, neurofilaments set axon caliber, and actin shapes growth cones and synapses."},{"s":"microfilaments","t":"cytoskeleton","type":"part-of","why":"Actin microfilaments are the thinnest cytoskeletal filaments."},{"s":"microfilaments","t":"microtubules","type":"contrasts","why":"Actin filaments are thin, ATP-binding myosin tracks for contraction and cell shape; microtubules are thick, GTP-binding tubulin tubes for kinesin/dynein transport and the spindle."},{"s":"microfilaments","t":"small-intestine","type":"explains","why":"Bundled actin filaments form the core of each microvillus, greatly multiplying the absorptive surface of intestinal epithelial cells."},{"s":"microfilaments","t":"phagocytes","type":"explains","why":"Actin polymerization pushes out pseudopods, driving neutrophil chemotaxis and letting macrophages engulf microbes."},{"s":"cytokinesis","t":"microfilaments","type":"part-of","why":"Animal-cell cytokinesis is carried out by an actin–myosin contractile ring."},{"s":"cytokinesis","t":"mitosis","type":"contrasts","why":"Mitosis divides the nucleus while cytokinesis divides the cytoplasm; they overlap in time but are separate processes that can be uncoupled."},{"s":"cytokinesis","t":"oogenesis","type":"affects","why":"Highly unequal cytokinesis in female meiosis gives nearly all cytoplasm to the oocyte, while the polar bodies receive discarded chromosome sets."},{"s":"cytokinesis","t":"cleavage-implantation","type":"prerequisite","why":"Cleavage divisions are rapid mitoses with cytokinesis but little growth, so blastomeres get smaller while the embryo's overall size stays about the same."},{"s":"microtubules","t":"cytoskeleton","type":"part-of","why":"Microtubules are the largest-diameter cytoskeletal filaments."},{"s":"microtubules","t":"mitosis","type":"affects","why":"Drugs that disrupt microtubule dynamics, such as colchicine, vinca alkaloids and taxol, arrest cells in mitosis, the basis of several cancer chemotherapies."},{"s":"microtubules","t":"alzheimers","type":"prerequisite","why":"Tau normally stabilizes axonal microtubules; in Alzheimer's disease hyperphosphorylated tau detaches and forms neurofibrillary tangles, disrupting transport."},{"s":"motor-proteins","t":"microtubules","type":"part-of","why":"Kinesin and dynein are the motor proteins that move along microtubules."},{"s":"motor-proteins","t":"synapses","type":"affects","why":"Kinesin carries synaptic vesicle components and mitochondria anterogradely to the axon terminal, and dynein returns material to the cell body."},{"s":"motor-proteins","t":"airway-anatomy","type":"affects","why":"Axonemal dynein drives the beating of airway cilia that sweep mucus upward, so dynein defects impair clearance and cause recurrent lung infections."},{"s":"motor-proteins","t":"fertilization","type":"affects","why":"Sperm reach the egg using a dynein-powered flagellum, so axonemal dynein defects cause immotile sperm and male infertility."},{"s":"mitotic-spindle","t":"microtubules","type":"part-of","why":"The mitotic spindle is a specialized microtubule array."},{"s":"mitotic-spindle","t":"checkpoints","type":"affects","why":"Kinetochores not yet attached to spindle microtubules emit a wait signal that holds the cell in metaphase until all are attached."},{"s":"mitotic-spindle","t":"mitosis","type":"explains","why":"Spindle microtubules capture kinetochores, align chromosomes at the metaphase plate, and pull sister chromatids apart in anaphase."},{"s":"mitotic-spindle","t":"nondisjunction","type":"explains","why":"Faulty spindle attachment or premature loss of cohesion can send both chromatids or both homologs to one pole, creating aneuploid cells."},{"s":"intermediate-filaments","t":"collagen","type":"contrasts","why":"Both resist tension as rope-like fibers, but keratin intermediate filaments are intracellular α-helical coiled coils, while collagen is an extracellular triple helix."},{"s":"intermediate-filaments","t":"cytoskeleton","type":"part-of","why":"Intermediate filaments are the tension-bearing class of cytoskeletal filament."},{"s":"intermediate-filaments","t":"microfilaments","type":"contrasts","why":"Unlike polar, rapidly remodeled actin, intermediate filaments are nonpolar, stable ropes with no motor proteins, built for tensile strength rather than movement."},{"s":"cell-cycle","t":"replication","type":"prerequisite","why":"DNA replication is confined to S phase, and origin licensing ensures the genome is copied exactly once per cycle."},{"s":"cell-cycle","t":"clonal-selection","type":"prerequisite","why":"Clonal expansion after antigen selection is repeated mitosis of one lymphocyte, producing many cells with the same antigen receptor."},{"s":"cell-cycle","t":"reproductive-system","type":"prerequisite","why":"Reproduction and development are built on the cell cycle: meiosis produces gametes and rapid mitoses drive cleavage and embryonic growth."},{"s":"interphase","t":"cell-cycle","type":"part-of","why":"Interphase (G1, S, G2) is the growth and DNA-synthesis portion of the cell cycle."},{"s":"interphase","t":"mitosis","type":"contrasts","why":"Interphase chromatin is decondensed and actively transcribed, whereas mitotic chromosomes are tightly condensed and transcription largely stops."},{"s":"interphase","t":"meiosis","type":"prerequisite","why":"DNA is replicated once in the S phase before meiosis I, so a diploid cell enters meiosis with doubled DNA content and paired chromatids."},{"s":"checkpoints","t":"cell-cycle","type":"part-of","why":"Checkpoints are the quality-control gates of the cell cycle."},{"s":"checkpoints","t":"cyclins-cdks","type":"affects","why":"Checkpoint signals act by inhibiting cyclin–CDK activity; for example, p53 induces p21, which blocks G1/S CDKs."},{"s":"checkpoints","t":"mutations","type":"affects","why":"When checkpoint genes such as p53 are lost, damaged cells keep dividing, so mutations accumulate quickly, a hallmark of cancer progression."},{"s":"checkpoints","t":"dna-repair","type":"affects","why":"Damage-triggered arrest at G1/S or G2/M gives repair pathways time to fix lesions before they are copied or passed to daughter cells."},{"s":"cyclins-cdks","t":"intermediate-filaments","type":"affects","why":"Mitotic cyclin B–CDK1 phosphorylates nuclear lamins, disassembling the lamina so the nuclear envelope can break down in prometaphase."},{"s":"cyclins-cdks","t":"cell-cycle","type":"part-of","why":"Cyclin–CDK complexes are the engine that drives cell cycle transitions."},{"s":"cyclins-cdks","t":"transcription-factors","type":"affects","why":"G1/S cyclin–CDKs phosphorylate Rb, releasing the transcription factor E2F to switch on genes needed for DNA replication."},{"s":"cyclins-cdks","t":"oogenesis","type":"affects","why":"Primary oocytes stay arrested in prophase I until the LH surge triggers activation of maturation-promoting factor (cyclin B–CDK1), so meiosis I resumes shortly before ovulation."},{"s":"mitosis","t":"cell-cycle","type":"part-of","why":"Mitosis is the nuclear-division (M) phase of the cell cycle."},{"s":"mitosis","t":"meiosis","type":"contrasts","why":"Mitosis preserves ploidy and makes identical cells; meiosis pairs homologs, crosses them over, and halves ploidy to make varied gametes."},{"s":"mitosis","t":"spermatogenesis","type":"prerequisite","why":"Spermatogonia renew themselves by mitosis throughout adult life, while some daughters become primary spermatocytes that enter meiosis."},{"s":"meiosis","t":"cell-cycle","type":"part-of","why":"Meiosis is the specialized two-division cycle that produces gametes."},{"s":"meiosis","t":"spermatogenesis","type":"prerequisite","why":"Each primary spermatocyte completes both meiotic divisions to yield four haploid spermatids that mature into sperm."},{"s":"meiosis","t":"oogenesis","type":"prerequisite","why":"Oocytes arrest in prophase I from fetal life, finish meiosis I just before ovulation, and complete meiosis II only if fertilized."},{"s":"meiosis","t":"genes-behavior","type":"prerequisite","why":"Each parent passes a random half of their genome through meiosis, so siblings and fraternal twins share on average half their segregating alleles, the baseline twin studies compare against."},{"s":"crossing-over","t":"meiosis","type":"part-of","why":"Crossing over is a key event of prophase I of meiosis."},{"s":"crossing-over","t":"nondisjunction","type":"affects","why":"Chiasmata hold homologs together until anaphase I; homolog pairs that fail to cross over are more likely to missegregate."},{"s":"nondisjunction","t":"meiosis","type":"part-of","why":"Nondisjunction is a chromosome segregation error, most consequential during meiosis."},{"s":"nondisjunction","t":"point-mutations","type":"contrasts","why":"Nondisjunction changes chromosome number (aneuploidy) without altering any DNA sequence, whereas point mutations alter single bases within a gene."},{"s":"nondisjunction","t":"alzheimers","type":"affects","why":"Trisomy 21 adds a third copy of the APP gene on chromosome 21, so people with Down syndrome develop Alzheimer's pathology unusually early."},{"s":"dna-structure","t":"alpha-helix","type":"contrasts","why":"Both are right-handed helices, but DNA is held by base pairing and stacking between two strands, while an α-helix uses backbone C=O···H–N bonds within one chain."},{"s":"dna-structure","t":"gel-electrophoresis","type":"applies-to","why":"Every nucleotide carries one negative phosphate, so DNA has a uniform charge-to-mass ratio and fragments separate toward the anode by size alone, shorter ones moving faster."},{"s":"dna-structure","t":"replication","type":"prerequisite","why":"Antiparallel strands plus a 5′→3′-only polymerase are the reason one new strand is continuous and the other discontinuous."},{"s":"dna-structure","t":"transcription","type":"prerequisite","why":"RNA polymerase reads one strand of the helix as a template, so strand polarity and complementarity must be understood first."},{"s":"dna-structure","t":"dna-repair","type":"prerequisite","why":"Single-strand repair works because the undamaged complementary strand still specifies which base belongs at the damaged site."},{"s":"base-pairing","t":"dna-structure","type":"part-of","why":"Base pairs hold the two strands together and set the helix's constant inner width."},{"s":"base-pairing","t":"dna-melting","type":"explains","why":"GC-rich DNA melts at a higher temperature because G–C pairs have three hydrogen bonds and stack more strongly than A–T pairs."},{"s":"base-pairing","t":"genetic-code","type":"explains","why":"Wobble pairing at the codon's third base lets one tRNA read several synonymous codons, so cells need fewer tRNA types than the 61 sense codons."},{"s":"base-pairing","t":"mirna-rnai","type":"applies-to","why":"MicroRNAs find their target mRNAs by complementary base pairing; near-perfect pairing triggers cleavage, partial pairing mainly blocks translation."},{"s":"base-pairing","t":"point-mutations","type":"explains","why":"A base in a rare tautomeric form pairs with the wrong partner (enol G with T), so a mispair during replication becomes a transition mutation."},{"s":"base-pairing","t":"mismatch-repair","type":"explains","why":"A non-complementary pair such as G–T fits poorly in the helix, and that distortion is what mismatch repair proteins detect."},{"s":"dna-melting","t":"thermal-denaturation","type":"contrasts","why":"Melted DNA strands re-anneal on cooling because sequence complementarity guides them back, whereas heat-denatured proteins often aggregate and stay unfolded."},{"s":"dna-melting","t":"dna-structure","type":"part-of","why":"Melting measures how strongly the noncovalent forces of the helix hold the two strands together."},{"s":"dna-melting","t":"promoters","type":"applies-to","why":"Strands separate most easily where A–T pairs dominate, so AT-rich promoter elements such as the TATA box ease helix opening for RNA polymerase."},{"s":"histones","t":"dna-structure","type":"part-of","why":"Histone octamers organize the double helix into nucleosomes, the first level of chromatin packing."},{"s":"histones","t":"chromatin-remodeling","type":"prerequisite","why":"Remodeling complexes slide, evict or modify nucleosomes, so nucleosome structure comes first."},{"s":"histones","t":"histone-acetylation","type":"prerequisite","why":"Acetylation works by neutralizing the Lys positive charges that let histones grip DNA, so their charge-based binding must be understood first."},{"s":"replication","t":"mitosis","type":"prerequisite","why":"Each chromosome must be copied into two sister chromatids during S phase before mitosis can pull one copy into each daughter cell."},{"s":"replication","t":"transcription","type":"contrasts","why":"Both build nucleic acid 5′→3′ on a template, but replication copies the whole genome once per cycle with primers and proofreading, while transcription copies single genes repeatedly without primers."},{"s":"replication","t":"mutations","type":"affects","why":"Polymerase errors that escape proofreading and mismatch repair are copied into both daughter cells as permanent mutations."},{"s":"leading-lagging","t":"replication","type":"part-of","why":"Leading and lagging strands describe how the two template strands are copied at each fork."},{"s":"leading-lagging","t":"telomerase","type":"explains","why":"Removing the last RNA primer of the lagging strand leaves an unfillable gap at the chromosome end, the end-replication problem telomerase solves."},{"s":"leading-lagging","t":"transcription","type":"contrasts","why":"Replication copies both antiparallel strands at a moving fork, forcing one discontinuous strand; transcription copies only one template strand, so RNA is made continuously."},{"s":"okazaki-fragments","t":"leading-lagging","type":"part-of","why":"Okazaki fragments are the discontinuous pieces from which the lagging strand is built."},{"s":"okazaki-fragments","t":"mismatch-repair","type":"affects","why":"In eukaryotes, nicks between not-yet-joined Okazaki fragments are thought to help mark the new strand, so mismatch repair corrects the newly made base."},{"s":"dna-polymerases","t":"replication","type":"part-of","why":"DNA polymerases are the enzymes that synthesize the new DNA strands."},{"s":"dna-polymerases","t":"leading-lagging","type":"explains","why":"Polymerase adds only to a free 3′-OH, so the strand whose synthesis must run away from the fork is made backward in short pieces."},{"s":"dna-polymerases","t":"okazaki-fragments","type":"affects","why":"Pol III extends each fragment; pol I then removes its RNA primer with 5′→3′ exonuclease activity and fills the gap with DNA."},{"s":"dna-polymerases","t":"mismatch-repair","type":"contrasts","why":"Polymerase proofreading removes a wrong base during synthesis using 3′→5′ exonuclease activity, whereas mismatch repair fixes errors that slip past, after synthesis."},{"s":"primase","t":"replication","type":"part-of","why":"Primase starts every new DNA chain at the fork."},{"s":"primase","t":"okazaki-fragments","type":"prerequisite","why":"Every Okazaki fragment begins at its own RNA primer, so primase acts repeatedly on the lagging strand."},{"s":"primase","t":"dna-polymerases","type":"prerequisite","why":"DNA polymerase cannot begin a chain, so primase must first lay down an RNA primer with a free 3′-OH."},{"s":"helicase","t":"dna-melting","type":"contrasts","why":"Helicase separates strands locally at body temperature by spending ATP, whereas melting separates whole duplexes using heat."},{"s":"helicase","t":"replication","type":"part-of","why":"Helicase opens the double helix to form the replication fork."},{"s":"helicase","t":"topoisomerase","type":"explains","why":"Unwinding at the fork overwinds the DNA ahead into positive supercoils, which is why topoisomerase must work in front of helicase."},{"s":"topoisomerase","t":"mitosis","type":"affects","why":"Type II topoisomerase untangles interlinked sister chromatids after replication so they can separate in anaphase."},{"s":"topoisomerase","t":"replication","type":"part-of","why":"Topoisomerases relieve the torsional strain that unwinding creates during replication."},{"s":"topoisomerase","t":"transcription","type":"affects","why":"RNA polymerase also overwinds DNA ahead of itself, so topoisomerases must relieve supercoils for transcription to continue."},{"s":"telomerase","t":"checkpoints","type":"affects","why":"Without telomerase, telomeres shorten until they resemble DNA breaks and trigger p53-dependent arrest (senescence), capping how many times somatic cells can divide."},{"s":"telomerase","t":"replication","type":"part-of","why":"Telomerase handles the end-replication problem of linear chromosomes."},{"s":"telomerase","t":"dna-polymerases","type":"contrasts","why":"Telomerase copies its own RNA template into DNA (reverse transcription), whereas ordinary DNA polymerases copy a DNA template."},{"s":"transcription","t":"translation","type":"prerequisite","why":"An mRNA must be transcribed (and in eukaryotes processed and exported) before ribosomes can translate it."},{"s":"transcription","t":"gene-regulation","type":"prerequisite","why":"Most gene control acts on transcription initiation, so promoters, polymerases and transcription factors must be understood first."},{"s":"rna-polymerases","t":"dna-polymerases","type":"contrasts","why":"RNA polymerases need no primer and proofread much less than replicative DNA polymerases, so transcription errors are far more frequent, though they are not inherited."},{"s":"rna-polymerases","t":"transcription","type":"part-of","why":"RNA polymerases are the enzymes that carry out transcription."},{"s":"rna-polymerases","t":"rna-processing","type":"affects","why":"Capping, splicing and polyadenylation enzymes ride on Pol II's phosphorylated C-terminal domain, which is why mRNAs are processed during transcription."},{"s":"promoters","t":"transcription","type":"part-of","why":"Promoters are where transcription begins."},{"s":"promoters","t":"rna-polymerases","type":"affects","why":"Promoter elements position RNA polymerase at the start site and set which strand is used as the template."},{"s":"promoters","t":"enhancers-silencers","type":"contrasts","why":"Promoters sit at a fixed position next to the start site and are needed for basal transcription, whereas enhancers and silencers tune it from a distance in either orientation."},{"s":"enhancers-silencers","t":"transcription","type":"part-of","why":"Enhancers and silencers are DNA elements that adjust the rate of transcription."},{"s":"enhancers-silencers","t":"chromatin-remodeling","type":"affects","why":"Activators bound at enhancers recruit histone acetyltransferases and remodeling complexes that open chromatin around nearby promoters."},{"s":"enhancers-silencers","t":"steroid-hormones","type":"explains","why":"Hormone–receptor complexes bind hormone response elements, enhancer- or silencer-type DNA sites, so one hormone can switch a whole set of target genes on or off."},{"s":"rna-processing","t":"transcription","type":"part-of","why":"RNA processing converts the primary transcript into mature mRNA."},{"s":"rna-processing","t":"translation","type":"affects","why":"Only capped, polyadenylated and spliced mRNAs are exported efficiently and recruit ribosomes well in eukaryotes."},{"s":"rna-processing","t":"trp-operon","type":"contrasts","why":"Eukaryotic mRNA must be processed and exported before translation, so the transcription–translation coupling that trp attenuation relies on cannot happen."},{"s":"five-prime-cap","t":"rna-processing","type":"part-of","why":"Capping is the first modification made to pre-mRNA."},{"s":"five-prime-cap","t":"translation-steps","type":"affects","why":"Initiation factor eIF4E binds the cap, letting the small ribosomal subunit load and scan to the first AUG."},{"s":"polyadenylation","t":"rna-polymerases","type":"contrasts","why":"Poly(A) polymerase adds adenines to the 3′ end without any template, whereas RNA polymerases read a DNA template to choose each nucleotide."},{"s":"polyadenylation","t":"rna-processing","type":"part-of","why":"Polyadenylation finishes the 3′ end of pre-mRNA."},{"s":"polyadenylation","t":"gene-regulation","type":"affects","why":"Poly-A tail shortening triggers mRNA decay, so tail length helps set how long a transcript lasts and how much protein it yields."},{"s":"splicing","t":"primary","type":"affects","why":"Including or skipping exons changes which amino acid stretches appear, so isoforms from one gene differ in primary structure."},{"s":"splicing","t":"rna-processing","type":"part-of","why":"Splicing removes introns from pre-mRNA."},{"s":"splicing","t":"antibodies","type":"affects","why":"Alternative splicing of heavy-chain transcripts lets one B cell make membrane-bound or secreted antibody and display IgM and IgD together."},{"s":"translation","t":"peptide-bond","type":"affects","why":"The large subunit's rRNA peptidyl transferase catalyzes peptide bond formation between the P-site chain and the A-site amino acid."},{"s":"translation","t":"primary","type":"explains","why":"The ribosome adds residues in the order the codons dictate, which fixes the protein's primary sequence."},{"s":"translation","t":"folding","type":"prerequisite","why":"Proteins start folding as the chain emerges from the ribosome, often with chaperones binding the nascent polypeptide."},{"s":"translation","t":"learning-memory","type":"affects","why":"Converting short-term into long-term memory requires new protein synthesis; blocking translation prevents consolidation in animal studies."},{"s":"genetic-code","t":"translation","type":"part-of","why":"The genetic code is the dictionary the ribosome uses during translation."},{"s":"genetic-code","t":"point-mutations","type":"prerequisite","why":"Deciding whether a substitution is silent, missense or nonsense requires reading the changed codon in the codon table."},{"s":"genetic-code","t":"frameshift","type":"prerequisite","why":"Frameshifts are disruptive because codons are read as consecutive non-overlapping triplets with no punctuation between them."},{"s":"ribosome","t":"enzymes","type":"contrasts","why":"The ribosome's catalytic site is rRNA, showing that biological catalysts need not be proteins, unlike most enzymes."},{"s":"ribosome","t":"rough-er","type":"explains","why":"Ribosomes translating an N-terminal signal sequence are docked onto the ER by the signal recognition particle, giving rough ER its studded look."},{"s":"ribosome","t":"translation","type":"part-of","why":"The ribosome is the machine that carries out translation."},{"s":"ribosome","t":"translation-steps","type":"prerequisite","why":"Elongation is described as tRNAs moving through the A, P and E sites, so the sites must be known first."},{"s":"trna-charging","t":"peptide-bond","type":"explains","why":"The high-energy aminoacyl ester formed during charging supplies the energy for peptide bond formation on the ribosome."},{"s":"trna-charging","t":"translation","type":"part-of","why":"Charging supplies the aminoacyl-tRNAs that translation consumes."},{"s":"trna-charging","t":"genetic-code","type":"affects","why":"The ribosome checks only codon–anticodon pairing, so the synthetase's choice of amino acid is what actually implements the code."},{"s":"translation-steps","t":"translation","type":"part-of","why":"Initiation, elongation and termination are the stages of translation."},{"s":"translation-steps","t":"ptm","type":"prerequisite","why":"Modifications act on the chain that translation produces; some, such as signal peptide removal and N-glycosylation, start while elongation is still underway."},{"s":"ptm","t":"collagen","type":"affects","why":"Prolyl and lysyl hydroxylation, which requires vitamin C, lets collagen form a stable triple helix; deficiency causes scurvy."},{"s":"ptm","t":"phosphorylation","type":"applies-to","why":"Reversible phosphorylation by kinases is the most common modification used to switch enzymes on or off."},{"s":"ptm","t":"zymogens","type":"applies-to","why":"Zymogens such as trypsinogen become active only after proteolytic cleavage, one kind of post-translational modification."},{"s":"ptm","t":"translation","type":"part-of","why":"Post-translational modifications finish proteins after translation."},{"s":"ptm","t":"peptide-hormones","type":"affects","why":"Peptide hormones are made as inactive preprohormones and need signal peptide removal and cleavage, e.g., proinsulin → insulin + C-peptide."},{"s":"ptm","t":"clotting","type":"affects","why":"Vitamin K–dependent γ-carboxylation of Glu lets factors II, VII, IX and X bind Ca²⁺ and work in the cascade."},{"s":"glycosylation","t":"folding","type":"affects","why":"N-linked glycans recruit ER lectin chaperones such as calnexin, which help glycoproteins fold and hold back misfolded ones."},{"s":"glycosylation","t":"lysosomes","type":"affects","why":"A mannose-6-phosphate tag added in the Golgi routes acid hydrolases to lysosomes; losing it sends the enzymes out of the cell."},{"s":"glycosylation","t":"ptm","type":"part-of","why":"Glycosylation is a post-translational modification."},{"s":"lipidation","t":"membranes","type":"affects","why":"Lipid anchors tether otherwise soluble proteins to the bilayer without any transmembrane segment."},{"s":"lipidation","t":"ptm","type":"part-of","why":"Lipidation is a post-translational modification."},{"s":"lipidation","t":"second-messengers","type":"affects","why":"Lipid anchors on Gα and Gγ subunits hold heterotrimeric G proteins at the plasma membrane, next to receptors and adenylyl cyclase, so cAMP signaling can occur."},{"s":"gene-regulation","t":"covalent-modification","type":"contrasts","why":"Changing gene expression alters how much enzyme exists over hours, whereas phosphorylation or allosteric control changes existing enzyme activity in seconds to minutes."},{"s":"gene-regulation","t":"gluconeogenesis","type":"affects","why":"Glucagon and cortisol raise transcription of gluconeogenic enzymes such as PEPCK, a slow, long-term layer of control."},{"s":"gene-regulation","t":"gastrulation","type":"explains","why":"Embryonic cells share one genome, but inductive signals switch on different transcription factor programs, giving distinct germ layers."},{"s":"gene-regulation","t":"ltp","type":"affects","why":"Late-phase LTP requires CREB-driven transcription of new proteins that strengthen synapses for hours to days."},{"s":"lac-operon","t":"gene-regulation","type":"part-of","why":"The lac operon is the model of inducible gene regulation in bacteria."},{"s":"lac-operon","t":"trp-operon","type":"contrasts","why":"lac is inducible (its substrate inactivates the repressor), whereas trp is repressible (its end product activates the repressor)."},{"s":"lac-operon","t":"camp","type":"contrasts","why":"In E. coli, cAMP signals low glucose and binds the transcription activator CAP directly, whereas in animal cells cAMP mainly activates protein kinase A."},{"s":"trp-operon","t":"gene-regulation","type":"part-of","why":"The trp operon is the model of repressible gene regulation in bacteria."},{"s":"chromatin-remodeling","t":"gene-regulation","type":"part-of","why":"Chromatin remodeling controls which genes are physically accessible."},{"s":"chromatin-remodeling","t":"transcription-factors","type":"affects","why":"Transcription factors can only bind sites that remodeling has freed from tightly packed nucleosomes."},{"s":"chromatin-remodeling","t":"mutations","type":"contrasts","why":"Epigenetic chromatin changes alter which genes are expressed and can persist through cell divisions without changing DNA sequence, whereas mutations change the sequence itself."},{"s":"histone-acetylation","t":"promoters","type":"affects","why":"Acetylated, loosened nucleosomes let TFIID and RNA polymerase II reach promoter sequences."},{"s":"histone-acetylation","t":"chromatin-remodeling","type":"part-of","why":"Histone acetylation is a key chromatin-opening modification."},{"s":"histone-acetylation","t":"dna-methylation","type":"contrasts","why":"Histone acetylation opens chromatin and activates genes, while promoter CpG methylation compacts chromatin and silences them."},{"s":"dna-methylation","t":"chromatin-remodeling","type":"part-of","why":"DNA methylation is an epigenetic mark that drives chromatin condensation."},{"s":"dna-methylation","t":"mismatch-repair","type":"explains","why":"In E. coli, new GATC sites are methylated only after a delay, so the unmethylated strand is recognized as new and its mismatched base is replaced."},{"s":"dna-methylation","t":"genes-behavior","type":"affects","why":"DNA methylation is one route by which experience may change gene expression, and so behavior, without altering DNA sequence; animal studies of early-life care support this."},{"s":"transcription-factors","t":"enhancers-silencers","type":"prerequisite","why":"Enhancers and silencers do nothing alone; their effects come from the activator and repressor proteins that bind them."},{"s":"transcription-factors","t":"gene-regulation","type":"part-of","why":"Transcription factors are the proteins that carry out most transcriptional regulation."},{"s":"transcription-factors","t":"amine-hormones","type":"explains","why":"Thyroid hormones, though amino acid–derived, enter cells and bind nuclear receptors that act as transcription factors, so their effects are slow and long-lasting."},{"s":"mirna-rnai","t":"translation","type":"affects","why":"miRNA-loaded RISC blocks translation of target mRNAs and speeds their decay, lowering protein output."},{"s":"mirna-rnai","t":"gene-regulation","type":"part-of","why":"MicroRNAs regulate genes after transcription."},{"s":"mirna-rnai","t":"dna-methylation","type":"contrasts","why":"RNA interference silences genes after transcription by targeting mRNA, while DNA methylation blocks transcription itself."},{"s":"mutations","t":"protein-structure","type":"affects","why":"Higher-order structure follows from the amino acid sequence, so mutations that change it can alter folding, stability and function."},{"s":"point-mutations","t":"alpha-helix","type":"affects","why":"A missense change that puts Pro inside an α-helix breaks it, because Pro's ring restricts rotation and its nitrogen has no H to donate."},{"s":"point-mutations","t":"mutations","type":"part-of","why":"Point mutations are single-base substitutions."},{"s":"point-mutations","t":"frameshift","type":"contrasts","why":"A substitution alters at most one codon, while an insertion or deletion not divisible by three alters every downstream codon."},{"s":"frameshift","t":"primary","type":"affects","why":"Every residue after the shift is changed and the chain usually ends early, so the primary structure is scrambled downstream."},{"s":"frameshift","t":"translation-steps","type":"affects","why":"The shifted frame usually hits a stop codon early, so release factors end translation prematurely and a truncated protein results."},{"s":"frameshift","t":"mutations","type":"part-of","why":"Frameshifts are insertions or deletions that shift the reading frame."},{"s":"sickle-cell","t":"point-mutations","type":"part-of","why":"Sickle cell disease comes from one base substitution (GAG→GTG) in β-globin, a classic missense point mutation replacing Glu with Val."},{"s":"sickle-cell","t":"hemoglobin","type":"affects","why":"Deoxygenated HbS polymerizes into fibers, lowering red cell deformability and lifespan and causing anemia."},{"s":"sickle-cell","t":"poiseuille","type":"affects","why":"Rigid sickled cells raise blood viscosity and plug capillaries; since flow scales with r⁴/η, small occlusions cut flow sharply."},{"s":"dna-repair","t":"cell-cycle","type":"affects","why":"Unrepaired damage activates p53-dependent checkpoints that pause the cycle for repair or trigger apoptosis."},{"s":"dna-repair","t":"replication","type":"affects","why":"Lesions left unrepaired stall replication forks or are miscopied, so repair before and during S phase protects the copied genome."},{"s":"dna-repair","t":"mutations","type":"affects","why":"Repair corrects most damage before replication can make it permanent, so defective repair raises mutation rates and cancer risk."},{"s":"ner","t":"point-mutations","type":"affects","why":"Removing UV-induced pyrimidine dimers before replication prevents the C→T substitutions typical of skin cancers."},{"s":"ner","t":"dna-repair","type":"part-of","why":"NER is the repair pathway for bulky lesions."},{"s":"ner","t":"ber","type":"contrasts","why":"NER cuts out a stretch of nucleotides around a helix-distorting lesion, while BER removes a single damaged base that barely distorts the helix."},{"s":"ber","t":"dna-structure","type":"explains","why":"A standard explanation for DNA using thymine: cytosine deamination yields uracil, so any uracil in DNA can be recognized as damage and removed by a glycosylase."},{"s":"ber","t":"dna-repair","type":"part-of","why":"BER is the repair pathway for small single-base damage."},{"s":"ber","t":"mismatch-repair","type":"contrasts","why":"BER recognizes a chemically damaged base, while mismatch repair fixes a normal base placed opposite the wrong partner."},{"s":"mismatch-repair","t":"point-mutations","type":"affects","why":"Correcting base mispairs right after replication keeps them from being copied into permanent base substitutions in the next round."},{"s":"mismatch-repair","t":"frameshift","type":"affects","why":"Without mismatch repair, slippage at repeated sequences goes unfixed and frameshifts accumulate (microsatellite instability)."},{"s":"mismatch-repair","t":"dna-repair","type":"part-of","why":"Mismatch repair corrects replication errors."},{"s":"homologous-recombination","t":"crossing-over","type":"explains","why":"Meiotic crossing over uses related strand invasion and exchange machinery, here acting between homologous chromosomes instead of sister chromatids."},{"s":"homologous-recombination","t":"dna-repair","type":"part-of","why":"Homologous recombination is an accurate double-strand break repair pathway."},{"s":"homologous-recombination","t":"nhej","type":"contrasts","why":"HR copies a sister chromatid and is accurate but limited to S and G2; NHEJ joins ends directly at any phase but often loses bases."},{"s":"nhej","t":"frameshift","type":"affects","why":"Small insertions or deletions left at NHEJ joints shift the reading frame when they fall in coding DNA and are not a multiple of three."},{"s":"nhej","t":"dna-repair","type":"part-of","why":"NHEJ is the template-free double-strand break repair pathway."},{"s":"nhej","t":"antibodies","type":"applies-to","why":"V(D)J recombination joins antibody gene segments with NHEJ enzymes, and the imprecise joints add diversity to antigen-binding sites."},{"s":"atp","t":"na-k-atpase","type":"applies-to","why":"The pump couples hydrolysis of one ATP to moving 3 Na⁺ out and 2 K⁺ in, both against their gradients."},{"s":"atp","t":"motor-proteins","type":"applies-to","why":"Kinesin and dynein couple each ATP hydrolysis cycle to a conformational step along a microtubule."},{"s":"atp","t":"trna-charging","type":"applies-to","why":"Aminoacyl-tRNA synthetases split ATP to AMP + PPi, and PPi hydrolysis pulls amino acid attachment forward, costing two high-energy bonds."},{"s":"atp","t":"hexokinase","type":"applies-to","why":"Phosphorylating glucose with free phosphate is unfavorable; transferring ATP's phosphate instead makes the hexokinase reaction strongly exergonic."},{"s":"atp","t":"camp","type":"prerequisite","why":"Adenylyl cyclase cyclizes ATP into cAMP, releasing pyrophosphate, so the second messenger is built from ATP itself."},{"s":"acetyl-coa","t":"steroids","type":"prerequisite","why":"Cholesterol is assembled entirely from acetyl-CoA through HMG-CoA and mevalonate, with HMG-CoA reductase as the rate-limiting, statin-inhibited step."},{"s":"acetyl-coa","t":"histone-acetylation","type":"prerequisite","why":"Histone acetyltransferases use acetyl-CoA as the acetyl donor when they acetylate histone lysines, neutralizing their positive charge and loosening chromatin."},{"s":"acetyl-coa","t":"tca-cycle","type":"prerequisite","why":"Acetyl-CoA's two carbons enter the cycle when citrate synthase condenses them with oxaloacetate to form citrate."},{"s":"acetyl-coa","t":"bypass-reactions","type":"affects","why":"Acetyl-CoA from fatty acid oxidation allosterically activates pyruvate carboxylase, directing pyruvate toward oxaloacetate and gluconeogenesis during fasting."},{"s":"acetyl-coa","t":"ketogenesis","type":"prerequisite","why":"When hepatic acetyl-CoA exceeds what oxaloacetate can absorb, it is condensed via HMG-CoA into acetoacetate."},{"s":"acetyl-coa","t":"neurotransmitters","type":"prerequisite","why":"Choline acetyltransferase transfers acetyl-CoA's acetyl group to choline to make acetylcholine in cholinergic nerve terminals."},{"s":"nucleotide-synthesis","t":"dna-structure","type":"prerequisite","why":"The purine and pyrimidine nucleotides made here supply the A, G, C and T whose complementary pairing builds the double helix."},{"s":"nucleotide-synthesis","t":"replication","type":"affects","why":"Replication depends on dNTP supply from ribonucleotide reductase and thymidylate synthase; drugs blocking folate recycling (methotrexate) halt DNA synthesis in dividing cells."},{"s":"glycolysis","t":"pdh-complex","type":"prerequisite","why":"Glycolysis produces the pyruvate that PDH oxidizes to acetyl-CoA when oxygen is available."},{"s":"glycolysis","t":"gluconeogenesis","type":"contrasts","why":"Gluconeogenesis shares seven reversible steps with glycolysis but must replace its three irreversible ones with different enzymes, so it is not a simple reversal."},{"s":"glycolysis","t":"hemoglobin","type":"affects","why":"Red cells divert 1,3-bisphosphoglycerate into 2,3-BPG, which binds deoxyhemoglobin, lowers its O₂ affinity and shifts the curve right."},{"s":"glycolysis","t":"ph-homeostasis","type":"affects","why":"When oxygen is short, glycolysis ends in lactate, and lactate accumulates together with H⁺ (lactic acidosis), lowering blood pH."},{"s":"glycolysis-phases","t":"glycolysis","type":"part-of","why":"Glycolysis's ten steps divide into an ATP-spending half and an ATP-producing half."},{"s":"glycolysis-phases","t":"electron-carriers","type":"affects","why":"The payoff phase's glyceraldehyde-3-phosphate dehydrogenase step reduces NAD⁺ to NADH, which must be reoxidized for glycolysis to continue."},{"s":"glycolysis-phases","t":"atp-synthase","type":"contrasts","why":"Payoff-phase ATP comes from substrate-level phosphorylation, directly transferring phosphate from 1,3-BPG and PEP, not from a proton gradient driving ATP synthase."},{"s":"hexokinase","t":"facilitated-diffusion","type":"affects","why":"Phosphorylation traps glucose and keeps free intracellular glucose low, preserving the gradient that drives GLUT-mediated facilitated diffusion inward."},{"s":"hexokinase","t":"glycolysis","type":"part-of","why":"Hexokinase catalyzes glycolysis's first irreversible step, glucose to glucose-6-phosphate."},{"s":"hexokinase","t":"ppp","type":"prerequisite","why":"Glucose-6-phosphate made by hexokinase is the substrate G6P dehydrogenase uses to start the pentose phosphate pathway."},{"s":"hexokinase","t":"insulin-glucagon","type":"affects","why":"In pancreatic β-cells, high-Km glucokinase makes glucose metabolism, and hence ATP-triggered insulin release, track blood glucose concentration."},{"s":"hexokinase","t":"liver-gallbladder","type":"affects","why":"Because glucokinase has a high Km, the liver takes up glucose mainly when portal glucose is high after meals, leaving it for the brain during fasting."},{"s":"pfk1","t":"glycolysis","type":"part-of","why":"PFK-1 catalyzes glycolysis's committed, rate-limiting third step."},{"s":"pfk1","t":"hexokinase","type":"affects","why":"When PFK-1 is inhibited, fructose-6-phosphate and glucose-6-phosphate build up, and G6P then inhibits hexokinase."},{"s":"pfk1","t":"pyruvate-kinase","type":"affects","why":"Fructose-1,6-bisphosphate made by PFK-1 feed-forward activates pyruvate kinase, coordinating glycolysis's two downstream control points."},{"s":"f26bp","t":"pfk1","type":"part-of","why":"F2,6BP is PFK-1's most potent allosteric activator and the main hormonal handle on it."},{"s":"f26bp","t":"bypass-reactions","type":"affects","why":"F2,6BP inhibits fructose-1,6-bisphosphatase, so low F2,6BP in fasting releases gluconeogenesis's rate-limiting bypass enzyme."},{"s":"f26bp","t":"reciprocal-regulation","type":"explains","why":"By activating PFK-1 while inhibiting fructose-1,6-bisphosphatase, one molecule flips the liver between glycolysis and gluconeogenesis."},{"s":"f26bp","t":"insulin-glucagon","type":"explains","why":"Insulin raises hepatic F2,6BP to favor glycolysis, while glucagon via cAMP and PKA lowers it to favor gluconeogenesis, explaining their opposite effects on liver glucose output."},{"s":"pyruvate-kinase","t":"glycolysis","type":"part-of","why":"Pyruvate kinase catalyzes glycolysis's final irreversible, ATP-producing step."},{"s":"pyruvate-kinase","t":"gluconeogenesis","type":"affects","why":"Glucagon-driven inactivation of liver pyruvate kinase stops newly made PEP from being recycled to pyruvate, preventing a futile cycle during gluconeogenesis."},{"s":"pyruvate-kinase","t":"bypass-reactions","type":"contrasts","why":"Reversing pyruvate kinase's step takes two enzymes, pyruvate carboxylase and PEPCK, spending one ATP and one GTP per PEP."},{"s":"pdh-complex","t":"tca-cycle","type":"prerequisite","why":"PDH supplies the acetyl-CoA that enters the cycle, linking cytosolic glycolysis to mitochondrial oxidation."},{"s":"pdh-complex","t":"gluconeogenesis","type":"affects","why":"Because PDH is irreversible, acetyl-CoA cannot be turned back into pyruvate, one reason even-chain fatty acids cannot supply net glucose."},{"s":"pdh-complex","t":"fa-synthesis","type":"affects","why":"In the fed state, insulin-activated PDH supplies acetyl-CoA that leaves mitochondria as citrate for fatty acid synthesis."},{"s":"pdh-complex","t":"ph-homeostasis","type":"affects","why":"When PDH is deficient or lacks thiamine, pyruvate accumulates and is reduced to lactate, causing lactic acidosis."},{"s":"tca-cycle","t":"oxphos","type":"prerequisite","why":"The cycle's NADH and FADH₂ deliver the electrons that the electron transport chain passes to O₂."},{"s":"tca-cycle","t":"gluconeogenesis","type":"prerequisite","why":"Amino acid skeletons that enter as cycle intermediates run forward to oxaloacetate, which leaves the mitochondrion (as malate) and becomes PEP for gluconeogenesis."},{"s":"tca-cycle","t":"bohr-effect","type":"affects","why":"CO₂ released by PDH and cycle decarboxylations raises tissue PCO₂ and lowers pH, so hemoglobin unloads more O₂ in active tissue (Bohr effect)."},{"s":"tca-intermediates","t":"acidic-aa","type":"prerequisite","why":"Transamination of oxaloacetate and α-ketoglutarate produces aspartate and glutamate, so these acidic amino acids are built on cycle skeletons."},{"s":"tca-intermediates","t":"pfk1","type":"affects","why":"Citrate exported to the cytosol when energy is abundant allosterically inhibits PFK-1, slowing glycolysis."},{"s":"tca-intermediates","t":"tca-cycle","type":"part-of","why":"The eight intermediates are regenerated with each turn, so they act catalytically while acetyl-CoA is oxidized."},{"s":"tca-intermediates","t":"acc-malonyl","type":"affects","why":"Cytosolic citrate supplies acetyl-CoA via citrate lyase and allosterically activates acetyl-CoA carboxylase, pushing carbon into fat."},{"s":"tca-intermediates","t":"neurotransmitters","type":"prerequisite","why":"Neurons make glutamate from α-ketoglutarate and decarboxylate it to GABA, so both main excitatory and inhibitory transmitters derive from a cycle intermediate."},{"s":"tca-intermediates","t":"hemoglobin","type":"prerequisite","why":"Succinyl-CoA condenses with glycine to form δ-aminolevulinate, the committed step of heme synthesis for hemoglobin."},{"s":"isocitrate-dh","t":"tca-cycle","type":"part-of","why":"Isocitrate dehydrogenase catalyzes the cycle's rate-limiting, first oxidative decarboxylation."},{"s":"isocitrate-dh","t":"electron-carriers","type":"affects","why":"Its oxidative decarboxylation reduces NAD⁺, producing the cycle's first NADH along with its first CO₂."},{"s":"isocitrate-dh","t":"fa-synthesis","type":"affects","why":"When ATP and NADH inhibit isocitrate dehydrogenase, citrate accumulates and is exported, supplying cytosolic acetyl-CoA for fatty acid synthesis."},{"s":"akg-dh","t":"pdh-complex","type":"contrasts","why":"α-KG dehydrogenase shares PDH's structure and five cofactors, but is controlled allosterically (products, Ca²⁺) rather than by PDH's kinase–phosphatase switch."},{"s":"akg-dh","t":"tca-cycle","type":"part-of","why":"α-KG dehydrogenase catalyzes the cycle's second oxidative decarboxylation, producing succinyl-CoA."},{"s":"akg-dh","t":"nervous-system","type":"affects","why":"Thiamine deficiency, common in alcoholism, impairs α-KG dehydrogenase and PDH, starving glucose-dependent neurons of ATP (Wernicke encephalopathy)."},{"s":"electron-carriers","t":"tca-cycle","type":"part-of","why":"Most of the cycle's captured energy leaves as NADH and FADH₂ rather than as ATP."},{"s":"electron-carriers","t":"etc-complexes","type":"prerequisite","why":"NADH donates electrons at Complex I and FADH₂ at Complex II, which is where their reducing power enters the chain."},{"s":"electron-carriers","t":"po-ratio","type":"prerequisite","why":"NADH yields about 2.5 ATP and FADH₂ about 1.5 because they enter the chain at different points and drive different numbers of protons."},{"s":"electron-carriers","t":"alcohol-oxidation","type":"applies-to","why":"NAD⁺ oxidizes alcohols by removing a hydride, as in malate to oxaloacetate and ethanol to acetaldehyde, acting as the cell's oxidizing agent."},{"s":"electron-carriers","t":"carbonyl-reduction","type":"applies-to","why":"NADH reduces carbonyls by delivering a hydride, the biological counterpart of NaBH₄, as when lactate dehydrogenase reduces pyruvate to lactate."},{"s":"oxphos","t":"glycolysis","type":"affects","why":"When O₂ or the ETC fails, ATP falls and AMP rises, which speeds glycolysis and lactate production (Pasteur effect)."},{"s":"oxphos","t":"tca-cycle","type":"affects","why":"Without a working ETC, NADH and FADH₂ cannot be reoxidized, so the cycle's dehydrogenases run out of NAD⁺ and FAD and stop."},{"s":"oxphos","t":"gas-exchange","type":"affects","why":"Complex IV's O₂ consumption keeps tissue PO₂ low, maintaining the gradient for O₂ to diffuse out of capillaries."},{"s":"etc-complexes","t":"active-transport","type":"contrasts","why":"Complexes I, III and IV pump protons uphill using energy from electron transfer, whereas classic primary active transporters are powered by ATP hydrolysis."},{"s":"etc-complexes","t":"mito-compartments","type":"affects","why":"Proton pumping from matrix to intermembrane space makes the intermembrane space acidic and positive and the matrix alkaline and negative."},{"s":"etc-complexes","t":"oxphos","type":"part-of","why":"The four complexes carry electrons from NADH and FADH₂ to O₂ and pump the protons."},{"s":"etc-complexes","t":"proton-gradient","type":"prerequisite","why":"Complexes I, III and IV use energy from electron transfer to pump H⁺ out of the matrix, building the gradient."},{"s":"proton-gradient","t":"secondary-active-transport","type":"applies-to","why":"The proton-motive force also powers inner-membrane cotransport, such as H⁺/phosphate symport that imports Pi for ATP synthesis."},{"s":"proton-gradient","t":"oxphos","type":"part-of","why":"The H⁺ gradient is the intermediate energy store linking electron transport to ATP synthesis."},{"s":"proton-gradient","t":"atp-synthase","type":"prerequisite","why":"H⁺ flowing down the gradient through F₀ is what turns the rotor that drives ATP synthesis in F₁."},{"s":"proton-gradient","t":"po-ratio","type":"explains","why":"ATP yield per electron pair equals protons pumped (10 for NADH, 6 for FADH₂) divided by about 4 H⁺ per ATP."},{"s":"atp-synthase","t":"active-transport","type":"contrasts","why":"ATP synthase is like an ion pump run backward: pumps spend ATP to move ions uphill, whereas it lets H⁺ flow downhill to make ATP."},{"s":"atp-synthase","t":"oxphos","type":"part-of","why":"ATP synthase is the final step, converting the proton-motive force into ATP."},{"s":"atp-synthase","t":"po-ratio","type":"explains","why":"About 4 H⁺ per ATP (roughly 3 for synthesis plus 1 for Pi import and ADP/ATP exchange) is the divisor that sets the 2.5 and 1.5 P/O values."},{"s":"po-ratio","t":"glycolysis","type":"applies-to","why":"P/O values convert glycolysis's 2 cytosolic NADH into 3 or 5 ATP, depending on which shuttle carries the electrons."},{"s":"po-ratio","t":"oxphos","type":"part-of","why":"P/O ratios quantify how much ATP oxidative phosphorylation yields per electron pair sent to O₂."},{"s":"po-ratio","t":"beta-oxidation","type":"applies-to","why":"P/O values let you tally palmitate's yield: 7 FADH₂, 7 NADH and 8 acetyl-CoA give 108 ATP, minus 2 for activation."},{"s":"uncouplers","t":"oxphos","type":"part-of","why":"Uncouplers act by collapsing the gradient that links electron transport to ATP synthesis."},{"s":"uncouplers","t":"etc-complexes","type":"contrasts","why":"Cyanide blocks Complex IV and stops both O₂ use and ATP synthesis, whereas uncouplers increase O₂ use while ATP synthesis falls."},{"s":"uncouplers","t":"proton-gradient","type":"affects","why":"By ferrying H⁺ back into the matrix outside ATP synthase, uncouplers collapse the gradient and release its energy as heat."},{"s":"uncouplers","t":"po-ratio","type":"affects","why":"Protons leaking back without making ATP lower the ATP obtained per oxygen consumed."},{"s":"gluconeogenesis","t":"glycogen-metabolism","type":"contrasts","why":"Liver glycogenolysis supplies most blood glucose early in a fast; gluconeogenesis rises over the same hours and becomes the main source once glycogen is largely depleted, roughly a day in."},{"s":"gluconeogenesis","t":"ketogenesis","type":"affects","why":"Gluconeogenesis drains oxaloacetate from liver mitochondria, so acetyl-CoA cannot enter the cycle and is diverted into ketone bodies."},{"s":"gluconeogenesis","t":"nervous-system","type":"affects","why":"During fasting, gluconeogenesis maintains the blood glucose the brain depends on, since the brain uses little fatty acid for fuel."},{"s":"bypass-reactions","t":"smooth-er","type":"explains","why":"Glucose-6-phosphatase, the final bypass enzyme, sits in the ER membrane of liver cells, which is why releasing free glucose is listed among smooth ER functions."},{"s":"bypass-reactions","t":"tca-intermediates","type":"affects","why":"Pyruvate carboxylase is anaplerotic, refilling oxaloacetate when it is drained for gluconeogenesis or biosynthesis."},{"s":"bypass-reactions","t":"gluconeogenesis","type":"part-of","why":"These four enzymes are what let gluconeogenesis get around glycolysis's irreversible steps."},{"s":"bypass-reactions","t":"glycogen-metabolism","type":"affects","why":"Glucose-6-phosphatase also ends liver glycogenolysis; muscle lacks it, so muscle glycogen cannot be exported as glucose."},{"s":"reciprocal-regulation","t":"gluconeogenesis","type":"part-of","why":"Opposite control at the bypass steps decides whether the liver runs glycolysis or gluconeogenesis."},{"s":"reciprocal-regulation","t":"glycogen-metabolism","type":"applies-to","why":"The same logic of one signal switching on one direction and off the other governs glycogen synthase versus phosphorylase."},{"s":"reciprocal-regulation","t":"lipid-metabolism","type":"applies-to","why":"Malonyl-CoA from fatty acid synthesis blocks CPT-I, so new fatty acids are not immediately oxidized, avoiding another futile cycle."},{"s":"glycogen-metabolism","t":"glycolysis","type":"prerequisite","why":"In muscle, glycogen-derived glucose-1-phosphate becomes glucose-6-phosphate and feeds glycolysis to fuel contraction."},{"s":"glycogen-metabolism","t":"insulin-glucagon","type":"explains","why":"Rapid hepatic glycogen synthesis and breakdown explain how insulin and glucagon can lower or raise blood glucose within minutes."},{"s":"glycogen-metabolism","t":"liver-gallbladder","type":"explains","why":"Storing glycogen and exporting free glucose via glucose-6-phosphatase explains the liver's role as the body's glucose buffer between meals."},{"s":"glycogen-phosphorylase","t":"glycolysis-phases","type":"affects","why":"Because phosphorylase releases phosphorylated glucose, glycogen glucose skips hexokinase's ATP cost and nets 3 ATP rather than 2 in anaerobic glycolysis."},{"s":"glycogen-phosphorylase","t":"glycogen-metabolism","type":"part-of","why":"Phosphorylase is the rate-limiting enzyme of the breakdown arm of glycogen metabolism."},{"s":"glycogen-phosphorylase","t":"adrenal-medulla","type":"explains","why":"Epinephrine raises blood glucose quickly by activating liver glycogen phosphorylase via phosphorylase kinase, through β-receptor cAMP signaling with a contribution from α₁-receptor Ca²⁺ signaling."},{"s":"glycogen-synthase","t":"glycogen-metabolism","type":"part-of","why":"Glycogen synthase is the rate-limiting enzyme of the storage arm of glycogen metabolism."},{"s":"glycogen-synthase","t":"glycogen-phosphorylase","type":"contrasts","why":"PKA phosphorylation activates phosphorylase but inactivates glycogen synthase, so one hormonal signal switches glycogen from storage to breakdown."},{"s":"glycogen-synthase","t":"fa-synthesis","type":"affects","why":"Glycogen stores are limited, so once they are full, surplus glucose carbon in the fed liver is increasingly directed to fatty acid synthesis."},{"s":"glycogen-synthase","t":"insulin-glucagon","type":"explains","why":"Insulin lowers blood glucose partly by activating protein phosphatase-1, which dephosphorylates and activates glycogen synthase in liver and muscle."},{"s":"ppp","t":"nucleotide-synthesis","type":"prerequisite","why":"The PPP supplies ribose-5-phosphate, which is activated to PRPP as the sugar backbone of every nucleotide."},{"s":"ppp","t":"lipid-metabolism","type":"affects","why":"PPP-derived NADPH provides the reducing power for fatty acid and cholesterol synthesis, so lipogenic tissues run the pathway heavily."},{"s":"ppp","t":"adrenal-cortex","type":"applies-to","why":"The adrenal cortex is a PPP-rich tissue because its cytochrome P450 enzymes use NADPH to convert cholesterol into steroid hormones."},{"s":"ppp-oxidative","t":"ppp","type":"part-of","why":"The oxidative phase is the irreversible, NADPH-producing first half of the PPP."},{"s":"ppp-oxidative","t":"nadph","type":"explains","why":"Both oxidative-phase dehydrogenases reduce NADP⁺, making this phase the main cytosolic source of NADPH."},{"s":"ppp-oxidative","t":"hemoglobin","type":"affects","why":"In G6PD deficiency red cells cannot make enough NADPH to keep glutathione reduced, so oxidants denature hemoglobin (Heinz bodies) and cause hemolysis."},{"s":"ppp-nonoxidative","t":"nucleotide-synthesis","type":"prerequisite","why":"Running transketolase and transaldolase in reverse makes ribose-5-phosphate from glycolytic intermediates when nucleotides are needed but NADPH is not."},{"s":"ppp-nonoxidative","t":"glycolysis","type":"affects","why":"Surplus pentoses are converted to fructose-6-phosphate and glyceraldehyde-3-phosphate, which re-enter glycolysis."},{"s":"ppp-nonoxidative","t":"ppp","type":"part-of","why":"The non-oxidative phase is the reversible sugar-interconverting second half of the PPP."},{"s":"nadph","t":"smooth-er","type":"applies-to","why":"Smooth ER cytochrome P450 enzymes use NADPH to hydroxylate drugs for detoxification and to build steroid hormones."},{"s":"nadph","t":"electron-carriers","type":"contrasts","why":"Both carry hydride, but NADH feeds the ETC to make ATP while NADPH donates electrons to biosynthesis, and a 2′-phosphate lets enzymes distinguish them."},{"s":"nadph","t":"ppp","type":"part-of","why":"NADPH is the PPP's main product and the reason most tissues run the pathway."},{"s":"nadph","t":"fa-synthesis","type":"applies-to","why":"Fatty acid synthase uses two NADPH per two-carbon cycle to reduce the growing chain, 14 per palmitate."},{"s":"nadph","t":"phagocytes","type":"applies-to","why":"Neutrophil and macrophage NADPH oxidase uses NADPH to make superoxide in the respiratory burst that kills ingested microbes."},{"s":"lipid-metabolism","t":"gluconeogenesis","type":"affects","why":"Lipolysis supplies gluconeogenic glycerol, and β-oxidation provides the ATP, NADH and acetyl-CoA that drive hepatic gluconeogenesis."},{"s":"lipid-metabolism","t":"glycogen-metabolism","type":"contrasts","why":"Fat stores about 9 kcal/g with little water, whereas glycogen is heavily hydrated, so fat is the long-term store and glycogen the fast-access one."},{"s":"lipid-metabolism","t":"steroid-hormones","type":"prerequisite","why":"Steroid hormones derive from cholesterol, which is built from acetyl-CoA by the lipid-synthesis machinery."},{"s":"lipid-metabolism","t":"bile-salts","type":"prerequisite","why":"The liver converts cholesterol into bile acids, so cholesterol synthesis comes before the amphipathic bile salts that emulsify dietary fat."},{"s":"beta-oxidation","t":"tca-intermediates","type":"affects","why":"Odd-chain fatty acids end as propionyl-CoA, which is converted to succinyl-CoA and adds net cycle intermediates."},{"s":"beta-oxidation","t":"lipid-metabolism","type":"part-of","why":"β-oxidation is the catabolic route that turns stored fatty acids into acetyl-CoA, NADH and FADH₂."},{"s":"beta-oxidation","t":"fa-synthesis","type":"contrasts","why":"Oxidation runs in the matrix with CoA, FAD and NAD⁺, while synthesis runs in the cytosol with ACP and NADPH, so they can be regulated separately."},{"s":"carnitine-shuttle","t":"gluconeogenesis","type":"affects","why":"Shuttle defects deprive the fasting liver of fatty acid-derived ATP and acetyl-CoA, impairing gluconeogenesis and causing hypoketotic hypoglycemia."},{"s":"carnitine-shuttle","t":"beta-oxidation","type":"part-of","why":"The shuttle is the transport step that controls entry of long-chain fatty acids into β-oxidation."},{"s":"carnitine-shuttle","t":"ketogenesis","type":"affects","why":"In fasting liver, low malonyl-CoA releases CPT-I, flooding mitochondria with fatty acids whose acetyl-CoA becomes ketone bodies."},{"s":"fa-synthesis","t":"fatty-acids","type":"explains","why":"Fatty acid synthase adds two carbons per cycle from malonyl-CoA and stops at palmitate, which is why natural fatty acids are mostly even-numbered."},{"s":"fa-synthesis","t":"phospholipids","type":"prerequisite","why":"Palmitate and its elongated, desaturated derivatives become the hydrophobic acyl tails of membrane phospholipids."},{"s":"fa-synthesis","t":"lipidation","type":"prerequisite","why":"Palmitate made by fatty acid synthase is the lipid attached in palmitoylation, which anchors proteins to membranes."},{"s":"fa-synthesis","t":"lipid-metabolism","type":"part-of","why":"Fatty acid synthesis is the anabolic route that stores surplus carbon as fat."},{"s":"acc-malonyl","t":"carnitine-shuttle","type":"affects","why":"Malonyl-CoA inhibits CPT-I, so whenever fatty acids are being made, their transport into mitochondria for oxidation is blocked."},{"s":"acc-malonyl","t":"fa-synthesis","type":"part-of","why":"ACC catalyzes the committed, rate-limiting step of fatty acid synthesis."},{"s":"acc-malonyl","t":"ketogenesis","type":"affects","why":"Low insulin leaves ACC phosphorylated and malonyl-CoA low, removing the brake on CPT-I and allowing heavy ketone production, as in diabetic ketoacidosis."},{"s":"ketogenesis","t":"lipid-metabolism","type":"part-of","why":"Ketogenesis is the liver's fasting-state route for excess fatty acid-derived acetyl-CoA."},{"s":"ketogenesis","t":"nervous-system","type":"affects","why":"After several days of starvation, the brain gets much of its energy from ketone bodies, reducing glucose demand and sparing muscle protein."},{"s":"ketogenesis","t":"ph-homeostasis","type":"affects","why":"Acetoacetate and β-hydroxybutyrate are acids; their overproduction consumes bicarbonate and causes an anion-gap metabolic acidosis."},{"s":"ketogenesis","t":"breathing-control","type":"affects","why":"Ketoacidosis stimulates peripheral chemoreceptors, driving deep, rapid (Kussmaul) breathing that blows off CO₂ to partly compensate."},{"s":"aa-catabolism","t":"tca-cycle","type":"affects","why":"Amino acid skeletons enter as α-ketoglutarate, succinyl-CoA, fumarate or oxaloacetate, replenishing cycle intermediates."},{"s":"aa-catabolism","t":"gluconeogenesis","type":"affects","why":"During fasting, muscle protein breakdown releases alanine and glutamine, whose carbon skeletons are major substrates for gluconeogenesis."},{"s":"aa-catabolism","t":"renal-acid-base","type":"affects","why":"Kidney tubule cells deaminate glutamine to release NH₄⁺ into urine, excreting acid and generating new bicarbonate."},{"s":"transamination","t":"amino-acids","type":"explains","why":"Transaminating keto acids from glycolysis and the citric acid cycle explains why some amino acids are nonessential: the body can make them."},{"s":"transamination","t":"aa-catabolism","type":"part-of","why":"Transamination is the first step of amino acid breakdown, collecting amino groups on glutamate."},{"s":"transamination","t":"deamination","type":"prerequisite","why":"Transamination collects amino groups on glutamate, the one amino acid glutamate dehydrogenase can then deaminate to free NH₄⁺."},{"s":"transamination","t":"urea-cycle","type":"prerequisite","why":"Transamination of oxaloacetate produces aspartate, which donates the urea cycle's second nitrogen."},{"s":"transamination","t":"liver-gallbladder","type":"explains","why":"Hepatocytes are rich in ALT and AST, so liver injury releases these aminotransferases into blood, making them standard markers of liver damage."},{"s":"deamination","t":"tca-intermediates","type":"affects","why":"Deaminating glutamate regenerates α-ketoglutarate, which can accept more amino groups or continue through the cycle."},{"s":"deamination","t":"aa-catabolism","type":"part-of","why":"Oxidative deamination frees the collected amino group as NH₄⁺ for disposal."},{"s":"deamination","t":"urea-cycle","type":"prerequisite","why":"The NH₄⁺ released by glutamate dehydrogenase is fixed by carbamoyl phosphate synthetase I as the cycle's first nitrogen."},{"s":"urea-cycle","t":"tca-intermediates","type":"affects","why":"Argininosuccinate splits to release fumarate, which is converted to malate and oxaloacetate, linking nitrogen disposal to the citric acid cycle."},{"s":"urea-cycle","t":"aa-catabolism","type":"part-of","why":"The urea cycle disposes of the nitrogen removed from amino acids in a nontoxic, excretable form."},{"s":"urea-cycle","t":"nervous-system","type":"affects","why":"When the urea cycle fails (liver failure or enzyme defects), ammonia accumulates and causes encephalopathy."},{"s":"urea-cycle","t":"countercurrent","type":"affects","why":"Urea recycled between collecting duct and loop of Henle adds to inner medullary osmolarity, helping the kidney concentrate urine."},{"s":"glucogenic-ketogenic","t":"aromatic-aa","type":"applies-to","why":"Phe, Tyr and Trp are both glucogenic and ketogenic: their breakdown gives a ketogenic piece (acetoacetate or acetyl-CoA) plus a glucogenic one (fumarate or alanine)."},{"s":"glucogenic-ketogenic","t":"gluconeogenesis","type":"prerequisite","why":"Only amino acids whose skeletons become pyruvate or cycle intermediates can be converted to oxaloacetate and then glucose."},{"s":"glucogenic-ketogenic","t":"aa-catabolism","type":"part-of","why":"This classification describes the fate of carbon skeletons after amino acids lose their nitrogen."},{"s":"nervous-system","t":"endocrine-system","type":"contrasts","why":"Neurons signal in milliseconds to specific targets across synapses, while hormones travel in blood and act more slowly, more widely and for longer."},{"s":"nervous-system","t":"cardiovascular-system","type":"affects","why":"Sympathetic input raises heart rate, contractility and arteriole constriction, while vagal parasympathetic input slows the SA node."},{"s":"nervous-system","t":"sensation-perception","type":"prerequisite","why":"Perception starts when sensory receptors transduce stimuli into graded potentials that trigger action potentials carried to the CNS."},{"s":"nervous-system","t":"learning-memory","type":"explains","why":"Learning and memory depend on lasting changes in synaptic strength and neuronal connectivity, such as long-term potentiation."},{"s":"nervous-system","t":"emotion-stress","type":"explains","why":"Sympathetic activation produces the bodily arousal of emotion and stress, such as a racing heart, sweating and rapid breathing."},{"s":"resting-potential","t":"nervous-system","type":"part-of","why":"The resting potential is the baseline electrical state from which all neuronal signaling departs."},{"s":"resting-potential","t":"action-potential","type":"prerequisite","why":"An action potential is a brief, regenerative departure from the resting potential, so threshold and overshoot are defined relative to it."},{"s":"resting-potential","t":"photoreceptors","type":"explains","why":"In darkness open cGMP-gated Na⁺ channels hold rods and cones near −40 mV; light closes them, so K⁺ leak pulls the cell toward a more negative potential."},{"s":"action-potential","t":"nervous-system","type":"part-of","why":"Action potentials are the long-distance electrical signals that neurons use to carry information."},{"s":"action-potential","t":"synapses","type":"prerequisite","why":"When the spike reaches the axon terminal it opens voltage-gated Ca²⁺ channels, and that Ca²⁺ influx triggers transmitter release."},{"s":"action-potential","t":"somatosensation","type":"explains","why":"Because each spike is all-or-none, touch and pain intensity are encoded by firing rate and by the number of receptors recruited."},{"s":"ap-phases","t":"action-potential","type":"part-of","why":"These three phases are the time course of a single action potential."},{"s":"ap-phases","t":"conduction-system","type":"contrasts","why":"SA nodal upstrokes are Ca²⁺-driven and ventricular cells add a roughly 200 ms Ca²⁺ plateau, whereas a neuronal spike is Na⁺-driven and lasts only 1–2 ms."},{"s":"myelination","t":"nervous-system","type":"part-of","why":"Myelin is the glial insulation that sets conduction speed in vertebrate nerves."},{"s":"myelination","t":"action-potential","type":"affects","why":"Myelin confines regeneration of the spike to nodes of Ranvier, raising conduction velocity many-fold without enlarging the axon."},{"s":"myelination","t":"somatosensation","type":"explains","why":"Sharp pain and touch travel on myelinated Aδ and Aβ fibers respectively, while dull aching pain uses slow unmyelinated C fibers, producing first and second pain."},{"s":"synapses","t":"nervous-system","type":"part-of","why":"Synapses are where neurons pass signals to other neurons, muscles or glands."},{"s":"synapses","t":"conduction-system","type":"explains","why":"Gap junctions in intercalated discs electrically couple cardiac cells, so depolarization spreads cell to cell and the myocardium contracts as a functional unit."},{"s":"synapses","t":"psychoactive-drugs","type":"explains","why":"Most psychoactive drugs act at chemical synapses by mimicking, blocking or altering transmitter release, receptor binding or clearance."},{"s":"neurotransmitters","t":"synapses","type":"part-of","why":"Neurotransmitters are the chemical messengers released at chemical synapses."},{"s":"neurotransmitters","t":"depressants","type":"explains","why":"Alcohol, benzodiazepines and barbiturates enhance Cl⁻ currents through GABA-A receptors, hyperpolarizing neurons and causing sedation."},{"s":"neurotransmitters","t":"ltp","type":"explains","why":"Glutamate acting on AMPA receptors depolarizes the cell, relieving the Mg²⁺ block of NMDA receptors so Ca²⁺ enters and triggers long-term potentiation."},{"s":"neurotransmitters","t":"schizophrenia","type":"explains","why":"The dopamine hypothesis ties positiv
