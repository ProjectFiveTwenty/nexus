e symptoms to excess mesolimbic dopamine signaling; consistent with this, D₂-blocking antipsychotics mainly reduce positive symptoms such as hallucinations."},{"s":"neurotransmitters","t":"parkinsons","type":"explains","why":"Loss of dopamine-releasing neurons in the substantia nigra deprives the basal ganglia of dopamine, causing tremor, rigidity and slowed movement."},{"s":"nt-clearance","t":"synapses","type":"part-of","why":"Clearing transmitter from the cleft is what terminates each synaptic signal."},{"s":"nt-clearance","t":"stimulants","type":"explains","why":"Cocaine blocks dopamine, norepinephrine and serotonin reuptake transporters, and amphetamines also make them run in reverse, so monoamines build up in the synapse."},{"s":"nt-clearance","t":"depression","type":"applies-to","why":"SSRIs block serotonin reuptake and MAO inhibitors block monoamine breakdown, both raising synaptic monoamines to treat depression."},{"s":"nt-clearance","t":"alzheimers","type":"applies-to","why":"Donepezil and similar drugs inhibit acetylcholinesterase, slowing ACh breakdown to offset the loss of cholinergic neurons in Alzheimer's disease."},{"s":"endocrine-system","t":"covalent-modification","type":"affects","why":"Hormones acting through second messengers often regulate metabolic enzymes by kinase phosphorylation, as when glucagon activates PKA in the liver."},{"s":"endocrine-system","t":"gene-regulation","type":"affects","why":"Steroid and thyroid hormones are ligands for nuclear receptor transcription factors, letting hormones switch specific target genes on or off."},{"s":"endocrine-system","t":"renal-system","type":"affects","why":"ADH, aldosterone and ANP set how much water and Na⁺ the kidney reabsorbs, so hormones control urine volume and blood volume."},{"s":"endocrine-system","t":"reproductive-system","type":"affects","why":"GnRH, FSH, LH, estrogen, progesterone and testosterone drive gametogenesis, the ovarian cycle and the maintenance of pregnancy."},{"s":"peptide-hormones","t":"endocrine-system","type":"part-of","why":"Peptide hormones are the largest chemical class of hormones."},{"s":"peptide-hormones","t":"steroid-hormones","type":"contrasts","why":"Polar peptides bind surface receptors and act in minutes, while lipophilic steroids diffuse into cells, bind intracellular receptors and act over hours via transcription."},{"s":"peptide-hormones","t":"second-messengers","type":"prerequisite","why":"Peptides cannot cross the lipid bilayer, so their signals must be relayed inside the cell by messengers such as cAMP and IP₃."},{"s":"steroid-hormones","t":"transcription-factors","type":"affects","why":"A steroid–receptor complex binds hormone response elements in DNA and recruits coactivators, directly changing transcription of target genes."},{"s":"steroid-hormones","t":"endocrine-system","type":"part-of","why":"Steroids are the cholesterol-derived, lipid-soluble class of hormones."},{"s":"steroid-hormones","t":"spermatogenesis","type":"affects","why":"Testosterone from Leydig cells acts with FSH on Sertoli cells, and high local testosterone is required to sustain sperm production."},{"s":"amine-hormones","t":"neurotransmitters","type":"contrasts","why":"Norepinephrine acts as a neurotransmitter when released at synapses but as a hormone when the adrenal medulla secretes it into blood; both routes use adrenergic receptors."},{"s":"amine-hormones","t":"endocrine-system","type":"part-of","why":"Amino acid–derived hormones are the third chemical class of hormones, beside peptides and steroids."},{"s":"amine-hormones","t":"circadian","type":"affects","why":"The pineal gland releases melatonin in darkness, signaling night to the circadian system and promoting sleep onset."},{"s":"second-messengers","t":"phosphorylation","type":"affects","why":"Second messengers activate protein kinases, such as PKA by cAMP and PKC by DAG and Ca²⁺, which phosphorylate target enzymes to change their activity."},{"s":"second-messengers","t":"synapses","type":"affects","why":"Metabotropic transmitter receptors work through G proteins and second messengers, giving slower, longer-lasting synaptic effects than ionotropic channels."},{"s":"second-messengers","t":"endocrine-system","type":"part-of","why":"Second messengers carry the signals of surface-acting hormones into the cell."},{"s":"second-messengers","t":"photoreceptors","type":"explains","why":"In rods, light-activated rhodopsin turns on transducin and phosphodiesterase, lowering cGMP so cation channels close and the cell hyperpolarizes."},{"s":"camp","t":"f26bp","type":"affects","why":"In liver, PKA phosphorylates the bifunctional PFK-2/FBPase-2, lowering fructose-2,6-bisphosphate so glycolysis slows and gluconeogenesis speeds up."},{"s":"camp","t":"glycogen-phosphorylase","type":"affects","why":"PKA phosphorylates and activates phosphorylase kinase, which phosphorylates glycogen phosphorylase, releasing glucose-1-phosphate from glycogen."},{"s":"camp","t":"glycogen-synthase","type":"affects","why":"PKA phosphorylation inactivates glycogen synthase, so cAMP shuts off glycogen storage at the same moment it turns on breakdown."},{"s":"camp","t":"lipid-metabolism","type":"affects","why":"PKA activates hormone-sensitive lipase in adipocytes, releasing fatty acids for β-oxidation during fasting and stress."},{"s":"camp","t":"second-messengers","type":"part-of","why":"cAMP is the second messenger of Gs- and Gi-coupled receptors."},{"s":"ip3-calcium","t":"glycogen-phosphorylase","type":"affects","why":"Ca²⁺–calmodulin activates phosphorylase kinase, so α₁-adrenergic signals in liver and contraction in muscle speed glycogen breakdown."},{"s":"ip3-calcium","t":"second-messengers","type":"part-of","why":"IP₃, DAG and Ca²⁺ are the second messengers of Gq-coupled receptors."},{"s":"ip3-calcium","t":"fertilization","type":"explains","why":"Sperm entry triggers an IP₃-driven Ca²⁺ wave in the egg that causes the cortical reaction, blocking polyspermy and activating the egg."},{"s":"ip3-calcium","t":"ltp","type":"affects","why":"In LTP, Ca²⁺ entering through NMDA receptors acts as a second messenger, activating calmodulin-dependent kinase II, which adds AMPA receptors and strengthens the synapse."},{"s":"feedback-loops","t":"endocrine-system","type":"part-of","why":"Feedback loops are how the endocrine system keeps hormone levels in range."},{"s":"feedback-loops","t":"clotting","type":"applies-to","why":"Thrombin activates platelets and upstream clotting factors that generate still more thrombin, a positive feedback loop that builds a clot rapidly."},{"s":"feedback-loops","t":"menstrual-hormones","type":"explains","why":"The switch from estrogen's negative to positive feedback on the hypothalamus and pituitary produces the mid-cycle LH surge that triggers ovulation."},{"s":"feedback-loops","t":"drive-reduction","type":"applies-to","why":"Drive reduction theory models motivation as negative feedback: a departure from a physiological set point creates a drive that behavior reduces."},{"s":"hypothalamus-pituitary","t":"endocrine-system","type":"part-of","why":"The hypothalamic–pituitary axes are the master control system for most endocrine glands."},{"s":"hypothalamus-pituitary","t":"menstrual-hormones","type":"affects","why":"Pulsatile GnRH drives FSH and LH release, which control follicle growth, ovulation and ovarian secretion of estrogen and progesterone."},{"s":"hypothalamus-pituitary","t":"gas","type":"explains","why":"The HPA axis (CRH → ACTH → cortisol) sustains the resistance stage of the general adaptation syndrome, and prolonged activation contributes to exhaustion."},{"s":"anterior-pituitary","t":"hypothalamus-pituitary","type":"part-of","why":"The anterior pituitary is the middle tier of the hypothalamic–pituitary axes."},{"s":"anterior-pituitary","t":"adrenal-cortex","type":"affects","why":"ACTH stimulates the zona fasciculata to make cortisol; aldosterone is controlled mainly by angiotensin II and K⁺ instead."},{"s":"anterior-pituitary","t":"thyroid","type":"affects","why":"TSH stimulates iodide uptake and T₃/T₄ synthesis and release, and also drives growth of the thyroid gland."},{"s":"anterior-pituitary","t":"spermatogenesis","type":"affects","why":"FSH acts on Sertoli cells and LH on Leydig cells to make testosterone, together supporting sperm production."},{"s":"posterior-pituitary","t":"hypothalamus-pituitary","type":"part-of","why":"The posterior pituitary is the neural outpost of the hypothalamus."},{"s":"posterior-pituitary","t":"blood-pressure","type":"affects","why":"ADH raises blood pressure by retaining water and, at high concentrations, by constricting arterioles through V₁ receptors."},{"s":"posterior-pituitary","t":"reproductive-system","type":"affects","why":"Oxytocin triggers uterine contractions during labor and milk ejection during nursing."},{"s":"adrenal-cortex","t":"gluconeogenesis","type":"affects","why":"Cortisol induces gluconeogenic enzymes such as PEPCK and supplies amino acids from muscle protein, raising blood glucose during stress and fasting."},{"s":"adrenal-cortex","t":"endocrine-system","type":"part-of","why":"The adrenal cortex is the body's main source of corticosteroid hormones."},{"s":"adrenal-cortex","t":"reabsorption-secretion","type":"affects","why":"Aldosterone adds Na⁺ channels and Na⁺/K⁺ ATPases in distal tubule and collecting duct cells, increasing Na⁺ reabsorption and K⁺ secretion."},{"s":"adrenal-cortex","t":"immune-system","type":"affects","why":"Cortisol suppresses inflammation and lymphocyte activity, which is why chronic stress and glucocorticoid drugs raise infection risk."},{"s":"adrenal-medulla","t":"endocrine-system","type":"part-of","why":"The adrenal medulla is the endocrine arm of the sympathetic nervous system."},{"s":"adrenal-medulla","t":"cardiac-output","type":"affects","why":"Epinephrine on β₁ receptors raises heart rate and contractility, increasing stroke volume and cardiac output."},{"s":"adrenal-medulla","t":"gas","type":"explains","why":"Sympathetic activation and medullary epinephrine release produce the alarm stage of the general adaptation syndrome within seconds."},{"s":"thyroid","t":"na-k-atpase","type":"affects","why":"T₃ increases Na⁺/K⁺ ATPase expression in many tissues; the extra ATP turnover is one way thyroid hormone raises O₂ consumption and heat production."},{"s":"thyroid","t":"endocrine-system","type":"part-of","why":"The thyroid is the endocrine gland that sets basal metabolic rate."},{"s":"thyroid","t":"parathyroid","type":"contrasts","why":"Calcitonin lowers blood Ca²⁺ by inhibiting osteoclasts, opposing PTH, which raises Ca²⁺ through bone resorption, renal reabsorption and vitamin D."},{"s":"parathyroid","t":"fat-soluble-vitamins","type":"affects","why":"PTH stimulates renal 1α-hydroxylase, converting 25-hydroxyvitamin D into calcitriol, which raises intestinal Ca²⁺ and phosphate absorption."},{"s":"parathyroid","t":"ap-phases","type":"affects","why":"Low extracellular Ca²⁺ lets Na⁺ channels open with less depolarization, moving threshold toward rest, so hypocalcemia from hypoparathyroidism makes nerves hyperexcitable and causes tetany."},{"s":"parathyroid","t":"endocrine-system","type":"part-of","why":"The parathyroid glands are the main hormonal regulators of blood calcium."},{"s":"parathyroid","t":"reabsorption-secretion","type":"affects","why":"PTH increases Ca²⁺ reabsorption in the distal tubule and decreases phosphate reabsorption in the proximal tubule."},{"s":"parathyroid","t":"small-intestine","type":"affects","why":"PTH stimulates renal production of calcitriol, which increases Ca²⁺ absorption by small-intestine cells."},{"s":"insulin-glucagon","t":"facilitated-diffusion","type":"affects","why":"Insulin moves GLUT4 transporters into the plasma membrane, increasing facilitated diffusion of glucose into muscle and fat cells."},{"s":"insulin-glucagon","t":"gluconeogenesis","type":"affects","why":"Glucagon raises hepatic cAMP, inducing PEPCK and lowering fructose-2,6-bisphosphate, so the fasting liver makes and releases glucose."},{"s":"insulin-glucagon","t":"acc-malonyl","type":"affects","why":"Insulin keeps acetyl-CoA carboxylase dephosphorylated and active, turning fed-state carbon into malonyl-CoA and fat; glucagon signaling phosphorylates and inhibits it."},{"s":"insulin-glucagon","t":"ketogenesis","type":"affects","why":"Low insulin with high glucagon floods the liver with fatty acids that become ketone bodies, which is why untreated type 1 diabetes causes ketoacidosis."},{"s":"insulin-glucagon","t":"endocrine-system","type":"part-of","why":"Insulin and glucagon are the endocrine pancreas's opposing controls of blood glucose."},{"s":"cardiovascular-system","t":"oxphos","type":"affects","why":"Blood flow delivers the O₂ that Complex IV needs as final electron acceptor; without perfusion, cells fall back on anaerobic glycolysis."},{"s":"cardiovascular-system","t":"respiratory-system","type":"affects","why":"Right ventricular output perfuses the alveolar capillaries, so gas exchange depends on matching pulmonary blood flow to ventilation."},{"s":"cardiovascular-system","t":"renal-system","type":"affects","why":"The kidneys receive about 20% of cardiac output, and glomerular filtration is driven by capillary blood pressure."},{"s":"heart-anatomy","t":"cardiovascular-system","type":"part-of","why":"The heart's chambers and valves form the pump that drives both circuits."},{"s":"heart-anatomy","t":"cardiac-cycle","type":"prerequisite","why":"The cardiac cycle is described as valves opening and closing between named chambers, so the anatomy must come first."},{"s":"heart-anatomy","t":"conduction-system","type":"prerequisite","why":"The SA node sits in the right atrial wall and the AV node, bundle of His and Purkinje fibers run through the septum and ventricles."},{"s":"cardiac-cycle","t":"cardiovascular-system","type":"part-of","why":"The cardiac cycle is the repeating sequence of contraction and relaxation that pumps blood."},{"s":"cardiac-cycle","t":"cardiac-output","type":"prerequisite","why":"Stroke volume is end-diastolic minus end-systolic volume, quantities defined by the filling and ejection phases of the cycle."},{"s":"cardiac-cycle","t":"blood-pressure","type":"explains","why":"Ejection during systole raises arterial pressure to its peak, and elastic recoil of the arteries during diastole sets the diastolic trough."},{"s":"cardiac-output","t":"cardiovascular-system","type":"part-of","why":"Cardiac output is the overall flow rate of the circulation."},{"s":"cardiac-output","t":"blood-pressure","type":"affects","why":"Mean arterial pressure equals cardiac output times total peripheral resistance, so higher output raises pressure unless resistance falls."},{"s":"cardiac-output","t":"gfr","type":"affects","why":"A large fall in cardiac output overwhelms renal autoregulation, lowering glomerular pressure and GFR and stimulating renin release."},{"s":"conduction-system","t":"cardiovascular-system","type":"part-of","why":"The conduction system generates and coordinates each heartbeat."},{"s":"conduction-system","t":"cardiac-cycle","type":"explains","why":"The AV nodal delay lets atrial contraction finish filling the ventricles before ventricular systole begins."},{"s":"conduction-system","t":"cardiac-output","type":"affects","why":"The SA node's firing rate is the heart rate; sympathetic input speeds it and vagal acetylcholine slows it, directly changing cardiac output."},{"s":"blood-pressure","t":"cardiovascular-system","type":"part-of","why":"Blood pressure is the driving force for flow through the circulation."},{"s":"blood-pressure","t":"gfr","type":"affects","why":"Myogenic and tubuloglomerular autoregulation hold GFR nearly constant across mean arterial pressures of roughly 80–180 mmHg; below that range GFR falls with pressure."},{"s":"blood-pressure","t":"raas","type":"affects","why":"Low renal perfusion pressure triggers renin release from juxtaglomerular cells, launching the renin–angiotensin–aldosterone system."},{"s":"blood-pressure","t":"starling-forces","type":"affects","why":"Higher venous or capillary pressure, as in congestive heart failure, raises filtration out of capillaries and causes edema."},{"s":"baroreceptors","t":"posterior-pituitary","type":"affects","why":"A large drop in pressure sensed by baroreceptors stimulates ADH release, which can override normal osmotic control."},{"s":"baroreceptors","t":"cardiac-output","type":"affects","why":"Baroreceptor firing adjusts SA node rate and contractility within seconds, changing cardiac output to correct a pressure change."},{"s":"baroreceptors","t":"blood-pressure","type":"part-of","why":"Baroreceptors are the sensors of the short-term blood pressure reflex."},{"s":"baroreceptors","t":"breathing-control","type":"contrasts","why":"Baroreceptors detect arterial stretch to regulate pressure, while chemoreceptors in the same region detect PO₂, PCO₂ and H⁺ to drive breathing."},{"s":"hemoglobin","t":"cardiovascular-system","type":"part-of","why":"Hemoglobin is the blood's oxygen carrier."},{"s":"hemoglobin","t":"ph-homeostasis","type":"affects","why":"Histidine residues let hemoglobin buffer the H⁺ released as CO₂ becomes bicarbonate, making it the main non-bicarbonate buffer in blood."},{"s":"hemoglobin","t":"gas-exchange","type":"affects","why":"Hemoglobin binds O₂ as it diffuses in, so far more O₂ must cross before plasma PO₂ equilibrates; about 98% of blood O₂ is carried bound to hemoglobin."},{"s":"bohr-effect","t":"oxphos","type":"affects","why":"By releasing extra O₂ in acidic, CO₂-rich muscle, the Bohr effect supplies Complex IV with its final electron acceptor during exercise."},{"s":"bohr-effect","t":"hemoglobin","type":"part-of","why":"The Bohr effect is a form of allosteric regulation of hemoglobin."},{"s":"bohr-effect","t":"haldane-effect","type":"contrasts","why":"Bohr: H⁺ and CO₂ lower O₂ affinity, aiding unloading in tissues. Haldane: O₂ binding lowers H⁺ and CO₂ affinity, aiding CO₂ release in lungs."},{"s":"haldane-effect","t":"hemoglobin","type":"part-of","why":"The Haldane effect describes how oxygenation changes hemoglobin's CO₂ and H⁺ binding."},{"s":"haldane-effect","t":"ph-homeostasis","type":"affects","why":"Deoxyhemoglobin soaks up H⁺ as CO₂ enters venous blood, so venous pH is only slightly lower than arterial pH."},{"s":"haldane-effect","t":"gas-exchange","type":"affects","why":"In the lungs, O₂ binding drives H⁺ and CO₂ off hemoglobin, pushing the bicarbonate equilibrium toward CO₂ that diffuses into the alveoli."},{"s":"clotting","t":"cardiovascular-system","type":"part-of","why":"Clotting seals breaks in the vessel wall to prevent blood loss."},{"s":"clotting","t":"complement","type":"contrasts","why":"Both are plasma zymogen cascades amplified by sequential proteolysis, but clotting ends in a fibrin mesh while complement ends in opsonization and membrane attack complexes."},{"s":"ph-homeostasis","t":"enzymes","type":"affects","why":"Keeping blood pH near 7.4 holds the ionization states of active-site and surface residues steady, so enzymes keep their shape and activity."},{"s":"ph-homeostasis","t":"resting-potential","type":"affects","why":"In acidosis, H⁺ enters cells in exchange for K⁺, raising plasma K⁺; the smaller K⁺ gradient depolarizes resting potentials in heart and nerve."},{"s":"ph-homeostasis","t":"bohr-effect","type":"affects","why":"Falling blood pH protonates hemoglobin and lowers its O₂ affinity, shifting the dissociation curve right so more O₂ unloads in acidic tissues."},{"s":"respiratory-system","t":"oxphos","type":"affects","why":"Breathing supplies the O₂ that accepts electrons at Complex IV; without it the electron transport chain stalls and cells fall back on anaerobic glycolysis."},{"s":"respiratory-system","t":"renal-system","type":"contrasts","why":"Both organs regulate blood pH, but lungs change CO₂ within minutes while kidneys change HCO₃⁻ and H⁺ excretion over hours to days."},{"s":"airway-anatomy","t":"respiratory-system","type":"part-of","why":"The airways are the conducting and respiratory passages that carry air to and from the alveoli."},{"s":"airway-anatomy","t":"gas-exchange","type":"explains","why":"Alveoli give a huge surface and a barrier under a micrometer thick, the two Fick's-law factors that make diffusion fast enough."},{"s":"airway-anatomy","t":"innate-immunity","type":"affects","why":"Mucus traps inhaled particles and microbes, and cilia sweep it up toward the pharynx, a physical barrier of innate defense (the mucociliary escalator)."},{"s":"airway-anatomy","t":"surface-tension","type":"affects","why":"Type II alveolar cells secrete surfactant, which lowers alveolar surface tension and so the collapsing pressure (P = 2T/r) that would otherwise shut small alveoli."},{"s":"ventilation","t":"cardiac-output","type":"affects","why":"Inspiration lowers intrathoracic pressure, drawing venous blood into the chest and increasing right-heart filling (the respiratory pump)."},{"s":"ventilation","t":"respiratory-system","type":"part-of","why":"Ventilation is the muscle-driven pressure cycle that moves air in and out of the lungs."},{"s":"ventilation","t":"lung-volumes","type":"prerequisite","why":"Lung volumes are the amounts moved by the muscles and recoil forces of ventilation, so mechanics explains why reserve and residual volumes exist."},{"s":"ventilation","t":"gas-exchange","type":"prerequisite","why":"Ventilation keeps alveolar PO₂ high and PCO₂ low; without fresh air the gradients that drive diffusion would collapse."},{"s":"lung-volumes","t":"respiratory-system","type":"part-of","why":"Lung volumes and capacities quantify how much air each phase of breathing moves or leaves behind."},{"s":"lung-volumes","t":"gas-exchange","type":"affects","why":"Alveolar ventilation equals (tidal volume − dead space) × rate, so shallow rapid breaths refresh alveolar gas poorly even at the same minute ventilation."},{"s":"gas-exchange","t":"ph-homeostasis","type":"affects","why":"Unloading CO₂ in the lungs removes volatile acid; impaired exchange, as in severe lung disease, retains CO₂ and produces respiratory acidosis."},{"s":"gas-exchange","t":"respiratory-system","type":"part-of","why":"Gas exchange across the alveoli is the respiratory system's core job of loading O₂ and unloading CO₂."},{"s":"breathing-control","t":"ph-homeostasis","type":"affects","why":"Chemoreceptors raise ventilation when H⁺ or CO₂ rises, blowing off CO₂ to compensate for metabolic acidosis within minutes."},{"s":"breathing-control","t":"respiratory-system","type":"part-of","why":"Brainstem control sets the rate and depth of breathing to match the body's CO₂ and O₂ needs."},{"s":"breathing-control","t":"sleep-disorders","type":"explains","why":"Central sleep apnea occurs when brainstem respiratory centers stop driving breathing during sleep, unlike obstructive apnea caused by airway collapse."},{"s":"renal-system","t":"blood-pressure","type":"affects","why":"By setting how much Na⁺ and water are excreted, the kidneys control extracellular fluid volume, the main long-term determinant of blood pressure."},{"s":"renal-system","t":"hemoglobin","type":"affects","why":"When renal O₂ delivery falls, the kidneys release erythropoietin, which increases red cell production and total hemoglobin."},{"s":"renal-system","t":"ph-homeostasis","type":"affects","why":"Kidneys excrete the fixed (nonvolatile) acids from metabolism and regenerate HCO₃⁻; the lungs can remove only CO₂, so this is the main route for nonvolatile acid."},{"s":"nephron","t":"renal-system","type":"part-of","why":"The nephron is the kidney's functional unit, and each kidney has about a million of them."},{"s":"nephron","t":"gfr","type":"prerequisite","why":"GFR depends on the glomerulus sitting between afferent and efferent arterioles, so the vessel layout explains how arteriole tone changes filtration."},{"s":"nephron","t":"countercurrent","type":"prerequisite","why":"The multiplier depends on the hairpin shape of the loop of Henle and the differing permeabilities of its descending and ascending limbs."},{"s":"nephron","t":"raas","type":"explains","why":"Macula densa cells sense distal NaCl and signal adjacent juxtaglomerular cells in the afferent arteriole, which release renin."},{"s":"gfr","t":"renal-system","type":"part-of","why":"Glomerular filtration is the first step of urine formation and sets how much plasma the kidneys process."},{"s":"gfr","t":"reabsorption-secretion","type":"prerequisite","why":"Filtered load equals GFR × plasma concentration, and a substance's handling is judged by comparing excretion with this filtered load."},{"s":"gfr","t":"raas","type":"affects","why":"A fall in GFR lowers NaCl delivery to the macula densa, which signals juxtaglomerular cells to release renin."},{"s":"countercurrent","t":"renal-system","type":"part-of","why":"The countercurrent multiplier is the loop of Henle mechanism that lets kidneys concentrate urine."},{"s":"countercurrent","t":"reabsorption-secretion","type":"affects","why":"The medullary osmotic gradient pulls water passively out of the descending limb and collecting duct, driving water reabsorption without water pumps."},{"s":"countercurrent","t":"adh","type":"prerequisite","why":"ADH can concentrate urine only because the loop has built a hyperosmotic medulla for water to move into through aquaporins."},{"s":"reabsorption-secretion","t":"resting-potential","type":"affects","why":"Distal K⁺ secretion sets plasma K⁺, and because resting potential depends on the K⁺ gradient, hyperkalemia depolarizes heart and nerve cells."},{"s":"reabsorption-secretion","t":"blood-pressure","type":"affects","why":"Na⁺ reabsorption determines extracellular fluid volume, so diuretics that block Na⁺ transporters lower blood pressure."},{"s":"reabsorption-secretion","t":"renal-system","type":"part-of","why":"Tubular reabsorption and secretion turn filtrate into urine by adjusting what is kept and what is added."},{"s":"raas","t":"na-k-atpase","type":"affects","why":"Aldosterone increases ENaC channels and basolateral Na⁺/K⁺ ATPase in collecting-duct principal cells, boosting Na⁺ reabsorption and K⁺ secretion."},{"s":"raas","t":"adrenal-cortex","type":"affects","why":"Angiotensin II stimulates the zona glomerulosa to secrete aldosterone."},{"s":"raas","t":"renal-system","type":"part-of","why":"RAAS is the kidney-initiated hormone cascade that restores blood volume and pressure."},{"s":"raas","t":"hypothalamus","type":"affects","why":"Angiotensin II acts on circumventricular organs lacking a blood–brain barrier, which signal the hypothalamus to trigger thirst and ADH release."},{"s":"raas","t":"drive-reduction","type":"explains","why":"Angiotensin II–induced thirst shows the physiology behind a homeostatic drive: low blood volume creates a need, drinking relieves it, and the drive subsides, as drive reduction theory proposes."},{"s":"adh","t":"facilitated-diffusion","type":"affects","why":"ADH inserts aquaporin-2 channels into the apical membrane, letting water cross by channel-mediated passive transport down its osmotic gradient."},{"s":"adh","t":"blood-pressure","type":"affects","why":"By retaining free water, and at high levels by constricting arterioles through V1 receptors, ADH raises blood volume and pressure."},{"s":"adh","t":"renal-system","type":"part-of","why":"ADH acts on the collecting duct and is the kidney's main control of water excretion."},{"s":"adh","t":"raas","type":"contrasts","why":"ADH reabsorbs water alone and lowers plasma osmolarity, while aldosterone reabsorbs Na⁺ with water following, raising volume with little osmolarity change."},{"s":"renal-acid-base","t":"ph-homeostasis","type":"affects","why":"By reclaiming filtered HCO₃⁻ and excreting H⁺ as NH₄⁺ and phosphate, the kidneys set plasma bicarbonate, the metabolic side of blood pH."},{"s":"renal-acid-base","t":"breathing-control","type":"contrasts","why":"Respiratory compensation adjusts CO₂ within minutes, whereas renal compensation adjusts HCO₃⁻ over days but can be more complete and sustained."},{"s":"renal-acid-base","t":"renal-system","type":"part-of","why":"Renal acid–base handling is the kidney's slow but powerful contribution to pH control."},{"s":"digestive-system","t":"insulin-glucagon","type":"affects","why":"Absorbed glucose and gut incretins such as GLP-1 and GIP stimulate insulin release, so oral glucose raises insulin more than the same glucose given intravenously."},{"s":"digestive-system","t":"ph-homeostasis","type":"affects","why":"Vomiting loses gastric HCl and causes metabolic alkalosis, while diarrhea loses bicarbonate-rich intestinal fluid and causes metabolic acidosis."},{"s":"digestive-system","t":"motivation-attitudes","type":"affects","why":"Ghrelin from the empty stomach signals hunger and CCK signals satiety, acting through vagal and hypothalamic pathways, a biological basis for hunger as a motivating drive."},{"s":"enteric-ns","t":"nervous-system","type":"contrasts","why":"Unlike most peripheral neurons, enteric neurons form complete reflex circuits of sensory neurons, interneurons and motor neurons inside the gut wall without the CNS."},{"s":"enteric-ns","t":"digestive-system","type":"part-of","why":"The enteric nervous system is the gut's own neural network that coordinates motility and secretion."},{"s":"enteric-ns","t":"small-intestine","type":"affects","why":"Enteric reflexes drive peristalsis and segmentation, mixing chyme with enzymes and moving it along the intestine for absorption."},{"s":"oral-digestion","t":"polysaccharides","type":"affects","why":"Salivary α-amylase starts hydrolyzing starch's α-1,4 bonds into maltose and dextrins; it cannot cut α-1,6 branch points or cellulose's β-1,4 bonds."},{"s":"oral-digestion","t":"digestive-system","type":"part-of","why":"The mouth is the first stage of the digestive tract, where mechanical and starch digestion begin."},{"s":"oral-digestion","t":"stomach","type":"contrasts","why":"Salivary amylase works near neutral pH and is inactivated by gastric acid, whereas pepsin needs pH 1–2; each enzyme's pH optimum matches its compartment."},{"s":"oral-digestion","t":"brush-border","type":"prerequisite","why":"Amylase cuts starch only to maltose and short oligosaccharides; brush-border maltase and isomaltase must finish them to absorbable glucose."},{"s":"stomach","t":"peptide-hydrolysis","type":"affects","why":"Pepsin, active at low pH, catalyzes hydrolysis of peptide bonds, preferring those near aromatic and hydrophobic residues, which begins protein breakdown."},{"s":"stomach","t":"ph-denaturation","type":"affects","why":"Gastric HCl at pH 1–2 denatures dietary proteins, unfolding them so peptide bonds become accessible to pepsin."},{"s":"stomach","t":"digestive-system","type":"part-of","why":"The stomach is the digestive organ that stores food, adds acid and starts protein digestion."},{"s":"stomach","t":"pancreatic-juice","type":"affects","why":"Acidic chyme entering the duodenum triggers secretin, which makes pancreatic ducts release bicarbonate to neutralize it."},{"s":"small-intestine","t":"lipoproteins","type":"affects","why":"Enterocytes rebuild absorbed fatty acids and monoacylglycerols into TAG and package them as chylomicrons, which enter lacteals and lymph instead of the portal vein."},{"s":"small-intestine","t":"lipid-metabolism","type":"affects","why":"Enterocytes reassemble absorbed fatty acids and monoglycerides into triglycerides and package them in chylomicrons, the route by which dietary fat enters the body's lipid metabolism."},{"s":"small-intestine","t":"digestive-system","type":"part-of","why":"The small intestine is where most digestion and nearly all nutrient absorption occur."},{"s":"small-intestine","t":"liver-gallbladder","type":"affects","why":"Absorbed sugars, amino acids and drugs travel by the hepatic portal vein to the liver first, so it processes them before systemic circulation (first-pass metabolism)."},{"s":"brush-border","t":"zymogens","type":"affects","why":"Enteropeptidase on the duodenal brush border cleaves trypsinogen to trypsin, which then activates the other pancreatic zymogens."},{"s":"brush-border","t":"small-intestine","type":"part-of","why":"Brush-border enzymes on intestinal microvilli complete carbohydrate and protein digestion at the absorptive surface."},{"s":"brush-border","t":"large-intestine","type":"affects","why":"Lactose left undigested by deficient lactase reaches the colon, where bacteria ferment it into gas and it draws water osmotically, causing diarrhea."},{"s":"bile-salts","t":"triacylglycerols","type":"affects","why":"Bile salts emulsify TAG into small droplets and micelles, multiplying the surface area for pancreatic lipase without breaking any ester bonds themselves."},{"s":"bile-salts","t":"fat-soluble-vitamins","type":"affects","why":"Fat-soluble vitamins are absorbed only inside bile-salt micelles, so bile obstruction or fat malabsorption causes deficiencies such as bleeding from low vitamin K."},{"s":"bile-salts","t":"clotting","type":"affects","why":"Without bile salts, fat-soluble vitamin K is poorly absorbed, impairing synthesis of functional clotting factors II, VII, IX and X."},{"s":"bile-salts","t":"small-intestine","type":"part-of","why":"Bile salts are released into the duodenum, where they emulsify fat for digestion and absorption."},{"s":"bile-salts","t":"pancreatic-juice","type":"affects","why":"Emulsification greatly increases the oil–water surface area where pancreatic lipase, aided by colipase, acts."},{"s":"pancreatic-juice","t":"peptide-hydrolysis","type":"affects","why":"Trypsin, chymotrypsin and carboxypeptidase catalyze hydrolysis of peptide bonds at specific residues, breaking proteins into small peptides and amino acids."},{"s":"pancreatic-juice","t":"triacylglycerols","type":"affects","why":"Pancreatic lipase, anchored at the droplet surface by colipase, cleaves TAGs at positions 1 and 3, giving free fatty acids and 2-monoacylglycerol for absorption."},{"s":"pancreatic-juice","t":"insulin-glucagon","type":"contrasts","why":"Acinar cells secrete enzymes through ducts into the gut (exocrine), whereas islet cells release insulin and glucagon into blood (endocrine)."},{"s":"pancreatic-juice","t":"small-intestine","type":"part-of","why":"Pancreatic juice empties into the duodenum and supplies most of the small intestine's digestive enzymes and bicarbonate."},{"s":"large-intestine","t":"clotting","type":"affects","why":"Colonic bacteria make vitamin K₂, adding to dietary vitamin K, the cofactor needed to carboxylate clotting factors II, VII, IX and X into functional forms."},{"s":"large-intestine","t":"digestive-system","type":"part-of","why":"The large intestine is the final segment of the tract, absorbing water and housing the gut microbiome."},{"s":"large-intestine","t":"innate-immunity","type":"affects","why":"Commensal gut bacteria occupy niches and nutrients that pathogens need, so antibiotics that disrupt them can allow overgrowth such as C. difficile."},{"s":"liver-gallbladder","t":"lipoproteins","type":"affects","why":"The liver packages its TAG and cholesterol into VLDL and takes back LDL and HDL cholesterol, making it the hub of lipoprotein traffic."},{"s":"liver-gallbladder","t":"urea-cycle","type":"affects","why":"Only the liver runs the full urea cycle, so liver failure lets ammonia build up and can cause hepatic encephalopathy."},{"s":"liver-gallbladder","t":"clotting","type":"affects","why":"The liver synthesizes most clotting factors, so liver failure prolongs clotting time."},{"s":"liver-gallbladder","t":"digestive-system","type":"part-of","why":"The liver and gallbladder are accessory digestive organs that make, store and release bile."},{"s":"liver-gallbladder","t":"bile-salts","type":"affects","why":"Hepatocytes synthesize bile salts from cholesterol and the gallbladder concentrates them, so liver or bile-duct disease impairs fat digestion."},{"s":"liver-gallbladder","t":"starling-forces","type":"affects","why":"The liver makes albumin, so liver failure lowers plasma oncotic pressure, letting fluid leak into tissues as edema and ascites."},{"s":"liver-gallbladder","t":"depressants","type":"affects","why":"The liver clears alcohol with alcohol dehydrogenase and many sedatives with cytochrome P450 enzymes, so liver function sets how long these depressants act."},{"s":"immune-system","t":"endocrine-system","type":"affects","why":"Inflammatory cytokines such as IL-1 activate the hypothalamic–pituitary–adrenal axis, and the resulting cortisol in turn suppresses inflammation."},{"s":"immune-system","t":"respiratory-system","type":"affects","why":"In allergic asthma, IgE-primed mast cells release histamine and leukotrienes that constrict bronchioles and inflame the airways."},{"s":"innate-immunity","t":"cardiovascular-system","type":"affects","why":"Inflammatory mediators such as histamine dilate arterioles and make capillaries leaky, producing redness, heat and swelling and letting leukocytes enter tissue."},{"s":"innate-immunity","t":"immune-system","type":"part-of","why":"Innate immunity is the fast, nonspecific arm of the immune system."},{"s":"innate-immunity","t":"hypothalamus","type":"affects","why":"Pyrogens such as IL-1 and TNF-α trigger prostaglandin E₂ production in the hypothalamus, which raises the temperature set point and causes fever."},{"s":"phagocytes","t":"ppp","type":"affects","why":"NADPH oxidase uses NADPH to turn O₂ into superoxide during the respiratory burst; phagocytes regenerate that NADPH by increasing flux through the oxidative pentose phosphate pathway."},{"s":"phagocytes","t":"innate-immunity","type":"part-of","why":"Macrophages and neutrophils are the main innate cells that engulf and destroy microbes."},{"s":"phagocytes","t":"helper-t","type":"affects","why":"Macrophages display peptides from engulfed microbes on MHC II, letting CD4⁺ T cells recognize the antigen and become activated."},{"s":"complement","t":"membranes","type":"affects","why":"The membrane attack complex inserts pores into pathogen lipid bilayers, destroying the osmotic barrier so the cell swells and lyses."},{"s":"complement","t":"innate-immunity","type":"part-of","why":"Complement is an innate plasma-protein cascade that tags and lyses pathogens."},{"s":"complement","t":"phagocytes","type":"affects","why":"C3b coats microbes and phagocytes bind it through complement receptors, greatly increasing engulfment (opsonization); C5a draws neutrophils to the site."},{"s":"nk-cells","t":"innate-immunity","type":"part-of","why":"NK cells are innate lymphocytes that kill infected and tumor cells without prior sensitization."},{"s":"nk-cells","t":"phagocytes","type":"affects","why":"NK cells secrete interferon-γ, which activates macrophages to kill engulfed microbes more effectively."},{"s":"nk-cells","t":"cytotoxic-t","type":"contrasts","why":"Both kill with perforin and granzymes, but cytotoxic T cells need a foreign peptide on MHC I, while NK cells attack cells that have lost MHC I."},{"s":"dendritic-cells","t":"innate-immunity","type":"part-of","why":"Dendritic cells are innate sentinels that capture antigen and carry it to lymph nodes."},{"s":"dendritic-cells","t":"helper-t","type":"affects","why":"Dendritic cells carry antigen to lymph nodes and present it on MHC II with costimulatory B7 molecules, the signal pair that activates naive CD4⁺ T cells."},{"s":"dendritic-cells","t":"cytotoxic-t","type":"affects","why":"Through cross-presentation, dendritic cells load peptides from engulfed infected cells onto MHC I, priming naive CD8⁺ T cells against viruses that never infected the dendritic cell."},{"s":"adaptive-immunity","t":"immune-system","type":"part-of","why":"Adaptive immunity is the antigen-specific arm of the immune system that builds memory."},{"s":"adaptive-immunity","t":"innate-immunity","type":"contrasts","why":"Adaptive responses use highly specific, randomly generated receptors and build memory, while innate responses use fixed pattern receptors and respond the same each time."},{"s":"adaptive-immunity","t":"phagocytes","type":"affects","why":"Antibodies opsonize microbes for phagocytosis and helper T cell interferon-γ activates macrophages, so adaptive responses make innate killing more effective."},{"s":"b-cells","t":"rough-er","type":"affects","why":"As B cells become plasma cells they greatly expand their rough ER to synthesize and secrete large amounts of antibody."},{"s":"b-cells","t":"adaptive-immunity","type":"part-of","why":"B cells are the lymphocytes of humoral adaptive immunity."},{"s":"b-cells","t":"helper-t","type":"contrasts","why":"B cells recognize intact antigen with surface antibody, while helper T cells recognize only processed peptide displayed on MHC II."},{"s":"antibodies","t":"gel-electrophoresis","type":"applies-to","why":"In Western blotting, proteins separated by gel electrophoresis are transferred to a membrane and identified with labeled antibodies that bind a specific epitope."},{"s":"antibodies","t":"complement","type":"affects","why":"IgM and IgG bound to a microbe recruit C1, starting the classical complement pathway."},{"s":"antibodies","t":"b-cells","type":"part-of","why":"Antibodies are the secreted form of the B-cell receptor, made by plasma cells."},{"s":"helper-t","t":"adaptive-immunity","type":"part-of","why":"Helper T cells coordinate adaptive responses by activating B cells, cytotoxic T cells and macrophages."},{"s":"helper-t","t":"antibodies","type":"affects","why":"Helper T cell CD40L and cytokines drive B cells to class switch from IgM to IgG, IgA or IgE and to undergo affinity maturation."},{"s":"helper-t","t":"cytotoxic-t","type":"affects","why":"Helper T cells secrete IL-2 and other cytokines that help naive CD8⁺ cells proliferate and form durable memory."},{"s":"cytotoxic-t","t":"membranes","type":"affects","why":"Perforin inserts into the target cell's membrane, forming pores through which granzymes enter and activate caspases to trigger apoptosis."},{"s":"cytotoxic-t","t":"insulin-glucagon","type":"affects","why":"In type 1 diabetes, autoreactive T cells, with CD8⁺ cytotoxic cells as key effectors, destroy pancreatic β cells, causing absolute insulin deficiency."},{"s":"cytotoxic-t","t":"adaptive-immunity","type":"part-of","why":"Cytotoxic T cells are the effector lymphocytes of cell-mediated adaptive immunity."},{"s":"mhc","t":"nk-cells","type":"explains","why":"MHC I engages inhibitory receptors on NK cells; cells that downregulate MHC I lose this off signal and are killed."},{"s":"mhc","t":"adaptive-immunity","type":"part-of","why":"MHC molecules present antigen and so determine what T cells of the adaptive system can recognize."},{"s":"mhc","t":"helper-t","type":"explains","why":"CD4 binds MHC II, so helper T cells respond only to peptides displayed by professional antigen-presenting cells."},{"s":"mhc","t":"cytotoxic-t","type":"explains","why":"CD8 binds MHC I, which nearly every nucleated cell displays, so cytotoxic T cells can survey and kill any infected body cell."},{"s":"clonal-selection","t":"adaptive-immunity","type":"part-of","why":"Clonal selection is the principle by which adaptive immunity expands only antigen-specific lymphocytes."},{"s":"clonal-selection","t":"b-cells","type":"applies-to","why":"Only the B cell clones whose receptors bind an antigen are activated to proliferate into plasma cells and memory cells."},{"s":"clonal-selection","t":"immune-responses","type":"prerequisite","why":"The secondary response is faster because the primary response expanded the selected clone and left many memory cells of that specificity."},{"s":"immune-responses","t":"adaptive-immunity","type":"part-of","why":"Primary and secondary responses describe how adaptive immunity changes with repeated exposure."},{"s":"immune-responses","t":"antibodies","type":"affects","why":"Primary responses are dominated by low-affinity IgM, whereas secondary responses produce mainly class-switched, higher-affinity IgG."},{"s":"immune-responses","t":"reproductive-system","type":"affects","why":"An Rh⁻ mother is usually sensitized at a first Rh⁺ delivery; in a later Rh⁺ pregnancy her secondary IgG response crosses the placenta and destroys fetal red cells."},{"s":"reproductive-system","t":"cardiovascular-system","type":"affects","why":"Pregnancy raises maternal blood volume by roughly 40–50% and cardiac output by roughly 30–50% to perfuse the uterus and placenta."},{"s":"reproductive-system","t":"hypothalamus","type":"affects","why":"Gonadal estrogen, progesterone and testosterone feed back on hypothalamic GnRH neurons, adjusting GnRH pulses and therefore FSH and LH release."},{"s":"spermatogenesis","t":"point-mutations","type":"affects","why":"Spermatogonia keep dividing by mitosis throughout adult life, so older fathers pass on more new (de novo) point mutations from accumulated replication errors."},{"s":"spermatogenesis","t":"reproductive-system","type":"part-of","why":"Spermatogenesis is male gamete production in the testes."},{"s":"spermatogenesis","t":"oogenesis","type":"contrasts","why":"Spermatogenesis is continuous from puberty and yields four sperm per meiosis, while oogenesis starts before birth, pauses twice and yields one egg."},{"s":"oogenesis","t":"nondisjunction","type":"affects","why":"Primary oocytes stay arrested in prophase I for decades, and the risk of meiotic nondisjunction (e.g. trisomy 21) rises with maternal age."},{"s":"oogenesis","t":"reproductive-system","type":"part-of","why":"Oogenesis is female gamete production in the ovaries."},{"s":"oogenesis","t":"ovarian-cycle","type":"prerequisite","why":"Each cycle's LH surge makes one arrested primary oocyte finish meiosis I, so the arrest points explain what is released at ovulation."},{"s":"ovarian-cycle","t":"reproductive-system","type":"part-of","why":"The ovarian cycle is the monthly maturation and release of an oocyte in the female reproductive system."},{"s":"ovarian-cycle","t":"fertilization","type":"prerequisite","why":"Ovulation releases a secondary oocyte that remains fertilizable only about a day, which defines when fertilization can occur."},{"s":"ovarian-cycle","t":"placenta","type":"prerequisite","why":"Corpus luteum progesterone sustains early pregnancy until the placenta takes over steroid production during the first trimester, roughly weeks 8–10."},{"s":"menstrual-hormones","t":"transcription-factors","type":"affects","why":"Estrogen and progesterone bind intracellular receptors that act as transcription factors, switching on endometrial genes for growth and secretion."},{"s":"menstrual-hormones","t":"anterior-pituitary","type":"affects","why":"High, sustained late-follicular estrogen switches from negative to positive feedback on the hypothalamus and anterior pituitary, producing the LH surge."},{"s":"menstrual-hormones","t":"ovarian-cycle","type":"part-of","why":"The hormonal feedback between hypothalamus, pituitary and ovary drives each phase of the ovarian cycle."},{"s":"menstrual-hormones","t":"cleavage-implantation","type":"affects","why":"Progesterone converts the endometrium to a secretory, glycogen-rich lining that allows the blastocyst to implant."},{"s":"fertilization","t":"mitochondria","type":"affects","why":"The egg supplies nearly all of the zygote's mitochondria and the few sperm mitochondria that enter are normally destroyed, so mitochondrial DNA is inherited maternally."},{"s":"fertilization","t":"meiosis","type":"affects","why":"Sperm entry triggers the secondary oocyte, arrested in metaphase II, to complete meiosis II and release the second polar body."},{"s":"fertilization","t":"reproductive-system","type":"part-of","why":"Fertilization joins sperm and oocyte, the event that starts development."},{"s":"fertilization","t":"cleavage-implantation","type":"prerequisite","why":"Fusion of the pronuclei creates the diploid zygote whose first mitotic divisions begin cleavage."},{"s":"cleavage-implantation","t":"cell-cycle","type":"contrasts","why":"Cleavage divisions occur without cell growth between them, so blastomeres shrink each round, unlike a typical cycle in which G1 and G2 restore size."},{"s":"cleavage-implantation","t":"reproductive-system","type":"part-of","why":"Cleavage and implantation are the first week of embryonic development."},{"s":"cleavage-implantation","t":"gastrulation","type":"prerequisite","why":"Gastrulation reorganizes cells derived from the inner cell mass into the three germ layers after implantation."},{"s":"cleavage-implantation","t":"placenta","type":"prerequisite","why":"The blastocyst's trophoblast invades the endometrium, becomes the chorion and fetal placenta, and starts secreting hCG."},{"s":"gastrulation","t":"cardiovascular-system","type":"explains","why":"The heart, blood vessels and blood cells all arise from mesoderm formed during gastrulation."},{"s":"gastrulation","t":"digestive-system","type":"explains","why":"Endoderm forms the epithelial lining of the gut and the liver and pancreas, while mesoderm supplies the gut's smooth muscle and connective tissue."},{"s":"gastrulation","t":"reproductive-system","type":"part-of","why":"Gastrulation is the developmental stage that forms the three germ layers."},{"s":"neurulation","t":"nervous-system","type":"explains","why":"The neural tube becomes the brain and spinal cord, while neural crest cells form peripheral sensory and autonomic ganglia and Schwann cells."},{"s":"neurulation","t":"adrenal-medulla","type":"explains","why":"Adrenal medulla chromaffin cells come from neural crest, which is why they behave like postganglionic sympathetic neurons and secrete catecholamines."},{"s":"neurulation","t":"gastrulation","type":"part-of","why":"Neurulation follows gastrulation as ectoderm, induced by mesodermal notochord, forms the neural tube."},{"s":"placenta","t":"anterior-pituitary","type":"affects","why":"High placental estrogen and progesterone exert negative feedback on GnRH, FSH and LH, so no new follicles mature or ovulate during pregnancy."},{"s":"placenta","t":"insulin-glucagon","type":"affects","why":"Human placental lactogen and other placental hormones increase maternal insulin resistance, which can lead to gestational diabetes."},{"s":"placenta","t":"antibodies","type":"affects","why":"The placenta transports maternal IgG, but not IgM, into fetal blood, giving newborns months of passive immunity; the same transfer carries anti-Rh IgG."},{"s":"placenta","t":"reproductive-system","type":"part-of","why":"The placenta is the organ that supports and hormonally maintains pregnancy."},{"s":"placenta","t":"ovarian-cycle","type":"affects","why":"hCG acts on LH receptors to rescue the corpus luteum, preventing its usual degeneration and the menstruation that would follow."},{"s":"hydrophobic-effect","t":"nonpolar-aa","type":"applies-to","why":"Nonpolar aliphatic side chains such as Val, Leu and Ile are the groups the effect pushes into the protein interior."},{"s":"hydrophobic-effect","t":"tertiary","type":"explains","why":"Burying nonpolar side chains in the core, away from water, is the main driving force that sets a protein's tertiary fold."},{"s":"hydrophobic-effect","t":"lipids","type":"explains","why":"Water excludes the nonpolar parts of lipids to free ordered water and gain entropy, driving fat droplets, micelles and bilayers to form without covalent bonds."},{"s":"hydrophobic-effect","t":"saponification","type":"explains","why":"Soap anions gather into micelles with hydrocarbon tails inward because burying the tails frees ordered water; grease dissolves in that nonpolar core and rinses away."},{"s":"hydrophobic-effect","t":"membranes","type":"explains","why":"Amphipathic phospholipids spontaneously form bilayers with their fatty acid tails hidden from water and their polar heads facing it."},{"s":"hydrophobic-effect","t":"dna-structure","type":"explains","why":"The relatively nonpolar bases are tucked inside the helix and stacked, away from water, while the charged phosphate backbone faces the solvent."},{"s":"hydrophobic-effect","t":"sickle-cell","type":"explains","why":"The Glu6→Val substitution creates a hydrophobic patch that, in deoxy-HbS, docks into a neighbor's hydrophobic pocket, driving polymerization into fibers."},{"s":"hydrophobic-effect","t":"solubility","type":"explains","why":"Nonpolar solutes dissolve poorly in water because water must order itself around them, an entropy cost that clustering avoids."},{"s":"atomic-structure","t":"bonding","type":"prerequisite","why":"Valence electron number and arrangement decide whether an atom loses, gains or shares electrons and how many bonds it forms."},{"s":"atomic-structure","t":"mass-spec","type":"applies-to","why":"Mass spectrometry separates ions by mass-to-charge ratio, resolving isotopes such as ³⁵Cl and ³⁷Cl as peaks about 3:1 in height."},{"s":"atomic-structure","t":"em-spectrum","type":"explains","why":"Electrons moving between quantized energy levels absorb or emit photons with E = hf equal to the gap, producing atomic line spectra."},{"s":"quantum-numbers","t":"atomic-structure","type":"part-of","why":"Quantum numbers specify the energy, shape and orientation of the orbitals that make up an atom's electron structure."},{"s":"quantum-numbers","t":"electron-configuration","type":"prerequisite","why":"The allowed n, l, mℓ and mₛ combinations fix subshell capacities (s 2, p 6, d 10, f 14) that the filling rules then order."},{"s":"quantum-numbers","t":"covalent-bonds","type":"prerequisite","why":"Orbital shapes set by l (spherical s, dumbbell p) determine how σ bonds form by end-on overlap and π bonds by side-by-side overlap."},{"s":"electron-configuration","t":"atomic-structure","type":"part-of","why":"Filling rules turn the allowed quantum states into each atom's ground-state electron arrangement."},{"s":"electron-configuration","t":"periodic-trends","type":"explains","why":"The valence subshell being filled and shielding by inner electrons set effective nuclear charge, which drives every periodic trend."},{"s":"electron-configuration","t":"ionization-energy","type":"explains","why":"IE dips at B and O because the removed electron is a higher-energy 2p electron or a paired 2p electron, consequences of Aufbau and Hund's rules."},{"s":"electron-configuration","t":"ionic-bonds","type":"explains","why":"Atoms gain or lose electrons to reach a noble-gas configuration, predicting ion charges such as Na⁺, Mg²⁺, Cl⁻ and O²⁻."},{"s":"periodic-trends","t":"atomic-structure","type":"part-of","why":"Periodic trends follow from how electron shells and effective nuclear charge change across the table."},{"s":"periodic-trends","t":"bonding","type":"explains","why":"Position on the table predicts whether two elements share electrons (nonmetal pairs) or transfer them (metal with nonmetal)."},{"s":"periodic-trends","t":"reduction-potentials","type":"explains","why":"Active metals at the left of the table are easily oxidized and have very negative E°red, while halogens at the right are strong oxidizing agents."},{"s":"ionization-energy","t":"periodic-trends","type":"part-of","why":"Ionization energy is one of the core periodic trends, rising across a period and falling down a group."},{"s":"ionization-energy","t":"electron-affinity","type":"contrasts","why":"IE is the energy to remove an electron and is always endothermic; EA is the energy change on adding one and is usually exothermic."},{"s":"ionization-energy","t":"ionic-bonds","type":"explains","why":"Low first ionization energies let alkali and alkaline earth metals give up electrons to form the cations of ionic compounds."},{"s":"electron-affinity","t":"periodic-trends","type":"part-of","why":"Electron affinity is a periodic trend that generally grows more favorable across a period and less favorable down a group."},{"s":"electron-affinity","t":"electronegativity","type":"contrasts","why":"EA is a measured energy change for an isolated gaseous atom, while electronegativity describes how strongly a bonded atom pulls shared electrons."},{"s":"electron-affinity","t":"ionic-bonds","type":"explains","why":"Halogens release energy on gaining an electron, offsetting part of the metal's ionization energy; the large lattice energy released supplies the rest that makes ionic solids stable."},{"s":"electronegativity","t":"etc-complexes","type":"applies-to","why":"Highly electronegative oxygen makes O₂ a strong oxidizing agent; O₂/H₂O has the chain's most positive reduction potential (≈ +0.82 V), so O₂ is the terminal electron acceptor."},{"s":"electronegativity","t":"periodic-trends","type":"part-of","why":"Electronegativity is a periodic trend that peaks at fluorine in the upper right of the table."},{"s":"electronegativity","t":"polarity","type":"explains","why":"A difference in electronegativity between bonded atoms shifts shared electrons toward one atom, creating δ⁺ and δ⁻ ends."},{"s":"electronegativity","t":"hbonds","type":"explains","why":"Only N, O and F combine high electronegativity with small size, leaving the attached H strongly δ⁺ and offering a compact lone pair to accept it."},{"s":"electronegativity","t":"nucleophiles","type":"affects","why":"Across a period, more electronegative atoms hold electrons more tightly and share them less readily, so nucleophilicity falls: NH₂⁻ > OH⁻ > F⁻."},{"s":"electronegativity","t":"carbonyl-chemistry","type":"explains","why":"Oxygen pulls electron density out of the C=O bond, leaving the carbonyl carbon δ⁺ and open to nucleophilic attack."},{"s":"atomic-radius","t":"periodic-trends","type":"part-of","why":"Atomic and ionic radius is a periodic trend that runs opposite to ionization energy and electronegativity."},{"s":"atomic-radius","t":"ionic-bonds","type":"affects","why":"Smaller ions sit closer together, so by Coulomb's law lattice energy rises: LiF is held more tightly than KI."},{"s":"atomic-radius","t":"strong-weak","type":"explains","why":"Down a group, larger atoms form longer, weaker bonds to H and larger, more stable anions, so HI is a far stronger acid than HF."},{"s":"atomic-radius","t":"leaving-groups","type":"explains","why":"Large anions like I⁻ spread their negative charge over a bigger, more polarizable volume, making them weak bases and good leaving groups."},{"s":"bonding","t":"protein-structure","type":"applies-to","why":"Covalent peptide and disulfide bonds fix primary structure and cross-links, while weaker noncovalent forces shape secondary through quaternary structure."},{"s":"bonding","t":"dna-structure","type":"applies-to","why":"Covalent phosphodiester bonds form each strand's backbone, while hydrogen bonds and base stacking hold the two strands together."},{"s":"bonding","t":"thermodynamics","type":"prerequisite","why":"Reaction enthalpies come from bonds broken (energy absorbed) and bonds formed (energy released), so bonding underlies thermochemistry."},{"s":"ionic-bonds","t":"salt-bridge","type":"explains","why":"Salt bridges are ionic attractions between oppositely charged side chains, such as Lys or Arg with Asp or Glu."},{"s":"ionic-bonds","t":"bonding","type":"part-of","why":"Ionic bonding is the electron-transfer extreme of chemical bonding."},{"s":"ionic-bonds","t":"covalent-bonds","type":"contrasts","why":"Ionic bonds transfer electrons between atoms of very different electronegativity; covalent bonds share electrons between atoms of similar electronegativity."},{"s":"ionic-bonds","t":"ksp","type":"affects","why":"Dissolving a salt means breaking its ionic lattice; whether ion hydration energy offsets that lattice energy decides how soluble the salt is, and so its Ksp."},{"s":"ionic-bonds","t":"vant-hoff-factor","type":"explains","why":"Ionic compounds separate into their component ions when dissolved, so NaCl gives i ≈ 2, while covalent molecules stay intact with i = 1."},{"s":"covalent-bonds","t":"disulfide-bond","type":"applies-to","why":"A disulfide is a covalent S–S bond between two cysteines, much stronger than the noncovalent forces elsewhere in tertiary structure."},{"s":"covalent-bonds","t":"bonding","type":"part-of","why":"Covalent bonding, the sharing of electron pairs, is the main bond type in organic and biological molecules."},{"s":"covalent-bonds","t":"bond-energies","type":"prerequisite","why":"Bond order determines bond strength: triple > double > single in dissociation energy, with the reverse order in bond length."},{"s":"covalent-bonds","t":"resonance","type":"prerequisite","why":"Resonance describes delocalized π electrons that one Lewis structure cannot show, so it builds on σ/π bonding and formal-charge rules."},{"s":"covalent-bonds","t":"ir","type":"explains","why":"Each covalent bond vibrates at a frequency set by its strength and atom masses, so C=O absorbs near 1700 cm⁻¹ and C≡N near 2250 cm⁻¹."},{"s":"coordinate-covalent","t":"enzymes","type":"applies-to","why":"Metal cofactors such as Zn²⁺ in carbonic anhydrase are held in the active site by coordinate bonds to histidine side chains."},{"s":"coordinate-covalent","t":"hemoglobin","type":"applies-to","why":"Heme Fe²⁺ accepts lone pairs from four porphyrin nitrogens, the proximal histidine and O₂, all coordinate covalent bonds."},{"s":"coordinate-covalent","t":"covalent-bonds","type":"part-of","why":"A coordinate covalent bond is a covalent bond in which one partner donates both electrons."},{"s":"polarity","t":"simple-diffusion","type":"explains","why":"Small nonpolar molecules like O₂ and CO₂ dissolve in the lipid core and cross by simple diffusion, while ions and large polar molecules need proteins."},{"s":"polarity","t":"steroid-hormones","type":"explains","why":"Nonpolar steroids pass through the plasma membrane to reach intracellular receptors but need carrier proteins to travel in watery blood."},{"s":"polarity","t":"hydrophobic-effect","type":"explains","why":"Nonpolar molecules cannot hydrogen bond with water, so water must order itself around them, which the hydrophobic effect relieves."},{"s":"polarity","t":"bonding","type":"part-of","why":"Bond and molecular polarity describe how unevenly bonds share electrons and whether those dipoles cancel."},{"s":"polarity","t":"imf","type":"prerequisite","why":"Permanent dipoles are the source of dipole–dipole forces and hydrogen bonds, so polarity must be understood first."},{"s":"polarity","t":"solubility","type":"explains","why":"Polar solvents dissolve ionic and polar solutes by surrounding them with oriented dipoles, while nonpolar solutes gain no such stabilization."},{"s":"vsepr","t":"bonding","type":"part-of","why":"VSEPR predicts the three-dimensional shapes that bonded atoms adopt."},{"s":"vsepr","t":"polarity","type":"explains","why":"Shape decides whether bond dipoles cancel: linear CO₂ is nonpolar, but bent H₂O is polar."},{"s":"vsepr","t":"chirality","type":"prerequisite","why":"A tetrahedral sp³ carbon bearing four different groups has a non-superimposable mirror image, the basis of chirality."},{"s":"vsepr","t":"carbocations","type":"explains","why":"A carbocation is sp² and trigonal planar, so a nucleophile can attack either face, which is why SN1 at a chiral center gives largely racemic products."},{"s":"imf","t":"tertiary","type":"applies-to","why":"Hydrogen bonds, dispersion forces and ion–dipole contacts between side chains all help hold a folded chain together."},{"s":"imf","t":"bonding","type":"part-of","why":"Intermolecular forces are the weak attractions between molecules that complement the strong bonds within them."},{"s":"imf","t":"enthalpy","type":"affects","why":"Stronger intermolecular forces mean larger heats of vaporization and fusion, because more energy is needed to pull molecules apart."},{"s":"imf","t":"real-gases","type":"explains","why":"Attractions tug molecules back toward their neighbors as they approach a wall, softening collisions and lowering pressure below ideal; the van der Waals a term is larger for polar gases."},{"s":"imf","t":"phases","type":"explains","why":"The stronger the intermolecular attractions relative to thermal energy, the more a substance favors condensed phases and the higher its melting and boiling points."},{"s":"imf","t":"triple-critical","type":"affects","why":"Stronger intermolecular attractions raise the critical temperature, so water (about 374 °C) can be liquefied far above where N₂ (about −147 °C) can."},{"s":"imf","t":"vapor-pressure","type":"affects","why":"Stronger attractions hold molecules in the liquid, lowering vapor pressure and raising boiling point, as water versus diethyl ether shows."},{"s":"imf","t":"surface-tension","type":"explains","why":"Cohesive forces pull surface molecules inward; water's extensive hydrogen bonding gives it an unusually high surface tension."},{"s":"dipole-dipole","t":"imf","type":"part-of","why":"Dipole–dipole attraction is one of the intermolecular forces, intermediate in strength."},{"s":"dipole-dipole","t":"hbonds","type":"prerequisite","why":"A hydrogen bond is an especially strong dipole–dipole interaction involving H on N, O or F, so the general case comes first."},{"s":"dipole-dipole","t":"london-dispersion","type":"contrasts","why":"Dipole–dipole forces need a permanent dipole, whereas dispersion forces come from fleeting induced dipoles present in every molecule."},{"s":"dipole-dipole","t":"carbonyl-chemistry","type":"applies-to","why":"The polar C=O lets aldehydes and ketones attract one another, so they boil above alkanes but below alcohols, which can hydrogen bond."},{"s":"hbonds","t":"polar-aa","type":"explains","why":"Ser, Thr, Asn and Gln side chains can donate or accept hydrogen bonds with water, which is why they are hydrophilic."},{"s":"hbonds","t":"secondary","type":"explains","why":"Backbone C=O···H–N hydrogen bonds hold α-helices (residue i to i + 4) and link adjacent strands in β-sheets."},{"s":"hbonds","t":"carbohydrates","type":"explains","why":"Many hydroxyl groups hydrogen-bond with water, making simple sugars very soluble, while long cellulose chains hydrogen-bond to each other into insoluble fibers."},{"s":"hbonds","t":"base-pairing","type":"explains","why":"A–T pairs form two hydrogen bonds and G–C pairs three, which makes pairing specific and contributes to GC-rich DNA melting at higher temperatures."},{"s":"hbonds","t":"hydrophobic-effect","type":"explains","why":"Water's hydrogen-bond network is what must reorganize around nonpolar surfaces, so its disruption drives nonpolar groups together."},{"s":"hbonds","t":"imf","type":"part-of","why":"Hydrogen bonding is the strongest of the common intermolecular forces."},{"s":"hbonds","t":"phase-changes","type":"explains","why":"Water's extensive hydrogen bonding gives it an unusually large heat of vaporization, so evaporating sweat removes much heat."},{"s":"hbonds","t":"phase-diagrams","type":"explains","why":"Hydrogen bonds lock ice into an open hexagonal lattice that is less dense than liquid water, giving water its negative solid–liquid slope."},{"s":"hbonds","t":"heat-capacity","type":"explains","why":"Much of the heat added to water goes into bending and breaking hydrogen bonds, giving it a high specific heat of 4.18 J/(g·K)."},{"s":"hbonds","t":"ir","type":"affects","why":"Hydrogen bonding broadens the O–H stretch of alcohols and carboxylic acids into a wide band rather than a sharp peak."},{"s":"london-dispersion","t":"fatty-acids","type":"explains","why":"Straight saturated chains maximize contact and dispersion forces, so they melt higher, while cis double bonds kink chains, reduce contact and lower the melting point."},{"s":"london-dispersion","t":"phospholipids","type":"affects","why":"Straight saturated tails pack closely and maximize dispersion contacts, making membranes less fluid; cis double bonds kink tails and loosen packing."},{"s":"london-dispersion","t":"hydrophobic-effect","type":"contrasts","why":"Dispersion forces are direct attractions between molecules, while the hydrophobic effect is driven mainly by the entropy of surrounding water."},{"s":"london-dispersion","t":"imf","type":"part-of","why":"London dispersion forces are the weakest but most universal intermolecular force."},{"s":"stoichiometry","t":"po-ratio","type":"applies-to","why":"P/O ratios (about 2.5 ATP per O atom for NADH, 1.5 for FADH₂) are stoichiometric ratios linking electron flow to ATP synthesis."},{"s":"stoichiometry","t":"equilibrium","type":"prerequisite","why":"Writing K expressions and ICE tables relies on the mole ratios given by the balanced equation."},{"s":"stoichiometry","t":"faraday","type":"applies-to","why":"Faraday's law is stoichiometry with electrons: moles of e⁻ from the charge passed convert to moles of product via the half-reaction."},{"s":"stoichiometry","t":"titration","type":"applies-to","why":"At the equivalence point the moles of titrant added match the analyte's moles by the reaction's mole ratio."},{"s":"balancing-reactions","t":"electron-carriers","type":"applies-to","why":"NAD⁺ + 2e⁻ + H⁺ → NADH is a reduction half-reaction, so tracking electrons shows which metabolic substrates are being oxidized."},{"s":"balancing-reactions","t":"stoichiometry","type":"part-of","why":"A correctly balanced equation is the source of every mole ratio used in stoichiometry."},{"s":"balancing-reactions","t":"electrochemistry","type":"prerequisite","why":"Splitting a redox reaction into half-reactions identifies the oxidation at the anode and the reduction at the cathode."},{"s":"balancing-reactions","t":"faraday","type":"prerequisite","why":"The balanced half-reaction gives the electrons needed per atom or ion, the conversion factor between charge and product."},{"s":"balancing-reactions","t":"alcohol-oxidation","type":"applies-to","why":"Oxidation-state counting shows primary alcohol → aldehyde → carboxylic acid as successive two-electron oxidations of the same carbon."},{"s":"limiting-reagent","t":"stoichiometry","type":"part-of","why":"Finding the limiting reagent and yield is a core stoichiometry calculation."},{"s":"limiting-reagent","t":"keq","type":"contrasts","why":"A limiting reagent is fully consumed only in reactions that go to completion; reversible reactions stop at equilibrium, where K sets the yield."},{"s":"limiting-reagent","t":"titration","type":"applies-to","why":"Before equivalence the added titrant is limiting and fully consumed, so the pH reflects the leftover analyte (plus, for a weak acid, the conjugate base formed)."},{"s":"equilibrium","t":"michaelis-menten","type":"applies-to","why":"E + S ⇌ ES is reversible, but Km equals the dissociation constant k₋₁/k₁ only when catalysis is much slower than ES dissociation (k₂ ≪ k₋₁)."},{"s":"equilibrium","t":"hemoglobin","type":"applies-to","why":"O₂ loading is a reversible binding equilibrium, so saturation depends on PO₂ and shifts with H⁺, CO₂ and 2,3-BPG."},{"s":"equilibrium","t":"acid-base","type":"prerequisite","why":"Ka, Kb and Kw are equilibrium constants, and buffer behavior is Le Chatelier's principle applied to proton transfer."},{"s":"keq","t":"equilibrium","type":"part-of","why":"The equilibrium constant quantifies where a reversible reaction settles."},{"s":"keq","t":"le-chatelier","type":"prerequisite","why":"Comparing Q with K is the quantitative version of Le Chatelier's predictions."},{"s":"keq","t":"ksp","type":"prerequisite","why":"Ksp is Keq for dissolving a salt, with the pure solid left out of the expression."},{"s":"keq","t":"ka","type":"prerequisite","why":"Ka is simply Keq for acid dissociation, with water omitted because it is the solvent."},{"s":"le-chatelier","t":"trna-charging","type":"explains","why":"Pyrophosphatase hydrolyzes the PPi released during amino acid activation, removing a product and pulling tRNA charging forward."},{"s":"le-chatelier","t":"bohr-effect","type":"applies-to","why":"H⁺ binds deoxy-Hb more tightly than oxy-Hb (stabilizing the T state), so the linked equilibrium HbO₂ + H⁺ ⇌ HbH⁺ + O₂ shifts right as acidity rises, releasing O₂."},{"s":"le-chatelier","t":"ph-homeostasis","type":"explains","why":"Hyperventilation removes CO₂, pulling CO₂ + H₂O ⇌ H⁺ + HCO₃⁻ to the left, consuming H⁺ and raising blood pH."},{"s":"le-chatelier","t":"equilibrium","type":"part-of","why":"Le Chatelier's principle predicts how an equilibrium responds when it is disturbed."},{"s":"le-chatelier","t":"common-ion","type":"explains","why":"Adding an ion that is a product of the dissolution equilibrium shifts it back toward the undissolved solid."},{"s":"le-chatelier","t":"phase-diagrams","type":"explains","why":"Raising pressure favors the denser phase; because liquid water is denser than ice, compression shifts ice toward melting."},{"s":"ksp","t":"parathyroid","type":"applies-to","why":"Calcium phosphate is sparingly soluble, so high phosphate lowers free Ca²⁺; PTH's renal phosphate excretion keeps phosphate released from bone from blunting the Ca²⁺ rise."},{"s":"ksp","t":"equilibrium","type":"part-of","why":"The solubility product is the equilibrium constant for a dissolving ionic solid."},{"s":"ksp","t":"strong-weak","type":"contrasts","why":"Low solubility is not weak ionization: AgCl has a tiny Ksp, yet the little that dissolves dissociates completely, so it is still a strong electrolyte."},{"s":"common-ion","t":"ksp","type":"part-of","why":"The common-ion effect describes how shared ions shift solubility equilibria governed by Ksp."},{"s":"common-ion","t":"ph-poh","type":"affects","why":"Adding sodium acetate to acetic acid suppresses its ionization, lowering [H⁺] and raising the pH."},{"s":"common-ion","t":"buffers","type":"explains","why":"In a buffer the conjugate base suppresses the weak acid's ionization, so both HA and A⁻ remain at roughly their mixed amounts."},{"s":"thermodynamics","t":"active-transport","type":"explains","why":"Moving a solute against its concentration or electrical gradient has positive ΔG, so the pump must couple it to ATP hydrolysis."},{"s":"thermodynamics","t":"glycolysis","type":"applies-to","why":"The hexokinase, PFK-1 and pyruvate kinase steps have large negative ΔG in cells, making them the irreversible, regulated points."},{"s":"thermodynamics","t":"equilibrium","type":"prerequisite","why":"Free energy determines equilibrium position through ΔG° = −RT ln K, so thermodynamics underlies equilibrium."},{"s":"thermodynamics","t":"electrochemistry","type":"prerequisite","why":"Cell spontaneity is a free-energy statement, ΔG° = −nFE°, so electrochemistry builds on thermodynamics."},{"s":"enthalpy","t":"lipid-metabolism","type":"applies-to","why":"Fats release about 9 kcal/g when oxidized versus about 4 kcal/g for carbohydrates, because their carbons are more reduced."},{"s":"enthalpy","t":"le-chatelier","type":"prerequisite","why":"The sign of ΔH tells which way heating shifts an equilibrium and whether K rises or falls with temperature."},{"s":"enthalpy","t":"thermodynamics","type":"part-of","why":"Enthalpy is the heat term in thermodynamics."},{"s":"enthalpy","t":"gibbs","type":"prerequisite","why":"ΔH is one of the two terms in ΔG = ΔH − TΔS."},{"s":"entropy","t":"simple-diffusion","type":"explains","why":"Solutes spread down concentration gradients because the evenly mixed state has far more microstates; no energy input is required."},{"s":"entropy","t":"dna-melting","type":"affects","why":"Separating the strands increases disorder, so higher temperature makes the −TΔS term dominate and favors melting."},{"s":"entropy","t":"hydrophobic-effect","type":"explains","why":"Releasing ordered water from nonpolar surfaces raises solvent entropy, making clustering favorable even with ΔH near zero."},{"s":"entropy","t":"thermodynamics","type":"part-of","why":"Entropy is the dispersal term in thermodynamics and the subject of the second law."},{"s":"entropy","t":"gibbs","type":"prerequisite","why":"The TΔS term is half of the free energy equation."},{"s":"entropy","t":"phases","type":"explains","why":"Gases have far more microstates than liquids, and liquids than solids, so rising temperature makes the TΔS term favor the less ordered phases."},{"s":"entropy","t":"colligative","type":"explains","why":"Dissolved solute raises the solvent's entropy and lowers its chemical potential, reducing its tendency to vaporize, freeze or cross a membrane."},{"s":"gibbs","t":"folding","type":"explains","why":"Folding proceeds when ΔG = ΔH − TΔS < 0: the solvent entropy gained and new noncovalent contacts outweigh the chain's lost conformational entropy."},{"s":"gibbs","t":"atp","type":"explains","why":"ATP hydrolysis has ΔG°′ ≈ −30.5 kJ/mol and a more negative ΔG in cells, enough to drive unfavorable reactions it is coupled to."},{"s":"gibbs","t":"bypass-reactions","type":"explains","why":"Glycolysis's three steps with large negative ΔG cannot simply run backward, so gluconeogenesis needs separate enzymes to bypass them."},{"s":"gibbs","t":"keq","type":"explains","why":"ΔG° = −RT ln K, so a negative ΔG° means K > 1, and ΔG = 0 when the system reaches equilibrium."},{"s":"gibbs","t":"thermodynamics","type":"part-of","why":"Gibbs free energy combines enthalpy and entropy into the single criterion for spontaneity."},{"s":"gibbs","t":"kinetics","type":"contrasts","why":"ΔG says whether a reaction can proceed, while kinetics says how fast; they are set by different features of the energy diagram."},{"s":"gibbs","t":"phase-changes","type":"explains","why":"At the transition temperature ΔG = 0, so T = ΔH/ΔS; above it the TΔS term favors the higher-entropy phase."},{"s":"standard-state","t":"thermodynamics","type":"part-of","why":"Standard state conditions define the reference point for tabulated thermodynamic values."},{"s":"standard-state","t":"gibbs","type":"prerequisite","why":"ΔG° and ΔG°′ are values at standard concentrations; real ΔG differs from them by RT ln Q."},{"s":"standard-state","t":"reduction-potentials","type":"prerequisite","why":"Tabulated E° values assume 1 M, 1 atm and 25 °C, and biochemical E°′ values also fix pH at 7."},{"s":"hess-law","t":"hexokinase","type":"applies-to","why":"Free energies add like Hess's law: glucose + Pi → G6P (+13.8 kJ/mol) plus ATP hydrolysis (−30.5) gives a favorable −16.7 kJ/mol."},{"s":"hess-law","t":"enthalpy","type":"part-of","why":"Hess's law is a method for calculating reaction enthalpies."},{"s":"hess-law","t":"bond-energies","type":"contrasts","why":"Hess's law with heats of formation gives exact ΔH values, while bond-energy sums give estimates because tabulated bond energies are averages."},{"s":"bond-energies","t":"thermal-denaturation","type":"explains","why":"Heat disrupts weak noncovalent interactions long before it can break covalent peptide bonds, so denaturation leaves primary structure intact."},{"s":"bond-energies","t":"atp","type":"explains","why":"Breaking a bond always costs energy, so ATP hydrolysis releases energy only because its products are more stabilized by resonance, solvation and reduced charge repulsion."},{"s":"bond-energies","t":"enthalpy","type":"part-of","why":"Bond dissociation energies are one way to estimate reaction enthalpy."},{"s":"kinetics","t":"enzymes","type":"applies-to","why":"Enzymes speed reactions by lowering activation energy, without changing ΔG or Keq, exactly as kinetic theory describes for any catalyst."},{"s":"kinetics","t":"michaelis-menten","type":"prerequisite","why":"Rate laws and reaction order are needed to see why enzyme rate is first order in [S] at low [S] and approaches zero order at saturation."},{"s":"kinetics","t":"equilibrium","type":"explains","why":"Dynamic equilibrium is reached when forward and reverse rates become equal, so for an elementary step K = k_forward / k_reverse."},{"s":"rate-laws","t":"kinetics","type":"part-of","why":"Rate laws express how reaction rate depends on concentration."},{"s":"rate-laws","t":"sn1","type":"applies-to","why":"SN1 has rate = k[substrate] because the slow step is ionization to a carbocation; the nucleophile enters only
