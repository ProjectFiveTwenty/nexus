ne, lysosomes or the endomembrane system. An N-terminal signal sequence is recognized by the signal recognition particle (SRP), which docks the ribosome on the ER so the chain is threaded into the lumen or membrane during translation. In the lumen, chaperones aid folding, disulfide bonds form, and N-linked glycosylation begins.","trap":null},{"id":"smooth-er","title":"Smooth endoplasmic reticulum","section":"bb","disc":"Cell & Molecular Bio","parent":"organelles","hub":false,"summary":"The smooth ER lacks ribosomes and synthesizes lipids, including phospholipids and steroid hormones, so it is abundant in adrenal cortex and gonad cells. In liver cells it detoxifies drugs with cytochrome P450 enzymes, and the liver ER membrane holds glucose-6-phosphatase, which frees glucose for release into blood. In muscle, a specialized form called the sarcoplasmic reticulum stores Ca²⁺ and releases it to trigger contraction.","trap":null},{"id":"golgi","title":"Golgi apparatus","section":"bb","disc":"Cell & Molecular Bio","parent":"organelles","hub":false,"summary":"The Golgi receives ER products at its cis face, modifies them as they move through medial and trans cisternae, and ships them from the trans face. It trims and extends N-linked sugars, adds O-linked glycans to serine and threonine, and tags lysosomal enzymes with mannose-6-phosphate. Sorted vesicles go to lysosomes, to the plasma membrane, or into secretory granules for constitutive or regulated exocytosis.","trap":"N-linked glycosylation starts in the rough ER; the Golgi modifies those sugars and adds the O-linked ones."},{"id":"lysosomes","title":"Lysosomes","section":"bb","disc":"Cell & Molecular Bio","parent":"organelles","hub":false,"summary":"Lysosomes are acidic (pH ≈ 5) sacs of hydrolases (proteases, nucleases, lipases, glycosidases) that digest material arriving by endocytosis, phagocytosis and autophagy. A V-type H⁺ ATPase keeps the lumen acidic, so enzymes that leak into the near-neutral cytosol are largely inactive. Lacking a single hydrolase causes a lysosomal storage disease, such as Tay–Sachs, in which undegraded ganglioside builds up in neurons.","trap":"Lysosomal enzymes are not made inside the lysosome; they are synthesized on the rough ER and routed there by a mannose-6-phosphate tag added in the Golgi."},{"id":"peroxisomes","title":"Peroxisomes","section":"bb","disc":"Cell & Molecular Bio","parent":"organelles","hub":false,"summary":"Peroxisomes are single-membrane organelles that run oxidation reactions producing hydrogen peroxide, which their catalase splits into water and O₂. They shorten very-long-chain fatty acids by β-oxidation before mitochondria finish the job, break down branched ones, make plasmalogens (ether phospholipids rich in myelin), and help detoxify compounds in the liver. Their matrix proteins are imported from the cytosol using a targeting signal.","trap":null},{"id":"mitochondria","title":"Mitochondria","section":"bb","disc":"Cell & Molecular Bio","parent":"organelles","hub":false,"summary":"Mitochondria are double-membrane organelles that house the pyruvate dehydrogenase complex, citric acid cycle, β-oxidation and oxidative phosphorylation, producing most of the cell's ATP. They probably descend from engulfed bacteria: they have circular DNA and bacteria-like ribosomes and divide by fission. Their DNA is inherited maternally, and releasing cytochrome c from them triggers apoptosis.","trap":"Glycolysis occurs in the cytosol, not in mitochondria; only pyruvate oxidation and later steps are mitochondrial."},{"id":"mito-compartments","title":"Mitochondrial compartments","section":"bb","disc":"Cell & Molecular Bio","parent":"mitochondria","hub":false,"summary":"The outer membrane is porous (porins pass molecules up to about 5 kDa), so the intermembrane space resembles cytosol in small solutes. The inner membrane is folded into cristae, rich in cardiolipin, and nearly impermeable to ions, letting the electron transport chain pump H⁺ into the intermembrane space to build the proton-motive force. The matrix holds PDH, TCA and β-oxidation enzymes, mtDNA and ribosomes.","trap":"Protons are pumped out of the matrix into the intermembrane space, so the matrix is the alkaline, negatively charged side and the intermembrane space is more acidic."},{"id":"cytoskeleton","title":"Cytoskeleton","section":"bb","disc":"Cell & Molecular Bio","parent":null,"hub":true,"summary":"The cytoskeleton is a network of protein polymers that gives cells shape, strength, transport tracks and movement. Microfilaments (actin, ~7 nm) drive contraction, cell crawling and cytokinesis; microtubules (tubulin, ~25 nm) form the spindle, cilia, flagella and transport tracks; intermediate filaments (~10 nm) bear tension and anchor cell junctions. Actin and microtubules are dynamic, powered by nucleotide hydrolysis and paired with motor proteins.","trap":null},{"id":"microfilaments","title":"Microfilaments (actin)","section":"bb","disc":"Cell & Molecular Bio","parent":"cytoskeleton","hub":false,"summary":"Microfilaments are helical polymers of G-actin; ATP-bound subunits add faster at the plus (barbed) end than at the minus end, and filaments constantly assemble and disassemble. They form the cell cortex, the cores of microvilli, and the protrusions used in crawling and phagocytosis. Myosin motors walk along them using ATP, powering muscle contraction and the contractile ring of cytokinesis.","trap":null},{"id":"cytokinesis","title":"Cytokinesis","section":"bb","disc":"Cell & Molecular Bio","parent":"microfilaments","hub":false,"summary":"Cytokinesis divides the cytoplasm, typically starting in late anaphase and finishing after telophase. In animal cells a contractile ring of actin and myosin II tightens beneath the plasma membrane, pinching a cleavage furrow; plant cells, with rigid walls, instead build a cell plate from Golgi-derived vesicles. Cytokinesis can be unequal, as in oogenesis, where the egg keeps almost all the cytoplasm and polar bodies get very little.","trap":null},{"id":"microtubules","title":"Microtubules","section":"bb","disc":"Cell & Molecular Bio","parent":"cytoskeleton","hub":false,"summary":"Microtubules are hollow tubes of 13 protofilaments made of α/β-tubulin dimers that bind GTP. They grow from organizing centers such as the centrosome (a pair of centrioles with nine triplets each), minus ends anchored and plus ends growing, and show dynamic instability: losing the GTP cap triggers rapid shrinking. They form the mitotic spindle, tracks for kinesin and dynein, and the 9+2 core of cilia and flagella.","trap":"Eukaryotic flagella are 9+2 microtubule structures bent by dynein, whereas bacterial flagella are flagellin filaments spun by a rotary motor driven by an ion gradient."},{"id":"motor-proteins","title":"Kinesin and dynein","section":"bb","disc":"Cell & Molecular Bio","parent":"microtubules","hub":false,"summary":"Kinesin and dynein are ATP-powered motors that walk along microtubules carrying vesicles, organelles and chromosomes. Most kinesins move toward the plus end, outward from the centrosome (anterograde transport down an axon), while cytoplasmic dynein moves toward the minus end (retrograde, back to the cell body). Axonemal dynein slides neighboring doublets to bend cilia and flagella; its loss causes primary ciliary dyskinesia.","trap":"Kinesin and dynein run on microtubules; myosin is the motor that runs on actin filaments."},{"id":"mitotic-spindle","title":"Mitotic spindle","section":"bb","disc":"Cell & Molecular Bio","parent":"microtubules","hub":false,"summary":"The spindle is a bipolar array of microtubules organized by two centrosomes duplicated during interphase. Kinetochore microtubules attach to protein complexes built on each chromatid's centromere, polar microtubules overlap and push the poles apart, and astral microtubules anchor poles to the cell cortex. In anaphase, kinetochore microtubules shorten to pull sister chromatids poleward while polar microtubules slide to lengthen the cell.","trap":"The centromere is the DNA region joining sister chromatids, the kinetochore is the protein complex built on it, and the centrosome is the microtubule-organizing center at each pole."},{"id":"intermediate-filaments","title":"Intermediate filaments","section":"bb","disc":"Cell & Molecular Bio","parent":"cytoskeleton","hub":false,"summary":"Intermediate filaments are rope-like ~10 nm polymers that resist tension and are far more stable than actin or microtubules; they have no polarity and no motor proteins. Their subunits are tissue-specific: keratins in epithelia (anchored at desmosomes and hemidesmosomes), vimentin in connective tissue cells, desmin in muscle, neurofilaments in axons, and lamins forming the nuclear lamina.","trap":null},{"id":"cell-cycle","title":"Cell cycle","section":"bb","disc":"Cell & Molecular Bio","parent":null,"hub":true,"summary":"The eukaryotic cell cycle runs G1 → S → G2 → M, with G0 as a resting exit for nondividing cells. Cyclin–CDK complexes push the cell through each transition, and checkpoints halt it if DNA is damaged or chromosomes are unattached. Mitosis makes two identical diploid cells for growth and repair; meiosis makes four distinct haploid gametes. Cancer typically arises from accumulated mutations that activate oncogenes and inactivate tumor suppressors such as p53 and Rb.","trap":null},{"id":"interphase","title":"Interphase (G1, S, G2)","section":"bb","disc":"Cell & Molecular Bio","parent":"cell-cycle","hub":false,"summary":"Interphase is the long stretch between divisions. In G1 the cell grows, makes proteins and organelles, and passes the restriction point; in S phase it replicates its DNA so each chromosome becomes two sister chromatids joined at the centromere, and it duplicates its centrosome; in G2 it grows further and prepares for mitosis. Chromatin stays relatively decondensed so genes can be transcribed. Cells that stop dividing exit to G0.","trap":"After S phase a human cell still has 46 chromosomes (still diploid) but 92 chromatids; replication doubles DNA content from 2C to 4C, not chromosome number."},{"id":"checkpoints","title":"Cell cycle checkpoints","section":"bb","disc":"Cell & Molecular Bio","parent":"cell-cycle","hub":false,"summary":"Checkpoints pause the cycle until conditions are right. At G1/S (the restriction point) the cell checks size, growth signals and DNA integrity; DNA damage stabilizes p53, which induces the CDK inhibitor p21 to allow repair, or triggers apoptosis if damage is severe. At G2/M the cell checks that replication is complete and DNA intact, and the spindle assembly checkpoint blocks anaphase until every kinetochore is attached.","trap":"p53 is a tumor suppressor whose loss-of-function mutations promote cancer; oncogenes, by contrast, promote cancer through gain-of-function changes."},{"id":"cyclins-cdks","title":"Cyclins and CDKs","section":"bb","disc":"Cell & Molecular Bio","parent":"cell-cycle","hub":false,"summary":"Cyclin-dependent kinases (CDKs) are present throughout the cycle but are active only when bound to a cyclin, whose levels rise and fall in each phase. Active cyclin–CDK complexes phosphorylate targets: G1/S CDKs phosphorylate Rb, releasing the transcription factor E2F to switch on S-phase genes. Cyclins are then destroyed by ubiquitin-mediated proteolysis (the anaphase-promoting complex degrades mitotic cyclin), resetting the cycle.","trap":"CDK levels stay roughly constant; it is the cyclin concentration that oscillates and determines when each CDK is active."},{"id":"mitosis","title":"Mitosis","section":"bb","disc":"Cell & Molecular Bio","parent":"cell-cycle","hub":false,"summary":"Mitosis splits replicated chromosomes into two genetically identical nuclei. In prophase chromosomes condense and the spindle forms; in prometaphase the nuclear envelope breaks down and kinetochores attach; in metaphase chromosomes line up at the plate; in anaphase cohesin is cleaved and sister chromatids move to opposite poles; in telophase nuclear envelopes re-form. Ploidy is unchanged: one diploid cell gives two diploid cells.","trap":"Homologous chromosomes do not pair up in mitosis; synapsis and tetrads occur only in prophase I of meiosis."},{"id":"meiosis","title":"Meiosis","section":"bb","disc":"Cell & Molecular Bio","parent":"cell-cycle","hub":false,"summary":"Meiosis is one round of DNA replication followed by two divisions, turning a diploid germ cell into four haploid cells. Meiosis I is reductional: homologs pair, cross over, and separate to opposite poles. Meiosis II is equational, like mitosis, separating sister chromatids. Separation of homologs in anaphase I is the basis of Mendel's law of segregation, and random orientation of homolog pairs (2²³ ≈ 8.4 million combinations in humans) underlies independent assortment; crossing over adds further variation.","trap":"Ploidy is halved at the end of meiosis I, when homologs separate, not at the end of meiosis II."},{"id":"crossing-over","title":"Crossing over","section":"bb","disc":"Cell & Molecular Bio","parent":"meiosis","hub":false,"summary":"In prophase I, homologous chromosomes synapse into tetrads (bivalents) held by the synaptonemal complex, and nonsister chromatids swap segments at chiasmata using homologous recombination machinery. This creates recombinant chromatids and is the basis of gene mapping: the farther apart two linked genes are, the more often they recombine, with 1% recombination equal to 1 map unit (centimorgan), up to a maximum of 50%.","trap":"Crossing over happens between nonsister chromatids of homologous chromosomes, not between identical sister chromatids."},{"id":"nondisjunction","title":"Nondisjunction","section":"bb","disc":"Cell & Molecular Bio","parent":"meiosis","hub":false,"summary":"Nondisjunction is the failure of chromosomes to separate properly: homologs in meiosis I or sister chromatids in meiosis II (or in mitosis). The resulting gametes carry an extra or missing chromosome, giving aneuploid zygotes such as trisomy 21 (Down syndrome), XXY (Klinefelter) or monosomy X (Turner). Maternal meiotic nondisjunction rises with age, partly because oocytes stay arrested in prophase I for decades.","trap":"A meiosis I error makes all four resulting gametes abnormal, while a meiosis II error affects only two of the four."},{"id":"dna-structure","title":"DNA double helix","section":"bb","disc":"Cell & Molecular Bio","parent":null,"hub":true,"summary":"DNA is two antiparallel strands, each a chain of nucleotides linked by 3′–5′ phosphodiester bonds, wound into a right-handed B-form helix (about 10.5 bp per turn, 2 nm wide, with major and minor grooves). The negatively charged sugar–phosphate backbone faces water while the bases stack inside. Complementary base pairing makes each strand a template for replication, transcription and repair; histones package the helix and melting tests its stability.","trap":"Hydrogen bonds between paired bases are not the only thing holding the helix together; base stacking (dispersion forces and the hydrophobic effect) contributes at least as much to its stability."},{"id":"base-pairing","title":"Base pairing","section":"bb","disc":"Cell & Molecular Bio","parent":"dna-structure","hub":false,"summary":"Each pair joins a purine (A or G, two rings) with a pyrimidine (C, T or U, one ring), which keeps the helix a constant width. A–T (A–U in RNA) shares 2 hydrogen bonds and G–C shares 3. Because every A faces a T and every G a C, Chargaff's rules hold in double-stranded DNA: %A = %T, %G = %C, and purines equal pyrimidines.","trap":"Pyrimidines (C, U, T) are the single-ring bases despite their longer name; purines (A, G) have two rings."},{"id":"dna-melting","title":"DNA melting","section":"bb","disc":"Cell & Molecular Bio","parent":"dna-structure","hub":false,"summary":"Heat, high pH or chemical denaturants separate the two strands by disrupting base pairing and stacking; covalent backbone bonds stay intact. Tm, the temperature at which half the DNA is single-stranded, rises with GC content, length and salt (cations shield backbone repulsion). Single strands absorb more 260 nm light (hyperchromic effect), and on cooling complementary sequences re-anneal, which underlies primer annealing in PCR and probe hybridization.","trap":null},{"id":"histones","title":"Histones and nucleosomes","section":"bb","disc":"Cell & Molecular Bio","parent":"dna-structure","hub":false,"summary":"Histones are small basic proteins rich in Lys and Arg, whose positive side chains bind the negatively charged DNA backbone. An octamer (two each of H2A, H2B, H3 and H4) wraps about 147 bp of DNA in roughly 1.7 turns to form a nucleosome; linker histone H1 binds the DNA between nucleosomes and helps compact chromatin further. Histone tails carry the acetyl and methyl marks that control gene access.","trap":null},{"id":"replication","title":"DNA replication","section":"bb","disc":"Cell & Molecular Bio","parent":null,"hub":true,"summary":"Replication is semiconservative (Meselson–Stahl): each daughter helix keeps one parental strand. It starts at origins (one in bacteria, many per eukaryotic chromosome), runs bidirectionally (in eukaryotes, during S phase), and uses helicase to unwind, topoisomerases to relieve supercoiling, primase to lay RNA primers, DNA polymerase to extend 5′→3′ with proofreading, and ligase to seal nicks. Because synthesis runs only 5′→3′, one strand is made in pieces; because a primer is needed, linear chromosome ends shorten.","trap":"DNA polymerase reads the template 3′→5′ while building the new strand 5′→3′; swapping these two directions is a frequent error."},{"id":"leading-lagging","title":"Leading and lagging strands","section":"bb","disc":"Cell & Molecular Bio","parent":"replication","hub":false,"summary":"Because the template strands are antiparallel and polymerase only adds to a free 3′-OH, the leading strand is made continuously toward the fork from a single primer, while the lagging strand is made discontinuously away from the fork as Okazaki fragments, each with its own primer. Every fork has one leading and one lagging strand, so a bidirectional origin produces two of each.","trap":"A parental strand is not the lagging-strand template everywhere: at a bidirectional origin it templates leading synthesis at one fork and lagging synthesis at the other."},{"id":"okazaki-fragments","title":"Okazaki fragments","section":"bb","disc":"Cell & Molecular Bio","parent":"leading-lagging","hub":false,"summary":"Okazaki fragments are the short DNA pieces of the lagging strand, about 1000–2000 nucleotides in bacteria and 100–200 in eukaryotes. Each starts at an RNA primer. In E. coli, DNA pol I removes the primer with its 5′→3′ exonuclease and fills the gap with DNA; DNA ligase then seals the remaining nick by forming a phosphodiester bond (powered by NAD⁺ in E. coli, ATP in eukaryotes).","trap":"Ligase does not fill gaps; it only joins an adjacent 3′-OH and 5′-phosphate after polymerase has filled in the missing nucleotides."},{"id":"dna-polymerases","title":"DNA polymerases","section":"bb","disc":"Cell & Molecular Bio","parent":"replication","hub":false,"summary":"In E. coli, DNA pol III is the main replicative enzyme: fast, highly processive, 5′→3′ synthesis with 3′→5′ exonuclease proofreading. DNA pol I removes RNA primers with a 5′→3′ exonuclease, replaces them with DNA and works in repair. All DNA polymerases need a template plus a primer's free 3′-OH and add dNTPs, releasing pyrophosphate whose hydrolysis drives the reaction. In eukaryotes, pol α (bound to primase) starts chains, pols δ and ε extend them, and pol γ copies mitochondrial DNA.","trap":"Proofreading is the 3′→5′ exonuclease activity; primer removal by pol I uses its separate 5′→3′ exonuclease, and the two are easily swapped."},{"id":"primase","title":"Primase","section":"bb","disc":"Cell & Molecular Bio","parent":"replication","hub":false,"summary":"Primase is a specialized RNA polymerase that builds short RNA primers (roughly 10 nucleotides) on the template, supplying the free 3′-OH that DNA polymerase cannot make on its own. Each leading strand needs only one primer, while the lagging strand needs one for every Okazaki fragment. Primers are later removed and replaced with DNA (by pol I in bacteria; by RNase H and FEN1 with pol δ in eukaryotes).","trap":"Primase does not need a primer itself: unlike DNA polymerase, it can start a new chain from scratch."},{"id":"helicase","title":"Helicase","section":"bb","disc":"Cell & Molecular Bio","parent":"replication","hub":false,"summary":"Helicase uses ATP hydrolysis to unwind the double helix at the replication fork, breaking the hydrogen bonds between paired bases. Single-strand binding proteins then coat the exposed strands so they do not re-anneal or get degraded. Unwinding overwinds the DNA ahead of the fork into positive supercoils, which topoisomerases must relieve.","trap":"Helicase breaks only the noncovalent hydrogen bonds between bases; cutting the sugar–phosphate backbone is the job of topoisomerases and nucleases."},{"id":"topoisomerase","title":"Topoisomerases and DNA gyrase","section":"bb","disc":"Cell & Molecular Bio","parent":"replication","hub":false,"summary":"Unwinding the helix overwinds DNA ahead of the fork. Topoisomerases relieve this torsional strain by cutting and resealing the backbone: type I nicks one strand and lets it rotate (no ATP), while type II cuts both strands and passes another duplex through the gap, changing the linking number by 2. Bacterial DNA gyrase, a type II enzyme, adds negative supercoils using ATP and is the target of quinolone antibiotics.","trap":null},{"id":"telomerase","title":"Telomerase and the end-replication problem","section":"bb","disc":"Cell & Molecular Bio","parent":"replication","hub":false,"summary":"When the final RNA primer at the end of the lagging strand is removed, no upstream 3′-OH exists to fill the gap, so linear chromosomes shorten each cycle (end-replication problem). Telomeres, tandem TTAGGG repeats in humans, buffer genes from this loss. Telomerase is a reverse transcriptase carrying its own RNA template that extends the 3′ overhang; it is active in germ cells, stem cells and most cancers but low in most somatic cells.","trap":null},{"id":"transcription","title":"Transcription","section":"bb","disc":"Cell & Molecular Bio","parent":null,"hub":true,"summary":"Transcription copies a gene into RNA: RNA polymerase reads the template strand 3′→5′ and builds RNA 5′→3′ without a primer, so the transcript matches the coding strand with U in place of T. Control acts mainly at initiation through promoters, transcription factors, enhancers and chromatin state. In eukaryotes it happens in the nucleus and pre-mRNA is capped, polyadenylated and spliced before export; in bacteria translation starts on the growing transcript.","trap":"The mRNA sequence matches the coding (sense) strand, not the template strand it was copied from, except that U replaces T."},{"id":"rna-polymerases","title":"RNA polymerases I, II and III","section":"bb","disc":"Cell & Molecular Bio","parent":"transcription","hub":false,"summary":"Eukaryotes have three nuclear RNA polymerases: Pol I makes most rRNA (28S, 18S, 5.8S) in the nucleolus, Pol II makes mRNA plus most snRNAs and miRNAs, and Pol III makes tRNA and 5S rRNA. Pol II needs general transcription factors such as TFIID to start, and the death-cap toxin α-amanitin strongly inhibits it. Bacteria use a single RNA polymerase whose σ factor recognizes promoters.","trap":"Unlike DNA polymerase, RNA polymerase needs no primer and starts a new chain from scratch."},{"id":"promoters","title":"Promoters and the TATA box","section":"bb","disc":"Cell & Molecular Bio","parent":"transcription","hub":false,"summary":"A promoter is the DNA region just upstream of the transcription start site (+1) where RNA polymerase and general transcription factors assemble and that sets which strand is the template. Many eukaryotic Pol II promoters have a TATA box about 25–30 bp upstream, bound by TBP within TFIID. Bacterial promoters have −10 (TATAAT) and −35 elements recognized by σ factor. AT-rich elements ease opening of the helix.","trap":"Promoters are cis-acting DNA sequences, not proteins; the transcription factors that bind them are the trans-acting elements."},{"id":"enhancers-silencers","title":"Enhancers and silencers","section":"bb","disc":"Cell & Molecular Bio","parent":"transcription","hub":false,"summary":"Enhancers and silencers are cis-regulatory DNA sequences that bind activator or repressor proteins to raise or lower transcription of a gene. Unlike promoters, they can act thousands of base pairs upstream, downstream or inside an intron, in either orientation; DNA looping, helped by the Mediator complex, brings the bound factors to the promoter. Different combinations of enhancers give each tissue its own expression pattern.","trap":"Enhancers need not sit next to or upstream of their gene; acting at a distance in either orientation is what distinguishes them from promoters."},{"id":"rna-processing","title":"RNA processing","section":"bb","disc":"Cell & Molecular Bio","parent":"transcription","hub":false,"summary":"In eukaryotes the primary transcript (pre-mRNA, or hnRNA) is modified in the nucleus before export: a 7-methylguanosine cap at the 5′ end, a poly-A tail at the 3′ end, and splicing out of introns. These changes protect mRNA from exonucleases, license nuclear export and help ribosomes bind. Most bacterial mRNA is not processed this way and is translated while still being transcribed.","trap":null},{"id":"five-prime-cap","title":"5′ cap","section":"bb","disc":"Cell & Molecular Bio","parent":"rna-processing","hub":false,"summary":"Shortly after Pol II begins transcribing, a 7-methylguanosine is attached to the first nucleotide through an unusual 5′–5′ triphosphate bridge. The cap protects mRNA from 5′ exonucleases, aids nuclear export, and is bound by initiation factor eIF4E so the small ribosomal subunit can load and scan toward the start codon.","trap":null},{"id":"polyadenylation","title":"3′ polyadenylation","section":"bb","disc":"Cell & Molecular Bio","parent":"rna-processing","hub":false,"summary":"After the pre-mRNA is cleaved about 10–30 nucleotides downstream of an AAUAAA signal, poly(A) polymerase adds roughly 200 adenines to the new 3′ end without a template. The tail and its binding proteins protect mRNA from 3′ exonucleases, aid export and boost translation. The tail shortens over time and decay follows, so its length helps set how long an mRNA lasts.","trap":"The poly-A tail is not encoded in the gene; poly(A) polymerase adds it without a DNA template."},{"id":"splicing","title":"Splicing and alternative splicing","section":"bb","disc":"Cell & Molecular Bio","parent":"rna-processing","hub":false,"summary":"The spliceosome, built from snRNPs (small nuclear RNA plus protein), removes introns and joins exons. It recognizes GU at the intron's 5′ end, AG at its 3′ end and a branch-point A, whose 2′-OH attacks the 5′ splice site so the intron leaves as a lariat. Alternative splicing includes or skips different exons, letting one gene encode several protein isoforms and helping roughly 20,000 human genes yield many more proteins.","trap":null},{"id":"translation","title":"Translation","section":"bb","disc":"Cell & Molecular Bio","parent":null,"hub":true,"summary":"Translation converts an mRNA's codons into a polypeptide on the ribosome. mRNA is read 5′→3′ and the chain grows from N-terminus to C-terminus. Aminoacyl-tRNA synthetases load tRNAs, anticodons match codons, and rRNA in the large subunit forms each peptide bond. It proceeds through initiation, elongation and termination, and many proteins are modified afterward. Bacterial 70S and eukaryotic 80S ribosomes differ, which antibiotics exploit.","trap":"Peptide bonds are formed by ribosomal RNA, not ribosomal proteins; the ribosome is a ribozyme."},{"id":"genetic-code","title":"Genetic code","section":"bb","disc":"Cell & Molecular Bio","parent":"translation","hub":false,"summary":"Codons are nucleotide triplets read 5′→3′ from a fixed start without gaps or overlap: 64 codons, 61 encoding amino acids and 3 stops (UAA, UAG, UGA). AUG encodes Met and marks the start. The code is degenerate (most amino acids have several codons, often differing only at the third, wobble position) but unambiguous (each codon means one amino acid), and nearly universal across living things.","trap":"Degenerate means several codons per amino acid, not one codon for several amino acids; the code is never ambiguous."},{"id":"ribosome","title":"Ribosome structure (A, P, E sites)","section":"bb","disc":"Cell & Molecular Bio","parent":"translation","hub":false,"summary":"Ribosomes are rRNA–protein machines: 70S (50S + 30S) in bacteria and 80S (60S + 40S) in eukaryotes, where S is a sedimentation coefficient. The assembled ribosome has three tRNA sites: A (aminoacyl, incoming charged tRNA), P (peptidyl, holds the growing chain) and E (exit, empty tRNA leaves). Free ribosomes make cytosolic proteins; ribosomes on the rough ER make secreted, membrane and lysosomal proteins.","trap":"Svedberg units are not additive (50S + 30S = 70S) because sedimentation depends on shape as well as mass."},{"id":"trna-charging","title":"tRNA charging","section":"bb","disc":"Cell & Molecular Bio","parent":"translation","hub":false,"summary":"Each aminoacyl-tRNA synthetase attaches one specific amino acid to the 3′ CCA end of its matching tRNAs through an ester bond. It spends ATP → AMP + PPi, going through an aminoacyl-AMP intermediate, and the energy stored in the ester later drives peptide bond formation. Because the ribosome checks only codon–anticodon pairing, not the amino acid, synthetase accuracy and proofreading are what make the code's assignments reliable.","trap":null},{"id":"translation-steps","title":"Initiation, elongation and termination","section":"bb","disc":"Cell & Molecular Bio","parent":"translation","hub":false,"summary":"Initiation: the small subunit binds mRNA (Shine–Dalgarno sequence in bacteria, cap-and-scan in eukaryotes), initiator tRNA (fMet in bacteria, Met in eukaryotes) pairs with AUG in the P site, and the large subunit joins. Elongation: charged tRNA enters the A site, the chain is transferred onto it, and translocation shifts tRNAs to P and E, with GTP spent at delivery and translocation. Termination: a release factor reads the stop codon and the chain is released.","trap":"Stop codons are recognized by release factor proteins, not by tRNAs."},{"id":"ptm","title":"Post-translational modifications","section":"bb","disc":"Cell & Molecular Bio","parent":"translation","hub":false,"summary":"Post-translational modifications covalently change proteins during or after synthesis to control activity, location and lifespan. Examples include proteolytic cleavage (zymogens, proinsulin), phosphorylation of Ser, Thr or Tyr, glycosylation in the ER and Golgi, lipid anchors, disulfide bonds formed in the ER, hydroxylation of Pro and Lys in collagen, γ-carboxylation of clotting factors, and ubiquitin tags that send proteins to the proteasome.","trap":null},{"id":"glycosylation","title":"Glycosylation","section":"bb","disc":"Cell & Molecular Bio","parent":"ptm","hub":false,"summary":"Glycosylation attaches carbohydrate chains to proteins. N-linked glycans join the side-chain amide nitrogen of Asn (in an Asn-X-Ser/Thr motif) cotranslationally in the rough ER and are trimmed in the Golgi; O-linked glycans join the hydroxyl of Ser or Thr, mostly in the Golgi. Glycans aid folding and stability, sort proteins (mannose-6-phosphate sends enzymes to lysosomes) and form cell-surface markers such as ABO blood group antigens.","trap":"N-linked sugars attach to the side-chain nitrogen of asparagine, not to the protein's N-terminal amino group."},{"id":"lipidation","title":"Lipidation","section":"bb","disc":"Cell & Molecular Bio","parent":"ptm","hub":false,"summary":"Covalently attached lipids anchor proteins to membranes. Prenylation adds a farnesyl or geranylgeranyl group to a C-terminal Cys (as in Ras); palmitoylation forms a reversible thioester with Cys; myristoylation forms an amide with an N-terminal Gly; GPI anchors tether proteins to the outer leaflet of the plasma membrane. The hydrophobic tails insert into the bilayer, and reversible palmitoylation lets proteins cycle on and off membranes.","trap":null},{"id":"gene-regulation","title":"Gene regulation","section":"bb","disc":"Cell & Molecular Bio","parent":null,"hub":true,"summary":"Cells control which genes are expressed, when and how much, at several levels: chromatin accessibility, transcription initiation, RNA processing and stability, translation and protein modification. Bacteria rely mostly on operons that respond directly to nutrients; eukaryotes add chromatin remodeling, DNA methylation, transcription factors at enhancers and microRNAs. Differential expression, not different DNA, lets cells sharing one genome become distinct tissues.","trap":"Different cell types in one body carry the same genome; they differ in which genes they express."},{"id":"lac-operon","title":"lac operon","section":"bb","disc":"Cell & Molecular Bio","parent":"gene-regulation","hub":false,"summary":"The lac operon is inducible: lacZ, lacY and lacA (β-galactosidase, permease, transacetylase) are transcribed together. Without lactose, the LacI repressor binds the operator and blocks RNA polymerase; allolactose binds the repressor and releases it (negative control). Low glucose raises cAMP, which binds CAP so it can help RNA polymerase onto the promoter (positive control). Strong expression therefore needs lactose present and glucose absent.","trap":"Lactose acts by inactivating the repressor, while glucose acts separately through cAMP–CAP; high expression needs both lactose present and glucose low."},{"id":"trp-operon","title":"trp operon","section":"bb","disc":"Cell & Molecular Bio","parent":"gene-regulation","hub":false,"summary":"The trp operon is repressible and encodes the enzymes that make tryptophan. The trp repressor is inactive alone; when tryptophan is plentiful it binds as a corepressor, the complex attaches to the operator and transcription stops. A second layer, attenuation, depends on bacteria translating mRNA while it is still being made: ribosomes moving quickly through Trp codons in the leader let a terminator hairpin form and end transcription early.","trap":"In a repressible operon the end product activates the repressor (corepressor), whereas in an inducible operon the inducer inactivates it."},{"id":"chromatin-remodeling","title":"Chromatin remodeling","section":"bb","disc":"Cell & Molecular Bio","parent":"gene-regulation","hub":false,"summary":"Chromatin is either loosely packed euchromatin (accessible and usually active) or condensed heterochromatin (silent, as at centromeres and the inactive X, or Barr body). ATP-dependent remodeling complexes slide or evict nucleosomes, and covalent marks on histones and DNA recruit activators or repressors. These epigenetic changes alter expression without changing DNA sequence and can be passed through cell divisions.","trap":null},{"id":"histone-acetylation","title":"Histone acetylation","section":"bb","disc":"Cell & Molecular Bio","parent":"chromatin-remodeling","hub":false,"summary":"Histone acetyltransferases (HATs) transfer acetyl groups from acetyl-CoA to Lys residues on histone tails, neutralizing their positive charge. With weaker attraction to the negative DNA backbone, chromatin loosens and promoters become reachable by transcription factors, so acetylation generally activates transcription. Histone deacetylases (HDACs) remove the marks and promote silencing.","trap":"Histone acetylation generally turns genes on, while promoter DNA methylation turns them off; histone methylation can do either depending on which residue is marked."},{"id":"dna-methylation","title":"DNA methylation","section":"bb","disc":"Cell & Molecular Bio","parent":"chromatin-remodeling","hub":false,"summary":"DNA methyltransferases add a methyl group to cytosine (5-methylcytosine), mainly at CpG dinucleotides. Methylated CpG islands in promoters block factor binding and recruit deacetylase complexes, silencing the gene. Maintenance methyltransferases copy the pattern onto new strands after replication, which helps keep genomic imprinting and the inactive X silent across divisions. In E. coli, methylation also marks the parental strand for mismatch repair.","trap":null},{"id":"transcription-factors","title":"Transcription factors","section":"bb","disc":"Cell & Molecular Bio","parent":"gene-regulation","hub":false,"summary":"Transcription factors are trans-acting proteins with a DNA-binding domain (zinc finger, helix-turn-helix and basic leucine zipper motifs) that reads a specific sequence, and an activation or repression domain that recruits coactivators or corepressors. General factors such as TFIID assemble Pol II at every promoter; specific activators and repressors at enhancers and silencers decide which genes fire. Steroid and thyroid hormone receptors are ligand-activated transcription factors.","trap":null},{"id":"mirna-rnai","title":"microRNAs and RNA interference","section":"bb","disc":"Cell & Molecular Bio","parent":"gene-regulation","hub":false,"summary":"MicroRNAs are about 22-nucleotide noncoding RNAs cut from hairpin precursors by Drosha and Dicer and loaded into the RISC complex. Partial pairing with a target mRNA's 3′ UTR represses translation and speeds decay; near-perfect pairing, typical of siRNAs, leads to cleavage. RNA interference silences genes after transcription and is widely used in the lab to knock down a chosen gene.","trap":null},{"id":"mutations","title":"Mutations","section":"bb","disc":"Cell & Molecular Bio","parent":null,"hub":true,"summary":"Mutations are heritable changes in DNA sequence from replication errors, spontaneous damage (deamination, depurination) or mutagens such as UV light, ionizing radiation and chemicals. Small changes include point mutations and frameshifts; large ones include deletions, duplications, inversions and translocations. Germ-line mutations pass to offspring; somatic ones affect only the individual and can drive cancer.","trap":"Somatic mutations are not passed to offspring; only mutations in germ-line cells are inherited."},{"id":"point-mutations","title":"Point mutations","section":"bb","disc":"Cell & Molecular Bio","parent":"mutations","hub":false,"summary":"A point mutation substitutes one base. Silent: the new codon codes the same amino acid (often a third-position change). Missense: a different amino acid, from conservative and often tolerated (Leu → Ile) to severe (Glu → Val in sickle cell). Nonsense: a premature stop codon, usually truncating the protein. Transitions swap purine for purine or pyrimidine for pyrimidine; transversions swap a purine for a pyrimidine or vice versa.","trap":"A nonsense mutation specifically creates a premature stop codon; a substitution that merely puts in a harmful amino acid is missense, however damaging it is."},{"id":"frameshift","title":"Frameshift mutations","section":"bb","disc":"Cell & Molecular Bio","parent":"mutations","hub":false,"summary":"Inserting or deleting nucleotides in a number not divisible by three shifts the reading frame from that point on, changing every downstream codon and usually creating an early stop codon. The protein is typically truncated and nonfunctional, so frameshifts are generally more damaging than substitutions. Adding or removing exactly three bases keeps the frame and adds or removes one amino acid, as in the cystic fibrosis ΔF508 deletion of a single phenylalanine.","trap":"An insertion or deletion of 3 nucleotides is not a frameshift; it adds or removes one amino acid and keeps the reading frame."},{"id":"sickle-cell","title":"Sickle cell disease","section":"bb","disc":"Cell & Molecular Bio","parent":"point-mutations","hub":false,"summary":"Sickle cell disease is autosomal recessive, caused by a missense mutation (GAG → GTG) in the β-globin gene that replaces Glu (charged) with Val (hydrophobic) at position 6. When deoxygenated, HbS tetramers stick together through this hydrophobic patch and form long fibers that deform red cells into rigid sickles, which hemolyze and block small vessels. Heterozygous carriers are partly protected against malaria, keeping the allele common where malaria is endemic.","trap":"The mutation is on the protein surface, away from the heme pocket; disease comes from deoxygenated HbS polymerizing through the new hydrophobic patch, not from a failure to bind oxygen."},{"id":"dna-repair","title":"DNA repair","section":"bb","disc":"Cell & Molecular Bio","parent":null,"hub":true,"summary":"Cells match repair pathways to the type of damage: proofreading and mismatch repair fix replication errors, base excision repair fixes small chemical changes to single bases, nucleotide excision repair removes bulky helix-distorting lesions such as thymine dimers, and homologous recombination or non-homologous end joining repairs double-strand breaks. Inherited repair defects raise mutation rates and cancer risk.","trap":"Thymine dimers require nucleotide excision repair, not base excision repair, because the lesion distorts the helix across two linked bases."},{"id":"ner","title":"Nucleotide excision repair","section":"bb","disc":"Cell & Molecular Bio","parent":"dna-repair","hub":false,"summary":"Nucleotide excision repair removes bulky, helix-distorting lesions such as UV-induced pyrimidine (thymine) dimers and chemical adducts. Proteins detect the distortion, nick the damaged strand on both sides of the lesion and remove a short oligonucleotide (about 24–32 nucleotides in humans); DNA polymerase fills the gap from the intact strand and ligase seals it. Inherited NER defects cause xeroderma pigmentosum, with extreme UV sensitivity and skin cancers.","trap":"UV links two adjacent pyrimidines on the same strand; a thymine dimer is not a bond between the two strands."},{"id":"ber","title":"Base excision repair","section":"bb","disc":"Cell & Molecular Bio","parent":"dna-repair","hub":false,"summary":"Base excision repair fixes small, non-distorting damage to single bases, such as uracil from cytosine deamination, oxidized guanine (8-oxoG) or alkylated bases. A lesion-specific DNA glycosylase cuts the N-glycosidic bond to remove the base, leaving an abasic (AP) site; AP endonuclease nicks the backbone, DNA polymerase inserts the correct nucleotide and ligase seals the strand.","trap":null},{"id":"mismatch-repair","title":"Mismatch repair","section":"bb","disc":"Cell & Molecular Bio","parent":"dna-repair","hub":false,"summary":"Mismatch repair fixes wrongly paired bases and small insertion or deletion loops that escape polymerase proofreading, acting just after replication. It must know which strand is new: in E. coli, MutS binds the mismatch and MutH nicks the unmethylated daughter strand at a hemimethylated GATC site; eukaryotes are thought to recognize the new strand mainly by the nicks it still carries. Defects in human MSH2 or MLH1 cause Lynch syndrome (hereditary nonpolyposis colorectal cancer).","trap":"Mismatch repair is a separate post-replication system, not the 3′→5′ exonuclease proofreading performed by DNA polymerase itself."},{"id":"homologous-recombination","title":"Homologous recombination","section":"bb","disc":"Cell & Molecular Bio","parent":"dna-repair","hub":false,"summary":"Homologous recombination repairs double-strand breaks accurately by copying a matching sequence, normally the sister chromatid. The broken ends are trimmed to 3′ single-stranded tails, which Rad51 (loaded with help from BRCA1 and BRCA2) guides into the intact duplex to prime new synthesis. Because it needs a sister chromatid it works mainly in S and G2. Related strand-invasion machinery produces crossing over in meiosis.","trap":"Homologous recombination is highly accurate but largely unavailable in G1, when no sister chromatid exists; that is when error-prone NHEJ dominates."},{"id":"nhej","title":"Non-homologous end joining","section":"bb","disc":"Cell & Molecular Bio","parent":"dna-repair","hub":false,"summary":"Non-homologous end joining repairs double-strand breaks by directly rejoining the ends: Ku proteins grab them and DNA ligase IV links them. It needs no template and works throughout the cell cycle, especially G1, but ends are often trimmed first, so small insertions or deletions are common, making it error-prone. Lymphocytes use the same machinery to join gene segments in V(D)J recombination.","trap":null},{"id":"atp","title":"ATP and energy coupling","section":"bb","disc":"Metabolism","parent":null,"hub":false,"summary":"ATP hydrolysis to ADP + Pi has ΔG°′ ≈ −30.5 kJ/mol (−7.3 kcal/mol) under standard conditions and about −50 kJ/mol under cellular conditions. The phosphoanhydride bonds are 'high-energy' because the products are stabilized by resonance, reduced repulsion between negative phosphates and better hydration. Because ΔG values add, cells drive unfavorable steps by coupling them to ATP hydrolysis, often through a phosphorylated intermediate.","trap":"Energy is not released by breaking the phosphate bond itself (bond breaking always costs energy); it comes from the products being far more stable than ATP."},{"id":"acetyl-coa","title":"Acetyl-CoA","section":"bb","disc":"Metabolism","parent":null,"hub":false,"summary":"Acetyl-CoA is the two-carbon hub of metabolism: an acetyl group held by a reactive thioester to coenzyme A (made from pantothenate, vitamin B5). It comes from pyruvate (via PDH), β-oxidation and ketogenic amino acids, and is used by the citric acid cycle, fatty acid and cholesterol synthesis, ketogenesis and acetylation reactions. It cannot be converted back to pyruvate, so it is never a net glucose source.","trap":"Acetyl-CoA entering the citric acid cycle cannot make net glucose: its two carbons are matched by the two CO₂ lost per turn, so no extra oxaloacetate is produced."},{"id":"nucleotide-synthesis","title":"Nucleotide synthesis","section":"bb","disc":"Metabolism","parent":null,"hub":false,"summary":"Nucleotides are built on ribose-5-phosphate from the pentose phosphate pathway, activated as PRPP. Purine rings are assembled step by step on PRPP using atoms from glycine, glutamine, aspartate, CO₂ and folate (formyl-THF). Pyrimidine rings are made first from carbamoyl phosphate and aspartate, then attached to PRPP. Ribonucleotide reductase makes deoxyribonucleotides, and thymidylate synthase uses folate to methylate dUMP into dTMP.","trap":null},{"id":"glycolysis","title":"Glycolysis","section":"bb","disc":"Metabolism","parent":null,"hub":true,"summary":"Glycolysis splits one glucose (6C) into two pyruvate (3C) in the cytosol, netting 2 ATP (by substrate-level phosphorylation) and 2 NADH, with no O₂ required. Its three irreversible steps, catalyzed by hexokinase, PFK-1 (rate-limiting) and pyruvate kinase, are the control points and the steps gluconeogenesis must bypass. With O₂, pyruvate enters the mitochondria via PDH; without it, lactate dehydrogenase regenerates NAD⁺ so glycolysis can continue.","trap":"Glycolysis itself never uses O₂; under anaerobic conditions it keeps running only because fermentation to lactate regenerates the NAD⁺ it needs."},{"id":"glycolysis-phases","title":"Glycolysis: investment and payoff phases","section":"bb","disc":"Metabolism","parent":"glycolysis","hub":false,"summary":"In the investment phase, 2 ATP are spent (hexokinase and PFK-1) to make fructose-1,6-bisphosphate, which aldolase splits into DHAP and glyceraldehyde-3-phosphate; triose phosphate isomerase converts DHAP so two G3P continue. The payoff phase runs twice per glucose: G3P dehydrogenase makes NADH and 1,3-bisphosphoglycerate, then phosphoglycerate kinase and pyruvate kinase each make ATP, for 4 ATP gross and 2 net.","trap":"The payoff phase runs twice per glucose because one glucose yields two G3P, so it makes 4 ATP and 2 NADH in total, not 2 ATP and 1 NADH."},{"id":"hexokinase","title":"Hexokinase","section":"bb","disc":"Metabolism","parent":"glycolysis","hub":false,"summary":"Hexokinase phosphorylates glucose to glucose-6-phosphate, trapping it in the cell because the charged product cannot leave through GLUT transporters. Most tissues use hexokinase: low Km (high affinity) and inhibited by its product G6P. Liver and pancreatic β-cells use glucokinase: high Km, high capacity and not inhibited by G6P, so it works mainly when glucose is high and acts as a glucose sensor.","trap":"Glucokinase's higher Km means lower affinity, not a slower or weaker enzyme; it lets the liver take up glucose mainly after meals, when glucose is high."},{"id":"pfk1","title":"PFK-1","section":"bb","disc":"Metabolism","parent":"glycolysis","hub":false,"summary":"Phosphofructokinase-1 converts fructose-6-phosphate to fructose-1,6-bisphosphate using ATP; it is the committed, rate-limiting step of glycolysis. It is allosterically inhibited by ATP and citrate (signals of plentiful energy) and activated by AMP and, most powerfully, fructose-2,6-bisphosphate. Insulin and glucagon act on it indirectly by raising or lowering F2,6BP levels in the liver.","trap":"ATP is both a substrate and an inhibitor of PFK-1: at high levels it binds a separate allosteric site and lowers the enzyme's affinity for fructose-6-phosphate."},{"id":"f26bp","title":"Fructose-2,6-bisphosphate","section":"bb","disc":"Metabolism","parent":"pfk1","hub":false,"summary":"Fructose-2,6-bisphosphate is a regulator, not a glycolytic intermediate. It is made from fructose-6-phosphate by PFK-2, a bifunctional enzyme whose other domain (FBPase-2) destroys it. F2,6BP strongly activates PFK-1 and inhibits fructose-1,6-bisphosphatase. In the liver isoform, insulin keeps the enzyme dephosphorylated (kinase active, F2,6BP high); glucagon, via cAMP and PKA, phosphorylates it (phosphatase active, F2,6BP low). Isoforms in heart and muscle are regulated differently.","trap":"Fructose-2,6-bisphosphate (the regulator made by PFK-2) is easily confused with fructose-1,6-bisphosphate (the glycolytic intermediate made by PFK-1)."},{"id":"pyruvate-kinase","title":"Pyruvate kinase","section":"bb","disc":"Metabolism","parent":"glycolysis","hub":false,"summary":"Pyruvate kinase transfers phosphate from phosphoenolpyruvate (PEP) to ADP, making pyruvate and ATP in the last, irreversible step of glycolysis. Fructose-1,6-bisphosphate activates it (feed-forward), while ATP and alanine inhibit it; in liver, glucagon-triggered phosphorylation by PKA turns it off during fasting. Red blood cells rely solely on glycolysis for ATP, so pyruvate kinase deficiency causes hemolytic anemia.","trap":null},{"id":"pdh-complex","title":"Pyruvate dehydrogenase complex","section":"bb","disc":"Metabolism","parent":null,"hub":true,"summary":"The pyruvate dehydrogenase complex in the mitochondrial matrix irreversibly converts pyruvate + CoA + NAD⁺ to acetyl-CoA + CO₂ + NADH, linking glycolysis to the citric acid cycle. It needs five cofactors: thiamine pyrophosphate (B1), lipoic acid, CoA (B5), FAD (B2) and NAD⁺ (B3). It is inhibited by its products and by phosphorylation from PDH kinase, and reactivated by PDH phosphatase (stimulated by insulin and Ca²⁺).","trap":"Phosphorylation inactivates PDH: high ATP, NADH and acetyl-CoA activate PDH kinase, so don't assume phosphorylation always switches an enzyme on."},{"id":"tca-cycle","title":"Citric acid cycle","section":"bb","disc":"Metabolism","parent":null,"hub":true,"summary":"In the mitochondrial matrix, acetyl-CoA joins oxaloacetate to form citrate, and each turn yields 3 NADH, 1 FADH₂, 1 GTP (or ATP) and 2 CO₂, regenerating oxaloacetate (two turns per glucose). The control points are citrate synthase, isocitrate dehydrogenase (rate-limiting) and α-ketoglutarate dehydrogenase: high ATP and NADH slow them, while ADP and, for the two dehydrogenases, Ca²⁺ speed them up. The cycle is amphibolic: its intermediates also feed biosynthesis.","trap":"The cycle never uses O₂ directly; it stops without O₂ because the ETC can no longer reoxidize NADH and FADH₂ to the NAD⁺ and FAD it needs."},{"id":"tca-intermediates","title":"TCA cycle intermediates","section":"bb","disc":"Metabolism","parent":"tca-cycle","hub":false,"summary":"The intermediates are citrate, isocitrate, α-ketoglutarate, succinyl-CoA, succinate, fumarate, malate and oxaloacetate. Several leave for biosynthesis: citrate for fatty acid synthesis, α-KG and oxaloacetate for glutamate and aspartate, succinyl-CoA for heme, and oxaloacetate (as malate) for gluconeogenesis. Anaplerotic reactions such as pyruvate carboxylase refill them, since acetyl-CoA alone cannot add net intermediates.","trap":null},{"id":"isocitrate-dh","title":"Isocitrate dehydrogenase","section":"bb","disc":"Metabolism","parent":"tca-cycle","hub":false,"summary":"Isocitrate dehydrogenase is the rate-limiting enzyme of the citric acid cycle. It oxidatively decarboxylates isocitrate to α-ketoglutarate, releasing the cycle's first CO₂ and first NADH. ADP and Ca²⁺ activate it, while ATP and NADH inhibit it. When it slows in an energy-rich cell, citrate accumulates and is exported to the cytosol, where it inhibits PFK-1 and promotes fatty acid synthesis.","trap":null},{"id":"akg-dh","title":"α-Ketoglutarate dehydrogenase","section":"bb","disc":"Metabolism","parent":"tca-cycle","hub":false,"summary":"α-Ketoglutarate dehydrogenase converts α-KG + CoA + NAD⁺ into succinyl-CoA + CO₂ + NADH, the cycle's second decarboxylation. It is a multienzyme complex built like PDH, using the same five cofactors (thiamine pyrophosphate, lipoic acid, CoA, FAD, NAD⁺). Its products succinyl-CoA and NADH inhibit it, and Ca²⁺ activates it, linking muscle contraction to faster ATP production.","trap":null},{"id":"electron-carriers","title":"NADH and FADH₂","section":"bb","disc":"Metabolism","parent":"tca-cycle","hub":false,"summary":"NAD⁺ accepts a hydride (2 e⁻ + H⁺) to become NADH and diffuses freely; FAD accepts 2 e⁻ + 2 H⁺ and stays bound to its enzyme as FADH₂. One glucose fully oxidized yields 10 NADH and 2 FADH₂. NADH donates electrons to Complex I (about 2.5 ATP each); FADH₂ enters at ubiquinone via Complex II (about 1.5 ATP). They come from niacin (B3) and riboflavin (B2).","trap":"FADH₂ yields less ATP not because it carries fewer electrons (both carry two) but because its electrons skip Complex I and its proton pumping."},{"id":"oxphos","title":"Oxidative phosphorylation","section":"bb","disc":"Metabolism","parent":null,"hub":true,"summary":"Oxidative phosphorylation on the inner mitochondrial membrane makes most of the cell's ATP (about 26–28 of the 30–32 per glucose). The electron transport chain passes electrons from NADH and FADH₂ to O₂, the final acceptor, forming water while pumping H⁺ into the intermembrane space. ATP synthase then lets H⁺ flow back to make ATP (chemiosmotic coupling), so blocking either electron flow or ATP synthase stops both.","trap":"O₂ is reduced to water at Complex IV; the CO₂ we exhale comes from decarboxylations in PDH and the citric acid cycle, not from the electron transport chain."},{"id":"etc-complexes","title":"Electron transport chain (Complexes I–IV)","section":"bb","disc":"Metabolism","parent":"oxphos","hub":false,"summary":"Complex I (NADH dehydrogenase) pumps 4 H⁺ per electron pair; Complex II (succinate dehydrogenase) passes FADH₂ electrons to ubiquinone and pumps none; Complex III (cytochrome bc₁) pumps 4 H⁺ and reduces cytochrome c; Complex IV (cytochrome c oxidase) reduces O₂ to H₂O and pumps 2 H⁺. Electrons flow toward higher reduction potential (NADH −0.32 V to O₂ +0.82 V). Cyanide and CO block Complex IV.","trap":"When a complex is blocked, carriers upstream of it stay fully reduced and those downstream become oxidized; students often reverse this."},{"id":"proton-gradient","title":"Proton gradient","section":"bb","disc":"Metabolism","parent":"oxphos","hub":false,"summary":"Proton pumping by Complexes I, III and IV makes the intermembrane space more acidic (lower pH) and positive relative to the matrix. The resulting proton-motive force has two parts: a pH gradient and a membrane potential (about 150–180 mV, matrix negative). Because the inner membrane is impermeable to H⁺, this stored energy is released only when H⁺ re-enters through ATP synthase or another route, such as a leak, an uncoupler or a H⁺-coupled transporter.","trap":"The intermembrane space has the higher H⁺ concentration (lower pH), not the matrix; protons are pumped out of the matrix."},{"id":"atp-synthase","title":"ATP synthase (F₀ and F₁)","section":"bb","disc":"Metabolism","parent":"oxphos","hub":false,"summary":"ATP synthase (Complex V) has two parts. F₀ spans the inner membrane and forms the proton channel and rotor; H⁺ flowing into the matrix turns its ring and the central stalk. F₁ projects into the matrix, and the rotating stalk forces its β subunits through conformations that bind ADP + Pi, form ATP and release it (binding-change mechanism). By the usual convention, about 4 H⁺ are spent per ATP: roughly 3 to make it and 1 to import Pi and exchange ADP for ATP. Oligomycin blocks F₀.","trap":"F₀ (the 'o' stands for oligomycin sensitivity, not zero) is the membrane-embedded proton channel and rotor; F₁ is the catalytic head in the matrix. Students often swap the two."},{"id":"po-ratio","title":"P/O ratios","section":"bb","disc":"Metabolism","parent":"oxphos","hub":false,"summary":"The P/O ratio is ATP made per pair of electrons (one O atom) delivered to oxygen. Current values are about 2.5 for NADH (10 H⁺ pumped) and 1.5 for FADH₂ (6 H⁺), given about 4 H⁺ per ATP; older texts use 3 and 2. Cytosolic NADH from glycolysis yields 2.5 via the malate–aspartate shuttle (liver, heart) or 1.5 via the glycerol-3-phosphate shuttle (skeletal muscle, brain), giving about 30–32 ATP per glucose.","trap":"The older total of 36–38 ATP per glucose comes from P/O values of 3 and 2; with the current 2.5 and 1.5 the total is about 30–32, so don't mix the two conventions in one calculation."},{"id":"uncouplers","title":"Uncoupling agents","section":"bb","disc":"Metabolism","parent":"oxphos","hub":false,"summary":"Uncouplers let H⁺ leak back into the matrix without passing through ATP synthase, dissipating the gradient as heat. Electron transport and O₂ consumption speed up while ATP synthesis falls. Examples are 2,4-dinitrophenol (a lipid-soluble weak acid that ferries H⁺), high-dose aspirin, and thermogenin (UCP1) in brown fat, which generates heat in newborns and hibernating animals.","trap":"Uncouplers raise, not lower, O₂ consumption and electron flow; only ATP synthesis drops, and the lost energy appears as heat."},{"id":"gluconeogenesis","title":"Gluconeogenesis","section":"bb","disc":"Metabolism","parent":null,"hub":true,"summary":"Gluconeogenesis builds glucose from non-carbohydrate precursors, mainly in the liver (and kidney cortex in prolonged fasting): lactate (Cori cycle), alanine and other glucogenic amino acids, glycerol, and propionyl-CoA from odd-chain fatty acids. It shares seven reversible steps with glycolysis and bypasses the three irreversible ones, costing 4 ATP + 2 GTP per glucose. Glucagon and cortisol stimulate it; insulin suppresses it.","trap":"Even-chain fatty acids cannot be a net glucose source; only the glycerol backbone of triglycerides (and propionyl-CoA from odd-chain fatty acids) can."},{"id":"bypass-reactions","title":"Gluconeogenic bypass reactions","section":"bb","disc":"Metabolism","parent":"gluconeogenesis","hub":false,"summary":"Three enzyme sets bypass glycolysis's irreversible steps. Pyruvate carboxylase (mitochondrial, biotin, ATP, activated by acetyl-CoA) makes oxaloacetate, which PEPCK converts to PEP using GTP. Fructose-1,6-bisphosphatase, the rate-limiting step, removes a phosphate and is inhibited by F2,6BP and AMP. Glucose-6-phosphatase in the ER of liver and kidney releases free glucose; muscle lacks it.","trap":null},{"id":"reciprocal-regulation","title":"Reciprocal regulation with glycolysis","section":"bb","disc":"Metabolism","parent":"gluconeogenesis","hub":false,"summary":"Glycolysis and gluconeogenesis are controlled oppositely at their bypass points so that both never run fully at once, which would be a futile cycle hydrolyzing ATP. AMP and F2,6BP activate PFK-1 and inhibit FBPase-1; acetyl-CoA activates pyruvate carboxylase as ATP and alanine inhibit pyruvate kinase. Hormones set the balance: insulin favors glycolysis, while glucagon (cAMP, PKA) and cortisol (inducing PEPCK) favor gluconeogenesis.","trap":null},{"id":"glycogen-metabolism","title":"Glycogen metabolism","section":"bb","disc":"Metabolism","parent":null,"hub":true,"summary":"Glycogen is branched glucose: α-1,4 chains with α-1,6 branches every ~8–12 residues, giving many ends for fast synthesis and breakdown. Liver glycogen buffers blood glucose between meals, while muscle glycogen fuels only the muscle. Synthesis (glycogen synthase, branching enzyme) and breakdown (glycogen phosphorylase, debranching enzyme) are reciprocally controlled: insulin favors storage, while glucagon (liver) and epinephrine (liver and muscle) trigger breakdown via cAMP and PKA.","trap":"Muscle glycogen cannot raise blood glucose because muscle lacks glucose-6-phosphatase; only the liver (and kidney) can release free glucose."},{"id":"glycogen-phosphorylase","title":"Glycogen phosphorylase (glycogenolysis)","section":"bb","disc":"Metabolism","parent":"glycogen-metabolism","hub":false,"summary":"Glycogen phosphorylase, the rate-limiting enzyme of glycogenolysis, uses inorganic phosphate (phosphorolysis) to cleave α-1,4 bonds from nonreducing ends, releasing glucose-1-phosphate; it needs pyridoxal phosphate (B6). It stops four residues from a branch, where debranching enzyme takes over. Phosphorylase kinase activates it by phosphorylation, and is itself switched on by glucagon or epinephrine (cAMP, PKA) and by Ca²⁺ (muscle contraction, or α₁ signaling in liver). AMP activates the muscle enzyme.","trap":"Phosphorylase cleaves with phosphate, not water, so its product is glucose-1-phosphate, not free glucose, which saves the ATP hexokinase would otherwise spend."},{"id":"glycogen-synthase","title":"Glycogen synthase (glycogenesis)","section":"bb","disc":"Metabolism","parent":"glycogen-metabolism","hub":false,"summary":"Glycogen synthase is the rate-limiting enzyme of glycogenesis. It adds glucose from UDP-glucose (made from glucose-1-phosphate + UTP, driven by PPi hydrolysis) to the nonreducing ends of an existing chain with α-1,4 bonds; glycogenin primes new particles and branching enzyme forms α-1,6 branches. Insulin activates it through dephosphorylation by protein phosphatase-1, G6P activates it allosterically, and phosphorylation by PKA inhibits it.","trap":null},{"id":"ppp","title":"Pentose phosphate pathway","section":"bb","disc":"Metabolism","parent":null,"hub":true,"summary":"The pentose phosphate pathway branches from glucose-6-phosphate in the cytosol and makes no ATP. Its irreversible oxidative phase produces NADPH and ribulose-5-phosphate; its reversible non-oxidative phase interconverts sugars to supply ribose-5-phosphate for nucleotides or return carbon to glycolysis. It is most active in liver, adipose tissue, adrenal cortex, lactating mammary gland and red blood cells, where NADPH demand is high.","trap":"The PPP's reducing product is NADPH, not NADH, and the pathway neither makes nor consumes ATP."},{"id":"ppp-oxidative","title":"Oxidative phase of the PPP","section":"bb","disc":"Metabolism","parent":"ppp","hub":false,"summary":"Glucose-6-phosphate dehydrogenase (G6PD), the rate-limiting enzyme, oxidizes G6P and makes the first NADPH; 6-phosphogluconate dehydrogenase then decarboxylates the product to ribulose-5-phosphate + CO₂, making the second NADPH. NADP⁺ activates G6PD and NADPH inhibits it, so flux tracks NADPH use. X-linked G6PD deficiency leaves red cells unable to resist oxidant stress (fava beans, some antimalarials), causing hemolysis.","trap":null},{"id":"ppp-nonoxidative","title":"Non-oxidative phase of the PPP","section":"bb","disc":"Metabolism","parent":"ppp","hub":false,"summary":"Transketolase (moves 2-carbon units, needs thiamine pyrophosphate) and transaldolase (moves 3-carbon units) reversibly reshuffle 3-, 4-, 5-, 6- and 7-carbon sugar phosphates. This lets the cell match its needs: excess pentoses become fructose-6-phosphate and glyceraldehyde-3-phosphate for glycolysis, or, when nucleotides are needed but NADPH is not, glycolytic intermediates are converted to ribose-5-phosphate.","trap":null},{"id":"nadph","title":"NADPH","section":"bb","disc":"Metabolism","parent":"ppp","hub":false,"summary":"NADPH is the cell's reductant for biosynthesis and antioxidant defense, kept mostly reduced, while NAD⁺ is kept mostly oxidized for catabolism. It supplies electrons for fatty acid and cholesterol synthesis, keeps glutathione reduced, powers cytochrome P450 reactions and fuels phagocyte NADPH oxidase. The oxidative PPP is the main source. One extra phosphate on the 2′ carbon of its adenosine ribose distinguishes it from NADH and lets enzymes tell them apart.","trap":"NADPH is not an ATP-generating carrier: NADH feeds the electron transport chain, while NADPH donates electrons to anabolic and protective reactions."},{"id":"lipid-metabolism","title":"Lipid metabolism","section":"bb","disc":"Metabolism","parent":null,"hub":true,"summary":"Triglycerides in adipose tissue are the main long-term fuel store (about 9 kcal/g versus 4 for carbohydrate). Hormone-sensitive lipase, activated by glucagon and epinephrine and inhibited by insulin, releases fatty acids for β-oxidation and glycerol for gluconeogenesis. In the fed state, the liver turns surplus acetyl-CoA into fatty acids, and in fasting it turns excess acetyl-CoA into ketone bodies. Acetyl-CoA is also the starting material for cholesterol.","trap":"Fatty acid synthesis is not β-oxidation run backward: it uses a different compartment (cytosol), carrier (ACP), reductant (NADPH) and activated donor (malonyl-CoA)."},{"id":"beta-oxidation","title":"β-oxidation","section":"bb","disc":"Metabolism","parent":"lipid-metabolism","hub":false,"summary":"Fatty acyl-CoA is broken down in the mitochondrial matrix by repeated rounds of oxidation (making FADH₂), hydration, oxidation (making NADH) and thiolysis, each releasing one acetyl-CoA. Palmitate (C16) takes 7 rounds to give 8 acetyl-CoA, 7 FADH₂ and 7 NADH, about 106 ATP after the 2-ATP-equivalent activation cost. Odd-chain fatty acids leave propionyl-CoA, which becomes succinyl-CoA.","trap":"A C16 fatty acid needs 7 rounds, not 8, because the last round splits a 4-carbon unit into two acetyl-CoA."},{"id":"carnitine-shuttle","title":"Carnitine shuttle","section":"bb","disc":"Metabolism","parent":"beta-oxidation","hub":false,"summary":"Long-chain fatty acyl-CoA cannot cross the inner mitochondrial membrane. CPT-I on the outer membrane swaps CoA for carnitine; a translocase carries acylcarnitine into the matrix in exchange for free carnitine; CPT-II restores acyl-CoA inside. CPT-I is the rate-limiting step of β-oxidation and is inhibited by malonyl-CoA, so newly made fatty acids are not oxidized. Short- and medium-chain fatty acids enter without it.","trap":"Coenzyme A never crosses the inner mitochondrial membrane; only the acyl group does, carried on carnitine, and it is transferred back to a separate matrix pool of CoA by CPT-II."},{"id":"fa-synthesis","title":"Fatty acid synthesis","section":"bb","disc":"Metabolism","parent":"lipid-metabolism","hub":false,"summary":"Fatty acid synthesis runs in the cytosol of liver and adipose cells in the fed, insulin-dominated state. Acetyl-CoA leaves mitochondria as citrate, acetyl-CoA carboxylase makes malonyl-CoA, and fatty acid synthase repeats condensation, reduction, dehydration and reduction, adding two carbons per cycle until palmitate (C16). One palmitate costs 8 acetyl-CoA, 7 ATP and 14 NADPH; the ER later elongates and desaturates it.","trap":"The CO₂ added by acetyl-CoA carboxylase is released again at each condensation, so all of palmitate's carbons come from acetyl-CoA, not from CO₂."},{"id":"acc-malonyl","title":"Acetyl-CoA carboxylase and malonyl-CoA","section":"bb","disc":"Metabolism","parent":"fa-synthesis","hub":false,"summary":"Acetyl-CoA carboxylase catalyzes the committed, rate-limiting step of fatty acid synthesis: acetyl-CoA + HCO₃⁻ + ATP → malonyl-CoA, using biotin. Citrate activates it and insulin keeps it dephosphorylated and active, while palmitoyl-CoA inhibits it and phosphorylation, promoted by glucagon and epinephrine and carried out mainly by AMP-activated protein kinase, inactivates it. Malonyl-CoA donates two-carbon units to fatty acid synthase and blocks CPT-I, keeping fatty acid synthesis and oxidation apart.","trap":null},{"id":"ketogenesis","title":"Ketogenesis and ketone bodies","section":"bb","disc":"Metabolism","parent":"lipid-metabolism","hub":false,"summary":"During fasting, starvation or untreated type 1 diabetes, liver mitochondria receive more acetyl-CoA than the citric acid cycle can use, partly because oxaloacetate is diverted to gluconeogenesis. HMG-CoA synthase (rate-limiting) forms HMG-CoA, which HMG-CoA lyase cleaves to acetoacetate; acetoacetate is reduced to β-hydroxybutyrate or spontaneously decarboxylates to acetone. Heart, skeletal muscle, kidney and, after days of starvation, the brain oxidize ketones; excess ketoacids cause ketoacidosis.","trap":"The liver makes ketone bodies but cannot use them, because it lacks the CoA transferase (thiophorase) needed to reactivate acetoacetate."},{"id":"aa-catabolism","title":"Amino acid catabolism","section":"bb","disc":"Metabolism","parent":null,"hub":true,"summary":"Amino acids are not stored, so surplus dietary amino acids, and muscle protein during fasting, are broken down. The amino group is removed first (transamination to glutamate, then oxidative deamination), and its nitrogen is disposed of as urea by the liver. Carbon skeletons become pyruvate, citric acid cycle intermediates, acetyl-CoA or acetoacetate, giving glucogenic and ketogenic amino acids. Alanine and glutamine carry nitrogen from muscle to the liver and kidney.","trap":null},{"id":"transamination","title":"Transamination","section":"bb","disc":"Metabolism","parent":"aa-catabolism","hub":false,"summary":"Aminotransferases move an amino group from an amino acid to an α-keto acid, usually α-ketoglutarate, which becomes glutamate; this funnels nitrogen from many amino acids into one carrier. They use pyridoxal phosphate (B6), forming an imine (Schiff base) intermediate, and are freely reversible, so they also make nonessential amino acids. Alanine (ALT) and aspartate (AST) aminotransferases in blood are markers of liver injury.","trap":"Transamination releases no free ammonia and removes no nitrogen from the body; it only moves amino groups between molecules."},{"id":"deamination","title":"Oxidative deamination","section":"bb","disc":"Metabolism","parent":"aa-catabolism","hub":false,"summary":"Glutamate dehydrogenase in liver mitochondria removes glutamate's amino group as free NH₄⁺, regenerating α-ketoglutarate and reducing NAD⁺ (or NADP⁺). Paired with transamination, this releases nitrogen from most amino acids. ADP and GDP activate it and ATP and GTP inhibit it. The NH₄⁺ produced goes straight into carbamoyl phosphate for the urea cycle, because free ammonia is toxic to the brain.","trap":null},{"id":"urea-cycle","title":"Urea cycle","section":"bb","disc":"Metabolism","parent":"aa-catabolism","hub":false,"summary":"The urea cycle runs in liver cells, partly in mitochondria and partly in the cytosol. Carbamoyl phosphate synthetase I (activated by N-acetylglutamate) makes carbamoyl phosphate from NH₄⁺, HCO₃⁻ and 2 ATP; ornithine accepts it to form citrulline. Aspartate adds the second nitrogen (argininosuccinate), which splits into arginine and fumarate; arginase then releases urea and regenerates ornithine. One urea costs 4 high-energy phosphate bonds.","trap":"Urea is made in the liver, not the kidney; the kidney only filters and excretes it (and recycles some in the medulla)."},{"id":"glucogenic-ketogenic","title":"Glucogenic vs. ketogenic amino acids","section":"bb","disc":"Metabolism","parent":"aa-catabolism","hub":false,"summary":"Amino acids are classed by where their carbon skeletons go. Glucogenic ones yield pyruvate or citric acid cycle intermediates (α-KG, succinyl-CoA, fumarate, oxaloacetate) that can become glucose. Ketogenic ones yield acetyl-CoA or acetoacetate, which cannot. Only leucine and lysine are purely ketogenic; isoleucine, phenylalanine, tyrosine, tryptophan and threonine are both; the rest are purely glucogenic.","trap":"Only leucine and lysine are purely ketogenic; the aromatic amino acids are both glucogenic and ketogenic, not purely ketogenic."},{"id":"nervous-system","title":"Nervous system","section":"bb","disc":"Physiology","parent":null,"hub":true,"summary":"The nervous system sends fast, targeted signals as electrical impulses along neurons and chemical messages across synapses. Ion gradients built by the Na⁺/K⁺ ATPase set the resting potential; voltage-gated channels turn it into action potentials, myelin speeds them, and synapses convert them into transmitter release. It divides into the CNS and PNS, with the autonomic PNS split into sympathetic and parasympathetic branches.","trap":"Sympathetic preganglionic neurons release acetylcholine, not norepinephrine; norepinephrine comes from most sympathetic postganglionic neurons, and epinephrine from the adrenal medulla."},{"id":"resting-potential","title":"Resting membrane potential","section":"bb","disc":"Physiology","parent":"nervous-system","hub":false,"summary":"A typical neuron rests near −70 mV, inside negative. The Na⁺/K⁺ ATPase pumps 3 Na⁺ out and 2 K⁺ in to build the gradients, but the voltage itself comes mainly from K⁺ leaking out through open leak channels. Because resting permeability to K⁺ far exceeds that to Na⁺, the membrane sits close to the K⁺ equilibrium potential (about −90 mV); the Goldman equation weights each ion's Nernst potential by its permeability.","trap":"The pump's 3:2 charge imbalance adds only a few millivolts directly; the resting potential exists mainly because K⁺ diffuses out through leak channels down its gradient."},{"id":"action-potential","title":"Action potential","section":"bb","disc":"Physiology","parent":"nervous-system","hub":false,"summary":"An action potential is an all-or-none spike fired when graded depolarization brings the axon hillock to threshold, about −55 mV. Voltage-gated Na⁺ channels open by positive feedback, then inactivate as voltage-gated K⁺ channels restore the negative potential. Stimulus strength is coded by firing frequency, not spike size, and refractory periods keep propagation moving one way down the axon.","trap":"A stronger stimulus does not produce a bigger action potential; it raises firing frequency and recruits more neurons."},{"id":"ap-phases","title":"Depolarization, repolarization, hyperpolarization","section":"bb","disc":"Physiology","parent":"action-potential","hub":false,"summary":"Depolarization: voltage-gated Na⁺ channels open and Na⁺ rushes in, driving the membrane toward the Na⁺ equilibrium potential (about +50 to +60 mV). Repolarization: Na⁺ channels inactivate and slower voltage-gated K⁺ channels let K⁺ out. Hyperpolarization: K⁺ channels close slowly, so the membrane undershoots rest. Na⁺ channel inactivation causes the absolute refractory period; during the relative one, around the undershoot, only a stronger stimulus can fire.","trap":"Repolarization is driven by K⁺ efflux through voltage-gated K⁺ channels, not by the Na⁺/K⁺ ATPase, which restores gradients slowly and is not needed for individual spikes."},{"id":"myelination","title":"Myelination and saltatory conduction","section":"bb","disc":"Physiology","parent":"nervous-system","hub":false,"summary":"Myelin is lipid-rich membrane wrapped around axons by oligodendrocytes in the CNS (one cell myelinates many axons) and Schwann cells in the PNS (one cell per segment). It raises membrane resistance and lowers capacitance, so current spreads farther passively and the spike is regenerated only at nodes of Ranvier, where Na⁺ channels cluster. This saltatory conduction is faster and uses less ATP; wider axons also conduct faster.","trap":"Oligodendrocytes myelinate CNS axons and Schwann cells myelinate PNS axons; swapping them is a classic error, and multiple sclerosis attacks CNS myelin."},{"id":"synapses","title":"Synapses (chemical and electrical)","section":"bb","disc":"Physiology","parent":"nervous-system","hub":false,"summary":"At a chemical synapse, an arriving action potential opens voltage-gated Ca²⁺ channels; Ca²⁺ triggers vesicle exocytosis, and transmitter crosses the cleft to bind ionotropic (ion channel, fast) or metabotropic (G protein, slower) receptors. Transmission is one-way, delayed about 0.5–1 ms, and can be amplified or modulated. Electrical synapses pass current directly through gap junctions, so they are nearly instant and usually bidirectional; gap junctions also couple cardiac muscle cells.","trap":"Ca²⁺ influx, not Na⁺ influx, is the direct trigger for vesicle release at the axon terminal."},{"id":"neurotransmitters","title":"Neurotransmitters","section":"bb","disc":"Physiology","parent":"synapses","hub":false,"summary":"Glutamate is the main excitatory CNS transmitter; GABA (mainly brain) and glycine (mainly spinal cord and brainstem) are inhibitory, largely by opening Cl⁻ channels that hyperpolarize the cell. Acetylcholine acts at neuromuscular junctions, autonomic ganglia and parasympathetic targets. Catecholamines (dopamine, norepinephrine, epinephrine) come from tyrosine and serotonin from tryptophan. Whether a transmitter excites or inhibits depends on the receptor it binds.","trap":"A transmitter is not inherently excitatory or inhibitory: acetylcholine excites skeletal muscle through nicotinic receptors but slows the heart through muscarinic receptors."},{"id":"nt-clearance","title":"Neurotransmitter reuptake and degradation","section":"bb","disc":"Physiology","parent":"synapses","hub":false,"summary":"A transmitter's signal ends when it leaves the cleft: by reuptake transporters into the presynaptic terminal or glia (dopamine, norepinephrine, serotonin, glutamate, GABA), by enzymes (acetylcholinesterase splits ACh into acetate and choline; MAO and COMT degrade monoamines), or by diffusion away. Many drugs work by blocking these steps, which prolongs and strengthens transmitter action.","trap":"Acetylcholine is cleared by enzymatic hydrolysis in the cleft, not by reuptake; only its choline product is taken back up."},{"id":"endocrine-system","title":"Endocrine system","section":"bb","disc":"Physiology","parent":null,"hub":true,"summary":"Endocrine glands secrete hormones into the blood to act on distant cells that carry matching receptors. A hormone's chemistry predicts its behavior: water-soluble peptides and catecholamines bind surface receptors and act fast through second messengers, while lipid-soluble steroids and thyroid hormones ride carrier proteins, enter cells and change transcription slowly. The hypothalamus and pituitary coordinate most glands, and negative feedback holds levels near set points.","trap":null},{"id":"peptide-hormones","title":"Peptide hormones","section":"bb","disc":"Physiology","parent":"endocrine-system","hub":false,"summary":"Peptide hormones (insulin, glucagon, ADH, oxytocin, ACTH, PTH, calcitonin) are made on the rough ER as larger preprohormones, cleaved and packaged in the Golgi, and stored in ve
