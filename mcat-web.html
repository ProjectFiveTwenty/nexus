"s":"stigma","t":"norms-deviance","type":"part-of","why":"Stigma is the social disapproval attached to traits or behaviors defined as deviant."},{"s":"stigma","t":"sick-role","type":"affects","why":"Illnesses seen as self-inflicted or shameful, like addiction, are often denied the sick role's exemption from blame."},{"s":"anomie","t":"psychoactive-drugs","type":"applies-to","why":"Merton's retreatism describes people who reject both cultural goals and legitimate means and withdraw, with chronic substance use as the classic example."},{"s":"anomie","t":"norms-deviance","type":"part-of","why":"Anomie is a condition in which norms break down, a foundational idea in theories of deviance."},{"s":"anomie","t":"norms-deviance","type":"explains","why":"Merton's strain theory explains deviance as a response to anomie, the gap between culturally valued goals and access to legitimate means."},{"s":"social-institutions","t":"motivation-attitudes","type":"affects","why":"Religion, education and family instill values and attitudes, and sanctions within institutions shape what people are motivated to pursue."},{"s":"social-institutions","t":"stratification","type":"affects","why":"Institutions reproduce inequality: families pass on wealth, schools sort students by class, and the economy and government distribute power."},{"s":"social-institutions","t":"socialization","type":"affects","why":"Family, schools and religion are the main institutional agents of socialization, transmitting a society's norms and values to new members."},{"s":"family","t":"schizophrenia","type":"affects","why":"High expressed emotion in families, meaning frequent criticism, hostility or overinvolvement, raises the risk of relapse in schizophrenia."},{"s":"family","t":"social-mobility","type":"affects","why":"Families transmit wealth, social networks and cultural capital to children, so parental class strongly predicts children's class."},{"s":"family","t":"socialization","type":"affects","why":"The family is the primary agent of socialization, teaching language, norms and values during the earliest years."},{"s":"family","t":"social-institutions","type":"part-of","why":"Family is the institution that organizes kinship, reproduction and early socialization."},{"s":"education","t":"intelligence","type":"affects","why":"Extra years of schooling modestly raise measured IQ scores; teacher-expectancy (Pygmalion) effects on test scores also occur but are usually small in later studies."},{"s":"education","t":"social-mobility","type":"affects","why":"Educational credentials are a main route to upward mobility, but tracking and unequal school funding can lock in parents' class position."},{"s":"education","t":"socialization","type":"affects","why":"Through the hidden curriculum, schools socialize students into norms like punctuality, obedience to authority and competition."},{"s":"education","t":"social-institutions","type":"part-of","why":"Education is the institution that transmits knowledge, norms and credentials across generations."},{"s":"religion","t":"appraisal","type":"affects","why":"Religious beliefs and congregations can change how stressors are appraised and add perceived coping resources, one route by which religiosity buffers stress."},{"s":"religion","t":"norms-deviance","type":"affects","why":"Religions supply many mores and taboos and enforce them with informal sanctions, shaping what a society treats as deviant."},{"s":"religion","t":"social-institutions","type":"part-of","why":"Religion is the institution organizing shared beliefs about the sacred and the moral norms tied to them."},{"s":"religion","t":"economy-government","type":"affects","why":"Weber argued that the Protestant ethic of disciplined work and saving helped give rise to modern capitalism."},{"s":"economy-government","t":"social-mobility","type":"affects","why":"Economic shifts such as industrialization and growth of service jobs create structural mobility, moving many people up regardless of individual effort."},{"s":"economy-government","t":"health-disparities","type":"affects","why":"Policies on insurance and welfare shape access to care; where insurance depends largely on employment, as in the U.S., low-wage workers are more often uninsured."},{"s":"economy-government","t":"obedience","type":"explains","why":"Weber's idea of legitimate authority helps explain why Milgram's obedience rates fell when the study moved from Yale to a run-down office lacking institutional prestige."},{"s":"economy-government","t":"social-institutions","type":"part-of","why":"The economy and government are the institutions that produce and distribute resources and power."},{"s":"medicalization","t":"reproductive-system","type":"applies-to","why":"Childbirth moved from home to hospital under physician control, and menopause came to be treated as a hormone-deficiency condition."},{"s":"medicalization","t":"stimulants","type":"affects","why":"Defining attention problems as ADHD contributed to widespread prescription of stimulants such as methylphenidate and amphetamines."},{"s":"medicalization","t":"psych-disorders","type":"applies-to","why":"Conditions like ADHD and alcoholism were redefined as diagnosable disorders, while homosexuality was demedicalized when it was removed from the diagnostic manual in 1973."},{"s":"medicalization","t":"social-institutions","type":"part-of","why":"Medicalization describes how the institution of medicine extends its authority over areas of life."},{"s":"medicalization","t":"sick-role","type":"affects","why":"Once a condition is medicalized, sufferers can claim the sick role, gaining exemption from blame and normal duties."},{"s":"sick-role","t":"psych-disorders","type":"applies-to","why":"The sick role fits mental illness poorly: patients are often blamed rather than excused, and poor insight can block the duty to seek help."},{"s":"sick-role","t":"norms-deviance","type":"applies-to","why":"Parsons treated illness as deviance from normal role obligations that the sick role legitimizes only while the person seeks to recover."},{"s":"sick-role","t":"social-institutions","type":"part-of","why":"The sick role describes the expected behavior of patients within the institution of medicine."},{"s":"research-design","t":"psych-disorders","type":"applies-to","why":"Disorder research mixes designs: randomized trials test treatments, while cohort, case-control and twin studies probe causes that cannot be ethically manipulated."},{"s":"research-design","t":"statistics","type":"prerequisite","why":"How data were collected (sampling, assignment, blinding) determines which statistical conclusions are valid; no analysis can repair a biased design."},{"s":"scientific-method","t":"psychoanalytic","type":"applies-to","why":"Freud's concepts are criticized as hard to falsify, because unconscious conflict can explain almost any behavior after the fact rather than predicting it."},{"s":"scientific-method","t":"research-design","type":"part-of","why":"The scientific method is the logic every research design serves: turn a question into a testable hypothesis, then collect data able to refute it."},{"s":"scientific-method","t":"variables","type":"prerequisite","why":"Turning a hypothesis into a test requires operationally defining which variable is manipulated (IV) and which outcome is measured (DV)."},{"s":"scientific-method","t":"hypothesis-testing","type":"prerequisite","why":"Statistical testing formalizes the scientific hypothesis as a null of no effect and an alternative, then asks whether the data are unlikely under the null."},{"s":"experimental-design","t":"research-design","type":"part-of","why":"Experiments are the research design that manipulates a variable and assigns participants, the only design that directly supports causal conclusions."},{"s":"experimental-design","t":"observational-studies","type":"contrasts","why":"Experiments assign the exposure, so confounds are balanced and causal claims are possible; observational studies only record exposures, so they reveal associations."},{"s":"experimental-design","t":"validity-reliability","type":"affects","why":"Tightly controlled lab experiments maximize internal validity, but artificial settings and narrow samples can reduce external validity."},{"s":"variables","t":"michaelis-menten","type":"applies-to","why":"In an enzyme kinetics assay substrate concentration is the IV (x-axis) and initial velocity the DV (y-axis), with enzyme amount, pH and temperature held constant."},{"s":"variables","t":"health-disparities","type":"applies-to","why":"Many racial health gaps shrink but persist after statistically controlling for income or education, so SES accounts for only part of these disparities."},{"s":"variables","t":"experimental-design","type":"part-of","why":"Every experiment is built from an independent variable that is manipulated, a dependent variable that is measured and confounds that must be controlled."},{"s":"variables","t":"randomization","type":"prerequisite","why":"Recognizing confounding variables explains why random assignment matters: it spreads confounders, including unknown ones, evenly across groups."},{"s":"controls","t":"lineweaver-burk","type":"applies-to","why":"Inhibitor type is identified by comparing an inhibited run with a no-inhibitor control under identical conditions; Lineweaver–Burk lines are read relative to that control."},{"s":"controls","t":"biopsychosocial","type":"applies-to","why":"Placebo responses show that expectation alone can produce measurable symptom relief, evidence that psychological factors shape health as the biopsychosocial model holds."},{"s":"controls","t":"depression","type":"applies-to","why":"Depression trials show large placebo responses, so an antidepressant's effect is the improvement beyond the placebo group, not patients' total improvement."},{"s":"controls","t":"experimental-design","type":"part-of","why":"Control groups and placebos give an experiment its baseline, so the effect of the manipulation can be separated from everything else."},{"s":"controls","t":"randomization","type":"prerequisite","why":"A placebo group separates drug effects from expectation only if participants are blinded, since knowing one got an inert pill removes the expectation."},{"s":"randomization","t":"education","type":"applies-to","why":"Rosenthal and Jacobson randomly chose which students teachers were told would bloom, so later gains could be credited to teacher expectations (the Pygmalion effect)."},{"s":"randomization","t":"experimental-design","type":"part-of","why":"Random assignment and blinding are the experimental tools that remove confounding and expectation effects from the comparison between groups."},{"s":"observational-studies","t":"genes-behavior","type":"applies-to","why":"Twin and adoption studies are observational: researchers cannot assign genes or families, so they compare naturally occurring groups such as MZ versus DZ twins."},{"s":"observational-studies","t":"research-design","type":"part-of","why":"Observational studies are research designs that measure exposures and outcomes without assigning them, used when manipulation is impossible or unethical."},{"s":"relative-risk","t":"schizophrenia","type":"applies-to","why":"Heavy adolescent cannabis use carries a higher relative risk of schizophrenia, an observational association that by itself cannot rule out confounding or reverse causation."},{"s":"relative-risk","t":"observational-studies","type":"part-of","why":"Relative risk summarizes cohort studies and the odds ratio summarizes case-control studies, so each measure follows from how the study selected participants."},{"s":"correlation-causation","t":"ses","type":"applies-to","why":"The SES–health gradient could reflect low SES harming health (social causation) or illness lowering income and status (health selection, or drift)."},{"s":"correlation-causation","t":"research-design","type":"part-of","why":"Whether a design can separate correlation from causation is the central question in judging what any study's conclusions can claim."},{"s":"correlation-causation","t":"observational-studies","type":"applies-to","why":"Because observational studies do not assign exposure, their associations may reflect confounding or reverse causation and cannot by themselves prove causation."},{"s":"sampling","t":"research-design","type":"part-of","why":"How participants are sampled decides whom a study's results can be generalized to, a core design choice made before any data are collected."},{"s":"sampling","t":"validity-reliability","type":"affects","why":"Selection bias undermines external validity: results from an unrepresentative sample, such as only college volunteers, may not generalize to the population."},{"s":"sampling","t":"statistical-power","type":"affects","why":"Larger samples raise power and narrow confidence intervals by reducing random error, though they cannot correct a biased sampling method."},{"s":"validity-reliability","t":"intelligence","type":"applies-to","why":"IQ tests must give stable scores on retest (reliability) and predict outcomes such as school performance (validity); cultural bias claims are validity questions."},{"s":"validity-reliability","t":"trait-theory","type":"applies-to","why":"Big Five inventories are judged by test–retest reliability and by validity, such as whether conscientiousness scores predict job performance."},{"s":"validity-reliability","t":"research-design","type":"part-of","why":"Validity and reliability are the standards a design and its measures must meet for results to be accurate, consistent and generalizable."},{"s":"research-ethics","t":"health-disparities","type":"applies-to","why":"Belmont's justice principle responded partly to the Tuskegee study, which withheld syphilis treatment from Black men; that abuse is linked to lasting medical mistrust affecting care."},{"s":"research-ethics","t":"research-design","type":"part-of","why":"Ethical rules such as informed consent and IRB review limit which designs may be used, often forcing observational rather than experimental approaches."},{"s":"research-ethics","t":"controls","type":"affects","why":"When an effective treatment exists, giving a placebo instead is usually unethical, so new drugs are often compared with standard care rather than placebo."},{"s":"statistics","t":"thresholds","type":"applies-to","why":"Psychophysical thresholds are statistical definitions: the absolute threshold is the intensity detected on 50% of trials, not a fixed cutoff."},{"s":"descriptive-stats","t":"poverty","type":"applies-to","why":"Relative poverty lines use a fraction (often 50–60%) of median income, because the median, unlike the mean, is not inflated by a few top earners."},{"s":"descriptive-stats","t":"statistics","type":"part-of","why":"Measures of center and spread are the descriptive layer of statistics, summarizing a sample before any inference about the population."},{"s":"descriptive-stats","t":"normal-distribution","type":"prerequisite","why":"A normal curve is defined entirely by its mean and standard deviation, and z-scores express values as standard deviations from the mean."},{"s":"descriptive-stats","t":"skewed-distributions","type":"explains","why":"The mean is pulled by extreme values while the median is not, so a long tail drags the mean past the median toward the tail."},{"s":"normal-distribution","t":"intelligence","type":"applies-to","why":"IQ is normed to mean 100 and SD 15, so about 68% of people score 85–115 and about 95% score 70–130."},{"s":"normal-distribution","t":"statistics","type":"part-of","why":"The normal distribution is the reference shape for much of statistics, underlying z-scores, the 68–95–99.7 rule and many significance tests."},{"s":"normal-distribution","t":"hypothesis-testing","type":"prerequisite","why":"p-values are tail areas of a sampling distribution, often normal or t-shaped, so reading them requires understanding how the curve's tails work."},{"s":"skewed-distributions","t":"kmt","type":"applies-to","why":"Maxwell–Boltzmann speed curves are right-skewed: the most probable speed lies below the mean speed, which lies below the rms speed, as mode < mean in right skew."},{"s":"skewed-distributions","t":"ses","type":"applies-to","why":"Income and especially wealth are right-skewed, so the mean exceeds the median, which is why typical household income is reported as a median."},{"s":"skewed-distributions","t":"statistics","type":"part-of","why":"Skewed distributions are the asymmetric shapes statistics must recognize, because skew changes which measure of center describes the data fairly."},{"s":"skewed-distributions","t":"normal-distribution","type":"contrasts","why":"A normal distribution is symmetric with mean = median = mode, whereas a skewed one separates them, with the mean lying closest to the tail."},{"s":"hypothesis-testing","t":"statistics","type":"part-of","why":"Hypothesis testing is the core of inferential statistics, deciding whether a sample result is too unlikely under the null hypothesis to be chance."},{"s":"type-errors","t":"signal-detection","type":"applies-to","why":"A false alarm is a type I error (reporting a signal that is absent) and a miss is a type II error (failing to report one present)."},{"s":"type-errors","t":"hypothesis-testing","type":"part-of","why":"Every hypothesis test risks two mistakes, rejecting a true null (type I) or missing a real effect (type II), set by α and β."},{"s":"type-errors","t":"statistical-power","type":"prerequisite","why":"Power is defined as 1 − β, the complement of the type II error rate, so power cannot be understood without type II errors."},{"s":"type-errors","t":"sensitivity-specificity","type":"applies-to","why":"False positives and false negatives in hypothesis testing parallel those in diagnosis: specificity limits false positives and sensitivity limits false negatives."},{"s":"statistical-power","t":"hypothesis-testing","type":"part-of","why":"Power is the hypothesis test's ability to detect a real effect, the complement of the type II error rate."},{"s":"confidence-intervals","t":"relative-risk","type":"applies-to","why":"A relative risk or odds ratio whose 95% confidence interval includes 1 is not statistically significant, because 1 means no association."},{"s":"confidence-intervals","t":"statistics","type":"part-of","why":"Confidence intervals are the inferential tool that estimates a population value with a range, showing both effect size and precision."},{"s":"confidence-intervals","t":"hypothesis-testing","type":"applies-to","why":"A 95% confidence interval that excludes the null value matches p < 0.05 in a two-sided test, while also showing effect size and precision."},{"s":"correlation-coefficient","t":"uv-spec","type":"applies-to","why":"A Beer–Lambert standard curve of absorbance against known concentrations should be linear, with r² near 1, before it is used to find unknown concentrations."},{"s":"correlation-coefficient","t":"genes-behavior","type":"applies-to","why":"Twin studies compare a trait's correlation between identical twins with that between fraternal twins; a clearly higher identical-twin correlation points to genetic influence."},{"s":"correlation-coefficient","t":"correlation-causation","type":"prerequisite","why":"Pearson's r quantifies how tightly two variables move together, but even r near ±1 cannot reveal which causes which or rule out a third variable."},{"s":"correlation-coefficient","t":"validity-reliability","type":"applies-to","why":"Test–retest and inter-rater reliability are quantified as correlations between two sets of scores, with r near 1 meaning consistent measurement."},{"s":"correlation-coefficient","t":"statistics","type":"part-of","why":"Pearson's r is the standard statistic for summarizing how strongly and in which direction two quantitative variables are linearly related."},{"s":"sensitivity-specificity","t":"signal-detection","type":"     kids[n.id()].forEach(function (k) { core = core.union(cy.getElementById(k)); });
    core = core.not(".off");
    var near = set.filter(function (m) {
      var a = m.position(), b = n.position();
      return Math.hypot(a.x - b.x, a.y - b.y) < 420;
    });
    core = core.union(near);
    fitTo(core, 60, 1.1, true, 0.55);
  }

  /* ---------- Focus, edges, paths ---------- */
  function clearHighlights() {
    cy.batch(function () { cy.elements(".dim, .hl, .lbl, .sel, .path").removeClass("dim hl lbl sel path"); });
    state.focusSet = null;
    applySizes();
  }
  function neighborhood(n, hops) {
    var nodes = n, frontier = n;
    for (var i = 0; i < hops; i++) {
      var next = frontier.connectedEdges().not(".off").connectedNodes().not(".off");
      nodes = nodes.union(next);
      frontier = next;
    }
    // A topic hub always brings its subtopics along.
    var sub = cy.collection();
    kids[n.id()].forEach(function (k) { sub = sub.union(cy.getElementById(k)); });
    return nodes.union(sub.not(".off"));
  }
  function setEmpty(isEmpty) { $("stage").classList.toggle("empty", isEmpty); cy.resize(); }
  function hideHint() { var h = $("hint"); if (h) h.hidden = true; }
  function setHash(id) {
    try { history.replaceState(null, "", id ? "#" + id : location.pathname + location.search); } catch (e) {}
  }

  function highlight(set, edges, selId) {
    cy.batch(function () {
      cy.elements().not(set).not(edges).not(".cat").addClass("dim");
      edges.addClass("hl");
      if (selId) {
        var sel = cy.getElementById(selId);
        sel.addClass("sel");
        edges.filter(function (e) {
          return e.data("type") !== "part-of" && (e.source().same(sel) || e.target().same(sel));
        }).addClass("lbl");
      } else {
        edges.addClass("lbl");
      }
      cy.edges(".lbl").data("fs", LBL.edge / cy.zoom());
    });
    state.focusSet = set;
    applySizes();
    cullLabels();
  }

  function focusNode(id, pathInfo) {
    var n = cy.getElementById(id);
    if (!n.nonempty() || n.hasClass("off") || n.hasClass("cat")) return;
    hideHint();
    clearHighlights();
    state.sel = id;
    state.mode = "focus";
    var set = neighborhood(n, state.hops);
    var edges = set.edgesWith(set).not(".off");
    highlight(set, edges, id);
    setEmpty(false);
    renderNode(id, pathInfo || null);
    fitFocus(n, set);
    setHash(id);
  }

  function showEdge(edge) {
    hideHint();
    clearHighlights();
    state.sel = null;
    state.mode = "edge";
    var ends = edge.connectedNodes();
    highlight(ends, edge, null);
    setEmpty(false);
    renderEdge(edge.data());
    fitTo(ends, 120, 1.3);
  }

  function clearFocus() {
    clearHighlights();
    state.sel = null;
    state.mode = "overview";
    setEmpty(true);
    renderIntro();
    fitAll();
    setHash(null);
    cullLabels();
  }

  function findPath(fromId, toId) {
    var vis = cy.elements().not(".off").not(".cat");
    // Contrast links count as a longer step, so routes prefer links that explain or affect.
    var r = vis.aStar({
      root: cy.getElementById(fromId), goal: cy.getElementById(toId), directed: false,
      weight: function (e) { return e.data("type") === "contrasts" ? 1.6 : 1; }
    });
    if (!r.found) return { found: false, to: toId };
    clearHighlights();
    state.mode = "path";
    cy.batch(function () { r.path.addClass("path"); });
    cy.getElementById(fromId).addClass("sel");
    highlight(r.path.nodes(), r.path.edges(), null);
    var steps = [];
    r.path.edges().forEach(function (e) {
      var d = e.data();
      steps.push({ s: d.source, t: d.target, verb: d.verb, why: d.why });
    });
    fitTo(r.path, 90, 1.3);
    return { found: true, to: toId, steps: steps };
  }

  /* ---------- Panel rendering ---------- */
  var panel = $("panel");
  function fmt(n) { return n.toLocaleString("en-US"); }

  function renderIntro() {
    var hubCount = DATA.nodes.filter(function (n) { return n.hub; }).length;
    var cross = 0;
    DATA.edges.forEach(function (e) { if (byId[e.s].section !== byId[e.t].section) cross++; });
    var legend = Object.keys(REL).map(function (k) {
      return "<li><code>" + esc(k) + "</code><span>" + esc(REL[k].help) + "</span></li>";
    }).join("");
    var starts = STARTS.map(function (id) {
      return '<button type="button" class="chip" data-go="' + esc(id) + '">' + esc(byId[id].title) + "</button>";
    }).join("");
    var secs = SEC_ORDER.map(function (s) {
      return '<span><span class="dot ' + s + '"></span>' + esc(SECTION[s].name) + "</span>";
    }).join("");
    panel.innerHTML =
      '<div class="eyebrow">Start here</div>' +
      "<h2>The MCAT on one map</h2>" +
      '<p class="summary">' + fmt(DATA.nodes.length) + " concepts from " + CATS.length + " subject areas. " +
      fmt(hubCount) + " topic hubs anchor the map, and each one sits among its subtopics. " +
      fmt(DATA.edges.length) + " links show how the ideas depend on each other.</p>" +
      '<p class="summary">Zoom in to read every label. Click any concept to see its neighbors and the reason behind each link.</p>' +
      (starts ? '<h3>Try one</h3><div class="starts">' + starts + "</div>" : "") +
      "<h3>Reading the map</h3>" +
      '<ul class="keys">' +
      '<li><span class="sym hub"></span><span>Topic hub. A main topic, ringed and larger.</span></li>' +
      '<li><span class="sym con"></span><span>Concept. Bigger dots have more links.</span></li>' +
      '<li><span></span><span class="secs">' + secs + "</span></li></ul>" +
      "<h3>How links read</h3>" +
      '<p class="note" style="margin:0 0 8px">Each link reads as a sentence from one concept to the next: A explains B, A affects B. Arrows show the direction when you focus a concept.</p>' +
      '<ul class="legend">' + legend + "</ul>" +
      '<div class="stats">' + fmt(DATA.nodes.length) + " concepts · " + fmt(DATA.edges.length) + " links · " + fmt(cross) + " cross-section</div>";
    panel.scrollTop = 0;
  }

  function relItem(d, otherId, outgoing) {
    var o = byId[otherId];
    var line = outgoing
      ? '<span class="rel">' + esc(d.verb) + "</span> <strong>" + esc(o.title) + "</strong>"
      : "<strong>" + esc(o.title) + '</strong> <span class="rel">' + esc(d.verb) + " this</span>";
    return '<li><button type="button" data-go="' + esc(otherId) + '">' + line +
      '<span class="why">' + esc(d.why) + "</span></button></li>";
  }

  function renderNode(id, pathInfo) {
    var n = byId[id];
    var out = [], inn = [];
    var childSet = {};
    kids[id].forEach(function (k) { childSet[k] = true; });
    cy.getElementById(id).connectedEdges().not(".off").forEach(function (e) {
      var d = e.data();
      // The breadcrumb and the subtopic list already show these part-of links.
      if (d.type === "part-of" && ((d.source === id && d.target === n.parent) || (d.target === id && childSet[d.source]))) return;
      if (d.source === id) out.push(relItem(d, d.target, true));
      else inn.push(relItem(d, d.source, false));
    });
    var crumbs = ['<span>' + esc(n.disc) + "</span>"].concat(ancestors(id).map(function (a) {
      return '<button type="button" data-go="' + esc(a) + '">' + esc(byId[a].title) + "</button>";
    })).join('<span class="sep" aria-hidden="true">›</span>');
    var subs = kids[id].map(function (k) {
      var off = cy.getElementById(k).hasClass("off");
      return '<button type="button" class="chip"' + (off ? " disabled" : "") + ' data-go="' + esc(k) + '">' + esc(byId[k].title) + "</button>";
    }).join("");
    var html =
      '<div class="panel-head"><div class="eyebrow"><span class="dot ' + esc(n.section) + '"></span>' +
      esc(SECTION[n.section].name) + (n.hub ? ' <span class="tag">Topic hub</span>' : "") + "</div>" +
      '<button type="button" class="close" data-clear="1">Close</button></div>' +
      '<nav class="crumbs" aria-label="Where this sits">' + crumbs + "</nav>" +
      "<h2>" + esc(n.title) + "</h2>" +
      '<p class="summary">' + esc(n.summary) + "</p>" +
      (n.trap ? '<div class="trap"><b>Common trap</b>' + esc(n.trap) + "</div>" : "") +
      (subs ? '<h3>Subtopics <span class="n">' + kids[id].length + '</span></h3><div class="starts subs">' + subs + "</div>" : "") +
      (out.length ? '<h3>Where it leads <span class="n">' + out.length + '</span></h3><ul class="links">' + out.join("") + "</ul>" : "") +
      (inn.length ? '<h3>What leads to it <span class="n">' + inn.length + '</span></h3><ul class="links">' + inn.join("") + "</ul>" : "") +
      "<h3>Find a connection</h3>" +
      '<div class="pathbox"><input id="pathTo" list="nodelist" placeholder="Path to another concept" aria-label="Path to another concept" autocomplete="off">' +
      '<button type="button" class="btn" id="pathGo">Trace</button></div>';
    if (pathInfo) {
      if (!pathInfo.found) {
        html += '<p class="note">No route between these two with the current filters.</p>';
      } else {
        var items = pathInfo.steps.map(function (s) {
          return "<li><strong>" + esc(byId[s.s].title) + "</strong> " + esc(s.verb) + " <strong>" +
            esc(byId[s.t].title) + '</strong><span class="why">' + esc(s.why) + "</span></li>";
        }).join("");
        html += '<ol class="steps">' + items + "</ol>";
      }
    }
    panel.innerHTML = html;
    panel.scrollTop = 0;
  }

  function renderEdge(d) {
    var a = byId[d.source], b = byId[d.target];
    panel.innerHTML =
      '<div class="panel-head"><div class="eyebrow">Link · ' + esc(d.type) + "</div>" +
      '<button type="button" class="close" data-clear="1">Close</button></div>' +
      "<h2>" + esc(a.title) + " <span style=\"color:var(--muted);font-weight:600\">" + esc(d.verb) + "</span> " + esc(b.title) + "</h2>" +
      '<p class="summary">' + esc(d.why) + "</p>" +
      '<h3>Open a concept</h3><div class="starts">' +
      '<button type="button" class="chip" data-go="' + esc(a.id) + '">' + esc(a.title) + "</button>" +
      '<button type="button" class="chip" data-go="' + esc(b.id) + '">' + esc(b.title) + "</button></div>";
    panel.scrollTop = 0;
  }

  panel.addEventListener("click", function (ev) {
    var go = ev.target.closest("[data-go]");
    if (go) { reveal(go.getAttribute("data-go")); focusNode(go.getAttribute("data-go")); return; }
    if (ev.target.closest("[data-clear]")) { clearFocus(); return; }
    if (ev.target.closest("#pathGo")) { runPath(); }
  });
  panel.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.id === "pathTo") { ev.preventDefault(); runPath(); }
  });

  function resolveTitle(text) {
    var q = text.trim().toLowerCase();
    if (!q) return null;
    var hit = DATA.nodes.filter(function (n) { return n.title.toLowerCase() === q || n.id === q; })[0];
    if (hit) return hit.id;
    var part = DATA.nodes.filter(function (n) { return n.title.toLowerCase().indexOf(q) === 0; });
    return part.length === 1 ? part[0].id : null;
  }
  function runPath() {
    var input = $("pathTo");
    if (!input || !state.sel) return;
    var to = resolveTitle(input.value);
    if (!to) {
      var msg = panel.querySelector(".pathmsg");
      if (!msg) {
        msg = document.createElement("p");
        msg.className = "note pathmsg";
        input.parentNode.insertAdjacentElement("afterend", msg);
      }
      msg.textContent = "Pick a concept from the list so the map knows which one you mean.";
      return;
    }
    if (to === state.sel) return;
    var from = state.sel;
    var info = findPath(from, to);
    state.sel = from;
    renderNode(from, info);
    // Bring the route into view in the panel.
    var box = panel.querySelector(".pathbox");
    if (box) panel.scrollTop += box.getBoundingClientRect().top - panel.getBoundingClientRect().top - 48;
  }

  /* ---------- Graph events ---------- */
  cy.on("tap", "node", function (ev) { if (!ev.target.hasClass("cat")) focusNode(ev.target.id()); });
  cy.on("tap", "edge", function (ev) { showEdge(ev.target); });
  cy.on("tap", function (ev) { if (ev.target === cy && !$("stage").classList.contains("empty")) clearFocus(); });

  $("fit").addEventListener("click", function () { fitAll(); });
  $("reset").addEventListener("click", clearFocus);
  document.querySelectorAll("[data-hops]").forEach(function (b) {
    b.addEventListener("click", function () {
      state.hops = Number(b.getAttribute("data-hops"));
      document.querySelectorAll("[data-hops]").forEach(function (x) {
        x.setAttribute("aria-pressed", x === b ? "true" : "false");
      });
      if (state.sel) focusNode(state.sel);
    });
  });

  /* ---------- Filters ---------- */
  var filters = $("filters"), relrow = $("relrow"), catrow = $("catrow");
  function chip(attr, key, html, title) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.setAttribute("aria-pressed", "true");
    b.setAttribute(attr, key);
    if (title) b.title = title;
    b.innerHTML = html;
    return b;
  }
  SEC_ORDER.forEach(function (k) {
    filters.appendChild(chip("data-sec", k, '<span class="dot ' + k + '"></span>' + esc(SECTION[k].name)));
  });
  function menuChip(label, row) {
    var m = document.createElement("button");
    m.type = "button";
    m.className = "chip menu";
    m.setAttribute("aria-expanded", "false");
    m.setAttribute("aria-controls", row.id);
    m.innerHTML = esc(label) + ' <span class="n"></span>';
    filters.appendChild(m);
    return m;
  }
  var catMenu = menuChip("Categories", catrow);
  var relMenu = menuChip("Link types", relrow);
  CATS.forEach(function (c) {
    catrow.appendChild(chip("data-cat", c, '<span class="dot ' + catSec[c] + '"></span>' + esc(c)));
  });
  Object.keys(REL).forEach(function (k) { relrow.appendChild(chip("data-rel", k, esc(k), REL[k].help)); });
  function toggleMenu(menu, row, other, otherRow) {
    var open = row.hidden;
    row.hidden = !open;
    menu.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) { otherRow.hidden = true; other.setAttribute("aria-expanded", "false"); }
  }
  catMenu.addEventListener("click", function () { toggleMenu(catMenu, catrow, relMenu, relrow); });
  relMenu.addEventListener("click", function () { toggleMenu(relMenu, relrow, catMenu, catrow); });

  function syncChips() {
    filters.querySelectorAll("[data-sec]").forEach(function (b) {
      b.setAttribute("aria-pressed", state.secOn[b.getAttribute("data-sec")] ? "true" : "false");
    });
    catrow.querySelectorAll("[data-cat]").forEach(function (b) {
      b.setAttribute("aria-pressed", state.catOn[b.getAttribute("data-cat")] ? "true" : "false");
    });
    relrow.querySelectorAll("[data-rel]").forEach(function (b) {
      b.setAttribute("aria-pressed", state.relOn[b.getAttribute("data-rel")] ? "true" : "false");
    });
    var catOff = CATS.filter(function (c) { return !state.catOn[c]; }).length;
    var relOff = Object.keys(REL).filter(function (k) { return !state.relOn[k]; }).length;
    catMenu.querySelector(".n").textContent = catOff ? (CATS.length - catOff) + "/" + CATS.length : "";
    relMenu.querySelector(".n").textContent = relOff ? (Object.keys(REL).length - relOff) + "/" + Object.keys(REL).length : "";
  }

  function nodeOn(sec, disc) { return state.secOn[sec] && state.catOn[disc]; }
  function applyFilters() {
    cy.batch(function () {
      cy.nodes().forEach(function (n) { n.toggleClass("off", !nodeOn(n.data("section"), n.data("disc"))); });
      cy.edges().forEach(function (e) {
        var hide = !state.relOn[e.data("type")] || e.source().hasClass("off") || e.target().hasClass("off");
        e.toggleClass("off", hide);
      });
    });
    syncChips();
    if (state.sel && cy.getElementById(state.sel).hasClass("off")) { clearFocus(); }
    else if (state.sel) { focusNode(state.sel); }
    else if (state.mode !== "overview") { clearFocus(); }
    else { cullLabels(); }
  }
  // Make sure a concept the reader asks for is visible.
  function reveal(id) {
    var n = byId[id];
    if (!n || nodeOn(n.section, n.disc)) return;
    state.secOn[n.section] = true;
    state.catOn[n.disc] = true;
    applyFilters();
  }
  filters.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-sec]");
    if (!b) return;
    var k = b.getAttribute("data-sec");
    state.secOn[k] = !state.secOn[k];
    applyFilters();
  });
  catrow.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-cat]");
    if (!b) return;
    var k = b.getAttribute("data-cat");
    state.catOn[k] = !state.catOn[k];
    applyFilters();
  });
  relrow.addEventListener("click", function (ev) {
    var b = ev.target.closest("[data-rel]");
    if (!b) return;
    var k = b.getAttribute("data-rel");
    state.relOn[k] = !state.relOn[k];
    applyFilters();
  });

  /* ---------- Search ---------- */
  var q = $("q"), results = $("results"), active = -1, shown = [];
  var lower = DATA.nodes.map(function (n) {
    return { n: n, t: n.title.toLowerCase(), s: (n.summary || "").toLowerCase(), w: n.title.toLowerCase().split(/[\s\-–—/(),.:;']+/) };
  });
  function score(r, term) {
    var t = r.t;
    if (t === term) return 1000;
    if (t.indexOf(term) === 0) return 900;
    if (r.w.some(function (w) { return w.indexOf(term) === 0; })) return 800;
    if (t.indexOf(term) > -1) return 700;
    if (r.n.id.indexOf(term) > -1) return 600;
    if (r.n.disc.toLowerCase().indexOf(term) === 0 && r.n.hub) return 500;
    var i = r.s.indexOf(term);
    if (i > -1) return 100 + Math.max(0, 50 - Math.floor(i / 20));
    return 0;
  }
  function closeResults() {
    results.hidden = true;
    q.setAttribute("aria-expanded", "false");
    q.removeAttribute("aria-activedescendant");
    active = -1;
  }
  function drawResults() {
    var term = q.value.trim().toLowerCase();
    if (!term) { closeResults(); return; }
    shown = lower
      .map(function (r) { return { n: r.n, s: score(r, term) }; })
      .filter(function (r) { return r.s > 0; })
      .sort(function (a, b) { return b.s - a.s || (b.n.hub ? 1 : 0) - (a.n.hub ? 1 : 0) || a.n.title.localeCompare(b.n.title); })
      .slice(0, 10).map(function (r) { return r.n; });
    results.innerHTML = shown.length
      ? shown.map(function (n, i) {
          return '<li role="option" id="opt' + i + '" data-i="' + i + '" aria-selected="' + (i === active) + '"><span class="dot ' + n.section +
            '"></span><span class="t">' + esc(n.title) + (n.hub ? "<small>hub</small>" : "") + '</span><span class="d">' + esc(n.disc) + "</span></li>";
        }).join("")
      : '<li class="none">No concept matches that.</li>';
    results.hidden = false;
    q.setAttribute("aria-expanded", "true");
    if (active >= 0) {
      q.setAttribute("aria-activedescendant", "opt" + active);
      var el = $("opt" + active);
      if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
    } else q.removeAttribute("aria-activedescendant");
  }
  function pick(i) {
    var n = shown[i];
    if (!n) return;
    q.value = "";
    closeResults();
    q.blur();
    reveal(n.id);
    focusNode(n.id);
  }
  q.addEventListener("input", function () { active = -1; drawResults(); });
  q.addEventListener("focus", drawResults);
  q.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowDown") { ev.preventDefault(); active = Math.min(active + 1, shown.length - 1); drawResults(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); active = Math.max(active - 1, 0); drawResults(); }
    else if (ev.key === "Enter") { ev.preventDefault(); pick(active >= 0 ? active : 0); }
    else if (ev.key === "Escape") { closeResults(); q.blur(); }
  });
  results.addEventListener("mousedown", function (ev) {
    var li = ev.target.closest("li[data-i]");
    if (li) { ev.preventDefault(); pick(Number(li.getAttribute("data-i"))); }
  });
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest(".search")) closeResults();
  });
  document.addEventListener("keydown", function (ev) {
    var tag = (ev.target.tagName || "").toLowerCase();
    if (ev.key === "/" && tag !== "input") { ev.preventDefault(); q.focus(); }
    else if (ev.key === "Escape" && tag !== "input" && state.mode !== "overview") { clearFocus(); }
  });
  window.addEventListener("hashchange", function () {
    var id = decodeURIComponent((location.hash || "").slice(1));
    if (id && byId[id] && id !== state.sel) { reveal(id); focusNode(id); }
  });

  /* ---------- Init ---------- */
  var list = $("nodelist");
  list.innerHTML = DATA.nodes
    .slice().sort(function (a, b) { return a.title.localeCompare(b.title); })
    .map(function (n) { return '<option value="' + esc(n.title) + '"></option>'; }).join("");
  $("counts").textContent = fmt(DATA.nodes.length) + " concepts · " + fmt(DATA.edges.length) + " links";
  syncChips();
  renderIntro();
  measureLabels();
  fitAll(false);

  var start = decodeURIComponent((location.hash || "").replace("#", ""));
  if (start && byId[start]) focusNode(start);
  window.__nexus = { cy: cy, state: state, ready: true };
})();
</script>
