 after it."},{"s":"rate-laws","t":"sn2","type":"applies-to","why":"SN2 is a single concerted step, so rate = k[substrate][nucleophile] and depends on both."},{"s":"reaction-order","t":"michaelis-menten","type":"explains","why":"When [S] ≪ Km the rate is first order in [S] (v ≈ Vmax[S]/Km); when [S] ≫ Km it is zero order and equals Vmax."},{"s":"reaction-order","t":"catalytic-efficiency","type":"explains","why":"At low [S], v = (kcat/Km)[E][S], so kcat/Km is a second-order rate constant, capped near the diffusion limit of about 10⁸–10⁹ M⁻¹s⁻¹."},{"s":"reaction-order","t":"rate-laws","type":"part-of","why":"Reaction order is the exponent on each concentration in a rate law."},{"s":"arrhenius","t":"kinetics","type":"part-of","why":"The Arrhenius equation describes how the rate constant depends on temperature and activation energy."},{"s":"arrhenius","t":"catalysts","type":"explains","why":"Because k depends exponentially on Ea, lowering Ea by only about 5.7 kJ/mol at 25 °C makes a reaction roughly ten times faster."},{"s":"activation-energy","t":"atp","type":"explains","why":"ATP hydrolysis is very favorable but has a high Ea, so ATP stays stable in cells until an enzyme lowers the barrier."},{"s":"activation-energy","t":"kinetics","type":"part-of","why":"Activation energy is the barrier that controls reaction rate."},{"s":"activation-energy","t":"arrhenius","type":"prerequisite","why":"Ea is the energy term in the exponent of k = A·e^(−Ea/RT)."},{"s":"activation-energy","t":"catalysts","type":"prerequisite","why":"Catalysts work by providing a lower-Ea pathway, so the barrier concept comes first."},{"s":"collision-theory","t":"proximity-orientation","type":"explains","why":"Enzymes hold substrates close together in the right orientation, raising the effective collision frequency and steric factor."},{"s":"collision-theory","t":"kinetics","type":"part-of","why":"Collision theory explains rates in terms of molecular collisions."},{"s":"collision-theory","t":"arrhenius","type":"explains","why":"The frequency factor A reflects collision rate and orientation, and e^(−Ea/RT) is the fraction of collisions energetic enough to react."},{"s":"transition-state","t":"catalytic-mechanisms","type":"explains","why":"Enzymes bind and stabilize the transition state more tightly than the substrate, lowering the activation energy."},{"s":"transition-state","t":"competitive-inhibition","type":"explains","why":"Transition-state analogs fit the active site better than substrate does, making them very potent competitive inhibitors."},{"s":"transition-state","t":"kinetics","type":"part-of","why":"Transition state theory describes the high-energy configuration reactants must pass through."},{"s":"transition-state","t":"activation-energy","type":"explains","why":"Ea is the energy of the transition state relative to the reactants."},{"s":"transition-state","t":"carbocations","type":"contrasts","why":"A carbocation in SN1 or E1 is an intermediate in a shallow energy well between two transition states, whereas a transition state is an energy maximum that cannot be isolated."},{"s":"catalysts","t":"enzymes","type":"explains","why":"Enzymes are protein catalysts: they lower Ea for both directions and are regenerated, leaving ΔG, K and yield unchanged."},{"s":"catalysts","t":"le-chatelier","type":"contrasts","why":"A catalyst speeds both directions equally, so it causes no equilibrium shift, unlike changes in concentration, pressure or temperature."},{"s":"catalysts","t":"kinetics","type":"part-of","why":"Catalysts are the main way to change a reaction's rate without changing temperature."},{"s":"electrochemistry","t":"electron-carriers","type":"applies-to","why":"NAD⁺/NADH and FAD/FADH₂ are redox couples whose reduction potentials determine which metabolic oxidations they can accept electrons from."},{"s":"electrochemistry","t":"oxphos","type":"applies-to","why":"The electron transport chain is a biological redox series in which electrons flow toward higher reduction potential, releasing energy to pump protons."},{"s":"electrochemistry","t":"nervous-system","type":"applies-to","why":"Ion concentration gradients across neuronal membranes act like concentration cells, generating the potentials that neurons use to signal."},{"s":"galvanic-cells","t":"electrochemistry","type":"part-of","why":"Galvanic cells are electrochemical cells that turn a spontaneous redox reaction into current."},{"s":"galvanic-cells","t":"electrolytic-cells","type":"contrasts","why":"Galvanic cells run spontaneously and have a negative anode; electrolytic cells need external power and have a positive anode."},{"s":"galvanic-cells","t":"circuits","type":"applies-to","why":"A galvanic cell is a battery: its potential difference is the emf that drives current through an external circuit."},{"s":"electrolytic-cells","t":"gel-electrophoresis","type":"applies-to","why":"As in an electrolytic cell, the anode in electrophoresis is positive, so negatively charged DNA and SDS-coated proteins migrate toward it."},{"s":"electrolytic-cells","t":"electrochemistry","type":"part-of","why":"Electrolytic cells are electrochemical cells driven by an external power source."},{"s":"reduction-potentials","t":"etc-complexes","type":"explains","why":"Carriers are ordered by increasing reduction potential from NADH (about −0.32 V) to O₂ (about +0.82 V), so electrons flow spontaneously down the chain."},{"s":"reduction-potentials","t":"electrochemistry","type":"part-of","why":"Reduction potentials rank how strongly species attract electrons and so predict cell voltages."},{"s":"reduction-potentials","t":"galvanic-cells","type":"explains","why":"The half-cell with the higher E°red becomes the cathode, and E°cell = E°cathode − E°anode is positive for a galvanic cell."},{"s":"reduction-potentials","t":"electrolytic-cells","type":"explains","why":"In aqueous electrolysis the cathode reduces whichever species has the more positive E°red, so water, not Na⁺ (E° ≈ −2.7 V), is reduced; molten NaCl yields sodium metal."},{"s":"nernst","t":"resting-potential","type":"explains","why":"With K⁺ about 5 mM outside and 140 mM inside, Nernst gives about −90 mV; resting membranes are mainly K⁺-permeable, so the resting potential lies close to it."},{"s":"nernst","t":"ap-phases","type":"explains","why":"Opening Na⁺ channels drives the membrane toward E_Na (roughly +55 to +60 mV), and opening K⁺ channels pulls it back toward E_K."},{"s":"nernst","t":"electrochemistry","type":"part-of","why":"The Nernst equation gives cell potential under nonstandard concentrations."},{"s":"nernst","t":"galvanic-cells","type":"applies-to","why":"As a galvanic cell discharges, rising Q lowers E until it reaches zero at equilibrium, which is a dead battery."},{"s":"dg-nfe","t":"oxphos","type":"applies-to","why":"With n = 2 and ΔE°′ ≈ 1.14 V from NADH to O₂, ΔG°′ ≈ −220 kJ/mol, enough energy to pump protons for several ATP."},{"s":"dg-nfe","t":"keq","type":"explains","why":"Combining ΔG° = −nFE° with ΔG° = −RT ln K shows that a positive E° corresponds to K > 1."},{"s":"dg-nfe","t":"electrochemistry","type":"part-of","why":"ΔG° = −nFE° connects cell potential to free energy."},{"s":"dg-nfe","t":"galvanic-cells","type":"explains","why":"A positive E°cell gives a negative ΔG°, which is why the reaction in a galvanic cell is spontaneous."},{"s":"faraday","t":"galvanic-cells","type":"applies-to","why":"The same charge-to-moles relation gives how much anode metal dissolves or how much charge a battery delivers per mole of reactant."},{"s":"faraday","t":"electrolytic-cells","type":"part-of","why":"Faraday's laws quantify how much product an electrolytic cell makes for a given charge."},{"s":"faraday","t":"dg-nfe","type":"prerequisite","why":"F converts moles of electrons into coulombs; nF is the charge moved per mole of reaction, and charge times voltage is energy, giving ΔG° = −nFE°."},{"s":"acid-base","t":"amino-acids","type":"applies-to","why":"The amino and carboxyl groups both titrate, so amino acids exist as zwitterions near physiological pH."},{"s":"acid-base","t":"pI","type":"prerequisite","why":"The isoelectric point is calculated from the pKa values of an amino acid's ionizable groups."},{"s":"acid-base","t":"digestive-system","type":"applies-to","why":"Gastric HCl activates pepsin and denatures food proteins, then pancreatic HCO₃⁻ neutralizes chyme so intestinal enzymes can work."},{"s":"acid-base","t":"hh","type":"prerequisite","why":"HH is the Ka expression rewritten in log form, relating pH and pKa to the ratio of base to acid."},{"s":"bronsted-lewis","t":"acid-base-catalysis","type":"applies-to","why":"Side chains such as His act as Brønsted acids and bases, donating or accepting protons to stabilize transition states."},{"s":"bronsted-lewis","t":"coordinate-covalent","type":"explains","why":"When a Lewis base donates its lone pair to a Lewis acid, the bond that forms is a coordinate covalent bond."},{"s":"bronsted-lewis","t":"acid-base","type":"part-of","why":"The Brønsted–Lowry and Lewis definitions set out what counts as an acid or base."},{"s":"bronsted-lewis","t":"nucleophiles","type":"applies-to","why":"Nucleophiles are Lewis bases (electron-pair donors) and electrophiles Lewis acids, so polar organic reactions can be read as Lewis acid–base reactions."},{"s":"kw","t":"acid-base","type":"part-of","why":"Water's autoionization sets the baseline relationship between [H⁺] and [OH⁻] in aqueous acid–base chemistry."},{"s":"kw","t":"ph-poh","type":"prerequisite","why":"Because [H⁺][OH⁻] = 10⁻¹⁴ at 25 °C, taking logs gives pH + pOH = 14."},{"s":"kw","t":"strong-weak","type":"explains","why":"Ka × Kb = Kw, so an acid with a very large Ka must have a conjugate base with a negligibly small Kb."},{"s":"kw","t":"titration","type":"applies-to","why":"At the equivalence point of a strong acid–strong base titration only water's autoionization sets [H⁺], giving pH 7 at 25 °C."},{"s":"ph-poh","t":"lysosomes","type":"applies-to","why":"Lysosomes keep their lumen near pH 5, about 100 times more H⁺ than the cytosol near pH 7, which their acid hydrolases require."},{"s":"ph-poh","t":"stomach","type":"applies-to","why":"Gastric juice near pH 2 has more than 100,000 times the [H⁺] of blood at pH 7.4, because each pH unit is tenfold."},{"s":"ph-poh","t":"acid-base","type":"part-of","why":"pH and pOH are the log scales used to express acidity and basicity."},{"s":"strong-weak","t":"ksp","type":"affects","why":"Salts whose anions are conjugate bases of weak acids, such as CaCO₃ and calcium phosphates, dissolve more in acid because H⁺ protonates the anion, pulling dissolution forward."},{"s":"strong-weak","t":"acid-base","type":"part-of","why":"Classifying acids and bases as strong or weak describes how completely they ionize."},{"s":"strong-weak","t":"vant-hoff-factor","type":"explains","why":"Strong electrolytes dissociate essentially completely and approach their ideal i, whereas weak acids ionize only slightly and have i barely above 1."},{"s":"strong-weak","t":"leaving-groups","type":"explains","why":"Good leaving groups are weak bases, the conjugates of strong acids (I⁻, Br⁻, tosylate, H₂O), because they hold negative charge stably."},{"s":"ka","t":"histidine","type":"applies-to","why":"His's side chain pKa near 6, the closest of any side chain to physiological pH, lets it readily gain or lose a proton, so it shuttles protons in active sites."},{"s":"ka","t":"strong-weak","type":"part-of","why":"Ka quantifies how strong a weak acid is."},{"s":"ka","t":"hh","type":"prerequisite","why":"Taking −log of the Ka expression and rearranging gives the Henderson–Hasselbalch equation."},{"s":"buffers","t":"ph-homeostasis","type":"applies-to","why":"The bicarbonate buffer is the main system that holds blood pH near 7.4, with lungs and kidneys adjusting its components."},{"s":"buffers","t":"renal-acid-base","type":"applies-to","why":"Kidneys reclaim filtered HCO₃⁻ and excrete H⁺ buffered in urine by phosphate and ammonia, restoring the blood's buffer base."},{"s":"buffers","t":"acid-base","type":"part-of","why":"Buffers are weak acid–conjugate base mixtures that resist pH change."},{"s":"buffers","t":"titration","type":"explains","why":"The flat region of a weak-acid titration curve is where HA and A⁻ coexist as a buffer, centered at pH = pKa."},{"s":"hh","t":"zwitterion","type":"explains","why":"At pH 7.4, above the carboxyl pKa (~2) and below the amino pKa (~9–10), both groups are charged, giving a zwitterion."},{"s":"hh","t":"pI","type":"explains","why":"Applying HH to each ionizable group gives an amino acid's net charge at any pH, which locates the pH of zero net charge."},{"s":"hh","t":"ph-denaturation","type":"explains","why":"Shifting pH past a side chain's pKa changes its charge, breaking the salt bridges and hydrogen bonds that hold tertiary structure."},{"s":"hh","t":"ph-homeostasis","type":"explains","why":"Blood pH = 6.1 + log([HCO₃⁻] / (0.03 × PCO₂)), so the kidneys control the numerator and the lungs the denominator."},{"s":"hh","t":"buffers","type":"part-of","why":"The Henderson–Hasselbalch equation gives a buffer's pH from the ratio of A⁻ to HA, showing why buffering is best near pKa."},{"s":"titration","t":"pI","type":"applies-to","why":"An amino acid's titration curve shows a plateau at each pKa, and the pI lies midway between the two pKas flanking the neutral form."},{"s":"titration","t":"acid-base","type":"part-of","why":"Titration is the experimental method for measuring acid or base amounts and pKa values."},{"s":"titration","t":"ka","type":"applies-to","why":"Reading the pH at the half-equivalence point gives an unknown weak acid's pKa directly."},{"s":"gas-laws","t":"respiratory-system","type":"applies-to","why":"Breathing, alveolar gas exchange and dissolved-gas transport all follow pressure–volume relations, partial pressures and gas solubility."},{"s":"gas-laws","t":"keq","type":"applies-to","why":"Gas-phase equilibria can be written with partial pressures as Kp, which the ideal gas law relates to Kc by Kp = Kc(RT)^Δn, where Δn is the change in gas moles."},{"s":"ideal-gas-law","t":"stoichiometry","type":"applies-to","why":"n = PV/RT converts a measured gas volume, pressure and temperature into moles for mole-ratio calculations."},{"s":"ideal-gas-law","t":"gas-laws","type":"part-of","why":"PV = nRT is the master equation that unites all the simple gas laws."},{"s":"ideal-gas-law","t":"density","type":"applies-to","why":"Rearranged as ρ = PM/RT, gas density rises with pressure and molar mass and falls with temperature, so heated air rises."},{"s":"boyles-law","t":"ventilation","type":"applies-to","why":"Diaphragm contraction enlarges the thorax, dropping alveolar pressure below atmospheric so air flows in; recoil shrinks it and pushes air out."},{"s":"boyles-law","t":"gas-laws","type":"part-of","why":"Boyle's law is the pressure–volume relation of a gas at constant temperature and amount."},{"s":"charles-law","t":"gas-laws","type":"part-of","why":"Charles's and Gay-Lussac's laws relate volume and pressure to absolute temperature."},{"s":"charles-law","t":"boyles-law","type":"contrasts","why":"Charles's law is a direct V–T proportion at constant pressure, graphing as a straight line, whereas Boyle's law is an inverse P–V relation at constant temperature, graphing as a hyperbola."},{"s":"avogadro-law","t":"stoichiometry","type":"applies-to","why":"At the same T and P, gas volumes are proportional to moles, so balanced-equation coefficients give volume ratios directly."},{"s":"avogadro-law","t":"standard-state","type":"contrasts","why":"22.4 L/mol holds at STP (0 °C, 1 atm), whereas thermodynamic standard state usually means 25 °C, where a mole of gas fills about 24.5 L."},{"s":"avogadro-law","t":"gas-laws","type":"part-of","why":"Avogadro's law relates gas volume to the number of moles."},{"s":"daltons-law","t":"airway-anatomy","type":"applies-to","why":"Humidification in the conducting airways adds 47 mmHg of water vapor, diluting inspired O₂ to about 150 mmHg before alveolar CO₂ lowers it further."},{"s":"daltons-law","t":"gas-exchange","type":"applies-to","why":"Each gas diffuses down its own partial-pressure gradient, such as alveolar PO₂ about 100 versus venous 40 mmHg, independent of the other gases."},{"s":"daltons-law","t":"breathing-control","type":"applies-to","why":"At altitude, lower barometric pressure lowers PO₂ at constant 21% O₂; once arterial PO₂ falls below about 60 mmHg, peripheral chemoreceptors drive hyperventilation."},{"s":"daltons-law","t":"le-chatelier","type":"explains","why":"Adding an inert gas at constant volume raises total pressure but leaves each reactant's partial pressure unchanged, so the equilibrium does not shift."},{"s":"daltons-law","t":"gas-laws","type":"part-of","why":"Dalton's law extends the gas laws to mixtures through partial pressures."},{"s":"daltons-law","t":"henrys-law","type":"prerequisite","why":"Henry's law depends on a gas's partial pressure, which Dalton's law defines for each component of a mixture."},{"s":"henrys-law","t":"hemoglobin","type":"contrasts","why":"Dissolved O₂ rises linearly with PO₂ and is only about 0.3 mL/dL, whereas hemoglobin binds about 20 mL/dL along a sigmoidal curve."},{"s":"henrys-law","t":"ph-homeostasis","type":"applies-to","why":"Dissolved CO₂ equals about 0.03 × PCO₂ mmol/L, the acid term in the Henderson–Hasselbalch equation for the bicarbonate buffer."},{"s":"henrys-law","t":"gas-exchange","type":"applies-to","why":"Alveolar partial pressures set dissolved O₂ and CO₂ in plasma; CO₂'s much higher solubility lets it exchange fully across a small gradient."},{"s":"henrys-law","t":"gas-laws","type":"part-of","why":"Henry's law describes how a gas's partial pressure sets how much of it dissolves in a liquid."},{"s":"kmt","t":"collision-theory","type":"explains","why":"Higher temperature shifts the Maxwell–Boltzmann distribution so more molecules exceed Ea and collisions occur more often, raising reaction rate."},{"s":"kmt","t":"gas-laws","type":"part-of","why":"Kinetic molecular theory is the molecular model that explains why the gas laws hold."},{"s":"kmt","t":"ideal-gas-law","type":"explains","why":"Treating gas particles as volumeless, non-attracting and in elastic random motion yields PV = nRT from wall-collision pressure."},{"s":"kmt","t":"boyles-law","type":"explains","why":"Squeezing the same molecules into a smaller volume makes them strike the walls more often at the same speed, raising pressure."},{"s":"kmt","t":"charles-law","type":"explains","why":"Heating speeds molecules so they hit the walls harder and more often; at constant pressure the gas must expand to compensate."},{"s":"kmt","t":"vapor-pressure","type":"explains","why":"Molecules in the high-energy tail of the Maxwell–Boltzmann distribution escape the liquid surface, and warming enlarges that tail, raising vapor pressure steeply."},{"s":"grahams-law","t":"simple-diffusion","type":"contrasts","why":"Graham's law ranks gases by molar mass alone, whereas diffusion across a membrane depends mainly on lipid solubility, gradient, area and thickness (Fick's law)."},{"s":"grahams-law","t":"gas-exchange","type":"applies-to","why":"Graham's law alone predicts CO₂ (44 g/mol) diffuses about 0.85 times as fast as O₂, but its roughly 24-fold higher solubility makes it about 20 times more diffusible across alveoli."},{"s":"grahams-law","t":"kmt","type":"part-of","why":"Graham's law follows from KMT: equal average kinetic energy means speed varies as 1/√M."},{"s":"real-gases","t":"gas-laws","type":"part-of","why":"Real-gas behavior describes when and how gases depart from the ideal gas laws."},{"s":"real-gases","t":"kmt","type":"contrasts","why":"Real gases break KMT's assumptions: molecules have finite volume and attract each other, which matters when they are crowded or slow."},{"s":"phase-changes","t":"phases","type":"part-of","why":"Phase changes are the transitions between solid, liquid and gas and the heat they carry."},{"s":"heating-curves","t":"phase-changes","type":"part-of","why":"Heating curves plot the temperature plateaus and slopes produced as a substance passes through phase changes."},{"s":"phase-diagrams","t":"phases","type":"part-of","why":"Phase diagrams map which phase is stable at each temperature and pressure."},{"s":"phase-diagrams","t":"heating-curves","type":"explains","why":"Heating at constant pressure traces a horizontal path across a phase diagram, and each plateau occurs where that path crosses a coexistence line."},{"s":"triple-critical","t":"phase-changes","type":"explains","why":"Below its triple-point pressure a solid sublimes rather than melts; CO₂'s triple point at 5.1 atm makes dry ice sublime at 1 atm."},{"s":"triple-critical","t":"phase-diagrams","type":"part-of","why":"The triple and critical points are the landmark endpoints of the lines on a phase diagram."},{"s":"vapor-pressure","t":"phases","type":"part-of","why":"Vapor pressure describes the liquid–gas equilibrium that determines boiling."},{"s":"vapor-pressure","t":"raoults-law","type":"prerequisite","why":"Raoult's law expresses a solution's vapor pressure as a fraction of the pure solvent's vapor pressure."},{"s":"heat-capacity","t":"phases","type":"part-of","why":"Heat capacity quantifies the heat needed to change temperature within a single phase."},{"s":"heat-capacity","t":"heating-curves","type":"explains","why":"Each sloped segment rises at a rate set by q = mcΔT, so a phase with higher specific heat produces a shallower slope."},{"s":"calorimetry","t":"triacylglycerols","type":"applies-to","why":"Burning foods in a bomb calorimeter shows fat yields about 9 kcal/g, more than double carbohydrate's roughly 4, because its carbons are more reduced."},{"s":"calorimetry","t":"enthalpy","type":"applies-to","why":"A constant-pressure coffee-cup calorimeter measures heat flow equal to ΔH, using q = mcΔT of the surrounding water."},{"s":"calorimetry","t":"hess-law","type":"prerequisite","why":"Heats of combustion measured by calorimetry are the data Hess's law combines to find enthalpies of reactions that cannot be run directly."},{"s":"calorimetry","t":"heat-capacity","type":"part-of","why":"Calorimetry uses a known heat capacity and a measured temperature change to find heat flow."},{"s":"solutions","t":"membranes","type":"applies-to","why":"Membranes separate intracellular and extracellular solutions: solute polarity decides what diffuses through the bilayer, and impermeant solutes set the direction of osmotic water flow."},{"s":"solutions","t":"renal-system","type":"applies-to","why":"Kidneys hold plasma near 290 mOsm/L by adjusting solute and water excretion, using concentration gradients and osmotic water movement."},{"s":"solubility","t":"lipids","type":"explains","why":"Lipids are defined by solubility rather than structure: their mostly nonpolar molecules dissolve in nonpolar solvents such as ether or chloroform but poorly in water."},{"s":"solubility","t":"fatty-acids","type":"applies-to","why":"Despite a polar carboxylate head, the long hydrocarbon tail makes fatty acids nearly insoluble in water, so plasma carries free fatty acids bound to albumin."},{"s":"solubility","t":"saponification","type":"explains","why":"A soap's ionic carboxylate head dissolves in water and its tail in grease, bridging the two; in hard water, Ca²⁺ and Mg²⁺ carboxylates are insoluble and precipitate as scum."},{"s":"solubility","t":"steroid-hormones","type":"applies-to","why":"Lipid-soluble steroids dissolve poorly in plasma, so they travel on carrier proteins, but they cross membranes freely to reach intracellular receptors."},{"s":"solubility","t":"bile-salts","type":"applies-to","why":"Dietary fat is insoluble in watery chyme, so amphipathic bile salts emulsify it into small droplets that lipase can attack and form micelles that ferry the products to enterocytes."},{"s":"solubility","t":"ksp","type":"prerequisite","why":"Ksp quantifies the saturation point of sparingly soluble ionic salts, giving their molar solubility."},{"s":"solubility","t":"solutions","type":"part-of","why":"Solubility describes how much solute a solvent can dissolve and why."},{"s":"concentration-units","t":"titration","type":"applies-to","why":"At equivalence, moles of titrant equal moles of analyte (adjusted for stoichiometry), so M₁V₁ = M₂V₂ or its normality form gives the unknown concentration."},{"s":"concentration-units","t":"solutions","type":"part-of","why":"Concentration units express how much solute a solution contains."},{"s":"concentration-units","t":"colligative","type":"prerequisite","why":"Colligative equations need the right unit: molality for boiling- and freezing-point changes, molarity or osmolarity for osmotic pressure."},{"s":"concentration-units","t":"uv-spec","type":"applies-to","why":"The Beer–Lambert law, A = εlc, uses molar concentration, so absorbance at a set wavelength reveals a solution's molarity."},{"s":"colligative","t":"solutions","type":"part-of","why":"Colligative properties are solution properties that depend only on dissolved particle number."},{"s":"vant-hoff-factor","t":"colligative","type":"part-of","why":"The van 't Hoff factor converts formula units into the particle count that colligative equations need."},{"s":"vant-hoff-factor","t":"osmosis","type":"applies-to","why":"0.9% saline is about 154 mM NaCl: ideally 308 mOsm/L with i = 2, but ion pairing lowers the effective value to about 285–290, matching plasma, so it is isotonic."},{"s":"raoults-law","t":"colligative","type":"part-of","why":"Raoult's law quantifies vapor-pressure lowering, the root colligative effect."},{"s":"raoults-law","t":"bp-elevation","type":"explains","why":"Because solute lowers vapor pressure, the solution needs a higher temperature to reach atmospheric pressure and boil."},{"s":"raoults-law","t":"fp-depression","type":"explains","why":"Solute lowers the liquid's vapor pressure, so it matches the solid's vapor pressure only at a lower temperature, which is the new freezing point."},{"s":"bp-elevation","t":"colligative","type":"part-of","why":"Boiling-point elevation is a colligative property: ΔTb = iKbm."},{"s":"fp-depression","t":"colligative","type":"part-of","why":"Freezing-point depression is a colligative property: ΔTf = iKfm."},{"s":"fp-depression","t":"bp-elevation","type":"contrasts","why":"Solute lowers the freezing point but raises the boiling point; for water Kf (1.86) is about 3.6 times Kb (0.51), so freezing shifts more."},{"s":"osmotic-pressure","t":"polysaccharides","type":"explains","why":"Osmotic pressure depends on particle number, so storing glucose as one glycogen molecule instead of thousands of free glucoses avoids drawing excess water into cells."},{"s":"osmotic-pressure","t":"colligative","type":"part-of","why":"Osmotic pressure is the colligative property that drives water across membranes: Π = iMRT."},{"s":"osmotic-pressure","t":"osmosis","type":"explains","why":"Water flows toward the solution with higher osmotic pressure, so differences in Π determine the direction and drive of osmosis."},{"s":"osmotic-pressure","t":"starling-forces","type":"explains","why":"Plasma proteins cannot cross capillary walls, so they generate an oncotic pressure of about 25 mmHg that pulls fluid back into capillaries."},{"s":"osmosis","t":"disaccharides","type":"applies-to","why":"In lactose intolerance, unabsorbed lactose stays in the intestinal lumen and draws water in by osmosis, causing diarrhea, while colonic bacteria ferment it into gas."},{"s":"osmosis","t":"countercurrent","type":"applies-to","why":"Water leaves the water-permeable descending limb by osmosis into the hyperosmotic medulla, concentrating filtrate as it descends."},{"s":"osmosis","t":"reabsorption-secretion","type":"applies-to","why":"In the proximal tubule water follows reabsorbed Na⁺ and other solutes osmotically, so about two-thirds of the filtrate is reclaimed isosmotically."},{"s":"osmosis","t":"adh","type":"applies-to","why":"ADH inserts aquaporin-2 into collecting-duct cells so water moves by osmosis into the hyperosmotic medulla, concentrating urine."},{"s":"osmosis","t":"large-intestine","type":"applies-to","why":"Colonic water absorption follows Na⁺ absorption osmotically; unabsorbed solutes such as lactose in lactase deficiency hold water and cause diarrhea."},{"s":"osmosis","t":"solutions","type":"part-of","why":"Osmosis is water movement driven by solute concentration differences across a membrane."},{"s":"starling-forces","t":"cardiovascular-system","type":"part-of","why":"Starling forces govern fluid exchange between capillary blood and tissues."},{"s":"starling-forces","t":"gfr","type":"applies-to","why":"Glomerular filtration is Starling filtration with unusually high capillary hydrostatic pressure, opposed by plasma oncotic and Bowman's capsule pressure."},{"s":"resonance","t":"amide-planarity","type":"explains","why":"Resonance gives the peptide C–N bond partial double-bond character, so the six amide atoms lie in one plane and rotation about C–N is restricted."},{"s":"resonance","t":"atp","type":"explains","why":"Free Pi and ADP have more resonance stabilization than the phosphoanhydride; with relief of charge repulsion and better solvation, this makes ATP hydrolysis strongly exergonic."},{"s":"resonance","t":"ka","type":"affects","why":"Delocalizing a conjugate base's charge stabilizes it and raises Ka, so carboxylic acids (pKa ~4–5) are far more acidic than alcohols (pKa ~16)."},{"s":"resonance","t":"carbocations","type":"explains","why":"Allylic and benzylic carbocations are unusually stable because resonance spreads the positive charge over several carbons."},{"s":"resonance","t":"aromatic","type":"prerequisite","why":"Aromatic stability is an extreme case of resonance: six π electrons delocalized evenly around a planar ring."},{"s":"isomerism","t":"glycolysis","type":"applies-to","why":"Glycolysis includes isomerase steps: glucose-6-phosphate to fructose-6-phosphate and DHAP to glyceraldehyde-3-phosphate interconvert structural isomers."},{"s":"isomerism","t":"substitution-elimination","type":"prerequisite","why":"Predicting SN1 racemization, SN2 inversion and E2 alkene geometry requires the vocabulary of stereoisomers and conformers."},{"s":"iupac","t":"beta-oxidation","type":"applies-to","why":"Chain numbering starts at the carbonyl carbon, and the common Greek labels follow it (α = C2, β = C3), so β-oxidation oxidizes C3 before cleaving off acetyl-CoA."},{"s":"iupac","t":"isomerism","type":"part-of","why":"IUPAC naming is the system for specifying exactly which isomer a name refers to."},{"s":"iupac","t":"structural-isomers","type":"applies-to","why":"Structural isomers share a molecular formula, so only a systematic name such as butane vs 2-methylpropane tells them apart."},{"s":"structural-isomers","t":"tca-intermediates","type":"applies-to","why":"Aconitase converts citrate to its structural isomer isocitrate, moving the OH from a tertiary to a secondary carbon so it can be oxidized."},{"s":"structural-isomers","t":"isomerism","type":"part-of","why":"Structural isomers are the branch of isomerism in which atoms are connected differently."},{"s":"structural-isomers","t":"stereoisomers","type":"contrasts","why":"Structural isomers differ in connectivity and often in functional groups, whereas stereoisomers keep identical connectivity and differ only in 3-D arrangement."},{"s":"conformational-isomers","t":"secondary","type":"applies-to","why":"α-helices and β-sheets are defined by specific backbone φ and ψ rotation angles about σ bonds, so secondary structure is a set of conformations."},{"s":"conformational-isomers","t":"isomerism","type":"part-of","why":"Conformers are the branch of isomerism produced by rotation about single bonds without breaking any."},{"s":"conformational-isomers","t":"stereoisomers","type":"contrasts","why":"Conformers interconvert by σ-bond rotation without breaking bonds, whereas configurational stereoisomers interconvert only if a bond breaks."},{"s":"newman","t":"conformational-isomers","type":"part-of","why":"Newman projections are the standard way to draw and compare conformations about one C–C bond."},{"s":"newman","t":"chair","type":"prerequisite","why":"Viewing a cyclohexane C–C bond in Newman projection shows all substituents staggered, which explains the chair's lack of torsional strain."},{"s":"newman","t":"e2","type":"applies-to","why":"A Newman projection down the Cα–Cβ bond shows whether a β-H is anti-periplanar to the leaving group and predicts the E/Z geometry of the E2 alkene."},{"s":"chair","t":"anomers","type":"explains","why":"β-D-glucopyranose puts every OH and the CH₂OH equatorial in the chair, avoiding 1,3-diaxial strain, which is why β outnumbers α about 64:36 at equilibrium."},{"s":"chair","t":"cholesterol-fluidity","type":"applies-to","why":"Cholesterol's fused rings are held in rigid chair-like conformations, forming a nearly flat plate that restricts nearby phospholipid tails and buffers membrane fluidity."},{"s":"chair","t":"conformational-isomers","type":"part-of","why":"The chair is the lowest-energy conformation of cyclohexane and the key ring conformer on the MCAT."},{"s":"chair","t":"e2","type":"affects","why":"E2 on a cyclohexane requires the leaving group and β-H to be trans-diaxial, so the chair conformation can permit or block elimination."},{"s":"stereoisomers","t":"aa-configuration","type":"applies-to","why":"Amino acids exist as D/L stereoisomers; ribosomes use only L, though D-alanine and D-glutamate occur in bacterial cell walls."},{"s":"stereoisomers","t":"carbohydrates","type":"applies-to","why":"Sugars with several stereocenters form whole families of enantiomers, diastereomers and epimers, making carbohydrates the main biological showcase of stereoisomer relationships."},{"s":"stereoisomers","t":"isomerism","type":"part-of","why":"Stereoisomers are the branch of isomerism with identical connectivity but different 3-D arrangement."},{"s":"stereoisomers","t":"sn2","type":"applies-to","why":"Stereochemical outcome reveals mechanism: SN2 inverts a stereocenter, while SN1 through a planar carbocation largely racemizes it."},{"s":"chirality","t":"amino-acids","type":"applies-to","why":"Every standard amino acid except glycine has a chiral α-carbon, and proteins use the L form."},{"s":"chirality","t":"enzymes","type":"applies-to","why":"Active sites are built from L-amino acids and are therefore chiral, so enzymes usually bind and act on only one stereoisomer."},{"s":"chirality","t":"monosaccharides","type":"applies-to","why":"Each internal CHOH carbon of an open-chain sugar bears four different groups, so an aldohexose has four stereocenters and 2⁴ = 16 stereoisomers."},{"s":"chirality","t":"stereoisomers","type":"part-of","why":"Chirality at stereocenters is what gives rise to enantiomers and most diastereomers."},{"s":"r-s","t":"aa-configuration","type":"applies-to","why":"CIP rules make most L-amino acids S, because COOH outranks the side chain; L is a Fischer-projection label and S a priority label."},{"s":"r-s","t":"cysteine","type":"applies-to","why":"L-Cys is R, not S, because the CH₂SH side chain outranks COOH in CIP priority, an exception to 'L = S'."},{"s":"r-s","t":"chirality","type":"part-of","why":"R/S labels give the absolute configuration of each chiral center."},{"s":"r-s","t":"fischer","type":"contrasts","why":"R/S is an absolute label from CIP priorities, while D/L from a Fischer projection is relative to glyceraldehyde and does not predict R/S or (+)/(−)."},{"s":"enantiomers","t":"d-l-sugars","type":"applies-to","why":"D- and L-glucose are mirror images inverted at all four stereocenters, so they are enantiomers with equal and opposite specific rotations."},{"s":"enantiomers","t":"stereoisomers","type":"part-of","why":"Enantiomers are the class of stereoisomers that are non-superimposable mirror images."},{"s":"enantiomers","t":"diastereomers","type":"contrasts","why":"Enantiomers share all physical properties in achiral settings, while diastereomers differ in boiling point, melting point and solubility and so separate by ordinary methods."},{"s":"enantiomers","t":"polarization-light","type":"affects","why":"Enantiomers rotate the plane of polarized light by equal angles in opposite directions, which a polarimeter measures as optical activity."},{"s":"diastereomers","t":"epimers","type":"explains","why":"Epimers are diastereomers differing at only one stereocenter, so like all diastereomers they have different physical properties and are not mirror images."},{"s":"diastereomers","t":"phospholipids","type":"applies-to","why":"Cis double bonds kink fatty acid tails and loosen bilayer packing, raising fluidity, whereas trans tails pack straight like saturated chains."},{"s":"diastereomers","t":"oral-digestion","type":"applies-to","why":"Starch links α-glucose and cellulose links β-glucose, anomers differing only at C-1; salivary amylase cleaves starch's α-1,4 bonds but cannot cleave cellulose's β-1,4 bonds."},{"s":"diastereomers","t":"stereoisomers","type":"part-of","why":"Diastereomers are the class of stereoisomers that are not mirror images of each other."},{"s":"diastereomers","t":"e2","type":"applies-to","why":"Because E2 needs an anti-periplanar β-H, diastereomeric substrates give different alkene isomers (E vs Z), making E2 stereospecific."},{"s":"diastereomers","t":"photoreceptors","type":"applies-to","why":"A photon isomerizes 11-cis-retinal to all-trans-retinal, a cis/trans change that reshapes rhodopsin and starts phototransduction."},{"s":"meso","t":"stereoisomers","type":"affects","why":"A meso form lowers the stereoisomer count below 2ⁿ: tartaric acid has two stereocenters but only three stereoisomers."},{"s":"meso","t":"enantiomers","type":"contrasts","why":"A meso compound is one achiral molecule, while a racemic mixture of enantiomers is optically inactive only because equal and opposite rotations cancel."},{"s":"meso","t":"diastereomers","type":"part-of","why":"Meso compounds are achiral diastereomers of a chiral pair, containing stereocenters plus an internal mirror plane."},{"s":"fischer","t":"aa-configuration","type":"applies-to","why":"With COOH on top and the side chain at the bottom of a Fischer projection, an amino acid with NH₂ on the left is L."},{"s":"fischer","t":"d-l-sugars","type":"prerequisite","why":"D or L is read from a Fischer projection: the OH on the highest-numbered stereocenter points right for D and left for L."},{"s":"fischer","t":"stereoisomers","type":"part-of","why":"Fischer projections are a flat drawing convention for showing the configuration of stereocenters."},{"s":"fischer","t":"enantiomers","type":"applies-to","why":"In a Fischer projection, swapping left and right groups at every stereocenter gives the enantiomer; changing only some gives a diastereomer."},{"s":"substitution-elimination","t":"catalytic-mechanisms","type":"applies-to","why":"Many enzyme reactions, such as methyl and phosphoryl transfers, are substitutions where active sites position a nucleophile and stabilize the leaving group."},{"s":"substitution-elimination","t":"mutations","type":"applies-to","why":"Alkylating agents, including some chemotherapy drugs, are electrophiles attacked by nucleophilic N and O atoms of DNA bases; alkylated bases can mispair or be lost, causing mutations."},{"s":"substitution-elimination","t":"carbonyl-chemistry","type":"prerequisite","why":"The nucleophile, electrophile and leaving-group reasoning from substitution carries directly into carbonyl addition and acyl substitution."},{"s":"sn1","t":"substitution-elimination","type":"part-of","why":"SN1 is the unimolecular substitution pathway, proceeding through a carbocation."},{"s":"sn1","t":"sn2","type":"contrasts","why":"SN1 passes through a carbocation with rate = k[RX] and racemization; SN2 is concerted with rate = k[RX][Nu] and inversion."},{"s":"sn1","t":"e1","type":"contrasts","why":"SN1 and E1 share the same carbocation and first-order kinetics; they differ only in whether the cation captures a nucleophile or loses a β-proton."},{"s":"sn2","t":"dna-methylation","type":"applies-to","why":"DNA methyltransferases transfer the methyl group of S-adenosylmethionine to cytosine by an SN2-like attack on SAM's unhindered methyl carbon."},{"s":"sn2","t":"amine-hormones","type":"applies-to","why":"Adrenal PNMT makes epinephrine by an SN2-like transfer of a methyl group from SAM to norepinephrine's amine nitrogen."},{"s":"sn2","t":"substitution-elimination","type":"part-of","why":"SN2 is the bimolecular, concerted substitution pathway with backside attack."},{"s":"e1","t":"entropy","type":"affects","why":"Elimination turns one molecule into more (alkene plus H₂O or HX), raising entropy, so heating makes −TΔS more favorable and tips SN1/E1 mixtures toward E1."},{"s":"e1","t":"substitution-elimination","type":"part-of","why":"E1 is the unimolecular elimination pathway, proceeding through a carbocation."},{"s":"e1","t":"e2","type":"contrasts","why":"E1 forms a carbocation (first order, can rearrange, no geometric requirement), whereas E2 is concerted, second order and needs an anti-periplanar β-H."},{"s":"e2","t":"substitution-elimination","type":"part-of","why":"E2 is the bimolecular, concerted elimination pathway requiring an anti-periplanar β-H."},{"s":"e2","t":"sn2","type":"contrasts","why":"A strong, bulky base favors E2 over SN2 because removing an exposed β-H is easier than reaching a crowded carbon for backside attack."},{"s":"carbocations","t":"substitution-elimination","type":"part-of","why":"Carbocation stability decides whether the unimolecular SN1 and E1 pathways are feasible."},{"s":"carbocations","t":"sn1","type":"explains","why":"Forming the carbocation is SN1's rate-determining step, so 3°, allylic and benzylic substrates that give stable cations react fastest."},{"s":"carbocations","t":"e1","type":"explains","why":"E1 shares SN1's carbocation intermediate, so it favors 3° substrates and can give rearranged alkenes after hydride or methyl shifts."},{"s":"carbocations","t":"directing-groups","type":"explains","why":"Directing effects come from arenium-ion stability: donor groups stabilize the positive charge when attack is ortho or para to them."},{"s":"leaving-groups","t":"trna-charging","type":"applies-to","why":"Synthetases first form aminoacyl-AMP, giving the carboxyl a good AMP leaving group for tRNA's 3′-OH; pyrophosphate hydrolysis makes charging irreversible."},{"s":"leaving-groups","t":"atp","type":"applies-to","why":"Cells activate poor leaving groups such as OH by phosphorylating or adenylating them with ATP, turning them into phosphate or AMP leaving groups."},{"s":"leaving-groups","t":"substitution-elimination","type":"part-of","why":"Leaving-group ability governs the rate of all four substitution and elimination pathways."},{"s":"leaving-groups","t":"acid-derivatives","type":"explains","why":"Acyl derivative reactivity mirrors leaving-group ability: chloride, a very weak base, leaves easily, while an amide's NH₂⁻ almost never does."},{"s":"nucleophiles","t":"cysteine","type":"applies-to","why":"Cysteine's thiolate is a strong, polarizable nucleophile, which is why Cys serves as the catalytic nucleophile in cysteine proteases and many other enzymes."},{"s":"nucleophiles","t":"acid-base-catalysis","type":"applies-to","why":"General-base catalysis often works by boosting a nucleophile: in serine proteases His removes the Ser–OH proton so serine can attack the carbonyl."},{"s":"nucleophiles","t":"substitution-elimination","type":"part-of","why":"Nucleophile strength and bulk help decide between SN2, SN1 and elimination."},{"s":"solvent-effects","t":"substitution-elimination","type":"part-of","why":"Solvent choice shifts the balance between ionizing (SN1/E1) and concerted (SN2/E2) pathways."},{"s":"solvent-effects","t":"sn1","type":"affects","why":"Polar protic solvents stabilize the carbocation and departing anion by solvation and hydrogen bonding, lowering the barrier to SN1 ionization."},{"s":"solvent-effects","t":"sn2","type":"affects","why":"Polar aprotic solvents leave anionic nucleophiles poorly solvated and highly reactive, greatly accelerating SN2 reactions."},{"s":"zaitsev","t":"substitution-elimination","type":"part-of","why":"Zaitsev's rule predicts the regiochemistry of the alkene formed in E1 and E2."},{"s":"zaitsev","t":"e1","type":"applies-to","why":"The free carbocation in E1 usually loses the β-proton that gives the more stable, more substituted alkene, so E1 generally follows Zaitsev's rule."},{"s":"zaitsev","t":"e2","type":"applies-to","why":"E2 with small bases gives the Zaitsev alkene, but bulky bases like tert-butoxide remove the most accessible β-H and give the Hofmann product."},{"s":"carbonyl-chemistry","t":"glycolysis","type":"applies-to","why":"GAPDH oxidizes glyceraldehyde-3-phosphate's aldehyde through a thiohemiacetal and thioester to 1,3-bisphosphoglycerate, capturing energy as an acyl phosphate."},{"s":"carbonyl-chemistry","t":"tca-cycle","type":"applies-to","why":"Citrate synthase adds acetyl-CoA's enol(ate) to oxaloacetate's ketone in an aldol-type reaction; later steps oxidize alcohols to ketones and remove carboxyls as CO₂."},{"s":"carbonyl-chemistry","t":"lipid-metabolism","type":"applies-to","why":"Fatty acid synthesis builds chains by Claisen condensations of thioesters, and β-oxidation's thiolase cleaves them by the reverse reaction, two carbons at a time."},{"s":"nucleophilic-addition","t":"cyclization","type":"explains","why":"Ring closure is intramolecular nucleophilic addition: glucose's C-5 hydroxyl oxygen attacks the C-1 aldehyde carbon, forming a six-membered cyclic hemiacetal."},{"s":"nucleophilic-addition","t":"glycosidic-bonds","type":"explains","why":"A glycosidic bond is an acetal: under acid catalysis the hemiacetal's anomeric OH is replaced by a second alcohol's OR group, with loss of water."},{"s":"nucleophilic-addition","t":"glycogen-metabolism","type":"applies-to","why":"Glycogen's glycosidic bonds are acetals, stable at neutral pH; cells break them enzymatically, by phosphorylase (phosphorolysis) and debranching enzyme (hydrolysis of α-1,6 bonds)."},{"s":"nucleophilic-addition","t":"transamination","type":"applies-to","why":"Pyridoxal phosphate's aldehyde condenses with an amino acid's amine to form an imine (Schiff base), the intermediate that shuttles the amino group."},{"s":"nucleophilic-addition","t":"carbonyl-chemistry","type":"part-of","why":"Addition to aldehydes and ketones is the core reaction of carbonyls lacking a leaving group."},{"s":"nucleophilic-addition","t":"photoreceptors","type":"applies-to","why":"Retinal's aldehyde binds a lysine amine in opsin as a protonated imine (Schiff base), linking the light-absorbing chromophore to the protein."},{"s":"alcohol-oxidation","t":"reducing-sugars","type":"explains","why":"Tollens' Ag⁺ and Benedict's Cu²⁺ oxidize the open-chain aldehyde of a reducing sugar to a carboxylic acid, the same aldehyde-to-acid step seen with primary alcohols."},{"s":"alcohol-oxidation","t":"beta-oxidation","type":"applies-to","why":"In β-oxidation, 3-hydroxyacyl-CoA dehydrogenase oxidizes a secondary alcohol at C3 to a ketone, transferring a hydride to NAD⁺."},{"s":"alcohol-oxidation","t":"liver-gallbladder","type":"applies-to","why":"The liver oxidizes ethanol to acetaldehyde (alcohol dehydrogenase) and then to acetate (aldehyde dehydrogenase), each step reducing NAD⁺ to NADH."},{"s":"alcohol-oxidation","t":"carbonyl-chemistry","type":"part-of","why":"Oxidizing alcohols is how aldehydes, ketones and carboxylic acids are made from alcohols."},{"s":"carbonyl-reduction","t":"glycolysis","type":"applies-to","why":"Lactate dehydrogenase reduces pyruvate's ketone to lactate with NADH, regenerating the NAD⁺ that glycolysis needs to continue without oxygen."},{"s":"carbonyl-reduction","t":"fa-synthesis","type":"applies-to","why":"Each cycle of fatty acid synthesis uses NADPH to reduce a β-keto group to an alcohol, then dehydrates and reduces again to a saturated chain."},{"s":"carbonyl-reduction","t":"carbonyl-chemistry","type":"part-of","why":"Hydride reduction converts carbonyl compounds back to alcohols or amines."},{"s":"acid-derivatives","t":"peptide-hydrolysis","type":"explains","why":"Amides are the least reactive acid derivative, so uncatalyzed peptide hydrolysis is extremely slow and needs proteases or hot strong acid."},{"s":"acid-derivatives","t":"acetyl-coa","type":"applies-to","why":"Acetyl-CoA is a thioester; poor C–S resonance overlap leaves its carbonyl reactive and makes acyl transfer from it strongly exergonic."},{"s":"acid-derivatives","t":"pancreatic-juice","type":"applies-to","why":"Triglycerides are triesters, and pancreatic lipase hydrolyzes them to free fatty acids and monoacylglycerol after bile salts emulsify the fat."},{"s":"acid-derivatives","t":"carbonyl-chemistry","type":"part-of","why":"Acid derivatives are the carbonyl compounds that carry a leaving group on the acyl carbon."},{"s":"acyl-sub","t":"peptide-bond","type":"explains","why":"An amine attacking an activated carbonyl through a tetrahedral intermediate is how the amide bond forms."},{"s":"acyl-sub","t":"covalent-catalysis","type":"applies-to","why":"Serine proteases run two acyl substitutions: Ser attacks the peptide carbonyl to form an acyl-enzyme, then water attacks to release it."},{"s":"acyl-sub","t":"triacylglycerols","type":"applies-to","why":"Lipases hydrolyze TAG ester bonds by nucleophilic acyl substitution, using an active-site serine to form and then hydrolyze an acyl–enzyme intermediate."},{"s":"acyl-sub","t":"saponification","type":"explains","why":"Hydroxide adds to each ester carbonyl, the tetrahedral intermediate expels an alkoxide, and deprotonation of the resulting acid makes the reaction irreversible."},{"s":"acyl-sub","t":"translation-steps","type":"explains","why":"During elongation the A-site aminoacyl-tRNA's amine attacks the ester linking the growing chain to the P-site tRNA, an acyl substitution forming the peptide bond."},{"s":"acyl-sub","t":"acid-derivatives","type":"part-of","why":"Nucleophilic acyl substitution is the characteristic reaction mechanism of carboxylic acid derivatives."},{"s":"aldol","t":"glycolysis","type":"applies-to","why":"Aldolase splits fructose-1,6-bisphosphate into DHAP and glyceraldehyde-3-phosphate by a retro-aldol reaction via a lysine Schiff base."},{"s":"aldol","t":"gluconeogenesis","type":"applies-to","why":"In gluconeogenesis aldolase runs forward, joining DHAP and glyceraldehyde-3-phosphate by aldol addition to form fructose-1,6-bisphosphate."},{"s":"aldol","t":"carbonyl-chemistry","type":"part-of","why":"The aldol reaction is the carbonyl reaction that forms C–C bonds through an enolate."},{"s":"decarboxylation","t":"pdh-complex","type":"applies-to","why":"PDH removes pyruvate's carboxyl as CO₂ with thiamine pyrophosphate's help, leaving an acetyl group that becomes acetyl-CoA."},{"s":"decarboxylation","t":"isocitrate-dh","type":"applies-to","why":"Isocitrate is oxidized to oxalosuccinate, a β-keto acid that readily loses CO₂ to give α-ketoglutarate."},{"s":"decarboxylation","t":"ketogenesis","type":"applies-to","why":"Acetoacetate is a β-keto acid that spontaneously decarboxylates to acetone, which gives the fruity breath of ketoacidosis."},{"s":"decarboxylation","t":"neurotransmitters","type":"applies-to","why":"PLP-dependent decarboxylases make amine transmitters: L-DOPA to dopamine, 5-hydroxytryptophan to serotonin and glutamate to GABA."},{"s":"decarboxylation","t":"carbonyl-chemistry","type":"part-of","why":"Decarboxylation of β-keto acids is a carbonyl-driven reaction that removes CO₂."},{"s":"tautomerism","t":"aldoses-ketoses","type":"explains","why":"An aldose and its ketose interconvert through a shared enediol tautomer, the route base or an isomerase uses to turn glucose into fructose."},{"s":"tautomerism","t":"point-mutations","type":"explains","why":"Bases can briefly adopt rare enol or imino tautomers that mispair, for example enol thymine with guanine, one source of spontaneous transition mutations during replication."},{"s":"tautomerism","t":"pyruvate-kinase","type":"explains","why":"Pyruvate kinase releases enolpyruvate, which tautomerizes to the far more stable keto form, making PEP's phosphoryl transfer strongly exergonic."},{"s":"tautomerism","t":"carbonyl-chemistry","type":"part-of","why":"Keto–enol tautomerism generates the enols and enolates that make α-carbon chemistry possible."},{"s":"tautomerism","t":"aldol","type":"prerequisite","why":"Forming the enol or enolate makes the α-carbon nucleophilic, the first step of every aldol reaction."},{"s":"aromatic","t":"aromatic-aa","type":"applies-to","why":"Phe, Tyr and Trp have aromatic side chains, making them bulky, largely hydrophobic and UV-absorbing."},{"s":"aromatic","t":"histidine","type":"applies-to","why":"His's imidazole is aromatic: one nitrogen's lone pair is in the π sextet, while the other's lies in the ring plane and can accept a proton (side-chain pKa about 6)."},{"s":"aromatic","t":"dna-structure","type":"explains","why":"Flat aromatic bases stack in the helix core, and stacking interactions between neighboring bases are a major source of double-helix stability, alongside base-pair hydrogen bonds."},{"s":"aromatic","t":"uv-spec","type":"explains","why":"Conjugated aromatic rings absorb UV: Trp and Tyr near 280 nm and the nucleotide bases near 260 nm."},{"s":"eas","t":"thyroid","type":"applies-to","why":"Thyroid peroxidase oxidizes iodide to an electrophilic iodine species that substitutes onto tyrosine rings of thyroglobulin, an EAS-type iodination forming MIT and DIT for T₃ and T₄."},{"s":"eas","t":"bronsted-lewis","type":"applies-to","why":"EAS catalysts FeBr₃ and AlCl₃ are Lewis acids: they accept an electron pair from Br₂ or Cl₂, polarizing it into the strong electrophile the ring requires."},{"s":"eas","t":"aromatic","type":"part-of","why":"Electrophilic aromatic substitution is the characteristic reaction of aromatic rings, preserving aromaticity."},{"s":"directing-groups","t":"aromatic-aa","type":"applies-to","why":"Tyrosine's –OH is a strong ortho/para director; with the para position occupied by the side chain, iodine adds ortho to OH at C-3 and C-5, forming MIT and DIT."},{"s":"directing-groups","t":"ka","type":"affects","why":"The same donor and withdrawing effects shift acidity: a para-nitro group lowers phenol's pKa from about 10 to about 7 by stabilizing the phenoxide."},{"s":"directing-groups","t":"eas","type":"part-of","why":"Ring substituents set the rate and regiochemistry of electrophilic aromatic substitution."},{"s":"spectroscopy","t":"protein-structure","type":"applies-to","why":"UV absorbance quantifies proteins, and NMR can determine a protein's 3-D structure in solution."},{"s":"spectroscopy","t":"isomerism","type":"applies-to","why":"Isomers share a molecular formula and molecular mass, so IR and NMR are used to tell structural isomers apart by functional groups and connectivity."},{"s":"spectroscopy","t":"carbonyl-chemistry","type":"applies-to","why":"The carbonyl is the most diagnostic group: a strong IR stretch near 1700 cm⁻¹ and, for aldehydes, an ¹H-NMR signal near 9–10 ppm."},{"s":"ir","t":"polarity","type":"applies-to","why":"Only vibrations that change a molecule's dipole moment absorb IR, so polar bonds such as C=O give strong peaks while symmetric bonds like those in N₂ or O₂ are IR-inactive."},{"s":"ir","t":"acid-derivatives","type":"applies-to","why":"C=O stretch frequency identifies the derivative: esters ~1735–1750, ketones ~1715, amides ~1650–1690 cm⁻¹, as amide resonance weakens the C=O bond."},{"s":"ir","t":"spectroscopy","type":"part-of","why":"IR spectroscopy identifies functional groups from bond vibrations."},{"s":"nmr","t":"structural-isomers","type":"applies-to","why":"NMR separates structural isomers by counting distinct H environments: 1-propanol gives four signals and 2-propanol gives three."},{"s":"nmr","t":"aromatic","type":"applies-to","why":"The aromatic ring current deshields ring protons to about 6.5–8 ppm, a diagnostic NMR sign of an aromatic ring."},{"s":"nmr","t":"spectroscopy","type":"part-of","why":"¹H-NMR spectroscopy maps hydrogen environments and connectivity."},{"s":"uv-spec","t":"terpenes","type":"explains","why":"β-Carotene's eleven conjugated C=C bonds narrow the HOMO–LUMO gap so it absorbs blue visible light, which is why carotenoids look orange."},{"s":"uv-spec","t":"dna-melting","type":"applies-to","why":"Single-stranded DNA absorbs more at 260 nm than double-stranded DNA, so melting shows up as hyperchromicity."},{"s":"uv-spec","t":"spectroscopy","type":"part-of","why":"UV–Vis spectroscopy detects conjugation and measures concentration via electronic transitions."},{"s":"uv-spec","t":"photoreceptors","type":"applies-to","why":"Retinal's conjugated polyene absorbs visible light, and different opsins shift its absorption peak, giving rods and three cone types distinct sensitivities."},{"s":"mass-spec","t":"gel-electrophoresis","type":"contrasts","why":"Both estimate molecular mass, but mass spectrometry measures the m/z of gas-phase ions precisely, while SDS-PAGE only approximates protein mass from migration through a gel."},{"s":"mass-spec","t":"spectroscopy","type":"part-of","why":"Mass spectrometry measures mass-to-charge ratios and is grouped with the spectroscopic identification tools."},{"s":"kinematics","t":"work-energy","type":"prerequisite","why":"Work and energy are defined through forces acting over displacements, so Newton's laws and kinematics must come first."},{"s":"kinematics","t":"fluids","type":"prerequisite","why":"Pressure, buoyancy and flow problems are force balances and accelerations of fluid parcels, built on Newton's laws."},{"s":"kinematics","t":"electrostatics","type":"prerequisite","why":"A charge in a field obeys F = ma with qE as the force, so field problems reuse the kinematic equations."},{"s":"motion-vectors","t":"kinematics","type":"part-of","why":"Displacement, velocity and acceleration are the basic quantities every kinematics problem tracks."},{"s":"motion-vectors","t":"projectile-motion","type":"prerequisite","why":"Projectile problems split velocity and displacement vectors into horizontal and vertical components that are solved separately."},{"s":"motion-vectors","t":"newtons-laws","type":"prerequisite","why":"Newton's second law ties net force to acceleration, so acceleration as the rate of change of velocity must be understood first."},{"s":"motion-vectors","t":"vestibular-kinesthetic","type":"applies-to","why":"The otolith organs sense linear acceleration and the semicircular canals angular acceleration, so steady constant-velocity motion goes unfelt."},{"s":"projectile-motion","t":"kinematics","type":"part-of","why":"Projectile motion applies constant-acceleration kinematics separately to horizontal and vertical components."},{"s":"projectile-motion","t":"electric-field","type":"applies-to","why":"A charge entering a uniform field between plates follows a parabola, solved exactly like a projectile with qE/m in place of g."},{"s":"projectile-motion","t":"lorentz-force","type":"contrasts","why":"A constant force like gravity bends a path into a parabola, while a magnetic force that stays perpendicular to velocity bends it into a circle."},{"s":"newtons-laws","t":"gel-electrophoresis","type":"applies-to","why":"A molecule in a gel quickly reaches terminal velocity where the electric force qE balances frictional drag, so speed depends on charge and size."},{"s":"newtons-laws","t":"kinematics","type":"part-of","why":"Newton's laws are the dynamics half of the topic, explaining motion in terms of forces."},{"s":"newtons-laws","t":"projectile-motion","type":"explains","why":"Gravity is the only force on an ideal projectile, so F = ma gives acceleration g vertically and zero horizontally."},{"s":"newtons-laws","t":"work-energy-theorem","type":"prerequisite","why":"Applying F_net = ma over a displacement with the kinematic equation v² = v₀² + 2aΔx yields W_net = ΔKE."},{"s":"newtons-laws","t":"vestibular-kinesthetic","type":"applies-to","why":"By inertia, endolymph lags as the head starts rotating and bends the cupula, and dense otoconia lag during linear acceleration, so the vestibular organs sense acceleration."},{"s":"friction","t":"newtons-laws","type":"part-of","why":"Friction is one of the contact forces analyzed in free-body diagrams with Newton's laws."},{"s":"friction","t":"centripetal","type":"applies-to","why":"Static friction between tires and road supplies the centripetal force that lets a car round a flat curve."},{"s":"friction","t":"energy-conservation","type":"affects","why":"Kinetic friction does negative work that turns mechanical energy into heat, so KE + PE is no longer conserved."},{"s":"centripetal","t":"organelles","type":"applies-to","why":"Differential centrifugation spins homogenates so larger, denser organelles such as nuclei pellet at lower speeds than mitochondria, with ribosomes needing the highest."},{"s":"centripetal","t":"newtons-laws","type":"part-of","why":"Centripetal force is Newton's second law applied to circular motion, with a = v²/r toward the center."},{"s":"centripetal","t":"lorentz-force","type":"prerequisite","why":"Setting the magnetic force qvB equal to mv²/r gives the radius r = mv/(qB) of a charged particle's circular path."},{"s":"torque","t":"atp-synthase","type":"applies-to","why":"Proton flow through F₀ spins the c-ring rotor, and torque on the central γ-stalk drives the conformational changes in F₁ that make ATP."},{"s":"torque","t":"kinematics","type":"part-of","why":"Torque and rotational equilibrium extend force analysis to turning and balance."},{"s":"torque","t":"center-of-mass","type":"explains","why":"The center of mass is the balance point: gravitational torques from all parts of an object about it sum to zero."},{"s":"center-of-mass","t":"kinematics","type":"part-of","why":"The center of mass is the point whose motion represents an object's overall translation."},{"s":"center-of-mass","t":"projectile-motion","type":"applies-to","why":"A thrown, tumbling object's center of mass follows a clean parabola even while the rest of the object rotates around it."},{"s":"center-of-mass","t":"vestibular-kinesthetic","type":"applies-to","why":"Standing balance requires keeping the body's center of mass over the base of support, monitored by vestibular and proprioceptive input."},{"s":"work-energy","t":"atp","type":"applies-to","why":"Cells couple ATP hydrolysis to mechanical work, such as myosin and kinesin steps, so energy conservation limits the work each ATP can do."},{"s":"work-energy","t":"ventilation","type":"applies-to","why":"Work done on a gas is the area under its pressure–volume curve, so stiffer, less compliant lungs need more work per breath."},{"s":"work-energy","t":"thermodynamics","type":"prerequisite","why":"The first law, ΔU = Q − W, extends mechanical work-energy bookkeeping to heat and internal energy."},{"s":"work-energy","t":"electrostatics","type":"prerequisite","why":"Electric potential energy and voltage extend the potential-energy idea from gravity to charges, so work and energy come first."},{"s":"work-energy-theorem","t":"mass-spec","type":"applies-to","why":"Ions accelerated through a voltage V gain kinetic energy ½mv² = qV, so lighter ions of the same charge leave the source faster."},{"s":"work-energy-theorem","t":"work-energy","type":"part-of","why":"The work–energy theorem links net work to kinetic energy, the core relation of the topic."},{"s":"work-energy-theorem","t":"energy-conservation","type":"prerequisite","why":"Splitting net work into conservative work (−ΔPE) and non-conservative work turns W_net = ΔKE into the energy-conservation equation."},{"s":"conservative-forces","t":"hess-law","type":"applies-to","why":"Like work done by a conservative force, ΔH is path-independent because enthalpy is a state function, which is why Hess's law can sum steps along any route."},{"s":"conservative-forces","t":"work-energy","type":"part-of","why":"Classifying forces as conservative or not decides whether mechanical energy is conserved."},{"s":"conservative-forces","t":"energy-conservation","type":"explains","why":"Conservative forces store their work as recoverable potential energy, so mechanical energy stays constant whenever only they act."},{"s":"conservative-forces","t":"electric-potential","type":"applies-to","why":"The electrostatic force is conservative, so a path-independent potential (voltage) can be assigned to every point in space."},{"s":"energy-conservation","t":"projectile-motion","type":"applies-to","why":"A projectile's speed at any height follows from ½mv² + mgh = constant, independent of launch angle."},{"s":"energy-conservation","t":"work-energy","type":"part-of","why":"Conservation of mechanical energy is the main problem-solving tool of work and energy."},{"s":"energy-conservation","t":"pascal","type":"applies-to","why":"A hydraulic lift multiplies force but not energy: work in equals work out (F₁d₁ = F₂d₂), so the small piston must move farther."},{"s":"energy-conservation","t":"bernoulli","type":"explains","why":"Bernoulli's equation is energy conservation per unit volume: pressure, kinetic energy density ½ρv² and ρgh trade off along a streamline."},{"s":"energy-conservation","t":"electric-potential-energy","type":"applies-to","why":"A charge released in a field converts electric potential energy into kinetic energy, so ΔKE = −qΔV."},{"s":"power-efficiency","t":"uncouplers","type":"applies-to","why":"Uncouplers let protons bypass ATP synthase, driving ATP-synthesis efficiency down so electron-transport energy is released as heat, as in brown fat."},{"s":"power-efficiency","t":"cardiac-output","type":"applies-to","why":"The heart's hydraulic power output is pressure times flow (mean arterial pressure × cardiac output), the fluid analog of P = IV."},{"s":"power-efficiency","t":"work-energy","type":"part-of","why":"Power is the rate of work, and efficiency compares useful work with energy input."},{"s":"power-efficiency","t":"electrical-power","type":"prerequisite","why":"Electrical power P = IV is the same rate of energy transfer, expressed through voltage and current."},{"s":"fluids","t":"cardiovascular-system","type":"applies-to","why":"Continuity, pressure gradients and Poiseuille's law explain blood velocity, vascular resistance and how blood pressure is maintained."},{"s":"fluids","t":"respiratory-system","type":"applies-to","why":"Air moves down pressure gradients against airway resistance, and alveolar stability depends on surface tension and surfactant."},{"s":"fluids","t":"renal-system","type":"applies-to","why":"Glomerular filtration is driven by hydrostatic pressure in glomerular capillaries, opposed by plasma oncotic pressure and Bowman's capsule pressure."},{"s":"density","t":"lipoproteins","type":"explains","why":"Lipid is less dense than protein, so TAG-rich chylomicrons and VLDL float highest and protein-rich HDL is densest, which is how ultracentrifugation separates them."},{"s":"density","t":"fluids","type":"part-of","why":"Density is the fluid property underlying pressure, buoyancy and flow calculations."},{"s":"density","t":"hydrostatic-pressure","type":"prerequisite","why":"Pressure at depth scales with fluid density (ρgh), so a mercury column is about 13.6 times shorter than a water column for the same pressure."},{"s":"density","t":"archimedes","type":"prerequisite","why":"Whether an object floats or sinks depends on comparing its average density with the fluid's density."},{"s":"density","t":"ultrasound","type":"applies-to","why":"Acoustic impedance is density times sound speed, so density differences between tissues determine how strongly ultrasound echoes reflect."},{"s":"hydrostatic-pressure","t":"blood-pressure","type":"affects","why":"Standing adds a ρgh column, so arterial and venous pressures in the feet exceed those at heart level and blood pools in leg veins."},{"s":"hydrostatic-pressure","t":"gfr","type":"applies-to","why":"Hydrostatic pressure in glomerular capillaries is the main force pushing plasma into Bowman's space, opposed by oncotic and capsular pressure."},{"s":"hydrostatic-pressure","t":"starling-forces","type":"applies-to","why":"Capillary blood pressure is a hydrostatic pressure pushing fluid out, and it is higher in dependent limbs where ρgh adds to it."},{"s":"hydrostatic-pressure","t":"fluids","type":"part-of","why":"Hydrostatic pressure, P = P₀ + ρgh, is the foundation of fluid statics."},{"s":"hydrostatic-pressure","t":"archimedes","type":"explains","why":"Fluid pushes harder on an object's deeper bottom surface than on its top, and this pressure difference is the buoyant force."},{"s":"pascal","t":"blood-pressure","type":"applies-to","why":"Cuff pressure is transmitted through soft, mostly water arm tissue to the brachial artery, so cuff pressure at the first Korotkoff sound approximates systolic pressure."},{"s":"pascal","t":"hydrostatic-pressure","type":"part-of","why":"Pascal's principle describes how a pressure change spreads through an enclosed static fluid."},{"s":"pascal","t":"audition","type":"applies-to","why":"Cochlear fluid is nearly incompressible, so pressure from the stapes at the oval window is transmitted through it, moving the basilar membrane and bulging the round window outward."},{"s":"archimedes","t":"replication","type":"applies-to","why":"In a CsCl gradient DNA settles where the medium's density matches its own, which let Meselson and Stahl separate ¹⁵N from ¹⁴N DNA and show semiconservative replication."},{"s":"archimedes","t":"fluids","type":"part-of","why":"Archimedes' principle gives the buoyant force on objects in fluids."},{"s":"archimedes","t":"surface-tension","type":"contrasts","why":"A steel needle or water strider rests on water because of surface tension, not buoyancy, since it displaces far too little water to float."},{"s":"continuity","t":"cardiac-output","type":"applies-to","why":"Cardiac output is a volume flow rate (Q = Av) shared by the aorta and the whole capillary bed, so velocity varies inversely with total cross-sectional area."},{"s":"continuity","t":"gas-exchange","type":"applies-to","why":"Slow flow through the vast total cross-section of pulmonary capillaries gives red cells enough transit time to equilibrate O₂ and CO₂."},{"s":"continuity","t":"fluids","type":"part-of","why":"The continuity equation is conservation of mass for flowing fluids."},{"s":"continuity","t":"bernoulli","type":"prerequisite","why":"Continuity shows that flow speeds up in narrow sections; Bernoulli then converts that higher speed into lower pressure."},{"s":"continuity","t":"venturi","type":"explains","why":"The constriction in a Venturi tube raises flow speed because Av must stay constant, which sets up the pressure drop."},{"s":"bernoulli","t":"heart-anatomy","type":"applies-to","why":"Blood forms a high-speed jet through a narrowed (stenotic) valve, and Bernoulli's equation links that jet speed to the pressure drop across the valve."},{"s":"bernoulli","t":"fluids","type":"part-of","why":"Bernoulli's equation is the energy-conservation law of ideal fluid flow."},{"s":"bernoulli","t":"poiseuille","type":"contrasts","why":"Bernoulli assumes no viscosity, so pressure changes only with speed or height, while Poiseuille describes pressure lost to viscous resistance along a tube."},{"s":"venturi","t":"bernoulli","type":"part-of","why":"The Venturi effect is a direct application of Bernoulli's equation at a constriction."},{"s":"venturi","t":"sleep-disorders","type":"applies-to","why":"In obstructive sleep apnea, fast airflow through a narrowed, relaxed pharynx lowers pressure on its collapsible walls, one factor that helps pull the airway shut."},{"s":"poiseuille","t":"blood-pressure","type":"applies-to","why":"Arterioles set total peripheral resistance because resistance scales with 1/r⁴, so small changes in their radius strongly shift blood pressure."},{"s":"poiseuille","t":"ventilation","type":"applies-to","why":"Airway resistance scales with 1/r⁴, so bronchoconstriction in asthma sharply raises the pressure gradient needed to move air."},{"s":"poiseuille","t":"fluids","type":"part-of","why":"Poiseuille's law describes real, viscous flow through tubes such as blood vessels."},{"s":"surface-tension","t":"ventilation","type":"applies-to","why":"Surfactant lowers alveolar surface tension, raising lung compliance and preventing small alveoli from collapsing under the Laplace pressure 2γ/r."},{"s":"surface-tension","t":"bile-salts","type":"applies-to","why":"Bile salts are amphipathic and lower fat–water interfacial tension, so churning breaks fat into small, stable droplets with more surface area for lipase."},{"s":"surface-tension","t":"fluids","type":"part-of","why":"Surface tension is a fluid property arising from cohesion at a liquid's surface."},{"s":"electrostatics","t":"nervous-system","type":"applies-to","why":"Charge separation across neuronal membranes creates the voltages and fields that drive ion currents during action potentials."},{"s":"electrostatics","t":"bonding","type":"applies-to","why":"Ionic bonds, dipole interactions and hydrogen bonds are all largely Coulombic attractions between full or partial charges."},{"s":"electrostatics","t":"electrochemistry","type":"applies-to","why":"Cell potentials are electric potential differences, and ΔG = −nFE converts them into energy per mole of reaction."},{"s":"electrostatics","t":"circuits","type":"prerequisite","why":"Circuits are voltages pushing charges through conductors, so charge, field and potential must be understood first."},{"s":"coulomb","t":"salt-bridge","type":"applies-to","why":"Salt bridges between Lys/Arg and Asp/Glu obey Coulomb's law and are strongest where the local dielectric is low, as in a protein's interior."},{"s":"coulomb","t":"dna-structure","type":"applies-to","why":"The negative phosphate groups repel each other, so counterions such as Mg²⁺ and positively charged histones are needed to shield them."},{"s":"coulomb","t":"periodic-trends","type":"explains","why":"Valence electrons are held by Coulombic attraction to the effective nuclear charge, so higher Zeff and smaller radius mean tighter binding."},{"s":"coulomb","t":"ionic-bonds","type":"explains","why":"Lattice energy grows with ion charge and shrinks with ion separation, following the q₁q₂/r dependence of Coulombic attraction."},{"s":"coulomb","t":"electrostatics","type":"part-of","why":"Coulomb's law gives the force between charges, the starting point of electrostatics."},{"s":"electric-field","t":"pI","type":"applies-to","why":"In isoelectric focusing, the field drives a protein through a pH gradient until it reaches its pI, where it has no net charge and stops."},{"s":"electric-field","t":"gel-electrophoresis","type":"applies-to","why":"The applied field pulls negatively charged DNA or SDS-coated proteins toward the anode with force qE."},{"s":"electric-field","t":"action-potential","type":"applies-to","why":"Depolarization changes the intense transmembrane field, which moves charged voltage-sensor segments and opens voltage-gated Na⁺ and K⁺ channels."},{"s":"electric-field","t":"electrostatics","type":"part-of","why":"The electric field describes the force per unit charge that a charge distribution creates."},{"s":"electric-field","t":"electric-potential","type":"prerequisite","why":"In a uniform field the potential difference is V = Ed, so voltage is the field accumulated over distance."},{"s":"electric-potential-energy","t":"secondary-active-transport","type":"applies-to","why":"Na⁺ entering a cell with a negative interior loses electrical potential energy as well as concentration energy, and cotransporters harness this to move other solutes."},{"s":"electric-potential-energy","t":"ionization-energy","type":"applies-to","why":"Removing an electron raises its electric potential energy, so electrons that are closer to a larger effective nuclear charge cost more energy to remove."},{"s":"electric-potential-energy","t":"electrostatics","type":"part-of","why":"Electric potential energy is the stored energy of charges in electrostatic interaction."},{"s":"electric-potential-energy","t":"electric-potential","type":"prerequisite","why":"Electric potential is potential energy per unit charge, V = U/q, so the energy picture comes first."},{"s":"electric-potential","t":"proton-gradient","type":"applies-to","why":"The proton-motive force includes an electrical potential across the inner mitochondrial membrane, matrix negative, in addition to the pH difference."},{"s":"electric-potential","t":"nernst","type":"applies-to","why":"An ion's equilibrium potential from the Nernst equation is the voltage at which its electrical energy difference exactly balances its concentration gradient."},{"s":"electric-potential","t":"dg-nfe","type":"applies-to","why":"ΔG° = −nFE° converts a potential difference into free energy, because energy equals charge times voltage."},{"s":"electric-potential","t":"electrostatics","type":"part-of","why":"Voltage is electric potential energy per unit charge, a central electrostatic quantity."},{"s":"capacitance","t":"action-potential","type":"applies-to","why":"Because membrane capacitance is small, an action potential moves only a tiny fraction of the cell's ions, leaving bulk concentrations nearly unchanged."},{"s":"capacitance","t":"myelination","type":"applies-to","why":"Myelin thickens the insulating layer around the axon, lowering membrane capacitance so less charge is needed to depolarize each segment, which speeds conduction."},{"s":"capacitance","t":"electrostatics","type":"part-of","why":"Capacitors store separated charge and energy in an electric field."},{"s":"capacitance","t":"capacitors-circuits","type":"prerequisite","why":"Single-capacitor relations (C = Q/V, U = ½CV²) are needed before combining capacitors or analyzing RC charging."},{"s":"lorentz-force","t":"mass-spec","type":"applies-to","why":"Magnetic-sector mass spectrometers bend ions into arcs of radius r = mv/(qB), separating them by mass-to-charge ratio."},{"s":"lorentz-force","t":"electrostatics","type":"part-of","why":"The Lorentz force describes how magnetic fields act on moving charges."},{"s":"lorentz-force","t":"electric-field","type":"contrasts","why":"Electric forces act on any charge and can change its speed, while magnetic forces act only on moving charges and never do work."},{"s":"magnetic-fields","t":"nmr","type":"applies-to","why":"NMR and MRI place nuclei in a strong external field that splits their spin states, and the energy gap sets the radio frequency absorbed."},{"s":"magnetic-fields","t":"electrostatics","type":"part-of","why":"Magnetic fields are produced by moving charges and currents."},{"s":"magnetic-fields","t":"lorentz-force","type":"prerequisite","why":"The field made by one current exerts qv×B forces on charges in a neighboring wire, which is why parallel currents attract."},{"s":"magnetic-fields","t":"em-spectrum","type":"prerequisite","why":"Light consists of coupled oscillating electric and magnetic fields, perpendicular to each other and to the direction of travel."},{"s":"circuits","t":"nervous-system","type":"applies-to","why":"Neurons are modeled as circuits: ion channels act as resistors, the bilayer as a capacitor and ion gradients as batteries."},{"s":"circuits","t":"cardiovascular-system","type":"applies-to","why":"Blood flow obeys ΔP = QR, the fluid form of Ohm's law, with the heart as the pump and vessels as resistors."},{"s":"circuits","t":"electrochemistry","type":"applies-to","why":"A galvanic cell is a battery: electrons flow through the external wire from anode to cathode, doing electrical w
