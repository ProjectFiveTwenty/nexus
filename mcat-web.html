sicles for regulated exocytosis. Being polar, they dissolve in plasma, cannot cross the membrane, and bind cell-surface receptors that trigger second-messenger cascades. They act within seconds to minutes but are short-lived because they are degraded quickly.","trap":null},{"id":"steroid-hormones","title":"Steroid hormones","section":"bb","disc":"Physiology","parent":"endocrine-system","hub":false,"summary":"Steroid hormones (cortisol, aldosterone, estrogen, progesterone, testosterone) are built from cholesterol in the smooth ER and mitochondria of the adrenal cortex, gonads and placenta. They are not stored but released as they are made. Being hydrophobic, they travel bound to plasma carrier proteins, cross membranes, and bind intracellular receptors that act as transcription factors, so their effects are slow but long-lasting.","trap":"Not every lipophilic hormone is a steroid: thyroid hormones also use nuclear receptors but are derived from tyrosine."},{"id":"amine-hormones","title":"Amino acid–derived hormones","section":"bb","disc":"Physiology","parent":"endocrine-system","hub":false,"summary":"Amino acid–derived hormones come from tyrosine or tryptophan and split by solubility. Catecholamines (epinephrine, norepinephrine) from the adrenal medulla are water-soluble, bind surface adrenergic receptors and act in seconds. Thyroid hormones (T₃, T₄, each built from two iodinated tyrosines) are lipophilic, use carrier proteins and nuclear receptors, and act slowly. Melatonin, made from tryptophan via serotonin, comes from the pineal gland.","trap":null},{"id":"second-messengers","title":"Second messengers","section":"bb","disc":"Physiology","parent":"endocrine-system","hub":false,"summary":"Hydrophilic first messengers cannot enter the cell, so receptor binding generates small intracellular messengers that relay and amplify the signal. Many hormones use G protein–coupled receptors: Gs raises cAMP, Gi lowers it, and Gq produces IP₃, DAG and Ca²⁺. Receptor tyrosine kinases (the insulin receptor) instead trigger phosphorylation cascades. Enzymatic steps multiply the signal, so a few hormone molecules can alter thousands of target proteins.","trap":null},{"id":"camp","title":"cAMP signaling","section":"bb","disc":"Physiology","parent":"second-messengers","hub":false,"summary":"When a hormone binds a Gs-coupled receptor, the Gα subunit exchanges GDP for GTP and activates adenylyl cyclase, which converts ATP to cAMP. cAMP activates protein kinase A, which phosphorylates target proteins; in liver, glucagon and epinephrine use this route to turn on glycogen breakdown and turn off glycogen synthesis. Phosphodiesterase ends the signal by hydrolyzing cAMP to AMP.","trap":null},{"id":"ip3-calcium","title":"IP₃ and calcium signaling","section":"bb","disc":"Physiology","parent":"second-messengers","hub":false,"summary":"Gq-coupled receptors activate phospholipase C, which cleaves the membrane lipid PIP₂ into IP₃ and DAG. IP₃ opens ligand-gated Ca²⁺ channels in the ER membrane, releasing stored Ca²⁺. Ca²⁺ acts through calmodulin and, together with DAG, activates protein kinase C. Ca²⁺ is a powerful signal because cytosolic levels are held roughly 10,000-fold below extracellular levels, so small releases cause large relative changes.","trap":null},{"id":"feedback-loops","title":"Negative and positive feedback","section":"bb","disc":"Physiology","parent":"endocrine-system","hub":false,"summary":"Negative feedback, the dominant endocrine control, has a hormone's effect suppress its own release, holding a variable near a set point; in three-tier axes the end hormone inhibits both pituitary and hypothalamus, as cortisol suppresses ACTH and CRH. Positive feedback amplifies a change until some endpoint stops it: oxytocin during labor, the estrogen-triggered LH surge before ovulation, and the growth of a clot.","trap":"Estrogen exerts negative feedback on GnRH and LH for most of the cycle, but sustained high estrogen just before ovulation switches to positive feedback and triggers the LH surge."},{"id":"hypothalamus-pituitary","title":"Hypothalamic–pituitary axes","section":"bb","disc":"Physiology","parent":"endocrine-system","hub":false,"summary":"The hypothalamus links the nervous and endocrine systems. Some of its neurons release releasing and inhibiting hormones (CRH, TRH, GnRH, GHRH, somatostatin, dopamine) into the hypophyseal portal veins, which carry them straight to the anterior pituitary; others send axons into the posterior pituitary. The three-tier HPA, HPT and HPG axes run hypothalamus → pituitary → target gland, and the target hormone feeds back on the upper tiers.","trap":null},{"id":"anterior-pituitary","title":"Anterior pituitary","section":"bb","disc":"Physiology","parent":"hypothalamus-pituitary","hub":false,"summary":"The anterior pituitary is true glandular tissue that releases six hormones under hypothalamic control: FSH, LH, ACTH, TSH, prolactin and growth hormone. FSH, LH, ACTH and TSH are tropic, stimulating other endocrine glands; prolactin and GH act directly on tissues, with GH also working through IGF-1 made by the liver. Prolactin is unusual in being held down mainly by hypothalamic dopamine.","trap":null},{"id":"posterior-pituitary","title":"Posterior pituitary","section":"bb","disc":"Physiology","parent":"hypothalamus-pituitary","hub":false,"summary":"The posterior pituitary is neural tissue: axons from hypothalamic supraoptic and paraventricular neurons end there and release oxytocin and ADH (vasopressin) directly into the blood. ADH triggers insertion of aquaporin-2 channels in collecting-duct cells to retain water when plasma osmolarity rises or blood volume falls sharply. Oxytocin drives uterine contraction in labor by positive feedback and triggers milk ejection; it has also been linked to social and maternal bonding.","trap":"The posterior pituitary does not synthesize its hormones; ADH and oxytocin are made in hypothalamic cell bodies and only stored and released there."},{"id":"adrenal-cortex","title":"Adrenal cortex","section":"bb","disc":"Physiology","parent":"endocrine-system","hub":false,"summary":"The adrenal cortex makes cholesterol-derived corticosteroids in three zones (outer to inner: salt, sugar, sex). Zona glomerulosa makes aldosterone, driven by angiotensin II and high K⁺, which increases Na⁺ reabsorption and K⁺ and H⁺ secretion in the distal nephron. Zona fasciculata makes cortisol under ACTH, raising blood glucose and suppressing immunity and inflammation. Zona reticularis makes adrenal androgens.","trap":"Aldosterone retains Na⁺ and water but excretes K⁺ and H⁺, so excess aldosterone causes hypokalemia and metabolic alkalosis, not hyperkalemia."},{"id":"adrenal-medulla","title":"Adrenal medulla","section":"bb","disc":"Physiology","parent":"endocrine-system","hub":false,"summary":"The adrenal medulla is a modified sympathetic ganglion: preganglionic sympathetic fibers release acetylcholine onto chromaffin cells, which secrete mostly epinephrine plus some norepinephrine into the blood. These catecholamines reinforce fight-or-flight: faster, stronger heartbeats, bronchodilation, glycogen breakdown and lipolysis, and blood shunted to skeletal muscle. Because they circulate, their effects reach more tissues and last longer than direct nerve signals.","trap":null},{"id":"thyroid","title":"Thyroid gland","section":"bb","disc":"Physiology","parent":"endocrine-system","hub":false,"summary":"Thyroid follicular cells concentrate iodide and attach it to tyrosine residues of thyroglobulin, producing mostly T₄ and the more active T₃, under TSH control. Thyroid hormones raise basal metabolic rate, O₂ consumption and heat production, and are essential for normal growth and brain development. Parafollicular (C) cells secrete calcitonin, which lowers blood Ca²⁺ by inhibiting osteoclasts.","trap":"In primary hypothyroidism TSH is high, not low, because low T₃ and T₄ remove negative feedback on the pituitary."},{"id":"parathyroid","title":"Parathyroid glands","section":"bb","disc":"Physiology","parent":"endocrine-system","hub":false,"summary":"The parathyroid glands secrete PTH when blood Ca²⁺ falls. PTH raises Ca²⁺ three ways: it stimulates bone resorption by osteoclasts (indirectly, via osteoblasts), increases Ca²⁺ reabsorption in the distal tubule while making the kidney excrete phosphate, and activates renal 1α-hydroxylase to form calcitriol (active vitamin D), which boosts intestinal Ca²⁺ absorption.","trap":"PTH raises blood calcium but lowers blood phosphate, because it makes the kidney excrete phosphate even as bone releases it."},{"id":"insulin-glucagon","title":"Insulin and glucagon","section":"bb","disc":"Physiology","parent":"endocrine-system","hub":false,"summary":"Pancreatic islet β-cells release insulin when blood glucose rises, and α-cells release glucagon when it falls. Insulin, acting through a receptor tyrosine kinase, moves GLUT4 to the surface of muscle and fat cells and promotes storage as glycogen, fat and protein. Glucagon, acting through Gs and cAMP, works mainly on liver to drive glycogenolysis, gluconeogenesis and ketogenesis. Their ratio sets the fed versus fasting state.","trap":"Glucagon has little direct effect on skeletal muscle, which lacks glucagon receptors and glucose-6-phosphatase, so muscle glycogen cannot be used to raise blood glucose."},{"id":"cardiovascular-system","title":"Cardiovascular system","section":"bb","disc":"Physiology","parent":null,"hub":true,"summary":"The cardiovascular system is a closed double circuit: the right heart pumps blood through the lungs and the left heart through the body, in series, so both outputs must match. Flow follows fluid physics: cardiac output = mean arterial pressure ÷ total peripheral resistance, with resistance set mostly by arteriole radius. Blood carries O₂ on hemoglobin, CO₂ mostly as bicarbonate, plus nutrients, hormones and heat, and clotting seals leaks.","trap":"Pulmonary arteries carry deoxygenated blood and pulmonary veins carry oxygenated blood; arteries are defined by carrying blood away from the heart, not by O₂ content."},{"id":"heart-anatomy","title":"Heart chambers and valves","section":"bb","disc":"Physiology","parent":"cardiovascular-system","hub":false,"summary":"Blood flows from the venae cavae to the right atrium, through the tricuspid valve to the right ventricle, through the pulmonary valve to the lungs, back by pulmonary veins to the left atrium, through the mitral (bicuspid) valve to the left ventricle, and out the aortic valve. Atrioventricular valves are anchored by chordae tendineae and papillary muscles. The left ventricle's wall is thickest because it pumps against systemic pressure.","trap":"The left ventricle is thicker because it generates higher pressure, not because it pumps more blood; over time both ventricles eject the same volume."},{"id":"cardiac-cycle","title":"Cardiac cycle","section":"bb","disc":"Physiology","parent":"cardiovascular-system","hub":false,"summary":"Systole starts as the ventricles contract and close the AV valves (S1, 'lub'); during isovolumetric contraction all valves are shut until ventricular pressure exceeds arterial pressure and the semilunar valves open for ejection. In diastole the semilunar valves close (S2, 'dub'), the ventricles relax isovolumetrically, then the AV valves open and the ventricles fill, mostly passively, topped off by atrial contraction.","trap":"Heart sounds come from valves closing, not opening: S1 is closure of the AV valves at the start of systole and S2 is closure of the semilunar valves."},{"id":"cardiac-output","title":"Cardiac output","section":"bb","disc":"Physiology","parent":"cardiovascular-system","hub":false,"summary":"Cardiac output is the volume each ventricle pumps per minute: CO = heart rate × stroke volume, about 5 L/min at rest (70 beats/min × 70 mL). Stroke volume rises with preload (Frank–Starling: more stretch, stronger contraction) and with contractility (sympathetic input), and falls with higher afterload. Rearranged as CO = MAP ÷ TPR, it is the circulatory form of Ohm's law.","trap":"Raising heart rate does not always raise cardiac output; at very high rates diastolic filling time shrinks, so stroke volume can fall."},{"id":"conduction-system","title":"Cardiac conduction system","section":"bb","disc":"Physiology","parent":"cardiovascular-system","hub":false,"summary":"SA node cells (right atrium) have no stable resting potential: a slow inward 'funny' current through channels passing both Na⁺ and K⁺ (net Na⁺ entry) depolarizes them until Ca²⁺ influx fires the upstroke, setting a resting rate near 60–100 beats/min. The impulse crosses the atria, pauses about 0.1 s at the AV node so the ventricles can fill, then speeds through the bundle of His, bundle branches and Purkinje fibers. ECG: P = atrial depolarization, QRS = ventricular depolarization, T = ventricular repolarization.","trap":"ECG waves show electrical events, not contraction, and atrial repolarization has no visible wave because it is hidden in the QRS complex."},{"id":"blood-pressure","title":"Blood pressure regulation","section":"bb","disc":"Physiology","parent":"cardiovascular-system","hub":false,"summary":"Blood pressure, normally about 120/80 mmHg, is the force of blood on arterial walls; mean arterial pressure ≈ diastolic + one-third of pulse pressure. MAP = cardiac output × total peripheral resistance, and resistance is set mainly by arteriole radius (Poiseuille: R ∝ 1/r⁴). Baroreceptor reflexes correct pressure within seconds; the kidneys control it long-term by adjusting blood volume through RAAS, ADH and ANP.","trap":"Pressure falls most steeply across the arterioles, not the capillaries, because arterioles supply most resistance while capillaries have the largest total cross-sectional area."},{"id":"baroreceptors","title":"Baroreceptors","section":"bb","disc":"Physiology","parent":"blood-pressure","hub":false,"summary":"Baroreceptors are stretch receptors in the carotid sinus and aortic arch that fire faster as arterial pressure rises. Their signals reach the medulla, which answers high pressure by boosting vagal output and cutting sympathetic output, slowing the heart and dilating vessels; a fall in pressure does the reverse. They buffer rapid changes such as standing up but reset to a chronically high pressure.","trap":null},{"id":"hemoglobin","title":"Hemoglobin","section":"bb","disc":"Physiology","parent":"cardiovascular-system","hub":false,"summary":"Hemoglobin is an α₂β₂ tetramer in red blood cells; each subunit's heme holds an Fe²⁺ that binds one O₂. Binding is cooperative (T to R shift), giving a sigmoidal curve that loads nearly fully in the lungs yet unloads steeply at tissue PO₂. More CO₂, H⁺, heat or 2,3-BPG shifts the curve right (lower affinity); fetal hemoglobin and carbon monoxide shift it left.","trap":"A right shift means lower O₂ affinity (higher P₅₀) and more unloading to tissues; students often reverse this, and CO shifts the curve left while also blocking binding sites."},{"id":"bohr-effect","title":"Bohr effect","section":"bb","disc":"Physiology","parent":"hemoglobin","hub":false,"summary":"The Bohr effect is the drop in hemoglobin's O₂ affinity as H⁺ or CO₂ rises. Protons bind histidine residues and CO₂ forms carbamino groups on globin N-termini, both stabilizing the low-affinity T state and shifting the curve right. Active tissue, which is acidic and CO₂-rich, therefore gets more O₂ unloaded exactly where demand is highest.","trap":null},{"id":"haldane-effect","title":"Haldane effect","section":"bb","disc":"Physiology","parent":"hemoglobin","hub":false,"summary":"The Haldane effect is the mirror of the Bohr effect: deoxygenated hemoglobin binds H⁺ and CO₂ (as carbamino groups) better than oxygenated hemoglobin. In tissues, unloading O₂ lets hemoglobin take up CO₂ and the H⁺ released as red-cell carbonic anhydrase forms bicarbonate (CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻). In the lungs, oxygenation drives H⁺ and CO₂ off, favoring CO₂ exhalation.","trap":"Most CO₂ travels as bicarbonate, not bound to hemoglobin; the Haldane effect works both by more carbamino binding and by deoxyhemoglobin buffering the H⁺ that bicarbonate formation releases."},{"id":"clotting","title":"Hemostasis and the clotting cascade","section":"bb","disc":"Physiology","parent":"cardiovascular-system","hub":false,"summary":"Hemostasis starts with vasoconstriction and a platelet plug: exposed collagen and von Willebrand factor make platelets adhere and release ADP and thromboxane A₂ to recruit more. The coagulation cascade, a chain of protease zymogens each activating the next, ends with thrombin converting soluble fibrinogen into fibrin that stabilizes the plug. Most factors are made in the liver; factors II, VII, IX and X need vitamin K, the cascade needs Ca²⁺, and plasmin later dissolves the clot.","trap":"Serum is the fluid left after blood clots, so it lacks fibrinogen and consumed clotting factors; plasma comes from anticoagulated blood and still contains them."},{"id":"ph-homeostasis","title":"Blood pH homeostasis","section":"bb","disc":"Physiology","parent":null,"hub":false,"summary":"Blood pH is held at 7.35–7.45, mainly by the bicarbonate buffer: CO₂ + H₂O ⇌ H₂CO₃ ⇌ H⁺ + HCO₃⁻, with carbonic anhydrase speeding the first step. Lungs adjust CO₂ within minutes and kidneys adjust HCO₃⁻ and H⁺ excretion over hours to days. Respiratory disorders change PCO₂ first; metabolic disorders change HCO₃⁻ first, and the other organ compensates.","trap":"Hyperventilation removes CO₂, shifts the equilibrium left and raises pH (respiratory alkalosis); students often flip which way ventilation moves pH."},{"id":"respiratory-system","title":"Respiratory system","section":"bb","disc":"Physiology","parent":null,"hub":true,"summary":"The respiratory system brings air to roughly 300 million alveoli, where O₂ and CO₂ diffuse across a thin membrane with about 70 m² of surface. Pressure changes made by the diaphragm move air, partial-pressure gradients drive diffusion, and hemoglobin carries O₂ onward. Because exhaled CO₂ is an acid source, breathing also sets blood pH, and brainstem centers, guided by chemoreceptors, match ventilation to metabolic demand.","trap":null},{"id":"airway-anatomy","title":"Respiratory tract anatomy","section":"bb","disc":"Physiology","parent":"respiratory-system","hub":false,"summary":"Air passes nose → pharynx → larynx → trachea → bronchi → bronchioles → alveoli. The conducting zone (down to the terminal bronchioles) warms, humidifies and filters air but exchanges no gas, forming about 150 mL of anatomical dead space. Ciliated, mucus-covered epithelium clears particles upward. Alveoli are lined by thin type I cells for diffusion and type II cells that secrete surfactant.","trap":"The epiglottis covers the larynx (glottis) during swallowing, not the esophagus; air and food share the pharynx and split at the larynx."},{"id":"ventilation","title":"Mechanics of ventilation","section":"bb","disc":"Physiology","parent":"respiratory-system","hub":false,"summary":"Inspiration is active: the diaphragm contracts and flattens and the external intercostals lift the ribs, enlarging the thoracic cavity. By Boyle's law, the larger volume makes intrapleural pressure more negative and drops alveolar pressure below atmospheric, so air flows in (negative-pressure breathing). Quiet expiration is passive elastic recoil; forced expiration recruits internal intercostals and abdominal muscles. Surfactant raises compliance by lowering surface tension.","trap":"Intrapleural pressure stays below atmospheric throughout quiet breathing; if it equalizes, as in a pneumothorax, the lung collapses instead of staying inflated."},{"id":"lung-volumes","title":"Lung volumes and capacities","section":"bb","disc":"Physiology","parent":"respiratory-system","hub":false,"summary":"Tidal volume (about 500 mL) is a normal breath; inspiratory and expiratory reserve volumes are the extra air that can be forced in or out. Residual volume (about 1.2 L) remains after maximal exhalation and keeps alveoli open. Capacities are sums of volumes: vital capacity = IRV + TV + ERV, functional residual capacity = ERV + RV, and total lung capacity = vital capacity + RV.","trap":"Residual volume, and therefore FRC and total lung capacity, cannot be measured by simple spirometry because that air never leaves the lungs."},{"id":"gas-exchange","title":"Gas exchange","section":"bb","disc":"Physiology","parent":"respiratory-system","hub":false,"summary":"O₂ and CO₂ cross the alveolar–capillary barrier by simple diffusion down partial-pressure gradients: alveolar PO₂ is about 100 mmHg versus about 40 mmHg in venous blood, and PCO₂ is about 40 versus 46 mmHg. Diffusion rises with surface area and gradient and falls with barrier thickness (Fick's law). CO₂ exchanges quickly despite its small gradient because it is about 20 times more soluble than O₂.","trap":"Each gas diffuses down its own partial-pressure gradient; CO₂'s gradient (about 6 mmHg) is far smaller than O₂'s (about 60 mmHg), yet its much higher solubility lets it exchange just as completely."},{"id":"breathing-control","title":"Control of breathing","section":"bb","disc":"Physiology","parent":"respiratory-system","hub":false,"summary":"The breathing rhythm is generated in the medulla and smoothed by the pons. Central chemoreceptors in the medulla sense CO₂ indirectly, through the H⁺ it forms in cerebrospinal fluid, and drive most moment-to-moment ventilation. Peripheral chemoreceptors in the carotid and aortic bodies respond to low arterial PO₂ (strongly below about 60 mmHg), high PCO₂ and low pH. Voluntary control from the cortex can override this briefly.","trap":"The main normal stimulus to breathe is rising CO₂ (via H⁺), not falling O₂; hypoxia becomes a strong drive only when PO₂ drops a lot."},{"id":"renal-system","title":"Renal system","section":"bb","disc":"Physiology","parent":null,"hub":true,"summary":"The kidneys filter about 180 L of plasma a day and return all but 1–2 L, controlling water, electrolytes, acid–base balance and long-term blood pressure. Each kidney has about a million nephrons that filter, reabsorb and secrete. Hormones such as ADH, aldosterone, ANP and PTH tune the output, and the kidneys also make renin, erythropoietin and active vitamin D (calcitriol).","trap":null},{"id":"nephron","title":"Nephron structure","section":"bb","disc":"Physiology","parent":"renal-system","hub":false,"summary":"Blood enters the glomerulus through the afferent arteriole and leaves through the efferent arteriole, and filtrate collects in Bowman's capsule. Filtrate then flows through the proximal convoluted tubule, the loop of Henle, the distal convoluted tubule and the collecting duct. Glomeruli and convoluted tubules sit in the cortex; loops and collecting ducts dip into the medulla. The juxtaglomerular apparatus senses flow and NaCl and releases renin.","trap":"Blood leaves the glomerulus through an efferent arteriole, not a venule, so the nephron has two capillary beds in series: glomerular and peritubular."},{"id":"gfr","title":"Glomerular filtration rate","section":"bb","disc":"Physiology","parent":"renal-system","hub":false,"summary":"GFR is the plasma volume filtered per minute, about 125 mL/min (180 L/day). It is set by Starling forces: glomerular hydrostatic pressure pushes fluid out, while plasma oncotic pressure and Bowman's capsule pressure oppose it. Afferent constriction lowers GFR and efferent constriction raises it. Size and charge barriers keep cells and most proteins out. Clearance of inulin (or roughly creatinine) estimates GFR.","trap":"Constricting the efferent arteriole raises glomerular hydrostatic pressure and GFR even though it narrows a vessel; constricting the afferent arteriole lowers both."},{"id":"countercurrent","title":"Countercurrent multiplier","section":"bb","disc":"Physiology","parent":"renal-system","hub":false,"summary":"The loop of Henle builds an osmotic gradient in the medulla, from about 300 mOsm/L at the cortex to about 1200 mOsm/L deep inside. The thick ascending limb pumps NaCl out but is impermeable to water, while the descending limb loses water but little solute; flow in opposite directions multiplies this small difference. The vasa recta preserve the gradient, urea recycling adds to it, and ADH lets the collecting duct use it.","trap":"The descending limb is permeable to water and the ascending limb moves salt, not the reverse, so filtrate leaving the ascending limb is hypotonic."},{"id":"reabsorption-secretion","title":"Reabsorption and secretion","section":"bb","disc":"Physiology","parent":"renal-system","hub":false,"summary":"Reabsorption returns substances from filtrate to blood; secretion moves them from peritubular blood into filtrate, so excretion = filtration − reabsorption + secretion. The proximal tubule reclaims about 65% of filtered Na⁺ and water and essentially all glucose and amino acids, using Na⁺-coupled secondary active transport. Distal segments fine-tune Na⁺, K⁺, H⁺ and Ca²⁺ under hormonal control.","trap":"Glucose in the urine means the filtered load exceeded the transporters' maximum (they are saturated), not that the kidney stopped filtering or reabsorbing normally."},{"id":"raas","title":"Renin–angiotensin–aldosterone system","section":"bb","disc":"Physiology","parent":"renal-system","hub":false,"summary":"Low renal perfusion, low NaCl at the macula densa or sympathetic input makes juxtaglomerular cells release renin. Renin cleaves liver-made angiotensinogen to angiotensin I, and ACE (mostly in lung capillaries) converts it to angiotensin II. Angiotensin II constricts arterioles, triggers thirst and ADH release, and stimulates aldosterone, which increases distal Na⁺ reabsorption and K⁺ and H⁺ secretion, raising volume and pressure.","trap":"Aldosterone raises blood volume without much change in plasma osmolarity, because water follows the reabsorbed Na⁺; ADH is the hormone that adds free water and lowers osmolarity."},{"id":"adh","title":"Antidiuretic hormone (ADH)","section":"bb","disc":"Physiology","parent":"renal-system","hub":false,"summary":"ADH (vasopressin) is a peptide made in hypothalamic neurons and released from the posterior pituitary when plasma osmolarity rises or blood volume falls sharply. Through V2 receptors and cAMP it inserts aquaporin-2 channels into collecting-duct cells, so water moves into the hyperosmotic medulla and urine becomes concentrated. At high levels it also constricts arterioles. Alcohol suppresses its release, causing dilute urine.","trap":"ADH is synthesized in the hypothalamus and only stored and released by the posterior pituitary, which makes no hormones of its own."},{"id":"renal-acid-base","title":"Renal acid–base regulation","section":"bb","disc":"Physiology","parent":"renal-system","hub":false,"summary":"Kidneys correct pH slowly, over hours to days. They reabsorb nearly all filtered HCO₃⁻, mostly in the proximal tubule with carbonic anhydrase, and make new HCO₃⁻ each time they excrete an H⁺. Secreted H⁺ is buffered in urine by phosphate and by ammonia (NH₃ + H⁺ → NH₄⁺), which lets far more acid leave than free H⁺ could. In chronic respiratory acidosis the kidneys compensate by retaining HCO₃⁻.","trap":null},{"id":"digestive-system","title":"Digestive system","section":"bb","disc":"Physiology","parent":null,"hub":true,"summary":"Digestion breaks food into absorbable monomers, mechanically (chewing, churning) and chemically by enzymatic hydrolysis. The tract runs mouth → esophagus → stomach → small intestine → large intestine, with salivary glands, liver, gallbladder and pancreas adding secretions. Hormones such as gastrin, secretin and CCK plus the enteric nervous system coordinate secretion and motility, and almost all nutrient absorption occurs in the small intestine.","trap":null},{"id":"enteric-ns","title":"Enteric nervous system","section":"bb","disc":"Physiology","parent":"digestive-system","hub":false,"summary":"The enteric nervous system is a mesh of at least 100 million neurons in the gut wall. The myenteric plexus controls motility such as peristalsis, and the submucosal plexus controls secretion and local blood flow. It can run complete reflexes on its own, while parasympathetic (vagal) input boosts motility and secretion and sympathetic input slows them. Peristalsis contracts muscle behind a bolus and relaxes it ahead.","trap":null},{"id":"oral-digestion","title":"Oral cavity digestion","section":"bb","disc":"Physiology","parent":"digestive-system","hub":false,"summary":"Chewing increases surface area, and saliva moistens food into a bolus and starts chemical digestion. Salivary amylase hydrolyzes α-1,4 glycosidic bonds in starch, and lingual lipase begins fat digestion. Gastric acid inactivates salivary amylase, so most starch is digested later by pancreatic amylase. Swallowing pushes the bolus into the esophagus, which moves it to the stomach by peristalsis.","trap":"No protein digestion happens in the mouth; protein breakdown begins in the stomach with pepsin."},{"id":"stomach","title":"Stomach (pepsin and HCl)","section":"bb","disc":"Physiology","parent":"digestive-system","hub":false,"summary":"The stomach stores food, churns it into chyme and starts protein digestion. Parietal cells secrete HCl (pH about 1–2) through an H⁺/K⁺ ATPase and secrete intrinsic factor for vitamin B₁₂ absorption; chief cells release pepsinogen, which acid converts to pepsin; G cells release gastrin, which stimulates acid secretion. Mucus and bicarbonate protect the lining. Little is absorbed here except alcohol and some drugs.","trap":"Pepsinogen is activated by stomach acid (then by pepsin itself), not by enteropeptidase, which activates trypsinogen in the duodenum."},{"id":"small-intestine","title":"Small intestine","section":"bb","disc":"Physiology","parent":"digestive-system","hub":false,"summary":"The duodenum, jejunum and ileum carry out most digestion and nearly all absorption, helped by folds, villi and microvilli. In the duodenum, acidic chyme triggers secretin (pancreatic bicarbonate) and fat and protein trigger CCK (enzymes and gallbladder contraction). Sugars and amino acids enter capillaries draining to the hepatic portal vein; fats leave in chylomicrons through lacteals. The ileum absorbs B₁₂ and bile salts.","trap":"Dietary fat enters lymphatic lacteals as chylomicrons and bypasses the hepatic portal vein that carries absorbed sugars and amino acids."},{"id":"brush-border","title":"Brush border enzymes","section":"bb","disc":"Physiology","parent":"small-intestine","hub":false,"summary":"Brush-border enzymes are anchored in the microvillus membrane and finish digestion at the absorptive surface. Disaccharidases (lactase, sucrase, maltase) split disaccharides into monosaccharides, and aminopeptidases and dipeptidases finish peptides. Duodenal enteropeptidase activates trypsinogen, setting off the pancreatic protease cascade. Lactase deficiency leaves lactose for colonic bacteria, causing gas and osmotic diarrhea.","trap":"Enteropeptidase is made by the duodenal lining, not the pancreas, yet it is the trigger that activates the pancreas's proteases."},{"id":"bile-salts","title":"Bile salts","section":"bb","disc":"Physiology","parent":"small-intestine","hub":false,"summary":"Bile salts are amphipathic derivatives of cholesterol made by the liver, stored in the gallbladder and released when CCK signals. They emulsify fat into tiny droplets and micelles, multiplying the surface area for pancreatic lipase and carrying fatty acids and monoglycerides to the enterocyte surface. They break no covalent bonds. About 95% are reabsorbed in the terminal ileum and returned to the liver (enterohepatic circulation).","trap":"Bile contains no digestive enzymes; it emulsifies fat physically, and pancreatic lipase performs the actual hydrolysis."},{"id":"pancreatic-juice","title":"Pancreatic juice","section":"bb","disc":"Physiology","parent":"small-intestine","hub":false,"summary":"Pancreatic acinar cells secrete enzymes for every macronutrient: pancreatic amylase, lipase with colipase, nucleases, and proteases released as inactive zymogens (trypsinogen, chymotrypsinogen, procarboxypeptidase). Duct cells add bicarbonate-rich fluid in response to secretin, neutralizing gastric acid to give the slightly basic pH these enzymes need. Secreting zymogens keeps the pancreas from digesting itself.","trap":null},{"id":"large-intestine","title":"Large intestine and microbiome","section":"bb","disc":"Physiology","parent":"digestive-system","hub":false,"summary":"The cecum, colon and rectum absorb much of the remaining water and electrolytes, compacting chyme into feces. The colon hosts trillions of bacteria that ferment undigested fiber into short-chain fatty acids, make vitamin K and some B vitamins such as biotin, and crowd out pathogens. Feces are held in the rectum until the defecation reflex; the internal anal sphincter is involuntary and the external sphincter is voluntary.","trap":"Most water is absorbed in the small intestine, not the colon: of roughly 9 L of fluid entering the gut each day, the colon reclaims only about 1–1.5 L."},{"id":"liver-gallbladder","title":"Liver and gallbladder","section":"bb","disc":"Physiology","parent":"digestive-system","hub":false,"summary":"The liver receives nutrient-rich blood from the hepatic portal vein and processes it before it reaches the rest of the body. It makes bile, stores glycogen, performs gluconeogenesis, synthesizes plasma proteins (albumin, clotting factors), converts ammonia to urea and detoxifies drugs, for example with cytochrome P450 enzymes. The gallbladder stores and concentrates bile and contracts under CCK to release it into the duodenum.","trap":"The gallbladder stores and concentrates bile but does not make it; the liver produces bile continuously."},{"id":"immune-system","title":"Immune system","section":"bb","disc":"Physiology","parent":null,"hub":true,"summary":"Immunity has two cooperating arms: innate defenses that are fast, broad and lack memory, and adaptive defenses that are slower, antigen-specific and remember. All immune cells arise from hematopoietic stem cells in bone marrow; B cells mature in the marrow and T cells in the thymus. Innate cells detect microbes and present antigen, adaptive lymphocytes make antibodies and kill infected cells, and lymph nodes and spleen are where the two meet.","trap":null},{"id":"innate-immunity","title":"Innate immunity","section":"bb","disc":"Physiology","parent":"immune-system","hub":false,"summary":"Innate immunity is present from birth and acts within minutes to hours, recognizing conserved microbial patterns through receptors such as Toll-like receptors. It includes barriers (skin, mucus, stomach acid, lysozyme), phagocytes, NK cells, complement, inflammation, fever and interferons. It does not improve with repeat exposure, but it activates and steers the adaptive response through antigen presentation and cytokines.","trap":"Innate responses have no memory, so they are the same on every exposure; the faster second response to a pathogen comes from adaptive memory cells."},{"id":"phagocytes","title":"Macrophages and neutrophils","section":"bb","disc":"Physiology","parent":"innate-immunity","hub":false,"summary":"Neutrophils are the most abundant white blood cells and the first to reach bacterial infections; they engulf microbes and die, forming pus. Monocytes leave the blood to become macrophages, long-lived phagocytes that clear pathogens and debris, release cytokines such as IL-1 and TNF-α, and present antigen on MHC II. Engulfed material is destroyed in phagolysosomes by enzymes and reactive oxygen species from the respiratory burst.","trap":null},{"id":"complement","title":"Complement system","section":"bb","disc":"Physiology","parent":"innate-immunity","hub":false,"summary":"Complement is a set of plasma proteins, mostly made by the liver, that activate in a cascade through the classical (antibody-triggered), alternative and lectin pathways. C3b coats microbes for phagocytosis (opsonization), C3a and C5a recruit inflammatory cells, and C5b–C9 form the membrane attack complex that punches pores in bacterial membranes. It links innate and adaptive immunity because antibodies can start it.","trap":null},{"id":"nk-cells","title":"Natural killer cells","section":"bb","disc":"Physiology","parent":"innate-immunity","hub":false,"summary":"Natural killer cells are innate lymphocytes that kill virus-infected and tumor cells without prior sensitization. Many such cells reduce surface MHC I to hide from cytotoxic T cells; NK cells detect this missing self and release perforin and granzymes to trigger apoptosis. They also kill antibody-coated cells through Fc receptors (antibody-dependent cell-mediated cytotoxicity) and secrete interferon-γ.","trap":null},{"id":"dendritic-cells","title":"Dendritic cells","section":"bb","disc":"Physiology","parent":"innate-immunity","hub":false,"summary":"Dendritic cells are the most effective antigen-presenting cells. In skin and mucosa they capture antigen, then travel through lymph to lymph nodes, where they display peptides on MHC II (and cross-present on MHC I) together with costimulatory signals. This is how naive T cells are first activated, which makes dendritic cells the main bridge from innate detection to adaptive immunity.","trap":null},{"id":"adaptive-immunity","title":"Adaptive immunity","section":"bb","disc":"Physiology","parent":"immune-system","hub":false,"summary":"Adaptive immunity relies on B and T lymphocytes, each with a unique receptor generated by random V(D)J recombination. It takes days on first exposure but leaves memory cells for faster, stronger later responses. Humoral immunity (B cells, antibodies) targets extracellular pathogens and toxins; cell-mediated immunity (T cells) targets infected and cancerous cells. Strongly self-reactive lymphocytes are removed during development.","trap":"Active immunity (infection or vaccine) creates memory, while passive immunity (maternal IgG, injected antibodies) protects at once but fades without memory."},{"id":"b-cells","title":"B cells and plasma cells","section":"bb","disc":"Physiology","parent":"adaptive-immunity","hub":false,"summary":"B cells mature in bone marrow and use membrane-bound antibody as their receptor, which binds intact, unprocessed antigen. With help from a helper T cell that recognizes the same antigen, an activated B cell proliferates and becomes antibody-secreting plasma cells and long-lived memory B cells. In germinal centers, class switching and somatic hypermutation yield higher-affinity IgG, IgA or IgE.","trap":null},{"id":"antibodies","title":"Antibodies","section":"bb","disc":"Physiology","parent":"b-cells","hub":false,"summary":"Antibodies are Y-shaped proteins of two heavy and two light chains joined by disulfide bonds. Variable regions at the Fab tips bind antigen; the constant Fc region sets class and effector function. They neutralize toxins and viruses, opsonize, agglutinate and activate complement. IgM appears first (pentamer), IgG is most abundant and crosses the placenta, IgA guards secretions and milk, IgE drives allergy and antiparasite defense.","trap":"Class switching changes the constant region and effector function but keeps the same variable region, so antigen specificity does not change."},{"id":"helper-t","title":"Helper T cells (CD4⁺)","section":"bb","disc":"Physiology","parent":"adaptive-immunity","hub":false,"summary":"CD4⁺ helper T cells recognize peptide antigen presented on MHC II by antigen-presenting cells. They do not kill targets themselves; instead they secrete cytokines that activate B cells (enabling class switching), cytotoxic T cells and macrophages. Th1 cells mainly support cell-mediated responses and Th2 cells support humoral and allergic responses. HIV infects CD4⁺ cells, and their loss in AIDS cripples both arms of adaptive immunity.","trap":"CD4 pairs with MHC II and CD8 with MHC I (4 × 2 = 8 × 1 = 8); swapping these pairings is a classic error."},{"id":"cytotoxic-t","title":"Cytotoxic T cells (CD8⁺)","section":"bb","disc":"Physiology","parent":"adaptive-immunity","hub":false,"summary":"CD8⁺ cytotoxic T cells recognize peptides on MHC I, which nearly every nucleated cell displays. When the T-cell receptor finds a foreign peptide, such as a viral or tumor antigen, the cell releases perforin and granzymes or engages Fas to make the target undergo apoptosis. Naive CD8⁺ cells need activation by an antigen-presenting cell, usually with helper T cell cytokines, and they leave memory cells behind.","trap":null},{"id":"mhc","title":"MHC I and MHC II","section":"bb","disc":"Physiology","parent":"adaptive-immunity","hub":false,"summary":"MHC proteins display peptide fragments for T cells to inspect. MHC I is on all nucleated cells and shows peptides from proteins made inside the cell (proteasome → ER) to CD8⁺ T cells. MHC II is on professional antigen-presenting cells (dendritic cells, macrophages, B cells) and shows peptides from engulfed material (endosome–lysosome) to CD4⁺ T cells. Human MHC genes (HLA) are very polymorphic, which matters for transplant matching.","trap":"The MHC class depends on where the protein came from (made in the cytosol → MHC I, engulfed from outside → MHC II), not on the type of pathogen."},{"id":"clonal-selection","title":"Clonal selection","section":"bb","disc":"Physiology","parent":"adaptive-immunity","hub":false,"summary":"Each lymphocyte carries a single receptor specificity, generated randomly before any antigen exposure. An antigen binds and activates only the rare matching clones, which proliferate (clonal expansion) and differentiate into effector and memory cells. Clones that react strongly to self are deleted during development, giving self-tolerance; failure of this process contributes to autoimmune disease.","trap":"Antigen does not instruct a lymphocyte to build a matching receptor; it selects pre-existing clones whose randomly generated receptors already fit."},{"id":"immune-responses","title":"Primary and secondary immune responses","section":"bb","disc":"Physiology","parent":"adaptive-immunity","hub":false,"summary":"On first exposure, the primary response has a lag of roughly a week, peaks after 1–2 weeks at a relatively low level and is dominated by IgM. Memory cells left behind make the secondary response faster (days), larger, longer-lasting and dominated by higher-affinity IgG. Vaccines exploit this by triggering a primary response with harmless antigen, and booster doses add further rounds of memory and affinity maturation.","trap":"The secondary response is faster because of expanded memory lymphocytes, not because antibodies from the first response are still circulating."},{"id":"reproductive-system","title":"Reproduction and development","section":"bb","disc":"Physiology","parent":null,"hub":true,"summary":"Reproduction joins two haploid gametes made by meiosis, restoring the diploid number at fertilization. Gamete production and the female cycle are run by the hypothalamic–pituitary–gonadal axis: GnRH drives FSH and LH, which drive the sex steroids that feed back. After fertilization, development proceeds through cleavage, implantation, gastrulation into three germ layers and neurulation, while the placenta handles maternal–fetal exchange and sustains pregnancy hormonally.","trap":null},{"id":"spermatogenesis","title":"Spermatogenesis","section":"bb","disc":"Physiology","parent":"reproductive-system","hub":false,"summary":"Spermatogenesis runs continuously from puberty in the seminiferous tubules. Spermatogonia (2n) divide by mitosis; primary spermatocytes complete meiosis I to form secondary spermatocytes (n), then meiosis II to form spermatids, which mature into spermatozoa. Each primary spermatocyte yields four sperm. FSH acts on Sertoli cells, which nurse developing sperm, and LH drives Leydig cells to make testosterone. Sperm gain motility in the epididymis.","trap":"FSH acts on Sertoli cells and LH on Leydig cells; reversing them is a frequent error."},{"id":"oogenesis","title":"Oogenesis","section":"bb","disc":"Physiology","parent":"reproductive-system","hub":false,"summary":"Oogonia enter meiosis before birth and arrest as primary oocytes in prophase I, so a female is born with her lifetime supply. Each cycle after puberty, one primary oocyte finishes meiosis I just before ovulation, giving a secondary oocyte and a first polar body; the secondary oocyte arrests in metaphase II and completes meiosis II only if fertilized. Unequal cytokinesis yields one large egg plus small polar bodies.","trap":"The cell released at ovulation is a secondary oocyte arrested in metaphase II, not a mature ovum; meiosis II finishes only at fertilization."},{"id":"ovarian-cycle","title":"Ovarian cycle","section":"bb","disc":"Physiology","parent":"reproductive-system","hub":false,"summary":"The roughly 28-day ovarian cycle has a follicular phase, ovulation and a luteal phase. FSH recruits follicles, and one dominant follicle grows and secretes rising estrogen. A mid-cycle LH surge triggers ovulation around day 14. The ruptured follicle becomes the corpus luteum, which secretes progesterone and estrogen and degenerates after about 14 days without pregnancy. The uterine cycle runs in parallel: menstrual, proliferative and secretory phases.","trap":"The luteal phase is fairly constant at about 14 days; differences in cycle length come mostly from the follicular phase."},{"id":"menstrual-hormones","title":"Menstrual cycle hormones","section":"bb","disc":"Physiology","parent":"ovarian-cycle","hub":false,"summary":"GnRH pulses drive pituitary FSH and LH, and ovarian estrogen and progesterone feed back on the hypothalamus and pituitary. Low or moderate estrogen gives negative feedback, but high, sustained estrogen late in the follicular phase switches to positive feedback and causes the LH surge. Estrogen thickens the endometrium; corpus luteum progesterone makes it secretory and receptive. Falling progesterone triggers menstruation.","trap":"The LH surge is caused by estrogen's switch to positive feedback, one of the few positive feedback loops in the endocrine system; progesterone does not trigger ovulation."},{"id":"fertilization","title":"Fertilization","section":"bb","disc":"Physiology","parent":"reproductive-system","hub":false,"summary":"Fertilization usually occurs in the ampulla of the uterine (fallopian) tube. Capacitated sperm undergo the acrosome reaction, releasing enzymes that help them penetrate the corona radiata and zona pellucida. Sperm–egg fusion triggers a Ca²⁺ wave that causes the cortical reaction, which alters the zona to block polyspermy, and lets the oocyte complete meiosis II. The two pronuclei then combine to form a diploid zygote.","trap":"Fertilization normally takes place in the uterine tube, not the uterus; the embryo reaches the uterus days later as a blastocyst."},{"id":"cleavage-implantation","title":"Cleavage and implantation","section":"bb","disc":"Physiology","parent":"reproductive-system","hub":false,"summary":"The zygote undergoes rapid mitotic cleavage divisions with no growth, becoming a morula (about 16 cells) and then a blastocyst. The blastocyst has an inner cell mass, which forms the embryo, and a trophoblast, which forms the chorion and fetal part of the placenta. It hatches from the zona pellucida around day 5 and begins implanting in the endometrium around days 6–7, when the trophoblast starts secreting hCG.","trap":"Cleavage increases cell number but not total embryo size, so each cell gets smaller and the nucleus-to-cytoplasm ratio rises."},{"id":"gastrulation","title":"Gastrulation","section":"bb","disc":"Physiology","parent":"reproductive-system","hub":false,"summary":"During gastrulation (week 3 in humans), cells migrate inward through the primitive streak to form three germ layers. Ectoderm forms epidermis, hair, nails and the nervous system; mesoderm forms muscle, bone, blood, heart, kidneys, gonads and connective tissue; endoderm forms the lining of the gut and airways plus the liver, pancreas and thyroid. Signals between cells (induction) and gene expression set each fate.","trap":"Organs often combine germ layers: the gut's epithelial lining is endoderm but its smooth muscle is mesoderm, and the adrenal medulla (neural crest, ectoderm) differs in origin from the adrenal cortex (mesoderm)."},{"id":"neurulation","title":"Neurulation","section":"bb","disc":"Physiology","parent":"gastrulation","hub":false,"summary":"The notochord (mesoderm) induces the overlying ectoderm to thicken into the neural plate, which folds into a groove and closes into the neural tube, the future brain and spinal cord. Neural crest cells leave the edges of the folds and migrate widely, forming peripheral neurons and ganglia, Schwann cells, melanocytes and adrenal medulla cells. Failed tube closure causes defects such as spina bifida, whose risk maternal folic acid lowers.","trap":"The notochord does not become the spinal cord; it is mesoderm that induces the ectoderm above it to form the neural tube."},{"id":"placenta","title":"Placenta","section":"bb","disc":"Physiology","parent":"reproductive-system","hub":false,"summary":"The placenta forms from the fetal chorion (trophoblast) and the maternal endometrium. Maternal and fetal blood normally do not mix: O₂, glucose, amino acids and maternal IgG cross to the fetus and CO₂ and urea cross back, with fetal hemoglobin's higher O₂ affinity aiding O₂ uptake. Its hCG, which pregnancy tests detect, keeps the corpus luteum alive early; the placenta then takes over progesterone and estrogen production during the first trimester, and human placental lactogen raises maternal insulin resistance.","trap":"Maternal and fetal blood do not normally mix; substances cross the placental barrier, which is why a fetus can have a different blood type and why Rh sensitization usually follows bleeding at delivery."},{"id":"hydrophobic-effect","title":"Hydrophobic effect","section":"cp","disc":"Gen Chem","parent":null,"hub":false,"summary":"Nonpolar groups cluster together in water because water must form ordered, cage-like hydrogen-bond networks around exposed nonpolar surfaces; clustering shrinks that surface and frees the ordered water. The gain in solvent entropy makes ΔG negative even when ΔH is near zero. It is a major driving force for protein folding and for micelle and lipid bilayer formation, and it helps keep DNA's stacked bases buried inside the helix.","trap":"It is not a special attraction between nonpolar groups; the main driving force is the entropy gained by the surrounding water."},{"id":"atomic-structure","title":"Atomic structure","section":"cp","disc":"Gen Chem","parent":null,"hub":true,"summary":"An atom has a small nucleus of protons (atomic number Z) and neutrons, with mass number A = protons + neutrons, surrounded by electrons in quantized energy levels. Isotopes differ only in neutron number, and the listed atomic weight is an abundance-weighted average. Electrons absorb or emit photons of exactly the level spacing (E = hf), and their arrangement, given by quantum numbers and filling rules, underlies periodic trends and bonding.","trap":null},{"id":"quantum-numbers","title":"Quantum numbers","section":"cp","disc":"Gen Chem","parent":"atomic-structure","hub":false,"summary":"Four numbers describe each electron: principal n (shell, size and energy; 1, 2, 3…), azimuthal l (subshell shape; 0 to n − 1, i.e. s, p, d, f), magnetic mℓ (orbital orientation; −l to +l) and spin mₛ (+½ or −½). A subshell holds 2(2l + 1) electrons and a shell holds 2n². By the Pauli exclusion principle, no two electrons in an atom share all four values.","trap":null},{"id":"electron-configuration","title":"Electron configuration (Pauli, Hund, Aufbau)","section":"cp","disc":"Gen Chem","parent":"atomic-structure","hub":false,"summary":"Aufbau: electrons fill subshells from lowest energy up, roughly by increasing n + l (so 4s fills before 3d). Pauli: an orbital holds at most two electrons, with opposite spins. Hund: electrons spread across a subshell's orbitals with parallel spins before pairing. Cr (4s¹3d⁵) and Cu (4s¹3d¹⁰) are exceptions favoring half-filled or filled d subshells, and atoms with unpaired electrons are paramagnetic.","trap":"Transition metals lose their 4s electrons before their 3d electrons when forming cations, so Fe²⁺ is [Ar]3d⁶, not [Ar]4s²3d⁴."},{"id":"periodic-trends","title":"Periodic trends","section":"cp","disc":"Gen Chem","parent":"atomic-structure","hub":false,"summary":"Most trends follow effective nuclear charge (Zeff) and the number of shells. Across a period Zeff rises while the shell stays the same, so radius shrinks and ionization energy, electronegativity and (generally) electron affinity increase. Down a group, added shells and shielding make atoms larger and these values smaller. The result: metals at lower left lose electrons easily, nonmetals at upper right attract them.","trap":null},{"id":"ionization-energy","title":"Ionization energy","section":"cp","disc":"Gen Chem","parent":"periodic-trends","hub":false,"summary":"The energy required to remove an electron from a gaseous atom or ion; it is always endothermic. First IE increases across a period and decreases down a group. Successive IEs rise, with a very large jump once a noble-gas core must be broken (e.g. Na's 2nd IE, Mg's 3rd). Small dips at group 13 (a new, higher-energy p subshell) and group 16 (the first paired p electron) break the smooth trend.","trap":"First ionization energy does not rise perfectly smoothly across a period: B is lower than Be and O is lower than N."},{"id":"electron-affinity","title":"Electron affinity","section":"cp","disc":"Gen Chem","parent":"periodic-trends","hub":false,"summary":"The energy change when a gaseous atom gains an electron. For most atoms the process releases energy, most strongly for halogens, whose added electron completes an octet (Cl's is slightly larger than F's). Noble gases, group 2 atoms and N have little or no affinity because the electron would enter a higher subshell or disturb a half-filled one. It generally becomes more favorable across a period and less favorable down a group.","trap":null},{"id":"electronegativity","title":"Electronegativity","section":"cp","disc":"Gen Chem","parent":"periodic-trends","hub":false,"summary":"The pull an atom exerts on shared electrons within a bond (Pauling scale). F is highest (4.0), then O (3.5), then Cl and N; it increases across a period and decreases down a group. The difference between two bonded atoms sets bond character. As a rough guide, a difference below about 0.5 is nonpolar covalent, about 0.5 to 1.7 polar covalent, and above about 1.7 mostly ionic; sources draw these lines slightly differently, and bond character is a continuum.","trap":"Electronegativity describes an atom inside a bond and is not the same as electron affinity, which is a measured energy change for an isolated gaseous atom."},{"id":"atomic-radius","title":"Atomic and ionic radius","section":"cp","disc":"Gen Chem","parent":"periodic-trends","hub":false,"summary":"Atomic radius decreases across a period as rising Zeff pulls the same shell inward, and increases down a group as shells are added. Cations are smaller than their parent atoms (fewer electrons, often a lost shell), and anions are larger (more electron repulsion, same nuclear charge). In an isoelectronic series such as O²⁻ > F⁻ > Na⁺ > Mg²⁺, more protons means a smaller ion.","trap":"Adding protons and electrons across a period makes atoms smaller, not larger, because the new electrons enter the same shell and feel a stronger Zeff."},{"id":"bonding","title":"Bonding and intermolecular forces","section":"cp","disc":"Gen Chem","parent":null,"hub":true,"summary":"Atoms bond to reach lower energy, usually a filled valence shell. The electronegativity difference sorts bonds into ionic, polar covalent and nonpolar covalent, and molecular geometry from VSEPR combines with bond polarity to set molecular polarity. Intermolecular forces, much weaker than bonds, then govern boiling point, solubility and the folding and assembly of proteins, membranes and nucleic acids.","trap":"Boiling or melting a molecular substance overcomes intermolecular forces; it does not break the covalent bonds within each molecule."},{"id":"ionic-bonds","title":"Ionic bonds","section":"cp","disc":"Gen Chem","parent":"bonding","hub":false,"summary":"Electrons transfer from a low-electronegativity metal to a high-electronegativity nonmetal, and the resulting ions are held by electrostatic attraction (Coulomb's law, F ∝ q₁q₂/r²). Ionic solids form lattices that are hard, brittle and high-melting, and conduct electricity only when molten or dissolved. Lattice energy rises with higher ion charge and smaller ion size, so MgO is held far more tightly than NaCl.","trap":null},{"id":"covalent-bonds","title":"Covalent bonds","section":"cp","disc":"Gen Chem","parent":"bonding","hub":false,"summary":"Atoms share electron pairs. A single bond is one σ bond; a double bond adds one π bond and a triple bond adds two. More shared pairs make bonds shorter and stronger (C≡C < C=C < C–C in length). Formal charge (valence electrons − nonbonding electrons − ½ bonding electrons) and resonance help choose the best Lewis structure, and unequal sharing between atoms of different electronegativity makes a bond polar.","trap":null},{"id":"coordinate-covalent","title":"Coordinate covalent bonds","section":"cp","disc":"Gen Chem","parent":"covalent-bonds","hub":false,"summary":"A covalent bond in which one atom supplies both shared electrons, as when a Lewis base donates a lone pair to a Lewis acid. Once formed it behaves like any other covalent bond: all four N–H bonds in NH₄⁺ are identical. Metal ions bind ligands this way, so Fe²⁺ in heme is coordinated by porphyrin nitrogens, a histidine and O₂, and Zn²⁺ is held by histidines in carbonic anhydrase.","trap":null},{"id":"polarity","title":"Bond and molecular polarity","section":"cp","disc":"Gen Chem","parent":"bonding","hub":false,"summary":"Unequal sharing between atoms of different electronegativity gives a bond dipole with partial charges δ⁺ and δ⁻. A molecule is polar only if its bond dipoles do not cancel, which depends on geometry: CO₂ and CCl₄ are nonpolar despite polar bonds, while H₂O and NH₃ are polar. Polarity governs 'like dissolves like', boiling points, and whether a molecule can cross a lipid bilayer unaided.","trap":"Polar bonds do not guarantee a polar molecule; in symmetric shapes the bond dipoles cancel."},{"id":"vsepr","title":"VSEPR and molecular geometry","section":"cp","disc":"Gen Chem","parent":"bonding","hub":false,"summary":"Electron groups (bonds and lone pairs) around a central atom spread out to minimize repulsion: 2 groups linear (180°), 3 trigonal planar (120°), 4 tetrahedral (109.5°), 5 trigonal bipyramidal, 6 octahedral. Lone pairs repel more than bonding pairs and squeeze bond angles, so NH₃ is trigonal pyramidal (~107°) and H₂O bent (~104.5°). Two, three and four groups correspond to sp, sp² and sp³ hybridization.","trap":"Electron-group geometry counts lone pairs but molecular shape names only atom positions, so H₂O has tetrahedral electron geometry yet a bent shape."},{"id":"imf","title":"Intermolecular forces","section":"cp","disc":"Gen Chem","parent":"bonding","hub":false,"summary":"Attractions between molecules (or distant parts of one molecule), all electrostatic and all far weaker than covalent bonds. Typical order of strength: ion–dipole > hydrogen bonding > dipole–dipole > London dispersion, although dispersion can dominate in large molecules. Stronger IMFs raise boiling point, viscosity and surface tension and lower vapor pressure, and they hold together folded proteins, membranes and the DNA helix.","trap":"Dispersion forces act in every molecule, polar ones included, and in large molecules they can outweigh dipole–dipole forces."},{"id":"dipole-dipole","title":"Dipole–dipole forces","section":"cp","disc":"Gen Chem","parent":"imf","hub":false,"summary":"Molecules with permanent dipoles align so the δ⁺ end of one faces the δ⁻ end of another. For molecules of similar size these forces outweigh dispersion alone, so acetone (bp 56 °C) boils far above butane (bp about −1 °C) at nearly the same molar mass. They explain why polar solutes dissolve in polar solvents and why aldehydes and ketones boil above alkanes but below alcohols.","trap":null},{"id":"hbonds","title":"Hydrogen bonding","section":"cp","disc":"Gen Chem","parent":"imf","hub":false,"summary":"A strong dipole–dipole attraction between an H covalently bonded to N, O or F and a lone pair on another N, O or F. It is the strongest attraction between neutral molecules (ion–dipole forces are stronger) but still much weaker than a covalent bond. Hydrogen bonding explains water's high boiling point, heat capacity and surface tension, ice being less dense than liquid water, Watson–Crick base pairing, and the helices and sheets of protein secondary structure.","trap":"A hydrogen bond is a noncovalent attraction between molecules (or distant parts of one molecule), not the covalent O–H bond itself; H bonded to carbon is not treated as a hydrogen-bond donor."},{"id":"london-dispersion","title":"London dispersion forces","section":"cp","disc":"Gen Chem","parent":"imf","hub":false,"summary":"Momentary uneven electron distribution creates a temporary dipole that induces dipoles in neighbors. These forces act between all molecules and are the only IMF in nonpolar substances such as noble gases, halogens and hydrocarbons. They grow with polarizability, size and contact area: boiling points rise down the halogens, longer alkanes boil higher, and saturated lipid tails pack more tightly than kinked unsaturated ones.","trap":null},{"id":"stoichiometry","title":"Stoichiometry","section":"cp","disc":"Gen Chem","parent":null,"hub":true,"summary":"The quantitative bookkeeping of reactions using the mole (6.022 × 10²³ particles) and molar mass. Balanced equations give mole ratios that convert between reactants and products, which lets you find limiting reagents, theoretical and percent yield, empirical and molecular formulas, and concentrations (molarity = mol solute / L solution). Equivalents extend the same counting to acid–base and redox reactions.","trap":null},{"id":"balancing-reactions","title":"Balancing redox and acid–base reactions","section":"cp","disc":"Gen Chem","parent":"stoichiometry","hub":false,"summary":"A balanced equation conserves both atoms and charge. For redox, assign oxidation numbers, split into oxidation and reduction half-reactions, balance atoms other than O and H, then O with H₂O, H with H⁺ (in base, add OH⁻ to both sides), and charge with electrons, scaling so electrons lost equal electrons gained. In neutralization, equivalents of H⁺ must equal equivalents of OH⁻, so 1 mol H₂SO₄ needs 2 mol NaOH.","trap":"The species that is oxidized is the reducing agent, and the species that is reduced is the oxidizing agent."},{"id":"limiting-reagent","title":"Limiting reagent and percent yield","section":"cp","disc":"Gen Chem","parent":"stoichiometry","hub":false,"summary":"The limiting reagent is the reactant used up first, and it alone sets the theoretical yield. To find it, divide each reactant's moles by its coefficient; the smallest value limits. Percent yield = actual yield ÷ theoretical yield × 100. The excess reagent left over equals the amount supplied minus the amount the limiting reagent consumed.","trap":null},{"id":"equilibrium","title":"Chemical equilibrium","section":"cp","disc":"Gen Chem","parent":null,"hub":true,"summary":"At equilibrium the forward and reverse rates are equal, so concentrations stay constant while both reactions continue. Keq describes where the balance lies, comparing Q with K predicts which way a mixture will move, and Le Chatelier's principle predicts the response to a stress. Equilibrium connects to thermodynamics through ΔG° = −RT ln K and governs solubility, acid–base dissociation, ligand binding and O₂ loading on hemoglobin.","trap":"Equilibrium means equal forward and reverse rates, not equal concentrations of reactants and products."},{"id":"keq","title":"Law of mass action and Keq","section":"cp","disc":"Gen Chem","parent":"equilibrium","hub":false,"summary":"For aA + bB ⇌ cC + dD, K = [C]ᶜ[D]ᵈ / [A]ᵃ[B]ᵇ, omitting pure solids and liquids (including solvent water). K > 1 favors products and K < 1 reactants. The reaction quotient Q has the same form with current values: Q < K runs forward, Q > K runs in reverse. Reversing a reaction inverts K, multiplying coefficients by n raises K to the nth power, and only temperature changes K.","trap":null},{"id":"le-chatelier","title":"Le Chatelier's principle","section":"cp","disc":"Gen Chem","parent":"equilibrium","hub":false,"summary":"A system at equilibrium that is disturbed shifts to partly offset the disturbance. Adding a species shifts the reaction away from it and removing one shifts toward it; compressing a gas mixture favors the side with fewer gas moles; heating favors the endothermic direction. Adding an inert gas at constant volume or adding a catalyst causes no shift. Cells exploit this by removing products to pull reactions forward.","trap":"Temperature is the only stress that changes K itself; concentration and pressure changes move Q away from K, and the system shifts to restore the same K."},{"id":"ksp","title":"Solubility product (Ksp)","section":"cp","disc":"Gen Chem","parent":"equilibrium","hub":false,"summary":"For a sparingly soluble salt MₐXᵦ(s) ⇌ aMᵇ⁺ + bXᵃ⁻, Ksp = [Mᵇ⁺]ᵃ[Xᵃ⁻]ᵇ at saturation, with the solid omitted. Molar solubility s follows from stoichiometry: Ksp = s² for an AB salt and 4s³ for AB₂. Comparing the ion product Q to Ksp predicts precipitation: Q > Ksp means a precipitate forms, Q < Ksp means more solid can dissolve.","trap":"A smaller Ksp does not always mean lower molar solubility when salts have different ion ratios; convert each Ksp to s before comparing."},{"id":"common-ion","title":"Common-ion effect","section":"cp","disc":"Gen Chem","parent":"ksp","hub":false,"summary":"Adding an ion already present in a solubility or dissociation equilibrium shifts it back toward the undissociated form, as Le Chatelier predicts. AgCl dissolves less in NaCl solution than in pure water, although Ksp is unchanged. In the same way, adding acetate suppresses the ionization of acetic acid and raises the pH, which is the basis of how a buffer's two components coexist.","trap":null},{"id":"thermodynamics","title":"Thermodynamics","section":"cp","disc":"Gen Chem","parent":null,"hub":true,"summary":"Thermodynamics predicts whether a process can occur and what energy it exchanges, not how fast it happens. State functions (U, H, S, G) depend only on initial and final states, unlike heat and work. The first law conserves energy (ΔU = q + w, with w the work done on the system); the second requires the entropy of the universe to rise in any spontaneous process; ΔG = ΔH − TΔS combines both at constant T and P.","trap":"A thermodynamically favorable reaction can still be extremely slow; spontaneity says nothing about rate."},{"id":"enthalpy","title":"Enthalpy","section":"cp","disc":"Gen Chem","parent":"thermodynamics","hub":false,"summary":"ΔH is the heat exchanged at constant pressure. Negative ΔH is exothermic (bonds formed release more energy than bonds broken absorb); positive ΔH is endothermic. It can be found from heats of formation (ΔH°rxn = ΣΔH°f products − ΣΔH°f reactants), Hess's law, bond energies or calorimetry (q = mcΔT). Phase changes carry enthalpy too, such as the heat absorbed when sweat evaporates.","trap":"Exothermic does not mean spontaneous; an endothermic process can be spontaneous if TΔS is large enough."},{"id":"entropy","title":"Entropy","section":"cp","disc":"Gen Chem","parent":"thermodynamics","hub":false,"summary":"Entropy (S) measures how widely energy and matter are dispersed among available microstates. It increases from solid to liquid to gas, with more moles of gas, with mixing and dissolving, and with temperature. Spontaneous processes raise the entropy of the universe; because ΔSsurr = −ΔHsys/T, releasing heat raises the surroundings' entropy. Solvent entropy can dominate, as in the hydrophobic effect.","trap":"A process can lower the system's entropy and still be spontaneous if the surroundings gain more, as when water freezes below 0 °C."},{"id":"gibbs","title":"Gibbs free energy","section":"cp","disc":"Gen Chem","parent":"thermodynamics","hub":false,"summary":"ΔG = ΔH − TΔS at constant T and P: ΔG < 0 is spontaneous (exergonic), ΔG > 0 nonspontaneous, ΔG = 0 at equilibrium. When ΔH and ΔS share a sign, temperature decides, with the crossover at T = ΔH/ΔS. ΔG = ΔG° + RT ln Q and ΔG° = −RT ln K tie free energy to equilibrium, so cells drive unfavorable steps by coupling them to ATP hydrolysis or by keeping Q low.","trap":"A positive ΔG° does not mean a reaction cannot occur in a cell; the actual ΔG depends on concentrations through RT ln Q."},{"id":"standard-state","title":"Standard state conditions","section":"cp","disc":"Gen Chem","parent":"thermodynamics","hub":false,"summary":"Standard conditions (marked °) mean 1 M for solutes, 1 atm (or 1 bar) for gases, pure solids and liquids, at a stated temperature, usually 25 °C (298 K). Elements in their most stable form have ΔH°f = 0. Biochemistry uses ΔG°′ and E°′, which also fix pH at 7 instead of 1 M H⁺. STP for gas calculations is different: 0 °C (273 K) and 1 atm, where 1 mol of ideal gas occupies 22.4 L.","trap":"Standard state (usually 25 °C) and STP (0 °C) are different; using 22.4 L/mol for a gas at 25 °C is an error."},{"id":"hess-law","title":"Hess's law","section":"cp","disc":"Gen Chem","parent":"enthalpy","hub":false,"summary":"Because enthalpy is a state function, ΔH for an overall reaction equals the sum of ΔH values for any set of steps that add up to it. Reversing a step flips the sign of its ΔH, and multiplying a step by n multiplies its ΔH by n. The same additivity applies to ΔG and ΔS, which is how cells couple a favorable reaction to an unfavorable one.","trap":null},{"id":"bond-energies","title":"Bond dissociation energies","section":"cp","disc":"Gen Chem","parent":"enthalpy","hub":false,"summary":"Bond dissociation energy is the energy needed to break one mole of a given bond homolytically in the gas phase, so it is always positive. Breaking bonds absorbs energy and forming bonds releases it, giving ΔH°rxn ≈ Σ(bonds broken) − Σ(bonds formed). Higher bond order means a shorter, stronger bond. Tabulated values are averages, so this method gives only an estimate.","trap":"ATP does not release energy by breaking a 'high-energy bond'; breaking any bond costs energy, and the release comes from forming more stable, better-solvated products."},{"id":"kinetics","title":"Chemical kinetics","section":"cp","disc":"Gen Chem","parent":null,"hub":true,"summary":"Kinetics describes how fast reactions go and by what mechanism. Rate depends on concentrations (the rate law), temperature and activation energy (Arrhenius), and catalysts, which provide a lower-Ea pathway. In a multistep mechanism the slowest step limits the overall rate. Kinetics is separate from thermodynamics: a catalyst speeds forward and reverse reactions equally, changing neither ΔG nor K.","trap":null},{"id":"rate-laws","title":"Rate laws","section":"cp","disc":"Gen Chem","parent":"kinetics","hub":false,"summary":"Rate = k[A]ˣ[B]ʸ, where the orders x and y are found by experiment, typically by comparing initial rates when one concentration is changed. For an elementary step the orders equal the coefficients; for a multistep mechanism the rate law reflects the slow step and anything before it. The rate constant k changes with temperature and catalysts but not with concentration, and its units depend on overall order.","trap":"Rate-law exponents come from experiment or the mechanism's slow step, not from the coefficients of the overall balanced equation."},{"id":"reaction-order","title":"Reaction order","section":"cp","disc":"Gen Chem","parent":"rate-laws","hub":false,"summary":"Zero order: rate is constant and [A] falls linearly, as with ethanol elimination once alcohol dehydrogenase is saturated. First order: rate ∝ [A], ln[A] vs. time is linear, and half-life t½ = 0.693/k is constant, as in radioactive decay and most drug elimination. Second order: 1/[A] vs. time is linear. Enzymes act first order in substrate at low [S] and zero order at saturating [S].","trap":"Only first-order processes have a constant half-life; for zero- and second-order reactions the half-life depends on concentration."},{"id":"arrhenius","title":"Arrhenius equation","section":"cp","disc":"Gen Chem","parent":"kinetics","hub":false,"summary":"k = A·e^(−Ea/RT): the rate constant rises exponentially as temperature rises or activation energy falls. The frequency factor A reflects collision frequency and orientation. Plotting ln k against 1/T gives a line with slope −Ea/R. A common rule of thumb is that many reactions near room temperature roughly double in rate for each 10 °C rise; the actual factor depends on Ea.","trap":null},{"id":"activation-energy","title":"Activation energy","section":"cp","disc":"Gen Chem","parent":"kinetics","hub":false,"summary":"Ea is the energy barrier from reactants up to the transition state on a reaction coordinate diagram. It sets the rate through the Arrhenius equation and is independent of ΔG, the difference between reactants and products. For an exothermic reaction the reverse barrier is larger than the forward one by |ΔH|. Catalysts lower the barrier for both directions by the same amount.","trap":null},{"id":"collision-theory","title":"Collision theory","section":"cp","disc":"Gen Chem","parent":"kinetics","hub":false,"summary":"A reaction requires molecules to collide with at least the activation energy and in the correct orientation. Rate is proportional to collision frequency × fraction of collisions with enough energy × an orientation (steric) factor. Higher concentration raises collision frequency, while higher temperature raises frequency slightly and the fraction of sufficiently energetic collisions greatly.","trap":null},{"id":"transition-state","title":"Transition state theory","section":"cp","disc":"Gen Chem","parent":"kinetics","hub":false,"summary":"Reactants pass through a high-energy activated complex at the peak of the reaction coordinate, with bonds partly formed and partly broken. It lasts about one molecular vibration and cannot be isolated, unlike an intermediate, which sits in a local energy minimum. Enzymes bind the transition state more tightly than the substrate, which is why transition-state analogs are potent inhibitors.","trap":"A transition state is not an intermediate: intermediates sit in energy wells and can sometimes be detected, while transition states sit at energy peaks."},{"id":"catalysts","title":"Catalysts","section":"cp","disc":"Gen Chem","parent":"kinetics","hub":false,"summary":"A catalyst offers an alternative pathway with lower activation energy and is regenerated unchanged. It speeds forward and reverse reactions equally, so equilibrium is reached faster, but ΔH, ΔG, K and the final yield are unchanged. Homogeneous catalysts share the reactants' phase and heterogeneous ones do not (e.g. metal surfaces). Enzymes are protein catalysts with high specificity and regulation.","trap":"Catalysts do not shift equilibrium or increase yield; they only shorten the time needed to reach equilibrium."},{"id":"electrochemistry","title":"Electrochemistry","section":"cp","disc":"Gen Chem","parent":null,"hub":true,"summary":"Electrochemistry links redox reactions to electrical energy. In every cell oxidation occurs at the anode and reduction at the cathode, and electrons flow through the wire from anode to cathode. Galvanic cells (E°cell > 0, ΔG < 0) produce current, while electrolytic cells (E°cell < 0, ΔG > 0) consume it. Reduction potentials, ΔG° = −nFE° and the Nernst equation quantify cells and also describe electron transport and membrane potentials.","trap":"Oxidation is always at the anode and reduction always at the cathode; only the electrodes' charge signs swap between galvanic and electrolytic cells."},{"id":"galvanic-cells","title":"Galvanic cells","section":"cp","disc":"Gen Chem","parent":"electrochemistry","hub":false,"summary":"A galvanic (voltaic) cell uses a spontaneous redox reaction (E°cell > 0, ΔG < 0) to generate current. The anode, where oxidation occurs, is the negative electrode; the cathode, where reduction occurs, is positive. A salt bridge keeps each half-cell neutral: anions drift toward the anode compartment and cations toward the cathode compartment. Cell notation reads anode | anode solution || cathode solution | cathode.","trap":null},{"id":"electrolytic-cells","title":"Electrolytic cells","section":"cp","disc":"Gen Chem","parent":"electrochemistry","hub":false,"summary":"An electrolytic cell uses an external power source to drive a nonspontaneous redox reaction (E°cell < 0, ΔG > 0). Oxidation still occurs at the anode, which is now positive, and reduction at the cathode, which is now negative. Uses include electrolysis of water or molten NaCl, electroplating and recharging a battery. The amount of product formed depends on the charge passed (Faraday's laws).","trap":null},{"id":"reduction-potentials","title":"Reduction potentials and E°cell","section":"cp","disc":"Gen Chem","parent":"electrochemistry","hub":false,"summary":"E°red measures how readily a species gains electrons, relative to the standard hydrogen electrode (0 V). A more positive E°red means a stronger oxidizing agent. E°cell = E°cathode − E°anode, using reduction potentials for both; a positive value means the reaction is spontaneous under standard conditions. In the electron transport chain electrons pass from NADH (E°′ ≈ −0.32 V) toward O₂ (E°′ ≈ +0.82 V).","trap":"E° values are intensive, so they are not multiplied when a half-reaction is scaled to balance electrons."},{"id":"nernst","title":"Nernst equation","section":"cp","disc":"Gen Chem","parent":"electrochemistry","hub":false,"summary":"E = E° − (RT/nF) ln Q, or E = E° − (0.0592/n) log Q at 25 °C. As a cell runs, Q rises toward K and E falls, reaching 0 at equilibrium (a dead battery). A concentration cell has E° = 0 and runs only on a concentration difference. Applied to one ion across a membrane at 37 °C, E ≈ (61.5 mV/z) log([out]/[in]) gives its equilibrium potential: about −90 mV for K⁺ and roughly +55 to +60 mV for Na⁺ in typical neurons.","trap":"At equilibrium the cell potential E is zero, not E°; E° is a fixed standard-state value."},{"id":"dg-nfe","title":"ΔG° = −nFE°","section":"cp","disc":"Gen Chem","parent":"electrochemistry","hub":false,"summary":"ΔG° = −nFE°cell, where n is moles of electrons transferred and F ≈ 96,485 C per mole of electrons. A positive E° gives a negative ΔG° and a spontaneous reaction, and combining with ΔG° = −RT ln K shows that E° > 0 corresponds to K > 1. For NADH → O₂ (ΔE°′ ≈ 1.14 V, n = 2), ΔG°′ ≈ −220 kJ/mol, the energy the electron transport chain uses to pump protons.","trap":null},{"id":"faraday","title":"Faraday's laws of electrolysis","section":"cp","disc":"Gen Chem","parent":"electrolytic-cells","hub":false,"summary":"The amount of substance produced or consumed at an electrode is proportional to the charge passed. Charge q = I·t; moles of electrons = q/F (F ≈ 96,485 C/mol); moles of product = moles of electrons ÷ electrons needed per particle (e.g. 2 for Cu²⁺ → Cu). Multiply by molar mass to get grams.","trap":null},{"id":"acid-base","title":"Acids and bases
