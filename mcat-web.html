<title>MCAT Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app. Header with search and filters above a graph canvas;
   a detail panel sits to the right on desktop and slides under the canvas on phones. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #132031;
  --muted: #566677;
  --line: #d6dde5;
  --soft: #eaf0fa;
  --accent: #2354d4;
  --accent-ink: #ffffff;
  --bb: #17936a;
  --cp: #cf7a1f;
  --ps: #8556cc;
  --edge: #8795a5;
  --trap-bg: #fff3dc;
  --trap-ink: #5e3b00;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1218;
    --surface: #151c25;
    --ink: #e5ecf3;
    --muted: #93a2b2;
    --line: #27313c;
    --soft: #1b2736;
    --accent: #7ba6ff;
    --accent-ink: #0d1218;
    --bb: #3fc590;
    --cp: #f2a54c;
    --ps: #b995f2;
    --edge: #5d6c7c;
    --trap-bg: #2a2112;
    --trap-ink: #f1c982;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1218;
  --surface: #151c25;
  --ink: #e5ecf3;
  --muted: #93a2b2;
  --line: #27313c;
  --soft: #1b2736;
  --accent: #7ba6ff;
  --accent-ink: #0d1218;
  --bb: #3fc590;
  --cp: #f2a54c;
  --ps: #b995f2;
  --edge: #5d6c7c;
  --trap-bg: #2a2112;
  --trap-ink: #f1c982;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  padding-inline: 16px;
  padding-block: 12px;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--font-body);
  overflow-x: hidden;
}
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; min-width: 0; }

/* Header */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; min-width: 0; }
.brand { font: 700 21px/1 var(--font-display); letter-spacing: -0.015em; white-space: nowrap; }
.brand small { display: block; margin-top: 5px; font: 400 11px/1 var(--font-mono); color: var(--muted); letter-spacing: 0; }
.search { position: relative; flex: 1 1 260px; max-width: 480px; min-width: 0; }
.search input {
  width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); outline-offset: 0;
}
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.results {
  position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(10, 20, 35, 0.18); max-height: 60vh; overflow: auto;
}
.results li { display: flex; align-items: baseline; gap: 8px; padding: 7px 10px; border-radius: 6px; cursor: pointer; min-width: 0; }
.results li[aria-selected="true"], .results li:hover { background: var(--soft); }
.results .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .t small { font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-left: 6px; }
.results .d { margin-left: auto; font: 400 11px var(--font-mono); color: var(--muted); white-space: nowrap; flex: none; }
.results .none { color: var(--muted); cursor: default; }
.dot { flex: none; width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.bb { background: var(--bb); } .dot.cp { background: var(--cp); } .dot.ps { background: var(--ps); }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="false"] { color: var(--muted); background: transparent; border-style: dashed; }
.chip[aria-pressed="false"] .dot { opacity: 0.35; }
.chip.menu { border-color: transparent; background: var(--soft); }
.chip.menu[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); }
.chip.menu .n { font: 500 11px var(--font-mono); opacity: 0.8; }
.subrow { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; min-width: 0; }
.subrow .chip { font: 400 12px var(--font-mono); padding: 4px 10px; }
.subrow .chip .dot { width: 7px; height: 7px; }

/* Stage */
.stage {
  display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
.canvas { position: relative; min-width: 0; min-height: 0; }
#cy { position: absolute; inset: 0; }
.tools { position: absolute; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 8px; z-index: 5; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg span { padding: 5px 9px; font: 400 11px/1.6 var(--font-mono); color: var(--muted); align-self: center; }
.seg button { border: 0; border-left: 1px solid var(--line); background: transparent; padding: 5px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
.btn:hover { background: var(--soft); }
.hint {
  position: absolute; left: 12px; bottom: 12px; z-index: 5; max-width: calc(100% - 24px); padding: 6px 11px;
  border-radius: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 12px;
}

/* Panel */
.panel { min-width: 0; overflow: auto; border-left: 1px solid var(--line); padding: 18px 18px 22px; overscroll-behavior: contain; }
.eyebrow { display: flex; align-items: center; gap: 8px; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); min-width: 0; }
.eyebrow .tag { padding: 1px 6px; border-radius: 4px; background: var(--soft); color: var(--ink); }
.crumbs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 4px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.crumbs button { border: 0; background: transparent; padding: 1px 4px; margin: 0 -4px; border-radius: 4px; cursor: pointer; color: var(--accent); }
.crumbs button:hover { background: var(--soft); }
.crumbs .sep { color: var(--line); padding: 0 2px; }
.panel h2 { margin: 6px 0 8px; font: 700 24px/1.15 var(--font-display); letter-spacing: -0.015em; text-wrap: balance; overflow-wrap: anywhere; }
.panel h3 { margin: 22px 0 8px; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.panel h3 .n { color: var(--ink); opacity: 0.6; }
.panel p { margin: 0; }
.summary { max-width: 62ch; }
.summary + .summary { margin-top: 8px; }
.trap { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--trap-bg); color: var(--trap-ink); font-size: 13px; }
.trap b { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 2px; }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.links li { border-radius: 8px; }
.links button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.links button:hover { background: var(--soft); }
.links .rel { font: 400 12px var(--font-mono); color: var(--muted); }
.links strong { font-weight: 600; }
.links .why { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
.pathbox { display: flex; gap: 6px; }
.pathbox input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.pathbox .btn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.steps { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.steps li { padding-left: 12px; border-left: 3px solid var(--accent); }
.steps .why { display: block; color: var(--muted); font-size: 13px; }
.starts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.starts .chip { white-space: normal; text-align: left; }
.subs .chip { padding: 4px 10px; font-size: 13px; }
.legend { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.legend li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 8px; align-items: baseline; }
.legend code { font: 400 12px var(--font-mono); color: var(--accent); }
.legend span { color: var(--muted); font-size: 13px; }
.keys { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.keys li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; font-size: 13px; }
.keys .muted { color: var(--muted); }
.sym { justify-self: center; border-radius: 50%; }
.sym.hub { width: 20px; height: 20px; background: var(--bb); border: 2px solid var(--surface); box-shadow: 0 0 0 2px var(--bb); }
.sym.con { width: 9px; height: 9px; background: var(--bb); }
.secs { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.secs span { display: inline-flex; align-items: center; gap: 6px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.close { border: 0; background: var(--soft); border-radius: 8px; padding: 4px 10px; cursor: pointer; flex: none; }
.stats { font: 400 12px var(--font-mono); color: var(--muted); margin-top: 18px; }

@media (max-width: 820px) {
  body { padding-inline: 12px; padding-block: 10px; }
  .app { gap: 10px; }
  .bar { gap: 8px 12px; }
  .search { flex-basis: 100%; max-width: none; order: 3; }
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .panel { border-left: 0; border-top: 1px solid var(--line); max-height: 48vh; padding: 14px 16px 18px; }
  .stage.empty .panel { display: none; }
  .filters { flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 2px; order: 4; scrollbar-width: none; }
  .subrow { flex-wrap: nowrap; overflow-x: auto; order: 5; scrollbar-width: none; }
  .hint { display: none; }
  .brand { font-size: 19px; display: flex; align-items: baseline; gap: 10px; }
  .brand small { margin-top: 0; }
  .tools { left: 8px; top: 8px; gap: 6px; }
  .tools .btn, .seg button { padding: 4px 9px; }
  .panel h2 { font-size: 21px; }
}
@media (min-width: 821px) { .close.mobile-only { display: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand">MCAT Nexus<small id="counts"></small></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search concepts  ( / )" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" aria-label="Search concepts">
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
    <div class="filters" id="filters"></div>
    <div class="subrow" id="catrow" hidden></div>
    <div class="subrow" id="relrow" hidden></div>
  </header>

  <main class="stage empty" id="stage">
    <div class="canvas">
      <div id="cy" aria-label="Interactive concept map"></div>
      <div class="tools">
        <div class="seg" role="group" aria-label="Neighborhood depth"><span>Depth</span>
          <button type="button" data-hops="1" aria-pressed="true">1</button>
          <button type="button" data-hops="2" aria-pressed="false">2</button>
          <button type="button" data-hops="3" aria-pressed="false">3</button>
        </div>
        <button type="button" class="btn" id="fit">Fit all</button>
        <button type="button" class="btn" id="reset">Clear focus</button>
      </div>
      <div class="hint" id="hint">Click a concept to focus it. Scroll to zoom, drag to pan.</div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>
<datalist id="nodelist"></datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script>
(function () {
  "use strict";
  var DATA = {"nodes":[{"id":"amino-acids","title":"Amino acid structure","section":"bb","disc":"Amino Acids & Proteins","parent":null,"hub":true,"summary":"Each of the 20 standard amino acids has an α-carbon carrying an amino group (part of a ring in proline), a carboxyl group, a hydrogen and a variable R group. The backbone groups ionize, so charge depends on pH (zwitterions, pI), and every α-carbon except glycine's is a stereocenter, L in proteins. The R group gives each residue its chemistry, and joining one residue's carboxyl to the next one's amino group builds the peptide chain.","trap":null},{"id":"aa-configuration","title":"L/D and R/S configuration of amino acids","section":"bb","disc":"Amino Acids & Proteins","parent":"amino-acids","hub":false,"summary":"Proteins use L-amino acids. In a Fischer projection with COOH at the top and R at the bottom, the L form has its amino group on the left. Most L-amino acids are S by CIP rules, but L-cysteine is R because its sulfur-containing CH₂SH outranks COOH. Glycine has no stereocenter. Ribosomes do not use D-amino acids, though they occur elsewhere, notably in bacterial cell walls.","trap":"L/D is a relative label based on the Fischer projection, not the sign of optical rotation, and it does not map one-to-one onto S/R."},{"id":"zwitterion","title":"Zwitterions","section":"bb","disc":"Amino Acids & Proteins","parent":"amino-acids","hub":false,"summary":"A zwitterion has a positive and a negative charge on one molecule with no net charge. Near pH 7 an amino acid's α-carboxyl (pKa ≈ 2) is COO⁻ and its α-amino group (pKa ≈ 9–10) is NH₃⁺. Below pKa1 the cationic form dominates, above pKa2 the anionic form. The ionic character explains amino acids' high melting points and good water solubility.","trap":"The uncharged form H₂N–CHR–COOH is negligible in water at every pH; the neutral species that dominates near pH 7 is the zwitterion."},{"id":"pI","title":"Isoelectric point","section":"bb","disc":"Amino Acids & Proteins","parent":"amino-acids","hub":false,"summary":"The isoelectric point is the pH at which a molecule's average net charge is zero. For an amino acid with a neutral R group, pI = (pKa1 + pKa2)/2, about 6. With an ionizable R group, average the two pKa values on either side of the neutral form: acidic residues give low pI (Asp ≈ 3), basic ones high pI (Lys ≈ 10, Arg ≈ 11). Above its pI a molecule is net negative; below it, net positive.","trap":"When pH is below the pI the molecule carries extra protons and is net positive; students often flip this sign."},{"id":"side-chains","title":"Side chain classification","section":"bb","disc":"Amino Acids & Proteins","parent":null,"hub":true,"summary":"The R group makes each amino acid distinct, and the MCAT groups them by polarity and charge: nonpolar aliphatic, aromatic, polar uncharged, acidic and basic. Polarity predicts location (nonpolar residues buried in the core or a membrane, polar and charged ones on the surface), and ionizable side chains set a protein's pI and many catalytic roles. Gly, Pro, Cys and His each have special structural or chemical jobs.","trap":null},{"id":"nonpolar-aa","title":"Nonpolar aliphatic amino acids","section":"bb","disc":"Amino Acids & Proteins","parent":"side-chains","hub":false,"summary":"Gly, Ala, Val, Leu, Ile, Met and Pro have hydrocarbon or thioether side chains that cannot ionize or hydrogen bond well. Val, Leu and Ile are branched and especially hydrophobic. In water-soluble proteins these residues are buried in the core, and in membrane proteins they face the lipid tails, placed there mainly by the hydrophobic effect.","trap":"Methionine contains sulfur but is still nonpolar, because its thioether has no S–H and cannot ionize like cysteine's thiol."},{"id":"aromatic-aa","title":"Aromatic amino acids","section":"bb","disc":"Amino Acids & Proteins","parent":"side-chains","hub":false,"summary":"Phe, Tyr and Trp have aromatic ring side chains (His's imidazole is also aromatic but is grouped as basic). Phe is nonpolar, while Tyr's OH and Trp's ring N–H add some polarity. Trp and Tyr absorb UV light near 280 nm, a quick, common way to estimate protein concentration. Tyr is the precursor of catecholamines and thyroid hormones, and Trp of serotonin and melatonin.","trap":"Tyrosine is aromatic yet fairly polar because its OH can hydrogen bond, so it should not be treated as purely hydrophobic like Phe."},{"id":"polar-aa","title":"Polar uncharged amino acids","section":"bb","disc":"Amino Acids & Proteins","parent":"side-chains","hub":false,"summary":"Ser, Thr, Asn, Gln and Cys have side chains that are polar but uncharged at physiological pH, and Tyr is often added because of its OH. Ser and Thr hydroxyls are sites of phosphorylation and O-linked glycosylation, and Asn's amide is the attachment site for N-linked glycans. These residues hydrogen bond with water, so they favor protein surfaces and active sites.","trap":"Asn and Gln contain nitrogen, but their side-chain amides are not basic and stay uncharged; do not confuse them with Asp/Glu or Lys."},{"id":"charged-aa","title":"Charged amino acids","section":"bb","disc":"Amino Acids & Proteins","parent":"side-chains","hub":false,"summary":"Five residues have side chains that are mostly charged or ionizable near pH 7: acidic Asp and Glu (pKa ≈ 4) and basic Lys, Arg and His (pKa ≈ 10.5, 12.5 and 6). At pH 7.4 Asp, Glu, Lys and Arg are fully charged, while His is mostly neutral. Charged residues are very hydrophilic, sit on protein surfaces, pair in salt bridges and largely set a protein's pI and its migration in an electric field.","trap":null},{"id":"acidic-aa","title":"Acidic amino acids","section":"bb","disc":"Amino Acids & Proteins","parent":"charged-aa","hub":false,"summary":"Aspartate and glutamate carry a second carboxyl group (side-chain pKa ≈ 4), so they are negatively charged at physiological pH and lower a protein's pI. Their amide cousins Asn and Gln are uncharged. Glutamate is the main excitatory neurotransmitter and is decarboxylated to GABA, the main inhibitory one in the brain, and both Asp and Glu are central to transamination and nitrogen disposal.","trap":null},{"id":"basic-aa","title":"Basic amino acids","section":"bb","disc":"Amino Acids & Proteins","parent":"charged-aa","hub":false,"summary":"Lysine (amine, pKa ≈ 10.5), arginine (guanidinium, pKa ≈ 12.5) and histidine (imidazole, pKa ≈ 6) have side chains that accept protons. Lys and Arg are positively charged at physiological pH and raise a protein's pI, while His is mostly neutral at pH 7.4. Clusters of Lys and Arg bind negatively charged partners such as DNA phosphates, and trypsin cuts on their carboxyl side.","trap":"Lysine is often assumed to be the most basic residue, but arginine's guanidinium (pKa ≈ 12.5) is more basic because its positive charge is resonance-delocalized over three nitrogens."},{"id":"glycine","title":"Glycine","section":"bb","disc":"Amino Acids & Proteins","parent":"nonpolar-aa","hub":false,"summary":"The smallest amino acid, with H as its side chain, so its α-carbon is not a stereocenter. Its tiny R group lets the backbone take angles other residues cannot, making Gly common in tight turns and required at every third position of collagen. That flexibility also makes it a poor helix former. Glycine is an inhibitory neurotransmitter in the spinal cord and brainstem.","trap":"Glycine is achiral and has no L or D form, so statements that all 20 standard amino acids are chiral or L are false."},{"id":"proline","title":"Proline","section":"bb","disc":"Amino Acids & Proteins","parent":"nonpolar-aa","hub":false,"summary":"The only standard amino acid whose side chain bonds back to its own α-nitrogen, forming a rigid five-membered ring and making that nitrogen a secondary amine. In a chain, Pro's nitrogen has no H to donate for backbone hydrogen bonding and its ring restricts the φ angle, so Pro disrupts α-helices and is common in turns. Hydroxyproline is essential to collagen's triple helix.","trap":"Proline breaks α-helices because of its backbone, not general side-chain size: its N has no H to donate and its ring restricts rotation. Bulky residues such as Leu are good helix formers."},{"id":"cysteine","title":"Cysteine","section":"bb","disc":"Amino Acids & Proteins","parent":"polar-aa","hub":false,"summary":"Cysteine's side chain ends in a thiol (–SH, pKa ≈ 8), a good nucleophile that is easily oxidized. Two cysteines can be oxidized to a covalent disulfide bond (the pair is called cystine), and reducing agents such as β-mercaptoethanol reverse this. Its thiolate is the attacking nucleophile in cysteine proteases, and in glutathione it serves as a cellular antioxidant.","trap":"L-cysteine is R, not S, because the sulfur in CH₂SH outranks COOH in CIP priority, an exception to the usual 'L = S' rule."},{"id":"histidine","title":"Histidine","section":"bb","disc":"Amino Acids & Proteins","parent":"basic-aa","hub":false,"summary":"Histidine's imidazole side chain has a pKa near 6, close enough to physiological pH that it readily gains or loses a proton in cells. That makes His a common general acid/base in active sites, such as the serine protease catalytic triad, and a contributor to protein buffering. In hemoglobin a histidine binds the heme iron, and His protonation helps drive the Bohr effect.","trap":"Although classed as basic, free His (pKa ≈ 6) is only about 4% protonated at pH 7.4, so it should not be counted as +1 when estimating charge at that pH."},{"id":"peptide-bond","title":"Peptide bond formation","section":"bb","disc":"Amino Acids & Proteins","parent":null,"hub":true,"summary":"A peptide bond is the amide linking one residue's carboxyl carbon to the next residue's amino nitrogen. Forming it releases water (condensation) and is thermodynamically uphill, so cells pay with ATP when charging tRNAs and the ribosome catalyzes the transfer. Hydrolysis is favorable but very slow without enzymes or strong acid. Resonance makes the bond planar, and chains are written and built from N-terminus to C-terminus.","trap":"Peptide bond hydrolysis is thermodynamically favorable yet kinetically very slow, so 'favorable' should not be confused with 'fast'."},{"id":"peptide-hydrolysis","title":"Peptide bond hydrolysis","section":"bb","disc":"Amino Acids & Proteins","parent":"peptide-bond","hub":false,"summary":"Hydrolysis adds water across the amide C–N bond, splitting it into a carboxylic acid and an amine. It is favorable but extremely slow uncatalyzed, so cells use proteases and labs use strong acid or base with heat. Proteases are often residue-specific: trypsin cuts after Lys or Arg, chymotrypsin mainly after aromatic residues, and pepsin works at the stomach's low pH.","trap":null},{"id":"amide-planarity","title":"Amide bond planarity","section":"bb","disc":"Amino Acids & Proteins","parent":"peptide-bond","hub":false,"summary":"Resonance between the nitrogen lone pair and the carbonyl gives the C–N bond partial double-bond character, so the six atoms Cα, C, O, N, H and the next Cα lie in one plane and the bond does not rotate freely. Backbone flexibility comes only from rotation about the bonds to each α-carbon (φ and ψ). Nearly all peptide bonds are trans, and the amide nitrogen is not basic.","trap":"The amide nitrogen is not protonated at physiological pH, because its lone pair is delocalized into the carbonyl rather than free to accept a proton."},{"id":"protein-structure","title":"Protein structure levels","section":"bb","disc":"Amino Acids & Proteins","parent":null,"hub":true,"summary":"Protein structure is described at four levels: primary (the residue sequence joined by peptide bonds), secondary (local α-helices and β-sheets held by backbone hydrogen bonds), tertiary (the 3D fold of one chain, held by side-chain interactions) and quaternary (assembly of several chains). Each level builds on the one below, and shape determines function, so changes in sequence or environment can alter what a protein does.","trap":"On the MCAT, disulfide bonds count as tertiary (or quaternary) interactions even though they are covalent; primary structure is the sequence joined by peptide bonds."},{"id":"primary","title":"Primary structure","section":"bb","disc":"Amino Acids & Proteins","parent":"protein-structure","hub":false,"summary":"Primary structure is the order of amino acids in a chain, written from N-terminus to C-terminus and held together by covalent peptide bonds. It is encoded by the gene's codons and can be read by Edman degradation or mass spectrometry. Because the sequence carries the information needed to fold, a single substitution can change a protein's shape and function, as in sickle cell disease.","trap":null},{"id":"secondary","title":"Secondary structure","section":"bb","disc":"Amino Acids & Proteins","parent":"protein-structure","hub":false,"summary":"Secondary structure is the local, repeating folding of the backbone, held by hydrogen bonds between backbone C=O and N–H groups. The two main forms are the α-helix and the β-pleated sheet, joined by turns and loops. Side chains influence which form a stretch adopts (Pro and Gly break helices, β-branched Val, Ile and Thr favor sheets) but do not supply the stabilizing hydrogen bonds.","trap":"Secondary structure is held by backbone hydrogen bonds; hydrogen bonds between side chains belong to tertiary structure."},{"id":"alpha-helix","title":"α-helix","section":"bb","disc":"Amino Acids & Proteins","parent":"secondary","hub":false,"summary":"A right-handed coil in which each backbone C=O hydrogen bonds to the N–H four residues later (i to i+4), giving about 3.6 residues per turn. The hydrogen bonds run roughly parallel to the helix axis and the side chains point outward, so the chosen residues decide whether a helix is buried, amphipathic or membrane-spanning. Pro breaks helices and Gly weakens them; keratin and many transmembrane segments are α-helical.","trap":"Side chains do not fill the inside of an α-helix; they project outward, while the core is packed with backbone atoms."},{"id":"beta-sheet","title":"β-pleated sheet","section":"bb","disc":"Amino Acids & Proteins","parent":"secondary","hub":false,"summary":"Extended strands lie side by side with hydrogen bonds between C=O and N–H groups on neighboring strands. Strands can run parallel or antiparallel (antiparallel strands allow more linear hydrogen bonds) and are often linked by tight turns containing Gly and Pro. Side chains alternate above and below the pleated surface. Silk is rich in β-sheets, as are the amyloid fibrils formed by misfolded proteins.","trap":"Strands in one sheet can come from parts of the chain far apart in sequence, yet the sheet is still secondary structure, because it is held by backbone hydrogen bonds rather than side-chain interactions."},{"id":"tertiary","title":"Tertiary structure","section":"bb","disc":"Amino Acids & Proteins","parent":"protein-structure","hub":false,"summary":"Tertiary structure is the overall 3D fold of a single polypeptide, created by interactions between side chains that may be far apart in sequence. The hydrophobic effect is the main driving force, burying nonpolar residues in the core; hydrogen bonds, salt bridges, van der Waals contacts and covalent disulfide bonds add stability. Tertiary folding forms binding pockets and active sites, so disrupting it usually abolishes function.","trap":null},{"id":"disulfide-bond","title":"Disulfide bonds","section":"bb","disc":"Amino Acids & Proteins","parent":"tertiary","hub":false,"summary":"A disulfide is a covalent S–S bond formed when two cysteine thiols are oxidized, each sulfur losing its hydrogen. It can link distant parts of one chain (tertiary) or separate chains (quaternary), as in antibody heavy and light chains. Disulfides form mainly in the oxidizing lumen of the ER and are common in secreted and extracellular proteins; reducing agents such as β-mercaptoethanol break them.","trap":"Forming a disulfide is an oxidation and breaking it is a reduction, even though no oxygen atom is involved; students often reverse the two."},{"id":"salt-bridge","title":"Salt bridges","section":"bb","disc":"Amino Acids & Proteins","parent":"tertiary","hub":false,"summary":"A salt bridge is an electrostatic attraction between oppositely charged side chains, usually a carboxylate (Asp, Glu) and an ammonium or guanidinium (Lys, Arg, protonated His), often reinforced by hydrogen bonding. Like any Coulomb attraction it is weakened by a high dielectric constant, so salt bridges exposed to water are fairly weak. Changing pH can remove one of the charges, and added salt screens them.","trap":null},{"id":"quaternary","title":"Quaternary structure","section":"bb","disc":"Amino Acids & Proteins","parent":"protein-structure","hub":false,"summary":"Quaternary structure is the arrangement of two or more folded polypeptide subunits into one functional protein, held by the same noncovalent forces as tertiary structure plus occasional interchain disulfides. Hemoglobin, with two α and two β subunits, is the classic example. Multiple subunits allow cooperativity and allosteric control, because a shape change in one subunit is passed to the others.","trap":"Myoglobin is a single chain with no quaternary structure, which is why its O₂ binding curve is hyperbolic rather than sigmoidal like hemoglobin's."},{"id":"collagen","title":"Collagen","section":"bb","disc":"Amino Acids & Proteins","parent":null,"hub":false,"summary":"Collagen, the most abundant protein in the body, is a fibrous protein of three left-handed polypeptide chains wound into a right-handed triple helix. Its repeating Gly–X–Y sequence puts glycine at every third position, and X and Y are often proline and hydroxyproline. Hydroxylating proline and lysine requires vitamin C, so vitamin C deficiency yields weak collagen and scurvy, with bleeding gums and poor wound healing.","trap":"Collagen's individual chains are not α-helices: each is an extended left-handed helix with no internal hydrogen bonds, held in the triple helix by hydrogen bonds between chains."},{"id":"folding","title":"Protein folding","section":"bb","disc":"Amino Acids & Proteins","parent":null,"hub":true,"summary":"Folding is how a new chain reaches its native 3D shape, usually the conformation of lowest free energy under cellular conditions. Anfinsen showed that the sequence holds the information for this shape. The main driving force is the hydrophobic effect: burying nonpolar side chains frees ordered water, and the water's entropy gain outweighs the entropy the chain loses. Chaperones help by preventing misfolding and aggregation.","trap":"Folding lowers the chain's own entropy; it is favorable because the surrounding water gains more entropy, not because the protein becomes more disordered."},{"id":"chaperones","title":"Chaperones","section":"bb","disc":"Amino Acids & Proteins","parent":"folding","hub":false,"summary":"Chaperones are proteins, many of them heat shock proteins such as Hsp70 and Hsp60, that help other proteins fold correctly. They bind exposed hydrophobic stretches on new or partly unfolded chains, preventing them from aggregating, and many use ATP hydrolysis to cycle on and off their clients. Cells make more of them after heat and other stresses that unfold proteins.","trap":"Chaperones do not determine a protein's final shape; the sequence does, and chaperones only prevent misfolding and aggregation along the way."},{"id":"denaturation","title":"Protein denaturation","section":"bb","disc":"Amino Acids & Proteins","parent":null,"hub":true,"summary":"Denaturation is the loss of a protein's native secondary, tertiary and quaternary structure, and with it usually its function, while the peptide bonds of primary structure stay intact. Agents differ in what they disrupt: heat breaks weak interactions, extreme pH changes charges, urea and SDS interfere with hydrogen bonding and hydrophobic packing, and reducing agents cleave disulfides. Some proteins refold after the agent is removed; others aggregate.","trap":"Denaturation does not break peptide bonds, so a denatured protein keeps its primary structure, unlike one that has been hydrolyzed."},{"id":"thermal-denaturation","title":"Thermal denaturation","section":"bb","disc":"Amino Acids & Proteins","parent":"denaturation","hub":false,"summary":"Heating adds molecular motion until the weak noncovalent interactions that hold a protein's shape give way and the chain unfolds. Unfolding becomes favorable at high temperature because ΔG = ΔH − TΔS and the unfolded chain has far more conformational entropy. Thermal denaturation produces the falling side of an enzyme's temperature–activity curve, and unfolded chains often aggregate irreversibly, as in a cooked egg white.","trap":"Enzyme activity rises with temperature only up to the optimum; the drop beyond it comes from denaturation, not from a change in activation energy."},{"id":"ph-denaturation","title":"pH-induced denaturation","section":"bb","disc":"Amino Acids & Proteins","parent":"denaturation","hub":false,"summary":"Moving far from a protein's normal pH changes the protonation of ionizable side chains: low pH neutralizes Asp and Glu carboxylates, and high pH neutralizes Lys amines. This breaks salt bridges and hydrogen bonds and leaves like charges that repel, so the chain unfolds. Each enzyme therefore has a pH optimum matched to where it works, such as pepsin near pH 2 and pancreatic proteases near pH 8.","trap":null},{"id":"urea","title":"Urea","section":"bb","disc":"Amino Acids & Proteins","parent":"denaturation","hub":false,"summary":"At high concentration (about 6–8 M), urea denatures proteins by hydrogen bonding with the backbone and side chains and by helping water solvate nonpolar groups, which weakens the hydrophobic effect. It breaks no covalent bonds, so removing it can let a protein refold, as in Anfinsen's ribonuclease experiment. The same molecule is the body's main nitrogen waste product, made in the liver by the urea cycle.","trap":"Urea does not break disulfide bonds; Anfinsen needed β-mercaptoethanol as well to fully unfold ribonuclease."},{"id":"sds","title":"SDS (sodium dodecyl sulfate)","section":"bb","disc":"Amino Acids & Proteins","parent":"denaturation","hub":false,"summary":"Sodium dodecyl sulfate is an anionic detergent with a 12-carbon tail and a sulfate head. Its tails bind hydrophobic regions and unfold the protein, which binds SDS roughly in proportion to its length, so proteins end up with about the same negative charge per unit mass. That is why SDS-PAGE separates proteins mainly by size. Like other detergents, SDS also dissolves membranes into micelles.","trap":"SDS alone does not break disulfide bonds; a reducing agent is needed to separate disulfide-linked subunits in SDS-PAGE."},{"id":"beta-mercaptoethanol","title":"β-mercaptoethanol","section":"bb","disc":"Amino Acids & Proteins","parent":"denaturation","hub":false,"summary":"β-Mercaptoethanol (HS–CH₂CH₂–OH) is a thiol reducing agent that breaks disulfide bonds, reducing each S–S back to two –SH groups while it is oxidized itself. It is added in excess to SDS-PAGE samples so that disulfide-linked chains separate and run at their individual masses. It does not disrupt noncovalent interactions by itself. Dithiothreitol (DTT) is a common alternative for the same job.","trap":null},{"id":"gel-electrophoresis","title":"Gel electrophoresis","section":"bb","disc":"Amino Acids & Proteins","parent":null,"hub":false,"summary":"Electrophoresis moves charged molecules through a gel in an electric field; migration speeds up with more charge and slows with larger size. Native PAGE keeps proteins folded, so charge, size and shape all matter. SDS-PAGE denatures proteins and coats them with negative charge so they separate by mass, smaller ones moving farther toward the positive anode. Isoelectric focusing instead stops each protein at its pI in a pH gradient.","trap":"In electrophoresis the anode is positive, as in an electrolytic cell, so negatively charged DNA and SDS-coated proteins move toward the anode, not away from it."},{"id":"enzymes","title":"Enzymes","section":"bb","disc":"Enzymes","parent":null,"hub":true,"summary":"Enzymes are biological catalysts, mostly proteins (a few are RNA ribozymes), that speed reactions by binding substrates in an active site and stabilizing the transition state, which lowers activation energy. They are not consumed and do not change ΔG, ΔH or Keq. Many need cofactors (metal ions) or coenzymes (often vitamin-derived). Because activity depends on folded structure, temperature and pH matter, and cells tune activity through kinetics, inhibitors, allostery and covalent modification.","trap":"Enzymes cannot make a nonspontaneous reaction spontaneous or shift equilibrium; they speed the forward and reverse reactions equally, so equilibrium is simply reached faster."},{"id":"catalytic-mechanisms","title":"Catalytic mechanisms","section":"bb","disc":"Enzymes","parent":null,"hub":true,"summary":"Enzymes use a small set of chemical strategies that lower the free energy of the transition state relative to the bound substrate: general acid–base catalysis, covalent catalysis, electrostatic and metal-ion catalysis, and holding substrates close together in the right orientation. Most enzymes combine several. The serine protease chymotrypsin is the model: its Ser–His–Asp catalytic triad provides acid–base and covalent catalysis, and its oxyanion hole stabilizes the charged tetrahedral intermediate.","trap":null},{"id":"acid-base-catalysis","title":"Acid–base catalysis","section":"bb","disc":"Enzymes","parent":"catalytic-mechanisms","hub":false,"summary":"Active-site side chains donate or accept protons during the reaction so that charge does not build up in the transition state. Histidine is the classic catalytic residue because its imidazole pKa of about 6 lets it act as either acid or base near physiological pH; Asp, Glu, Lys, Cys, Ser and Tyr also take part. This is a main reason enzymes have pH optima: the catalytic groups must be in the right protonation state.","trap":null},{"id":"covalent-catalysis","title":"Covalent catalysis","section":"bb","disc":"Enzymes","parent":"catalytic-mechanisms","hub":false,"summary":"The enzyme forms a temporary covalent bond with the substrate, replacing one difficult step with two easier ones that pass through an enzyme–substrate intermediate. A nucleophilic side chain does the attacking: Ser in serine proteases forms an acyl-enzyme, Cys in cysteine proteases forms a thioester, and Lys forms a Schiff base (imine) in aldolase. The intermediate is then broken down, so the enzyme is regenerated unchanged.","trap":"Covalent catalysis is not covalent regulation or irreversible inhibition: the enzyme–substrate bond forms and breaks within every catalytic cycle, whereas a phosphate or an irreversible inhibitor stays attached until something else removes it."},{"id":"electrostatic-catalysis","title":"Electrostatic catalysis","section":"bb","disc":"Enzymes","parent":"catalytic-mechanisms","hub":false,"summary":"Charged groups and metal ions in the active site stabilize charges that develop in the transition state, such as the oxyanion formed during peptide hydrolysis, which is held by backbone N–H groups in the oxyanion hole. Metal ions like Zn²⁺, Mg²⁺ and Fe²⁺ also act as Lewis acids: Zn²⁺ in carbonic anhydrase lowers the pKa of bound water so it forms a reactive OH⁻, and Mg²⁺ shields the negative charges on ATP's phosphates in kinases.","trap":null},{"id":"proximity-orientation","title":"Proximity and orientation effects","section":"bb","disc":"Enzymes","parent":"catalytic-mechanisms","hub":false,"summary":"Binding two substrates side by side in the active site raises their effective local concentration and fixes them in the reactive geometry, so the reaction no longer waits for rare, correctly oriented collisions. Binding energy pays much of the entropy cost of bringing reactants together. Induced fit, in which the enzyme changes shape as substrate binds, further aligns catalytic groups and can strain substrate bonds toward the transition state.","trap":"Lock-and-key is not the favored model: it explains specificity but treats the active site as rigid, whereas induced fit, now preferred, has the active site change shape as substrate binds."},{"id":"michaelis-menten","title":"Michaelis–Menten kinetics","section":"bb","disc":"Enzymes","parent":null,"hub":true,"summary":"Describes how initial rate depends on substrate concentration for E + S ⇌ ES → E + P under the steady-state assumption: v = Vmax[S]/(Km + [S]). At [S] much lower than Km the rate rises almost linearly (first order in S); at [S] much higher than Km it levels off at Vmax (zero order) because every active site is occupied. Vmax, Km, kcat and kcat/Km summarize an enzyme, and inhibitors are classified by how they shift them.","trap":"The equation gives a hyperbola; an enzyme with a sigmoidal rate curve is cooperative or allosteric and is not described by simple Michaelis–Menten kinetics."},{"id":"vmax","title":"Vmax","section":"bb","disc":"Enzymes","parent":"michaelis-menten","hub":false,"summary":"Vmax is the limiting rate approached as substrate saturates every active site. Since Vmax = kcat × [E]total, it scales with the amount of enzyme: doubling enzyme doubles Vmax but leaves Km unchanged. Cells raise Vmax by making more enzyme (induction) or activating existing copies. Noncompetitive, mixed, uncompetitive and irreversible inhibitors lower it by keeping some enzyme from turning over at any [S], so extra substrate cannot restore it.","trap":"Vmax is not an intrinsic constant of the enzyme because it depends on enzyme concentration; kcat is the per-enzyme value."},{"id":"km","title":"Km","section":"bb","disc":"Enzymes","parent":"michaelis-menten","hub":false,"summary":"Km is the substrate concentration at which the rate equals half of Vmax; from the steady-state derivation, Km = (k₋₁ + kcat)/k₁. When product formation is slow compared with dissociation of ES, Km approximates the ES dissociation constant, so a lower Km is read as higher affinity. Km does not change with enzyme amount. Hexokinase (Km about 0.1 mM or less) is saturated at normal blood glucose, while liver glucokinase (half-saturated near 10 mM) responds to rising glucose after a meal.","trap":"Km is a concentration, the [S] that gives half of Vmax, not half of Vmax itself; and a smaller Km means higher, not lower, apparent affinity."},{"id":"kcat","title":"kcat (turnover number)","section":"bb","disc":"Enzymes","parent":"michaelis-menten","hub":false,"summary":"The turnover number kcat is the maximum number of substrate molecules one active site converts to product per second when saturated: kcat = Vmax/[E]total, with units of s⁻¹. It reflects the slowest step after substrate binds (chemistry or product release) and, unlike Vmax, does not depend on how much enzyme is present. Values range from below 1 s⁻¹ to about 10⁶ s⁻¹ for carbonic anhydrase.","trap":null},{"id":"catalytic-efficiency","title":"Catalytic efficiency (kcat/Km)","section":"bb","disc":"Enzymes","parent":"michaelis-menten","hub":false,"summary":"The ratio kcat/Km measures how well an enzyme works at low substrate concentration, where v ≈ (kcat/Km)[E][S] and the reaction behaves as second order. It is the best single number for comparing enzymes, or one enzyme's preference among substrates. Its ceiling is the rate at which substrate diffuses into the active site, about 10⁸–10⁹ M⁻¹s⁻¹; enzymes near it, such as triose phosphate isomerase and acetylcholinesterase, are called catalytically perfect.","trap":null},{"id":"steady-state","title":"Steady-state assumption","section":"bb","disc":"Enzymes","parent":"michaelis-menten","hub":false,"summary":"The Michaelis–Menten derivation assumes that soon after mixing, [ES] stays constant because it forms as fast as it breaks down: k₁[E][S] = (k₋₁ + kcat)[ES]. It also assumes [S] is much greater than [E], so free substrate is not noticeably depleted, and that initial rates are measured before product builds up and the reverse reaction matters. Solving for [ES] under these conditions gives the Michaelis–Menten equation and the definition of Km.","trap":"Steady state means [ES] is constant while product keeps forming at a steady rate; it does not mean the reaction is at equilibrium."},{"id":"lineweaver-burk","title":"Lineweaver–Burk plots","section":"bb","disc":"Enzymes","parent":null,"hub":true,"summary":"Plotting 1/v against 1/[S] turns the Michaelis–Menten hyperbola into a straight line: 1/v = (Km/Vmax)(1/[S]) + 1/Vmax. The y-intercept is 1/Vmax, the x-intercept is −1/Km and the slope is Km/Vmax. Its main MCAT use is identifying inhibitors: lines that cross on the y-axis mean competitive, on the x-axis noncompetitive, parallel lines uncompetitive, and lines crossing left of the y-axis but off the x-axis mixed.","trap":"Because the axes are reciprocals, a higher y-intercept means a lower Vmax and an x-intercept closer to zero means a larger Km."},{"id":"inhibition","title":"Enzyme inhibition","section":"bb","disc":"Enzymes","parent":null,"hub":true,"summary":"Reversible inhibitors are classified by which enzyme form they bind. Competitive inhibitors bind free enzyme at the active site (Km rises, Vmax unchanged); uncompetitive inhibitors bind only ES (Km and Vmax both fall); mixed inhibitors bind both forms with different affinities (Vmax falls, Km rises or falls); noncompetitive is the equal-affinity case (Vmax falls, Km unchanged). Irreversible inhibitors covalently inactivate enzyme. Many drugs work by enzyme inhibition.","trap":"Only competitive inhibition can be overcome by adding more substrate; for the other types, extra substrate does not restore Vmax."},{"id":"competitive-inhibition","title":"Competitive inhibition","section":"bb","disc":"Enzymes","parent":"inhibition","hub":false,"summary":"A competitive inhibitor usually resembles the substrate and binds the free enzyme's active site, so substrate and inhibitor exclude each other. Enough substrate outcompetes it, so Vmax is unchanged, but more substrate is needed to reach half of Vmax, so apparent Km rises. Lineweaver–Burk lines with and without inhibitor cross on the y-axis. Examples include statins on HMG-CoA reductase, methotrexate on dihydrofolate reductase and malonate on succinate dehydrogenase.","trap":null},{"id":"uncompetitive-inhibition","title":"Uncompetitive inhibition","section":"bb","disc":"Enzymes","parent":"inhibition","hub":false,"summary":"An uncompetitive inhibitor binds only the enzyme–substrate complex, at a site that forms once substrate is bound, and traps ES so it cannot turn over. Removing ES pulls the binding equilibrium toward more ES formation, so apparent Km and Vmax fall by the same factor; the Lineweaver–Burk slope (Km/Vmax) is unchanged and lines are parallel. Because it needs ES, it is most effective at high [S]. Lithium ion inhibiting inositol monophosphatase is a frequently cited example.","trap":"Uncompetitive inhibition lowers Km, so apparent affinity increases even though the enzyme is inhibited; students often assume every inhibitor raises Km."},{"id":"noncompetitive-inhibition","title":"Noncompetitive inhibition","section":"bb","disc":"Enzymes","parent":"inhibition","hub":false,"summary":"A pure noncompetitive inhibitor binds a site away from the active site with equal affinity whether or not substrate is bound. It does not block substrate binding but disables catalysis, which is equivalent to removing enzyme: Vmax falls, Km is unchanged, and adding substrate cannot reverse it. Lineweaver–Burk lines cross on the x-axis. Truly pure noncompetitive inhibition is uncommon; most inhibitors that bind elsewhere are mixed.","trap":"Noncompetitive inhibitors leave Km unchanged; students often say Km rises because they assume the inhibitor interferes with substrate binding."},{"id":"mixed-inhibition","title":"Mixed inhibition","section":"bb","disc":"Enzymes","parent":"inhibition","hub":false,"summary":"A mixed inhibitor binds both free enzyme and the ES complex, but with different affinities. Vmax always falls. Apparent Km rises if the inhibitor prefers free enzyme (competitive-like) and falls if it prefers ES (uncompetitive-like). On a Lineweaver–Burk plot the lines cross left of the y-axis, above the x-axis when Km rises and below it when Km falls. Pure noncompetitive inhibition is the special case of equal affinity for both forms.","trap":null},{"id":"allosteric-regulation","title":"Allosteric regulation","section":"bb","disc":"Enzymes","parent":null,"hub":true,"summary":"Allosteric enzymes have regulatory sites separate from the active site, and effectors binding there shift the enzyme between conformations with different activity or affinity. They are often multisubunit and cooperative, giving sigmoidal rate curves rather than Michaelis–Menten hyperbolas, so small changes in substrate or effector cause large changes in rate. They usually sit at committed, irreversible steps such as PFK-1, and hemoglobin is the classic non-enzyme model of the same behavior.","trap":"Allosteric does not mean inhibitory; many allosteric effectors are activators, such as AMP and fructose-2,6-bisphosphate on PFK-1."},{"id":"cooperativity","title":"Cooperativity","section":"bb","disc":"Enzymes","parent":"allosteric-regulation","hub":false,"summary":"In a protein with several binding sites, ligand binding at one site changes affinity at the others. Positive cooperativity makes the binding or rate curve sigmoidal, so activity switches from low to high over a narrow concentration range, ideal for responding to small changes. Hemoglobin's O₂ binding is the standard example: each O₂ bound makes the next bind more easily. Negative cooperativity, where binding lowers affinity at the other sites, also exists.","trap":"Myoglobin is not cooperative; with a single heme it gives a hyperbolic O₂ curve, unlike tetrameric hemoglobin."},{"id":"t-r-states","title":"T and R states","section":"bb","disc":"Enzymes","parent":"allosteric-regulation","hub":false,"summary":"In the concerted (MWC) model, an allosteric protein exists in equilibrium between a low-affinity tense (T) state and a high-affinity relaxed (R) state, with all subunits switching together. Substrate and activators bind R better and shift the equilibrium toward it; inhibitors stabilize T. In hemoglobin, deoxy-Hb is in the T state, held by salt bridges and 2,3-BPG, and O₂ binding favors R. The sequential model instead lets subunits change one at a time.","trap":null},{"id":"hill-coefficient","title":"Hill coefficient","section":"bb","disc":"Enzymes","parent":"allosteric-regulation","hub":false,"summary":"The Hill coefficient n measures cooperativity from the steepness of a binding curve. n > 1 means positive cooperativity, n = 1 means none (a hyperbolic, Michaelis–Menten-like curve), and n < 1 means negative cooperativity. It cannot exceed the number of binding sites: hemoglobin has four O₂ sites but n of roughly 2.8–3.","trap":"The Hill coefficient is not the number of binding sites; hemoglobin's n is about 3 even though it binds four O₂."},{"id":"allosteric-effectors","title":"Allosteric effectors","section":"bb","disc":"Enzymes","parent":"allosteric-regulation","hub":false,"summary":"Allosteric effectors are molecules that bind regulatory sites noncovalently and shift enzyme activity. Homotropic effectors are the same molecule as the substrate or ligand (O₂ on hemoglobin); heterotropic effectors are other molecules. They usually report cell status: ATP and citrate signal plenty and inhibit PFK-1, while AMP and fructose-2,6-bisphosphate signal need and activate it, and acetyl-CoA activates pyruvate carboxylase to favor gluconeogenesis.","trap":"ATP is both a substrate and an allosteric inhibitor of PFK-1: at high levels it also binds a separate regulatory site, so more ATP slows the enzyme rather than speeding it."},{"id":"covalent-modification","title":"Covalent modification and control","section":"bb","disc":"Enzymes","parent":null,"hub":true,"summary":"Cells also control enzymes by changing their covalent structure. Reversible modifications such as phosphorylation are added and removed by other enzymes in response to hormones, while proteolytic activation of zymogens is permanent. Feedback inhibition is grouped here as another way to control pathway flux, although it usually works by noncovalent allosteric binding rather than covalent change. With allostery, these tools adjust existing enzymes within seconds to minutes.","trap":null},{"id":"phosphorylation","title":"Phosphorylation","section":"bb","disc":"Enzymes","parent":"covalent-modification","hub":false,"summary":"Kinases transfer the γ-phosphate of ATP to a Ser, Thr or Tyr hydroxyl, and phosphatases remove it by hydrolysis. The bulky, negatively charged phosphate changes local charge and conformation, activating some enzymes and inhibiting others. Hormone cascades work this way: glucagon or epinephrine raises cAMP, which activates protein kinase A; PKA then starts a kinase cascade that activates glycogen phosphorylase and directly inactivates glycogen synthase.","trap":"Phosphorylation does not always activate an enzyme; the same glucagon signal switches glycogen phosphorylase on and glycogen synthase off."},{"id":"zymogens","title":"Zymogens and cleavage activation","section":"bb","disc":"Enzymes","parent":"covalent-modification","hub":false,"summary":"Zymogens (proenzymes) are inactive precursors switched on by cutting part of the chain, which rearranges the active site. Making digestive and clotting proteases this way keeps them from attacking the cells that make them. Enteropeptidase on the duodenal brush border turns trypsinogen into trypsin, which then activates chymotrypsinogen, procarboxypeptidase and more trypsinogen. Cleavage is irreversible, so the active enzymes are shut off by inhibitor proteins or degradation.","trap":"Pepsinogen is activated by stomach acid and by pepsin itself, not by enteropeptidase, which works in the duodenum on trypsinogen."},{"id":"feedback-inhibition","title":"Feedback inhibition","section":"bb","disc":"Enzymes","parent":"covalent-modification","hub":false,"summary":"The end product of a pathway inhibits an enzyme near the start, usually the committed step. It is usually allosteric: the product binds a regulatory site noncovalently and reversibly, with no covalent change to the enzyme. Flux drops when product accumulates and resumes when it is used up, without piling up intermediates. Examples include CTP inhibiting aspartate transcarbamoylase in bacterial pyrimidine synthesis and isoleucine inhibiting threonine deaminase.","trap":"Feedback inhibition usually targets the first committed step, not the last enzyme of the pathway, and it is reversible allosteric binding, not covalent modification."},{"id":"carbohydrates","title":"Carbohydrates","section":"bb","disc":"Carbohydrates & Lipids","parent":null,"hub":true,"summary":"Carbohydrates are polyhydroxy aldehydes or ketones and the polymers built from them; simple sugars roughly fit (CH₂O)n. Monosaccharides carry several stereocenters (D/L, epimers) and close into hemiacetal rings with α and β anomers. Glycosidic bonds join them into disaccharides and polysaccharides, and digestive enzymes are specific for α or β linkages, so humans digest starch but not cellulose. A free anomeric carbon makes a sugar reducing.","trap":null},{"id":"monosaccharides","title":"Monosaccharides","section":"bb","disc":"Carbohydrates & Lipids","parent":"carbohydrates","hub":false,"summary":"Monosaccharides are single sugar units, classed by carbonyl type (aldose or ketose) and carbon count (triose, pentose, hexose). Key examples are glucose, galactose, fructose, ribose and deoxyribose. An open-chain aldose with n carbons has n − 2 stereocenters, so an aldohexose has 4 and 2⁴ = 16 stereoisomers; a 2-ketose of the same length has one fewer. In water, pentoses and hexoses exist mostly as rings.","trap":"Ring closure adds a new stereocenter: open-chain glucose has four stereocenters, but cyclic glucopyranose has five because the anomeric carbon becomes chiral."},{"id":"aldoses-ketoses","title":"Aldoses and ketoses","section":"bb","disc":"Carbohydrates & Lipids","parent":"monosaccharides","hub":false,"summary":"Aldoses carry an aldehyde at C-1 (glyceraldehyde, ribose, glucose, galactose); ketoses carry a ketone, usually at C-2 (dihydroxyacetone, ribulose, fructose). Base or an isomerase interconverts them through a shared enediol intermediate, a keto–enol tautomerization. Glycolysis uses exactly this: glucose-6-phosphate becomes fructose-6-phosphate, and DHAP becomes glyceraldehyde-3-phosphate.","trap":"Ketoses such as fructose still test positive with Tollens' or Benedict's reagent, because the basic test conditions convert them through an enediol intermediate into aldoses; a ketone carbonyl does not make a sugar nonreducing."},{"id":"d-l-sugars","title":"D and L sugars","section":"bb","disc":"Carbohydrates & Lipids","parent":"monosaccharides","hub":false,"summary":"D or L is set by the stereocenter farthest from the carbonyl: in a Fischer projection, OH on the right means D and on the left means L, by analogy to D- and L-glyceraldehyde. Nearly all natural sugars are D. The D and L forms of one sugar are enantiomers, inverted at every stereocenter. D/L does not predict the sign of optical rotation (D-fructose is levorotatory) and does not map onto R/S at the other carbons.","trap":"Inverting only the reference (bottom) stereocenter gives a diastereomer, not the L sugar (doing this to D-glucose gives L-idose); L-glucose is the mirror image of D-glucose at all four stereocenters."},{"id":"epimers","title":"Epimers","section":"bb","disc":"Carbohydrates & Lipids","parent":"monosaccharides","hub":false,"summary":"Epimers are diastereomers that differ at exactly one of several stereocenters: D-glucose and D-mannose are C-2 epimers, and D-glucose and D-galactose are C-4 epimers. Anomers are the special case that differ at the anomeric carbon. Being diastereomers, epimers have different physical properties and are recognized by different enzymes; an epimerase must convert UDP-galactose to UDP-glucose before galactose can join glucose metabolism.","trap":"Glucose and fructose share the formula C₆H₁₂O₆ but are constitutional isomers (aldose vs. ketose), not epimers; epimers must have identical connectivity."},{"id":"cyclization","title":"Ring formation (hemiacetals and hemiketals)","section":"bb","disc":"Carbohydrates & Lipids","parent":"monosaccharides","hub":false,"summary":"Pentoses and hexoses cyclize when a chain hydroxyl attacks the carbonyl carbon in an intramolecular nucleophilic addition, giving a cyclic hemiacetal (aldoses) or hemiketal (ketoses). In glucose the C-5 OH attacks C-1 to form a six-membered pyranose; fructose's C-5 OH attacks C-2 to form a five-membered furanose, as in sucrose. The old carbonyl carbon becomes the anomeric carbon, a new stereocenter. In a Haworth projection, groups on the right in the Fischer projection point down.","trap":"A cyclic sugar is a hemiacetal, not an acetal: its anomeric carbon still bears an OH and can reopen to the chain form. Only a glycosidic bond (a true acetal) locks the ring."},{"id":"anomers","title":"Anomers and mutarotation","section":"bb","disc":"Carbohydrates & Lipids","parent":"cyclization","hub":false,"summary":"Ring closure creates two anomers at the anomeric carbon. In a D-sugar Haworth projection, α has the anomeric OH trans to the CH₂OH group (down) and β has it cis (up). Because the hemiacetal reopens and recloses in water, either pure anomer slowly converts to an equilibrium mixture and its specific rotation drifts: mutarotation. D-glucose settles near 64% β and 36% α, since β places every bulky group equatorial in the chair.","trap":"α and β anomers are not enantiomers; they differ at only one stereocenter, so they are diastereomers (epimers) with different specific rotations."},{"id":"glycosidic-bonds","title":"Glycosidic bonds","section":"bb","disc":"Carbohydrates & Lipids","parent":"carbohydrates","hub":false,"summary":"A glycosidic bond forms when a sugar's anomeric OH condenses with an OH (O-glycosidic) or an N–H (N-glycosidic, as in nucleosides) of another molecule, releasing water and turning the hemiacetal into an acetal. Bonds are named by anomeric configuration and the carbons joined, such as α-1,4, β-1,4 or α-1,6. The anomeric carbon is then locked and cannot mutarotate. Acid or specific glycosidases hydrolyze the bond, and enzymes strictly distinguish α from β.","trap":"β linkages are not inherently indigestible: lactase cleaves lactose's β-1,4 bond. Cellulose resists human digestion because humans make no enzyme that recognizes its β-1,4 glucose–glucose linkage."},{"id":"disaccharides","title":"Disaccharides (sucrose, lactose, maltose)","section":"bb","disc":"Carbohydrates & Lipids","parent":"glycosidic-bonds","hub":false,"summary":"Maltose is glucose α-1,4 glucose (from starch digestion), lactose is galactose β-1,4 glucose (milk sugar), and sucrose is glucose α1→β2 fructose (table sugar). Only monosaccharides are absorbed, so brush-border maltase, lactase and sucrase must hydrolyze each disaccharide first. Lactase activity falls after weaning in most adults, and undigested lactose is fermented in the colon, causing lactose intolerance.","trap":"Sucrose is nonreducing even though glucose and fructose are each reducing, because its glycosidic bond joins both anomeric carbons and leaves no hemiacetal to open."},{"id":"polysaccharides","title":"Polysaccharides (starch, glycogen, cellulose)","section":"bb","disc":"Carbohydrates & Lipids","parent":"carbohydrates","hub":false,"summary":"Starch (plants) is amylose, unbranched α-1,4 glucose, plus amylopectin, which adds α-1,6 branches. Glycogen (animal liver and muscle) branches more often, every 8–12 residues, creating many nonreducing ends for rapid synthesis and breakdown. Cellulose is β-1,4 glucose: straight chains hydrogen-bond side by side into rigid fibers that human enzymes cannot cleave, so it acts as dietary fiber. Chitin is β-1,4 N-acetylglucosamine.","trap":"Starch and cellulose are made of the same monomer, glucose, joined 1→4; the key difference is α versus β configuration at the anomeric carbon, which sets chain shape and whether human enzymes can cut them."},{"id":"reducing-sugars","title":"Reducing sugars","section":"bb","disc":"Carbohydrates & Lipids","parent":"carbohydrates","hub":false,"summary":"A reducing sugar has a free anomeric carbon (an unlinked hemiacetal or hemiketal) that can open to the chain form, where an aldehyde is oxidized to a carboxylic acid by mild oxidants. Tollens' reagent deposits a silver mirror (Ag⁺ → Ag) and Benedict's gives a red Cu₂O precipitate (Cu²⁺ → Cu⁺). All monosaccharides, maltose and lactose are reducing; sucrose and glycosides such as methyl glucoside are not, because their anomeric carbons are acetals.","trap":"A reducing sugar is itself oxidized; it is the reducing agent, and the Ag⁺ or Cu²⁺ in the test reagent is what gets reduced."},{"id":"lipids","title":"Lipid structure","section":"bb","disc":"Carbohydrates & Lipids","parent":null,"hub":true,"summary":"Lipids are a structurally diverse group united by being mostly nonpolar: poorly soluble in water but soluble in nonpolar solvents. They include fatty acids and triacylglycerols (energy storage), membrane lipids (glycerophospholipids, sphingolipids, cholesterol) and signaling or isoprenoid lipids (steroids, terpenes, fat-soluble vitamins, eicosanoids). Because they avoid water, they need bile salts for digestion and lipoproteins for transport in blood.","trap":null},{"id":"fatty-acids","title":"Saturated and unsaturated fatty acids","section":"bb","disc":"Carbohydrates & Lipids","parent":"lipids","hub":false,"summary":"Fatty acids are long hydrocarbon chains ending in a carboxylic acid, usually with an even number of carbons (palmitate C16, stearate C18), and ionized as carboxylates at body pH. Straight saturated chains pack tightly through dispersion forces and melt higher; natural unsaturated chains have cis double bonds whose kinks loosen packing and lower melting point. Linoleic (ω-6) and α-linolenic (ω-3) acids are essential because humans cannot add double bonds beyond C-9.","trap":"Trans fats are unsaturated yet nearly straight, so they pack like saturated chains and melt higher; it is the cis kink, not unsaturation itself, that lowers melting point."},{"id":"triacylglycerols","title":"Triacylglycerols","section":"bb","disc":"Carbohydrates & Lipids","parent":"lipids","hub":false,"summary":"A triacylglycerol is glycerol with all three hydroxyls esterified to fatty acids. With no charged head group it is fully nonpolar, so it is stored without water in adipocyte droplets and yields about 9 kcal/g, more than twice carbohydrate, because its carbons are highly reduced. Digestion needs bile-salt emulsification and pancreatic lipase, which releases fatty acids and 2-monoacylglycerol; enterocytes rebuild TAGs and export them in chylomicrons.","trap":null},{"id":"saponification","title":"Saponification and soaps","section":"bb","disc":"Carbohydrates & Lipids","parent":"triacylglycerols","hub":false,"summary":"Saponification is base hydrolysis (NaOH or KOH, heat) of a triacylglycerol's ester bonds, giving glycerol and three fatty acid carboxylate salts: soap. Soap anions are amphipathic, so in water they form micelles with tails inward that trap grease in a nonpolar core. In hard water, Ca²⁺ and Mg²⁺ form insoluble carboxylate salts, the familiar soap scum.","trap":"Acid-catalyzed ester hydrolysis is reversible, but saponification goes to completion because the carboxylic acid is immediately deprotonated to a carboxylate that the alcohol cannot attack."},{"id":"glycerophospholipids","title":"Glycerophospholipids","section":"bb","disc":"Carbohydrates & Lipids","parent":"lipids","hub":false,"summary":"A glycerophospholipid has fatty acids ester-linked at C-1 and C-2 of glycerol and a phosphate at C-3 joined to a polar head group such as choline, ethanolamine, serine or inositol (phosphatidic acid has none). The two tails plus a charged head make it amphipathic, so it forms bilayers rather than micelles. Phospholipases cut specific bonds to make signals: PLA₂ frees the C-2 fatty acid (often arachidonic acid), and PLC splits PIP₂ into IP₃ and DAG.","trap":null},{"id":"sphingolipids","title":"Sphingolipids","section":"bb","disc":"Carbohydrates & Lipids","parent":"lipids","hub":false,"summary":"Sphingolipids are built on sphingosine, a long-chain amino alcohol, instead of glycerol; an amide-linked fatty acid makes ceramide. Adding phosphocholine gives sphingomyelin, a phospholipid abundant in myelin; adding sugars gives glycosphingolipids: cerebrosides (one sugar), globosides (several) and gangliosides (with sialic acid). Lysosomal enzymes degrade them, and enzyme defects cause storage diseases such as Tay–Sachs (GM2 ganglioside), Niemann–Pick and Gaucher.","trap":"Sphingomyelin is a phospholipid but not a glycerophospholipid; it contains no glycerol, and its fatty acid is attached by an amide rather than an ester."},{"id":"steroids","title":"Steroids and cholesterol","section":"bb","disc":"Carbohydrates & Lipids","parent":"lipids","hub":false,"summary":"Steroids share a fused four-ring nucleus: three six-membered rings and one five-membered ring. Cholesterol adds a 3-OH and a hydrocarbon side chain; it is made from acetyl-CoA, with HMG-CoA reductase as the rate-limiting, statin-inhibited step. Its rigid, nearly flat ring system buffers membrane fluidity, and it is the precursor of steroid hormones, bile acids and vitamin D. Steroids are nonpolar enough to cross membranes unaided.","trap":null},{"id":"terpenes","title":"Terpenes and isoprenoids","section":"bb","disc":"Carbohydrates & Lipids","parent":"lipids","hub":false,"summary":"Terpenes are built from five-carbon isoprene units, supplied in cells as isopentenyl pyrophosphate from the mevalonate pathway. They are named by isoprene count: monoterpene (2 units, C10), sesquiterpene (3, C15), diterpene (4, C20), triterpene (6, C30) and tetraterpene (8, C40). Squalene (C30) cyclizes on the way to cholesterol, carotenoids (C40) yield vitamin A, and terpenoids are terpenes carrying added functional groups.","trap":"A monoterpene has two isoprene units (10 carbons), not one, because the original 'terpene' unit was a C10 compound; each prefix counts C10 units, so a triterpene has six isoprenes and 30 carbons."},{"id":"fat-soluble-vitamins","title":"Fat-soluble vitamins (A, D, E, K)","section":"bb","disc":"Carbohydrates & Lipids","parent":"lipids","hub":false,"summary":"Vitamins A, D, E and K are absorbed with dietary fat in micelles, carried in chylomicrons and stored in liver and fat, so excess (especially A and D) can build up to toxic levels. A gives retinal for vision and retinoic acid for gene regulation; D (made in skin with UV light) becomes calcitriol, raising intestinal Ca²⁺ absorption; E (tocopherol) is a membrane antioxidant; K is needed to γ-carboxylate clotting factors II, VII, IX and X.","trap":"Dietary or skin-made vitamin D is inactive; it must be hydroxylated in the liver (C-25) and then the kidney (C-1, stimulated by PTH) to become calcitriol."},{"id":"eicosanoids","title":"Prostaglandins and eicosanoids","section":"bb","disc":"Carbohydrates & Lipids","parent":"lipids","hub":false,"summary":"Eicosanoids are 20-carbon signaling lipids made from arachidonic acid, which phospholipase A₂ releases from membrane phospholipids. Cyclooxygenase (COX) makes prostaglandins and thromboxanes, and lipoxygenase makes leukotrienes. They act locally and briefly: prostaglandins mediate inflammation, pain, fever and gastric protection; thromboxane A₂ drives platelet aggregation; leukotrienes cause bronchoconstriction. NSAIDs and aspirin block COX.","trap":"Aspirin inhibits COX irreversibly by acetylating it, unlike reversible NSAIDs such as ibuprofen; because platelets have no nucleus to make new COX, its antiplatelet effect lasts their lifespan."},{"id":"lipoproteins","title":"Lipoproteins (chylomicrons, LDL, HDL)","section":"bb","disc":"Carbohydrates & Lipids","parent":"lipids","hub":false,"summary":"Lipoproteins carry lipids in plasma: a core of triacylglycerols and cholesteryl esters under a shell of phospholipids, free cholesterol and apolipoproteins. Chylomicrons carry dietary fat from the intestine via lymph; VLDL carries liver-made TAG. Lipoprotein lipase strips TAG from both: chylomicron remnants return to the liver, while VLDL becomes IDL and then cholesterol-rich LDL, which delivers cholesterol to cells. HDL returns excess cholesterol to the liver. High LDL promotes atherosclerosis.","trap":"Density rises with protein fraction, not with size: TAG-rich chylomicrons are the largest and least dense particles, while HDL, with the highest protein fraction, is the smallest and densest."},{"id":"membranes","title":"Membrane structure and transport","section":"bb","disc":"Cell & Molecular Bio","parent":null,"hub":true,"summary":"Membranes are amphipathic phospholipid bilayers carrying proteins and cholesterol; they wall off compartments and control what crosses. Small nonpolar molecules (O₂, CO₂, steroids) slip straight through, while ions and polar solutes need channels, carriers or pumps. Transport is passive when it runs down an electrochemical gradient (ΔG < 0) and active when it must be coupled to ATP hydrolysis or to another ion's gradient.","trap":null},{"id":"fluid-mosaic","title":"Fluid mosaic model","section":"bb","disc":"Cell & Molecular Bio","parent":"membranes","hub":false,"summary":"The fluid mosaic model treats the membrane as a two-dimensional fluid: lipids and many proteins drift sideways quickly, but flipping between leaflets is slow unless catalyzed by flippase or scramblase enzymes. Integral proteins span or embed in the hydrophobic core; peripheral proteins bind head groups or other proteins by ionic and hydrogen bonds. The two leaflets differ in composition, and glycoproteins and glycolipids face outward as the glycocalyx.","trap":null},{"id":"phospholipids","title":"Phospholipid bilayer","section":"bb","disc":"Cell & Molecular Bio","parent":"membranes","hub":false,"summary":"A glycerophospholipid has a glycerol backbone, two fatty acid tails, and a phosphate-linked polar head (choline, serine, ethanolamine). In water these amphipathic molecules spontaneously assemble into a bilayer, driven by the hydrophobic effect: hiding the tails frees ordered water and raises entropy. Short or cis-unsaturated (kinked) tails pack loosely and raise fluidity; long saturated tails pack tightly and stiffen the membrane.","trap":"Bilayer formation is driven mainly by the entropy gained by water (the hydrophobic effect), not by strong attractive bonds between the lipid tails."},{"id":"cholesterol-fluidity","title":"Cholesterol and membrane fluidity","section":"bb","disc":"Cell & Molecular Bio","parent":"membranes","hub":false,"summary":"Cholesterol wedges between phospholipids with its hydroxyl near the head groups and its rigid steroid rings among the tails. It buffers fluidity: at high temperature it restrains tail motion and lowers fluidity, and at low temperature it breaks up tight packing so the membrane does not solidify. It also reduces permeability to small water-soluble molecules and is concentrated in lipid rafts.","trap":"Cholesterol does not simply raise or lower fluidity; it lowers fluidity when warm and raises it when cold, stabilizing the membrane in both directions."},{"id":"simple-diffusion","title":"Simple diffusion","section":"bb","disc":"Cell & Molecular Bio","parent":"membranes","hub":false,"summary":"Simple diffusion is net movement of a solute straight through the lipid bilayer down its concentration gradient, with no protein and no energy input. Its rate rises linearly with the gradient and membrane area and falls with thickness (Fick's law), and it favors small, nonpolar, lipid-soluble molecules such as O₂, CO₂ and steroids. Ions and large polar molecules essentially cannot cross this way.","trap":"Simple diffusion never saturates; a transport rate that levels off at high concentration points to a carrier protein instead."},{"id":"facilitated-diffusion","title":"Facilitated diffusion","section":"bb","disc":"Cell & Molecular Bio","parent":"membranes","hub":false,"summary":"Facilitated diffusion moves polar or charged solutes down their electrochemical gradient through membrane proteins, without ATP. Channels (ion channels, aquaporins) form water-filled pores, many of them gated, while carriers such as GLUT transporters bind the solute and change shape to release it on the other side. Carriers have a finite number of sites, so flux saturates with Michaelis–Menten-like kinetics, showing a maximum rate and a Km-like affinity.","trap":"Facilitated diffusion is still passive: the protein speeds crossing but can never move a solute against its electrochemical gradient."},{"id":"active-transport","title":"Primary active transport","section":"bb","disc":"Cell & Molecular Bio","parent":"membranes","hub":false,"summary":"Primary active transport hydrolyzes ATP directly to pump solutes against their electrochemical gradient. P-type ATPases, such as the Na⁺/K⁺ ATPase, the SERCA Ca²⁺ pump and the gastric H⁺/K⁺ ATPase, are phosphorylated on an aspartate each cycle, which flips their conformation and ion affinity. The gradients they build store free energy that powers secondary transport, nerve signaling and pH control.","trap":null},{"id":"na-k-atpase","title":"Na⁺/K⁺ ATPase","section":"bb","disc":"Cell & Molecular Bio","parent":"active-transport","hub":false,"summary":"The Na⁺/K⁺ ATPase pumps 3 Na⁺ out and 2 K⁺ in for each ATP hydrolyzed, so it is electrogenic, exporting one net positive charge per cycle. It keeps cytosolic Na⁺ low and K⁺ high, which lets K⁺ leak channels set the resting potential, powers Na⁺-coupled secondary transport, and prevents osmotic swelling. Cardiac glycosides such as digoxin inhibit it.","trap":"The pump's direct electrogenic contribution to the resting potential is only a few millivolts; its main job is maintaining the ion gradients that leak channels use."},{"id":"secondary-active-transport","title":"Secondary active transport","section":"bb","disc":"Cell & Molecular Bio","parent":"membranes","hub":false,"summary":"Secondary active transport moves one solute uphill by coupling it to another ion, usually Na⁺ or H⁺, running downhill along a gradient that a primary pump created; the transporter itself hydrolyzes no ATP. Symporters move both in the same direction (SGLT carries Na⁺ and glucose into intestinal and kidney cells); antiporters move them oppositely (the Na⁺/Ca²⁺ exchanger expels Ca²⁺ from heart cells).","trap":"Secondary active transport still depends on ATP indirectly: poisoning the Na⁺/K⁺ ATPase dissipates the Na⁺ gradient and soon halts it."},{"id":"organelles","title":"Organelles","section":"bb","disc":"Cell & Molecular Bio","parent":null,"hub":true,"summary":"Eukaryotic cells divide labor among membrane-bound compartments: the nucleus stores DNA; the rough ER and Golgi build, modify and sort secretory and membrane proteins; the smooth ER makes lipids and detoxifies; lysosomes and peroxisomes break things down; mitochondria make most ATP. The endomembrane system is linked by vesicle traffic, and compartmentalization lets opposing pathways and different pH environments coexist.","trap":null},{"id":"rough-er","title":"Rough endoplasmic reticulum","section":"bb","disc":"Cell & Molecular Bio","parent":"organelles","hub":false,"summary":"The rough ER is studded with ribosomes making proteins bound for secretion, the plasma membra
