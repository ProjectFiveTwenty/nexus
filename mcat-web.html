","section":"cp","disc":"Gen Chem","parent":null,"hub":true,"summary":"Acids donate protons (or accept electron pairs) and bases accept them. Acid strength is measured by Ka or pKa and solution acidity by pH, linked through Kw = 1.0 × 10⁻¹⁴ at 25 °C. Weak acids mixed with their conjugate bases form buffers described by the Henderson–Hasselbalch equation, and titrations reveal pKa values and equivalence points. These ideas explain amino acid charge, enzyme catalysis, digestion and blood pH control.","trap":null},{"id":"bronsted-lewis","title":"Brønsted–Lowry and Lewis definitions","section":"cp","disc":"Gen Chem","parent":"acid-base","hub":false,"summary":"Arrhenius acids raise [H⁺] in water and bases raise [OH⁻]. Brønsted–Lowry acids donate protons and bases accept them, forming conjugate pairs that differ by one H⁺. Lewis acids accept an electron pair and Lewis bases donate one, a broader definition that includes BF₃, AlCl₃ and metal cations. Amphoteric species such as water, HCO₃⁻ and amino acids can act as either acid or base.","trap":null},{"id":"kw","title":"Autoionization of water (Kw)","section":"cp","disc":"Gen Chem","parent":"acid-base","hub":false,"summary":"Water self-ionizes: 2H₂O ⇌ H₃O⁺ + OH⁻, with Kw = [H⁺][OH⁻] = 1.0 × 10⁻¹⁴ at 25 °C, so pH + pOH = 14 and neutral water has pH 7. Autoionization is endothermic, so Kw grows with temperature and neutral pH falls (about 6.8 at 37 °C) even though the water stays neutral. For any conjugate pair, Ka × Kb = Kw.","trap":"Neutral means [H⁺] = [OH⁻], not pH 7; above 25 °C neutral water has a pH below 7."},{"id":"ph-poh","title":"pH and pOH","section":"cp","disc":"Gen Chem","parent":"acid-base","hub":false,"summary":"pH = −log[H⁺] and pOH = −log[OH⁻], with pH + pOH = 14 at 25 °C. Each pH unit is a tenfold change in [H⁺]. For strong acids [H⁺] equals the acid concentration (0.01 M HCl gives pH 2); for a weak acid, [H⁺] ≈ √(Ka × C). For quick estimates, if [H⁺] = a × 10⁻ⁿ with a between 1 and 10, the pH lies between n − 1 and n (3 × 10⁻⁵ M gives pH ≈ 4.5).","trap":"pH is logarithmic: a drop of 1 unit is a tenfold rise in [H⁺], and a drop of only 0.3 units roughly doubles it."},{"id":"strong-weak","title":"Strong vs. weak acids and bases","section":"cp","disc":"Gen Chem","parent":"acid-base","hub":false,"summary":"Strong acids (HCl, HBr, HI, HNO₃, HClO₄, and H₂SO₄ for its first proton) and strong bases (group 1 hydroxides and the heavier group 2 hydroxides) dissociate essentially completely; weak acids and bases ionize only partly. The stronger the acid, the weaker its conjugate base, so Cl⁻ is negligibly basic while acetate is a weak base. Acid strength reflects how well the conjugate base holds its negative charge.","trap":"Strength is not concentration: dilute HCl is still a strong acid and concentrated acetic acid is still weak."},{"id":"ka","title":"Acid dissociation constant (Ka)","section":"cp","disc":"Gen Chem","parent":"strong-weak","hub":false,"summary":"For HA ⇌ H⁺ + A⁻, Ka = [H⁺][A⁻]/[HA] and pKa = −log Ka; a larger Ka (smaller pKa) means a stronger acid. Ka × Kb = Kw links conjugates, so pKa + pKb = 14 at 25 °C. Approximate biochemical pKa values (α-carboxyl ~2, His side chain ~6, α-amino ~9–10) predict each group's charge at pH 7.4.","trap":"A larger Ka means a stronger acid, but a larger pKa means a weaker acid."},{"id":"buffers","title":"Buffers","section":"cp","disc":"Gen Chem","parent":"acid-base","hub":false,"summary":"A buffer is a weak acid plus its conjugate base (or a weak base plus its conjugate acid) in comparable amounts. Added H⁺ is absorbed by A⁻ and added OH⁻ by HA, so pH changes little. Buffering works best within about one unit of the pKa, and capacity grows with total concentration. Blood uses CO₂/HCO₃⁻ (pKa 6.1), which works at pH 7.4 because lungs and kidneys independently adjust both components.","trap":"Buffer pH depends on the ratio of base to acid, while buffer capacity depends on their concentrations; diluting a buffer barely changes its pH but lowers its capacity."},{"id":"hh","title":"Henderson–Hasselbalch equation","section":"cp","disc":"Gen Chem","parent":"buffers","hub":false,"summary":"pH = pKa + log([A⁻]/[HA]). At pH = pKa a group is half deprotonated, and each pH unit above the pKa raises the base-to-acid ratio tenfold. Groups are mostly protonated below their pKa and mostly deprotonated above it, which predicts amino acid charges, pI and drug ionization. For blood, pH = 6.1 + log([HCO₃⁻] / (0.03 × PCO₂)).","trap":"Protonated is not the same as positively charged: a protonated carboxyl (–COOH) is neutral, while a protonated amine (–NH₃⁺) is positive."},{"id":"titration","title":"Titration curves and indicators","section":"cp","disc":"Gen Chem","parent":"acid-base","hub":false,"summary":"A titration adds a measured titrant to find the amount of an analyte. Strong acid with strong base reaches equivalence at pH 7. Weak acid with strong base shows a flat buffer region, with pH = pKa at the half-equivalence point, and an equivalence pH above 7 because the conjugate base hydrolyzes (weak base with strong acid: below 7); polyprotic acids show one equivalence point per proton. Pick an indicator whose pKa is near the equivalence pH.","trap":"The equivalence point is where moles of titrant equal the moles of acid or base originally present, which is not necessarily pH 7."},{"id":"gas-laws","title":"Gas laws and kinetic molecular theory","section":"cp","disc":"Gen Chem","parent":null,"hub":true,"summary":"Gases are described by four variables, pressure, volume, absolute temperature and moles, tied together by PV = nRT; Boyle's, Charles's, Gay-Lussac's and Avogadro's laws are special cases that hold two variables fixed. Kinetic molecular theory explains these laws from molecular motion, Dalton's and Henry's laws handle mixtures and dissolved gases, and real gases deviate at high pressure and low temperature. In the body these laws govern breathing and gas exchange.","trap":null},{"id":"ideal-gas-law","title":"Ideal gas law (PV = nRT)","section":"cp","disc":"Gen Chem","parent":"gas-laws","hub":false,"summary":"PV = nRT combines the single-variable gas laws, with R = 0.0821 L·atm/(mol·K) or 8.314 J/(mol·K). For a fixed amount of gas it gives the combined gas law, P₁V₁/T₁ = P₂V₂/T₂. Rearranged, it yields moles from measured P, V and T, gas density (ρ = PM/RT) and molar mass. It assumes point particles with no attractions, so it works best at low pressure and high temperature.","trap":"R must match the units: 0.0821 L·atm/(mol·K) goes with liters and atmospheres, 8.314 J/(mol·K) with pascals and cubic meters; mixing them gives answers off by about 100-fold."},{"id":"boyles-law","title":"Boyle's law","section":"cp","disc":"Gen Chem","parent":"gas-laws","hub":false,"summary":"At constant temperature and amount of gas, pressure and volume are inversely proportional: P₁V₁ = P₂V₂, so halving the volume doubles the pressure. A P versus V plot is a hyperbola, while P versus 1/V is a straight line through the origin. Breathing is the classic application: enlarging the thorax drops alveolar pressure below atmospheric so air flows in, and shrinking it raises alveolar pressure so air flows out.","trap":null},{"id":"charles-law","title":"Charles's and Gay-Lussac's laws","section":"cp","disc":"Gen Chem","parent":"gas-laws","hub":false,"summary":"At constant pressure, volume is directly proportional to absolute temperature (Charles: V₁/T₁ = V₂/T₂). At constant volume, pressure is directly proportional to absolute temperature (Gay-Lussac: P₁/T₁ = P₂/T₂), which is why a heated sealed container can burst. Both lines extrapolate to zero at 0 K (−273.15 °C), the basis of the Kelvin scale.","trap":"Gas-law proportionalities hold only in kelvin: warming a gas from 20 °C to 40 °C raises its absolute temperature from 293 K to 313 K, about 7%, not double."},{"id":"avogadro-law","title":"Avogadro's law and molar volume","section":"cp","disc":"Gen Chem","parent":"gas-laws","hub":false,"summary":"At constant temperature and pressure, gas volume is proportional to moles (V/n is constant), so equal volumes of ideal gases at the same T and P contain equal numbers of molecules regardless of identity. At STP (0 °C, 1 atm) one mole occupies 22.4 L. Gas volumes measured at the same conditions can therefore be used directly as mole ratios: 2 L of H₂ react with 1 L of O₂.","trap":"22.4 L/mol applies only at STP (0 °C); at 25 °C and 1 atm a mole of ideal gas fills about 24.5 L, so don't use 22.4 L with thermodynamic standard conditions."},{"id":"daltons-law","title":"Dalton's law of partial pressures","section":"cp","disc":"Gen Chem","parent":"gas-laws","hub":false,"summary":"In a gas mixture each gas exerts the pressure it would exert alone, and the total is the sum: P_total = P₁ + P₂ + …, with each partial pressure Pᵢ = Xᵢ·P_total. Dry air is about 21% O₂, so at 760 mmHg PO₂ ≈ 160 mmHg. Air humidified in the airways carries water vapor at 47 mmHg (37 °C), lowering tracheal PO₂ to about 0.21 × (760 − 47) ≈ 150 mmHg.","trap":"At high altitude air is still about 21% O₂; PO₂ falls because total barometric pressure falls, not because the oxygen fraction drops."},{"id":"henrys-law","title":"Henry's law","section":"cp","disc":"Gen Chem","parent":"gas-laws","hub":false,"summary":"The concentration of a gas dissolved in a liquid is proportional to its partial pressure above the liquid: C = k_H·P, where k_H depends on the gas, the solvent and temperature. Gases become less soluble as temperature rises. In blood, dissolved O₂ is only about 0.3 mL/dL at a PO₂ of 100 mmHg, far less than hemoglobin carries, while CO₂ is about 20 times more soluble than O₂.","trap":"Henry's law covers only dissolved gas: arterial PO₂ reflects dissolved O₂, so anemia lowers total O₂ content but leaves PaO₂ normal."},{"id":"kmt","title":"Kinetic molecular theory","section":"cp","disc":"Gen Chem","parent":"gas-laws","hub":false,"summary":"Kinetic molecular theory models an ideal gas as point particles in constant random motion, with negligible volume, no attractions and perfectly elastic collisions. Average kinetic energy depends only on absolute temperature (3/2 kT per molecule), so lighter molecules move faster (v_rms = √(3RT/M)). Pressure comes from collisions with the walls, and speeds follow a Maxwell–Boltzmann distribution that flattens and shifts right as temperature rises.","trap":"At the same temperature all gases have the same average kinetic energy, not the same average speed; the lighter gas moves faster."},{"id":"grahams-law","title":"Graham's law of effusion","section":"cp","disc":"Gen Chem","parent":"kmt","hub":false,"summary":"Effusion through a tiny opening, and approximately diffusion through a gas, proceeds at a rate inversely proportional to the square root of molar mass: rate₁/rate₂ = √(M₂/M₁). At the same temperature H₂ (2 g/mol) effuses 4 times faster than O₂ (32 g/mol). The law follows from kinetic molecular theory: equal average kinetic energy means lighter molecules have higher speeds.","trap":"Keep the square root and the direction straight: a gas with 4 times the molar mass effuses half as fast, not one-quarter as fast, and the time to effuse a given amount grows with √M."},{"id":"real-gases","title":"Real gas behavior (van der Waals)","section":"cp","disc":"Gen Chem","parent":"gas-laws","hub":false,"summary":"Real gases deviate from ideal behavior at high pressure and low temperature, when molecules are crowded and slow. The van der Waals equation, (P + an²/V²)(V − nb) = nRT, corrects for intermolecular attractions (a), which make the measured pressure lower than ideal, and for the molecules' own volume (b), which makes a real gas occupy more volume than an ideal gas would. Small nonpolar gases such as He behave most ideally; larger or polar gases such as NH₃ deviate most.","trap":"The two corrections push in opposite directions: at moderate pressure or low temperature attractions dominate and the gas takes up less volume than ideal, while at very high pressure molecular volume dominates and it takes up more."},{"id":"phases","title":"Phases and phase changes","section":"cp","disc":"Gen Chem","parent":null,"hub":true,"summary":"Whether a substance is solid, liquid or gas depends on the contest between intermolecular forces, which hold particles together, and thermal energy, which drives them apart. Phase changes occur at constant temperature while absorbing or releasing latent heat; heating curves, phase diagrams and vapor pressure describe when they happen. Heat capacity and calorimetry quantify heat flow, linking this topic to enthalpy and to water's role in temperature control.","trap":null},{"id":"phase-changes","title":"Phase changes and latent heat","section":"cp","disc":"Gen Chem","parent":"phases","hub":false,"summary":"Melting, vaporization and sublimation absorb heat (ΔH > 0, ΔS > 0); freezing, condensation and deposition release it. Temperature stays constant during a phase change because the heat goes into overcoming intermolecular attractions, q = n·ΔH. Water's heat of vaporization (about 40.7 kJ/mol, 2260 J/g) is far larger than its heat of fusion (6.0 kJ/mol, 334 J/g), which makes evaporating sweat an effective way to shed heat.","trap":"Temperature does not rise during melting or boiling even though heat is being added; the energy raises potential energy by separating molecules, not their kinetic energy."},{"id":"heating-curves","title":"Heating curves","section":"cp","disc":"Gen Chem","parent":"phase-changes","hub":false,"summary":"A heating curve plots temperature against heat added. Sloped segments are one phase warming (q = mcΔT; the slope is inversely proportional to that phase's specific heat), and flat plateaus are phase changes (q = mΔH). For water, the boiling plateau is about 7 times longer than the melting plateau because ΔHvap greatly exceeds ΔHfus. A cooling curve is the mirror image, sometimes with a supercooling dip before freezing.","trap":"A shallower sloped segment means a higher specific heat: liquid water (4.18 J/(g·K)) warms more slowly per joule than ice or steam (about 2 J/(g·K))."},{"id":"phase-diagrams","title":"Phase diagrams","section":"cp","disc":"Gen Chem","parent":"phases","hub":false,"summary":"A phase diagram shows which phase is stable at each pressure and temperature; its lines mark conditions where two phases coexist at equilibrium. The liquid–gas line is the vapor-pressure curve, the solid–liquid line gives melting points, and the solid–gas line below the triple point marks sublimation. Water is unusual: its solid–liquid line slopes backward (negative slope) because ice is less dense than liquid water, so pressure can melt ice.","trap":"For water, raising pressure lowers the melting point (negative solid–liquid slope); for most substances, including CO₂, raising pressure raises it."},{"id":"triple-critical","title":"Triple point and critical point","section":"cp","disc":"Gen Chem","parent":"phase-diagrams","hub":false,"summary":"The triple point is the single temperature and pressure where solid, liquid and gas coexist (water: 0.01 °C, 0.006 atm). Below the triple-point pressure a solid sublimes instead of melting, which is why dry ice (CO₂, triple point about 5.1 atm) sublimes at 1 atm. The liquid–gas line ends at the critical point (water: about 374 °C, 218 atm); above the critical temperature no pressure can liquefy the gas, and beyond the critical point liquid and gas merge into a single supercritical fluid.","trap":null},{"id":"vapor-pressure","title":"Vapor pressure and boiling","section":"cp","disc":"Gen Chem","parent":"phases","hub":false,"summary":"Vapor pressure is the pressure of vapor in equilibrium with its liquid in a closed container. It rises steeply with temperature and is lower for liquids with stronger intermolecular forces. A liquid boils when its vapor pressure equals the external pressure, so the normal boiling point is defined at 1 atm, water boils below 100 °C at altitude, and pressure cookers raise the boiling point.","trap":"Vapor pressure depends only on the liquid's identity, temperature and any dissolved solute, not on how much liquid is present or the container's volume."},{"id":"heat-capacity","title":"Heat capacity and specific heat","section":"cp","disc":"Gen Chem","parent":"phases","hub":false,"summary":"Heat capacity (C) is the heat needed to raise an object's temperature by 1 K; specific heat (c) is per gram, giving q = mcΔT, and molar heat capacity is per mole. Water's specific heat, 4.18 J/(g·K) or 1 cal/(g·°C), is unusually high because added energy must disrupt hydrogen bonds, so oceans and water-rich bodies resist temperature swings. Metals have low specific heats and change temperature quickly.","trap":"A temperature change of 10 °C is a change of 10 K, not 283 K, so ΔT in q = mcΔT is the same in either unit; equations that use absolute temperature itself (gas laws, Π = iMRT, ΔG = ΔH − TΔS) do need kelvin."},{"id":"calorimetry","title":"Calorimetry","section":"cp","disc":"Gen Chem","parent":"heat-capacity","hub":false,"summary":"Calorimetry finds heat flow from the temperature change of a surrounding medium: q = mcΔT, with q_reaction = −q_calorimeter. A coffee-cup calorimeter runs at constant pressure, so it measures ΔH directly. A bomb calorimeter runs at constant volume, so no pressure–volume work is done and it measures ΔU; burning food in one gives its caloric content.","trap":"If the calorimeter water warms, the reaction released heat and is exothermic (ΔH < 0); the water's positive q belongs to the surroundings, not the reaction."},{"id":"solutions","title":"Solutions and colligative properties","section":"cp","disc":"Gen Chem","parent":null,"hub":true,"summary":"A solution is a homogeneous mixture of a solute dissolved in a solvent. Dissolving depends on breaking solute–solute and solvent–solvent attractions, forming solute–solvent attractions, and the entropy gained by mixing. Concentration units quantify solutions, and colligative properties (vapor-pressure lowering, boiling-point elevation, freezing-point depression, osmotic pressure) depend only on the number of dissolved particles; osmosis carries these ideas into cells, kidneys and capillaries.","trap":null},{"id":"solubility","title":"Solubility and \"like dissolves like\"","section":"cp","disc":"Gen Chem","parent":"solutions","hub":false,"summary":"Solubility is the maximum amount of solute that dissolves at equilibrium. 'Like dissolves like': ionic and polar solutes dissolve in polar solvents through ion–dipole forces and hydrogen bonds, and nonpolar solutes in nonpolar solvents. Most solids dissolve better when heated, while gases dissolve better when cold and at higher pressure. Amphipathic molecules such as soaps, phospholipids and bile salts bridge both worlds by forming micelles or bilayers.","trap":"Dissolving is not always exothermic: NH₄NO₃ dissolves endothermically in instant cold packs, driven by the entropy gained on mixing."},{"id":"concentration-units","title":"Concentration units","section":"cp","disc":"Gen Chem","parent":"solutions","hub":false,"summary":"Molarity (mol solute per L of solution) is the most common unit; molality (mol solute per kg of solvent) does not change with temperature and is used for boiling- and freezing-point shifts. Others include mass percent, mole fraction, ppm, normality (equivalents per liter, so 1 M H₂SO₄ is 2 N as an acid) and osmolarity (1 M NaCl ≈ 2 osmol/L). Dilution obeys M₁V₁ = M₂V₂ because moles of solute are conserved.","trap":"Molarity divides by liters of solution, while molality divides by kilograms of solvent; they are nearly equal only for dilute aqueous solutions."},{"id":"colligative","title":"Colligative properties","section":"cp","disc":"Gen Chem","parent":"solutions","hub":false,"summary":"Colligative properties depend on how many solute particles are dissolved, not on what they are: vapor-pressure lowering, boiling-point elevation (ΔTb = iKbm), freezing-point depression (ΔTf = iKfm) and osmotic pressure (Π = iMRT). All four arise because solute dilutes the solvent and raises its entropy, lowering its tendency to escape into vapor, to freeze, or to leave the solution across a membrane. The first two require a nonvolatile solute, and the van 't Hoff factor converts formula units to particles.","trap":null},{"id":"vant-hoff-factor","title":"van 't Hoff factor","section":"cp","disc":"Gen Chem","parent":"colligative","hub":false,"summary":"The van 't Hoff factor, i, is the number of particles each formula unit contributes in solution: 1 for nonelectrolytes such as glucose and urea, about 2 for NaCl, and about 3 for CaCl₂ or Na₂SO₄. Ion pairing makes the measured i of strong electrolytes slightly lower than ideal, especially when concentrated, and weak electrolytes such as acetic acid have i only slightly above 1. Every colligative equation multiplies concentration by i.","trap":"Covalent molecules such as glucose and sucrose do not dissociate, so i = 1 no matter how many atoms they contain."},{"id":"raoults-law","title":"Raoult's law and vapor-pressure lowering","section":"cp","disc":"Gen Chem","parent":"colligative","hub":false,"summary":"The vapor pressure of a solvent above a solution equals its mole fraction times the pure solvent's vapor pressure: P = X_solvent·P°. A nonvolatile solute therefore lowers vapor pressure in proportion to its own mole fraction. For two volatile liquids, P_total = X_A·P°_A + X_B·P°_B; positive deviations mean A–B attractions are weaker than in the pure liquids, and negative deviations mean they are stronger.","trap":null},{"id":"bp-elevation","title":"Boiling point elevation","section":"cp","disc":"Gen Chem","parent":"colligative","hub":false,"summary":"A nonvolatile solute lowers the solvent's vapor pressure, so the solution must be heated further before its vapor pressure reaches atmospheric pressure: ΔTb = i·Kb·m. For water Kb ≈ 0.51 °C·kg/mol, so a 1 m NaCl solution (i ≈ 2) boils about 1 °C higher. Molality is used because, unlike molarity, it does not change as the solution's volume expands with heating.","trap":null},{"id":"fp-depression","title":"Freezing point depression","section":"cp","disc":"Gen Chem","parent":"colligative","hub":false,"summary":"Dissolved solute stabilizes the liquid phase (raising its entropy) and is largely excluded from the solvent's crystal, so a solution freezes at a lower temperature: ΔTf = i·Kf·m, and the new freezing point is the pure solvent's minus ΔTf. For water Kf ≈ 1.86 °C·kg/mol, about 3.6 times Kb, so this is the larger, easier-to-measure effect. It explains road salt and antifreeze and is used by clinical osmometers.","trap":"Solute lowers the freezing point but raises the boiling point, widening the liquid range; both shifts use ΔT = iKm, but the freezing-point change is subtracted."},{"id":"osmotic-pressure","title":"Osmotic pressure (Π = iMRT)","section":"cp","disc":"Gen Chem","parent":"colligative","hub":false,"summary":"Osmotic pressure is the pressure needed to stop net water flow into a solution across a membrane permeable to water but not solute: Π = iMRT, with M in mol/L and T in kelvin. Water moves toward the side with higher osmotic pressure. Plasma at about 290 mOsm/L has an osmotic pressure near 7 atm, while plasma proteins, which cannot cross capillary walls, add a small but crucial oncotic pressure of about 25 mmHg.","trap":"A solution with higher osmotic pressure draws water in rather than pushing it out; Π measures the pull of the solute side, not an outward push."},{"id":"osmosis","title":"Osmosis and tonicity","section":"cp","disc":"Gen Chem","parent":"solutions","hub":false,"summary":"Osmosis is the net movement of water across a selectively permeable membrane toward the side with the higher concentration of impermeant solute particles, often through aquaporins. Tonicity compares impermeant solute relative to the cell: in a hypotonic solution cells swell and red cells can lyse, in a hypertonic one they shrink (crenate), and an isotonic one such as 0.9% NaCl causes no net change.","trap":"Isosmotic is not the same as isotonic: urea crosses membranes, so a urea solution isosmotic with plasma acts hypotonic and red cells swell and lyse in it."},{"id":"starling-forces","title":"Capillary exchange and Starling forces","section":"bb","disc":"Physiology","parent":"cardiovascular-system","hub":false,"summary":"Capillary fluid exchange is set by Starling forces: capillary hydrostatic pressure pushes fluid out, plasma oncotic pressure from proteins, mainly albumin (about 25 mmHg), pulls it back, and interstitial hydrostatic and oncotic pressures act in the opposite directions. In the classic MCAT model, filtration dominates at the arteriolar end and reabsorption at the venular end, with lymphatics returning the small net excess; newer work suggests venular reabsorption is more limited. Edema follows high capillary pressure, low albumin, leaky capillaries or blocked lymph.","trap":"Oncotic pressure comes from plasma proteins, not from Na⁺ or glucose: small solutes cross most capillary walls freely, so only proteins create a lasting osmotic difference there."},{"id":"resonance","title":"Resonance","section":"cp","disc":"Orgo","parent":null,"hub":false,"summary":"Resonance describes electrons delocalized over adjacent p orbitals; the real species is one weighted hybrid of the drawn structures. The best contributors have full octets, the least formal charge, and any negative charge on the more electronegative atom. Delocalization is stabilizing: it makes carboxylic acids and phenols far more acidic than alcohols and gives the amide C–N bond partial double-bond character, so peptide bonds are planar and rigid.","trap":"Resonance forms are not in equilibrium and do not interconvert; only electrons are redrawn between them, never atoms, and the molecule exists only as the hybrid."},{"id":"isomerism","title":"Nomenclature and isomerism","section":"cp","disc":"Orgo","parent":null,"hub":true,"summary":"Isomers have the same molecular formula but different arrangements. Structural (constitutional) isomers differ in connectivity; stereoisomers keep connectivity but differ in 3-D arrangement. Conformers interconvert by rotation about σ bonds, while configurational isomers (enantiomers and diastereomers) can only interconvert by breaking bonds. IUPAC names and R/S, E/Z and D/L labels specify which isomer is meant, and biology is highly selective about isomers.","trap":null},{"id":"iupac","title":"IUPAC nomenclature","section":"cp","disc":"Orgo","parent":"isomerism","hub":false,"summary":"An IUPAC name is built from the longest carbon chain containing the highest-priority functional group, numbered to give that group the lowest locant, with substituents listed alphabetically as prefixes. Suffix priority runs carboxylic acid > anhydride > ester > acid halide > amide > nitrile > aldehyde > ketone > alcohol > amine; double and triple bonds are shown in the parent name as -ene and -yne. Lower-priority groups become prefixes such as hydroxy-, oxo- and amino-.","trap":"When alphabetizing substituents, multiplying prefixes such as di-, tri- and tert- are ignored, so 'diethyl' sorts under e, not d."},{"id":"structural-isomers","title":"Structural isomers","section":"cp","disc":"Orgo","parent":"isomerism","hub":false,"summary":"Structural (constitutional) isomers share a molecular formula but have different bond connectivity, such as butane vs 2-methylpropane, or ethanol vs dimethyl ether. Because the bonding differs they may have different functional groups and very different properties: ethanol hydrogen-bonds and boils at 78 °C, while dimethyl ether boils near −24 °C. Within a family, more branching lowers boiling point by reducing surface contact for dispersion forces.","trap":null},{"id":"conformational-isomers","title":"Conformational isomers","section":"cp","disc":"Orgo","parent":"isomerism","hub":false,"summary":"Conformers are one molecule in different shapes produced by rotation about σ bonds; at room temperature they interconvert rapidly and cannot be separated. Their energies differ through torsional strain (eclipsed bonds), steric strain (bulky groups crowding each other) and, in rings, angle strain. Newman projections show conformations of open chains, and chair drawings show those of cyclohexane rings.","trap":null},{"id":"newman","title":"Newman projections","section":"cp","disc":"Orgo","parent":"conformational-isomers","hub":false,"summary":"A Newman projection looks straight down one C–C bond: the front carbon is the point where three bonds meet and the back carbon is the circle. For butane, anti (methyls 180° apart) is lowest in energy, gauche (60°, still staggered) is slightly higher because of steric strain between methyls, and the fully eclipsed form (0°) is highest because torsional and steric strain add together.","trap":null},{"id":"chair","title":"Chair conformations","section":"cp","disc":"Orgo","parent":"conformational-isomers","hub":false,"summary":"Cyclohexane adopts a chair with near-tetrahedral angles and every C–H staggered, so it has essentially no angle or torsional strain. Each carbon has one axial and one equatorial position, and a ring flip swaps them. Bulky groups prefer equatorial to avoid 1,3-diaxial interactions, and a tert-butyl group effectively locks the ring. β-D-glucopyranose puts every bulky substituent equatorial, which helps make it the dominant glucose form in solution.","trap":"A ring flip swaps axial and equatorial positions but never changes cis/trans relationships: a substituent pointing up stays up."},{"id":"stereoisomers","title":"Stereoisomers","section":"cp","disc":"Orgo","parent":"isomerism","hub":false,"summary":"Stereoisomers have identical connectivity but differ in spatial arrangement. Configurational stereoisomers, enantiomers and diastereomers (including cis/trans or E/Z isomers), interconvert only by breaking bonds. A molecule with n stereocenters has at most 2ⁿ stereoisomers, fewer if a meso form exists. Biology discriminates sharply between them: proteins use L-amino acids, cells use D-sugars, and receptors often respond to only one form.","trap":null},{"id":"chirality","title":"Chirality and chiral centers","section":"cp","disc":"Orgo","parent":"stereoisomers","hub":false,"summary":"An object is chiral if it cannot be superimposed on its mirror image; in organic molecules this usually comes from an sp³ carbon bearing four different groups. Chiral molecules lack an internal mirror plane, and a pure sample rotates plane-polarized light. Every standard amino acid except glycine has a chiral α-carbon, and because proteins are built only from L-amino acids, enzyme active sites and receptors are themselves chiral.","trap":null},{"id":"r-s","title":"R/S configuration","section":"cp","disc":"Orgo","parent":"chirality","hub":false,"summary":"R/S assigns absolute configuration with Cahn–Ingold–Prelog priorities: higher atomic number at the first point of difference wins, and multiple bonds count as duplicated atoms. With the lowest-priority group pointing away, a clockwise 1→2→3 path is R and counterclockwise is S; if the lowest group points toward the viewer, reverse the answer. R/S is unrelated to the sign of optical rotation and only loosely tied to D/L.","trap":"R does not mean dextrorotatory (+); the direction a compound rotates light must be measured and cannot be predicted from its R/S label."},{"id":"enantiomers","title":"Enantiomers","section":"cp","disc":"Orgo","parent":"stereoisomers","hub":false,"summary":"Enantiomers are non-superimposable mirror images, inverted at every stereocenter. In achiral surroundings they share melting point, boiling point, solubility and spectra, but they rotate plane-polarized light by equal angles in opposite directions; specific rotation [α] = α/(l·c), and a 50:50 racemic mixture shows no net rotation. They behave differently in chiral environments such as enzyme active sites and receptors.","trap":"Enantiomers cannot be separated by ordinary distillation or recrystallization because their physical properties are identical; resolving them requires something chiral, typically a chiral reagent that converts them into separable diastereomers."},{"id":"diastereomers","title":"Diastereomers","section":"cp","disc":"Orgo","parent":"stereoisomers","hub":false,"summary":"Diastereomers are stereoisomers that are not mirror images: they differ at some but not all stereocenters, or are cis/trans (E/Z) isomers about a double bond or ring. Unlike enantiomers they have different physical properties, so they separate by distillation, crystallization or chromatography. Epimers differ at exactly one stereocenter (D-glucose and D-galactose at C-4), and anomers are epimers at the anomeric (hemiacetal) carbon.","trap":"Cis and trans alkenes are diastereomers, not structural isomers or conformers: their connectivity is the same and they interconvert only if the π bond breaks."},{"id":"meso","title":"Meso compounds","section":"cp","disc":"Orgo","parent":"diastereomers","hub":false,"summary":"A meso compound has two or more stereocenters but an internal mirror plane, so it is superimposable on its mirror image, achiral and optically inactive. meso-Tartaric acid and meso-2,3-dibromobutane are classic examples, each with an (R,S) arrangement. The meso form is a diastereomer of the chiral (R,R)/(S,S) pair, which is why tartaric acid has three stereoisomers rather than the 2ⁿ = 4 maximum.","trap":"Meso compounds and racemic mixtures are both optically inactive, but a meso compound is a single achiral molecule while a racemate is a 50:50 mix of two chiral ones whose rotations cancel."},{"id":"fischer","title":"Fischer projections","section":"cp","disc":"Orgo","parent":"stereoisomers","hub":false,"summary":"A Fischer projection draws each stereocenter as a cross: horizontal bonds point toward the viewer and vertical bonds point away. Sugars and amino acids are drawn with the most oxidized carbon at the top; if the OH (sugars, at the highest-numbered stereocenter) or NH₂ (amino acids) is on the right the molecule is D, on the left it is L. When the lowest-priority group is horizontal, the apparent R/S must be reversed.","trap":"Rotating a Fischer projection 90° or swapping one pair of groups inverts the configuration; a 180° in-plane rotation or an even number of swaps keeps it."},{"id":"substitution-elimination","title":"Substitution and elimination","section":"cp","disc":"Orgo","parent":null,"hub":true,"summary":"When a substrate with a leaving group meets a nucleophile or base, four pathways compete: SN1, SN2, E1 and E2. The outcome depends on substrate (methyl and 1° favor SN2; 3° favors SN1, E1 or E2), nucleophile strength versus base strength and bulk, leaving-group quality, solvent and temperature. Unimolecular paths share a carbocation intermediate and first-order kinetics; bimolecular paths are concerted and second order. Heat favors elimination, which increases entropy.","trap":null},{"id":"sn1","title":"SN1 reactions","section":"cp","disc":"Orgo","parent":"substitution-elimination","hub":false,"summary":"SN1 is a two-step substitution: the leaving group departs to form a planar carbocation (the slow, rate-determining step), then a nucleophile attacks either face. Rate = k[substrate], independent of the nucleophile, so weak nucleophiles such as water work. It is favored by 3°, allylic or benzylic substrates, good leaving groups and polar protic solvents; a chiral center gives a largely racemic product, and the cation may rearrange by hydride or methyl shifts.","trap":"Adding more or stronger nucleophile does not speed an SN1 reaction, because the nucleophile is not part of the rate-determining step."},{"id":"sn2","title":"SN2 reactions","section":"cp","disc":"Orgo","parent":"substitution-elimination","hub":false,"summary":"SN2 is a concerted, one-step substitution in which the nucleophile attacks the carbon from the side opposite the leaving group (backside attack) through a five-coordinate transition state. Rate = k[substrate][nucleophile]. Steric hindrance dominates: methyl > 1° > 2°, and 3° substrates essentially do not react. Strong nucleophiles and polar aprotic solvents favor it, and a stereocenter is inverted. Biological methyl transfers from SAM follow this pattern.","trap":"Inversion of geometry does not always flip the R/S label; if the nucleophile's CIP priority differs from the leaving group's, an inverted product can keep the same letter."},{"id":"e1","title":"E1 reactions","section":"cp","disc":"Orgo","parent":"substitution-elimination","hub":false,"summary":"E1 is a two-step elimination: ionization to a carbocation (rate-determining) followed by loss of a β-proton to a weak base, often the solvent. Rate = k[substrate], so it competes with SN1 under the same conditions (3° substrate, protic solvent, weak base), with heat tipping the balance toward elimination. Because the carbocation is free, E1 has no geometric requirement, usually gives the more substituted alkene and can rearrange. Acid-catalyzed alcohol dehydration is a classic example.","trap":null},{"id":"e2","title":"E2 reactions","section":"cp","disc":"Orgo","parent":"substitution-elimination","hub":false,"summary":"E2 is a concerted elimination: a strong base removes a β-hydrogen while the leaving group departs and the π bond forms in one step. Rate = k[substrate][base]. The β-H and leaving group must be anti-periplanar, which in cyclohexanes means both axial (trans-diaxial). Small strong bases such as ethoxide give mainly the more substituted Zaitsev alkene, bulky bases such as tert-butoxide give the less substituted Hofmann alkene, and no rearrangement occurs.","trap":"On a cyclohexane, E2 can occur only when the leaving group is axial with an axial β-H on a neighboring carbon; if no chair puts it there, E2 is blocked even with a strong base."},{"id":"carbocations","title":"Carbocation stability","section":"cp","disc":"Orgo","parent":"substitution-elimination","hub":false,"summary":"Carbocations are sp², trigonal planar, electron-deficient intermediates with an empty p orbital. Stability rises methyl < 1° < 2° < 3° because alkyl groups donate electron density by hyperconjugation and induction, and resonance with an adjacent π bond (allylic, benzylic) stabilizes them strongly. Since they form in the slow step of SN1 and E1, more stable cations mean faster reactions, and less stable ones can rearrange by 1,2-hydride or methyl shifts to more stable ones.","trap":null},{"id":"leaving-groups","title":"Leaving group ability","section":"cp","disc":"Orgo","parent":"substitution-elimination","hub":false,"summary":"Good leaving groups are weak bases that can stabilize the electron pair they take with them, typically the conjugate bases of strong acids. Among halides I⁻ > Br⁻ > Cl⁻ >> F⁻; sulfonates (tosylate, mesylate) are excellent and water is good, while HO⁻, RO⁻ and NH₂⁻ are poor, so alcohols must be protonated or converted to sulfonates first. Cells use the same logic by turning OH groups into phosphate or pyrophosphate leaving groups.","trap":"Fluoride is a poor leaving group despite fluorine's high electronegativity, because F⁻ is the strongest base among the halides and the C–F bond is very strong."},{"id":"nucleophiles","title":"Nucleophile strength","section":"cp","disc":"Orgo","parent":"substitution-elimination","hub":false,"summary":"A nucleophile donates an electron pair to an electron-poor atom, and nucleophilicity is a kinetic property. Negative charge raises it (HO⁻ > H₂O), and across a period it tracks basicity (NH₂⁻ > HO⁻ > F⁻). Down a group the order depends on solvent: in protic solvents larger, more polarizable ions win (I⁻ > Br⁻ > Cl⁻ > F⁻) because small anions are caged by hydrogen bonds, while in aprotic solvents the order follows basicity. Bulk lowers nucleophilicity more than basicity.","trap":"Nucleophilicity and basicity are not interchangeable: basicity is an equilibrium property, nucleophilicity a rate, and the two diverge down a group in protic solvents."},{"id":"solvent-effects","title":"Protic vs. aprotic solvents","section":"cp","disc":"Orgo","parent":"substitution-elimination","hub":false,"summary":"Polar protic solvents (water, alcohols, carboxylic acids) have O–H or N–H bonds that hydrogen-bond to anions and solvate ions strongly, so they favor SN1 and E1 by stabilizing the carbocation and departing leaving group. Polar aprotic solvents (DMSO, DMF, acetone, acetonitrile) dissolve salts but leave anions poorly solvated and highly reactive, which favors SN2. A useful test: does the mechanism create ions in its slow step?","trap":null},{"id":"zaitsev","title":"Zaitsev's rule","section":"cp","disc":"Orgo","parent":"substitution-elimination","hub":false,"summary":"Zaitsev's rule predicts that elimination usually gives the more substituted alkene as the major product, because extra alkyl groups stabilize the π bond by hyperconjugation; trans alkenes are also favored over cis. E1 and E2 with small bases follow it. Bulky bases such as tert-butoxide remove the most accessible β-hydrogen and give the less substituted Hofmann product instead, and E2 geometry can also force a less substituted alkene.","trap":null},{"id":"carbonyl-chemistry","title":"Carbonyl chemistry","section":"cp","disc":"Orgo","parent":null,"hub":true,"summary":"The C=O bond is polarized toward oxygen, leaving an electrophilic carbonyl carbon and making α-hydrogens weakly acidic (pKa about 17–20). Aldehydes and ketones undergo nucleophilic addition, while carboxylic acid derivatives with leaving groups undergo acyl substitution. Enols and enolates turn the α-carbon into a nucleophile for aldol reactions, and oxidation and reduction link alcohols, aldehydes, ketones and acids. Much of metabolism runs on these same reactions.","trap":null},{"id":"nucleophilic-addition","title":"Nucleophilic addition to aldehydes and ketones","section":"cp","disc":"Orgo","parent":"carbonyl-chemistry","hub":false,"summary":"A nucleophile attacks the electrophilic carbon of an aldehyde or ketone, turning the trigonal sp² carbon into a tetrahedral sp³ one; with no leaving group present, the oxygen is protonated to an alcohol. Water gives hydrates, one alcohol gives a hemiacetal and a second gives an acetal (acid-catalyzed), HCN gives cyanohydrins, and primary amines give imines after loss of water. Aldehydes react faster than ketones, and sugar ring closure is intramolecular hemiacetal formation.","trap":"Hemiacetals form and reopen easily (sugars mutarotate), but acetals are stable in base and hydrolyze only in aqueous acid, which is why glycosidic bonds are stable at neutral pH."},{"id":"alcohol-oxidation","title":"Oxidation of alcohols","section":"cp","disc":"Orgo","parent":"carbonyl-chemistry","hub":false,"summary":"Primary alcohols oxidize to aldehydes and then carboxylic acids, secondary alcohols oxidize to ketones, and tertiary alcohols resist oxidation because the carbinol carbon has no hydrogen to lose. Strong aqueous oxidants (chromic acid/Jones reagent, KMnO₄, dichromate) take primary alcohols to acids, while PCC in anhydrous solvent stops at the aldehyde. In cells NAD⁺ is the usual oxidant, accepting a hydride from the alcohol carbon.","trap":"PCC stops at the aldehyde largely because it is used without water; in water the aldehyde forms a hydrate that is oxidized further to the carboxylic acid."},{"id":"carbonyl-reduction","title":"Reduction of carbonyls","section":"cp","disc":"Orgo","parent":"carbonyl-chemistry","hub":false,"summary":"Hydride reagents reduce carbonyls by nucleophilic addition of H⁻: aldehydes give primary alcohols and ketones give secondary alcohols. NaBH₄ is mild and reduces aldehydes and ketones but not esters, acids or amides; LiAlH₄ is strong and reduces all of them, taking esters and acids to primary alcohols and amides to amines. In cells NADH and NADPH are the hydride donors.","trap":"NaBH₄ does not reduce carboxylic acids or esters under normal conditions; only a strong hydride source such as LiAlH₄ does."},{"id":"acid-derivatives","title":"Carboxylic acid derivatives","section":"cp","disc":"Orgo","parent":"carbonyl-chemistry","hub":false,"summary":"Acid derivatives bond an acyl group to a heteroatom that can leave. Reactivity toward nucleophiles follows leaving-group ability and how little the heteroatom donates by resonance: acyl halide > anhydride > ester ≈ carboxylic acid > amide, with thioesters more reactive than ordinary esters. A derivative converts easily into a less reactive one but not directly into a more reactive one. Amides are the least reactive of these, so peptide bonds persist, while thioesters such as acetyl-CoA act as activated acyl donors.","trap":"Free carboxylic acids do not react with amines or alkoxides by acyl substitution under mild conditions: the base simply deprotonates the acid to a carboxylate, which is very unreactive, so acids are first activated or esterified under acid catalysis."},{"id":"acyl-sub","title":"Nucleophilic acyl substitution","section":"cp","disc":"Orgo","parent":"acid-derivatives","hub":false,"summary":"In nucleophilic acyl substitution a nucleophile adds to the carbonyl carbon of an acid derivative, forming a tetrahedral intermediate that collapses to expel the leaving group and regenerate C=O (addition–elimination). Hydrolysis, Fischer esterification, transesterification and aminolysis are all examples. Reactions run downhill toward the derivative with the poorer leaving group, which is why amides form readily from activated acyl donors. Ribosomes, serine proteases and lipases all use this mechanism.","trap":null},{"id":"aldol","title":"Aldol condensation","section":"cp","disc":"Orgo","parent":"carbonyl-chemistry","hub":false,"summary":"In an aldol reaction, the enolate (or enol) of one carbonyl compound adds to the carbonyl carbon of another, forming a new C–C bond and a β-hydroxy aldehyde or ketone. Heating dehydrates the product to an α,β-unsaturated carbonyl; that loss of water makes it a condensation. Crossed aldols work cleanly when one partner lacks α-hydrogens. The reverse, retro-aldol cleavage, splits a β-hydroxy carbonyl into two smaller carbonyl compounds.","trap":null},{"id":"decarboxylation","title":"Decarboxylation","section":"cp","disc":"Orgo","parent":"carbonyl-chemistry","hub":false,"summary":"Decarboxylation removes a carboxyl group as CO₂. It happens readily on mild heating when a carbonyl sits β to the carboxylic acid (β-keto acids, malonic acids), because a cyclic six-membered transition state gives an enol that tautomerizes to the final carbonyl product. In metabolism, the pyruvate dehydrogenase complex and isocitrate and α-ketoglutarate dehydrogenases perform oxidative decarboxylations, and PLP-dependent decarboxylases make amine neurotransmitters.","trap":"Ordinary carboxylic acids do not lose CO₂ easily on heating; the β-carbonyl is what makes decarboxylation facile."},{"id":"tautomerism","title":"Keto–enol tautomerism","section":"cp","disc":"Orgo","parent":"carbonyl-chemistry","hub":false,"summary":"Keto and enol tautomers are constitutional isomers that interconvert by moving a proton and shifting the double bond (O=C–C–H ⇌ HO–C=C), catalyzed by acid or base. For simple aldehydes and ketones the keto form dominates because C=O is stronger than C=C. Enols and enolates make the α-carbon nucleophilic, which enables aldol chemistry and racemizes α-stereocenters. Sugar isomerases work through enediol tautomers.","trap":"Tautomers are not resonance structures: a hydrogen atom actually moves, so they are two distinct compounds in equilibrium."},{"id":"aromatic","title":"Aromaticity and Hückel's rule","section":"cp","disc":"Orgo","parent":null,"hub":true,"summary":"A ring is aromatic if it is cyclic, planar, fully conjugated (a p orbital on every ring atom) and holds 4n + 2 π electrons (Hückel's rule: 2, 6, 10…). Aromaticity gives large extra stability, so benzene undergoes substitution rather than addition, while otherwise similar rings with 4n π electrons are antiaromatic and destabilized. Phe, Tyr, Trp, His and the nucleotide bases are aromatic, which makes them flat and prone to stacking; Trp, Tyr and the bases also absorb strongly in the UV.","trap":"A lone pair counts toward the π total only if it sits in a ring p orbital: pyrrole's N lone pair is part of the aromatic sextet, but pyridine's is not."},{"id":"eas","title":"Electrophilic aromatic substitution (EAS)","section":"cp","disc":"Orgo","parent":"aromatic","hub":false,"summary":"In electrophilic aromatic substitution, the ring's π electrons attack a strong electrophile to form a resonance-stabilized carbocation (arenium ion or σ complex), and loss of a proton restores aromaticity. Breaking aromaticity makes the first step slow, so reactive electrophiles are generated with Lewis acids (Br₂/FeBr₃, Cl₂/AlCl₃) or strong acids (HNO₃/H₂SO₄). Halogenation, nitration, sulfonation and Friedel–Crafts alkylation and acylation are the main examples.","trap":null},{"id":"directing-groups","title":"Activating, deactivating and directing groups","section":"cp","disc":"Orgo","parent":"eas","hub":false,"summary":"Substituents already on a benzene ring control both the rate and the position of further substitution. Electron-donating groups (–OH, –NH₂, –OR, alkyl) activate the ring and direct ortho/para, because attack at those positions lets them stabilize the arenium ion. Electron-withdrawing groups (–NO₂, –CN, –SO₃H, –CHO, –COOH, –CF₃) deactivate the ring and direct meta. Halogens are the exception: deactivating by induction yet ortho/para-directing through lone-pair resonance.","trap":"Halogens deactivate the ring yet direct ortho/para, so they should not be lumped with the meta-directing withdrawing groups."},{"id":"spectroscopy","title":"Spectroscopy","section":"cp","disc":"Orgo","parent":null,"hub":true,"summary":"Spectroscopy identifies molecules by how they absorb electromagnetic energy, each technique matching photon energy (E = hf) to a different transition. IR (bond vibrations) reveals functional groups, ¹H-NMR (nuclear spin flips in a magnetic field) maps hydrogen environments and connectivity, and UV–Vis (electronic transitions) detects conjugation and measures concentration. Mass spectrometry, which absorbs no light, gives molecular mass and fragments.","trap":null},{"id":"ir","title":"IR spectroscopy","section":"cp","disc":"Orgo","parent":"spectroscopy","hub":false,"summary":"IR spectroscopy detects bond vibrations that change a molecule's dipole moment. Key peaks: broad alcohol O–H near 3200–3600 cm⁻¹, very broad carboxylic acid O–H about 2500–3300, N–H near 3300, sp³ C–H just below 3000, C≡C or C≡N near 2100–2260, and a strong, sharp C=O near 1650–1750. Below about 1500 cm⁻¹ lies the fingerprint region, unique to each compound. Symmetric bonds with no dipole change are IR-inactive.","trap":null},{"id":"nmr","title":"¹H-NMR spectroscopy","section":"cp","disc":"Orgo","parent":"spectroscopy","hub":false,"summary":"¹H-NMR places a sample in a strong magnetic field and detects radio-frequency absorption as protons flip spin. Chemical shift (ppm from TMS) reflects shielding: alkyl ~0.9–1.5, next to C=O ~2–2.5, next to O or halogen ~3–4, vinylic ~4.5–6.5, aromatic ~6.5–8, aldehyde ~9–10, carboxylic acid ~10–12. Integration gives relative numbers of H, and splitting follows the n + 1 rule for non-equivalent neighbors.","trap":"Electronegative neighbors deshield protons and move them downfield (higher ppm), not upfield."},{"id":"uv-spec","title":"UV–Vis spectroscopy and Beer–Lambert","section":"cp","disc":"Orgo","parent":"spectroscopy","hub":false,"summary":"UV–Vis spectroscopy measures electronic transitions, mainly π → π* in conjugated systems; more conjugation narrows the HOMO–LUMO gap and shifts absorption to longer wavelengths, so highly conjugated molecules look colored (the complement of the absorbed color). The Beer–Lambert law, A = εlc, makes absorbance proportional to concentration and path length. Proteins are measured near 280 nm (Trp, Tyr) and nucleic acids near 260 nm.","trap":"Absorbance is logarithmic, A = −log T, so 10% transmittance means A = 1 and 1% means A = 2; absorbance, not transmittance, is linear in concentration."},{"id":"mass-spec","title":"Mass spectrometry","section":"cp","disc":"Orgo","parent":"spectroscopy","hub":false,"summary":"Mass spectrometry ionizes molecules, often knocking out an electron to form a radical cation, then separates ions by mass-to-charge ratio using electric and magnetic fields. The molecular ion (M⁺) gives molecular mass, the base peak is the most abundant ion, and isotope patterns identify atoms: an M+2 peak about one-third the height of M⁺ signals Cl, and near-equal M and M+2 peaks signal Br. In a magnetic sector, r = mv/(qB), so at equal charge heavier ions curve less.","trap":"The base peak is simply the tallest peak, not necessarily the molecular ion, which can be small or absent."},{"id":"kinematics","title":"Kinematics and dynamics","section":"cp","disc":"Physics","parent":null,"hub":true,"summary":"Kinematics describes motion with displacement, velocity and acceleration; dynamics explains it with forces through Newton's laws. Under constant acceleration four equations (v = v₀ + at, Δx = v₀t + ½at², v² = v₀² + 2aΔx, Δx = ½(v₀ + v)t) solve most problems, including projectiles. Torque, center of mass and centripetal force extend the same force logic to rotation, balance and circular motion.","trap":null},{"id":"motion-vectors","title":"Displacement, velocity and acceleration","section":"cp","disc":"Physics","parent":"kinematics","hub":false,"summary":"Displacement (vector) is the straight-line change in position; distance (scalar) is total path length. Velocity = Δx/Δt and acceleration = Δv/Δt are vectors, while speed is a scalar. On graphs, the slope of position vs. time is velocity, the slope of velocity vs. time is acceleration, and the area under a velocity–time curve is displacement.","trap":"At the top of a vertical toss the velocity is zero but the acceleration is still g (≈ 9.8 m/s²) downward, not zero."},{"id":"projectile-motion","title":"Projectile motion","section":"cp","disc":"Physics","parent":"kinematics","hub":false,"summary":"Without air resistance, horizontal and vertical motion are independent: horizontal velocity stays constant while vertical motion accelerates at g ≈ 9.8 m/s² downward. Flight time is set by the vertical motion alone. On level ground the range is v₀²sin2θ/g, maximal at 45°, and complementary angles such as 30° and 60° give equal ranges.","trap":"A ball dropped and a ball fired horizontally from the same height land at the same time, because horizontal speed has no effect on vertical fall."},{"id":"newtons-laws","title":"Newton's laws","section":"cp","disc":"Physics","parent":"kinematics","hub":false,"summary":"First law: an object keeps a constant velocity unless a net force acts (inertia, measured by mass). Second law: F_net = ma, so net force determines acceleration, not velocity. Third law: forces come in equal, opposite pairs acting on different objects. Free-body diagrams with weight (mg), normal force, tension and friction solve most problems; on an incline the downhill gravity component is mg sinθ.","trap":"Weight and normal force on a resting book are not a third-law pair: they act on the same object and are equal only when no other vertical forces act."},{"id":"friction","title":"Static and kinetic friction","section":"cp","disc":"Physics","parent":"newtons-laws","hub":false,"summary":"Friction opposes relative sliding between surfaces. Static friction adjusts to whatever value prevents motion, up to a maximum of μs·N; once sliding, kinetic friction is roughly constant at μk·N, and because μk < μs, starting an object moving takes more force than keeping it moving. Friction is non-conservative and turns mechanical energy into heat.","trap":"μs·N is only the maximum static friction; the actual static friction equals just the force needed to keep the object at rest."},{"id":"centripetal","title":"Centripetal force and acceleration","section":"cp","disc":"Physics","parent":"newtons-laws","hub":false,"summary":"An object moving in a circle at constant speed still accelerates toward the center, with a = v²/r and F = mv²/r. Centripetal force is not a separate force but the net inward result of tension, gravity, friction, normal or magnetic force. Because it is perpendicular to velocity it does no work, so it changes direction but not speed; centrifuges exploit large effective accelerations to sediment particles.","trap":"There is no outward centrifugal force on the object; if the inward force disappears it moves off along the tangent, not radially outward."},{"id":"torque","title":"Torque and rotational equilibrium","section":"cp","disc":"Physics","parent":"kinematics","hub":false,"summary":"Torque τ = rF sinθ is a force's turning effect, depending on lever-arm distance and angle; it is zero when the force points through the pivot and maximal when perpendicular to the lever arm. Rotational equilibrium requires Στ = 0 (clockwise torques equal counterclockwise), and full static equilibrium also needs ΣF = 0. Body joints act as levers, so a muscle inserted close to a joint must pull much harder than the load it holds.","trap":"A force applied parallel to the lever arm produces zero torque, no matter how large; only the perpendicular component turns the object."},{"id":"center-of-mass","title":"Center of mass","section":"cp","disc":"Physics","parent":"kinematics","hub":false,"summary":"The center of mass is the mass-weighted average position, x_cm = Σmᵢxᵢ / Σmᵢ; in uniform gravity it coincides with the center of gravity, where an object's whole weight can be treated as acting. An object is stable when its center of mass lies over its base of support. External forces accelerate the center of mass as if all mass were concentrated there, regardless of internal motions.","trap":null},{"id":"work-energy","title":"Work, energy and power","section":"cp","disc":"Physics","parent":null,"hub":true,"summary":"Work, W = Fd cosθ, transfers energy by a force acting through a displacement. Kinetic energy (½mv²) and potential energies (mgh, ½kx², electric) interconvert; with only conservative forces, mechanical energy is conserved, while friction converts it to heat. Power is the rate of energy transfer. The same accounting underlies the first law of thermodynamics, electric potential energy and cellular energy use.","trap":null},{"id":"work-energy-theorem","title":"Work–energy theorem","section":"cp","disc":"Physics","parent":"work-energy","hub":false,"summary":"The net work done on an object equals its change in kinetic energy: W_net = ΔKE = ½mv_f² − ½mv_i². Since W = Fd cosθ, a force perpendicular to motion (normal force on level ground, centripetal force) does no work, and a force opposing motion does negative work. Because it uses net work, it accounts for every force at once, including friction and applied forces.","trap":"Holding a heavy object still does no mechanical work on it (d = 0), even though muscles burn metabolic energy to do it."},{"id":"conservative-forces","title":"Conservative vs. non-conservative forces","section":"cp","disc":"Physics","parent":"work-energy","hub":false,"summary":"A conservative force (gravity, spring, electrostatic) does work that depends only on the start and end points, so its work around any closed path is zero and a potential energy can be defined for it. Non-conservative forces (friction, air resistance, viscous drag) do path-dependent work that dissipates mechanical energy as heat. Total energy is always conserved; only mechanical energy is lost.","trap":null},{"id":"energy-conservation","title":"Conservation of mechanical energy","section":"cp","disc":"Physics","parent":"work-energy","hub":false,"summary":"With only conservative forces acting, KE + PE is constant: ½mv₁² + mgh₁ = ½mv₂² + mgh₂. An object falling from rest through height h reaches v = √(2gh) regardless of mass, and pendulums and roller coasters trade height for speed. When friction acts, its work W_nc = ΔKE + ΔPE is negative, and the mechanical energy lost appears as heat.","trap":null},{"id":"power-efficiency","title":"Power and efficiency","section":"cp","disc":"Physics","parent":"work-energy","hub":false,"summary":"Power is the rate of doing work or transferring energy: P = W/t = Fv, in watts (J/s). Efficiency is useful work output divided by energy input and is always below 100% because some energy becomes heat. Human muscle converts only about a fifth to a quarter of metabolic energy into mechanical work, with the rest warming the body.","trap":null},{"id":"fluids","title":"Fluids","section":"cp","disc":"Physics","parent":null,"hub":true,"summary":"Fluids (liquids and gases) flow and exert pressure perpendicular to surfaces. Fluid statics covers density, hydrostatic pressure, Pascal's principle and buoyancy; fluid dynamics covers continuity, Bernoulli's equation and viscous flow (Poiseuille). Together they model blood circulation, airflow in the lungs, glomerular filtration and surface forces in alveoli.","trap":null},{"id":"density","title":"Density and specific gravity","section":"cp","disc":"Physics","parent":"fluids","hub":false,"summary":"Density ρ = m/V; water is about 1 g/cm³ = 1000 kg/m³. Specific gravity is ρ/ρ_water, a unitless ratio: an object with SG below 1 floats in water, and the fraction submerged equals its SG. Density sets hydrostatic pressure (ρgh), buoyant force and acoustic impedance, and differences in size and density let centrifugation separate cell parts and macromolecules.","trap":null},{"id":"hydrostatic-pressure","title":"Hydrostatic pressure","section":"cp","disc":"Physics","parent":"fluids","hub":false,"summary":"Pressure in a static fluid rises with depth: P = P₀ + ρgh, where P₀ is the surface pressure (often atmospheric, about 1.01×10⁵ Pa). Gauge pressure is the excess over atmospheric (ρgh in an open container) and is what blood-pressure readings report. Pressure depends only on depth and density, not container shape; about 10 m of water adds roughly 1 atm.","trap":"Absolute pressure includes atmospheric pressure while gauge pressure does not, so check which one a question asks for."},{"id":"pascal","title":"Pascal's principle","section":"cp","disc":"Physics","parent":"hydrostatic-pressure","hub":false,"summary":"A pressure change applied to an enclosed, incompressible fluid is transmitted undiminished to every part of the fluid and its container. In a hydraulic lift F₁/A₁ = F₂/A₂, so a small force on a small piston produces a large force on a large piston. Because the displaced volume is equal (A₁d₁ = A₂d₂), the small piston moves farther, and the work in equals the work out.","trap":null},{"id":"archimedes","title":"Archimedes' principle","section":"cp","disc":"Physics","parent":"fluids","hub":false,"summary":"A submerged or floating object feels an upward buoyant force equal to the weight of fluid it displaces: F_b = ρ_fluid·V_submerged·g. An object floats if its average density is less than the fluid's, with a submerged fraction of ρ_object/ρ_fluid. Buoyancy arises from greater fluid pressure on the object's lower surface than its upper surface.","trap":"The buoyant force uses the fluid's density and displaced volume, not the object's density, and does not grow with depth once the object is fully submerged."},{"id":"continuity","title":"Continuity equation","section":"cp","disc":"Physics","parent":"fluids","hub":false,"summary":"For incompressible flow, volume flow rate Q = Av is constant along a tube, so fluid speeds up where the cross-section narrows; this is conservation of mass. In the circulation the same flow passes through every level of vessels, and because the combined cross-sectional area of the capillaries is enormous, blood moves slowest there, allowing time for exchange.","trap":"Each capillary is tiny, yet blood is slowest in capillaries because their total cross-sectional area is the largest of any vessel class."},{"id":"bernoulli","title":"Bernoulli's equation","section":"cp","disc":"Physics","parent":"fluids","hub":false,"summary":"For ideal flow (incompressible, nonviscous, steady), P + ½ρv² + ρgh is constant along a streamline: conservation of energy per unit volume. Where fluid speeds up its static pressure drops, and at a fixed speed, pressure also drops as the fluid rises. Combined with continuity, it explains Venturi meters, atomizers and the fast, low-pressure jet through a narrowed heart valve.","trap":"Bernoulli ignores viscosity; real blood loses pressure along a vessel to resistance, which Poiseuille's law describes."},{"id":"venturi","title":"Venturi effect","section":"cp","disc":"Physics","parent":"bernoulli","hub":false,"summary":"In a Venturi tube, a constriction speeds the flow (continuity), and the faster fluid has lower pressure (Bernoulli), shown by a lower fluid column in a manometer at the throat. The measured pressure difference reveals the flow rate. The same effect lets fast air draw liquid up in atomizers and can lower pressure on the walls of narrowed, collapsible airways.","trap":"Pressure is lowest at the narrow throat, where flow is fastest, not highest; the intuition that squeezing a flow raises its pressure fails here."},{"id":"poiseuille","title":"Viscosity and Poiseuille's law","section":"cp","disc":"Physics","parent":"fluids","hub":false,"summary":"Viscosity (η) is a fluid's internal resistance to flow. For laminar flow in a tube, Q = πr⁴ΔP / (8ηL), so resistance R = 8ηL/(πr⁴). Because flow scales with r⁴, halving a vessel's radius cuts flow 16-fold at the same pressure, which is why arterioles control vascular resistance and bronchoconstriction impedes airflow. Thicker blood (higher hematocrit) raises resistance.","trap":"Flow depends on the fourth power of radius, not on cross-sectional area (r²); a small radius change has a huge effect."},{"id":"surface-tension","title":"Surface tension","section":"cp","disc":"Physics","parent":"fluids","hub":false,"summary":"Cohesive forces at a liquid's surface make it behave like a stretched film, with surface tension γ measured as force per length; water's is high because of hydrogen bonding. Adhesion versus cohesion sets meniscus shape and capillary rise. In alveoli, surface tension tends to collapse small sacs (Laplace: P = 2γ/r), and surfactant lowers it, stabilizing alveoli and easing inflation.","trap":"By P = 2γ/r, a smaller bubble or alveolus has the higher collapsing pressure at the same surface tension, so without surfactant small alveoli would empty into larger ones."},{"id":"electrostatics","title":"Electrostatics and magnetism","section":"cp","disc":"Physics","parent":null,"hub":true,"summary":"Charges create electric fields; a charge moving through a potential difference gains or loses potential energy; moving charges also create and feel magnetic fields. Coulomb's law gives the force, while field and voltage describe it per unit charge, and capacitors store separated charge. These ideas underlie membrane potentials, nerve conduction, ionic and polar interactions, electrophoresis, mass spectrometry and MRI.","trap":null},{"id":"coulomb","title":"Coulomb's law","section":"cp","disc":"Physics","parent":"electrostatics","hub":false,"summary":"F = kq₁q₂/r² (k ≈ 9×10⁹ N·m²/C²): like charges repel, opposite charges attract, and the force falls with the square of distance, so doubling r quarters F. In a medium the force is divided by the dielectric constant, so water (about 80) greatly weakens ionic attraction, helping salts dissolve, while charge pairs buried in a protein's nonpolar interior interact much more strongly.","trap":"Doubling one charge doubles the force, but doubling the separation cuts the force to one quarter, not one half."},{"id":"electric-field","title":"Electric field","section":"cp","disc":"Physics","parent":"electrostatics","hub":false,"summary":"The electric field E = F/q is the force per unit positive test charge (N/C = V/m); a point charge gives E = kQ/r². Field lines point away from positive and toward negative charges; a positive charge accelerates along the field and a negative charge against it. Between parallel plates the field is uniform with E = V/d, a model for the field across a cell membrane.","trap":"Field lines show the direction of force on a positive charge; an electron accelerates opposite to the field lines."},{"id":"electric-potential-energy","title":"Electric potential energy","section":"cp","disc":"Physics","parent":"electrostatics","hub":false,"summary":"U = kq₁q₂/r is the energy stored in a pair of charges: positive for like charges and negative (bound) for opposite charges. Moving a charge q through a potential difference ΔV changes its energy by ΔU = qΔV. Systems move spontaneously toward lower U, so positive charges move toward lower potential and negative charges toward higher potential.","trap":"Electric potential energy (joules) depends on the charge placed there, while electric potential (volts = J/C) does not; the two are easily confused."},{"id":"electric-potential","title":"Electric potential (voltage)","section":"cp","disc":"Physics","parent":"electrostatics","hub":false,"summary":"Electric potential V = U/q = kQ/r is potential energy per unit charge, a scalar measured in volts. Only differences matter: moving charge q through ΔV transfers qΔV of energy, and 1 eV = 1.6×10⁻¹⁹ J. Equipotential surfaces are perpendicular to field lines, so moving along one takes no work. Membrane potentials, cell voltages and circuit voltages are all potential differences.","trap":"Potential is a scalar, so contributions from several charges add algebraically with sign, while electric fields add as vectors."},{"id":"capacitance","title":"Capacitance and dielectrics","section":"cp","disc":"Physics","parent":"electrostatics","hub":false,"summary":"A capacitor stores equal and opposite charge on two conductors: C = Q/V, and for parallel plates C = κε₀A/d, so larger plates, a smaller gap or a dielectric raise capacitance. Stored energy is U = ½CV² = ½QV. The lipid bilayer acts as a capacitor separating ions across a few nanometers, and myelin lowers this capacitance.","trap":"Adding a dielectric to an isolated capacitor keeps Q fixed and lowers V; if the capacitor stays connected to a battery, V is fixed and Q increases."},{"id":"lorentz-force","title":"Lorentz force on moving charges","section":"cp","disc":"Physics","parent":"electrostatics","hub":false,"summary":"A charge moving through a magnetic field feels F = qvB sinθ, perpendicular to both v and B (right-hand rule; reverse for negative charges). Since the force is always perpendicular to velocity it does no work, changing direction but not speed, which produces circular motion with r = mv/(qB). With an electric field present, the total force is qE + qv×B.","trap":"A stationary charge, or one moving parallel to the field lines, feels no magnetic force at all."},{"id":"magnetic-fields","title":"Magnetic fields from currents","section":"cp","disc":"Physics","parent":"electrostatics","hub":false,"summary":"Moving charges and currents create magnetic fields, measured in tesla. A long straight wire makes circular field lines around it with B = μ₀I/(2πr), direction given by the right-hand rule, and loops or solenoids concentrate the field along their axis. Parallel currents in the same direction attract. Superconducting coils in MRI produce strong fields (commonly 1.5–3 T) that align nuclear spins.","trap":"Parallel wires carrying current in the same direction attract; it is like charges, not like currents, that repel."},{"id":"circuits","title":"Circuits","section":"cp","disc":"Physics","parent":null,"hub":true,"summary":"Circuits move charge around closed loops driven by an emf. Ohm's law links voltage, current and resistance; Kirchhoff's rules, built on conservation of charge and energy, give the series and parallel rules for resistors and capacitors; power measures the rate of energy delivery. The same framework models blood flow (ΔP = QR), neurons as RC circuits and electrochemical cells.","trap":null},{"id":"ohms-law","title":"Ohm's law","section":"cp","disc":"Physics","parent":"circuits","hub":false,"summary":"V = IR: current through an ohmic conductor is proportional to the voltage across it. Resistance R = ρL/A rises with length and resistivity and falls with cross-sectional area. Current I = Q/t (amperes) is defined as the flow of positive charge, opposite to electron drift. A real battery has internal resistance, so its terminal voltage is emf − Ir while current flows.","trap":null},{"id":"resistors","title":"Resistors in series and parallel","section":"cp","disc":"Physics","parent":"circuits","hub":false,"summary":"Resistors in series carry the same current and add directly (R_eq = R₁ + R₂ + …), so voltage divides in proportion to resistance. Resistors in parallel share the same voltage and add reciprocally (1/R_eq = 1/R₁ + 1/R₂ + …), so R_eq is smaller than the smallest branch and more current takes the low-resistance path. Most organ circulations are arranged in parallel.","trap":"Adding another resistor in parallel lowers total resistance and increases the total current drawn from the source."},{"id":"capacitors-circuits","title":"Capacitors in series and parallel","section":"cp","disc":"Physics","parent":"circuits","hub":false,"summary":"Capacitors combine opposite to resistors: in parallel they add directly (C_eq = C₁ + C₂), sharing voltage; in series they add reciprocally (1/C_eq = 1/C₁ + 1/C₂), carrying equal charge. In an RC circuit, charge rises or decays exponentially with time constant τ = RC. Neuronal membranes act as RC circuits, which sets how quickly their voltage can change.","trap":null},{"id":"kirchhoff","title":"Kirchhoff's rules","section":"cp","disc":"Physics","parent":"circuits","hub":false,"summary":"The junction rule states that total current entering a node equals total current leaving it (conservation of charge). The loop rule states that the potential changes around any closed loop sum to zero (conservation of energy): voltage gained across a battery equals the drops across resistors. Together they derive the series and parallel rules and solve multi-loop circuits.","trap":null},{"id":"electrical-power","title":"Electrical power","section":"cp","disc":"Physics","parent":"circuits","hub":false,"summary":"Power delivered to a circuit element is P = IV = I²R = V²/R, in watts; energy used is P × t. Resistors dissipate this energy as heat. In series, where current is shared, the larger resistor dissipates more power (I²R); in parallel, where voltage is shared, the smaller resistor dissipates more (V²/R).","trap":null},{"id":"ac-rms","title":"Alternating current and RMS","section":"cp","disc":"Physics","parent":"circuits","hub":false,"summary":"In alternating current, voltage and current vary sinusoidally, so their simple average is zero. Root-mean-square values give the equivalent steady DC for power: V_rms = V_max/√2 ≈ 0.707 V_max, and likewise for current. US household 120 V at 60 Hz is an rms value with a peak near 170 V, and average power in a resistor is I_rms·V_rms.","trap":"Quoted AC voltages are rms values; the peak voltage is √2 times higher."},{"id":"waves-sound","title":"Waves and sound","section":"cp","disc":"Physics","parent":null,"hub":true,"summary":"Waves carry energy without net transport of matter. Transverse waves (light, a plucked string) oscillate perpendicular to travel, while longitudinal waves (sound) oscillate parallel to it as compressions and rarefactions. Key ideas, v = fλ, superposition, standing waves, intensity in decibels and the Doppler effect, explain hearing, pitch, ultrasound imaging and Doppler blood-flow measurement.","trap":null},{"id":"wave-properties","title":"Wave properties","section":"cp","disc":"Physics","parent":"waves-sound","hub":false,"summary":"Wave speed equals frequency × wavelength (v = fλ); the medium sets the speed and the source sets the frequency, so crossing into a new medium changes wavelength but not frequency. Period T = 1/f, and intensity is proportional to amplitude squared. Sound travels about 343 m/s in air and about 1540 m/s in soft tissue, generally fastest in stiff solids and slowest in gases.","trap":"Raising a sound's frequency does not change its speed in a given medium; its wavelength shortens instead."},{"id":"superposition","title":"Superposition","section":"cp","disc":"Physics","parent":"waves-sound","hub":false,"summary":"When waves overlap, their displacements add point by point. Waves in phase (path difference of whole wavelengths) interfere constructively; waves half a wavelength (180°) out of phase interfere destructively. Two tones of slightly different frequency produce beats at f_beat = |f₁ − f₂|. Superposition underlies standing waves, noise-cancelling headphones and light interference and diffraction patterns.","trap":null},{"id":"standing-waves","title":"Standing waves and harmonics","section":"cp","disc":"Physics","parent":"superposition","hub":false,"summary":"Waves reflecting back and forth superpose into standing waves with fixed nodes and antinodes. A string fixed at both ends, or a pipe open at both ends, supports λ = 2L/n and f = nv/(2L) for all integers n. A pipe closed at one end has a node at the closed end and an antinode at the open end, so λ = 4L/n with only odd harmonics (n = 1, 3, 5…).","trap":"A pipe closed at one end has only odd harmonics, and its fundamental is half the frequency of an open pipe of the same length."},{"id":"sound-intensity","title":"Sound intensity and decibels","section":"cp","disc":"Physics","parent":"waves-sound","hub":false,"summary":"Intensity is power per unit area (W/m²) and, from a point source, falls as 1/r² (inverse square). Sound level in decibels is β = 10 log(I/I₀), with I₀ = 10⁻¹² W/m², the threshold of hearing. Each +10 dB is a tenfold rise in intensity, +20 dB is 100-fold, and about +3 dB doubles intensity. Intensity scales with amplitude squared.","trap":"Doubling the intensity adds only about 3 dB; it does not double the decibel value."},{"id":"doppler","title":"Doppler effect","section":"cp","disc":"Physics","parent":"waves-sound","hub":false,"summary":"When source and observer approach, the observed frequency is higher than emitted; when they separate, it is lower: f′ = f(v ± v_o)/(v ∓ v_s), using the upper signs for motion toward each other. The source's own frequency never changes. Doppler ultrasound measures the shift of echoes from moving red blood cells to find the speed and direction of blood flow.","trap":"A source approaching at constant speed gives a constant raised pitch, not a rising one; the shift depends on relative velocity, not distance."},{"id":"ultrasound","title":"Ultrasound","section":"cp","disc":"Physics","parent":"waves-sound","hub":false,"summary":"Medical ultrasound uses sound far above the 20 kHz limit of hearing (typically about 2–15 MHz), made by piezoelectric transducers. Pulses reflect at boundaries between tissues of different acoustic impedance, and echo time gives depth via d = vt/2 with v ≈ 1540 m/s. Higher frequency gives finer resolution but less penetration; gel eliminates air, which would reflect nearly all the sound.","trap":"Higher frequency gives sharper resolution but less penetration, so deep structures are imaged at lower frequencies, not higher ones."},{"id":"optics","title":"Light and optics","section":"cp","disc":"Physics","parent":null,"hub":true,"summary":"Light is an electromagnetic wave that also behaves as particles (photons) with energy E = hf. Geometric optics (reflection, refraction, mirrors and lenses) explains image formation in the eye and microscopes; wave optics (diffraction, interference and polarization)
