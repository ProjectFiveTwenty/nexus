nce","hub":false,"summary":"Stigma (Goffman) is strong disapproval of a person or group based on a trait seen as discrediting, which spoils their social identity. A discredited stigma is already visible or known (a disfigurement); a discreditable one is hidden but could be revealed (HIV status, a past psychiatric admission). Stigma toward mental illness, addiction and HIV discourages testing, help-seeking and treatment adherence, and self-stigma arises when people internalize it.","trap":null},{"id":"anomie","title":"Anomie","section":"ps","disc":"Sociology","parent":"norms-deviance","hub":false,"summary":"Anomie (Durkheim) is a breakdown of social norms and bonds that leaves people without clear guidance about what to want or how to act; it tends to arise during rapid social or economic change, and Durkheim linked it to anomic suicide. Merton's strain theory recast it as a gap between culturally valued goals and access to legitimate means, producing five responses: conformity, innovation, ritualism, retreatism and rebellion.","trap":"In Merton's typology, innovation keeps the goals but uses illegitimate means (e.g., theft), while ritualism abandons the goals but rigidly follows the rules."},{"id":"social-institutions","title":"Social institutions","section":"ps","disc":"Sociology","parent":null,"hub":true,"summary":"Social institutions are durable, organized structures that meet a society's core needs: family, education, religion, the economy, government and medicine. Functionalism stresses how they keep society stable, conflict theory how they preserve dominant groups' advantages, and symbolic interactionism how their meanings are built in everyday interaction. Medicine as an institution introduces medicalization and the sick role.","trap":null},{"id":"family","title":"Family and kinship","section":"ps","disc":"Sociology","parent":"social-institutions","hub":false,"summary":"Kinship links people by blood (consanguineous), marriage (affinal) or chosen bonds (fictive kin). Families may be nuclear or extended, and descent may be patrilineal, matrilineal or bilateral. Marriage forms include monogamy and polygamy, with polygyny (one husband, several wives) and polyandry (one wife, several husbands). The family is the primary agent of socialization and passes wealth and status across generations; family violence includes child, elder and partner abuse.","trap":null},{"id":"education","title":"Education and the hidden curriculum","section":"ps","disc":"Sociology","parent":"social-institutions","hub":false,"summary":"Schools teach academics plus a hidden curriculum: unstated norms such as punctuality, obedience, competition and deference to authority. Teacher expectancy (the Pygmalion effect) is a self-fulfilling prophecy in which teachers' beliefs about students shape their performance, though later studies found the effect usually modest. Tracking, school funding tied to local property taxes (as in much of the U.S.) and segregation create educational stratification, so schooling can either drive mobility or reproduce class.","trap":null},{"id":"religion","title":"Religious organizations","section":"ps","disc":"Sociology","parent":"social-institutions","hub":false,"summary":"Religious organizations range from the church or ecclesia (large, tied to the state) and denominations (large, mainstream, coexisting with others) to sects (smaller groups that broke away and stand in tension with society) and cults or new religious movements (novel beliefs, high tension). Secularization is religion's declining influence with modernization; fundamentalism reasserts strict literal tradition. Durkheim stressed solidarity; Weber linked Protestantism to capitalism.","trap":"A sect breaks away from an existing religion, whereas a cult or new religious movement introduces largely new beliefs."},{"id":"economy-government","title":"Government and economic systems","section":"ps","disc":"Sociology","parent":"social-institutions","hub":false,"summary":"Economies range from capitalism (private ownership, market prices) to socialism (collective or state ownership, planning). Durkheim contrasted mechanical solidarity (sameness in simple societies) with organic solidarity (interdependence from a complex division of labor). Weber named three types of legitimate authority: traditional, charismatic and rational-legal. Government forms include democracy, monarchy, authoritarianism, totalitarianism and theocracy.","trap":"Mechanical solidarity holds simple societies together through sameness, organic solidarity holds complex societies together through specialization; students often reverse them."},{"id":"medicalization","title":"Medicalization","section":"ps","disc":"Sociology","parent":"social-institutions","hub":false,"summary":"Medicalization is the process by which nonmedical problems come to be defined and treated as medical conditions, extending physicians' authority. Examples include alcoholism, ADHD, childbirth, menopause and obesity. Demedicalization reverses the process, as when the American Psychiatric Association voted in 1973 to remove homosexuality from its diagnostic manual (DSM). Medicalization can reduce blame and open access to treatment, but it can also pathologize normal variation.","trap":null},{"id":"sick-role","title":"Sick role","section":"ps","disc":"Sociology","parent":"social-institutions","hub":false,"summary":"Talcott Parsons' sick role, a functionalist model, treats illness as socially sanctioned deviance with rights and obligations. Rights: the sick person is excused from normal duties and not blamed for being ill. Obligations: they must want to get well and must seek technically competent help and cooperate with it. Critics note it fits acute illness better than chronic, stigmatized or mental illness.","trap":null},{"id":"research-design","title":"Research design","section":"ps","disc":"Research & Statistics","parent":null,"hub":true,"summary":"Research design is the plan for collecting data to answer a question. Experiments manipulate an independent variable and randomly assign participants, so they can support causal claims; observational studies (cohort, case-control, cross-sectional) only measure, so they show associations open to confounding. Good designs limit bias with comparison groups, random sampling and assignment, blinding, and valid, reliable measures, all within ethical limits.","trap":"Random sampling and random assignment do different jobs: random sampling lets results generalize to the population (external validity), while random assignment lets differences be attributed to the independent variable (internal validity)."},{"id":"scientific-method","title":"Scientific method and hypotheses","section":"ps","disc":"Research & Statistics","parent":"research-design","hub":false,"summary":"The scientific method moves from observation to a question, a testable and falsifiable hypothesis, predictions, a test by experiment or observation, analysis and conclusions, then replication by others. A hypothesis is a narrow, testable explanation; a theory is a broad explanation supported by many tested hypotheses; a law describes a regular pattern without explaining it. Statistical testing recasts the hypothesis as a null and an alternative.","trap":"Hypotheses are never proven, only supported or refuted, and theories do not graduate into laws: a theory explains why something happens, while a law describes what happens."},{"id":"experimental-design","title":"Experimental design","section":"ps","disc":"Research & Statistics","parent":"research-design","hub":false,"summary":"In a true experiment the researcher manipulates an independent variable, randomly assigns participants to conditions and measures a dependent variable while holding other factors constant. Between-subjects designs put different people in each condition; within-subjects (repeated-measures) designs test everyone in every condition and use counterbalancing to offset order effects. Quasi-experiments compare pre-existing groups, so confounds cannot be fully excluded.","trap":null},{"id":"variables","title":"Independent, dependent and confounding variables","section":"ps","disc":"Research & Statistics","parent":"experimental-design","hub":false,"summary":"The independent variable (IV) is what the researcher manipulates or uses to define groups, plotted on the x-axis; the dependent variable (DV) is the measured outcome, on the y-axis. Each must be operationally defined, stating exactly how it is manipulated or measured. A confounding variable is an extraneous factor linked to both IV and DV that offers an alternative explanation; a mediator lies on the causal path, while a moderator changes the strength of an effect.","trap":null},{"id":"controls","title":"Control groups and placebos","section":"ps","disc":"Research & Statistics","parent":"experimental-design","hub":false,"summary":"A control group experiences everything the experimental group does except the manipulation, giving a baseline for comparison. A positive control is expected to show the effect, proving the method can detect it; a negative control is expected to show none, revealing contamination or false positives. A placebo is an inert treatment that looks like the real one, separating a drug's specific effect from the placebo effect caused by expectation.","trap":null},{"id":"randomization","title":"Random assignment and blinding","section":"ps","disc":"Research & Statistics","parent":"experimental-design","hub":false,"summary":"Random assignment gives each participant an equal chance of being placed in any condition, so known and unknown confounds (age, genes, SES, motivation) are spread evenly on average and outcome differences can be credited to the IV. Single-blind designs hide group membership from participants, limiting placebo effects and demand characteristics. Double-blind designs also hide it from the researchers who treat or assess participants, limiting experimenter expectancy and observer bias.","trap":null},{"id":"observational-studies","title":"Observational studies (cohort, case-control, cross-sectional)","section":"ps","disc":"Research & Statistics","parent":"research-design","hub":false,"summary":"Observational studies measure exposures and outcomes without assigning them, used when manipulation is impossible or unethical. Cohort studies select people by exposure and follow them for new cases (incidence, relative risk). Case-control studies select people by outcome (cases vs. controls) and look back at past exposures; they suit rare diseases, yield odds ratios and suffer recall bias. Cross-sectional studies measure exposure and outcome at one moment, giving prevalence but not timing.","trap":"A case-control study cannot give incidence or relative risk, because the researcher chose how many cases to include; it estimates an odds ratio instead."},{"id":"relative-risk","title":"Relative risk and odds ratio","section":"ps","disc":"Research & Statistics","parent":"observational-studies","hub":false,"summary":"In a 2×2 table (exposed a, b; unexposed c, d; disease in a and c), relative risk RR = [a/(a+b)] ÷ [c/(c+d)], the incidence in the exposed divided by the incidence in the unexposed, computed from cohort studies or trials. The odds ratio OR = ad/bc compares odds and is the measure for case-control studies. A value of 1 means no association, above 1 increased risk, below 1 a protective effect; attributable risk is the difference in incidences.","trap":"The odds ratio approximates the relative risk only when the outcome is rare; for common outcomes the OR lies farther from 1 than the RR and exaggerates the apparent effect."},{"id":"correlation-causation","title":"Correlation vs. causation","section":"ps","disc":"Research & Statistics","parent":"research-design","hub":false,"summary":"A correlation shows that two variables vary together, not that one causes the other. The link may run in reverse (reverse causation), come from a third variable driving both (confounding, as hot weather raises both ice cream sales and drownings) or arise by chance. Causation is best shown by randomized experiments; with observational data, evidence such as temporal order, a dose–response pattern, consistency across studies and a plausible mechanism strengthens a causal case.","trap":"A very strong correlation (r near ±1) is no better evidence of causation than a weak one; strength describes how tightly variables move together, not why."},{"id":"sampling","title":"Sampling and selection bias","section":"ps","disc":"Research & Statistics","parent":"research-design","hub":false,"summary":"A sample is studied to draw conclusions about a population. In simple random sampling every member has an equal chance of selection; stratified sampling divides the population into subgroups (strata) and samples from each, often in proportion to its size; convenience sampling (such as student volunteers) is easy but often unrepresentative. Selection bias occurs when the sample differs systematically from the population, through volunteer bias, attrition (loss to follow-up) or the healthy worker effect.","trap":"A larger sample shrinks random sampling error but does nothing to correct selection bias; a huge sample drawn the wrong way is still biased."},{"id":"validity-reliability","title":"Validity and reliability","section":"ps","disc":"Research & Statistics","parent":"research-design","hub":false,"summary":"Reliability is consistency: a measure gives similar results across time (test–retest), raters (inter-rater) and items (internal consistency). Validity is accuracy: it measures what it claims to (construct, content and criterion or predictive validity). Internal validity is confidence that the IV caused the change in the DV; external validity is how well results generalize to other people and settings. A measure can be reliable without being valid.","trap":"Reliability is necessary but not sufficient for validity: a scale that always reads 2 kg too high is perfectly reliable yet invalid, much like precise but inaccurate lab measurements."},{"id":"research-ethics","title":"Research ethics (informed consent, IRB)","section":"ps","disc":"Research & Statistics","parent":"research-design","hub":false,"summary":"The Belmont Report's principles are respect for persons (voluntary informed consent, extra protection for vulnerable groups such as children and prisoners), beneficence (maximize benefits, minimize harm) and justice (fair selection of who bears risks and gains benefits). An institutional review board (IRB) must approve human research. Participants may withdraw at any time without penalty and are owed confidentiality. Abuses such as the Tuskegee syphilis study drove these rules.","trap":"Deception is not automatically forbidden; an IRB may allow it when necessary and low risk, followed by debriefing, but the right to withdraw at any time without penalty can never be waived."},{"id":"statistics","title":"Statistics","section":"ps","disc":"Research & Statistics","parent":null,"hub":true,"summary":"Statistics turns data into conclusions. Descriptive statistics summarize a sample's center, spread and shape; inferential statistics use a sample to judge the wider population and quantify uncertainty with p-values and confidence intervals. The shape of a distribution decides which summary fits, and diagnostic measures such as sensitivity and predictive values apply the same logic to tests. MCAT science passages routinely require reading graphs, error bars and significance claims.","trap":"Statistical significance is not practical or clinical importance: with a very large sample, a trivially small effect can reach p < 0.05."},{"id":"descriptive-stats","title":"Measures of central tendency and spread","section":"ps","disc":"Research & Statistics","parent":"statistics","hub":false,"summary":"Central tendency: the mean (sum ÷ n) uses every value but is pulled by outliers; the median (middle value) resists outliers; the mode (most frequent value) is the only one usable for nominal (unordered categorical) data. Spread: range (max − min), interquartile range (Q3 − Q1, resistant to outliers), variance (average squared deviation from the mean) and standard deviation (square root of variance, in the data's units). Outliers are often defined as beyond 1.5 × IQR from the quartiles.","trap":null},{"id":"normal-distribution","title":"Normal distribution","section":"ps","disc":"Research & Statistics","parent":"statistics","hub":false,"summary":"The normal distribution is a symmetric bell curve with mean = median = mode, fully described by μ and σ. By the 68–95–99.7 rule, about 68% of values fall within ±1σ, 95% within ±2σ and 99.7% within ±3σ. A z-score, z = (x − μ)/σ, gives distance from the mean in standard deviations. By the central limit theorem, sample means approach a normal distribution as sample size grows, even if the population is not normal.","trap":null},{"id":"skewed-distributions","title":"Skewed distributions","section":"ps","disc":"Research & Statistics","parent":"statistics","hub":false,"summary":"Skew is named for the direction of the long tail. In a positive (right) skew the tail points toward high values and mean > median > mode, as in income, wealth and hospital length of stay. In a negative (left) skew the tail points toward low values and mean < median < mode, as in scores on an easy exam. Because the mean is dragged toward the tail, the median better describes the typical value; a bimodal shape often signals two subgroups.","trap":"Skew is named for the tail, not the peak: when most scores pile up at the high end with a few low stragglers, the distribution is negatively (left) skewed."},{"id":"hypothesis-testing","title":"Hypothesis testing and p-values","section":"ps","disc":"Research & Statistics","parent":"statistics","hub":false,"summary":"The null hypothesis (H₀) states no effect or no difference; the alternative (Hₐ) states there is one. A test statistic is converted to a p-value, the probability of results at least as extreme as those observed if H₀ were true. If p < α (usually 0.05) the result is statistically significant and H₀ is rejected; otherwise we fail to reject it. Common tests: t-test (two means), ANOVA (three or more means) and chi-square (categorical counts).","trap":"A p-value of 0.03 is not a 3% chance that the null hypothesis is true; it is the probability of data this extreme assuming the null is true, and failing to reject H₀ does not prove it."},{"id":"type-errors","title":"Type I and type II errors","section":"ps","disc":"Research & Statistics","parent":"hypothesis-testing","hub":false,"summary":"A type I error rejects a true null hypothesis, a false positive that claims an effect that is not real; its probability is α, the significance level. A type II error fails to reject a false null, a false negative that misses a real effect; its probability is β, and power = 1 − β. For a fixed sample size, lowering α to cut false positives raises β. Courtroom analogy: convicting an innocent defendant is type I, acquitting a guilty one is type II.","trap":"Students often swap them: type I is the false positive (finding an effect that is not there) and type II is the false negative (missing an effect that is there)."},{"id":"statistical-power","title":"Statistical power","section":"ps","disc":"Research & Statistics","parent":"hypothesis-testing","hub":false,"summary":"Power is the probability of rejecting a false null hypothesis, that is, of detecting a real effect: power = 1 − β. It rises with larger sample size, larger true effect size, less variability in the data and a higher α (at the cost of more type I errors). Studies are usually planned for about 80% power, and power analysis before data collection sets the sample size needed.","trap":"A nonsignificant result from a small, underpowered study is not evidence of no effect, since it may be a type II error; lowering α to reduce false positives also lowers power."},{"id":"confidence-intervals","title":"Confidence intervals","section":"ps","disc":"Research & Statistics","parent":"statistics","hub":false,"summary":"A confidence interval is a range of plausible values for a population parameter, the point estimate ± a margin of error. A 95% CI comes from a method that, over many repeated samples, captures the true value 95% of the time. Intervals widen with higher confidence levels, more variability and smaller samples (width is proportional to 1/√n). A 95% CI for a difference that excludes 0 corresponds to p < 0.05 in a two-sided test; error bars may show CIs, standard deviations or standard errors.","trap":"For ratios such as relative risk or odds ratio the null value is 1, not 0, so an interval like 0.8–1.6 is not significant even though it does not include 0."},{"id":"correlation-coefficient","title":"Correlation coefficient (r)","section":"ps","disc":"Research & Statistics","parent":"statistics","hub":false,"summary":"Pearson's r measures the strength and direction of a linear relationship between two variables, from −1 (perfect negative) through 0 (no linear relationship) to +1 (perfect positive). The sign gives direction and the magnitude gives strength. Squaring it gives r², the proportion of variance in one variable explained by its linear relationship with the other, so r = 0.5 explains 25%. An r near 0 can hide a strong curved relationship, and outliers can distort r.","trap":"r = −0.8 is a stronger relationship than r = +0.5; the sign shows direction, not strength."},{"id":"sensitivity-specificity","title":"Sensitivity, specificity and predictive values","section":"ps","disc":"Research & Statistics","parent":"statistics","hub":false,"summary":"Sensitivity = TP/(TP + FN), the share of people with the disease who test positive; specificity = TN/(TN + FP), the share without it who test negative. Highly sensitive tests suit screening because a negative rules disease out; highly specific tests confirm because a positive rules it in. Positive predictive value = TP/(TP + FP) and negative predictive value = TN/(TN + FN). Moving the cutoff so that more people test positive raises sensitivity but lowers specificity, and the reverse.","trap":"Sensitivity and specificity are properties of the test that do not change with prevalence, but predictive values depend on prevalence: as prevalence falls, PPV falls and NPV rises, so a good test can still give mostly false positives in a low-risk population."},{"id":"incidence-prevalence","title":"Incidence and prevalence","section":"ps","disc":"Research & Statistics","parent":"statistics","hub":false,"summary":"Incidence is the number of new cases in a period divided by the population at risk, a measure of risk of acquiring disease. Prevalence is the number of existing cases, new and old, at a point or over a period divided by the total population, a measure of disease burden. Roughly, prevalence ≈ incidence × average duration. Morbidity refers to illness and mortality to death; prevalence is high for chronic, long-lasting conditions even when incidence is low.","trap":"A treatment that keeps patients alive longer without curing them raises prevalence while leaving incidence unchanged; a cure or rapid death lowers prevalence."}],"edges":[{"s":"amino-acids","t":"side-chains","type":"prerequisite","why":"The shared backbone (α-carbon, amino, carboxyl) must be clear before comparing how different R groups change polarity, charge and behavior."},{"s":"amino-acids","t":"peptide-bond","type":"prerequisite","why":"A peptide bond joins one residue's α-carboxyl to the next residue's α-amino group, so the backbone groups must be understood first."},{"s":"amino-acids","t":"trna-charging","type":"prerequisite","why":"Aminoacyl-tRNA synthetase uses ATP to attach an amino acid's α-carboxyl to the tRNA's 3′ end as an ester, activating it for peptide bond formation."},{"s":"amino-acids","t":"aa-catabolism","type":"prerequisite","why":"Catabolism first strips the α-amino group (transamination, deamination) and then processes the remaining carbon skeleton, so the backbone layout comes first."},{"s":"aa-configuration","t":"amino-acids","type":"part-of","why":"Every chiral amino acid in proteins has the L configuration at its α-carbon."},{"s":"aa-configuration","t":"alpha-helix","type":"affects","why":"Built from L-residues, the right-handed α-helix is sterically favored; a left-handed helix would crowd L side chains against the backbone, so it is rare in proteins."},{"s":"zwitterion","t":"amino-acids","type":"part-of","why":"At physiological pH a free amino acid's backbone groups are ionized, so it exists as a zwitterion."},{"s":"zwitterion","t":"pI","type":"prerequisite","why":"For an amino acid with a neutral R group, the pI is the pH where the zwitterion is at its maximum and the small cationic and anionic fractions balance."},{"s":"zwitterion","t":"titration","type":"applies-to","why":"Titrating a fully protonated neutral amino acid with base passes through the zwitterion at the first equivalence point, which equals the pI."},{"s":"pI","t":"amino-acids","type":"part-of","why":"The pI follows from the pKa values of an amino acid's ionizable groups."},{"s":"pI","t":"gel-electrophoresis","type":"applies-to","why":"Isoelectric focusing runs proteins through a pH gradient until each stops at its pI, where net charge and electrophoretic force are zero."},{"s":"pI","t":"buffers","type":"contrasts","why":"The pI is where an amino acid buffers worst: it is an equivalence point on the titration curve, whereas buffering is strongest near each pKa."},{"s":"side-chains","t":"protein-structure","type":"prerequisite","why":"Where each residue ends up (core, surface, membrane) and which interactions stabilize a fold depend on side-chain polarity and charge."},{"s":"side-chains","t":"folding","type":"affects","why":"Nonpolar side chains collapse inward and polar or charged ones stay solvent-exposed, which steers the chain toward its native fold."},{"s":"side-chains","t":"enzymes","type":"affects","why":"Active sites rely on side chains such as Ser, His, Asp, Cys and Lys to act as nucleophiles, proton donors or acceptors, and charged binding groups."},{"s":"side-chains","t":"point-mutations","type":"applies-to","why":"Side-chain classes predict a missense mutation's impact: a swap within a class is often tolerated, while polar-to-nonpolar or charge changes can disrupt folding."},{"s":"nonpolar-aa","t":"side-chains","type":"part-of","why":"Nonpolar aliphatic residues form one of the main side-chain classes, defined by hydrocarbon or thioether R groups that cannot ionize."},{"s":"nonpolar-aa","t":"tertiary","type":"affects","why":"Burying nonpolar residues in the core of soluble proteins is the main driving force of tertiary packing."},{"s":"nonpolar-aa","t":"membranes","type":"affects","why":"Transmembrane segments are rich in Leu, Ile, Val and Ala so they can sit among the bilayer's hydrocarbon tails."},{"s":"aromatic-aa","t":"side-chains","type":"part-of","why":"Phe, Tyr and Trp are grouped by their aromatic ring side chains."},{"s":"aromatic-aa","t":"neurotransmitters","type":"prerequisite","why":"Tyrosine is converted via L-DOPA to dopamine and norepinephrine, and tryptophan to serotonin."},{"s":"aromatic-aa","t":"amine-hormones","type":"prerequisite","why":"Tyrosine is the starting point for epinephrine, norepinephrine and thyroid hormones (T3, T4), and tryptophan for melatonin."},{"s":"aromatic-aa","t":"uv-spec","type":"applies-to","why":"Trp and Tyr absorb near 280 nm, so A280 combined with Beer–Lambert (A = εlc) gives a quick estimate of protein concentration."},{"s":"polar-aa","t":"side-chains","type":"part-of","why":"Polar uncharged residues form the side-chain class that hydrogen bonds without carrying a charge."},{"s":"polar-aa","t":"phosphorylation","type":"prerequisite","why":"Kinases attach phosphate only to side-chain hydroxyls (Ser, Thr, and also Tyr), so these residues determine where a protein can be phosphorylated."},{"s":"polar-aa","t":"glycosylation","type":"prerequisite","why":"N-linked sugars attach to Asn amide nitrogens in the ER, and O-linked sugars to Ser or Thr hydroxyls in the Golgi."},{"s":"charged-aa","t":"pI","type":"affects","why":"Extra ionizable R groups shift the pI: acidic residues lower it, basic residues raise it."},{"s":"charged-aa","t":"side-chains","type":"part-of","why":"Acidic and basic residues form the side-chain class with ionizable, usually charged R groups."},{"s":"charged-aa","t":"salt-bridge","type":"prerequisite","why":"A salt bridge pairs an acidic side chain's negative charge with a basic side chain's positive charge."},{"s":"charged-aa","t":"electrostatic-catalysis","type":"affects","why":"Charged active-site residues such as Arg, Lys and Asp stabilize oppositely charged transition states and intermediates, lowering activation energy."},{"s":"acidic-aa","t":"charged-aa","type":"part-of","why":"Asp and Glu are the negatively charged members of the charged residues."},{"s":"acidic-aa","t":"sickle-cell","type":"affects","why":"Sickle cell replaces Glu with Val at β-globin position 6, losing a surface negative charge and creating a hydrophobic patch that lets deoxyhemoglobin polymerize."},{"s":"acidic-aa","t":"transamination","type":"prerequisite","why":"Transaminases move amino groups onto α-ketoglutarate to make glutamate, and oxaloacetate ⇌ aspartate; aspartate later supplies urea's second nitrogen."},{"s":"acidic-aa","t":"neurotransmitters","type":"prerequisite","why":"Glutamate is the brain's main excitatory transmitter, and decarboxylating it produces GABA, the main inhibitory transmitter."},{"s":"basic-aa","t":"charged-aa","type":"part-of","why":"Lys, Arg and His are the proton-accepting members of the charged residues."},{"s":"basic-aa","t":"histones","type":"explains","why":"Histones are rich in positively charged Lys and Arg, which bind the negatively charged phosphate backbone of DNA."},{"s":"basic-aa","t":"histone-acetylation","type":"explains","why":"Acetylating lysine's side-chain amine removes its positive charge, weakening histone–DNA attraction and opening chromatin for transcription."},{"s":"glycine","t":"nonpolar-aa","type":"part-of","why":"With H as its R group, glycine has the smallest side chain and is usually grouped as nonpolar."},{"s":"glycine","t":"secondary","type":"affects","why":"Glycine's flexibility destabilizes α-helices but allows the tight backbone angles of turns, often next to proline."},{"s":"glycine","t":"collagen","type":"affects","why":"Every third collagen residue is Gly because only a hydrogen fits where the three chains pack at the center of the triple helix."},{"s":"glycine","t":"neurotransmitters","type":"prerequisite","why":"Glycine is a major inhibitory transmitter in the spinal cord and brainstem, opening Cl⁻ channels that hyperpolarize the postsynaptic cell."},{"s":"glycine","t":"chirality","type":"contrasts","why":"Every other standard amino acid has a chiral α-carbon, but glycine's carries two hydrogens, so it is achiral and has no D or L form."},{"s":"proline","t":"nonpolar-aa","type":"part-of","why":"Proline's side chain is all hydrocarbon, so it is classed as nonpolar, though its main role is structural."},{"s":"proline","t":"peptide-bond","type":"affects","why":"Proline's secondary amine forms a peptide bond with no N–H, and bonds preceding Pro adopt the cis form far more often than other peptide bonds."},{"s":"proline","t":"alpha-helix","type":"affects","why":"Proline's backbone N has no H to donate to the i−4 carbonyl and its ring restricts φ, so it kinks or ends α-helices."},{"s":"proline","t":"collagen","type":"affects","why":"Proline and hydroxyproline make up much of collagen's X and Y positions, and their rigid rings stabilize each chain's helix."},{"s":"cysteine","t":"polar-aa","type":"part-of","why":"The thiol is polar and weakly acidic, so Cys is usually grouped with the polar residues."},{"s":"cysteine","t":"disulfide-bond","type":"prerequisite","why":"A disulfide forms only when two cysteine thiols are oxidized, so cysteine's –SH chemistry must be understood first."},{"s":"cysteine","t":"covalent-catalysis","type":"affects","why":"In cysteine proteases such as caspases, the thiolate attacks the substrate's carbonyl and forms a temporary thioester intermediate with the enzyme."},{"s":"histidine","t":"basic-aa","type":"part-of","why":"Histidine's imidazole accepts a proton, so it is grouped with the basic residues despite its low pKa."},{"s":"histidine","t":"acid-base-catalysis","type":"affects","why":"His's imidazole (pKa ≈ 6) can donate or accept a proton at cellular pH, making it the classic general acid/base, as in the serine protease triad."},{"s":"histidine","t":"hemoglobin","type":"affects","why":"The proximal histidine binds heme Fe²⁺; when O₂ binds, the iron moves into the heme plane and pulls this His, helping trigger the T→R shift."},{"s":"histidine","t":"bohr-effect","type":"explains","why":"At lower pH, histidines in deoxyhemoglobin pick up protons and form salt bridges that stabilize the T state, so O₂ is released more readily."},{"s":"histidine","t":"ph-homeostasis","type":"affects","why":"Histidine imidazoles on hemoglobin and plasma proteins have pKa values near blood pH, so they absorb or release H⁺ and help buffer the blood."},{"s":"peptide-bond","t":"protein-structure","type":"prerequisite","why":"Peptide bonds fix the backbone that every higher level folds, and their rigidity leaves only φ and ψ rotation free."},{"s":"peptide-bond","t":"primary","type":"prerequisite","why":"Primary structure is the sequence of residues joined by peptide bonds, so the bond must be understood first."},{"s":"peptide-bond","t":"translation-steps","type":"prerequisite","why":"During elongation, the ribosome's rRNA peptidyl transferase center forms each peptide bond by moving the growing chain onto the A-site aminoacyl-tRNA."},{"s":"peptide-hydrolysis","t":"peptide-bond","type":"part-of","why":"Hydrolysis is the reverse of peptide bond formation, adding water back across the amide."},{"s":"peptide-hydrolysis","t":"zymogens","type":"explains","why":"Zymogens are switched on by hydrolysis of specific peptide bonds, as when enteropeptidase cuts trypsinogen to trypsin, which then activates other pancreatic proteases."},{"s":"peptide-hydrolysis","t":"digestive-system","type":"applies-to","why":"Protein digestion is a series of peptide bond hydrolyses by pepsin in the stomach, then trypsin, chymotrypsin, carboxypeptidase and brush-border peptidases."},{"s":"amide-planarity","t":"peptide-bond","type":"part-of","why":"Planarity is a key property of the peptide bond that comes from amide resonance."},{"s":"amide-planarity","t":"secondary","type":"affects","why":"Rigid planar peptide units leave only φ and ψ free, so only a few repeating backbone conformations, such as the α-helix and β-sheet, are sterically allowed."},{"s":"amide-planarity","t":"conformational-isomers","type":"contrasts","why":"A C–C single bond rotates freely between conformers, but partial double-bond character locks the amide C–N, so cis and trans peptide forms interconvert only slowly."},{"s":"protein-structure","t":"folding","type":"prerequisite","why":"The four levels define what folding has to build, from backbone hydrogen bonds to side-chain packing and subunit assembly."},{"s":"protein-structure","t":"denaturation","type":"prerequisite","why":"Denaturation is defined by which levels are lost (secondary, tertiary, quaternary) and which survives (primary)."},{"s":"protein-structure","t":"sickle-cell","type":"applies-to","why":"One primary-structure change (Glu→Val) creates a sticky surface patch that makes deoxyhemoglobin tetramers polymerize, showing how a sequence change alters higher levels."},{"s":"primary","t":"protein-structure","type":"part-of","why":"Primary structure is the first level of protein structure, the sequence itself."},{"s":"primary","t":"secondary","type":"affects","why":"The sequence decides which stretches can form helices or sheets, since residues like Pro, Gly and β-branched Val and Ile favor different structures."},{"s":"primary","t":"folding","type":"explains","why":"Anfinsen showed that unfolded ribonuclease refolds to its active form without help, so the sequence alone specifies the native fold."},{"s":"secondary","t":"protein-structure","type":"part-of","why":"Secondary structure is the level of local backbone folding."},{"s":"secondary","t":"tertiary","type":"prerequisite","why":"Helices and sheets are the local elements that tertiary folding packs together in 3D."},{"s":"secondary","t":"dna-structure","type":"contrasts","why":"Protein secondary structure uses hydrogen bonds between backbone groups, whereas DNA's double helix uses hydrogen bonds between bases while its sugar–phosphate backbone stays outside."},{"s":"alpha-helix","t":"secondary","type":"part-of","why":"The α-helix is one of the two main forms of secondary structure."},{"s":"alpha-helix","t":"membranes","type":"affects","why":"A helix of about 20 nonpolar residues spans the bilayer's hydrophobic core while satisfying its own backbone hydrogen bonds internally."},{"s":"alpha-helix","t":"intermediate-filaments","type":"applies-to","why":"Intermediate filament proteins such as keratin have long α-helical rod domains that pair into coiled coils, the building blocks of these rope-like filaments."},{"s":"beta-sheet","t":"secondary","type":"part-of","why":"The β-pleated sheet is one of the two main forms of secondary structure."},{"s":"beta-sheet","t":"alpha-helix","type":"contrasts","why":"An α-helix hydrogen bonds within one coiled segment (i to i+4), while a β-sheet hydrogen bonds between separate extended strands."},{"s":"beta-sheet","t":"alzheimers","type":"applies-to","why":"Misfolded amyloid-β peptides stack into β-sheet-rich fibrils that form the extracellular plaques characteristic of Alzheimer's disease."},{"s":"tertiary","t":"protein-structure","type":"part-of","why":"Tertiary structure is the level describing one chain's full 3D fold."},{"s":"tertiary","t":"quaternary","type":"prerequisite","why":"Quaternary structure is built from subunits that each have a tertiary fold, and the surfaces created by those folds form the subunit contacts."},{"s":"tertiary","t":"enzymes","type":"explains","why":"Folding brings residues distant in sequence together to form the active site, whose precise shape and chemistry give an enzyme its specificity."},{"s":"disulfide-bond","t":"tertiary","type":"part-of","why":"Disulfides are the main covalent cross-links that stabilize tertiary structure."},{"s":"disulfide-bond","t":"salt-bridge","type":"contrasts","why":"A disulfide is a covalent bond broken by reducing agents, while a salt bridge is a noncovalent ionic attraction disrupted by pH changes or salt."},{"s":"disulfide-bond","t":"quaternary","type":"affects","why":"Interchain disulfides covalently join some subunits, such as the two heavy and two light chains of an antibody."},{"s":"disulfide-bond","t":"insulin-glucagon","type":"affects","why":"After C-peptide is cut out of proinsulin, insulin's A and B chains stay joined only by two disulfide bonds."},{"s":"salt-bridge","t":"tertiary","type":"part-of","why":"Salt bridges are ionic side-chain interactions that help stabilize tertiary structure."},{"s":"salt-bridge","t":"ph-denaturation","type":"explains","why":"Extreme pH protonates carboxylates or deprotonates amines, erasing the opposite charges salt bridges need and helping the protein unfold."},{"s":"salt-bridge","t":"t-r-states","type":"affects","why":"Salt bridges between subunits stabilize deoxyhemoglobin's T state; O₂ binding breaks them, shifting the protein to the high-affinity R state."},{"s":"quaternary","t":"protein-structure","type":"part-of","why":"Quaternary structure is the level describing how several chains assemble."},{"s":"quaternary","t":"cooperativity","type":"explains","why":"In hemoglobin, cooperativity needs linked subunits: O₂ binding changes one subunit's shape, which raises the O₂ affinity of the others."},{"s":"quaternary","t":"hemoglobin","type":"applies-to","why":"Hemoglobin's two α and two β subunits are the standard example of quaternary structure."},{"s":"collagen","t":"alpha-helix","type":"contrasts","why":"Each collagen chain is a left-handed helix with no internal hydrogen bonds, held to the other two by interchain hydrogen bonds, unlike the right-handed α-helix."},{"s":"collagen","t":"clotting","type":"affects","why":"Injury exposes subendothelial collagen, which platelets bind (with von Willebrand factor) to adhere, activate and start forming a plug."},{"s":"folding","t":"tertiary","type":"explains","why":"Folding is the process that produces tertiary structure, driven mainly by burying nonpolar side chains away from water."},{"s":"folding","t":"alzheimers","type":"applies-to","why":"Misfolded, aggregated proteins are hallmarks of Alzheimer's: amyloid-β forms extracellular β-sheet plaques and hyperphosphorylated tau forms intracellular tangles."},{"s":"chaperones","t":"folding","type":"part-of","why":"Chaperones are helper proteins that assist folding in the crowded cell."},{"s":"chaperones","t":"thermal-denaturation","type":"affects","why":"Heat shock induces chaperones that bind heat-unfolded proteins, preventing aggregation and helping them refold."},{"s":"chaperones","t":"rough-er","type":"applies-to","why":"In the rough ER lumen, chaperones such as BiP bind newly made chains as they fold, and chains that stay misfolded are held back instead of sent to the Golgi."},{"s":"denaturation","t":"peptide-hydrolysis","type":"contrasts","why":"Denaturation disrupts only noncovalent interactions and disulfides, while hydrolysis cleaves peptide bonds and destroys primary structure."},{"s":"denaturation","t":"folding","type":"contrasts","why":"Denaturation unfolds a protein and folding builds it; Anfinsen's ribonuclease work showed that a denatured chain can refold once the agent is removed."},{"s":"denaturation","t":"dna-melting","type":"applies-to","why":"DNA also denatures when heat or high pH breaks base-pair hydrogen bonds and stacking while the covalent backbone stays intact."},{"s":"thermal-denaturation","t":"denaturation","type":"part-of","why":"Heat is one of the main agents of protein denaturation."},{"s":"thermal-denaturation","t":"enzymes","type":"affects","why":"Enzyme rate rises with temperature until unfolding destroys the active site, giving a temperature optimum near 37 °C for most human enzymes."},{"s":"thermal-denaturation","t":"arrhenius","type":"contrasts","why":"Arrhenius predicts that rate keeps rising with temperature, but enzyme rates fall above the optimum because denaturation removes active enzyme."},{"s":"ph-denaturation","t":"denaturation","type":"part-of","why":"Extreme pH is one of the main agents of protein denaturation."},{"s":"ph-denaturation","t":"enzymes","type":"affects","why":"Each enzyme has a pH optimum; far from it, changed side-chain charges distort the active site and can unfold the protein."},{"s":"urea","t":"denaturation","type":"part-of","why":"Urea is a classic chemical denaturant used at high concentration."},{"s":"urea","t":"hydrophobic-effect","type":"affects","why":"Urea helps water solvate nonpolar side chains, so burying them gives less free-energy gain and the folded core is destabilized."},{"s":"urea","t":"hbonds","type":"affects","why":"Urea's C=O and NH₂ groups hydrogen bond with backbone N–H and C=O groups, competing with the internal hydrogen bonds of helices and sheets."},{"s":"sds","t":"denaturation","type":"part-of","why":"SDS is an ionic detergent that denatures proteins."},{"s":"sds","t":"gel-electrophoresis","type":"applies-to","why":"SDS gives proteins a nearly uniform negative charge-to-mass ratio, so in SDS-PAGE migration depends mainly on mass."},{"s":"sds","t":"phospholipids","type":"affects","why":"As an amphipathic detergent, SDS inserts into the bilayer and breaks it into mixed micelles of lipid, protein and detergent."},{"s":"beta-mercaptoethanol","t":"disulfide-bond","type":"affects","why":"Its thiol reduces each S–S bond back to two cysteine –SH groups, while two β-mercaptoethanol molecules are oxidized to a disulfide themselves."},{"s":"beta-mercaptoethanol","t":"denaturation","type":"part-of","why":"β-Mercaptoethanol is a reducing agent used alongside denaturants to break disulfides."},{"s":"beta-mercaptoethanol","t":"urea","type":"contrasts","why":"β-Mercaptoethanol breaks only covalent disulfides, while urea disrupts only noncovalent interactions, which is why Anfinsen used both."},{"s":"beta-mercaptoethanol","t":"gel-electrophoresis","type":"applies-to","why":"Comparing SDS-PAGE with and without β-mercaptoethanol shows whether a protein's subunits are linked by disulfides."},{"s":"gel-electrophoresis","t":"quaternary","type":"applies-to","why":"Running a protein on native PAGE versus SDS-PAGE reveals whether it is a multi-subunit complex and the masses of its subunits."},{"s":"gel-electrophoresis","t":"sickle-cell","type":"applies-to","why":"At alkaline pH, HbS has one fewer negative charge per β chain than HbA, so it moves more slowly toward the anode, which is used for diagnosis."},{"s":"enzymes","t":"catalytic-mechanisms","type":"prerequisite","why":"Knowing that enzymes stabilize the transition state comes before the specific chemical strategies they use to do it."},{"s":"enzymes","t":"michaelis-menten","type":"prerequisite","why":"Km and Vmax describe how an enzyme's rate saturates as substrate rises, so enzyme basics come before the kinetic equation."},{"s":"enzymes","t":"allosteric-regulation","type":"prerequisite","why":"Allosteric control builds on knowing how an active site binds substrate, because effectors work by reshaping that site from elsewhere."},{"s":"enzymes","t":"gibbs","type":"contrasts","why":"Enzymes change only how fast a reaction goes; ΔG depends only on reactants and products, so an enzyme cannot make an unfavorable reaction favorable."},{"s":"enzymes","t":"activation-energy","type":"affects","why":"Enzymes lower activation energy by stabilizing the transition state, which raises the rate constant without changing reactant or product energies."},{"s":"catalytic-mechanisms","t":"peptide-hydrolysis","type":"applies-to","why":"Proteases like chymotrypsin hydrolyze stable peptide bonds by combining acid–base, covalent and oxyanion-hole electrostatic catalysis in one active site."},{"s":"catalytic-mechanisms","t":"kcat","type":"explains","why":"The chemical steps after binding, such as proton transfers and covalent intermediates, set how fast each active site turns over, which kcat measures."},{"s":"acid-base-catalysis","t":"ph-denaturation","type":"contrasts","why":"A pH shift can put a catalytic residue in the wrong protonation state and stop activity reversibly without unfolding; pH denaturation instead disrupts the bonds holding the fold."},{"s":"acid-base-catalysis","t":"catalytic-mechanisms","type":"part-of","why":"Proton transfer by active-site side chains is one of the main catalytic strategies."},{"s":"acid-base-catalysis","t":"covalent-catalysis","type":"prerequisite","why":"In serine proteases His acts as a general base that deprotonates Ser, creating the strong nucleophile that forms the covalent acyl-enzyme."},{"s":"acid-base-catalysis","t":"tautomerism","type":"applies-to","why":"Keto–enol tautomerization is acid- or base-catalyzed, and isomerases like triose phosphate isomerase use active-site acids and bases to move protons through enediol intermediates."},{"s":"covalent-catalysis","t":"catalytic-mechanisms","type":"part-of","why":"Forming a transient enzyme–substrate covalent bond is one of the main catalytic strategies."},{"s":"covalent-catalysis","t":"covalent-modification","type":"contrasts","why":"A catalytic covalent intermediate forms and breaks every cycle, while regulatory modifications like phosphorylation persist until a separate enzyme removes them."},{"s":"covalent-catalysis","t":"glycolysis","type":"applies-to","why":"Aldolase cleaves fructose-1,6-bisphosphate through a Schiff base with an active-site Lys, and GAPDH's active-site Cys forms a thioester intermediate with its substrate."},{"s":"covalent-catalysis","t":"clotting","type":"applies-to","why":"Thrombin and most activated clotting factors are serine proteases whose active-site Ser forms an acyl-enzyme with the peptide bond it cuts."},{"s":"electrostatic-catalysis","t":"catalytic-mechanisms","type":"part-of","why":"Stabilizing transition-state charge with ions, metal cofactors and dipoles is one of the main catalytic strategies."},{"s":"electrostatic-catalysis","t":"atp","type":"applies-to","why":"Kinases use Mg²⁺–ATP: the metal shields the phosphates' negative charges so a nucleophile can attack the γ-phosphate."},{"s":"electrostatic-catalysis","t":"ph-homeostasis","type":"applies-to","why":"Carbonic anhydrase uses Zn²⁺-activated water to interconvert CO₂ and HCO₃⁻ very rapidly, letting the bicarbonate buffer respond in red cells and kidney."},{"s":"proximity-orientation","t":"catalytic-mechanisms","type":"part-of","why":"Holding substrates close together in the reactive geometry is one of the main catalytic strategies."},{"s":"proximity-orientation","t":"ribosome","type":"applies-to","why":"The ribosome's rRNA peptidyl transferase center speeds peptide bond formation largely by positioning the aminoacyl-tRNA and peptidyl-tRNA precisely."},{"s":"proximity-orientation","t":"entropy","type":"affects","why":"Binding energy pays the entropy cost of freezing substrates' position and orientation, so the chemical step loses little further entropy and its activation barrier is lower."},{"s":"michaelis-menten","t":"lineweaver-burk","type":"prerequisite","why":"The Lineweaver–Burk plot is the double-reciprocal rearrangement of the Michaelis–Menten equation."},{"s":"michaelis-menten","t":"inhibition","type":"prerequisite","why":"Each reversible inhibitor type is identified by what it does to Km and Vmax, so the Michaelis–Menten parameters must come first."},{"s":"michaelis-menten","t":"facilitated-diffusion","type":"applies-to","why":"Carrier-mediated transport saturates like an enzyme, with a Km-like half-saturation concentration and a maximal rate once all carriers are occupied."},{"s":"vmax","t":"michaelis-menten","type":"part-of","why":"Vmax is the saturating rate in the Michaelis–Menten equation."},{"s":"vmax","t":"lineweaver-burk","type":"prerequisite","why":"The y-intercept of a Lineweaver–Burk plot is 1/Vmax, so reading inhibitor plots requires knowing Vmax."},{"s":"vmax","t":"reabsorption-secretion","type":"applies-to","why":"Renal carriers like SGLT have a transport maximum analogous to Vmax; once plasma glucose exceeds roughly 180–200 mg/dL, glucose spills into urine."},{"s":"km","t":"michaelis-menten","type":"part-of","why":"Km is the half-saturation constant in the Michaelis–Menten equation."},{"s":"km","t":"lineweaver-burk","type":"prerequisite","why":"The x-intercept of a Lineweaver–Burk plot is −1/Km, so reading inhibitor plots requires knowing Km."},{"s":"km","t":"hexokinase","type":"applies-to","why":"Low-Km hexokinase keeps tissues phosphorylating glucose even when it is scarce, while high-Km glucokinase in liver works mainly when blood glucose is high."},{"s":"kcat","t":"michaelis-menten","type":"part-of","why":"kcat is the first-order rate constant for product formation in the Michaelis–Menten scheme."},{"s":"kcat","t":"vmax","type":"explains","why":"Vmax equals kcat times total enzyme concentration, so Vmax rises with enzyme amount while kcat stays fixed."},{"s":"kcat","t":"catalytic-efficiency","type":"prerequisite","why":"Catalytic efficiency is kcat divided by Km, so turnover number must be understood first."},{"s":"catalytic-efficiency","t":"michaelis-menten","type":"part-of","why":"kcat/Km combines two Michaelis–Menten parameters into one measure of enzyme performance."},{"s":"catalytic-efficiency","t":"glycolysis","type":"applies-to","why":"Triose phosphate isomerase interconverts dihydroxyacetone phosphate and glyceraldehyde-3-phosphate near the diffusion limit, so both trioses from aldolase quickly feed the payoff phase."},{"s":"catalytic-efficiency","t":"nt-clearance","type":"explains","why":"Acetylcholinesterase works near the diffusion limit, clearing acetylcholine from the synaptic cleft within milliseconds so each signal stays brief."},{"s":"steady-state","t":"michaelis-menten","type":"part-of","why":"The steady-state assumption is the key step in deriving the Michaelis–Menten equation."},{"s":"steady-state","t":"km","type":"explains","why":"Setting ES formation equal to ES breakdown gives Km = (k₋₁ + kcat)/k₁, which is why Km only approximates a dissociation constant."},{"s":"steady-state","t":"equilibrium","type":"contrasts","why":"At steady state [ES] is constant while net conversion to product continues; at equilibrium forward and reverse rates are equal and there is no net change."},{"s":"lineweaver-burk","t":"inhibition","type":"applies-to","why":"Comparing intercepts and slopes with and without inhibitor on a double-reciprocal plot identifies the inhibitor type."},{"s":"lineweaver-burk","t":"competitive-inhibition","type":"applies-to","why":"Competitive inhibition increases the slope and moves the x-intercept toward zero but leaves the y-intercept (1/Vmax) unchanged, so lines cross on the y-axis."},{"s":"lineweaver-burk","t":"uncompetitive-inhibition","type":"applies-to","why":"Uncompetitive inhibition lowers Km and Vmax by the same factor, so the slope Km/Vmax is unchanged and the lines are parallel."},{"s":"inhibition","t":"feedback-inhibition","type":"prerequisite","why":"Feedback inhibition is a physiological use of enzyme inhibition, so the inhibitor types and their effects on activity come first."},{"s":"inhibition","t":"eicosanoids","type":"applies-to","why":"Ibuprofen reversibly inhibits COX, while aspirin covalently acetylates an active-site serine, irreversibly blocking prostaglandin and thromboxane synthesis."},{"s":"inhibition","t":"nt-clearance","type":"affects","why":"Acetylcholinesterase inhibitors such as nerve agents and neostigmine prolong acetylcholine in the synapse, intensifying cholinergic effects on muscles and glands."},{"s":"inhibition","t":"depression","type":"applies-to","why":"MAO inhibitors block breakdown of serotonin, norepinephrine and dopamine, raising their levels, which is how this class of antidepressant works."},{"s":"inhibition","t":"alzheimers","type":"applies-to","why":"Cholinesterase inhibitors like donepezil slow acetylcholine breakdown to partly offset the loss of cholinergic neurons in Alzheimer's disease."},{"s":"inhibition","t":"parkinsons","type":"applies-to","why":"Carbidopa inhibits peripheral DOPA decarboxylase so more levodopa reaches the brain, and MAO-B inhibitors slow dopamine breakdown."},{"s":"competitive-inhibition","t":"km","type":"affects","why":"A competitive inhibitor raises apparent Km because more substrate is needed to outcompete it and reach half of Vmax."},{"s":"competitive-inhibition","t":"inhibition","type":"part-of","why":"Competitive inhibition is one of the reversible inhibitor types."},{"s":"competitive-inhibition","t":"nucleotide-synthesis","type":"applies-to","why":"Methotrexate competitively inhibits dihydrofolate reductase, cutting the folate supply needed for thymidine and purine synthesis in dividing cells."},{"s":"competitive-inhibition","t":"alcohol-oxidation","type":"applies-to","why":"Ethanol or fomepizole competes with methanol for alcohol dehydrogenase, slowing its oxidation to toxic formaldehyde and formic acid."},{"s":"uncompetitive-inhibition","t":"km","type":"affects","why":"By binding and removing ES, an uncompetitive inhibitor draws more E and S into ES, lowering apparent Km."},{"s":"uncompetitive-inhibition","t":"inhibition","type":"part-of","why":"Uncompetitive inhibition is one of the reversible inhibitor types."},{"s":"uncompetitive-inhibition","t":"bipolar","type":"applies-to","why":"Lithium, a bipolar treatment, inhibits inositol monophosphatase uncompetitively; resulting inositol depletion is one hypothesis, not established fact, for how it stabilizes mood."},{"s":"noncompetitive-inhibition","t":"vmax","type":"affects","why":"Binding E and ES equally, the inhibitor inactivates the same fraction of enzyme at any [S], like removing enzyme, so Vmax falls while Km stays the same."},{"s":"noncompetitive-inhibition","t":"inhibition","type":"part-of","why":"Noncompetitive inhibition is one of the reversible inhibitor types."},{"s":"noncompetitive-inhibition","t":"competitive-inhibition","type":"contrasts","why":"Raising [S] overcomes a competitive inhibitor because both target the active site, but cannot overcome a noncompetitive one that binds elsewhere."},{"s":"mixed-inhibition","t":"vmax","type":"affects","why":"Because a mixed inhibitor binds ES as well as E, some enzyme is always inactive at saturating substrate, so Vmax falls."},{"s":"mixed-inhibition","t":"km","type":"affects","why":"A mixed inhibitor raises apparent Km if it binds free enzyme more tightly and lowers it if it binds ES more tightly."},{"s":"mixed-inhibition","t":"inhibition","type":"part-of","why":"Mixed inhibition is one of the reversible inhibitor types."},{"s":"allosteric-regulation","t":"covalent-modification","type":"contrasts","why":"Allosteric control is fast and reversible through noncovalent effector binding, while covalent modification needs other enzymes to add or remove groups."},{"s":"allosteric-regulation","t":"feedback-inhibition","type":"prerequisite","why":"Most feedback inhibition works by an end product binding an allosteric site on an early enzyme, so allostery comes first."},{"s":"allosteric-regulation","t":"pfk1","type":"applies-to","why":"PFK-1 is allosterically inhibited by ATP and citrate and activated by AMP and fructose-2,6-bisphosphate, tying glycolytic flux to energy need."},{"s":"allosteric-regulation","t":"hemoglobin","type":"applies-to","why":"Hemoglobin shows allosteric behavior without catalysis: O₂, H⁺, CO₂ and 2,3-BPG bind and shift it between low- and high-affinity states."},{"s":"cooperativity","t":"michaelis-menten","type":"contrasts","why":"Cooperative enzymes give sigmoidal rate curves, while Michaelis–Menten enzymes with independent sites give hyperbolas."},{"s":"cooperativity","t":"allosteric-regulation","type":"part-of","why":"Cooperativity is how allosteric binding between subunits produces switch-like responses."},{"s":"cooperativity","t":"hill-coefficient","type":"prerequisite","why":"The Hill coefficient is a number that quantifies cooperativity, so the concept must come first."},{"s":"cooperativity","t":"hemoglobin","type":"explains","why":"Cooperative O₂ binding gives hemoglobin a sigmoidal curve, so it loads nearly fully in the lungs yet unloads a large fraction in tissues."},{"s":"t-r-states","t":"allosteric-regulation","type":"part-of","why":"The T⇌R equilibrium is the main model for how allosteric proteins change activity."},{"s":"t-r-states","t":"cooperativity","type":"explains","why":"In the concerted model each ligand bound tips more molecules toward the high-affinity R state, raising affinity at the remaining sites."},{"s":"t-r-states","t":"allosteric-effectors","type":"explains","why":"Activators act by stabilizing the R state and inhibitors by stabilizing the T state, shifting the conformational equilibrium."},{"s":"t-r-states","t":"bohr-effect","type":"explains","why":"H⁺ and CO₂ stabilize the low-affinity T state of hemoglobin, lowering O₂ affinity and shifting the curve right in active tissues."},{"s":"hill-coefficient","t":"michaelis-menten","type":"contrasts","why":"A Hill coefficient of 1 matches the hyperbolic Michaelis–Menten curve; values above 1 signal a sigmoidal, cooperative curve that the simple equation cannot describe."},{"s":"hill-coefficient","t":"allosteric-regulation","type":"part-of","why":"The Hill coefficient quantifies the cooperativity of allosteric proteins."},{"s":"hill-coefficient","t":"hemoglobin","type":"applies-to","why":"Hemoglobin's Hill coefficient of about 2.8–3 confirms strong positive cooperativity, while myoglobin's value of 1 shows none."},{"s":"allosteric-effectors","t":"mixed-inhibition","type":"explains","why":"Inhibitors binding outside the active site often change both substrate affinity and catalytic rate, which is why many show mixed rather than pure noncompetitive kinetics."},{"s":"allosteric-effectors","t":"allosteric-regulation","type":"part-of","why":"Effectors are the molecules whose binding at regulatory sites drives allosteric regulation."},{"s":"allosteric-effectors","t":"isocitrate-dh","type":"applies-to","why":"ADP and Ca²⁺ activate while ATP and NADH inhibit isocitrate dehydrogenase, matching citric acid cycle speed to energy demand."},{"s":"allosteric-effectors","t":"gluconeogenesis","type":"applies-to","why":"Acetyl-CoA from fatty acid oxidation allosterically activates pyruvate carboxylase, steering pyruvate into gluconeogenesis during fasting."},{"s":"covalent-modification","t":"pdh-complex","type":"applies-to","why":"PDH kinase phosphorylates and inactivates the pyruvate dehydrogenase complex, and PDH phosphatase reactivates it."},{"s":"covalent-modification","t":"reciprocal-regulation","type":"applies-to","why":"Phosphorylation of the liver PFK-2/FBPase-2 enzyme by PKA lowers fructose-2,6-bisphosphate, switching liver from glycolysis toward gluconeogenesis."},{"s":"covalent-modification","t":"glycogen-metabolism","type":"applies-to","why":"Glucagon and epinephrine trigger phosphorylation that activates glycogen phosphorylase and inactivates glycogen synthase, while insulin favors dephosphorylation."},{"s":"phosphorylation","t":"covalent-modification","type":"part-of","why":"Reversible phosphorylation is the most common covalent switch on enzymes."},{"s":"phosphorylation","t":"cyclins-cdks","type":"applies-to","why":"Cyclin-dependent kinases drive the cell cycle by phosphorylating targets such as Rb, and are themselves switched by activating and inhibitory phosphorylations."},{"s":"phosphorylation","t":"glycogen-phosphorylase","type":"affects","why":"Phosphorylation converts glycogen phosphorylase from the less active b form to the more active a form, speeding glycogen breakdown."},{"s":"phosphorylation","t":"glycogen-synthase","type":"affects","why":"Phosphorylation inactivates glycogen synthase, so glucagon signaling halts glycogen synthesis while breakdown is switched on."},{"s":"zymogens","t":"covalent-modification","type":"part-of","why":"Cleavage of an inactive precursor is an irreversible covalent way to switch an enzyme on."},{"s":"zymogens","t":"clotting","type":"applies-to","why":"Clotting factors circulate as inactive zymogens and activate one another in a proteolytic cascade, amplifying a small trigger into rapid thrombin and fibrin formation."},{"s":"zymogens","t":"stomach","type":"applies-to","why":"Chief cells secrete pepsinogen, which HCl and existing pepsin cleave to active pepsin only in the acidic stomach lumen."},{"s":"zymogens","t":"pancreatic-juice","type":"applies-to","why":"Pancreatic proteases are secreted as trypsinogen, chymotrypsinogen and procarboxypeptidase, so they become active only after enteropeptidase starts the cascade in the duodenum."},{"s":"feedback-inhibition","t":"covalent-modification","type":"part-of","why":"Grouped with covalent modification as a flux-control strategy, though feedback inhibition itself is usually noncovalent allosteric binding."},{"s":"feedback-inhibition","t":"trp-operon","type":"contrasts","why":"Tryptophan inhibits the first enzyme of its own synthesis within seconds, while repressing the trp operon is a slower gene-level brake that stops making new enzyme."},{"s":"feedback-inhibition","t":"nucleotide-synthesis","type":"applies-to","why":"End products shut down pyrimidine synthesis at its first steps: CTP inhibits aspartate transcarbamoylase in bacteria, and UTP inhibits carbamoyl phosphate synthetase II in humans."},{"s":"feedback-inhibition","t":"feedback-loops","type":"applies-to","why":"Hormonal negative feedback, such as cortisol suppressing CRH and ACTH, follows the same logic as end-product inhibition at the molecular level."},{"s":"carbohydrates","t":"glycolysis","type":"prerequisite","why":"Glycolysis splits glucose, a D-aldohexose, and its isomerase steps interconvert aldose and ketose phosphates, so basic sugar structure must come first."},{"s":"monosaccharides","t":"carbohydrates","type":"part-of","why":"Monosaccharides are the single sugar units from which every larger carbohydrate is assembled."},{"s":"monosaccharides","t":"dna-structure","type":"prerequisite","why":"DNA's backbone uses 2-deoxyribose, lacking ribose's 2′-OH; RNA's 2′-OH can attack the neighboring phosphate in base, so DNA resists the alkaline hydrolysis RNA undergoes."},{"s":"monosaccharides","t":"ppp","type":"prerequisite","why":"The pentose phosphate pathway reshuffles 3- to 7-carbon aldose and ketose phosphates, so classifying sugars by carbon count and carbonyl type is needed to follow it."},{"s":"aldoses-ketoses","t":"monosaccharides","type":"part-of","why":"Whether the carbonyl is an aldehyde or a ketone is one of the two basic ways monosaccharides are classified."},{"s":"aldoses-ketoses","t":"reducing-sugars","type":"explains","why":"Aldoses are oxidized at their C-1 aldehyde, and ketoses also test positive because the basic test conditions convert them through an enediol into aldoses."},{"s":"aldoses-ketoses","t":"glycolysis-phases","type":"applies-to","why":"Phosphoglucose isomerase turns aldose glucose-6-phosphate into ketose fructose-6-phosphate, and triose phosphate isomerase converts ketose DHAP into aldose glyceraldehyde-3-phosphate."},{"s":"d-l-sugars","t":"monosaccharides","type":"part-of","why":"D/L notation labels the configuration of a monosaccharide relative to glyceraldehyde."},{"s":"d-l-sugars","t":"r-s","type":"contrasts","why":"D/L compares one stereocenter with glyceraldehyde, while R/S ranks substituents at each stereocenter by CIP priority; D-glyceraldehyde is R, but the labels do not generally correspond."},{"s":"epimers","t":"monosaccharides","type":"part-of","why":"Epimer relationships describe how individual monosaccharides such as glucose, mannose and galactose differ at single carbons."},{"s":"epimers","t":"anomers","type":"prerequisite","why":"Anomers are epimers at the anomeric carbon created by ring closure, so the general idea of a single-center difference comes first."},{"s":"cyclization","t":"monosaccharides","type":"part-of","why":"Ring formation is how pentose and hexose monosaccharides actually exist in water."},{"s":"cyclization","t":"glycosidic-bonds","type":"prerequisite","why":"Only the ring's anomeric hemiacetal OH can condense with another alcohol, forming the acetal that constitutes a glycosidic bond."},{"s":"anomers","t":"cyclization","type":"part-of","why":"Anomers are the two configurations at the new stereocenter formed when a sugar cyclizes."},{"s":"anomers","t":"glycosidic-bonds","type":"prerequisite","why":"The anomeric configuration at the moment of condensation fixes a glycosidic bond as α or β, and mutarotation stops once the carbon becomes an acetal."},{"s":"anomers","t":"polysaccharides","type":"explains","why":"α-1,4 links make starch and glycogen coil into helices that amylase can cut, while β-1,4 links make cellulose straight, hydrogen-bonded and indigestible to humans."},{"s":"glycosidic-bonds","t":"carbohydrates","type":"part-of","why":"Glycosidic bonds are the linkages that join monosaccharides into larger carbohydrates."},{"s":"glycosidic-bonds","t":"glycosylation","type":"prerequisite","why":"N-linked and O-linked glycans attach to Asn or Ser/Thr through glycosidic bonds from a sugar's anomeric carbon, and more sugars extend the chain the same way."},{"s":"glycosidic-bonds","t":"ber","type":"applies-to","why":"DNA glycosylases start base excision repair by hydrolyzing the N-glycosidic bond between a damaged base and C-1′ of deoxyribose, leaving an abasic site."},{"s":"glycosidic-bonds","t":"glycogen-phosphorylase","type":"prerequisite","why":"Glycogen phosphorylase cleaves α-1,4 glycosidic bonds with phosphate instead of water, releasing glucose-1-phosphate that is already phosphorylated, saving the hexokinase ATP."},{"s":"disaccharides","t":"glycosidic-bonds","type":"part-of","why":"A disaccharide is two monosaccharides joined by a single glycosidic bond."},{"s":"disaccharides","t":"lac-operon","type":"prerequisite","why":"Lactose, galactose β-1,4 glucose, is the operon's target: β-galactosidase splits it and also forms allolactose, the inducer that releases the LacI repressor."},{"s":"disaccharides","t":"brush-border","type":"prerequisite","why":"Lactase, sucrase and maltase on the microvilli each hydrolyze a specific disaccharide linkage, because only monosaccharides can be absorbed."},{"s":"polysaccharides","t":"carbohydrates","type":"part-of","why":"Polysaccharides are long glycosidic-bonded chains of monosaccharides used for energy storage and structure."},{"s":"polysaccharides","t":"glycogen-metabolism","type":"prerequisite","why":"Glycogen's α-1,6 branches every 8–12 residues create many nonreducing ends, so synthase and phosphorylase can add or remove glucose at many sites at once."},{"s":"polysaccharides","t":"large-intestine","type":"affects","why":"Indigestible fiber such as cellulose reaches the colon, adding bulk to stool, and colonic bacteria ferment some fiber into short-chain fatty acids."},{"s":"reducing-sugars","t":"carbohydrates","type":"part-of","why":"Reducing ability is a defining chemical property used to classify and test carbohydrates."},{"s":"reducing-sugars","t":"disaccharides","type":"applies-to","why":"Maltose and lactose keep one free anomeric carbon and are reducing, but sucrose's α1→β2 bond ties up both anomeric carbons, so it is nonreducing."},{"s":"reducing-sugars","t":"glycogen-synthase","type":"applies-to","why":"Glycogen synthase adds glucose only to nonreducing ends; each particle's single reducing end stays attached to glycogenin, the primer protein."},{"s":"lipids","t":"membranes","type":"prerequisite","why":"Membranes are built from glycerophospholipids, sphingolipids and cholesterol, whose amphipathic shapes determine how the bilayer forms and behaves."},{"s":"lipids","t":"lipid-metabolism","type":"prerequisite","why":"Lipid metabolism moves fatty acids, glycerol and cholesterol between storage, oxidation and synthesis, so the structures of these lipid classes come first."},{"s":"fatty-acids","t":"lipids","type":"part-of","why":"Fatty acids are the basic hydrocarbon building blocks of triacylglycerols, phospholipids and eicosanoids."},{"s":"fatty-acids","t":"eicosanoids","type":"prerequisite","why":"Eicosanoids are made from arachidonic acid, a 20-carbon ω-6 polyunsaturated fatty acid that humans derive from essential linoleic acid."},{"s":"fatty-acids","t":"phospholipids","type":"affects","why":"Cis-unsaturated tails keep membranes fluid at lower temperatures, so cells adjust tail saturation and length to hold membrane fluidity steady."},{"s":"fatty-acids","t":"beta-oxidation","type":"prerequisite","why":"β-oxidation removes two carbons per cycle as acetyl-CoA, so chain length sets yield; a pre-existing double bond bypasses an FAD-dependent step, needs an isomerase, and yields less FADH₂."},{"s":"triacylglycerols","t":"polysaccharides","type":"contrasts","why":"TAGs yield about 9 kcal/g and are stored nearly water-free, while glycogen yields about 4 kcal/g and binds several grams of water per gram, but is mobilized faster."},{"s":"triacylglycerols","t":"lipids","type":"part-of","why":"Triacylglycerols are the storage form of lipid, three fatty acids esterified to glycerol."},{"s":"triacylglycerols","t":"lipid-metabolism","type":"prerequisite","why":"Hormone-sensitive lipase splits stored TAG into fatty acids for β-oxidation and glycerol, the only part of an even-chain TAG that can become glucose."},{"s":"saponification","t":"triacylglycerols","type":"part-of","why":"Saponification is the base hydrolysis of a triacylglycerol's three ester bonds."},{"s":"glycerophospholipids","t":"lipids","type":"part-of","why":"Glycerophospholipids are the main structural lipids of membranes, built on a glycerol backbone."},{"s":"glycerophospholipids","t":"eicosanoids","type":"prerequisite","why":"Phospholipase A₂ cleaves the C-2 ester of membrane glycerophospholipids, releasing arachidonic acid, the precursor of all eicosanoids."},{"s":"glycerophospholipids","t":"phospholipids","type":"prerequisite","why":"Two ester-linked tails plus a charged phosphate head give the cylinder-like amphipathic shape that self-assembles into the membrane bilayer."},{"s":"glycerophospholipids","t":"ip3-calcium","type":"prerequisite","why":"Phospholipase C cleaves the glycerophospholipid PIP₂ into IP₃, which releases ER Ca²⁺, and DAG, which stays in the membrane and activates protein kinase C."},{"s":"sphingolipids","t":"lipids","type":"part-of","why":"Sphingolipids are membrane lipids built on sphingosine rather than glycerol."},{"s":"sphingolipids","t":"glycerophospholipids","type":"contrasts","why":"Both are amphipathic membrane lipids, but sphingolipids use sphingosine with one amide-linked fatty acid instead of glycerol with two ester-linked tails."},{"s":"sphingolipids","t":"myelination","type":"affects","why":"Myelin membranes are rich in sphingomyelin and galactocerebroside, whose long saturated chains pack tightly into high-resistance, low-capacitance insulation around axons."},{"s":"steroids","t":"lipids","type":"part-of","why":"Steroids are lipids defined by a fused four-ring carbon skeleton rather than by fatty acid chains."},{"s":"steroids","t":"cholesterol-fluidity","type":"explains","why":"Cholesterol's rigid, nearly flat ring system and single 3-OH let it sit between phospholipids with the OH at the heads, restraining tail motion."},{"s":"steroids","t":"steroid-hormones","type":"prerequisite","why":"Cortisol, aldosterone and the sex hormones keep cholesterol's fused four-ring nucleus, so they cross membranes and need plasma carrier proteins."},{"s":"steroids","t":"bile-salts","type":"prerequisite","why":"The liver converts cholesterol into bile acids by adding hydroxyls and a charged side chain, producing an amphipathic steroid; this is the main route of cholesterol excretion."},{"s":"terpenes","t":"lipids","type":"part-of","why":"Terpenes are isoprene-based lipids that supply the carbon skeletons of steroids, carotenoids and several vitamins."},{"s":"terpenes","t":"steroids","type":"prerequisite","why":"Six isoprene units form squalene, a C30 triterpene that cyclizes to lanosterol and then cholesterol, so steroids are modified triterpenoids."},{"s":"terpenes","t":"fat-soluble-vitamins","type":"prerequisite","why":"Vitamins A, E and K are isoprenoid-derived; β-carotene, a C40 tetraterpene, is cleaved into two molecules of retinal (vitamin A)."},{"s":"terpenes","t":"lipidation","type":"prerequisite","why":"Prenylation attaches a C15 farnesyl or C20 geranylgeranyl isoprenoid to a C-terminal cysteine, anchoring proteins such as Ras to membranes."},{"s":"fat-soluble-vitamins","t":"lipids","type":"part-of","why":"Vitamins A, D, E and K are classed as lipids because their nonpolar structures make them fat-soluble."},{"s":"fat-soluble-vitamins","t":"clotting","type":"affects","why":"Vitamin K is the cofactor for γ-carboxylating glutamates on factors II, VII, IX and X so they bind Ca²⁺; warfarin works by blocking vitamin K recycling."},{"s":"fat-soluble-vitamins","t":"photoreceptors","type":"prerequisite","why":"Vitamin A supplies 11-cis-retinal, rhodopsin's chromophore, which light isomerizes to all-trans-retinal; deficiency first appears as night blindness."},{"s":"eicosanoids","t":"lipids","type":"part-of","why":"Eicosanoids are signaling lipids derived from the 20-carbon fatty acid arachidonic acid."},{"s":"eicosanoids","t":"clotting","type":"affects","why":"Platelet COX-1 makes thromboxane A₂, which recruits more platelets and constricts vessels; low-dose aspirin blocks it for the platelet's lifespan."},{"s":"eicosanoids","t":"innate-immunity","type":"affects","why":"Prostaglandins produce vasodilation, pain and fever (acting on the hypothalamus), and leukotrienes attract neutrophils, generating the classic signs of inflammation."},{"s":"lipoproteins","t":"lipids","type":"part-of","why":"Lipoproteins are the particles that package insoluble lipids for transport in blood and lymph."},{"s":"lipoproteins","t":"cardiovascular-system","type":"affects","why":"Excess LDL deposits cholesterol in artery walls, forming atherosclerotic plaques that narrow vessels; HDL carries cholesterol back to the liver."},{"s":"membranes","t":"organelles","type":"prerequisite","why":"Each organelle is defined by a membrane whose selective permeability lets it keep its own pH, ion content and enzyme set."},{"s":"membranes","t":"nervous-system","type":"prerequisite","why":"Neural signaling is built on membrane properties: a bilayer impermeable to ions, plus selective channels and pumps, lets neurons hold and rapidly change voltage."},{"s":"membranes","t":"endocrine-system","type":"affects","why":"Membrane permeability splits hormone signaling: lipid-soluble steroids cross to intracellular receptors, while water-soluble peptides must act through surface receptors and second messengers."},{"s":"membranes","t":"renal-system","type":"prerequisite","why":"Nephron reabsorption and secretion come from pumps, channels and cotransporters placed differently on apical and basolateral membranes of tubule cells."},{"s":"fluid-mosaic","t":"membranes","type":"part-of","why":"The fluid mosaic model is the standard description of membrane structure."},{"s":"fluid-mosaic","t":"facilitated-diffusion","type":"prerequisite","why":"Channels and carriers are integral proteins spanning the bilayer, so facilitated diffusion presupposes proteins embedded in the lipid sea."},{"s":"fluid-mosaic","t":"lipidation","type":"prerequisite","why":"Knowing how proteins associate with leaflets comes first; lipidation tethers otherwise soluble proteins to one leaflet via attached lipid tails."},{"s":"phospholipids","t":"membranes","type":"part-of","why":"The phospholipid bilayer is the structural core of every biological membrane."},{"s":"phospholipids","t":"simple-diffusion","type":"explains","why":"The bilayer's nonpolar core dissolves small hydrophobic molecules but rejects ions and polar solutes, which decides what can simply diffuse across."},{"s":"phospholipids","t":"myelination","type":"explains","why":"Myelin is many wrapped layers of lipid-rich membrane whose nonpolar core blocks ion flow, insulating the axon so the impulse jumps between nodes of Ranvier."},{"s":"phospholipids","t":"ip3-calcium","type":"prerequisite","why":"The membrane phospholipid PIP₂ is cleaved by phospholipase C into IP₃ and DAG, so the bilayer itself supplies these second messengers."},{"s":"phospholipids","t":"bile-salts","type":"contrasts","why":"Two-tailed phospholipids are roughly cylindrical and form bilayers, while bile salts, with a flat steroid ring and one polar face, form micelles that emulsify dietary fat."},{"s":"cholesterol-fluidity","t":"membranes","type":"part-of","why":"Cholesterol is a major membrane lipid that tunes bilayer fluidity."},{"s":"cholesterol-fluidity","t":"fluid-mosaic","type":"affects","why":"Cholesterol sets how freely lipids and proteins move sideways, buffering the fluidity the model depends on across temperatures."},{"s":"cholesterol-fluidity","t":"simple-diffusion","type":"affects","why":"By filling gaps between phospholipid tails, cholesterol lowers the bilayer's permeability to small polar mo
