ork."},{"s":"ohms-law","t":"resting-potential","type":"applies-to","why":"Each ion's current equals its conductance times its driving force (Vm − E_ion), Ohm's law applied to membrane channels."},{"s":"ohms-law","t":"blood-pressure","type":"applies-to","why":"Mean arterial pressure ≈ cardiac output × total peripheral resistance is Ohm's law (V = IR) applied to the circulation."},{"s":"ohms-law","t":"circuits","type":"part-of","why":"Ohm's law is the basic relation between voltage, current and resistance in circuits."},{"s":"ohms-law","t":"resistors","type":"prerequisite","why":"Series and parallel rules come from applying V = IR to each resistor with shared current or shared voltage."},{"s":"resistors","t":"cardiac-output","type":"applies-to","why":"Organs are perfused in parallel, so each receives a share of cardiac output inversely related to its own vascular resistance."},{"s":"resistors","t":"airway-anatomy","type":"applies-to","why":"Each bronchiole is narrow, but huge numbers in parallel make total small-airway resistance low, so medium-sized bronchi, not the smallest airways, contribute most resistance."},{"s":"resistors","t":"circuits","type":"part-of","why":"Series and parallel resistor rules are core tools for analyzing circuits."},{"s":"capacitors-circuits","t":"synapses","type":"applies-to","why":"The membrane's RC time constant sets how long a postsynaptic potential lingers, which governs how well successive inputs summate over time."},{"s":"capacitors-circuits","t":"circuits","type":"part-of","why":"Capacitor combinations and RC behavior are part of circuit analysis."},{"s":"capacitors-circuits","t":"resistors","type":"contrasts","why":"Resistors add directly in series and reciprocally in parallel, while capacitors follow the opposite rules."},{"s":"kirchhoff","t":"cardiac-output","type":"applies-to","why":"Like the junction rule, flow in equals flow out, so over time the right and left ventricles, which are in series, must pump equal outputs."},{"s":"kirchhoff","t":"circuits","type":"part-of","why":"Kirchhoff's rules are the conservation laws used to solve any circuit."},{"s":"kirchhoff","t":"resistors","type":"explains","why":"The junction rule gives equal current through series elements and the loop rule gives equal voltage across parallel branches, producing the R_eq formulas."},{"s":"electrical-power","t":"electrolytic-cells","type":"applies-to","why":"An electrolytic cell draws electrical power P = IV from an external source to drive a nonspontaneous reaction."},{"s":"electrical-power","t":"circuits","type":"part-of","why":"Electrical power measures the rate at which circuits deliver energy."},{"s":"electrical-power","t":"resistors","type":"applies-to","why":"Power formulas pick out which resistor heats most: the larger one in series (P = I²R) but the smaller one in parallel (P = V²/R)."},{"s":"ac-rms","t":"circuits","type":"part-of","why":"Alternating current is the time-varying form of circuits used in household power."},{"s":"ac-rms","t":"electrical-power","type":"applies-to","why":"Average AC power uses rms values, P = I_rms·V_rms, because a sinusoidal current averages to zero but its square does not."},{"s":"waves-sound","t":"optics","type":"prerequisite","why":"Light shares wave behaviors (v = fλ, superposition, interference, Doppler shift), so wave basics come first."},{"s":"waves-sound","t":"audition","type":"applies-to","why":"Pitch tracks frequency and loudness tracks intensity, and the cochlea sorts incoming sound by frequency along the basilar membrane."},{"s":"wave-properties","t":"waves-sound","type":"part-of","why":"Frequency, wavelength, speed and amplitude define every wave."},{"s":"wave-properties","t":"ultrasound","type":"applies-to","why":"With v ≈ 1540 m/s in tissue, a 5 MHz pulse has λ ≈ 0.3 mm, and shorter wavelengths resolve finer structures."},{"s":"wave-properties","t":"em-spectrum","type":"prerequisite","why":"The relation c = fλ is how wavelength and frequency are interconverted across the electromagnetic spectrum."},{"s":"wave-properties","t":"refraction","type":"explains","why":"At a boundary frequency stays fixed while speed changes, so wavelength changes; the side of an oblique wavefront that slows first lags, bending the ray."},{"s":"wave-properties","t":"tonotopic","type":"applies-to","why":"Higher-frequency sounds peak near the stiff base of the basilar membrane and lower frequencies near the apex, mapping frequency to place."},{"s":"superposition","t":"waves-sound","type":"part-of","why":"Superposition governs how overlapping waves combine."},{"s":"superposition","t":"diffraction","type":"explains","why":"Diffraction patterns arise from superposition of wavelets from different parts of an opening, which interfere according to their path differences."},{"s":"superposition","t":"interference","type":"prerequisite","why":"Double-slit fringes are superposition of waves from two slits: bright where crests meet crests, dark where crests meet troughs."},{"s":"standing-waves","t":"quantum-numbers","type":"applies-to","why":"In the de Broglie picture, only whole-number standing-wave patterns fit around a bound electron, an analogy for why energy levels are discrete and n is an integer."},{"s":"standing-waves","t":"superposition","type":"part-of","why":"Standing waves form from superposition of waves reflecting back and forth."},{"s":"standing-waves","t":"audition","type":"applies-to","why":"The ear canal acts roughly like a pipe closed at the eardrum (f = v/4L), resonating near 3 kHz and boosting hearing sensitivity around that range."},{"s":"sound-intensity","t":"waves-sound","type":"part-of","why":"Intensity and the decibel scale quantify how loud a sound wave is."},{"s":"sound-intensity","t":"webers-law","type":"applies-to","why":"A just-noticeable loudness change is roughly a constant fraction of intensity, so equal intensity ratios, which decibels count as equal steps, feel like similar changes."},{"s":"sound-intensity","t":"hair-cells","type":"affects","why":"Prolonged exposure above about 85 dB damages cochlear hair cells, which do not regenerate in humans, causing noise-induced hearing loss."},{"s":"doppler","t":"cardiac-output","type":"applies-to","why":"Doppler echocardiography measures blood velocity in the left ventricular outflow tract; velocity integrated over a beat times outflow area gives stroke volume, hence cardiac output."},{"s":"doppler","t":"waves-sound","type":"part-of","why":"The Doppler effect is the frequency shift caused by relative motion of source and observer."},{"s":"doppler","t":"ultrasound","type":"applies-to","why":"Doppler ultrasound measures the frequency shift of echoes from moving red blood cells to compute flow speed and direction."},{"s":"ultrasound","t":"reproductive-system","type":"applies-to","why":"Because it is non-ionizing, ultrasound is the standard way to image the fetus, placenta and ovarian follicles during pregnancy and fertility care."},{"s":"ultrasound","t":"waves-sound","type":"part-of","why":"Ultrasound is the medical application of high-frequency sound waves."},{"s":"ultrasound","t":"em-spectrum","type":"contrasts","why":"Ultrasound is a mechanical, longitudinal, non-ionizing wave that needs a medium, unlike X-rays, which are ionizing electromagnetic radiation."},{"s":"optics","t":"atomic-structure","type":"applies-to","why":"Emission and absorption lines appear when electrons jump between quantized levels, emitting or absorbing photons whose energy equals the gap."},{"s":"optics","t":"spectroscopy","type":"prerequisite","why":"Spectroscopy relies on molecules absorbing photons of specific energies, E = hf, from different regions of the EM spectrum."},{"s":"optics","t":"sensation-perception","type":"applies-to","why":"Vision begins with optics: the cornea and lens focus a real, inverted image on the retina, where photoreceptors transduce photons."},{"s":"em-spectrum","t":"ner","type":"affects","why":"UV light fuses adjacent pyrimidines, most often thymines, into dimers that distort the helix and must be removed by nucleotide excision repair."},{"s":"em-spectrum","t":"ir","type":"applies-to","why":"IR photon energies match molecular vibrations, so bonds absorb at characteristic wavenumbers, such as C=O near 1700 cm⁻¹."},{"s":"em-spectrum","t":"uv-spec","type":"applies-to","why":"UV–Vis photons promote electrons to higher orbitals; more conjugation absorbs longer wavelengths, and a compound's color complements what it absorbs."},{"s":"em-spectrum","t":"optics","type":"part-of","why":"The EM spectrum organizes light by wavelength, frequency and photon energy."},{"s":"em-spectrum","t":"photoreceptors","type":"applies-to","why":"Cones absorb best at short, medium and long visible wavelengths (about 420, 530 and 560 nm), while rods peak near 500 nm."},{"s":"reflection","t":"ultrasound","type":"applies-to","why":"Ultrasound images are built from echoes reflected at tissue boundaries, with more reflection where acoustic impedance differs more."},{"s":"reflection","t":"optics","type":"part-of","why":"Reflection and mirrors are a core part of geometric optics."},{"s":"reflection","t":"thin-lens","type":"contrasts","why":"Mirrors and lenses share 1/f = 1/o + 1/i, but real images form on the object's side for mirrors and on the far side for lenses."},{"s":"refraction","t":"optics","type":"part-of","why":"Refraction and Snell's law describe how light bends between media."},{"s":"refraction","t":"thin-lens","type":"prerequisite","why":"Lenses focus light by refracting it at curved surfaces, so Snell's law underlies a lens's focal length."},{"s":"refraction","t":"vision","type":"applies-to","why":"The cornea does about two-thirds of the eye's focusing because the air–cornea boundary has the largest jump in refractive index."},{"s":"tir","t":"reflection","type":"contrasts","why":"Ordinary reflection at a glass surface returns only a few percent of the light, while total internal reflection beyond the critical angle returns essentially all of it."},{"s":"tir","t":"refraction","type":"part-of","why":"Total internal reflection is the limiting case of refraction beyond the critical angle."},{"s":"thin-lens","t":"optics","type":"part-of","why":"The thin lens equation describes image formation by lenses in geometric optics."},{"s":"thin-lens","t":"vision","type":"applies-to","why":"The lens changes power by accommodation; myopia is corrected with diverging (negative) lenses and hyperopia with converging (positive) lenses."},{"s":"diffraction","t":"protein-structure","type":"applies-to","why":"X-ray wavelengths (~0.1 nm) match interatomic spacing, so diffraction from protein crystals reveals atomic-level 3D structure."},{"s":"diffraction","t":"optics","type":"part-of","why":"Diffraction is a wave-optics phenomenon that limits resolution."},{"s":"diffraction","t":"interference","type":"prerequisite","why":"Single-slit diffraction sets the envelope within which double-slit interference fringes appear, and both follow from path differences."},{"s":"interference","t":"optics","type":"part-of","why":"Slit interference is the classic wave-optics evidence that light is a wave."},{"s":"interference","t":"em-spectrum","type":"applies-to","why":"Measuring double-slit fringe spacing gives light's wavelength via d sinθ = mλ, historically confirming that light is a wave."},{"s":"polarization-light","t":"r-s","type":"contrasts","why":"The sign of optical rotation, (+) or (−), is measured experimentally and cannot be predicted from a molecule's R or S label."},{"s":"polarization-light","t":"meso","type":"applies-to","why":"Meso compounds have stereocenters but an internal mirror plane, so they are achiral and do not rotate plane-polarized light."},{"s":"polarization-light","t":"optics","type":"part-of","why":"Polarization describes the orientation of light's electric field, a wave-optics property."},{"s":"sensation-perception","t":"learning-memory","type":"prerequisite","why":"Information must be sensed and attended before it can be held in sensory memory, encoded or associated through conditioning."},{"s":"sensation-perception","t":"cognition","type":"prerequisite","why":"Perception supplies the organized representations of objects and events that reasoning, language and decision making then operate on."},{"s":"thresholds","t":"sound-intensity","type":"applies-to","why":"The decibel reference intensity, I₀ = 10⁻¹² W/m², is set near the absolute threshold of human hearing, so 0 dB means barely audible."},{"s":"thresholds","t":"sensation-perception","type":"part-of","why":"Thresholds quantify the minimum stimulus and minimum change that sensation can register, the starting point of psychophysics."},{"s":"thresholds","t":"signal-detection","type":"prerequisite","why":"Signal detection theory revises fixed-threshold ideas by showing that detection near threshold also depends on response bias."},{"s":"thresholds","t":"somatosensation","type":"applies-to","why":"Two-point discrimination thresholds are small on fingertips and large on the back because touch receptor density differs."},{"s":"webers-law","t":"thresholds","type":"part-of","why":"Weber's law describes how the difference threshold scales in proportion to baseline stimulus intensity."},{"s":"webers-law","t":"somatosensation","type":"applies-to","why":"Weber derived the law from lifted weights: the extra weight needed to feel a difference grows in proportion to the weight held."},{"s":"signal-detection","t":"sensation-perception","type":"part-of","why":"Signal detection theory models how sensory evidence and decision bias together determine whether a stimulus is reported."},{"s":"signal-detection","t":"retrieval","type":"applies-to","why":"Recognition memory is modeled as an old/new detection decision, so a lenient criterion produces more false recognitions, the memory equivalent of false alarms."},{"s":"sensory-adaptation","t":"sensation-perception","type":"part-of","why":"Adaptation is how sensory systems reduce their response to unchanging stimuli so that change stands out."},{"s":"sensory-adaptation","t":"thresholds","type":"affects","why":"Prolonged stimulation raises the absolute threshold, so a constant stimulus that was once detectable can drop below awareness."},{"s":"sensory-adaptation","t":"somatosensation","type":"applies-to","why":"Rapidly adapting mechanoreceptors such as Pacinian corpuscles respond mainly to change, so steady pressure from clothing quickly stops being felt."},{"s":"vision","t":"sensation-perception","type":"part-of","why":"Vision transduces light into neural signals and builds visual percepts; it is one of the major sensory systems."},{"s":"vision","t":"audition","type":"contrasts","why":"Visual signals relay through the lateral geniculate nucleus to occipital cortex, auditory signals through the medial geniculate nucleus to temporal cortex; the two relays are easily swapped."},{"s":"vision","t":"circadian","type":"affects","why":"Melanopsin-containing retinal ganglion cells send light information directly to the suprachiasmatic nucleus, entraining the circadian clock."},{"s":"photoreceptors","t":"action-potential","type":"contrasts","why":"Photoreceptors use graded potentials, not action potentials, and hyperpolarize to their stimulus as cGMP-gated Na⁺ channels close."},{"s":"photoreceptors","t":"thresholds","type":"explains","why":"Rods can respond to single photons and converge onto ganglion cells, giving the very low absolute threshold of vision in dim light."},{"s":"photoreceptors","t":"sensory-adaptation","type":"explains","why":"Dark adaptation reflects photopigment regeneration: cones reach peak sensitivity in about 10 minutes, while rods keep gaining sensitivity for 20–30 minutes."},{"s":"photoreceptors","t":"vision","type":"part-of","why":"Rods and cones are the retinal cells that transduce light, the first step of visual processing."},{"s":"lateral-inhibition","t":"vision","type":"part-of","why":"Lateral inhibition among retinal neurons is a processing step that sharpens edges early in the visual pathway."},{"s":"lateral-inhibition","t":"parallel-processing","type":"prerequisite","why":"Center-surround receptive fields created by lateral inhibition are the building blocks that cortical feature detectors combine into edge and orientation detectors."},{"s":"lateral-inhibition","t":"somatosensation","type":"applies-to","why":"Inhibitory interneurons in somatosensory relay nuclei suppress neighboring inputs, sharpening the localization of touch on the skin."},{"s":"parallel-processing","t":"vision","type":"part-of","why":"Visual cortex analyzes color, form, motion and depth simultaneously in separate pathways before integrating them."},{"s":"audition","t":"sensation-perception","type":"part-of","why":"Audition transduces pressure waves into neural signals and is one of the major sensory systems."},{"s":"audition","t":"vestibular-kinesthetic","type":"contrasts","why":"Both use inner-ear hair cells and cranial nerve VIII, but the cochlea encodes sound while the canals and otoliths encode head motion and gravity."},{"s":"audition","t":"language-acquisition","type":"prerequisite","why":"Hearing speech during early childhood is needed for normal spoken language; congenital deafness without early intervention delays spoken language development."},{"s":"hair-cells","t":"resting-potential","type":"contrasts","why":"Most neurons lose K⁺ through open channels, but hair cells bathed in K⁺-rich endolymph depolarize when K⁺ flows in."},{"s":"hair-cells","t":"audition","type":"part-of","why":"Cochlear hair cells are the receptors that transduce basilar membrane vibration into neural signals for hearing."},{"s":"hair-cells","t":"vestibular-kinesthetic","type":"explains","why":"Vestibular hair cells bend when endolymph or otoconia lag behind head movement, converting rotation and linear acceleration into neural signals."},{"s":"tonotopic","t":"sound-intensity","type":"contrasts","why":"Pitch is coded by where the basilar membrane vibrates most, while loudness is coded by firing rate and how many hair cells are recruited."},{"s":"tonotopic","t":"audition","type":"part-of","why":"Tonotopic mapping along the basilar membrane and up to auditory cortex is the main way the auditory system encodes pitch."},{"s":"tonotopic","t":"hair-cells","type":"applies-to","why":"Pitch is read out by which hair cells along the basilar membrane are excited, so noise damage to basal hair cells removes high-frequency hearing first."},{"s":"somatosensation","t":"sensation-perception","type":"part-of","why":"Somatosensation transduces touch, temperature, pain and body position and is a core sensory system."},{"s":"vestibular-kinesthetic","t":"sensation-perception","type":"part-of","why":"Vestibular and kinesthetic senses supply balance and body-position information alongside the classic five senses."},{"s":"vestibular-kinesthetic","t":"vision","type":"affects","why":"The vestibulo-ocular reflex rotates the eyes opposite to head rotation, keeping the retinal image stable during movement."},{"s":"consciousness-sleep","t":"endocrine-system","type":"affects","why":"Sleep and circadian timing govern hormone release: melatonin at night, growth hormone in slow-wave sleep and cortisol peaking in early morning."},{"s":"consciousness-sleep","t":"learning-memory","type":"affects","why":"Sleep, especially slow-wave and REM sleep, consolidates newly encoded memories, and sleep deprivation impairs attention and encoding."},{"s":"consciousness-sleep","t":"psych-disorders","type":"affects","why":"Disturbed sleep is a core symptom and risk factor in depression and bipolar disorder, and substance use disorders arise from psychoactive drug use."},{"s":"circadian","t":"adrenal-cortex","type":"affects","why":"The SCN drives a daily cortisol rhythm through the HPA axis, with cortisol peaking shortly after waking and falling to a low near midnight."},{"s":"circadian","t":"consciousness-sleep","type":"part-of","why":"Circadian timing from the hypothalamic clock governs when sleep and wakefulness occur."},{"s":"circadian","t":"sleep-disorders","type":"affects","why":"Misalignment between the internal clock and the light–dark cycle causes circadian rhythm sleep disorders such as jet lag and shift-work disorder."},{"s":"sleep-stages","t":"anterior-pituitary","type":"affects","why":"The largest growth hormone pulse of the day is released from the anterior pituitary during the first episodes of slow-wave (NREM 3) sleep."},{"s":"sleep-stages","t":"consciousness-sleep","type":"part-of","why":"Sleep stages, defined by EEG patterns, describe how consciousness changes across a night's sleep."},{"s":"sleep-stages","t":"sleep-disorders","type":"explains","why":"Parasomnias follow the stage in which they arise: sleepwalking and night terrors in NREM 3, nightmares and narcoleptic intrusions in REM."},{"s":"sleep-stages","t":"memory-stages","type":"affects","why":"Sleep after learning aids consolidation into long-term memory; slow-wave sleep is most clearly tied to declarative memory, and sleep deprivation impairs retention."},{"s":"sleep-disorders","t":"blood-pressure","type":"affects","why":"Obstructive sleep apnea causes repeated hypoxemia and arousals that trigger sympathetic surges, a recognized cause of hypertension."},{"s":"sleep-disorders","t":"consciousness-sleep","type":"part-of","why":"Sleep disorders are disruptions of the amount, timing or stage structure of sleep."},{"s":"sleep-disorders","t":"depression","type":"affects","why":"Chronic insomnia raises the risk of developing depression, and depression in turn disrupts sleep, for example through early-morning waking."},{"s":"psychoactive-drugs","t":"consciousness-sleep","type":"part-of","why":"Psychoactive drugs produce altered states of consciousness by changing neurotransmission."},{"s":"psychoactive-drugs","t":"sleep-stages","type":"affects","why":"Alcohol and barbiturates suppress REM sleep, so stopping them after regular use produces REM rebound with intense, vivid dreams."},{"s":"psychoactive-drugs","t":"reward-pathway","type":"affects","why":"Nearly all addictive drugs raise dopamine in the nucleus accumbens, directly or by disinhibiting VTA neurons, which drives craving and compulsive use."},{"s":"depressants","t":"synapses","type":"affects","why":"Alcohol, benzodiazepines and barbiturates potentiate GABA-A receptors, increasing Cl⁻ influx and inhibitory postsynaptic potentials that make neurons less likely to fire."},{"s":"depressants","t":"ph-homeostasis","type":"affects","why":"Drug-induced hypoventilation retains CO₂, raising PaCO₂ and causing respiratory acidosis."},{"s":"depressants","t":"breathing-control","type":"affects","why":"Opioids, barbiturates and alcohol depress the medullary respiratory centers, and respiratory depression is the usual cause of overdose death."},{"s":"depressants","t":"adh","type":"affects","why":"Alcohol inhibits ADH release from the posterior pituitary, so the collecting ducts reabsorb less water and urine output rises."},{"s":"depressants","t":"psychoactive-drugs","type":"part-of","why":"Depressants are a class of psychoactive drugs that reduce central nervous system activity."},{"s":"stimulants","t":"adrenal-medulla","type":"affects","why":"Nicotine activates nicotinic acetylcholine receptors on adrenal medulla chromaffin cells, releasing epinephrine into the blood."},{"s":"stimulants","t":"blood-pressure","type":"affects","why":"Enhanced norepinephrine signaling raises heart rate and causes vasoconstriction, so stimulants elevate blood pressure; cocaine can trigger myocardial infarction."},{"s":"stimulants","t":"psychoactive-drugs","type":"part-of","why":"Stimulants are a class of psychoactive drugs that increase arousal and sympathetic activity."},{"s":"hallucinogens","t":"neurotransmitters","type":"affects","why":"LSD, psilocybin and mescaline act mainly as serotonin 5-HT2A receptor agonists, while ketamine and PCP block glutamate NMDA receptors."},{"s":"hallucinogens","t":"sensation-perception","type":"affects","why":"Hallucinogens alter perception, producing hallucinations, synesthesia and distorted time and body sense while sensory input is unchanged."},{"s":"hallucinogens","t":"psychoactive-drugs","type":"part-of","why":"Hallucinogens are a class of psychoactive drugs defined by distortion of perception."},{"s":"hallucinogens","t":"ltp","type":"affects","why":"Ketamine and PCP block NMDA receptors, preventing the Ca²⁺ entry that triggers LTP, which is thought to contribute to their memory-impairing effects."},{"s":"reward-pathway","t":"consciousness-sleep","type":"part-of","why":"The mesolimbic dopamine pathway is the shared target through which drugs alter motivation and produce addiction."},{"s":"reward-pathway","t":"operant-conditioning","type":"explains","why":"Dopamine bursts when a reward exceeds expectation (prediction error) strengthen the actions that preceded it, a neural basis for positive reinforcement."},{"s":"reward-pathway","t":"incentive-theory","type":"explains","why":"Mesolimbic dopamine assigns motivational value to reward cues, giving a biological basis for behavior being pulled by expected incentives."},{"s":"reward-pathway","t":"schizophrenia","type":"affects","why":"Excess mesolimbic dopamine activity is linked to positive symptoms, which is why D2-blocking antipsychotics reduce hallucinations and delusions."},{"s":"reward-pathway","t":"parkinsons","type":"contrasts","why":"Both are dopamine pathways, but Parkinson's disease destroys the nigrostriatal pathway controlling movement, not the mesolimbic reward pathway."},{"s":"learning-memory","t":"cognition","type":"prerequisite","why":"Reasoning, language and problem solving draw on knowledge stored and retrieved from long-term memory."},{"s":"learning-memory","t":"personality","type":"applies-to","why":"Behaviorist and social-cognitive theories treat personality as patterns of behavior learned through reinforcement and observation."},{"s":"learning-memory","t":"psych-disorders","type":"explains","why":"Conditioning models explain how phobias, PTSD triggers and addictions are acquired and why exposure therapy works through extinction."},{"s":"classical-conditioning","t":"oral-digestion","type":"affects","why":"Cues predicting food become conditioned stimuli that trigger cephalic-phase salivation and gastric secretion, the response Pavlov first studied."},{"s":"classical-conditioning","t":"immune-system","type":"affects","why":"Ader and Cohen showed that saccharin paired with an immunosuppressant drug later suppressed immune responses in rats on its own."},{"s":"classical-conditioning","t":"psychoactive-drugs","type":"explains","why":"Drug-taking cues trigger conditioned compensatory responses that add to tolerance, so overdose risk rises when a drug is used in an unfamiliar setting."},{"s":"classical-conditioning","t":"learning-memory","type":"part-of","why":"Classical conditioning is a form of associative learning that pairs two stimuli."},{"s":"classical-conditioning","t":"operant-conditioning","type":"contrasts","why":"Classical conditioning pairs two stimuli to elicit an involuntary response, whereas operant conditioning pairs a voluntary behavior with its consequence."},{"s":"classical-conditioning","t":"anxiety-disorders","type":"explains","why":"Phobias can be acquired when a neutral stimulus is paired with fear, as with Little Albert, and treated by extinction through exposure."},{"s":"operant-conditioning","t":"psychoactive-drugs","type":"applies-to","why":"Drug use is positively reinforced by euphoria and negatively reinforced by relief from withdrawal, which together sustain addiction."},{"s":"operant-conditioning","t":"learning-memory","type":"part-of","why":"Operant conditioning is a form of associative learning that pairs behaviors with consequences."},{"s":"operant-conditioning","t":"language-acquisition","type":"applies-to","why":"Skinner's learning theory holds that caregivers reinforce sounds and words resembling adult speech, shaping language through successive approximations."},{"s":"operant-conditioning","t":"norms-deviance","type":"applies-to","why":"Social sanctions work as reinforcers and punishers: approval rewards conformity to norms while fines, ridicule or exclusion punish deviance."},{"s":"reinforcement-schedules","t":"reward-pathway","type":"affects","why":"Rewards that cannot be fully predicted keep evoking dopamine prediction-error signals, one explanation for why variable schedules sustain responding."},{"s":"reinforcement-schedules","t":"operant-conditioning","type":"part-of","why":"Reinforcement schedules specify how often operant reinforcement is delivered, controlling response rate and extinction."},{"s":"observational-learning","t":"learning-memory","type":"part-of","why":"Observational learning is acquiring behavior by watching models rather than through direct reinforcement."},{"s":"observational-learning","t":"operant-conditioning","type":"contrasts","why":"Observational learning occurs without the learner performing or being reinforced for a behavior, unlike operant conditioning, which requires direct consequences."},{"s":"observational-learning","t":"social-cognitive","type":"prerequisite","why":"Bandura's modeling research underlies the social-cognitive view that personality emerges from observation, expectations and reciprocal determinism."},{"s":"observational-learning","t":"socialization","type":"applies-to","why":"Children acquire gender roles, aggression and other norms partly by imitating parents, peers and media figures, which act as agents of socialization."},{"s":"mirror-neurons","t":"observational-learning","type":"part-of","why":"Mirror neurons are a proposed neural basis for imitating actions observed in others."},{"s":"memory-stages","t":"learning-memory","type":"part-of","why":"The sensory, short-term and long-term stores describe how information moves through memory over time."},{"s":"memory-stages","t":"retrieval","type":"prerequisite","why":"Retrieval cues only help if information was attended and encoded into long-term memory in the first place."},{"s":"memory-stages","t":"alzheimers","type":"applies-to","why":"Early Alzheimer's disease impairs consolidation of new information into long-term memory, so recent events are lost while remote memories persist."},{"s":"explicit-implicit","t":"learning-memory","type":"part-of","why":"The explicit/implicit split classifies long-term memories by whether they are consciously recalled."},{"s":"explicit-implicit","t":"classical-conditioning","type":"applies-to","why":"Conditioned responses are implicit memories, so they can persist even when the conditioning episode itself cannot be consciously recalled."},{"s":"explicit-implicit","t":"parkinsons","type":"applies-to","why":"Parkinson's damages basal ganglia circuits that support procedural (implicit) memory; some patients show impaired habit and skill learning while recalling facts normally."},{"s":"retrieval","t":"learning-memory","type":"part-of","why":"Retrieval is the stage of memory in which stored information is accessed, aided by cues."},{"s":"retrieval","t":"heuristics","type":"explains","why":"The availability heuristic judges frequency by ease of retrieval, so vivid, recent or well-cued memories inflate estimated likelihood."},{"s":"retrieval","t":"depression","type":"applies-to","why":"Mood-congruent recall makes depressed people retrieve negative memories more easily, which reinforces negative thinking."},{"s":"interference-memory","t":"consciousness-sleep","type":"applies-to","why":"Recall is better after sleep than after equal time awake, partly because sleep limits new, retroactively interfering input and partly through active consolidation."},{"s":"interference-memory","t":"learning-memory","type":"part-of","why":"Interference between similar memories is a main cause of forgetting."},{"s":"interference-memory","t":"retrieval","type":"affects","why":"Similar competing memories block access to the target memory, so interference produces retrieval failure even when the memory is still stored."},{"s":"neuroplasticity","t":"synapses","type":"affects","why":"Experience strengthens, weakens, adds or prunes synapses, physically changing the circuits that store learned information."},{"s":"neuroplasticity","t":"somatosensation","type":"affects","why":"After amputation, neighboring regions take over the deprived somatosensory cortex, contributing to phantom limb sensations."},{"s":"neuroplasticity","t":"learning-memory","type":"part-of","why":"Neuroplasticity is the biological capacity for change that allows learning and memory storage."},{"s":"neuroplasticity","t":"language-acquisition","type":"affects","why":"High childhood plasticity underlies the critical period, so a language learned early is acquired more fully, especially its pronunciation and grammar."},{"s":"ltp","t":"synapses","type":"affects","why":"LTP adds AMPA receptors to the postsynaptic membrane, so the same glutamate release produces a larger excitatory postsynaptic potential."},{"s":"ltp","t":"classical-conditioning","type":"applies-to","why":"LTP strengthens a synapse when its input fires together with the postsynaptic cell, a Hebbian cellular model for how pairing a CS with a US could build an association."},{"s":"ltp","t":"memory-stages","type":"explains","why":"Lasting, protein synthesis–dependent synaptic strengthening in the hippocampus is the leading cellular explanation for consolidation into long-term memory."},{"s":"ltp","t":"neuroplasticity","type":"part-of","why":"LTP is the best-characterized cellular mechanism of activity-dependent synaptic plasticity."},{"s":"cognition","t":"emotion-stress","type":"prerequisite","why":"Cognitive appraisal of a situation is central to Schachter–Singer and Lazarus's theories of emotion and stress."},{"s":"cognition","t":"psych-disorders","type":"applies-to","why":"Cognitive models trace depression and anxiety partly to distorted thinking patterns, which cognitive-behavioral therapy targets directly."},{"s":"cognition","t":"social-interaction","type":"prerequisite","why":"Social perception, such as attributions and impression formation, relies on the same schemas and heuristics that guide general cognition."},{"s":"piaget","t":"cognition","type":"part-of","why":"Piaget's stage theory describes how children's thinking develops from sensorimotor to abstract reasoning."},{"s":"piaget","t":"problem-solving","type":"prerequisite","why":"Systematic hypothesis testing and abstract deductive reasoning emerge only in Piaget's formal operational stage."},{"s":"piaget","t":"whorfian","type":"contrasts","why":"Piaget held that thought develops first and language reflects it, the opposite of the Whorfian claim that language shapes thought."},{"s":"piaget","t":"assimilation","type":"contrasts","why":"Piagetian assimilation means fitting new information into existing schemas, unrelated to cultural assimilation, in which a minority group adopts the dominant culture."},{"s":"problem-solving","t":"cognition","type":"part-of","why":"Algorithms and heuristics are the main strategies cognition uses to solve problems and make decisions."},{"s":"problem-solving","t":"intelligence","type":"applies-to","why":"IQ tests largely sample problem solving, and fluid intelligence is defined by reasoning through novel problems for which no learned algorithm exists."},{"s":"heuristics","t":"problem-solving","type":"part-of","why":"Availability and representativeness are the classic mental shortcuts used in problem solving and judgment."},{"s":"heuristics","t":"confirmation-bias","type":"contrasts","why":"Heuristics are shortcuts for judging probability or category membership; confirmation bias is selective search for supporting evidence. Both cause systematic errors, by different routes."},{"s":"heuristics","t":"stigma","type":"affects","why":"Judging an individual by resemblance to a group prototype applies the representativeness heuristic to people, a shortcut that sustains stereotypes underlying stigma."},{"s":"heuristics","t":"sensitivity-specificity","type":"applies-to","why":"Base-rate neglect, a product of the representativeness heuristic, leads people to overrate a positive result for a rare disease, whose low prevalence keeps PPV low."},{"s":"confirmation-bias","t":"retrieval","type":"affects","why":"People preferentially search memory for belief-consistent examples, so recall itself becomes biased toward confirming evidence."},{"s":"confirmation-bias","t":"problem-solving","type":"part-of","why":"Confirmation bias is a systematic error that distorts problem solving by favoring belief-consistent evidence."},{"s":"confirmation-bias","t":"groupthink","type":"affects","why":"Cohesive groups seek evidence that supports the consensus and discount dissent, which deepens groupthink."},{"s":"confirmation-bias","t":"scientific-method","type":"contrasts","why":"Confirmation bias seeks evidence that supports a belief, whereas the scientific method deliberately tests predictions that could prove the hypothesis wrong."},{"s":"confirmation-bias","t":"randomization","type":"explains","why":"Researchers who expect a result tend to see it, so double-blinding hides group assignment from those rating outcomes to keep that bias out of data."},{"s":"language-acquisition","t":"cognition","type":"part-of","why":"Language acquisition theories explain how children develop language, a central cognitive ability."},{"s":"language-acquisition","t":"socialization","type":"affects","why":"Language becomes the main medium through which norms, roles and values are taught, so acquiring it greatly expands what socialization can transmit."},{"s":"whorfian","t":"vision","type":"applies-to","why":"Languages divide the continuous color spectrum into different basic color terms, and speakers discriminate colors slightly faster across their own language's category boundaries."},{"s":"whorfian","t":"language-acquisition","type":"part-of","why":"The Whorfian hypothesis addresses how the language a person acquires might shape thought."},{"s":"whorfian","t":"demographics-culture","type":"applies-to","why":"Languages encode cultural categories such as kinship and color terms, so linguistic relativity is one route by which culture could shape cognition."},{"s":"intelligence","t":"cognition","type":"part-of","why":"Theories of intelligence describe the general and specific cognitive abilities people differ in."},{"s":"intelligence","t":"piaget","type":"contrasts","why":"Psychometric theories measure individual differences in ability, whereas Piaget describes qualitative stages all children pass through."},{"s":"genes-behavior","t":"intelligence","type":"applies-to","why":"Twin and adoption studies show IQ heritability rising from childhood into adulthood, while environment still shifts scores, as the Flynn effect shows."},{"s":"genes-behavior","t":"trait-theory","type":"applies-to","why":"Twin and adoption studies estimate the Big Five traits at roughly 40–50% heritable, with most remaining variance from non-shared environment."},{"s":"genes-behavior","t":"biological-personality","type":"part-of","why":"Twin, adoption and family studies supply the evidence that genes shape temperament and personality traits."},{"s":"genes-behavior","t":"schizophrenia","type":"applies-to","why":"Twin studies find schizophrenia concordance near 50% in identical twins versus roughly 15% in fraternal twins: strong but incomplete genetic influence."},{"s":"emotion-stress","t":"endocrine-system","type":"affects","why":"Stress activates the HPA axis (CRH → ACTH → cortisol) and the sympathetic–adrenal medullary system (epinephrine), linking emotion to hormonal regulation."},{"s":"emotion-stress","t":"cardiovascular-system","type":"affects","why":"Sympathetic arousal during emotion and stress raises heart rate, contractility and vasoconstriction; chronic activation contributes to hypertension."},{"s":"emotion-stress","t":"immune-system","type":"affects","why":"Chronic stress keeps cortisol high, which suppresses lymphocyte activity and inflammation, so stressed people heal slower and catch more infections."},{"s":"emotion-stress","t":"psych-disorders","type":"affects","why":"In the diathesis–stress model, stressors interact with inherited vulnerability to trigger disorders such as depression, PTSD and schizophrenia."},{"s":"emotion-stress","t":"health-disparities","type":"affects","why":"Chronic stress from poverty and discrimination keeps the stress response active, one physiological pathway thought to contribute to worse health in disadvantaged groups."},{"s":"james-lange","t":"emotion-stress","type":"part-of","why":"One of the three classic theories ordering arousal and feeling, here with bodily arousal as the cause of emotion."},{"s":"james-lange","t":"cannon-bard","type":"contrasts","why":"James–Lange makes bodily arousal the cause of the feeling, while Cannon–Bard has the thalamus trigger arousal and feeling simultaneously and independently."},{"s":"james-lange","t":"schachter-singer","type":"prerequisite","why":"Schachter–Singer keeps James–Lange's emphasis on arousal but adds that a cognitive label is needed to decide which emotion is felt."},{"s":"cannon-bard","t":"emotion-stress","type":"part-of","why":"One of the three classic emotion theories, proposing that arousal and feeling arise in parallel."},{"s":"cannon-bard","t":"schachter-singer","type":"contrasts","why":"Cannon–Bard needs no interpretation of arousal, whereas Schachter–Singer says arousal must be cognitively labeled from situational cues to become a specific emotion."},{"s":"schachter-singer","t":"emotion-stress","type":"part-of","why":"One of the three classic emotion theories, adding a cognitive label to arousal."},{"s":"schachter-singer","t":"appraisal","type":"prerequisite","why":"Schachter–Singer introduced cognition into emotion; Lazarus's appraisal theory goes further, placing cognitive evaluation before the arousal and stress response."},{"s":"schachter-singer","t":"attribution","type":"applies-to","why":"Two-factor theory is attribution turned inward: people explain their own arousal from situational cues, so arousal can be misattributed to the wrong source."},{"s":"limbic-system","t":"reward-pathway","type":"prerequisite","why":"The mesolimbic reward pathway runs from the ventral tegmental area to limbic targets like the nucleus accumbens and amygdala."},{"s":"limbic-system","t":"emotion-stress","type":"part-of","why":"The limbic system is the brain circuitry that generates emotion and initiates the stress response."},{"s":"limbic-system","t":"motivation-attitudes","type":"affects","why":"Limbic circuits, including the hypothalamus and nucleus accumbens, generate the hunger, thirst and reward signals that motivation theories describe."},{"s":"amygdala","t":"hypothalamus-pituitary","type":"affects","why":"Amygdala threat signals drive hypothalamic CRH release, activating the HPA axis to raise ACTH and cortisol."},{"s":"amygdala","t":"classical-conditioning","type":"explains","why":"In fear conditioning, the amygdala links a neutral stimulus with an aversive one, so the conditioned stimulus alone triggers freezing and sympathetic arousal."},{"s":"amygdala","t":"limbic-system","type":"part-of","why":"The amygdala is the limbic structure for threat detection and emotional tagging."},{"s":"amygdala","t":"anxiety-disorders","type":"affects","why":"Heightened amygdala reactivity to threat cues is a consistent finding in phobias and social anxiety, biasing attention toward danger."},{"s":"amygdala","t":"trauma-disorders","type":"affects","why":"In PTSD, an overreactive amygdala with weak prefrontal inhibition produces exaggerated fear responses to trauma reminders."},{"s":"hippocampus","t":"adrenal-cortex","type":"affects","why":"Hippocampal glucocorticoid receptors sense cortisol and help inhibit the HPA axis, providing negative feedback that reduces adrenal cortisol output."},{"s":"hippocampus","t":"memory-stages","type":"explains","why":"The hippocampus consolidates information from working memory into long-term declarative storage; without it new facts and events cannot be retained."},{"s":"hippocampus","t":"explicit-implicit","type":"explains","why":"Hippocampal damage (as in patient H.M.) destroys new explicit memory while sparing implicit procedural learning, showing the two systems are separate."},{"s":"hippocampus","t":"limbic-system","type":"part-of","why":"The hippocampus is the limbic structure for consolidating declarative and emotional memories."},{"s":"hypothalamus","t":"anterior-pituitary","type":"affects","why":"Hypothalamic releasing hormones (CRH, TRH, GnRH, GHRH) travel through the portal system to control anterior pituitary secretion."},{"s":"hypothalamus","t":"adh","type":"affects","why":"Hypothalamic osmoreceptors detect rising plasma osmolarity, prompting supraoptic and paraventricular neurons to release ADH from the posterior pituitary and trigger thirst."},{"s":"hypothalamus","t":"circadian","type":"explains","why":"The suprachiasmatic nucleus receives retinal light input and acts as the master clock, timing melatonin release from the pineal gland."},{"s":"hypothalamus","t":"limbic-system","type":"part-of","why":"The hypothalamus is the limbic output that turns emotion and drives into autonomic and hormonal change."},{"s":"hypothalamus","t":"drive-reduction","type":"explains","why":"Hypothalamic set points for hunger, thirst and temperature generate the homeostatic drives that drive reduction theory says behavior works to reduce."},{"s":"appraisal","t":"emotion-stress","type":"part-of","why":"Appraisal is the cognitive step that determines whether an event triggers a stress response."},{"s":"appraisal","t":"gas","type":"affects","why":"Appraisal determines whether a psychological event is treated as a threat and so launches the sustained stress response GAS describes; Selye's model omits this cognitive step."},{"s":"appraisal","t":"anxiety-disorders","type":"applies-to","why":"Cognitive accounts of anxiety describe appraising ambiguous situations as threatening (primary appraisal) and underestimating one's coping resources (secondary appraisal)."},{"s":"gas","t":"gluconeogenesis","type":"affects","why":"Cortisol in the resistance stage induces gluconeogenic enzymes and protein breakdown, raising blood glucose to fuel a prolonged stress response."},{"s":"gas","t":"adrenal-cortex","type":"affects","why":"Sustained stress raises ACTH, driving the adrenal cortex to secrete cortisol through the resistance stage; Selye found enlarged adrenals in stressed rats."},{"s":"gas","t":"immune-system","type":"affects","why":"Prolonged cortisol suppresses immune function and shrinks the thymus, which is why the exhaustion stage brings greater vulnerability to illness."},{"s":"gas","t":"emotion-stress","type":"part-of","why":"GAS is the classic model of the body's physiological stress response over time."},{"s":"motivation-attitudes","t":"learning-memory","type":"affects","why":"Motivational state determines whether a stimulus works as a reinforcer, as food reinforces strongly only when an animal is hungry."},{"s":"motivation-attitudes","t":"social-interaction","type":"affects","why":"Attitudes and motives shape how people respond to persuasion, group pressure and requests, and social roles in turn reshape attitudes."},{"s":"drive-reduction","t":"operant-conditioning","type":"explains","why":"Hull proposed that primary reinforcers like food and water strengthen behavior because they reduce biological drives."},{"s":"drive-reduction","t":"motivation-attitudes","type":"part-of","why":"Drive reduction is the homeostatic, internally pushed theory of motivation."},{"s":"drive-reduction","t":"maslow","type":"prerequisite","why":"Maslow's base tier is the homeostatic physiological needs of drive reduction, which explains why deficiency needs take priority over growth needs."},{"s":"maslow","t":"motivation-attitudes","type":"part-of","why":"Maslow's hierarchy is the need-based theory of motivation."},{"s":"maslow","t":"humanistic","type":"prerequisite","why":"Self-actualization, the top of Maslow's hierarchy, is the growth goal central to humanistic personality theory."},{"s":"incentive-theory","t":"motivation-attitudes","type":"part-of","why":"Incentive theory is the externally pulled, reward-based theory of motivation."},{"s":"incentive-theory","t":"drive-reduction","type":"contrasts","why":"Incentive theory explains behavior pulled by external rewards (dessert when full), while drive reduction explains behavior pushed by internal deprivation."},{"s":"incentive-theory","t":"education","type":"applies-to","why":"Grades and prizes are extrinsic incentives; the overjustification effect warns they can undermine students' intrinsic interest in learning."},{"s":"attitude-components","t":"motivation-attitudes","type":"part-of","why":"The ABC model defines what an attitude is and its three components."},{"s":"attitude-components","t":"cognitive-dissonance","type":"prerequisite","why":"Dissonance arises when the components of an attitude, or an attitude and a behavior, conflict, so the ABC model comes first."},{"s":"attitude-components","t":"stigma","type":"applies-to","why":"Stigma maps onto the ABC model: stereotypes are the cognitive component, prejudice the affective component and discrimination the behavioral component."},{"s":"cognitive-dissonance","t":"confirmation-bias","type":"affects","why":"To avoid dissonance, people seek information that supports existing beliefs and avoid challenges, reinforcing confirmation bias."},{"s":"cognitive-dissonance","t":"motivation-attitudes","type":"part-of","why":"Cognitive dissonance describes how conflicts between attitudes and behavior drive attitude change."},{"s":"cognitive-dissonance","t":"compliance-techniques","type":"explains","why":"One account of foot-in-the-door: after agreeing to a small request, refusing a larger one would clash with a helpful self-image, so people comply to stay consistent."},{"s":"compliance-techniques","t":"motivation-attitudes","type":"part-of","why":"Compliance techniques show how the order and framing of requests shift behavior, linking attitudes and consistency to social influence."},{"s":"compliance-techniques","t":"conformity","type":"contrasts","why":"Compliance responds to an explicit request, while conformity adjusts behavior to match group norms without anyone asking, as in Asch's line study."},{"s":"compliance-techniques","t":"obedience","type":"contrasts","why":"Compliance is yielding to a request from an equal, whereas obedience, as in Milgram's study, is following a direct order from an authority figure."},{"s":"personality","t":"emotion-stress","type":"affects","why":"Traits such as high neuroticism and hostility shape how stressors are appraised and increase the emotional and physiological stress response."},{"s":"personality","t":"personality-disorders","type":"prerequisite","why":"Personality disorders are extreme, rigid versions of normal personality patterns, so understanding traits and their stability comes first."},{"s":"personality","t":"attribution","type":"prerequisite","why":"Dispositional attributions explain behavior through personality, and the fundamental attribution error overweights personality while underweighting the situation."},{"s":"psychoanalytic","t":"piaget","type":"contrasts","why":"Freud's psychosexual stages (oral to genital) track where libido is focused and conflict arises, while Piaget's stages (sensorimotor to formal operational) track how thinking develops."},{"s":"psychoanalytic","t":"personality","type":"part-of","why":"Freud's psychoanalytic theory is the earliest major perspective on personality."},{"s":"psychoanalytic","t":"humanistic","type":"contrasts","why":"Psychoanalytic theory sees behavior as driven by unconscious conflict and early childhood, while humanists stress conscious choice, free will and growth."},{"s":"defense-mechanisms","t":"appraisal","type":"contrasts","why":"Coping strategies in appraisal theory are conscious, deliberate efforts to manage stress, while defense mechanisms are unconscious distortions of reality."},{"s":"defense-mechanisms","t":"psychoanalytic","type":"part-of","why":"Defense mechanisms are the ego's tools in Freud's model of unconscious conflict."},{"s":"humanistic","t":"personality","type":"part-of","why":"The humanistic perspective explains personality through growth, free will and self-concept."},{"s":"humanistic","t":"trait-theory","type":"contrasts","why":"Trait theory compares people on shared measurable dimensions, while humanistic theory focuses on each person's subjective self-concept and capacity for growth."},{"s":"humanistic","t":"family","type":"applies-to","why":"Rogers argued that unconditional positive regard from caregivers builds a congruent self-concept, while love tied to conditions of worth creates incongruence."},{"s":"trait-theory","t":"personality","type":"part-of","why":"Trait theory describes personality as stable, measurable dimensions."},{"s":"trait-theory","t":"social-cognitive","type":"contrasts","why":"Trait theory predicts consistency across situations, while Mischel's social-cognitive critique showed behavior depends heavily on the person–situation interaction."},{"s":"trait-theory","t":"personality-disorders","type":"applies-to","why":"Dimensional models describe personality disorders as extreme, inflexible levels of normal traits, such as low agreeableness and low conscientiousness in antisocial PD."},{"s":"biological-personality","t":"personality","type":"part-of","why":"The biological perspective explains personality through genes, temperament and brain physiology."},{"s":"biological-personality","t":"trait-theory","type":"explains","why":"Eysenck traced extraversion to reticular activating system arousal, and twin studies show trait similarity driven by shared genes."},{"s":"biological-personality","t":"socialization","type":"affects","why":"Inborn temperament evokes different responses from parents and peers, so biology shapes the socialization a child receives (evocative gene–environment correlation)."},{"s":"social-cognitive","t":"appraisal","type":"affects","why":"High self-efficacy and an internal locus of control make secondary appraisal more favorable, so the same demand is seen as a challenge rather than a threat."},{"s":"social-cognitive","t":"personality","type":"part-of","why":"The social-cognitive perspective explains personality through learning, cognition and environment interacting."},{"s":"social-cognitive","t":"socialization","type":"explains","why":"Children acquire norms, gender roles and aggression by observing and imitating agents of socialization, with reinforcement and self-efficacy shaping what they try."},{"s":"psych-disorders","t":"stigma","type":"affects","why":"A psychiatric label carries stigma that can lead to discrimination and self-stigma, deterring people from seeking treatment."},{"s":"biopsychosocial","t":"psych-disorders","type":"part-of","why":"These models are the frameworks used to explain the causes of psychological disorders and to choose treatments."},{"s":"biopsychosocial","t":"ses","type":"applies-to","why":"Low SES is a social factor in the biopsychosocial model, raising illness risk through chronic stress, poorer access to care and environmental exposures."},{"s":"biopsychosocial","t":"health-disparities","type":"applies-to","why":"Disparities are explained by biological risk, psychological stress and coping, and social factors like access, discrimination and neighborhood combined, not genes alone."},{"s":"schizophrenia","t":"psych-disorders","type":"part-of","why":"Schizophrenia is the major psychotic disorder in the DSM-5."},{"s":"schizophrenia","t":"parkinsons","type":"contrasts","why":"Schizophrenia's positive symptoms reflect excess dopamine signaling and Parkinson's reflects too little, so D2-blocking antipsychotics can cause parkinsonism and L-DOPA can cause psychosis."},{"s":"schizophrenia","t":"social-mobility","type":"affects","why":"The social drift hypothesis holds that schizophrenia causes downward mobility, helping explain its concentration in low-SES groups."},{"s":"depression","t":"adrenal-cortex","type":"affects","why":"Many patients with severe depression show HPA overactivity: elevated cortisol that fails to suppress normally after a dexamethasone dose."},{"s":"depression","t":"sleep-stages","type":"affects","why":"Depression shortens the time to the first REM period, increases REM density and reduces slow-wave sleep, often with early-morning waking."},{"s":"depression","t":"psych-disorders","type":"part-of","why":"Depressive disorders are a major DSM-5 category of mood disorders."},{"s":"bipolar","t":"circadian","type":"affects","why":"Bipolar disorder involves disrupted circadian rhythms; decreased need for sleep is a core manic sign, and sleep loss can trigger a manic episode."},{"s":"bipolar","t":"psych-disorders","type":"part-of","why":"Bipolar disorders are DSM-5 mood disorders defined by manic or hypomanic episodes."},{"s":"bipolar","t":"depression","type":"contrasts","why":"A depressive episode looks the same in both, but any history of mania or hypomania makes it bipolar, and antidepressants alone can trigger mania."},{"s":"anxiety-disorders","t":"adrenal-medulla","type":"affects","why":"A panic attack resembles an acute fight-or-flight surge of the sympathetic–adrenal medullary system: racing heart, sweating and trembling that can mimic a heart attack."},{"s":"anxiety-disorders","t":"ph-homeostasis","type":"affects","why":"Panic attacks often cause hyperventilation, which blows off CO₂ and produces respiratory alkalosis, causing lightheadedness and tingling fingers."},{"s":"anxiety-disorders","t":"psych-disorders","type":"part-of","why":"Anxiety disorders are the most common DSM-5 category, defined by excessive fear and worry."},{"s":"ocd","t":"psych-disorders","type":"part-of","why":"OCD has its own DSM-5 category of obsessive-compulsive and related disorders."},{"s":"ocd","t":"anxiety-disorders","type":"contrasts","why":"Both involve anxiety, but DSM-5 gives OCD its own category because it is defined by obsessions and the compulsions that neutralize them, not fear of a situation."},{"s":"ocd","t":"personality-disorders","type":"contrasts","why":"OCD's obsessions are unwanted and distressing (ego-dystonic), while obsessive-compulsive personality disorder is an accepted (ego-syntonic) trait pattern of perfectionism and control."},{"s":"trauma-disorders","t":"sleep-disorders","type":"affects","why":"PTSD commonly causes trauma-related nightmares and insomnia, and hyperarousal fragments sleep."},{"s":"trauma-disorders","t":"psych-disorders","type":"part-of","why":"Trauma- and stressor-related disorders form a DSM-5 category defined by a precipitating event."},{"s":"trauma-disorders","t":"anxiety-disorders","type":"contrasts","why":"PTSD involves fear and hyperarousal, but DSM-5 moved it out of anxiety disorders into its own category because diagnosis requires exposure to a traumatic event."},{"s":"personality-disorders","t":"psych-disorders","type":"part-of","why":"Personality disorders are DSM-5 conditions of rigid, maladaptive personality patterns."},{"s":"personality-disorders","t":"schizophrenia","type":"contrasts","why":"Schizotypal PD shares odd beliefs, magical thinking and eccentric behavior with schizophrenia but lacks sustained psychosis."},{"s":"personality-disorders","t":"social-interaction","type":"affects","why":"Personality disorders are inflexible interpersonal patterns, such as distrust, manipulation or fear of rejection, that chronically disrupt relationships and group roles."},{"s":"alzheimers","t":"neurotransmitters","type":"affects","why":"Degeneration of cholinergic neurons in the basal forebrain lowers cortical acetylcholine, which acetylcholinesterase inhibitors partially offset by slowing ACh breakdown."},{"s":"alzheimers","t":"explicit-implicit","type":"affects","why":"Explicit episodic memory declines early while implicit procedural memory, such as playing a familiar instrument, is preserved until late."},{"s":"alzheimers","t":"hippocampus","type":"affects","why":"Neurofibrillary tangles appear early in the entorhinal cortex and hippocampus, so recent episodic memory is usually the first ability lost."},{"s":"alzheimers","t":"psych-disorders","type":"part-of","why":"Alzheimer's is a neurocognitive disorder whose memory and personality changes are studied in psychology."},{"s":"alzheimers","t":"parkinsons","type":"contrasts","why":"Alzheimer's begins with memory loss from amyloid plaques, tau tangles and acetylcholine loss, while Parkinson's begins with movement problems from dopamine loss and Lewy bodies."},{"s":"parkinsons","t":"psych-disorders","type":"part-of","why":"Parkinson's is a neurodegenerative disorder that illustrates dopamine's role in movement and mood."},{"s":"stratification","t":"emotion-stress","type":"affects","why":"Lower rank brings more chronic stressors and less control over them, keeping stress responses activated; this is a main pathway linking social position to illness."},{"s":"stratification","t":"psych-disorders","type":"affects","why":"Lower social position predicts higher rates of depression and schizophrenia; chronic stress of poverty (social causation) and illness-driven downward drift both contribute."},{"s":"stratification","t":"biopsychosocial","type":"applies-to","why":"Class, race and gender are core social factors in the biopsychosocial model, shaping exposure to stress, hazards and quality of care alongside biological risk."},{"s":"ses","t":"gas","type":"affects","why":"Low SES brings persistent stressors (financial strain, unsafe housing) that can keep the stress response engaged, the prolonged resistance stage that Selye linked to exhaustion and illness."},{"s":"ses","t":"depression","type":"affects","why":"Depression is more prevalent at lower SES, linked to financial strain, job insecurity and fewer coping resources."},{"s":"ses","t":"stratification","type":"part-of","why":"SES is the main way stratification is measured, combining income, education and occupational prestige into one position."},{"s":"ses","t":"social-mobility","type":"prerequisite","why":"Mobility is defined as change in SES position, so the components of SES must be understood before measuring movement between levels."},{"s":"ses","t":"health-disparities","type":"affects","why":"Health follows a graded SES gradient: each step up in income, education or occupation predicts lower mortality and less chronic disease."},{"s":"poverty","t":"maslow","type":"applies-to","why":"Absolute poverty leaves physiological and safety needs unmet, the base needs that Maslow argued must largely be satisfied before higher needs drive behavior."},{"s":"poverty","t":"stratification","type":"part-of","why":"Poverty marks the bottom of the stratification hierarchy, defined either against a fixed survival threshold or relative to society."},{"s":"poverty","t":"social-mobility","type":"affects","why":"Childhood poverty restricts schooling, networks and neighborhood resources, so poor children are less likely to move up (social reproduction of poverty)."},{"s":"poverty","t":"global-inequality","type":"applies-to","why":"A fixed absolute poverty line allows comparison across nations, showing how extreme poverty is concentrated in low-income periphery countries."},{"s":"poverty","t":"health-disparities","type":"affects","why":"Poverty limits insurance, nutrition, safe housing and time off work for care, producing higher disease burden and worse outcomes among the poor."},{"s":"social-mobility","t":"stratification","type":"part-of","why":"Mobility describes movement up or down the stratification hierarchy and distinguishes open class systems from closed caste systems."},{"s":"social-mobility","t":"socialization","type":"affects","why":"Moving between classes often involves anticipatory socialization: upwardly mobile people adopt the norms, speech and tastes of the class they are entering."},{"s":"spatial-inequality","t":"respiratory-system","type":"affects","why":"Environmental injustice places highways, factories and waste sites near poor and minority neighborhoods, raising air pollution exposure and asthma rates."},{"s":"spatial-inequality","t":"intelligence","type":"affects","why":"Lead paint in older housing and aging pipes concentrate childhood lead exposure in some low-income neighborhoods (as in Flint); even low blood lead levels are associated with lower IQ."},{"s":"spatial-inequality","t":"stratification","type":"part-of","why":"Spatial inequality is stratification mapped onto place, as segregation sorts groups into neighborhoods with unequal resources."},{"s":"spatial-inequality","t":"social-mobility","type":"affects","why":"Children raised in high-poverty, segregated neighborhoods tend to earn less as adults; in studies, children whose families moved to lower-poverty areas when young later earned more."},{"s":"spatial-inequality","t":"health-disparities","type":"affects","why":"Food deserts, few nearby clinics and pharmacies, and local hazards make place of residence a strong predictor of health outcomes."},{"s":"spatial-inequality","t":"education","type":"affects","why":"Schools funded by local property taxes give segregated low-income districts fewer resources, so residential segregation becomes educational inequality."},{"s":"global-inequality","t":"immune-responses","type":"affects","why":"Lower vaccine coverage in poor nations means fewer children gain protective memory responses, so preventable infections like measles still cause many deaths."},{"s":"global-inequality","t":"stratification","type":"part-of","why":"Global inequality applies stratification to nations, ranking them as core, semi-periphery and periphery."},{"s":"global-inequality","t":"health-disparities","type":"affects","why":"Gaps between rich and poor nations produce large differences in life expectancy and infant mortality, largely from unequal access to care, sanitation and nutrition."},{"s":"global-inequality","t":"migration-urbanization","type":"affects","why":"Wage and security gaps between periphery and core nations act as push and pull factors that drive international migration."},{"s":"health-disparities","t":"sickle-cell","type":"applies-to","why":"Sickle cell disease, especially common in people of African ancestry, has received less research funding per patient than cystic fibrosis, and studies report longer waits for pain treatment."},{"s":"health-disparities","t":"stratification","type":"part-of","why":"Unequal health and healthcare are major consequences of stratification by class, race, gender and place."},{"s":"health-disparities","t":"sick-role","type":"affects","why":"Without insurance or nearby care, poorer patients struggle to meet the sick role's obligation to seek competent help, yet may be blamed for not doing so."},{"s":"social-interaction","t":"emotion-stress","type":"affects","why":"Social support from close relationships buffers stress, dampening physiological stress responses, while isolation and conflict act as stressors."},{"s":"social-interaction","t":"social-institutions","type":"prerequisite","why":"Institutions are stable, large-scale patterns of statuses and roles, so understanding micro-level interaction comes first."},{"s":"statuses","t":"social-mobility","type":"explains","why":"Mobility is possible where rank rests on achieved status; caste systems fix rank by ascribed status at birth, blocking movement."},{"s":"statuses","t":"social-interaction","type":"part-of","why":"Statuses and their roles are the basic building blocks that organize every social interaction."},{"s":"statuses","t":"role-strain","type":"prerequisite","why":"Roles are the expected behaviors attached to statuses; role strain arises within one status and role conflict between statuses."},{"s":"statuses","t":"stigma","type":"explains","why":"A stigmatized trait such as mental illness or a criminal record can become a master status, so others see the person mainly through it."},{"s":"statuses","t":"sick-role","type":"prerequisite","why":"The sick role is a temporary set of expected behaviors attached to the status of being ill, so the status–role distinction comes first."},{"s":"role-strain","t":"appraisal","type":"affects","why":"Stress depends on appraising demands against coping resources; role overload and role conflict can push perceived demands beyond perceived resources."},{"s":"role-strain","t":"social-interaction","type":"part-of","why":"Role strain and conflict describe tensions that arise when the roles people perform in interaction make competing demands."},{"s":"role-strain","t":"family","type":"applies-to","why":"Working parents commonly experience role conflict when the demands of employee and parent statuses compete for the same time."},{"s":"group-dynamics","t":"social-interaction","type":"part-of","why":"Group membership types define who people interact with and how strongly groups shape their behavior."},{"s":"group-dynamics","t":"attribution","type":"affects","why":"People attribute in-group successes to disposition and out-group successes to situation, and reverse this for failures (the ultimate attribution error)."},{"s":"group-dynamics","t":"conformity","type":"affects","why":"Conformity is strongest toward in-groups and reference groups whose approval matters, and a unanimous majority exerts the most pressure."},{"s":"group-dynamics","t":"ethnocentrism","type":"explains","why":"In-group favoritism extends to whole cultures: judging other groups by one's own group's standards and seeing one's own as superior is ethnocentrism."},{"s":"group-dynamics","t":"socialization","type":"affects","why":"Primary groups such as family and close peers carry out most early socialization, transmitting norms through intimate, enduring relationships."},{"s":"groupthink","t":"attitude-components","type":"affects","why":"Group polarization makes members' attitudes more extreme and confidently held after like-minded discussion, and stronger attitudes predict behavior more reliably."},{"s":"groupthink","t":"group-dynamics","type":"part-of","why":"Groupthink and polarization are distortions of decision making that arise within cohesive in-groups."},{"s":"attribution","t":"depression","type":"applies-to","why":"A pessimistic explanatory style, attributing bad events to internal, stable and global causes, is linked to learned helplessness and higher risk of depression."},{"s":"attribution","t":"social-interaction","type":"part-of","why":"Attribution describes how people explain one another's behavior, which guides how they respond in interaction."},{"s":"attribution","t":"obedience","type":"applies-to","why":"Observers commit the fundamental attribution error by blaming obedient Milgram participants' character rather than the powerful situational pressure they faced."},{"s":"conformity","t":"social-interaction","type":"part-of","why":"Conformity is a core form of social influence in which a group shapes an individual's behavior."},{"s":"conformity","t":"groupthink","type":"explains","why":"Normative conformity pressure drives the self-censorship and illusion of unanimity that define groupthink."},{"s":"obedience","t":"trait-theory","type":"contrasts","why":"Milgram's obedience rates swung widely with situational changes while personality differences predicted little, a key argument for the situation's power in the person–situation debate."},{"s":"obedience","t":"social-interaction","type":"part-of","why":"Obedience is the form of social influence exerted by authority figures through direct commands."},{"s":"obedience","t":"conformity","type":"contrasts","why":"Obedience responds to explicit orders from a perceived authority, whereas conformity responds to implicit pressure from peers of equal status."},{"s":"obedience","t":"research-ethics","type":"affects","why":"The deception and severe distress in Milgram's studies became a classic case in the debate that shaped rules on deception, debriefing and the right to withdraw."},{"s":"impression-management","t":"social-interaction","type":"part-of","why":"Dramaturgy and impression management describe how people present themselves to others during interaction."},{"s":"impression-management","t":"statuses","type":"applies-to","why":"Dramaturgy treats each status as a part to perform: people display role-appropriate behavior front stage and relax back stage."},{"s":"impression-management","t":"stigma","type":"applies-to","why":"People with a concealable stigma manage information about it, for example by passing or selective disclosure, to avoid a spoiled identity."},{"s":"demographics-culture","t":"cognition","type":"affects","why":"Culture shapes thinking: language categories, attribution styles (weaker fundamental attribution error in collectivist cultures) and problem-solving strategies vary across societies."},{"s":"demographics-culture","t":"stratification","type":"prerequisite","why":"Demographic categories such as race, ethnicity, gender and age are the axes along which stratification ranks people."},{"s":"demographics-culture","t":"social-interaction","type":"affects","why":"Culture supplies the norms, symbols and role expectations that structure everyday interaction, such as personal space and forms of address."},{"s":"demographic-transition","t":"alzheimers","type":"affects","why":"Late-stage populations have low fertility and long life expectancy, so a growing elderly share raises the number of people with age-related diseases such as Alzheimer's."},{"s":"demographic-transition","t":"global-inequality","type":"applies-to","why":"Low-income countries tend to sit in stages 2–3 with young, fast-growing populations, while wealthy countries are in stage 4 with aging populations."},{"s":"demographic-transition","t":"demographics-culture","type":"part-of","why":"The demographic transition models how fertility and mortality, the core demographic variables, shift with development."},{"s":"demographic-transition","t":"family","type":"affects","why":"Falling fertility in stages 3–4 shrinks family size and accompanies a shift from extended toward nuclear households."},{"s":"migration-urbanization","t":"spatial-inequality","type":"affects","why":"Suburbanization and white flight drained tax base from city centers, while gentrification later displaced poor residents, reshaping segregation."},{"s":"migration-urbanization","t":"demographics-culture","type":"part-of","why":"Migration is one of the three processes, with fertility and mortality, that change population size and composition."},{"s":"migration-urbanization","t":"demographic-transition","type":"affects","why":"Urbanization helps drive stage 3: children in cities are costlier and less needed for farm labor, so birth rates fall."},{"s":"migration-urbanization","t":"assimilation","type":"prerequisite","why":"Immigration brings minority groups into contact with a dominant culture, setting up assimilation, pluralism or segregation as possible outcomes."},{"s":"migration-urbanization","t":"anomie","type":"affects","why":"Durkheim argued that rapid urbanization and industrialization weaken traditional social bonds and norms, fostering anomie."},{"s":"globalization","t":"global-inequality","type":"affects","why":"Global trade and outsourcing raise growth in some poorer nations but can deepen core–periphery exploitation, so globalization both narrows and widens gaps."},{"s":"globalization","t":"demographics-culture","type":"part-of","why":"Globalization spreads culture and people across borders, driving cultural diffusion and demographic change."},{"s":"globalization","t":"migration-urbanization","type":"affects","why":"Global labor markets and cheap travel increase international migration and rapid urban growth in developing countries."},{"s":"globalization","t":"economy-government","type":"affects","why":"Multinational corporations and global markets constrain national governments' control over their economies, labor standards and trade policy."},{"s":"assimilation","t":"health-disparities","type":"affects","why":"In the immigrant paradox, first-generation immigrants often have better health than native-born peers, and the advantage fades as they acculturate."},{"s":"assimilation","t":"demographics-culture","type":"part-of","why":"Assimilation is one outcome of contact between cultures, alongside pluralism, amalgamation and segregation."},{"s":"cultural-lag","t":"fertilization","type":"applies-to","why":"In vitro fertilization (first birth in 1978) moved fertilization outside the body before laws had settled questions such as legal parenthood with donor eggs, sperm or surrogates."},{"s":"cultural-lag","t":"demographics-culture","type":"part-of","why":"Cultural lag describes uneven change between the material and nonmaterial components of culture."},{"s":"cultural-lag","t":"anomie","type":"affects","why":"When norms trail technological change, people lack clear rules for new situations, a condition that can produce anomie."},{"s":"ethnocentrism","t":"intelligence","type":"applies-to","why":"Intelligence tests built and normed within one culture can underestimate people from another, an ethnocentric bias that culture-fair tests try to reduce."},{"s":"ethnocentrism","t":"psych-disorders","type":"applies-to","why":"Clinicians should judge behavior against the person's own cultural norms; culturally expected experiences, such as some religious or mourning practices, are not by themselves symptoms."},{"s":"ethnocentrism","t":"demographics-culture","type":"part-of","why":"Ethnocentrism and cultural relativism are opposing stances for evaluating cultures other than one's own."},{"s":"ethnocentrism","t":"assimilation","type":"affects","why":"Viewing the dominant culture as superior, an ethnocentric stance, favors pressure toward assimilation, whereas cultural relativism fits better with pluralism."},{"s":"socialization","t":"genes-behavior","type":"contrasts","why":"Socialization is the environmental (nurture) side; twin and adoption studies separate its effects from heritable influences on behavior."},{"s":"socialization","t":"demographics-culture","type":"part-of","why":"Socialization is how culture's norms, values and roles are transmitted to each new member."},{"s":"socialization","t":"norms-deviance","type":"prerequisite","why":"Norms are internalized through socialization, so whether behavior is conforming or deviant depends on what a group has taught its members."},{"s":"norms-deviance","t":"psychoactive-drugs","type":"applies-to","why":"Whether drug use counts as deviant depends on norms and laws: in many societies alcohol and caffeine are accepted while other psychoactive drugs are criminalized."},{"s":"norms-deviance","t":"psych-disorders","type":"applies-to","why":"Deviation from social norms is one criterion for abnormal behavior, though diagnosis also requires distress or impairment, not deviance alone."},{"s":"norms-deviance","t":"demographics-culture","type":"part-of","why":"Norms are the nonmaterial culture that defines acceptable behavior, and deviance is defined against them."},{"s":"norms-deviance","t":"medicalization","type":"prerequisite","why":"Medicalization often relabels deviance as illness, for example recasting heavy drinking from moral failing to the disease of alcoholism."},{"s":"stigma","t":"schizophrenia","type":"affects","why":"Public stereotypes of dangerousness and self-stigma reduce help-seeking and treatment adherence, worsening outcomes in schizophrenia."},{"s":"stigma","t":"health-disparities","type":"affects","why":"Stigmatized groups, such as people with HIV, obesity or addiction, often delay or avoid care to escape judgment, widening health gaps."},{
