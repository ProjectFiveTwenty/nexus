 explains resolution limits, fringe patterns and optical activity. Photon energies link optics to atomic spectra and spectroscopy.","trap":null},{"id":"em-spectrum","title":"Electromagnetic spectrum","section":"cp","disc":"Physics","parent":"optics","hub":false,"summary":"EM waves are oscillating electric and magnetic fields, perpendicular to each other and to the direction of travel, moving at c = 3×10⁸ m/s in vacuum. From long to short wavelength: radio, microwave, infrared, visible (about 700 nm red to 400 nm violet), ultraviolet, X-ray, gamma. Photon energy E = hf = hc/λ rises as wavelength shrinks; UV damages DNA, and X-rays and gamma rays are ionizing.","trap":"Violet light has a shorter wavelength but a higher frequency and photon energy than red light; wavelength and energy are inversely related."},{"id":"reflection","title":"Reflection and mirrors","section":"cp","disc":"Physics","parent":"optics","hub":false,"summary":"The angle of reflection equals the angle of incidence, both measured from the normal. Plane mirrors form upright, same-size virtual images as far behind the mirror as the object is in front. Curved mirrors obey 1/f = 1/o + 1/i with f = R/2: concave (converging) mirrors can form real or virtual images, while convex (diverging) mirrors always form smaller, upright virtual images.","trap":"For mirrors, real images form in front of the mirror (on the object's side), the opposite of lenses, where real images form on the far side."},{"id":"refraction","title":"Refraction and Snell's law","section":"cp","disc":"Physics","parent":"optics","hub":false,"summary":"Light slows in a medium according to its index of refraction, n = c/v (water ≈ 1.33, glass ≈ 1.5). At a boundary Snell's law, n₁sinθ₁ = n₂sinθ₂, applies: light entering a higher-n medium bends toward the normal. Frequency stays fixed while wavelength shortens. Because n varies slightly with wavelength, prisms disperse white light, bending violet most.","trap":"Light bends toward the normal when it slows down (entering higher n) and away from the normal when it speeds up."},{"id":"tir","title":"Total internal reflection","section":"cp","disc":"Physics","parent":"refraction","hub":false,"summary":"When light travels from a higher-index to a lower-index medium, any angle of incidence above the critical angle, sinθc = n₂/n₁, reflects entirely back into the first medium. For glass to air the critical angle is about 42°. Optical fibers and fiber-optic endoscopes rely on total internal reflection to guide light along bent paths with little loss.","trap":"Total internal reflection occurs only when light goes from a higher-index to a lower-index medium; light entering a denser medium can never be totally reflected."},{"id":"thin-lens","title":"Thin lens equation and magnification","section":"cp","disc":"Physics","parent":"optics","hub":false,"summary":"Lenses obey 1/f = 1/o + 1/i, with magnification m = −i/o and power P = 1/f in diopters (f in meters). Converging (convex) lenses have positive f; diverging (concave) lenses have negative f and always form smaller, upright virtual images. A positive image distance means a real, inverted image on the far side. Powers of lenses in contact add.","trap":"A negative magnification means the image is inverted, not that it is smaller; |m| < 1 is what indicates a smaller image."},{"id":"diffraction","title":"Diffraction","section":"cp","disc":"Physics","parent":"optics","hub":false,"summary":"Diffraction is the spreading of waves through openings or around edges, strongest when the opening is comparable to the wavelength. For a single slit, dark fringes occur where a sinθ = mλ (m = 1, 2, 3…), so narrowing the slit widens the central bright band. Diffraction limits the resolution of light microscopes and the eye, so shorter wavelengths (electrons, X-rays) resolve finer detail.","trap":"Narrowing a slit makes the diffraction pattern wider, not narrower."},{"id":"interference","title":"Single- and double-slit interference","section":"cp","disc":"Physics","parent":"optics","hub":false,"summary":"Young's double-slit experiment shows light's wave nature: bright fringes appear where the path difference is a whole number of wavelengths (d sinθ = mλ) and dark fringes at half-integer wavelengths. Thin films such as soap bubbles, oil slicks and anti-reflective coatings produce colors by interference between light reflected from their two surfaces.","trap":"d sinθ = mλ marks bright fringes for a double slit, but the same form, a sinθ = mλ, marks dark fringes for a single slit."},{"id":"polarization-light","title":"Polarization","section":"cp","disc":"Physics","parent":"optics","hub":false,"summary":"Polarized light has its electric field oscillating in a single plane; only transverse waves can be polarized, so sound cannot. A polarizer passes only the component along its axis: unpolarized light loses half its intensity, and already-polarized light follows Malus's law, I = I₀cos²θ. Reflection partially polarizes light (hence glare-cutting sunglasses), and chiral molecules rotate plane-polarized light.","trap":"Two crossed polarizers (90°) block all light, yet inserting a third polarizer at 45° between them lets some light through."},{"id":"sensation-perception","title":"Sensation and perception","section":"ps","disc":"Psychology","parent":null,"hub":true,"summary":"Sensation is transduction: receptor cells convert physical energy (light, pressure waves, chemicals, heat) into neural signals. Perception is the brain's organization and interpretation of those signals, built bottom-up from stimulus features and shaped top-down by expectation, context and memory. Thresholds, signal detection and adaptation describe how stimulus intensity maps onto what we notice.","trap":"Top-down processing is driven by expectations and prior knowledge, while bottom-up processing starts from the raw stimulus; the two are often reversed on exam questions."},{"id":"thresholds","title":"Absolute and difference thresholds","section":"ps","disc":"Psychology","parent":"sensation-perception","hub":false,"summary":"The absolute threshold is the weakest stimulus detected 50% of the time; the difference threshold (just-noticeable difference, JND) is the smallest change in a stimulus detected 50% of the time. Stimuli below the absolute threshold are subliminal and may still have small priming effects. Thresholds shift with attention, fatigue and motivation, which classic threshold theory could not explain.","trap":"The absolute threshold is defined statistically (detected on half of trials), not as the level at which a stimulus is always detected."},{"id":"webers-law","title":"Weber's law","section":"ps","disc":"Psychology","parent":"thresholds","hub":false,"summary":"Weber's law: the JND is a constant fraction of the starting intensity, ΔI/I = k. If 1 g is just noticeable when holding 50 g (k = 2%), about 10 g is needed when holding 500 g. Each sense has its own Weber fraction, and the law breaks down near the extremes of the intensity range.","trap":"The ratio ΔI/I stays constant, so the absolute JND grows as the baseline stimulus gets stronger; it is not a fixed amount."},{"id":"signal-detection","title":"Signal detection theory","section":"ps","disc":"Psychology","parent":"sensation-perception","hub":false,"summary":"Signal detection theory treats detecting a faint stimulus as a decision under uncertainty. Each trial is a hit, miss, false alarm or correct rejection; outcomes depend on sensitivity (d′, how distinct signal is from noise) and on the response criterion, which expectations, motivation and payoffs shift. A lenient criterion raises hits and false alarms together.","trap":"Moving the response criterion changes bias, not sensitivity: an observer who says yes more often gains hits only at the cost of more false alarms."},{"id":"sensory-adaptation","title":"Sensory adaptation","section":"ps","disc":"Psychology","parent":"sensation-perception","hub":false,"summary":"Sensory adaptation is reduced receptor responsiveness during constant, unchanging stimulation, so steady odors, pressures or temperatures fade from awareness. It occurs at the receptor and early neural level and needs no learning. Dark adaptation runs the other way: sensitivity rises over about 20–30 minutes in dim light as rhodopsin regenerates in rods.","trap":"Sensory adaptation is a receptor-level loss of responsiveness, whereas habituation is a learned, nonassociative drop in behavioral response that can be reversed by dishabituation."},{"id":"vision","title":"Visual processing","section":"ps","disc":"Psychology","parent":"sensation-perception","hub":false,"summary":"The cornea and lens focus light on the retina; photoreceptors signal through bipolar cells to ganglion cells, whose axons form the optic nerve. At the optic chiasm, fibers from the nasal half of each retina cross, so each hemisphere receives the opposite visual field. Signals relay through the lateral geniculate nucleus of the thalamus to primary visual cortex in the occipital lobe, where features are analyzed in parallel.","trap":"Only nasal retinal fibers cross at the optic chiasm, so each hemisphere processes the opposite visual field, not the input from the opposite eye."},{"id":"photoreceptors","title":"Photoreceptors (rods and cones)","section":"ps","disc":"Psychology","parent":"vision","hub":false,"summary":"Rods (~120 million, mostly peripheral) use rhodopsin, work in dim light and give low acuity without color. Cones (~6 million, most densely concentrated in the fovea) come in short-, medium- and long-wavelength types and give color and sharp acuity in bright light. Light converts 11-cis-retinal to all-trans-retinal, activating transducin and phosphodiesterase; cGMP falls, cGMP-gated Na⁺ channels close and the cell hyperpolarizes.","trap":"Photoreceptors hyperpolarize in light and release less glutamate; they release the most transmitter in darkness."},{"id":"lateral-inhibition","title":"Lateral inhibition","section":"ps","disc":"Psychology","parent":"vision","hub":false,"summary":"In lateral inhibition, an active neuron suppresses its neighbors through inhibitory interneurons (horizontal and amacrine cells in the retina). This exaggerates differences in activity at borders, sharpening edges and contrast, producing center-surround receptive fields in retinal ganglion cells and illusions such as Mach bands. The same principle sharpens spatial resolution in touch.","trap":null},{"id":"parallel-processing","title":"Parallel processing","section":"ps","disc":"Psychology","parent":"vision","hub":false,"summary":"Parallel processing is the simultaneous analysis of different features of a scene, such as color, form, motion and depth, by separate pathways. Parvocellular cells carry color and fine spatial detail (form), magnocellular cells carry motion with high temporal resolution, and cortical feature detectors respond to specific edges and orientations. A ventral 'what' stream and a dorsal 'where/how' stream then integrate these into one percept.","trap":"Parvocellular pathways handle color and fine detail with poor temporal resolution, magnocellular pathways handle motion with poor spatial detail; the two are easy to swap."},{"id":"audition","title":"Auditory processing","section":"ps","disc":"Psychology","parent":"sensation-perception","hub":false,"summary":"Sound funneled by the pinna vibrates the tympanic membrane; the ossicles (malleus, incus, stapes) amplify pressure onto the oval window of the fluid-filled cochlea. Basilar membrane motion bends hair cells in the organ of Corti, and signals travel via the vestibulocochlear nerve (CN VIII) to the medial geniculate nucleus of the thalamus and then auditory cortex in the temporal lobe. Pitch is coded mainly by place along the membrane.","trap":"The round window does not take in sound; it bulges outward to relieve pressure when the stapes pushes the oval window inward."},{"id":"hair-cells","title":"Hair cells","section":"ps","disc":"Psychology","parent":"audition","hub":false,"summary":"Hair cells are the mechanoreceptors of the cochlea and vestibular organs. Bending stereocilia toward the tallest one pulls tip links that open mechanically gated channels; K⁺ flows in from K⁺-rich endolymph, depolarizing the cell, opening voltage-gated Ca²⁺ channels and triggering glutamate release onto afferent neurons. Lost mammalian hair cells do not regenerate, so damage causes permanent sensorineural hearing loss.","trap":"Hair cells depolarize by K⁺ moving in, the opposite of the K⁺ efflux seen in typical neurons, because endolymph is unusually high in K⁺."},{"id":"tonotopic","title":"Tonotopic organization","section":"ps","disc":"Psychology","parent":"audition","hub":false,"summary":"Tonotopic organization means sound frequency is mapped by location. The base of the basilar membrane, near the oval window, is narrow and stiff and responds best to high frequencies; the apex is wide and floppy and responds to low frequencies. This place map is preserved through the auditory nuclei to primary auditory cortex, and age-related high-frequency loss reflects damage near the base.","trap":"High frequencies are detected at the base of the cochlea, not the apex; the apex encodes low frequencies."},{"id":"somatosensation","title":"Somatosensation","section":"ps","disc":"Psychology","parent":"sensation-perception","hub":false,"summary":"Somatosensation covers touch, pressure, vibration, temperature, pain (nociception) and body position. Meissner corpuscles (light touch) and Pacinian corpuscles (vibration, deep pressure) adapt quickly; Merkel discs (sustained pressure) and Ruffini endings (stretch) adapt slowly; free nerve endings carry pain and temperature. Signals reach the thalamus and the postcentral gyrus, mapped somatotopically. Gate control theory explains how touch input can dampen pain.","trap":"Primary somatosensory cortex is the postcentral gyrus of the parietal lobe; the precentral gyrus just in front of it is primary motor cortex, and the two are often swapped."},{"id":"vestibular-kinesthetic","title":"Vestibular and kinesthetic senses","section":"ps","disc":"Psychology","parent":"sensation-perception","hub":false,"summary":"The vestibular sense tracks head position and motion: the three semicircular canals detect rotational (angular) acceleration as lagging endolymph bends hair cells, and the utricle and saccule detect linear acceleration and gravity as calcium carbonate otoconia shift on hair cells. Kinesthesia (proprioception) reports limb position through muscle spindles, Golgi tendon organs and joint receptors. Mismatched visual and vestibular input causes motion sickness.","trap":"Semicircular canals detect rotation, while the otolith organs (utricle and saccule) detect linear acceleration and head tilt."},{"id":"consciousness-sleep","title":"Consciousness and sleep","section":"ps","disc":"Psychology","parent":null,"hub":true,"summary":"Consciousness spans alert wakefulness, daydreaming, drowsiness, sleep and altered states such as hypnosis, meditation and drug intoxication. EEG frequency tracks arousal: beta when alert, alpha when relaxed, theta in light sleep, delta in deep sleep. Sleep cycles through NREM and REM about every 90 minutes under a hypothalamic circadian clock, and psychoactive drugs alter consciousness by changing neurotransmission.","trap":null},{"id":"circadian","title":"Circadian rhythms","section":"ps","disc":"Psychology","parent":"consciousness-sleep","hub":false,"summary":"Circadian rhythms are roughly 24-hour cycles in alertness, body temperature and hormone release, driven by the suprachiasmatic nucleus (SCN) of the hypothalamus. Light-sensitive retinal ganglion cells (melanopsin) signal the SCN, which suppresses pineal melatonin by day; melatonin rises in darkness. Cortisol peaks in the early morning, and jet lag or shift work misalign the clock with external light cues.","trap":"The master clock is the hypothalamic SCN, not the pineal gland, and melatonin is released in darkness rather than in light."},{"id":"sleep-stages","title":"Sleep stages and EEG waves","section":"ps","disc":"Psychology","parent":"consciousness-sleep","hub":false,"summary":"Awake and alert shows beta waves; relaxed with eyes closed, alpha. NREM 1 shows theta waves; NREM 2 adds sleep spindles and K-complexes; NREM 3 (slow-wave sleep) shows high-amplitude delta waves, growth hormone release, sleepwalking and night terrors. REM has a fast, wake-like EEG, rapid eye movements, vivid dreams and skeletal muscle atonia. Cycles last about 90 minutes; slow-wave sleep dominates early, REM lengthens toward morning.","trap":"REM is the paradoxical stage, with a wake-like EEG but a paralyzed body; the deepest, hardest-to-wake sleep is NREM 3 with delta waves."},{"id":"sleep-disorders","title":"Sleep disorders","section":"ps","disc":"Psychology","parent":"consciousness-sleep","hub":false,"summary":"Dyssomnias alter the amount or timing of sleep: insomnia; narcolepsy, with sudden REM entry, cataplexy and hypnagogic hallucinations, linked to loss of hypothalamic orexin neurons; and sleep apnea, from airway collapse (obstructive) or absent respiratory drive (central). Parasomnias are abnormal behaviors in sleep: sleepwalking and night terrors arise in NREM 3, nightmares in REM. REM deprivation produces REM rebound.","trap":"Night terrors occur in slow-wave NREM 3 sleep and are usually not remembered, whereas nightmares occur in REM and often are."},{"id":"psychoactive-drugs","title":"Psychoactive drugs","section":"ps","disc":"Psychology","parent":"consciousness-sleep","hub":false,"summary":"Psychoactive drugs alter consciousness by changing neurotransmission. Main classes are depressants, stimulants, hallucinogens and opioids, which depress CNS activity and are often listed with depressants though they act on opioid rather than GABA receptors; marijuana has mixed effects. Repeated use brings tolerance (receptor downregulation, faster metabolism, conditioned compensatory responses) and dependence, with withdrawal roughly opposite to acute effects. Nearly all addictive drugs raise mesolimbic dopamine.","trap":"Withdrawal tends to mirror the opposite of the drug's acute effect, so stimulant withdrawal brings fatigue and low mood while alcohol or sedative withdrawal brings agitation and can cause seizures."},{"id":"depressants","title":"Depressants","section":"ps","disc":"Psychology","parent":"psychoactive-drugs","hub":false,"summary":"Depressants lower CNS activity. Alcohol, barbiturates and benzodiazepines enhance GABA-A receptor Cl⁻ conductance, causing relaxation, sedation and, at high doses, respiratory depression; combining them is dangerously synergistic. Alcohol also inhibits ADH and, chronically, can cause Wernicke–Korsakoff syndrome via thiamine deficiency. Opioids (morphine, heroin, fentanyl) are often grouped here or treated as a separate class; they act on opioid receptors, relieve pain and kill in overdose by suppressing breathing.","trap":"Alcohol is a depressant even though low doses feel stimulating; the apparent arousal comes from disinhibition of frontal control."},{"id":"stimulants","title":"Stimulants","section":"ps","disc":"Psychology","parent":"psychoactive-drugs","hub":false,"summary":"Stimulants raise arousal and sympathetic activity. Cocaine blocks reuptake of dopamine, norepinephrine and serotonin; amphetamines force monoamine release (reversing transporters) and block reuptake; caffeine blocks adenosine receptors; nicotine activates nicotinic acetylcholine receptors and boosts dopamine release. Effects include euphoria, alertness, raised heart rate and blood pressure and reduced appetite, followed by fatigue and depressed mood on withdrawal.","trap":"Cocaine works by blocking reuptake, whereas amphetamines mainly drive transmitter release; both raise synaptic monoamines by different mechanisms."},{"id":"hallucinogens","title":"Hallucinogens","section":"ps","disc":"Psychology","parent":"psychoactive-drugs","hub":false,"summary":"Hallucinogens distort perception, producing hallucinations, synesthesia, altered time sense and introspection. LSD, psilocybin and mescaline act mainly as serotonin 5-HT2A receptor agonists, while dissociatives such as ketamine and PCP block NMDA glutamate receptors. Marijuana (THC, a cannabinoid receptor agonist) has mixed depressant, stimulant and hallucinogenic effects. Classic hallucinogens cause little physical dependence.","trap":null},{"id":"reward-pathway","title":"Mesolimbic reward pathway","section":"ps","disc":"Psychology","parent":"consciousness-sleep","hub":false,"summary":"The mesolimbic pathway projects from dopamine neurons in the ventral tegmental area (VTA) of the midbrain to the nucleus accumbens, with links to the amygdala, hippocampus and prefrontal cortex. Natural rewards and nearly all addictive drugs increase dopamine release in the nucleus accumbens. Dopamine neurons fire most when a reward is better than expected (reward prediction error), reinforcing the behaviors that preceded it.","trap":"The mesolimbic pathway (VTA to nucleus accumbens) is separate from the nigrostriatal pathway (substantia nigra to striatum) that degenerates in Parkinson's disease."},{"id":"learning-memory","title":"Learning and memory","section":"ps","disc":"Psychology","parent":null,"hub":true,"summary":"Learning is a lasting change in behavior or knowledge produced by experience; memory is the encoding, storage and retrieval of what was learned. Nonassociative learning (habituation, sensitization), associative learning (classical and operant conditioning) and observational learning describe how behavior changes, while memory models cover stages, types, retrieval and forgetting. Both rest on synaptic plasticity such as hippocampal long-term potentiation.","trap":null},{"id":"classical-conditioning","title":"Classical conditioning","section":"ps","disc":"Psychology","parent":"learning-memory","hub":false,"summary":"In classical conditioning, a neutral stimulus is repeatedly paired with an unconditioned stimulus (US) that reflexively triggers an unconditioned response (UR); the neutral stimulus becomes a conditioned stimulus (CS) that evokes a conditioned response (CR). Key processes are acquisition, extinction (CS without US), spontaneous recovery, generalization and discrimination. It shapes involuntary, reflexive responses.","trap":"The UR and CR are usually the same behavior (salivation); classify them by what triggers them, the US or the CS."},{"id":"operant-conditioning","title":"Operant conditioning","section":"ps","disc":"Psychology","parent":"learning-memory","hub":false,"summary":"Operant conditioning links voluntary behavior to its consequences (Skinner). Reinforcement increases a behavior and punishment decreases it; positive means a stimulus is added and negative means one is removed. Taking aspirin to end a headache is negative reinforcement, and escape and avoidance learning both work this way. Shaping reinforces successive approximations of a target behavior.","trap":"Negative reinforcement is not punishment: it increases a behavior by removing something unpleasant."},{"id":"reinforcement-schedules","title":"Reinforcement schedules","section":"ps","disc":"Psychology","parent":"operant-conditioning","hub":false,"summary":"Fixed-ratio schedules reinforce after a set number of responses, variable-ratio after an unpredictable number, fixed-interval after a set time and variable-interval after unpredictable times. Variable-ratio gives the highest response rates and the most resistance to extinction (slot machines); fixed-interval gives a scalloped pattern that speeds up near reward time. Continuous reinforcement speeds acquisition but extinguishes fastest.","trap":"Ratio schedules depend on the number of responses and interval schedules on elapsed time; only fixed-interval produces the scalloped curve."},{"id":"observational-learning","title":"Observational learning","section":"ps","disc":"Psychology","parent":"learning-memory","hub":false,"summary":"Observational learning (modeling) is acquiring behavior by watching others, shown in Bandura's Bobo doll studies, where children copied an adult's aggression. It requires attention, retention, the ability to reproduce the act and motivation; seeing a model rewarded or punished (vicarious reinforcement) changes whether the behavior is performed. Behavior can be learned without ever being performed or directly reinforced.","trap":"Seeing a model punished lowers performance of a behavior but not learning of it; children later reproduced the aggression when offered a reward."},{"id":"mirror-neurons","title":"Mirror neurons","section":"ps","disc":"Psychology","parent":"observational-learning","hub":false,"summary":"Mirror neurons fire both when an individual performs an action and when it watches another perform the same action. First found in the premotor cortex of monkeys, similar systems in human frontal and parietal cortex are thought to support imitation, observational learning, understanding others' intentions and possibly empathy. Much of their proposed role in humans remains hypothesis rather than established mechanism.","trap":null},{"id":"memory-stages","title":"Sensory, working and long-term memory","section":"ps","disc":"Psychology","parent":"learning-memory","hub":false,"summary":"Sensory memory holds raw input briefly: iconic (visual) under 1 s, echoic (auditory) a few seconds. Attended items enter short-term memory, about 7 ± 2 items for roughly 20–30 s without rehearsal; working memory (Baddeley) adds a phonological loop, visuospatial sketchpad, episodic buffer and central executive. Chunking stretches short-term capacity, elaborative rehearsal (linking items to meaning) aids encoding into long-term memory, and long-term memory has practically unlimited capacity.","trap":"Iconic memory is visual and lasts under a second, echoic memory is auditory and lasts a few seconds; maintenance rehearsal keeps items in short-term memory but transfers them to long-term memory poorly."},{"id":"explicit-implicit","title":"Explicit vs. implicit memory","section":"ps","disc":"Psychology","parent":"learning-memory","hub":false,"summary":"Explicit (declarative) memory is consciously recalled and splits into episodic (personal events) and semantic (facts) memory. Implicit (nondeclarative) memory shows in performance without awareness: procedural skills, priming and conditioned responses. Explicit memory depends on the hippocampus and medial temporal lobe; procedural memory relies on the basal ganglia and cerebellum, so patient H.M. learned new motor skills without remembering practicing them.","trap":"Priming and procedural skills are implicit, so amnesic patients who cannot form new explicit memories can still acquire them."},{"id":"retrieval","title":"Retrieval cues","section":"ps","disc":"Psychology","parent":"learning-memory","hub":false,"summary":"Retrieval is accessing stored memories; recognition is easier than free recall. Cues work best when they match conditions at encoding (encoding specificity): context-dependent memory uses the external setting, state-dependent memory the internal state (mood, intoxication), and mood-congruent memory favors memories matching current mood. Spreading activation through semantic networks underlies priming, and relearning is faster even for forgotten material (savings).","trap":"Context-dependent memory concerns the external environment, while state-dependent memory concerns the learner's internal state, such as mood or drug intoxication."},{"id":"interference-memory","title":"Proactive and retroactive interference","section":"ps","disc":"Psychology","parent":"learning-memory","hub":false,"summary":"In proactive interference, older learning disrupts recall of newer material (an old password keeps coming to mind). In retroactive interference, newer learning disrupts recall of older material (learning Spanish makes earlier French vocabulary harder to recall). Interference is greatest between similar material and, with decay, is a main cause of forgetting; Ebbinghaus's forgetting curve shows most loss happens soon after learning.","trap":"Proactive interference works forward (old disrupts new) and retroactive works backward (new disrupts old); students often swap them."},{"id":"neuroplasticity","title":"Neuroplasticity","section":"ps","disc":"Psychology","parent":"learning-memory","hub":false,"summary":"Neuroplasticity is the nervous system's capacity to rewire with experience or injury: strengthening and weakening synapses, growing dendrites and pruning unused connections. Plasticity is greatest in childhood, so early brain injury often allows more recovery of function. Cortical remapping after amputation, linked to phantom limb sensation, shows that substantial plasticity persists in adults.","trap":"Synaptic pruning in childhood and adolescence is a normal, efficiency-improving process, not a sign of damage."},{"id":"ltp","title":"Long-term potentiation","section":"ps","disc":"Psychology","parent":"neuroplasticity","hub":false,"summary":"Long-term potentiation is a lasting increase in synaptic strength after high-frequency or repeated stimulation, best studied in the hippocampus. Glutamate activates AMPA receptors, and the resulting depolarization expels Mg²⁺ from NMDA receptors; Ca²⁺ entry activates kinases such as CaMKII that add AMPA receptors to the membrane. Late LTP needs new gene transcription and protein synthesis, matching long-term memory consolidation.","trap":"NMDA receptors need both glutamate binding and postsynaptic depolarization to remove the Mg²⁺ block, which makes them coincidence detectors."},{"id":"cognition","title":"Cognition, language and intelligence","section":"ps","disc":"Psychology","parent":null,"hub":true,"summary":"Cognition is how people acquire, organize and use information: thinking, problem solving, decision making, language and intelligence. Developmental theories (Piaget) describe how these abilities mature, heuristics and biases show where fast judgment goes wrong, and language theories weigh innate, learned and social contributions. Intelligence reflects interacting genes and environment, and cognitive decline marks disorders such as dementia.","trap":null},{"id":"piaget","title":"Piaget's stages","section":"ps","disc":"Psychology","parent":"cognition","hub":false,"summary":"Piaget proposed four stages. Sensorimotor (0–2 years): learning through senses and action, object permanence. Preoperational (2–7): symbolic thought, pretend play, egocentrism, no conservation. Concrete operational (7–11): conservation and logic about concrete objects. Formal operational (11+): abstract, hypothetical reasoning. Children adapt by assimilation (fitting new information into schemas) and accommodation (revising schemas).","trap":"Conservation appears in the concrete operational stage; a preoperational child thinks a tall, thin glass holds more water than a short, wide one."},{"id":"problem-solving","title":"Problem solving: algorithms and heuristics","section":"ps","disc":"Psychology","parent":"cognition","hub":false,"summary":"Problem solving draws on trial and error, algorithms (step-by-step procedures that guarantee a solution but are slow), heuristics (fast but error-prone shortcuts) and insight (sudden restructuring). Obstacles include mental set (reusing a once-successful approach) and functional fixedness (seeing objects only in their usual role). Deductive reasoning moves from general rules to specific conclusions; inductive reasoning generalizes from cases.","trap":"Deductive reasoning is top-down (general to specific) and inductive reasoning is bottom-up (specific to general)."},{"id":"heuristics","title":"Availability and representativeness heuristics","section":"ps","disc":"Psychology","parent":"problem-solving","hub":false,"summary":"The availability heuristic judges how frequent or likely something is by how easily examples come to mind, so vivid or recent events (plane crashes, shark attacks) seem more common than they are. The representativeness heuristic judges category membership by resemblance to a prototype, ignoring base rates (base-rate fallacy) and producing the conjunction fallacy. Both are usually efficient but err systematically.","trap":"Judging by similarity to a prototype is representativeness, while judging by ease of recall is availability; base-rate neglect belongs to representativeness."},{"id":"confirmation-bias","title":"Confirmation bias","section":"ps","disc":"Psychology","parent":"problem-solving","hub":false,"summary":"Confirmation bias is the tendency to seek, notice and remember information that supports existing beliefs while discounting contradictory evidence. Related errors include belief perseverance (holding a belief after its basis is discredited) and hindsight bias. In medicine it drives premature closure on a diagnosis; science counters it with blinding, preregistration and deliberately testing disconfirming predictions.","trap":"Belief perseverance (keeping a belief after its evidence is disproven) is related to but distinct from confirmation bias (selectively seeking supporting evidence)."},{"id":"language-acquisition","title":"Language acquisition theories","section":"ps","disc":"Psychology","parent":"cognition","hub":false,"summary":"Infants babble from about 6 months, say first words near 12 months, show a vocabulary spurt around 18 months and combine two words by about 2 years, moving on to short telegraphic sentences. Nativist theory (Chomsky) proposes an innate language acquisition device and a critical period; learning theory (Skinner) credits reinforcement and imitation; social interactionist theory stresses interplay of brain development and social interaction. Broca's area handles production and Wernicke's area comprehension.","trap":"Broca's aphasia gives halting, effortful speech with fairly intact comprehension; Wernicke's aphasia gives fluent but meaningless speech with poor comprehension."},{"id":"whorfian","title":"Whorfian hypothesis","section":"ps","disc":"Psychology","parent":"language-acquisition","hub":false,"summary":"The Whorfian (Sapir–Whorf) hypothesis, or linguistic relativity, holds that the language a person speaks shapes how they perceive and think about the world. The strong version, that language determines thought, is largely rejected, but weaker effects on attention, memory and categorization (for example, color and spatial terms) have some support. It reverses Piaget's view that thought develops first and language follows.","trap":"The Whorfian hypothesis says language shapes thought; the claim that cognitive development drives language is Piaget's, not Whorf's."},{"id":"intelligence","title":"Theories of intelligence","section":"ps","disc":"Psychology","parent":"cognition","hub":false,"summary":"Spearman proposed a general factor (g); Gardner proposed multiple intelligences (linguistic, spatial, interpersonal and more); Sternberg's triarchic theory names analytical, creative and practical intelligence. Fluid intelligence (novel reasoning) declines with age while crystallized intelligence (accumulated knowledge) holds steady or rises. Modern IQ scores are normed to mean 100, SD 15. Twin and adoption studies show substantial heritability plus environmental effects.","trap":"Heritability describes how much of the variation within a population is linked to genes; it does not say how fixed one person's intelligence is."},{"id":"genes-behavior","title":"Genes and behavior","section":"ps","disc":"Psychology","parent":"biological-personality","hub":false,"summary":"Behavioral genetics separates inherited and environmental influences with family, twin and adoption studies. Identical (MZ) twins share nearly all their DNA and fraternal (DZ) twins about half of their varying genes, like ordinary siblings, so higher MZ concordance points to genes; adoption studies compare children with biological versus adoptive parents. Heritability is the share of trait variance in a population due to genetic differences, and genes act through gene–environment interaction and epigenetic marks.","trap":"Heritability describes variation within a population, not how genetic a trait is in one person, and a highly heritable trait can still shift when the environment changes."},{"id":"emotion-stress","title":"Emotion and stress","section":"ps","disc":"Psychology","parent":null,"hub":true,"summary":"Emotion combines physiological arousal, behavioral expression and subjective experience; the James–Lange, Cannon–Bard and Schachter–Singer theories disagree about their order. Limbic structures generate emotion, and the hypothalamus converts it into bodily change via the sympathetic system and HPA axis. In stress, appraisal judges the threat, and prolonged activation (Selye's GAS) keeps cortisol high, raising glucose and suppressing immunity.","trap":null},{"id":"james-lange","title":"James–Lange theory","section":"ps","disc":"Psychology","parent":"emotion-stress","hub":false,"summary":"Stimulus → physiological arousal → emotion: we notice our bodily response (pounding heart, trembling) and that perception is the feeling, so we are afraid because we tremble. The theory predicts that each emotion has a distinct physiological signature and that cutting off feedback from the body should blunt emotion. Critics noted that very different emotions share similar sympathetic arousal.","trap":"In James–Lange the arousal causes the emotion; if a question says the feeling and the arousal occur at the same time and independently, that is Cannon–Bard."},{"id":"cannon-bard","title":"Cannon–Bard theory","section":"ps","disc":"Psychology","parent":"emotion-stress","hub":false,"summary":"Stimulus → thalamus, which signals the cortex (conscious feeling) and the hypothalamus and autonomic system (arousal) at the same time, so emotion and arousal occur simultaneously and independently. Cannon argued against James–Lange because visceral responses are too slow and too similar across emotions to explain distinct feelings. Arousal does not cause the emotion, and there is no cognitive labeling step.","trap":"Cannon–Bard has no interpretation or labeling step; adding a cognitive label to arousal is the Schachter–Singer two-factor theory."},{"id":"schachter-singer","title":"Schachter–Singer theory","section":"ps","disc":"Psychology","parent":"emotion-stress","hub":false,"summary":"Two-factor theory: emotion requires both physiological arousal and a cognitive label taken from the situation, so the same arousal can be felt as different emotions depending on context. In the 1962 study, subjects injected with epinephrine who were not told its effects tended to adopt the euphoric or angry mood of a confederate, while informed subjects blamed the drug. Arousal and labeling occur together and produce the emotion.","trap":"Schachter–Singer labels arousal that is already present; in Lazarus's cognitive appraisal theory the appraisal comes first and the arousal follows."},{"id":"limbic-system","title":"Limbic system","section":"ps","disc":"Psychology","parent":"emotion-stress","hub":false,"summary":"Interconnected structures on the medial edge of the cerebrum that govern emotion, motivation, memory and drives: chiefly the amygdala, hippocampus, hypothalamus, cingulate gyrus and associated thalamic nuclei, with the nucleus accumbens often included. The prefrontal cortex regulates limbic output, which is why frontal damage (Phineas Gage) changes impulse control and personality. Olfaction projects directly into limbic areas, so smells strongly cue emotional memories.","trap":null},{"id":"amygdala","title":"Amygdala","section":"ps","disc":"Psychology","parent":"limbic-system","hub":false,"summary":"Almond-shaped nuclei in the medial temporal lobe that tag stimuli with emotional significance, especially fear and threat. A fast thalamus → amygdala route triggers fear before conscious recognition, and amygdala output drives the hypothalamus to start sympathetic and HPA responses. It is essential for fear conditioning and strengthens memory for emotional events; bilateral damage blunts fear (as in Klüver–Bucy syndrome), while overactivity is seen in anxiety disorders and PTSD.","trap":"The amygdala is needed for the conditioned fear response (implicit), while the hippocampus is needed for the explicit memory of the event, so damage to one can spare the other."},{"id":"hippocampus","title":"Hippocampus","section":"ps","disc":"Psychology","parent":"limbic-system","hub":false,"summary":"Medial temporal lobe structure that consolidates new explicit (declarative) memories and builds spatial maps; older memories gradually become cortex-dependent. Patient H.M., after bilateral medial temporal lobe removal, had severe anterograde amnesia but could still learn motor skills. It is rich in glucocorticoid receptors and helps shut off the HPA axis, and chronic stress with high cortisol is linked to hippocampal shrinkage, and it is among the first regions damaged in Alzheimer's disease.","trap":"Hippocampal damage mainly prevents forming new declarative memories (anterograde amnesia); remote memories and procedural skills are largely spared."},{"id":"hypothalamus","title":"Hypothalamus","section":"ps","disc":"Psychology","parent":"limbic-system","hub":false,"summary":"Small structure below the thalamus that maintains homeostasis and links the nervous and endocrine systems. It controls hunger (lateral hypothalamus starts eating, ventromedial signals satiety), thirst, body temperature and sexual behavior, sets circadian rhythm via the suprachiasmatic nucleus, releases CRH and other releasing hormones to the anterior pituitary, and makes ADH and oxytocin for release from the posterior pituitary.","trap":"A lateral hypothalamus lesion abolishes hunger (the animal stops eating), while a ventromedial lesion removes satiety and causes overeating; students often swap these."},{"id":"appraisal","title":"Appraisal theory of stress","section":"ps","disc":"Psychology","parent":"emotion-stress","hub":false,"summary":"Lazarus proposed that stress depends on how a person evaluates an event, not on the event alone. Primary appraisal judges whether the situation is irrelevant, benign or stressful (harm, threat or challenge); secondary appraisal judges whether one has the resources to cope. Stress arises when demands seem to exceed coping ability, and coping can be problem-focused (change the situation) or emotion-focused (change one's reaction).","trap":"Primary appraisal evaluates the stressor itself; secondary appraisal evaluates one's ability to cope with it."},{"id":"gas","title":"General adaptation syndrome","section":"ps","disc":"Psychology","parent":"emotion-stress","hub":false,"summary":"Selye's general adaptation syndrome describes a nonspecific physiological response to any prolonged stressor. Alarm: sympathetic activation and adrenal epinephrine, followed by rising cortisol. Resistance: sustained cortisol mobilizes glucose and the body adapts while staying aroused. Exhaustion: reserves are depleted, and immune suppression and organ damage make illness likely. Selye's stressed rats showed enlarged adrenals, shrunken thymus and stomach ulcers.","trap":"The resistance stage is not recovery: the body is still in a costly, cortisol-driven state that depletes reserves and leads to exhaustion if the stressor persists."},{"id":"motivation-attitudes","title":"Motivation and attitudes","section":"ps","disc":"Psychology","parent":null,"hub":true,"summary":"Motivation is what starts, directs and sustains behavior. Theories differ on whether behavior is pushed by internal states (instinct, drive reduction, arousal theory with Yerkes–Dodson's best performance at moderate arousal) or pulled by external rewards (incentive theory). Attitudes are learned evaluations with affective, behavioral and cognitive parts, and attitudes and behavior shape each other, as cognitive dissonance and foot-in-the-door show.","trap":null},{"id":"drive-reduction","title":"Drive reduction theory","section":"ps","disc":"Psychology","parent":"motivation-attitudes","hub":false,"summary":"Physiological needs create aversive internal tension (drives) such as hunger or thirst, and behavior is motivated to reduce the drive and restore homeostasis, a negative feedback model of motivation. Primary drives are biological; secondary drives (such as money) are learned through association. The theory cannot explain behaviors that raise arousal, such as curiosity or thrill-seeking, or eating when not hungry.","trap":"Drive reduction pushes behavior from internal deprivation; being pulled by an external reward with no underlying need, like dessert when full, is incentive theory."},{"id":"maslow","title":"Maslow's hierarchy of needs","section":"ps","disc":"Psychology","parent":"motivation-attitudes","hub":false,"summary":"Needs form a hierarchy: physiological, safety, love and belonging, esteem, and self-actualization at the top. Lower deficiency needs generally must be met before higher growth needs drive behavior, and self-actualization (realizing one's full potential) ties Maslow to humanistic psychology. Critics note that the ordering is not strict and reflects individualistic Western values.","trap":"Safety needs sit directly above physiological needs and below love and belonging; esteem comes after belonging, just below self-actualization."},{"id":"incentive-theory","title":"Incentive theory","section":"ps","disc":"Psychology","parent":"motivation-attitudes","hub":false,"summary":"Behavior is pulled by external rewards and the wish to avoid punishment rather than pushed by internal drives. Expectancy-value theory adds that motivation depends on how likely success seems times how much the outcome is valued. Extrinsic rewards can undermine intrinsic motivation: in the overjustification effect, rewarding a task people already enjoy lowers their interest once the reward stops.","trap":"Adding external rewards does not always add motivation; for an intrinsically enjoyable task it can reduce later interest (overjustification effect)."},{"id":"attitude-components","title":"ABC model of attitudes","section":"ps","disc":"Psychology","parent":"motivation-attitudes","hub":false,"summary":"An attitude is a learned tendency to evaluate something positively or negatively, with Affective (feelings), Behavioral (actions or intentions) and Cognitive (beliefs) components. The components do not always agree, and attitudes predict behavior best when they are strong, specific and accessible and social pressure is weak; the theory of planned behavior adds subjective norms and perceived control. Behavior also changes attitudes, as role-playing and dissonance show.","trap":"A belief statement (\"smoking causes cancer\") is the cognitive component and a feeling (\"I hate smoking\") is affective; only actions or intentions are behavioral."},{"id":"cognitive-dissonance","title":"Cognitive dissonance","section":"ps","disc":"Psychology","parent":"motivation-attitudes","hub":false,"summary":"Festinger: holding inconsistent cognitions, or acting against one's attitudes, creates uncomfortable tension that people reduce by changing the attitude, changing the behavior, adding justifying thoughts or trivializing the conflict. In the classic study, subjects paid $1 to call a dull task fun later rated it more enjoyable than those paid $20, because the small payment could not justify the lie. It also explains effort justification.","trap":"The poorly paid ($1) group changed its attitude more; insufficient external justification produces more dissonance, not less."},{"id":"compliance-techniques","title":"Foot-in-the-door and door-in-the-face","section":"ps","disc":"Psychology","parent":"motivation-attitudes","hub":false,"summary":"Compliance is changing behavior in response to a direct request. Foot-in-the-door: agreeing to a small request makes people more likely to agree to a larger one later, through consistency and self-perception. Door-in-the-face: a large request that is refused, followed by a smaller one, raises acceptance of the second through reciprocal concession. Related tactics include lowball and that's-not-all.","trap":"Foot-in-the-door goes small → large and door-in-the-face goes large → small; and compliance (a request) differs from conformity (group norms) and obedience (authority's command)."},{"id":"personality","title":"Personality theories","section":"ps","disc":"Psychology","parent":null,"hub":true,"summary":"Personality is a person's characteristic, relatively stable pattern of thinking, feeling and behaving. The perspectives differ on its source: unconscious conflict (psychoanalytic), growth and self-concept (humanistic), measurable dimensions (trait), genes and brain physiology (biological), and learning plus person–situation interaction (behaviorist and social-cognitive). The person–situation debate asks how much behavior reflects stable traits versus circumstances.","trap":null},{"id":"psychoanalytic","title":"Psychoanalytic perspective","section":"ps","disc":"Psychology","parent":"personality","hub":false,"summary":"Freud: personality comes from unconscious conflict among the id (primitive sexual and aggressive drives, pleasure principle), the ego (reality principle, mediates) and the superego (internalized moral standards). Psychosexual stages run oral, anal, phallic, latency, genital, and unresolved conflict causes fixation. Neo-Freudians include Jung (collective unconscious), Adler (inferiority complex) and Horney (basic anxiety). Critics call it hard to test.","trap":"The ego, not the superego, follows the reality principle; the superego pursues moral perfection and can be as unrealistic as the id."},{"id":"defense-mechanisms","title":"Defense mechanisms","section":"ps","disc":"Psychology","parent":"psychoanalytic","hub":false,"summary":"Unconscious strategies the ego uses to reduce anxiety by distorting reality. Repression pushes threatening thoughts out of awareness; regression reverts to childlike behavior; reaction formation expresses the opposite of an unacceptable impulse; projection attributes one's own impulses to others; rationalization supplies acceptable excuses; displacement redirects an impulse to a safer target; sublimation channels it into socially valued activity.","trap":"Repression is unconscious while suppression is a deliberate, conscious choice; displacement shifts the target of an impulse, whereas sublimation converts it into a socially valued activity."},{"id":"humanistic","title":"Humanistic perspective","section":"ps","disc":"Psychology","parent":"personality","hub":false,"summary":"Rogers and Maslow viewed people as basically good and driven toward growth, emphasizing free will and conscious experience. Rogers held that anxiety arises from incongruence between the real self and the ideal self; unconditional positive regard (acceptance without conditions of worth) allows a congruent self-concept, and his client-centered therapy offers it. The aim is self-actualization.","trap":"Conditional positive regard (love that depends on behaving a certain way) creates incongruence; unconditional positive regard fosters congruence."},{"id":"trait-theory","title":"Trait perspective (Big Five, Eysenck)","section":"ps","disc":"Psychology","parent":"personality","hub":false,"summary":"Describes personality as measurable, fairly stable dimensions. Eysenck's PEN model has psychoticism, extraversion and neuroticism, and links extraversion to baseline cortical arousal. The Big Five (OCEAN) are openness, conscientiousness, extraversion, agreeableness and neuroticism, are fairly stable in adulthood and moderately heritable (twin studies typically estimate about 40–50%). Allport ranked cardinal, central and secondary traits. Trait theories describe personality but do not explain why it develops.","trap":"Introverts have higher, not lower, baseline arousal according to Eysenck, so they avoid extra stimulation while extraverts seek it."},{"id":"biological-personality","title":"Biological perspective","section":"ps","disc":"Psychology","parent":"personality","hub":false,"summary":"Personality reflects genes, brain structure and neurochemistry. Identical twins raised apart remain similar on many traits, and temperament is visible in infancy (Thomas and Chess's easy, difficult and slow-to-warm-up babies; Kagan's behaviorally inhibited children, who are somewhat more likely to stay shy and cautious later). Eysenck tied extraversion to reticular activating system arousal, and frontal lobe damage, as in Phineas Gage, can change personality.","trap":null},{"id":"social-cognitive","title":"Social-cognitive perspective","section":"ps","disc":"Psychology","parent":"personality","hub":false,"summary":"Bandura's reciprocal determinism: personal factors (thoughts, expectations), behavior and environment all influence one another. Key concepts are self-efficacy (belief that one can succeed), observational learning, and Rotter's locus of control (internal versus external). Mischel showed that behavior depends on the person–situation interaction. Unlike strict behaviorism, it gives cognition an active role.","trap":"Reciprocal determinism is a three-way loop among behavior, personal factors and environment, not the one-way environment-shapes-behavior model of strict behaviorism."},{"id":"psych-disorders","title":"Psychological disorders","section":"ps","disc":"Psychology","parent":null,"hub":true,"summary":"A psychological disorder is a pattern of thought, emotion or behavior that causes significant distress or impairment, classified in the DSM-5. Causes are framed by the biomedical model and the broader biopsychosocial model, and the diathesis–stress model says inherited vulnerability plus stressors triggers onset. Many map onto neurotransmitter systems (dopamine in schizophrenia, monoamines in depression, acetylcholine in Alzheimer's), linking drug treatments to synaptic physiology.","trap":null},{"id":"biopsychosocial","title":"Biomedical vs. biopsychosocial approaches","section":"ps","disc":"Psychology","parent":"psych-disorders","hub":false,"summary":"The biomedical approach treats a disorder as a disease with physical causes (genes, neurochemistry, brain structure) and favors physical treatment such as medication, but can neglect context. Engel's biopsychosocial model explains illness through interacting biological factors, psychological factors (thoughts, coping, learned behavior) and social factors (SES, social support, culture), and applies to physical and mental illness alike.","trap":"The biopsychosocial model does not reject biology; it adds psychological and social causes. An explanation or treatment limited to genes, brain chemistry or medication reflects the biomedical approach."},{"id":"schizophrenia","title":"Schizophrenia","section":"ps","disc":"Psychology","parent":"psych-disorders","hub":false,"summary":"Psychotic disorder with positive symptoms (hallucinations, usually auditory; delusions; disorganized speech or behavior; catatonia) and negative symptoms (flat affect, alogia, avolition, social withdrawal), lasting at least 6 months, with at least 1 month of active symptoms. The dopamine hypothesis links positive symptoms to excess mesolimbic D2 activity, which antipsychotics block. Risks include genes, prenatal insults and heavy adolescent cannabis use; onset is usually late adolescence or early adulthood.","trap":"Schizophrenia is not split personality (that is dissociative identity disorder), and negative symptoms are absences of normal functions rather than unpleasant ones."},{"id":"depression","title":"Depressive disorders","section":"ps","disc":"Psychology","parent":"psych-disorders","hub":false,"summary":"Major depressive disorder: at least 2 weeks of five or more symptoms, including depressed mood or anhedonia, plus changes in sleep, appetite, energy, concentration, psychomotor activity, guilt or suicidal thoughts. Persistent depressive disorder is milder but lasts at least 2 years. Biology: the monoamine hypothesis (low serotonin and norepinephrine, targeted by SSRIs and MAOIs), often elevated cortisol and shortened REM latency; cognitive models stress negative thinking and learned helplessness.","trap":"Persistent depressive disorder (dysthymia) is milder but more chronic, lasting at least 2 years, not a more severe form of major depression."},{"id":"bipolar","title":"Bipolar disorders","section":"ps","disc":"Psychology","parent":"psych-disorders","hub":false,"summary":"Bipolar I requires at least one manic episode: a week or more of elevated or irritable mood with high energy, decreased need for sleep, grandiosity, pressured speech, racing thoughts and risky behavior; depressive episodes are common but not required. Bipolar II requires hypomania (at least 4 days, without severe impairment or psychosis) plus a major depressive episode. Cyclothymic disorder involves 2 years of subthreshold swings. Lithium is a mainstay treatment.","trap":"Bipolar I needs only one manic episode, with no depression required; bipolar II needs hypomania plus major depression and never full mania."},{"id":"anxiety-disorders","title":"Anxiety disorders","section":"ps","disc":"Psychology","parent":"psych-disorders","hub":false,"summary":"Fear or worry out of proportion to the actual threat, causing distress or impairment. Generalized anxiety disorder is 6 months of excessive worry about many things; specific phobia, social anxiety disorder and agoraphobia center on feared objects or situations; panic disorder involves recurrent unexpected panic attacks (a surge of sympathetic symptoms) and worry about future attacks. Treatments include CBT, exposure, SSRIs and benzodiazepines, which enhance GABA-A signaling.","trap":"In DSM-5, obsessive-compulsive disorder and PTSD are no longer anxiety disorders; each has its own category."},{"id":"ocd","title":"Obsessive-compulsive disorder","section":"ps","disc":"Psychology","parent":"psych-disorders","hub":false,"summary":"Obsessions (intrusive, unwanted thoughts, urges or images that cause anxiety) and compulsions (repetitive behaviors or mental acts done to reduce that anxiety) that consume time, often over an hour a day, or impair functioning. Because compulsions relieve anxiety, they are negatively reinforced and the cycle persists. Hyperactivity in orbitofrontal cortex–striatum–thalamus circuits is implicated; treatment is SSRIs and exposure with response prevention.","trap":"OCD is not obsessive-compulsive personality disorder: OCD involves unwanted (ego-dystonic) obsessions and compulsions, while OCPD is a comfortable (ego-syntonic) lifelong preoccupation with order, perfection and control."},{"id":"trauma-disorders","title":"Trauma- and stressor-related disorders","section":"ps","disc":"Psychology","parent":"psych-disorders","hub":false,"summary":"Disorders triggered by a traumatic or stressful event. PTSD follows exposure to actual or threatened death, serious injury or sexual violence and requires more than a month of intrusions (flashbacks, nightmares), avoidance, negative changes in mood and thinking, and hyperarousal; acute stress disorder covers the first 3 days to 1 month. PTSD involves an overreactive amygdala and weak prefrontal control and is treated with trauma-focused therapy and SSRIs.","trap":"The same symptoms lasting under one month are acute stress disorder; PTSD requires symptoms lasting more than one month."},{"id":"personality-disorders","title":"Personality disorders","section":"ps","disc":"Psychology","parent":"psych-disorders","hub":false,"summary":"Enduring, inflexible patterns of inner experience and behavior that deviate from cultural expectations, begin by adolescence or early adulthood, and are usually ego-syntonic. Cluster A (odd, eccentric): paranoid, schizoid, schizotypal. Cluster B (dramatic, erratic): antisocial, borderline, histrionic, narcissistic. Cluster C (anxious, fearful): avoidant, dependent, obsessive-compulsive. Antisocial PD requires age 18 or older with conduct disorder before 15.","trap":"Schizoid PD means indifference to relationships, avoidant PD means wanting relationships but fearing rejection, and schizotypal PD adds odd beliefs and magical thinking."},{"id":"alzheimers","title":"Alzheimer's disease","section":"ps","disc":"Psychology","parent":"psych-disorders","hub":false,"summary":"The most common dementia: progressive memory loss, starting with new memories, then language, visuospatial skills, judgment and personality. Pathology is extracellular β-amyloid plaques (from cleavage of amyloid precursor protein) and intracellular neurofibrillary tangles of hyperphosphorylated tau, with cortical and hippocampal atrophy. Loss of cholinergic neurons lowers acetylcholine, so acetylcholinesterase inhibitors are used. Risks include age, APOE ε4 and Down syndrome.","trap":"Plaques are extracellular β-amyloid and tangles are intracellular tau; students often reverse the proteins or their locations."},{"id":"parkinsons","title":"Parkinson's disease","section":"ps","disc":"Psychology","parent":"psych-disorders","hub":false,"summary":"Neurodegenerative movement disorder caused by loss of dopaminergic neurons in the substantia nigra, reducing dopamine in the nigrostriatal pathway to the basal ganglia. Signs are resting tremor, rigidity, bradykinesia and postural instability, with shuffling gait and masked face; neurons contain Lewy bodies of α-synuclein. Treatment is L-DOPA with carbidopa, which blocks peripheral conversion so more L-DOPA reaches the brain; depression and dementia can follow.","trap":"Patients are given L-DOPA rather than dopamine because dopamine cannot cross the blood–brain barrier; and the tremor is at rest, unlike the intention tremor of cerebellar damage."},{"id":"stratification","title":"Social inequality and stratification","section":"ps","disc":"Sociology","parent":null,"hub":true,"summary":"Stratification is the ranking of groups in a hierarchy that gives them unequal access to wealth, power and prestige. Closed caste systems fix rank at birth; open class systems allow mobility through achievement. Marx defined class by ownership of the means of production, while Weber added status (prestige) and power. Class, race, gender, place and nation all shape unequal health and life chances.","trap":"Weber's model is multidimensional (class, status, power), whereas Marx's is purely economic; questions often hinge on which framework is being described."},{"id":"ses","title":"Social class and SES","section":"ps","disc":"Sociology","parent":"stratification","hub":false,"summary":"Socioeconomic status combines income, education and occupational prestige. Wealth (accumulated assets) differs from income and is far more unequally distributed. Bourdieu distinguished economic capital from social capital (useful networks) and cultural capital (knowledge, tastes and credentials valued by dominant groups). SES shows a graded relationship with health: each step up the ladder predicts lower mortality, not just a gap between the poorest and everyone else.","trap":"Income and wealth are not interchangeable: households with equal income can differ enormously in wealth, which better captures advantage passed between generations."},{"id":"poverty","title":"Absolute vs. relative poverty","section":"ps","disc":"Sociology","parent":"stratification","hub":false,"summary":"Absolute poverty means lacking the resources for basic survival needs such as food, shelter and clothing, judged against a fixed threshold like the U.S. federal poverty line or the World Bank international line. Relative poverty means having far less than is typical in one's own society, often defined as below 50–60% of median income. Poverty tends to persist across generations through limited schooling, networks and neighborhood resources (social reproduction).","trap":"A person can be relatively poor in a rich country while far above any absolute poverty line, because relative poverty depends on the surrounding standard of living."},{"id":"social-mobility","title":"Social mobility","section":"ps","disc":"Sociology","parent":"stratification","hub":false,"summary":"Social mobility is movement between positions in a stratification system. Intergenerational mobility compares children's position with their parents'; intragenerational mobility tracks change within one lifetime. Vertical mobility changes rank (upward or downward), horizontal mobility changes occupation at the same rank. Structural mobility results from society-wide change, such as industrialization creating white-collar jobs, rather than individual effort.","trap":"Intergenerational mobility compares a person's position with their parents'; intragenerational mobility tracks one person across their own lifetime. The two prefixes are easy to swap."},{"id":"spatial-inequality","title":"Spatial inequality and segregation","section":"ps","disc":"Sociology","parent":"stratification","hub":false,"summary":"Spatial inequality is the uneven distribution of resources and hazards across places. Residential segregation, shaped historically by practices such as redlining, concentrates poverty and limits access to good schools, jobs, fresh food (food deserts) and clinics. Environmental injustice is the tendency for polluting facilities and hazards to be located near poor and minority neighborhoods, while gentrification raises costs and can displace long-time residents.","trap":null},{"id":"global-inequality","title":"Global inequality","section":"ps","disc":"Sociology","parent":"stratification","hub":false,"summary":"Global inequality is the gap in wealth, health and power between nations. World-systems theory (Wallerstein) sorts countries into core, semi-periphery and periphery, with core nations drawing cheap labor and raw materials from the periphery; dependency theory also blames exploitative ties. Modernization theory instead attributes gaps to differences in industrialization and values. The gaps show starkly in life expectancy, infant mortality and vaccine coverage.","trap":"Modernization theory locates the cause of poverty inside a poor country (technology, values), whereas dependency and world-systems theories locate it in exploitative relations with rich countries."},{"id":"health-disparities","title":"Health and healthcare disparities","section":"ps","disc":"Sociology","parent":"stratification","hub":false,"summary":"Health disparities are avoidable differences in disease burden and outcomes between groups; healthcare disparities are differences in access to and quality of care, such as insurance coverage, wait times or pain treatment. Both track race, SES, gender, geography and sexual orientation, and many racial gaps persist after controlling for income. Social determinants such as housing, education and discrimination-related stress drive much of the pattern.","trap":"Women live longer than men on average yet report more chronic illness and disability, so longer life expectancy does not mean better health (the gender paradox)."},{"id":"social-interaction","title":"Social interactions and groups","section":"ps","disc":"Sociology","parent":null,"hub":true,"summary":"This area covers how people act toward one another and within groups: the statuses and roles they hold, how they explain behavior (attribution), how they present themselves (dramaturgy), and how groups shape individuals through conformity, obedience, groupthink and polarization. The recurring lesson is the power of the situation: in social settings ordinary people often act in ways their personalities alone would not predict.","trap":null},{"id":"statuses","title":"Statuses","section":"ps","disc":"Sociology","parent":"social-interaction","hub":false,"summary":"A status is a socially recognized position; a role is the set of behaviors expected of whoever holds it. Ascribed statuses are assigned involuntarily (race, sex, age), achieved statuses are earned or chosen (physician, spouse), and a master status dominates how others see a person and can overshadow every other identity (e.g., a serious illness or criminal record). All the statuses a person holds form their status set.","trap":null},{"id":"role-strain","title":"Role strain and role conflict","section":"ps","disc":"Sociology","parent":"social-interaction","hub":false,"summary":"Role strain is tension among the demands of a single status, such as a resident expected both to see more patients and to teach students. Role conflict is tension between the demands of two different statuses, such as parent and full-time employee. Role exit is disengaging from a role central to one's identity, as in retirement or divorce. Strain and conflict are chronic stressors linked to burnout.","trap":"Role strain stays within one status while role conflict pits two or more statuses against each other; swapping the terms is the classic error."},{"id":"group-dynamics","title":"In-groups, out-groups, primary and secondary groups","section":"ps","disc":"Sociology","parent":"social-interaction","hub":false,"summary":"In-groups are groups a person identifies with and out-groups are those they do not, which fuels in-group favoritism and out-group bias; a reference group is the standard used for self-evaluation. Primary groups (family, close friends) are small, enduring and valued for the relationships themselves; secondary groups (coworkers, classmates) are larger, impersonal and task-focused. A dyad ends if either member leaves, while a triad is more stable because a third member can mediate.","trap":null},{"id":"groupthink","title":"Groupthink and group polarization","section":"ps","disc":"Sociology","parent":"group-dynamics","hub":false,"summary":"Groupthink (Janis) occurs when a cohesive group's drive for consensus overrides critical thinking: members self-censor doubts, feel invulnerable, stereotype outsiders, and self-appointed mindguards block dissent, leading to poor decisions. Group polarization is the tendency for discussion to push a group's average view further in the direction it already leaned (the risky shift is one example). Devil's advocates and outside input counter both.","trap":"Group polarization does not mean the group splits into opposing camps; it means the whole group shifts toward a more extreme version of its initial leaning."},{"id":"attribution","title":"Attribution theory","section":"ps","disc":"Sociology","parent":"social-interaction","hub":false,"summary":"Attribution theory (Heider) describes how people explain behavior as dispositional (internal traits) or situational (external circumstances); Kelley's covariation model weighs consensus, consistency and distinctiveness. The fundamental attribution error over-credits dispositions when judging others, actor–observer bias blames situations for one's own acts, and self-serving bias claims success but externalizes failure. The FAE is weaker in collectivist cultures.","trap":"The fundamental attribution error concerns judging other people; explaining your own failures by circumstances is the actor–observer or self-serving bias."},{"id":"conformity","title":"Conformity (Asch)","section":"ps","disc":"Sociology","parent":"social-interaction","hub":false,"summary":"Conformity is changing behavior or beliefs to match a group without being asked. In Asch's line-judgment studies, participants agreed with a unanimous but plainly wrong majority on about a third of critical trials, and roughly three-quarters conformed at least once. One dissenting ally sharply cuts conformity. Normative influence seeks acceptance; informational influence treats others' answers as evidence of what is correct.","trap":"Asch's lines were unambiguous, so conformity there mainly reflects normative pressure; informational influence dominates when the right answer is genuinely unclear."},{"id":"obedience","title":"Obedience (Milgram)","section":"ps","disc":"Sociology","parent":"social-interaction","hub":false,"summary":"Obedience is following a direct command from an authority figure. In Milgram's baseline study about 65% of participants continued to the maximum 450-volt shock on a protesting learner when the experimenter insisted. Obedience fell when the victim was closer, the experimenter gave orders by phone, the setting seemed less prestigious, or peers refused. The studies' deception and participant distress helped drive modern research-ethics rules.","trap":"Obedience responds to an authority's explicit command, conformity to unspoken peer pressure, and compliance to a direct request (not an order) that one is free to refuse."},{"id":"impression-management","title":"Impression management and dramaturgy","section":"ps","disc":"Sociology","parent":"social-interaction","hub":false,"summary":"Impression management is the effort to control how others perceive us. Goffman's dramaturgical approach treats social life as theater: people perform roles front stage before an audience and relax back stage, using settings, appearance and scripts. Tactics include self-disclosure, managing appearances, ingratiation, aligning actions (excuses that make questionable acts seem normal) and alter-casting (imposing an identity on someone else).","trap":"Front stage versus back stage depends on the audience, not the place: physicians joking in a staff room are back stage relative to patients."},{"id":"demographics-culture","title":"Demographics and culture","section":"ps","disc":"Sociology","parent":null,"hub":true,"summary":"Demography studies population size, composition and change through fertility, mortality and migration, along with variables such as age, sex, gender, race, ethnicity and sexual orientation. Culture is a group's shared material elements (objects, technology) and nonmaterial elements (values, beliefs, norms, symbols, language). Culture is learned through socialization, enforced through norms, and reshaped by migration, assimilation and globalization.","trap":"Race is a socially constructed category based on perceived physical traits, whereas ethnicity rests on shared culture, language or ancestry; they are not interchangeable."},{"id":"demographic-transition","title":"Demographic transition model","section":"ps","disc":"Sociology","parent":"demographics-culture","hub":false,"summary":"The demographic transition model tracks population change as societies industrialize. Stage 1: high birth and death rates, slow growth. Stage 2: death rates fall with better food, sanitation and medicine while births stay high, so population surges. Stage 3: birth rates fall with urbanization, contraception and women's education. Stage 4: low birth and death rates, stable and aging populations; some versions add a stage 5 with fertility below replacement.","trap":"Population grows fastest in stage 2, not stage 1 or 4, because death rates have already dropped while birth rates are still high."},{"id":"migration-urbanization","title":"Migration and urbanization","section":"ps","disc":"Sociology","parent":"demographics-culture","hub":false,"summary":"Migration is movement of people between places, driven by push factors that expel them (poverty, war, persecution) and pull factors that attract them (jobs, safety, family). Immigration is entering a country and emigration is leaving one. Urbanization is the rising share of people living in cities, tied to industrialization; suburbanization, white flight and gentrification later reshape who lives where. City living generally lowers fertility.","trap":"Push factors operate at the place of origin and pull factors at the destination; plentiful jobs abroad are a pull, not a push."},{"id":"globalization","title":"Globalization","section":"ps","disc":"Sociology","parent":"demographics-culture","hub":false,"summary":"Globalization is the growing integration of economies, cultures and populations worldwide, driven by trade, communication technology and cheap travel. Its effects cut both ways: economic growth and cultural exchange, but also outsourcing, low-wage labor exploitation, cultural homogenization, and rapid cross-border spread of infectious disease. World-systems theory frames it as deepening, unequal ties between core and periphery nations.","trap":null},{"id":"assimilation","title":"Cultural assimilation","section":"ps","disc":"Sociology","parent":"demographics-culture","hub":false,"summary":"Cultural assimilation is the process by which a minority group gradually adopts the language, customs and values of the dominant culture until it is hard to distinguish, usually over several generations and often including intermarriage. It contrasts with multiculturalism or pluralism (groups keep distinct identities), amalgamation (groups blend into a new combined culture, the melting pot) and segregation (groups kept apart).","trap":"Sociological assimilation (a group adopting the dominant culture) is unrelated to Piaget's assimilation (fitting new information into existing schemas)."},{"id":"cultural-lag","title":"Cultural lag","section":"ps","disc":"Sociology","parent":"demographics-culture","hub":false,"summary":"Cultural lag (Ogburn) is the delay between change in material culture, especially technology, and adjustment of nonmaterial culture such as norms, values and laws. Medicine supplies many examples: life support, organ transplantation, IVF and genetic testing arrived before society settled the ethical and legal rules for using them. The gap can leave people without clear guidance for new situations.","trap":"Cultural lag is nonmaterial culture trailing material culture, not the reverse, and it differs from culture shock, an individual's disorientation in an unfamiliar culture."},{"id":"ethnocentrism","title":"Ethnocentrism vs. cultural relativism","section":"ps","disc":"Sociology","parent":"demographics-culture","hub":false,"summary":"Ethnocentrism is judging other cultures by the standards of one's own, usually viewing one's own as superior; it grows out of in-group favoritism. Cultural relativism is understanding a culture's practices on their own terms and in their own context. In medicine, a relativistic stance supports culturally competent care and careful diagnosis, since behavior that is normal in one culture can look pathological from outside it.","trap":"Cultural relativism is a method for understanding practices in context, not a claim that every practice is morally acceptable."},{"id":"socialization","title":"Agents of socialization","section":"ps","disc":"Sociology","parent":"demographics-culture","hub":false,"summary":"Socialization is the lifelong process of learning a society's norms, values and roles. Family is the primary agent in childhood; schools, peers, mass media, workplaces and religion follow. Anticipatory socialization rehearses roles not yet held (medical students imitating physicians), and resocialization replaces old norms with new ones, often abruptly in total institutions such as prisons or military boot camp.","trap":null},{"id":"norms-deviance","title":"Social norms and deviance","section":"ps","disc":"Sociology","parent":"demographics-culture","hub":false,"summary":"Norms are expectations for behavior: folkways (informal, mild sanctions), mores (moral, serious sanctions), taboos (strongly forbidden acts) and laws (formally enforced). Sanctions may be formal or informal, positive or negative. Deviance is any violation of norms and is relative to context. Theories include differential association (deviance is learned from close others), labeling theory and Merton's strain theory.","trap":"In labeling theory, primary deviance does not change self-concept; secondary deviance follows once the person accepts the deviant label and builds an identity around it."},{"id":"stigma","title":"Stigma","section":"ps","disc":"Sociology","parent":"norms-devia
