<meta charset="utf-8">
<title>PROJECT520 Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app. Header with search and filters above a graph canvas;
   a detail panel sits to the right on desktop and slides under the canvas on phones. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --ink: #132031;
  --muted: #566677;
  --line: #d6dde5;
  --soft: #eaf0fa;
  --accent: #2354d4;
  --accent-ink: #ffffff;
  --bb: #17936a;
  --cp: #cf7a1f;
  --ps: #8556cc;
  --edge: #8795a5;
  --trap-bg: #fff3dc;
  --trap-ink: #5e3b00;
  --il: #c8326b;
  --il-ink: #ffffff;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1218;
    --surface: #151c25;
    --ink: #e5ecf3;
    --muted: #93a2b2;
    --line: #27313c;
    --soft: #1b2736;
    --accent: #7ba6ff;
    --accent-ink: #0d1218;
    --bb: #3fc590;
    --cp: #f2a54c;
    --ps: #b995f2;
    --edge: #5d6c7c;
    --trap-bg: #2a2112;
    --trap-ink: #f1c982;
  --il: #ff7aa8;
  --il-ink: #0d1218;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1218;
  --surface: #151c25;
  --ink: #e5ecf3;
  --muted: #93a2b2;
  --line: #27313c;
  --soft: #1b2736;
  --accent: #7ba6ff;
  --accent-ink: #0d1218;
  --bb: #3fc590;
  --cp: #f2a54c;
  --ps: #b995f2;
  --edge: #5d6c7c;
  --trap-bg: #2a2112;
  --trap-ink: #f1c982;
  --il: #ff7aa8;
  --il-ink: #0d1218;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  padding-inline: 16px;
  padding-block: 12px;
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 var(--font-body);
  overflow-x: hidden;
}
button, input { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 12px; min-width: 0; }

/* Header */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; min-width: 0; }
.brand { font: 700 21px/1 var(--font-display); letter-spacing: -0.015em; white-space: nowrap; }
.brand small { display: block; margin-top: 5px; font: 400 11px/1 var(--font-mono); color: var(--muted); letter-spacing: 0; }
.search { position: relative; flex: 1 1 260px; max-width: 480px; min-width: 0; }
.search input {
  width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); outline-offset: 0;
}
.search input::placeholder { color: var(--muted); }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.results {
  position: absolute; z-index: 20; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none;
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 10px 30px rgba(10, 20, 35, 0.18); max-height: 60vh; overflow: auto;
}
.results li { display: flex; align-items: baseline; gap: 8px; padding: 7px 10px; border-radius: 6px; cursor: pointer; min-width: 0; }
.results li[aria-selected="true"], .results li:hover { background: var(--soft); }
.results .t { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .t small { font: 500 10px var(--font-mono); text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin-left: 6px; }
.results .d { margin-left: auto; font: 400 11px var(--font-mono); color: var(--muted); white-space: nowrap; flex: none; }
.results .none { color: var(--muted); cursor: default; }
.dot { flex: none; width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dot.bb { background: var(--bb); } .dot.cp { background: var(--cp); } .dot.ps { background: var(--ps); }

.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap;
}
.chip:hover { border-color: var(--muted); }
.chip[aria-pressed="false"] { color: var(--muted); background: transparent; border-style: dashed; }
.chip[aria-pressed="false"] .dot { opacity: 0.35; }
.chip.menu { border-color: transparent; background: var(--soft); }
.chip.menu[aria-expanded="true"] { background: var(--accent); color: var(--accent-ink); }
.chip.menu .n { font: 500 11px var(--font-mono); opacity: 0.8; }
.subrow { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; min-width: 0; }
.subrow .chip { font: 400 12px var(--font-mono); padding: 4px 10px; }
.subrow .chip .dot { width: 7px; height: 7px; }

/* Stage */
.stage {
  display: grid; grid-template-columns: minmax(0, 1fr) 380px; min-height: 0; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
}
.canvas { position: relative; min-width: 0; min-height: 0; }
#cy { position: absolute; inset: 0; }
/* Topic territories: a canvas under the graph that paints each hub's soft region. */
#terr { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.tools { position: absolute; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 8px; z-index: 5; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg span { padding: 5px 9px; font: 400 11px/1.6 var(--font-mono); color: var(--muted); align-self: center; }
.seg button { border: 0; border-left: 1px solid var(--line); background: transparent; padding: 5px 11px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
.btn:hover { background: var(--soft); }
.hint {
  position: absolute; left: 12px; bottom: 12px; z-index: 5; max-width: calc(100% - 24px); padding: 6px 11px;
  border-radius: 8px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); font-size: 12px;
}

/* Panel */
.panel { min-width: 0; overflow: auto; border-left: 1px solid var(--line); padding: 18px 18px 22px; overscroll-behavior: contain; }
.eyebrow { display: flex; align-items: center; gap: 8px; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); min-width: 0; }
.eyebrow .tag { padding: 1px 6px; border-radius: 4px; background: var(--soft); color: var(--ink); }
.crumbs { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 4px; margin-top: 10px; font-size: 13px; color: var(--muted); }
.crumbs button { border: 0; background: transparent; padding: 1px 4px; margin: 0 -4px; border-radius: 4px; cursor: pointer; color: var(--accent); }
.crumbs button:hover { background: var(--soft); }
.crumbs .sep { color: var(--line); padding: 0 2px; }
.panel h2 { margin: 6px 0 8px; font: 700 24px/1.15 var(--font-display); letter-spacing: -0.015em; text-wrap: balance; overflow-wrap: anywhere; }
.panel h3 { margin: 22px 0 8px; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.panel h3 .n { color: var(--ink); opacity: 0.6; }
.panel p { margin: 0; }
.summary { max-width: 62ch; }
.summary + .summary { margin-top: 8px; }
.trap { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--trap-bg); color: var(--trap-ink); font-size: 13px; }
.trap b { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 2px; }
.links { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.links li { border-radius: 8px; }
.links button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.links button:hover { background: var(--soft); }
.links .rel { font: 400 12px var(--font-mono); color: var(--muted); }
.links strong { font-weight: 600; }
.links .why { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
.pathbox { display: flex; gap: 6px; }
.pathbox input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.pathbox .btn { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.note { color: var(--muted); font-size: 13px; margin-top: 8px; }
.steps { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 10px; }
.steps li { padding-left: 12px; border-left: 3px solid var(--accent); }
.steps .why { display: block; color: var(--muted); font-size: 13px; }
.starts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.starts .chip { white-space: normal; text-align: left; }
.subs .chip { padding: 4px 10px; font-size: 13px; }
.legend { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.legend li { display: grid; grid-template-columns: 7.5rem 1fr; gap: 8px; align-items: baseline; }
.legend code { font: 400 12px var(--font-mono); color: var(--accent); }
.legend span { color: var(--muted); font-size: 13px; }
.keys { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.keys li { display: grid; grid-template-columns: 28px 1fr; gap: 8px; align-items: center; font-size: 13px; }
.keys .muted { color: var(--muted); }
.sym { justify-self: center; border-radius: 50%; }
.sym.hub { width: 20px; height: 20px; background: var(--bb); border: 2px solid var(--surface); box-shadow: 0 0 0 2px var(--bb); }
.sym.con { width: 9px; height: 9px; background: var(--bb); }
.sym.grp {
  width: 28px; height: 20px; border-radius: 10px;
  background:
    radial-gradient(circle at 9px 10px, var(--bb) 0 4.5px, transparent 5px),
    radial-gradient(circle at 20px 6px, var(--bb) 0 2.5px, transparent 3px),
    radial-gradient(circle at 19px 14px, var(--bb) 0 2.5px, transparent 3px),
    color-mix(in srgb, var(--bb) 16%, transparent);
}
.sym.mem { width: 10px; height: 10px; background: var(--bb); box-shadow: 0 0 0 4px color-mix(in srgb, var(--bb) 30%, transparent); }
.secs { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.secs span { display: inline-flex; align-items: center; gap: 6px; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.close { border: 0; background: var(--soft); border-radius: 8px; padding: 4px 10px; cursor: pointer; flex: none; }
.stats { font: 400 12px var(--font-mono); color: var(--muted); margin-top: 18px; }

/* Interleaving: partner list in the panel, toolbar toggle, legend symbols. --il marks it everywhere. */
.btn.small { padding: 3px 9px; font-size: 13px; }
.btn.iltog { display: inline-flex; align-items: center; gap: 7px; }
.btn.iltog svg { flex: none; }
.btn.iltog[aria-pressed="true"] { border-color: var(--il); color: var(--il); font-weight: 600; }
.btn.iltog[aria-pressed="false"] { color: var(--muted); }
.catchip { display: inline-flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 999px; border: 1px solid var(--line); font: 400 11px/1.7 var(--font-mono); color: var(--muted); white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.catchip .dot { width: 7px; height: 7px; }
.panel h3.il-h { color: var(--il); }
.panel h3.il-h b { font-weight: 500; color: var(--ink); text-transform: none; letter-spacing: 0; font-family: var(--font-body); font-size: 13px; }
.il-src { font-size: 12px; color: var(--muted); margin: -4px 0 8px; }
.il-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.il-row { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 0 10px; padding: 8px 8px 9px 4px; border-radius: 8px; }
.il-row:hover { background: var(--soft); }
.il-rank { width: 22px; height: 22px; border-radius: 50%; background: var(--il); color: var(--il-ink); font: 500 12px/22px var(--font-mono); text-align: center; margin-top: 1px; }
.il-row.off .il-rank { background: transparent; color: var(--muted); box-shadow: inset 0 0 0 1px var(--line); }
.il-head { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 8px; min-width: 0; }
.il-name { border: 0; background: transparent; padding: 0; font-weight: 600; cursor: pointer; text-align: left; color: var(--ink); overflow-wrap: anywhere; }
.il-name:hover { color: var(--il); text-decoration: underline; text-underline-offset: 2px; }
.il-tag { font: 500 10px/1.6 var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); padding: 0 6px; border-radius: 4px; border: 1px dashed var(--line); white-space: nowrap; }
.il-row .why { margin: 3px 0 0; color: var(--muted); font-size: 13px; max-width: 62ch; }
.il-row .sug { margin: 2px 0 0; font-size: 11px; color: var(--muted); font-style: italic; }
.il-tools { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; margin-top: 4px; font-size: 12.5px; }
.linkbtn { border: 0; background: transparent; padding: 0; cursor: pointer; color: var(--accent); font-weight: 500; font-size: inherit; }
.linkbtn:hover { text-decoration: underline; }
.il-how summary { cursor: pointer; color: var(--accent); font-weight: 500; }
.il-how summary:hover { text-decoration: underline; }
.il-how[open] { flex-basis: 100%; }
.bridges { list-style: none; margin: 6px 0 2px; padding: 0; display: grid; gap: 7px; font-size: 13px; }
.bridges li { padding-left: 10px; border-left: 2px solid var(--il); overflow-wrap: anywhere; }
.bridges .v { font: 400 12px var(--font-mono); color: var(--muted); }
.bridges .why { display: block; color: var(--muted); }
.sym.il { width: 18px; height: 18px; background: var(--ps); border: 2px solid var(--surface); box-shadow: 0 0 0 2px var(--il), 0 0 0 6px color-mix(in srgb, var(--il) 22%, transparent); }
.sym.ildash { width: 26px; height: 0; border-radius: 0; border-top: 2px dashed var(--il); }
.sym.ildash.faint { opacity: 0.55; border-top-width: 1.5px; }
.pair-h { color: var(--muted); font-weight: 600; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
@media (max-width: 820px) {
  body { padding-inline: 12px; padding-block: 10px; }
  .app { gap: 10px; }
  .bar { gap: 8px 12px; }
  .search { flex-basis: 100%; max-width: none; order: 3; }
  .stage { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .panel { border-left: 0; border-top: 1px solid var(--line); max-height: 48vh; padding: 14px 16px 18px; }
  .stage.empty .panel { display: none; }
  .filters { flex-wrap: nowrap; overflow-x: auto; width: 100%; padding-bottom: 2px; order: 4; scrollbar-width: none; }
  .subrow { flex-wrap: nowrap; overflow-x: auto; order: 5; scrollbar-width: none; }
  .hint { display: none; }
  .brand { font-size: 19px; display: flex; align-items: baseline; gap: 10px; }
  .brand small { margin-top: 0; }
  .tools { left: 8px; top: 8px; gap: 6px; }
  .tools .btn, .seg button { padding: 4px 9px; }
  .panel h2 { font-size: 21px; }
}
@media (max-width: 480px) {
  .brand { display: block; }
  .brand small { margin-top: 5px; }
}
@media (min-width: 821px) { .close.mobile-only { display: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="app" id="app">
  <header class="bar">
    <div class="brand">PROJECT520 Nexus</div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Search concepts  ( / )" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list" aria-label="Search concepts">
      <ul class="results" id="results" role="listbox" hidden></ul>
    </div>
    <div class="filters" id="filters"></div>
    <div class="subrow" id="catrow" hidden></div>
    <div class="subrow" id="relrow" hidden></div>
  </header>

  <main class="stage empty" id="stage">
    <div class="canvas">
      <canvas id="terr" aria-hidden="true"></canvas>
      <div id="cy" aria-label="Interactive concept map"></div>
      <div class="tools">
        <button type="button" class="btn" id="fit">Fit all</button>
        <button type="button" class="btn" id="reset">Clear focus</button>
        <button type="button" class="btn iltog" id="iltog" aria-pressed="true" title="Show interleaving partners on the map"><svg width="18" height="8" viewBox="0 0 18 8" aria-hidden="true"><path d="M1 6.5 C 5 0.5, 13 0.5, 17 6.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 2.4" stroke-linecap="round"/></svg>Interleaving</button>
      </div>
      <div class="hint" id="hint">Point at a topic to see what belongs to it. Click to focus. Scroll to zoom.</div>
    </div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>
<datalist id="nodelist"></datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script>
(function () {
  "use strict";
  var DATA = /*__GRAPH_DATA__*/null;

  var SECTION = {
    bb: { name: "Bio & Biochem" },
    cp: { name: "Chem & Phys" },
    ps: { name: "Psych & Soc" }
  };
  var SEC_ORDER = ["bb", "cp", "ps"];
  // part-of stays in the data (breadcrumbs, subtopics, focus depth, paths) but is shown on
  // the map by territories and halos, never as a line, so it is not a filterable link type.
  var REL = {
    "part-of":      { verb: "is part of",     help: "Belongs to a larger topic" },
    "prerequisite": { verb: "comes before",   help: "Learn this first" },
    "explains":     { verb: "explains",       help: "Gives the mechanism behind" },
    "affects":      { verb: "affects",        help: "Changes or constrains" },
    "applies-to":   { verb: "applies to",     help: "A general principle used here" },
    "contrasts":    { verb: "contrasts with", help: "An instructive difference" }
  };
  // On-screen label sizes in CSS pixels. Labels keep this size at every zoom level.
  var LBL = {
    hub:  { px: 14, max: 150, font: "700 14px " },
    con:  { px: 12, max: 112, font: "500 12px " },
    cat:  { px: 12, max: 300, font: "500 12px " },
    edge: 10,
    hubMinPx: 17,   // smallest on-screen hub diameter
    conZoom: 0.5,   // ordinary concept labels appear from this zoom up
    catZoom: 0.42   // category labels show below this zoom
  };

  var byId = {}, kids = {}, deg = {};
  DATA.nodes.forEach(function (n) { byId[n.id] = n; kids[n.id] = []; deg[n.id] = 0; });
  DATA.nodes.forEach(function (n) { if (n.parent && byId[n.parent]) kids[n.parent].push(n.id); });
  DATA.edges.forEach(function (e) { deg[e.s]++; deg[e.t]++; });
  var CATS = [];
  SEC_ORDER.forEach(function (s) {
    DATA.nodes.forEach(function (n) {
      if (n.section === s && CATS.indexOf(n.disc) < 0) CATS.push(n.disc);
    });
  });
  var catSec = {};
  DATA.nodes.forEach(function (n) { catSec[n.disc] = n.section; });
  var STARTS = ["proline", "hydrophobic-effect", "nernst", "reward-pathway", "bohr-effect", "sickle-cell"]
    .filter(function (id) { return byId[id]; });

  var state = {
    hops: 1,
    sel: null,
    mode: "overview",   // overview | focus | edge | path | pair
    focusSet: null,
    secOn: { bb: true, cp: true, ps: true },
    catOn: {},
    relOn: {}
  };
  Object.keys(REL).forEach(function (k) { state.relOn[k] = true; });
  var LINK_TYPES = Object.keys(REL).filter(function (k) { return k !== "part-of"; });
  CATS.forEach(function (c) { state.catOn[c] = true; });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function $(id) { return document.getElementById(id); }
  function T(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function ancestors(id) {
    var out = [], seen = {}, p = byId[id] && byId[id].parent;
    while (p && byId[p] && !seen[p]) { seen[p] = 1; out.unshift(p); p = byId[p].parent; }
    return out;
  }

      var wmax = 0;
      lines.forEach(function (l) { wmax = Math.max(wmax, measureCtx.measureText(l).width); });
      metrics[n.id()] = { w: wmax + 6, h: lines.length * spec.px * 1.2 + 4, kind: kind };
    });
  }

  var lastZoom = null;
  function sizeLabels(force) {
    var z = cy.zoom();
    if (!force && lastZoom && Math.abs(z / lastZoom - 1) < 0.02) return;
    lastZoom = z;
    var k = 1 / z;
    cy.batch(function () {
      // The hub ring stays visible when zoomed out: at least 1.5px gap and 2px ring on screen.
      hubs.data({ fs: LBL.hub.px * k, tw: LBL.hub.max * k, tm: 5 * k, tmn: -5 * k, ow: 3 * k,
                  bw: Math.max(3, 1.5 * k), olw: Math.max(3, 2 * k), mp: 6 * k, mpa: 8 * k });
      // Hubs never shrink below a readable dot on screen.
      applySizes();
      cons.data({ fs: LBL.con.px * k, tw: LBL.con.max * k, tm: 3 * k, tmn: -3 * k, ow: 2.5 * k, mp: 4.5 * k, mpa: 6.5 * k });
      catNodes.data({ fs: LBL.cat.px * k, tw: LBL.cat.max * k, tmn: -10 * k, ow: 4 * k });
      cy.edges(".lbl").data({ fs: LBL.edge * k });
      ilScale(cy.edges(".il"), cy.nodes(".ilp"));
    });
  }

  // Greedy label placement: highest priority first, each label tries below, above, right
  // and left of its node and is dropped when every spot collides with a placed label or a
  // visible node. Sizes are in screen pixels, so this is cheap and zoom independent.
  var lblPos = {};
  // Hubs, the selected concept and path stops never shrink below a readable dot on screen.
  function applySizes() {
    var k = 1 / cy.zoom();
    var hubPx = Math.max(8, Math.min(LBL.hubMinPx, cy.width() / 60));
    cy.batch(function () {
      concepts.forEach(function (n) {
        var px = n.hasClass("sel") || n.hasClass("path") ? 12 : n.hasClass("hub") ? hubPx : 0;
        var want = Math.max(n.data("base"), px * k);
        if (Math.abs(n.data("size") - want) > 0.01) n.data("size", want);
      });
    });
  }

  function cullLabels() {
    var z = cy.zoom(), W = cy.width(), H = cy.height();
    var focus = state.focusSet;
    var cand = [];
    function add(n, pri) { if (!n.hasClass("off")) cand.push({ n: n, pri: pri }); }
    if (focus) {
      focus.forEach(function (n) {
        add(n, n.id() === state.sel ? 1e6 : (n.hasClass("hub") ? 5e5 : 2e5) + deg[n.id()]);
      });
      if (state.mode === "focus") hubs.forEach(function (n) {
        if (n.hasClass("ilp")) add(n, 8e5 - n.data("ilRank"));
        else if (!focus.has(n)) add(n, 1e5 + kids[n.id()].length);
      });
    } else {
      if (z < LBL.catZoom) catNodes.forEach(function (n) { add(n, 9e5); });
      hubs.forEach(function (n) { add(n, 5e5 + kids[n.id()].length * 10 + deg[n.id()]); });
      if (z >= LBL.conZoom) cons.forEach(function (n) { add(n, 1e3 + deg[n.id()] + kids[n.id()].length * 5); });
    }
    cand.sort(function (a, b) { return b.pri - a.pri; });
    var show = {}, cell = 100, grid = {};
    function cells(b, fn) {
      var i0 = Math.floor(b.x1 / cell), i1 = Math.floor(b.x2 / cell), j0 = Math.floor(b.y1 / cell), j1 = Math.floor(b.y2 / cell);
      for (var i = i0; i <= i1; i++) for (var j = j0; j <= j1; j++) if (fn(i + "," + j) === false) return false;
      return true;
    }
    function free(b, own, overDots) {
      return cells(b, function (k) {
        var list = grid[k];
        if (!list) return true;
        for (var q = 0; q < list.length; q++) {
          var o = list[q];
          if (overDots && o.dot) continue;
          if (o.id !== own && b.x1 < o.x2 + 3 && b.x2 > o.x1 - 3 && b.y1 < o.y2 + 1 && b.y2 > o.y1 - 1) return false;
        }
        return true;
      });
    }
    function put(b) { cells(b, function (k) { (grid[k] = grid[k] || []).push(b); }); }
    // Buttons floating over the canvas block labels as well.
    var host = $("cy").getBoundingClientRect();
    document.querySelectorAll(".tools, .hint").forEach(function (el) {
      if (el.hidden || !el.offsetParent) return;
      var r = el.getBoundingClientRect();
      put({ x1: r.left - host.left, x2: r.right - host.left, y1: r.top - host.top, y2: r.bottom - host.top, id: "" });
    });
    // Visible node bodies are obstacles too, so text never hides under another dot.
    // In the zoomed-out overview only hubs count; small dots may sit under a hub label.
    var dotsCount = focus || z >= LBL.conZoom;
    concepts.forEach(function (n) {
      if (n.hasClass("off") || (focus && !focus.has(n))) return;
      if (!dotsCount && !n.hasClass("hub")) return;
      var r = (n.data("size") / 2) * z + (n.hasClass("hub") ? n.data("olw") * z : 0);
      if (r < 3.5) return;
      var p = n.renderedPosition();
      if (p.x < -60 || p.x > W + 60 || p.y < -60 || p.y > H + 60) return;
      put({ x1: p.x - r, x2: p.x + r, y1: p.y - r, y2: p.y + r, id: n.id(), dot: !n.hasClass("hub") });
    });
    cand.forEach(function (c) {
      var n = c.n, id = n.id(), m = metrics[id], p = n.renderedPosition();
      if (!m) return;
      if (p.x < -200 || p.x > W + 200 || p.y < -100 || p.y > H + 100) return;
      var r = (n.data("size") / 2) * z + (m.kind === "hub" ? n.data("olw") * z : 0), g = m.kind === "hub" ? 5 : 3;
      var spots = m.kind === "cat" ? [["c", { x1: p.x - m.w / 2, x2: p.x + m.w / 2, y1: p.y - 10 - m.h, y2: p.y - 10 }]] : [
          ["b", { x1: p.x - m.w / 2, x2: p.x + m.w / 2, y1: p.y + r + g, y2: p.y + r + g + m.h }],
          ["t", { x1: p.x - m.w / 2, x2: p.x + m.w / 2, y1: p.y - r - g - m.h, y2: p.y - r - g }],
          ["r", { x1: p.x + r + g, x2: p.x + r + g + m.w, y1: p.y - m.h / 2, y2: p.y + m.h / 2 }],
          ["l", { x1: p.x - r - g - m.w, x2: p.x - r - g, y1: p.y - m.h / 2, y2: p.y + m.h / 2 }]
        ];
      for (var s = 0; s < spots.length; s++) {
        var b = spots[s][1];
        b.id = id;
        if (b.x1 < 2 || b.x2 > W - 2 || b.y1 < 2 || b.y2 > H - 2) continue;
        // Hub names and the focused concept's name may cover small dots.
        if (free(b, id, m.kind === "hub" || id === state.sel || state.mode === "path")) { put(b); show[id] = spots[s][0]; return; }
      }
    });
    cy.batch(function () {
      cy.nodes().forEach(function (n) {
        var id = n.id(), want = show[id] || "";
        if ((lblPos[id] || "") === want && n.hasClass("nolbl") === !want) return;
        lblPos[id] = want;
        n.toggleClass("nolbl", !want);
        n.toggleClass("lp-t", want === "t");
        n.toggleClass("lp-r", want === "r");
        n.toggleClass("lp-l", want === "l");
      });
    });
  }

  var vpTimer = null;
  function refreshLabels() { sizeLabels(); cullLabels(); }
  cy.on("viewport", function () {
    clearTimeout(vpTimer);
    vpTimer = setTimeout(refreshLabels, 90);
  });
  cy.on("mouseover", "node", function (ev) {
    var n = ev.target;
    if (n.hasClass("cat")) return;
    n.addClass("hover");
    terrHover = rootOf[n.id()] || null;
    // A short hover intent, so sweeping the pointer across the map does not flash topics.
    clearTimeout(hoverTimer);
    if (state.mode === "overview" && n.hasClass("hub")) {
      hoverTimer = setTimeout(function () { if (state.mode === "overview") setHoverHub(n.id()); }, 70);
    }
    drawTerr();
  });
  // Leaving the canvas straight from a node fires no mouseout, so clear hover here too.
  $("cy").addEventListener("mouseleave", function () {
    clearTimeout(hoverTimer);
    cy.nodes(".hover").removeClass("hover");
    terrHover = null;
    setHoverHub(null);
    drawTerr();
  });
  cy.on("mouseout", "node", function (ev) {
    ev.target.removeClass("hover");
    clearTimeout(hoverTimer);
    terrHover = null;
    setHoverHub(null);
    drawTerr();
  });

  /* ---------- Theme ---------- */
  function restyle() { cy.style(buildStyle()).update(); terrColors(); measureLabels(); cullLabels(); drawTerr(); }
  try {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", restyle);
  } catch (e) {}
  new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(restyle);

  var resizeTimer = null;
  new ResizeObserver(function () {
    cy.resize();
    drawTerr();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(cullLabels, 120);
  }).observe($("cy"));

  /* ---------- Viewport helpers ---------- */
  function visibleConcepts() { return concepts.not(".off"); }
  // Fit eles into the canvas below the floating toolbar.
  function fitTo(eles, pad, maxZoom, animate, minZoom) {
    var bb = eles.boundingBox({ includeLabels: false, includeOverlays: false });
    var W = cy.width(), H = cy.height();
    if (!W || !H || !isFinite(bb.w)) return;
    var top = Math.max(pad, document.querySelector(".tools").getBoundingClientRect().bottom - $("cy").getBoundingClientRect().top + 30);
    var z = Math.min((W - 2 * pad) / Math.max(bb.w, 1), (H - pad - top) / Math.max(bb.h, 1), maxZoom || 1.4);
    if (minZoom) z = Math.max(z, minZoom);
    z = Math.max(cy.minZoom(), Math.min(cy.maxZoom(), z));
    var target = { zoom: z, pan: { x: W / 2 - z * (bb.x1 + bb.w / 2), y: top + (H - pad - top) / 2 - z * (bb.y1 + bb.h / 2) } };
    cy.stop();
    if (animate === false) { cy.viewport(target); refreshLabels(); }
    else cy.animate(target, { duration: 320, easing: "ease-in-out-cubic" });
  }
  function fitAll(animate) { fitTo(visibleConcepts(), 30, 1.2, animate); }
  function fitZoom(eles, pad, maxZoom) {
    var bb = eles.boundingBox({ includeLabels: false, includeOverlays: false });
    return Math.min((cy.width() - 2 * pad) / Math.max(bb.w, 1), (cy.height() - 2 * pad) / Math.max(bb.h, 1), maxZoom);
  }
  // Show the whole neighborhood when it fits at a readable zoom. Otherwise frame the
  // concept with its parent and subtopics, and let links to far regions run off screen.
  function fitFocus(n, set) {
    // With interleaving on, bring the partner hubs into view too when that still reads well.
    if (ilOn && state.ilMarked && state.ilMarked.length) {
      var wide = set;
      state.ilMarked.forEach(function (id) { wide = wide.union(cy.getElementById(id)); });
      if (fitZoom(wide, 50, 1.3) >= 0.42) { fitTo(wide, 50, 1.3); return; }
    }
    if (fitZoom(set, 50, 1.3) >= 0.55) { fitTo(set, 50, 1.3); return; }
    var core = n;
    var p = byId[n.id()].parent;
    if (p) core = core.union(cy.getElementById(p));
    kids[n.id()].forEach(function (k) { core = core.union(cy.getElementById(k)); });
    core = core.not(".off");
    var near = set.filter(function (m) {
      var a = m.position(), b = n.position();
      return Math.hypot(a.x - b.x, a.y - b.y) < 420;
    });
    core = core.union(near);
    fitTo(core, 60, 1.1, true, 0.55);
  }

  /* ---------- Focus, edges, paths ---------- */
  function clearHighlights() {
    setHoverHub(null);
    cy.batch(function () { cy.elements(".dim, .hl, .lbl, .sel, .path").removeClass("dim hl lbl sel path"); });
    clearMembership();
    state.focusSet = null;
    applySizes();
  }
  function neighborhood(n, hops) {
    var nodes = n, frontier = n;
    for (var i = 0; i < hops; i++) {
      var next = frontier.connectedEdges().not(".off").not(".il").connectedNodes().not(".off");
      nodes = nodes.union(next);
      frontier = next;
    }
    // A topic hub always brings its subtopics along.
    var sub = cy.collection();
    kids[n.id()].forEach(function (k) { sub = sub.union(cy.getElementById(k)); });
    return nodes.union(sub.not(".off"));
  }
  function setEmpty(isEmpty) { $("stage").classList.toggle("empty", isEmpty); cy.resize(); }
  function hideHint() { var h = $("hint"); if (h) h.hidden = true; }
  function setHash(id) {
    try { history.replaceState(null, "", id ? "#" + id : location.pathname + location.search); } catch (e) {}
  }

  function highlight(set, edges, selId) {
    cy.batch(function () {
      graphEls.not(set).not(edges).not(".cat").addClass("dim");
      edges.addClass("hl");
      if (selId) {
        var sel = cy.getElementById(selId);
        sel.addClass("sel");
        edges.filter(function (e) {
          return e.data("type") !== "part-of" && (e.source().same(sel) || e.target().same(sel));
        }).addClass("lbl");
      } else {
        edges.addClass("lbl");
      }
      cy.edges(".lbl").data("fs", LBL.edge / cy.zoom());
    });
    state.focusSet = set;
    applySizes();
    cullLabels();
  }

  function focusNode(id, pathInfo) {
    var n = cy.getElementById(id);
    if (!n.nonempty() || n.hasClass("off") || n.hasClass("cat")) return;
    hideHint();
    clearOverlay();
    clearHighlights();
    state.sel = id;
    state.mode = "focus";
    var set = neighborhood(n, state.hops);
    // Members and the parent chain stay lit and labelled; no part-of line is drawn.
    var mb = membership(id);
    set = set.union(mb.mem).union(mb.anc);
    var edges = set.edgesWith(set).not(".off").not(".il");
    cy.batch(function () { mb.mem.addClass("mem"); mb.anc.addClass("anc"); mb.sib.not(set).addClass("sib"); });
    state.emph = mb.emph;
    highlight(set, edges, id);
    drawInterleave();
    setEmpty(false);
    renderNode(id, pathInfo || null);
    fitFocus(n, set);
    setHash(id);
  }

  function showEdge(edge) {
    hideHint();
    clearOverlay();
    clearHighlights();
    state.sel = null;
    state.mode = "edge";
    var ends = edge.connectedNodes();
    highlight(ends, edge, null);
    setEmpty(false);
    renderEdge(edge.data());
    fitTo(ends, 120, 1.3);
  }

  function clearFocus() {
    clearOverlay();
    clearHighlights();
    state.sel = null;
    state.mode = "overview";
    drawInterleave();
    setEmpty(true);
    renderIntro();
    fitAll();
    setHash(null);
    cullLabels();
  }

  function findPath(fromId, toId) {
    var vis = graphEls.not(".off").not(".cat");
    // Contrast links count as a longer step, so routes prefer links that explain or affect.
    var r = vis.aStar({
      root: cy.getElementById(fromId), goal: cy.getElementById(toId), directed: false,
      weight: function (e) { return e.data("type") === "contrasts" ? 1.6 : 1; }
    });
    if (!r.found) return { found: false, to: toId };
    clearOverlay();
    clearHighlights();
    state.mode = "path";
    cy.batch(function () { r.path.addClass("path"); });
    cy.getElementById(fromId).addClass("sel");
    highlight(r.path.nodes(), r.path.edges(), null);
    var steps = [];
    r.path.edges().forEach(function (e) {
      var d = e.data();
      steps.push({ s: d.source, t: d.target, verb: d.verb, why: d.why });
    });
    fitTo(r.path, 90, 1.3);
    return { found: true, to: toId, steps: steps };
  }

  /* ---------- Panel rendering ---------- */
  var panel = $("panel");
  function fmt(n) { return n.toLocaleString("en-US"); }

      '<li><span class="sym mem"></span><span>Halo. Point at or click a topic and its members light up. Click a concept and the topics it belongs to light up.</span></li>' +

  function relItem(d, otherId, outgoing) {

      ? '<span class="rel">' + esc(d.verb) + "</span> <strong>" + esc(o.title) + "</strong>"

  function renderNode(id, pathInfo) {

  function renderEdge(d) {
    var a = byId[d.source], b = byId[d.target];
    panel.innerHTML =
      '<div class="panel-head"><div class="eyebrow">Link · ' + esc(d.type) + "</div>" +
      '<button type="button" class="close" data-clear="1">Close</button></div>' +
      "<h2>" + esc(a.title) + " <span style=\"color:var(--muted);font-weight:600\">" + esc(d.verb) + "</span> " + esc(b.title) + "</h2>" +
      '<p class="summary">' + esc(d.why) + "</p>" +
      '<h3>Open a concept</h3><div class="starts">' +
      '<button type="button" class="chip" data-go="' + esc(a.id) + '">' + esc(a.title) + "</button>" +
      '<button type="button" class="chip" data-go="' + esc(b.id) + '">' + esc(b.title) + "</button></div>";

  }

  panel.addEventListener("click", function (ev) {
    var go = ev.target.closest("[data-go]");

  });
  panel.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && ev.target.id === "pathTo") { ev.preventDefault(); runPath(); }
  });

  function resolveTitle(text) {
    var q = text.trim().toLowerCase();

    var hit = DATA.nodes.filter(function (n) { return n.title.toLowerCase() === q || n.id === q; })[0];
    if (hit) return hit.id;
    var part = DATA.nodes.filter(function (n) { return n.title.toLowerCase().indexOf(q) === 0; });
    return part.length === 1 ? part[0].id : null;
  }
  function runPath() {
    var input = $("pathTo");

    var from = state.sel;

    renderNode(from, info);
    // Bring the route into view in the panel.

  /* ---------- Graph events ---------- */
  cy.on("tap", "node", function (ev) { if (!ev.target.hasClass("cat")) focusNode(ev.target.id()); });

  $("fit").addEventListener("click", function () { fitAll(); });
  $("reset").addEventListener("click", clearFocus);

  /* ---------- Filters ---------- */
  var filters = $("filters"), relrow = $("relrow"), catrow = $("catrow");

  function menuChip(label, row) {

  function syncChips() {
    filters.querySelectorAll("[data-sec]").forEach(function (b) {

  }

  function nodeOn(sec, disc) { return state.secOn[sec] && state.catOn[disc]; }
  function applyFilters() {

  // Make sure a concept the reader asks for is visible.

  }
  filters.addEventListener("click", function (ev) {

  catrow.addEventListener("click", function (ev) {

  relrow.addEventListener("click", function (ev) {

  /* ---------- Search ---------- */
  var q = $("q"), results = $("results"), active = -1, shown = [];
  var lower = DATA.nodes.map(function (n) {
    return { n: n, t: n.title.toLowerCase(), s: (n.summary || "").toLowerCase(), w: n.title.toLowerCase().split(/[\s\-–—/(),.:;']+/) };
  });
  function score(r, term) {
    var t = r.t;
    if (t === term) return 1000;
    if (t.indexOf(term) === 0) return 900;
    if (r.w.some(function (w) { return w.indexOf(term) === 0; })) return 800;
    if (t.indexOf(term) > -1) return 700;
    if (r.n.id.indexOf(term) > -1) return 600;
    if (r.n.disc.toLowerCase().indexOf(term) === 0 && r.n.hub) return 500;
    var i = r.s.indexOf(term);
    if (i > -1) return 100 + Math.max(0, 50 - Math.floor(i / 20));
    return 0;
  }
  function closeResults() {
    results.hidden = true;
    q.setAttribute("aria-expanded", "false");
    q.removeAttribute("aria-activedescendant");
    active = -1;
  }
  function drawResults() {
    var term = q.value.trim().toLowerCase();
    if (!term) { closeResults(); return; }
    shown = lower
      .map(function (r) { return { n: r.n, s: score(r, term) }; })
      .filter(function (r) { return r.s > 0; })
      .sort(function (a, b) { return b.s - a.s || (b.n.hub ? 1 : 0) - (a.n.hub ? 1 : 0) || a.n.title.localeCompare(b.n.title); })
      .slice(0, 10).map(function (r) { return r.n; });
    results.innerHTML = shown.length
      ? shown.map(function (n, i) {
          return '<li role="option" id="opt' + i + '" data-i="' + i + '" aria-selected="' + (i === active) + '"><span class="dot ' + n.section +
            '"></span><span class="t">' + esc(n.title) + (n.hub ? "<small>hub</small>" : "") + '</span><span class="d">' + esc(n.disc) + "</span></li>";
        }).join("")
      : '<li class="none">No concept matches that.</li>';
    results.hidden = false;
    q.setAttribute("aria-expanded", "true");
    if (active >= 0) {
      q.setAttribute("aria-activedescendant", "opt" + active);
      var el = $("opt" + active);
      if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest" });
    } else q.removeAttribute("aria-activedescendant");
  }
  function pick(i) {
    var n = shown[i];
    if (!n) return;
    q.value = "";
    closeResults();
    q.blur();
    reveal(n.id);
    focusNode(n.id);
  }
  q.addEventListener("input", function () { active = -1; drawResults(); });
  q.addEventListener("focus", drawResults);
  q.addEventListener("keydown", function (ev) {
    if (ev.key === "ArrowDown") { ev.preventDefault(); active = Math.min(active + 1, shown.length - 1); drawResults(); }
    else if (ev.key === "ArrowUp") { ev.preventDefault(); active = Math.max(active - 1, 0); drawResults(); }
    else if (ev.key === "Enter") { ev.preventDefault(); pick(active >= 0 ? active : 0); }
    else if (ev.key === "Escape") { closeResults(); q.blur(); }
  });
  results.addEventListener("mousedown", function (ev) {
    var li = ev.target.closest("li[data-i]");
    if (li) { ev.preventDefault(); pick(Number(li.getAttribute("data-i"))); }
  });
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest(".search")) closeResults();
  });
  document.addEventListener("keydown", function (ev) {
    var tag = (ev.target.tagName || "").toLowerCase();
    if (ev.key === "/" && tag !== "input") { ev.preventDefault(); q.focus(); }
    else if (ev.key === "Escape" && tag !== "input" && tag !== "select" && tag !== "textarea" && state.mode !== "overview") { clearFocus(); }
  });
  window.addEventListener("hashchange", function () {
    var id = decodeURIComponent((location.hash || "").slice(1));
    if (id && byId[id] && id !== state.sel) { reveal(id); focusNode(id); }
  });

  /* ---------- Interleaving ---------- */
  // Every hub has up to three partner hubs (the strongest of its curated five) worth studying alongside it, best first. The curated table
  // (DATA.il.cur) wins; hubs it does not cover yet use link-analysis candidates (DATA.il.cand).
  // The map overlay draws synthetic "il" edges that never mix with the graph data.
  var IL = DATA.il || {};
  var IL_CUR = IL.cur || {}, IL_CAND = IL.cand || {}, IL_HUB_OF = IL.hubOf || {};
  var IL_N = 3;
  var isHub = {};
  DATA.nodes.forEach(function (n) { if (n.hub) isHub[n.id] = true; });
  function title(id) { return byId[id] ? byId[id].title : id; }
  function hubOf(id) {
    if (isHub[id]) return id;
    if (IL_HUB_OF[id] && isHub[IL_HUB_OF[id]]) return IL_HUB_OF[id];
    var a = ancestors(id)[0];
    return a && isHub[a] ? a : null;
  }
  var edgeIdx = {};
  DATA.edges.forEach(function (e, i) { (edgeIdx[e.s + "|" + e.t] = edgeIdx[e.s + "|" + e.t] || []).push(i); });
  // The most informative link between two concepts, in either direction.
  function edgeBetween(a, b) {
    var list = (edgeIdx[a + "|" + b] || []).concat(edgeIdx[b + "|" + a] || []);
    list.sort(function (x, y) { return (DATA.edges[x].type === "part-of") - (DATA.edges[y].type === "part-of"); });
    return list.length ? list[0] : null;
  }
  function bridgesOf(pairs) {
    var out = [], seen = {};
    (pairs || []).forEach(function (p) {
      var i = edgeBetween(p[0], p[1]);
      if (i == null || seen[i]) return;
      seen[i] = 1;
      out.push({ ei: i, s: DATA.edges[i].s, t: DATA.edges[i].t, verb: REL[DATA.edges[i].type].verb, why: DATA.edges[i].why });
    });
    return out;
  }
  var partnerCache = {};
  // [{hub, why, bridges, suggested}] for a hub, at most three, best first.
  function partnersOf(h) {
    if (!h || !isHub[h]) return [];
    if (partnerCache[h]) return partnerCache[h];
    var out = [], seen = {};
    seen[h] = 1;
    (IL_CUR[h] || []).forEach(function (r) {
      if (out.length >= IL_N || !isHub[r[0]] || seen[r[0]]) return;
      seen[r[0]] = 1;
      out.push({ hub: r[0], why: r[1] || "", bridges: bridgesOf(r[2]), suggested: false });
    });
    (IL_CAND[h] || []).forEach(function (r) {
      if (out.length >= IL_N || !isHub[r[0]] || seen[r[0]]) return;
      seen[r[0]] = 1;
      var br = bridgesOf(r[1]), a = byId[h], b = byId[r[0]];
      var why = b.title + " shares " + br.length + " link" + (br.length === 1 ? "" : "s") + " with " + a.title +
        (a.section !== b.section ? ", crossing from " + SECTION[a.section].name + " to " + SECTION[b.section].name + "." : ", both in " + SECTION[a.section].name + ".");
      out.push({ hub: r[0], why: why, bridges: br, suggested: true });
    });
    return (partnerCache[h] = out);
  }

  /* --- Toggle, remembered per browser --- */
  var IL_KEY = "mcat-nexus-interleave";
  var ilOn = true;
  try { ilOn = window.localStorage.getItem(IL_KEY) !== "off"; } catch (e) { ilOn = true; }
  var ilBtn = $("iltog");
  function syncIlBtn() { ilBtn.setAttribute("aria-pressed", ilOn ? "true" : "false"); }
  function setIlOn(on) {
    ilOn = !!on;
    try { window.localStorage.setItem(IL_KEY, ilOn ? "on" : "off"); } catch (e) {}
    syncIlBtn();
    if (state.mode === "focus" || state.mode === "overview") { clearOverlay(); drawInterleave(); cullLabels(); }
  }
  ilBtn.addEventListener("click", function () { setIlOn(!ilOn); });
  syncIlBtn();

  /* --- Map overlay --- */
  // Connector width, dash, rank badge and halo keep a constant on-screen size.
  function ilScale(edges, nodes) {
    var k = 1 / cy.zoom();
    edges.forEach(function (e) {
      var ov = e.hasClass("ov");
      e.data({ k: k, w: (ov ? 1.1 : 2.2) * k, fs: 11 * k, tp: 3 * k });
    });
    nodes.forEach(function (n) { n.data("up", 7 * k); });
    // The overview lines step aside once concept labels appear.
    edges.filter(".ov").toggleClass("zin", cy.zoom() >= LBL.conZoom);
  }
  function clearOverlay() {
    cy.batch(function () {
      cy.remove(cy.edges(".il"));
      cy.nodes(".ilp").forEach(function (n) { n.removeClass("ilp"); n.removeData("ilLabel"); n.removeData("ilRank"); });
      cy.nodes(".ilsrc").removeClass("ilsrc");
    });
    measureSome(state.ilMarked || []);
    state.ilMarked = [];
  }
  function measureSome(ids) {
    if (!ids.length) return;
    var keep = {};
    ids.forEach(function (id) { keep[id] = 1; });
    var body = T("--font-body") || "sans-serif", disp = T("--font-display") || body;
    ids.forEach(function (id) {
      var n = cy.getElementById(id);
      if (!n.nonempty()) return;
      var kind = n.hasClass("hub") ? "hub" : "con", spec = LBL[kind];
      measureCtx.font = spec.font + (kind === "hub" ? disp : body);
      var words = String(n.data("ilLabel") || n.data("label")).split(/\s+/), lines = [], cur = "";
      words.forEach(function (w) {
        var t = cur ? cur + " " + w : w;
        if (cur && measureCtx.measureText(t).width > spec.max) { lines.push(cur); cur = w; } else cur = t;
      });
      if (cur) lines.push(cur);
      var wmax = 0;
      lines.forEach(function (l) { wmax = Math.max(wmax, measureCtx.measureText(l).width); });
      metrics[id] = { w: wmax + 6, h: lines.length * spec.px * 1.2 + 4, kind: kind };
    });
  }
  function connector(a, b, rank, ov) {
    var pa = a.position(), pb = b.position();
    var d = Math.hypot(pa.x - pb.x, pa.y - pb.y);
    return {
      group: "edges",
      data: { id: "il:" + a.id() + ":" + b.id(), source: a.id(), target: b.id(), rank: String(rank || ""), cpd: Math.min(0.16 * d, 260), k: 1, w: 1, fs: 11, tp: 3 },
      classes: ov ? "il ov" : "il",
      selectable: false
    };
  }
  // Draws the overlay for the current mode. Callers clear the old overlay first.
  function drawInterleave() {
    if (!ilOn) return;
    var add = [];
    if (state.mode === "focus" && state.sel) {
      var sel = cy.getElementById(state.sel), h = hubOf(state.sel);
      if (!h) return;
      var src = cy.getElementById(h);
      if (src.hasClass("off")) src = sel;
      var marked = [];
      partnersOf(h).forEach(function (p, i) {
        var n = cy.getElementById(p.hub);
        if (!n.nonempty() || n.hasClass("off")) return;
        n.addClass("ilp").removeClass("dim").data({ ilLabel: (i + 1) + " · " + n.data("label"), ilRank: i + 1 });
        marked.push(p.hub);
        if (!n.same(src)) add.push(connector(src, n, i + 1, false));
      });
      src.addClass("ilsrc").removeClass("dim");
      state.ilMarked = marked;
      measureSome(marked);
    } else if (state.mode === "overview") {
      var seen = {};
      Object.keys(isHub).forEach(function (h) {
        var p = partnersOf(h)[0];
        if (!p) return;
        var key = h < p.hub ? h + "|" + p.hub : p.hub + "|" + h;
        if (seen[key]) return;
        seen[key] = 1;
        var a = cy.getElementById(h), b = cy.getElementById(p.hub);
        if (a.hasClass("off") || b.hasClass("off")) return;
        add.push(connector(a, b, 1, true));
      });
    }
    if (!add.length) { if (state.mode === "focus") cullLabels(); return; }
    var added = cy.add(add);
    ilScale(added, cy.nodes(".ilp"));
    if (state.mode === "focus") cullLabels();
  }

  /* --- Panel section --- */
  function catChip(n) {
    return '<span class="catchip"><span class="dot ' + esc(n.section) + '"></span>' + esc(n.disc) + "</span>";
  }
  function bridgeList(bridges) {
    return '<ul class="bridges">' + bridges.map(function (b) {
      return "<li><strong>" + esc(title(b.s)) + '</strong> <span class="v">→ ' + esc(b.verb) + " →</span> <strong>" + esc(title(b.t)) + "</strong>" +
        (b.why ? '<span class="why">' + esc(b.why) + "</span>" : "") + "</li>";
    }).join("") + "</ul>";
  }
  function interleaveSection(id) {
    var h = hubOf(id);
    var list = partnersOf(h);
    if (!list.length) return "";
    var allSug = list.every(function (p) { return p.suggested; });
    var head = id === h
      ? '<h3 class="il-h">Interleave with <span class="n">' + list.length + "</span></h3>"
      : '<h3 class="il-h">Topics to mix with <b>' + esc(title(h)) + "</b></h3>";
    var rows = list.map(function (p, i) {
      var n = byId[p.hub], off = cy.getElementById(p.hub).hasClass("off");
      var how = p.bridges.length
        ? '<details class="il-how"><summary>How they connect (' + p.bridges.length + ")</summary>" + bridgeList(p.bridges) + "</details>"
        : "";
      return '<li class="il-row' + (off ? " off" : "") + '" data-il="' + esc(p.hub) + '"><span class="il-rank">' + (i + 1) + "</span><div>" +
        '<div class="il-head"><button type="button" class="il-name" data-go="' + esc(p.hub) + '">' + esc(n.title) + "</button>" + catChip(n) +
        (off ? '<span class="il-tag">hidden by filters</span>' : "") + "</div>" +
        '<p class="why">' + esc(p.why) + "</p>" +
        (p.suggested && !allSug ? '<p class="sug">suggested by link analysis</p>' : "") +
        '<div class="il-tools"><button type="button" class="linkbtn" data-pair="' + esc(p.hub) + '" data-from-hub="' + esc(h) + '" data-back="' + esc(id) + '">Show together</button>' +
        how + "</div></div></li>";
    }).join("");
    return head + (allSug ? '<p class="il-src">suggested by link analysis</p>' : "") + '<ol class="il-list">' + rows + "</ol>";
  }

  /* --- Show two hubs together --- */
  function membersOf(h) {
    var out = [];
    DATA.nodes.forEach(function (n) { if (hubOf(n.id) === h) out.push(n.id); });
    return out;
  }
  function showPair(h, p, back) {
    if (!isHub[h] || !isHub[p]) return;
    var info = partnersOf(h).filter(function (x) { return x.hub === p; })[0] ||
               partnersOf(p).filter(function (x) { return x.hub === h; })[0] || { why: "", bridges: [] };
    reveal(h); reveal(p);
    hideHint();
    clearOverlay();
    clearHighlights();
    state.sel = null;
    state.mode = "pair";
    state.pair = { h: h, p: p, back: back };
    var inA = {}, inB = {};
    membersOf(h).forEach(function (id) { inA[id] = 1; });
    membersOf(p).forEach(function (id) { inB[id] = 1; });
    var set = cy.collection(), edges = cy.collection();
    Object.keys(inA).concat(Object.keys(inB)).forEach(function (id) { set = set.union(cy.getElementById(id)); });
    set = set.not(".off");
    // Bridging links: every link that crosses between the two topics, plus the curated ones.
    realEdges.not(".off").forEach(function (e) {
      var s = e.data("source"), t = e.data("target");
      if ((inA[s] && inB[t]) || (inB[s] && inA[t])) edges = edges.union(e);
    });
    info.bridges.forEach(function (b) {
      var e = cy.getElementById("e" + b.ei);
      if (!e.hasClass("off")) { edges = edges.union(e); set = set.union(e.connectedNodes()); }
    });
    // Each topic's members carry its halo inside its raised territory; bridges are the only lines.
    state.emph = [h, p].filter(function (x) { return TERR[x]; }).map(function (x) {
      return { hub: x, ids: TERR[x], shape: TSHAPE[x], a: 0.1, ring: true };
    });
    highlight(set, edges, null);
    cy.batch(function () {
      set.filter(function (n) { return inA[n.id()] || inB[n.id()]; }).not(".hub").addClass("mem");
      cy.getElementById(h).addClass("sel");
      cy.getElementById(p).addClass("sel");
    });
    if (ilOn) {
      var c = cy.add(connector(cy.getElementById(h), cy.getElementById(p), "", false));
      ilScale(c, cy.collection());
    }
    applySizes();
    cullLabels();
    setEmpty(false);
    renderPair(h, p, info, edges, back);
    fitTo(cy.getElementById(h).union(cy.getElementById(p)).union(edges.connectedNodes()), 70, 1.2);
  }
  function renderPair(h, p, info, edges, back) {
    var listed = {};
    var rows = info.bridges.slice();
    rows.forEach(function (b) { listed[b.ei] = 1; });
    edges.forEach(function (e) {
      var i = Number(e.id().slice(1));
      if (listed[i]) return;
      rows.push({ ei: i, s: e.data("source"), t: e.data("target"), verb: e.data("verb"), why: e.data("why") });
    });
    panel.innerHTML =
      '<div class="panel-head"><div class="eyebrow">Interleave pair</div>' +
      '<button type="button" class="close" data-clear="1">Close</button></div>' +
      "<h2>" + esc(title(h)) + ' <span class="pair-h">with</span> ' + esc(title(p)) + "</h2>" +
      (info.why ? '<p class="summary">' + esc(info.why) + "</p>" : "") +
      (info.suggested ? '<p class="il-src" style="margin-top:6px">suggested by link analysis</p>' : "") +
      '<h3>Bridging links <span class="n">' + rows.length + "</span></h3>" +
      (rows.length ? bridgeList(rows) : '<p class="note">No direct links between these two topics with the current filters.</p>') +
      '<div class="row">' +
      (back && byId[back] ? '<button type="button" class="btn" data-go="' + esc(back) + '">Back to ' + esc(title(back)) + "</button>" : "") +
      '<button type="button" class="btn" data-go="' + esc(p) + '">Open ' + esc(title(p)) + "</button></div>";
    panel.scrollTop = 0;
  }

  /* ---------- Init ---------- */
  var list = $("nodelist");
  list.innerHTML = DATA.nodes
    .slice().sort(function (a, b) { return a.title.localeCompare(b.title); })
    .map(function (n) { return '<option value="' + esc(n.title) + '"></option>'; }).join("");
  syncChips();
  renderIntro();
  measureLabels();
  fitAll(false);

  var start = decodeURIComponent((location.hash || "").replace("#", ""));
  // An old #today link, or any unknown id, just opens the map.
  if (start && byId[start]) focusNode(start);
  else drawInterleave();
  window.__nexus = { cy: cy, state: state, ready: true,
    terr: { members: function (h) { return (TERR[h] || []).slice(); }, rootOf: function (id) { return rootOf[id]; }, draw: drawTerr },
    il: { hubOf: hubOf, partnersOf: partnersOf, on: function () { return ilOn; }, set: setIlOn } };
})();
</script>
